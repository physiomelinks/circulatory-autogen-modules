model: cell_disc_lumped
category: homogenisation
reviewed: false
description: 'Level 1: the same disc cell as one well-mixed volume; face to the bath at the derived effective distance R/4.'
sim_time: 1.0
pre_time: 0.0
dt: 0.01
solver_info:
  rtol: 1.0e-10
  atol: 1.0e-16
equivalence:
  status: not_applicable
  reason: a homogenisation example built from this library (tools/build_homogenisation_examples.py); there is no circulatory_autogen
    original
invariants:
- description: 'mass conservation (zero loss): over every output step the amount in the cells, A = sum V C, changes by the
    integral of f = supply + sum V M_reduced. That integral is the trapezoid to within 0.5 dt |f(t+dt) - f(t)| where f is
    monotone over the step; the check allows twice that, dt |f(t+dt) - f(t)|, plus 1e-6 of max |A|, so a transient faster
    than the output step (the cells start empty) is bounded rather than failed'
  expr: '(lambda A, f: np.all(np.abs(np.diff(A) - 0.5*np.diff(t)*(f[1:] + f[:-1])) <= np.diff(t)*np.abs(np.diff(f)) + 1e-6*np.max(np.abs(A))))(6.2831853071795875e-15*c0__C_P,
    e0__J + 6.2831853071795875e-15*c0__M_reduced)'
- description: 'second law: every face dissipates, J ln(C_up/C_down) >= 0 (using the connected volumes, so it also checks
    the couplings)'
  expr: np.all(e0__J*(np.log(np.maximum(bath__C_P, 1e-300)) - np.log(np.maximum(c0__C_P, 1e-300))) >= -1e-30)
notes:
- 'Built by tools/build_homogenisation_examples.py: re-run it after changing the geometry.'
- 'First law: ideal diffusion releases no heat and no thermal domain is modelled, so enthalpy is conserved exactly when mass
  is (the mass invariant).'
homogenisation:
  fine: homogenisation/cell_disc_fv
  level: 0->1
  derivation: d_eff = R/4 from the steady profile of uniform consumption in a disc
  upscaling:
    derived_m: 2.5e-06
    calibrated_m: 2.5024461746215955e-06
    relative_difference: 0.0009775133812679104
    used: derived
    value_m: 2.5e-06
