notes: ['Only the globals are in the parameters file; every other value comes from the supermodule versions'' default instances
    (SN_simple''s values). Must reproduce circulatory_autogen''s SN_simple (equivalence) and the library''s SN_simple (tests/test_modules.py
    supermodule_equivalence_test, 1e-9).']
expected_failures: {system_equivalence_test: 'Deliberate differences from circulatory_autogen''s SN_simple (fixed in this
    library on 2026-10-02): i_Na1_6''s Na flux enters dNai/dt; the varicosity''s E_Ca has valence 2 (RT/(2F)); epsilon_tau
    is 0.001 ms (was 0.1 ms); BK gating follows Khaliq 2003 (z^2, tau offsets from the midpoints). Reviewed parameter values:
    tau_z_BK 1 ms (Khaliq), Ca_mid_m_SK 0.63 uM (Hirschberg), g_M 0.00263 uS (Davis 2020). The first two fixes are circulatory_autogen
    PR #537. Since review 2026-10-05 the library''s soma sub-membrane Ca is a Khaliq 2003 membrane shell (V_shell = A_mem d_shell, d_shell 0.1 um; shell-bulk exchange tau_shell 1 ms, was c_SL = 0.02 of Vol and D_Ca = 6e-12 m3/s) and SK reads the shell Ca (was Ca_bulk); circulatory_autogen''s SN_soma has neither. Since review 2026-10-05 the library''s SN model is at room temperature (T 295.15 K, was 310.15 K; the Davis 2021 thesis recordings it is calibrated to were made at room temperature) with a per-channel Q10 (each gating tau divided by Q10^((T - T_ref)/10 K); T_ref = T by default, so the kinetics are unscaled), which shifts E_K, E_Na and E_Ca; circulatory_autogen''s SN_soma is at 310.15 K with no Q10. The decomposition is still checked exactly: neuron/sympathetic reproduces this library''s SN_simple (supermodule_equivalence_test).'}
