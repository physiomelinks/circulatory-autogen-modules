  reciprocal: [heart/L_trv, heart/L_puv, heart/L_miv, heart/L_aov, heart/B_trv, heart/B_puv, heart/B_miv, heart/B_aov]
  tol: 1.0e-06
  solver_info: {rtol: 1.0e-12, atol: 1.0e-14}
invariants:
- {description: total blood volume is conserved in the closed loop (relative drift < 1e-6), expr: np.ptp(sum_blood_volume__q_volume_sum_sum)
    <= 1e-6 * np.max(np.abs(sum_blood_volume__q_volume_sum_sum))}
notes: ['3compartment built with the heart supermodule version (heart Argus2026_v01): one "heart" entry in the module array
    whose per_submodule_inputs/outputs couple its submodules to the circulation; libcuflynx expands it into heart_clock, heart_ra
    ... heart_aov. Only the circulation parameters are in the parameters file; the heart''s come from the default instance of the supermodule version
    (modules/heart/versions/Argus2026_v01/instances/default/default_parameters.csv). Must reproduce circulatory_autogen''s 3compartment (equivalence) and
    the library''s 3compartment model (tests/test_modules.py supermodule_equivalence_test, 1e-9).']
