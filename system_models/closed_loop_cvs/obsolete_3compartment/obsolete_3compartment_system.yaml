notes:
- 'The one system model kept with a flat (monolithic) heart: circulatory_autogen''s 3compartment, heart vp_Ca with both vena cava ports,
  the inferior one closed by an explicit zero flow (the record zero_flow, an inlet_flow constant at v = 0, since the library''s zero_flow
  module has no port). Every other system model uses a heart supermodule version. It checks the flat heart against the supermodule:
  heart Argus2026_v01''s supermodule.equivalent entry requires closed_loop_cvs/3compartment (the heart supermodule) to reproduce it
  (tests/test_modules.py -k supermodule). Its own reference is circulatory_autogen''s 3compartment, built with libcuflynx''s bundled
  modules.'
