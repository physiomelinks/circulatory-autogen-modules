invariants:
- description: the total amount sum V_P C_P is conserved in the closed domain (relative 1e-9)
  expr: np.ptp(np.float64(4.000000000000001e-15)*t0__C_P + np.float64(4.000000000000001e-15)*t1__C_P + np.float64(4.000000000000001e-15)*t2__C_P
    + np.float64(4.000000000000001e-15)*t3__C_P + np.float64(4.000000000000001e-15)*t4__C_P + np.float64(4.000000000000001e-15)*t5__C_P
    + np.float64(4.000000000000001e-15)*t6__C_P + np.float64(4.000000000000001e-15)*t7__C_P) <= 1e-9*np.max(np.abs(np.float64(4.000000000000001e-15)*t0__C_P
    + np.float64(4.000000000000001e-15)*t1__C_P + np.float64(4.000000000000001e-15)*t2__C_P + np.float64(4.000000000000001e-15)*t3__C_P
    + np.float64(4.000000000000001e-15)*t4__C_P + np.float64(4.000000000000001e-15)*t5__C_P + np.float64(4.000000000000001e-15)*t6__C_P
    + np.float64(4.000000000000001e-15)*t7__C_P))
- description: 'maximum principle: no cell goes above the initial maximum or below the initial minimum'
  expr: np.max(np.stack([t0__C_P, t1__C_P, t2__C_P, t3__C_P, t4__C_P, t5__C_P, t6__C_P, t7__C_P])) <= np.max(np.stack([t0__C_P,
    t1__C_P, t2__C_P, t3__C_P, t4__C_P, t5__C_P, t6__C_P, t7__C_P])[:, 0]) + 1e-12 and np.min(np.stack([t0__C_P, t1__C_P,
    t2__C_P, t3__C_P, t4__C_P, t5__C_P, t6__C_P, t7__C_P])) >= np.min(np.stack([t0__C_P, t1__C_P, t2__C_P, t3__C_P, t4__C_P,
    t5__C_P, t6__C_P, t7__C_P])[:, 0]) - 1e-12
- description: every cell tends to the volume-weighted mean 0.0678511 mM (within 1e-6 mM at t_end)
  expr: np.max(np.abs(np.stack([t0__C_P, t1__C_P, t2__C_P, t3__C_P, t4__C_P, t5__C_P, t6__C_P, t7__C_P])[:, -1] - np.float64(0.067851125)))
    <= 1e-6
