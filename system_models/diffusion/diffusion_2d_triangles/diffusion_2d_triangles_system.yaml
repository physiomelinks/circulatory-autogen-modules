model: diffusion_2d_triangles
category: diffusion
reviewed: false
description: 'Finite-volume diffusion on a 2D triangle mesh (8 triangles, 20 um deep): non-square cells joined by faces of
  different areas and orientations.'
sim_time: 2.0
pre_time: 0.0
dt: 0.01
solver_info:
  rtol: 1.0e-10
  atol: 1.0e-16
equivalence:
  status: not_applicable
