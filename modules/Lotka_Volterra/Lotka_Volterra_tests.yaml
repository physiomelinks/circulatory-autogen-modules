module: Lotka_Volterra
reviewed: true
known_issues: []
defaults:
  time_label: time [years]
  sim_time: 20.0
  pre_time: 0.0
  dt: 0.01
  solver: CVODE_myokit
  bc_sweep:
    factors: [0.5, 0.75, 1.0, 1.5, 2.0]
    ranges:
      alpha: {min: 0.2, max: 10, points: 9, scale: log}
      gamma: {min: 0.2, max: 10, points: 9, scale: log}
      beta: {min: 0.01, max: 0.5, points: 9, scale: log}
      delta: {min: 0.01, max: 0.5, points: 9, scale: log}
      x_init: {min: 5, max: 60, points: 7}
      y_init: {min: 2, max: 30, points: 7}
  timestep:
    scheme: rk4
    dts: [0.004, 0.002, 0.001, 0.0005]
    min_order: 0.8
    tol: 0.0001
    cvode_tol: 0.001
  stability:
    supported:
    - {solver: CVODE_myokit, rtol: 1.0e-06, atol: 1.0e-08}
components:
- vessel_type: Lotka_Volterra
  BC_type: nn
  module_type: Lotka_Volterra
  outputs: [x, y]
  invariants:
  - {description: populations stay positive, expr: (x > 0) & (y > 0)}
  - {description: first integral H = δx − γ ln x + βy − α ln y is conserved (relative drift < 1e-4), expr: np.ptp(delta*x
      - gamma*np.log(x) + beta*y - alpha*np.log(y)) <= 1e-4 * np.max(np.abs(delta*x - gamma*np.log(x) + beta*y - alpha*np.log(y)))}
  validation:
    baseline:
      status: active
      source: Hudson's Bay Company lynx/hare pelts 1900-1920 (Hewitt 1921), via Carpenter (2018) Stan case study
      source_short: Hudson Bay lynx-hare (Carpenter 2018 fit)
      data: validation/hudson_bay_lynx_hare.csv
      time_column: Year
      time_offset: 1900
      variables: {x: Hare, y: Lynx}
      parameters: {alpha: 0.545, beta: 0.028, gamma: 0.803, delta: 0.024, x_init: 33.956, y_init: 5.933}
      parameter_ranges:
        alpha: [0.465, 0.63]
        beta: [0.022, 0.033]
        gamma: [0.692, 0.926]
        delta: [0.02, 0.029]
        x_init: [30.415, 37.63]
        y_init: [5.273, 6.614]
      sim_time: 20.0
      dt: 0.1
      metric: log_rmse
      threshold: 0.5
    calibrate:
      status: active
      source: Hudson's Bay Company lynx/hare pelts 1900-1920 (Hewitt 1921), via Carpenter (2018) Stan case study
      obs_data: validation/Lotka_Volterra__nn_calibration_obs_data.json
      params_for_id: validation/Lotka_Volterra__nn_params_for_id.csv
      validation_obs_data: validation/Lotka_Volterra__nn_validation_obs_data.json
      prediction_window: [15, 20]
      method: CMA-ES
      optimiser_options: {num_calls_to_function: 4000, cost_convergence: 1.0e-08, max_patience: 60, seed: 1}
      metric: log_rmse
      threshold: 0.5
