module: control_system
reviewed: true
known_issues: []
defaults:
  sim_time: 10.0
  pre_time: 0.0
  dt: 0.01
  solver: CVODE_myokit
  bc_sweep:
    factors: [0.5, 0.75, 1.0, 1.5, 2.0]
    ranges:
      P_a: {min: 6000, max: 20000, points: 6}
      dP_a_dt: {min: -100000, max: 100000, points: 5}
      P_target: {min: 8000, max: 16000, points: 5}
      K_p: {min: 0.01, max: 1, points: 5, scale: log}
      K_i: {min: 0.001, max: 0.1, points: 5, scale: log}
      K_d: {min: 0.002, max: 0.2, points: 5, scale: log}
      f_stim_min: {min: 0, max: 5, points: 3}
      e_int_init: {min: -10, max: 10, points: 5}
  timestep:
    scheme: rk4
    dts: [0.004, 0.002, 0.001, 0.0005]
    min_order: 0.8
    tol: 0.0001
    cvode_tol: 0.001
    t_end: 10.0
  stability:
    supported:
    - {solver: CVODE_myokit, rtol: 1.0e-06, atol: 1.0e-08}
components:
- vessel_type: pid_control
  BC_type: nn
  module_type: pid_control_type
  outputs: [e_int, f_stim, f_stim_raw, e_norm]
  invariants:
  - {description: integral term matches its exact solution e_int = e_int_init + (P_target − P_a)/P_scale · t, expr: 'np.max(np.abs(e_int
      - (e_int_init + (P_target - P_a)/P_scale*t))) <= 1e-6 * max(1.0, np.max(np.abs(e_int)))'}
  - {description: 'f_stim is either the block frequency or within [f_stim_min, f_stim_max]', expr: np.all((np.abs(f_stim -
      f_stim_HF) < 1e-9) | ((f_stim >= f_stim_min - 1e-9) & (f_stim <= f_stim_max + 1e-9)))}
  - {description: 'f_stim matches its exact solution: the saturated/blocked PID law with the exact integral term', expr: 'np.max(np.abs(f_stim
      - (np.where((K_p*(P_target - P_a)/P_scale + K_i*(e_int_init + (P_target - P_a)/P_scale*t) + K_d*(0 - dP_a_dt)/P_scale)
      < f_stim_min, f_stim_HF, np.where((K_p*(P_target - P_a)/P_scale + K_i*(e_int_init + (P_target - P_a)/P_scale*t) + K_d*(0
      - dP_a_dt)/P_scale) > f_stim_max, f_stim_max, K_p*(P_target - P_a)/P_scale + K_i*(e_int_init + (P_target - P_a)/P_scale*t)
      + K_d*(0 - dP_a_dt)/P_scale))))) <= 1e-6 * max(1.0, f_stim_HF)'}
  validation:
    baseline: {status: not_applicable, reason: controller with no physiological counterpart on its own; its behaviour is checked
        against the exact solution. Closed-loop validation belongs to a system model that uses it.}
    calibrate: {status: not_applicable, reason: controller with no physiological counterpart on its own; its behaviour is
        checked against the exact solution. Closed-loop validation belongs to a system model that uses it.}
  notes: PID controller from arterial pressure (and its derivative) to a nerve-stimulation frequency, saturating at f_stim_max
    and switching to a high-frequency block (f_stim_HF) when the demand falls below f_stim_min. Alone, with constant P_a,
    the integral term has the exact solution e_int = e_int_init + e_norm t.
  run_parameters: {P_a: 10000.0, dP_a_dt: -2000.0, e_int_init: 0.0}
bibliography:
  DeMers2023_StatPearls_MAP: {citation: 'DeMers D, Wachs D. Physiology, Mean Arterial Pressure. StatPearls, StatPearls Publishing
      (2023).', url: 'https://www.ncbi.nlm.nih.gov/books/NBK538226/'}
  Plachta2014_JNeuralEng: {citation: 'Plachta DTT et al. Blood pressure control with selective vagal nerve stimulation and
      minimal side effects. J Neural Eng 11:036011 (2014).', url: 'https://www.researchgate.net/publication/262150324_Blood_pressure_control_with_selective_vagal_nerve_stimulation_and_minimal_side_effects'}
  Gierthmuehlen2016_HypertensRes: {citation: 'Gierthmuehlen M et al. Effect of selective vagal nerve stimulation on blood
      pressure, heart rate and respiratory rate in rats under metoprolol medication. Hypertens Res 39:79–87 (2016).', url: 'https://www.nature.com/articles/hr2015122'}
  Kilgore2014_Neuromodulation: {citation: 'Kilgore KL, Bhadra N. Reversible nerve conduction block using kilohertz frequency
      alternating current. Neuromodulation 17:242–254 (2014). Reports conduction block with kilohertz-frequency AC over 1
      kHz–100 kHz.', url: 'https://onlinelibrary.wiley.com/doi/abs/10.1111/ner.12100'}
