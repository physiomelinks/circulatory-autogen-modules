    expr: np.allclose(R, 8*mu*l/(np.pi*r_0**4), rtol=1e-9) & np.allclose(C, 2*np.pi*r_0**3*l/(E*r_0*(a_vessel*np.exp(b_vessel*r_0)
      + c_vessel*np.exp(d_vessel*r_0))), rtol=1e-9)
  - description: 'exact solution with constant BCs: u(t) = u_ss + (u(0) - u_ss) e^(-t/RC), u_ss = u_out + R v_in_sum, u(0)
      = u_0 + u_ext (q_C(0) = 0)'
    expr: np.max(np.abs(u - ((u_out + R*v_in_sum) + ((u_0 + u_ext) - ((u_out + R*v_in_sum)))*np.exp(-t/(R*C))))) <= 1e-6*(np.max(np.abs(u))
      + 1.0) + 1e-4*abs(((u_out + R*v_in_sum)) - ((u_0 + u_ext)))
  - description: 'Poiseuille/Ohm law at the outlet: v = (u - u_out)/R'
    expr: np.max(np.abs(v*R - (u - u_out))) <= 1e-8*(np.max(np.abs(u)) + abs(u_out) + 1.0)
  - description: 'volume balance: q_C(t) = integral of (inflow - outflow) (trapezoid rule on the logged points)'
    expr: np.max(np.abs(q_C - np.concatenate([[0.0], np.cumsum(0.5*(((v_in_sum - v))[1:] + ((v_in_sum - v))[:-1])*np.diff(t))])))
      <= (1e-3 + ((t[1] - t[0])/(R*C))**2/6)*np.max(np.abs(q_C)) + 1e-8*np.min(C)*np.max(np.abs(u))
  - description: total volume q = q_0 + q_C with unstressed volume q_0 = pi r_0^2 l
    expr: np.allclose(q_0, np.pi*r_0**2*l, rtol=1e-9) & np.allclose(q, q_0 + q_C, rtol=1e-9, atol=1e-30)
  - description: u_C = q_C/C + u_ext and u = u_0 + u_C
    expr: np.allclose(u_C, q_C/C + u_ext, rtol=1e-8, atol=1e-9) & np.allclose(u, u_0 + u_C, rtol=1e-10, atol=1e-9)
  notes: 'Flow-in/pressure-out vein compartment: one Poiseuille resistance R = 8 mu l/(pi r_0^4) and one thin-wall compliance
    C = 2 pi r_0^3 l/(E h) (h from the Avolio wall-thickness fit), no inertance. u = u_0 + u_ext + q_C/C, q_C(0) = 0. Alone
