    expr: np.max(np.abs(q_C - q_C_d - (v_in_sum + v_out_sum)*R*C/4*(1 - np.exp(-4*t/(R*C))))) <= 1e-5*np.max(np.abs(q_C -
      q_C_d)) + 1e-8*np.min(C)*np.max(np.abs(u))
