module: microvasculature_network
reviewed: false
known_issues: []
defaults:
  sim_time: 1.0
  pre_time: 0.0
  dt: 0.005
  solver: CVODE_myokit
  solver_info: {rtol: 1.0e-08, atol: 1.0e-24}
  bc_sweep:
    factors: [0.5, 0.75, 1.0, 1.5, 2.0]
    ranges: {}
  timestep:
    scheme: rk4
    dts: [0.004, 0.002, 0.001, 0.0005]
    min_order: 0.8
    tol: 0.0001
    cvode_tol: 0.001
  stability:
    supported:
    - {solver: CVODE_myokit, rtol: 1.0e-08, atol: 1.0e-24}
components:
- vessel_type: artery_Minlet
  BC_type: pv_micro
  module_type: pv_Minlet_type_micro
  sim_time: 0.000125
  dt: 1.25e-06
  solver_info: {rtol: 1.0e-08, atol: 1.0e-24, MaximumStep: 7.813e-08}
  timestep:
    dts: [5.0e-06, 2.5e-06, 1.25e-06, 6.25e-07]
    t_end: 0.000125
  stability:
    supported:
    - {solver: CVODE_myokit, rtol: 1.0e-08, atol: 1.0e-24}
    max_step_start: 2.0e-05
    fixed_step:
      schemes: [euler, heun, rk4]
      dt_start: 2.0e-05
  outputs: [u, v, q_C, q_0, q, R, C, u_C, du_C_dt]
  invariants:
  - description: 'Poiseuille resistance and thin-wall compliance: R = 8 mu l/(pi r_0^4), C = 2 pi r_0^3 l/(E h), h = r_0(a
      e^(b r_0) + c e^(d r_0)) (Avolio wall-thickness fit)'
    expr: np.allclose(R, 8*mu*l/(np.pi*r_0**4), rtol=1e-9) & np.allclose(C, 2*np.pi*r_0**3*l/(E*r_0*(a_vessel*np.exp(b_vessel*r_0)
      + c_vessel*np.exp(d_vessel*r_0))), rtol=1e-9)
  - description: 'exact solution with constant BCs: u(t) = u_ss + (u(0) - u_ss) e^(-t/RC), u_ss = u_in - R v_out_sum, u(0)
      = u_0 + u_ext (q_C(0) = 0)'
    expr: np.max(np.abs(u - ((u_in - R*v_out_sum) + ((u_0 + u_ext) - ((u_in - R*v_out_sum)))*np.exp(-t/(R*C))))) <= 1e-6*(np.max(np.abs(u))
      + 1.0) + 1e-4*abs(((u_in - R*v_out_sum)) - ((u_0 + u_ext)))
  - description: 'Poiseuille/Ohm law at the inlet: v = (u_in - u)/R'
    expr: np.max(np.abs(v*R - (u_in - u))) <= 1e-8*(np.max(np.abs(u)) + abs(u_in) + 1.0)
  - description: 'volume balance: q_C(t) = integral of (inflow - outflow) (trapezoid rule on the logged points)'
    expr: np.max(np.abs(q_C - np.concatenate([[0.0], np.cumsum(0.5*(((v - v_out_sum))[1:] + ((v - v_out_sum))[:-1])*np.diff(t))])))
      <= (1e-3 + ((t[1] - t[0])/(R*C))**2/6)*np.max(np.abs(q_C)) + 1e-8*np.min(C)*np.max(np.abs(u))
  - description: total volume q = q_0 + q_C with unstressed volume q_0 = pi r_0^2 l
    expr: np.allclose(q_0, np.pi*r_0**2*l, rtol=1e-9) & np.allclose(q, q_0 + q_C, rtol=1e-9, atol=1e-30)
  - description: du_C_dt = (v - v_out_sum)/C and u_C = q_C/C + u_ext
    expr: np.allclose(du_C_dt*C, v - v_out_sum, rtol=1e-8, atol=1e-12*np.max(np.abs(v)) + 1e-30) & np.allclose(u_C, q_C/C
      + u_ext, rtol=1e-8, atol=1e-9)
  notes: 'Pressure-in/flow-out artery compartment: one Poiseuille resistance R = 8 mu l/(pi r_0^4) and one thin-wall compliance
    C = 2 pi r_0^3 l/(E h) (h from the Avolio wall-thickness fit), no inertance. u = u_0 + u_ext + q_C/C, q_C(0) = 0. Alone
    with constant BCs it is a linear first-order system with time constant RC (nominal 3.48e-05 s), so the exact solution
    is the invariant. Identical to pv_Nout_type_micro except for a stray initial_value on the input v_out_sum, which breaks
    generation (see expected_failures).'
  run_parameters: {v_out_sum: 1.031e-08}
  bc_sweep:
    ranges:
      u_in: {min: 10670.0, max: 13670.0, points: 5}
      v_out_sum: {min: 0.0, max: 6.184e-08, points: 5}
      u_ext: {min: -1000.0, max: 1000.0, points: 5}
      theta: {min: 0.0, max: 90.0, points: 3}
    rationale: BCs span the reference pressure u_0 up to u_0 + 3 dp (dp = test pressure drop of the vessel class) and flows
      0 to 3x the equilibrium flow dp/R; u_ext -1000..1000 Pa (tissue pressure); geometry, E, mu and the wall-thickness coefficients
      at 0.5-2x (the exact solution is re-evaluated at every point, so all invariants must hold across the whole region).
  expected_failures: {run_test: 'module defect: the input variable v_out_sum carries initial_value="0.0" in the CellML; libcellml/Myokit
      reject the connected set ("Multiple initial values defined in connected variable set"), so the model cannot be generated.
      Verified: removing the initial_value in a patched copy makes it generate and pass. See review.proposed_fixes.', verification_test_invariants: 'module
      defect: the input variable v_out_sum carries initial_value="0.0" in the CellML; libcellml/Myokit reject the connected
      set ("Multiple initial values defined in connected variable set"), so the model cannot be generated. Verified: removing
      the initial_value in a patched copy makes it generate and pass. See review.proposed_fixes.', verification_test_BC: 'module
      defect: the input variable v_out_sum carries initial_value="0.0" in the CellML; libcellml/Myokit reject the connected
      set ("Multiple initial values defined in connected variable set"), so the model cannot be generated. Verified: removing
      the initial_value in a patched copy makes it generate and pass. See review.proposed_fixes.', verification_test_timestep: 'module
      defect: the input variable v_out_sum carries initial_value="0.0" in the CellML; libcellml/Myokit reject the connected
      set ("Multiple initial values defined in connected variable set"), so the model cannot be generated. Verified: removing
      the initial_value in a patched copy makes it generate and pass. See review.proposed_fixes.', stability_test: 'module
      defect: the input variable v_out_sum carries initial_value="0.0" in the CellML; libcellml/Myokit reject the connected
      set ("Multiple initial values defined in connected variable set"), so the model cannot be generated. Verified: removing
      the initial_value in a patched copy makes it generate and pass. See review.proposed_fixes.'}
  reference_proposals:
    E: {reference: 'Watanabe2013; Sec. 3.3 quoting Olufsen1999: E h/r_0 = k1 e^(k2 r_0) + k3, k1 = 2.0e7 dyn/cm^2, k2 = -22.53
        cm^-1, k3 = 8.65e5 dyn/cm^2 -> E h/r_0 = 1.42 MPa at r_0 = 180 um; with h/r_0 = 0.388 (Watanabe2013 fit) E = 3.66
        MPa (derived)', sourced: 'yes', value: 3660000.0}
    l: {reference: unreferenced_placeholder; segment length 5 mm (order of magnitude; no verified source), sourced: 'no',
      value: 0.005}
    r_0: {reference: 'Watanabe2013; smallest arm arteries (perforators) lumen radius 0.018 cm = 180 um, used as the representative
        small artery feeding a microvascular network', sourced: 'yes', value: 0.00018}
    u_ext: {reference: definitional; no external (tissue) pressure acting on the vessel in the isolated test (0 Pa); in a
        network this is the surrounding tissue pressure, sourced: definitional, value: 0.0}
    u_0: {reference: unreferenced_placeholder; small-artery reference pressure 80 mmHg = 10.67 kPa (Zweifach1974 pressure
        distribution could not be read to verify), sourced: 'no', value: 10670.0}
    theta: {reference: 'definitional; vessel inclination angle [deg]: 0 = horizontal. Not used by any equation (the gravity
        term is commented out in the CellML)', sourced: definitional, value: 0.0}
    u_in: {reference: unreferenced_placeholder; isolated-test boundary value (upstream pressure = u_0 + 1000 Pa); in a network
        it is supplied by the neighbouring vessel, sourced: 'no', value: 11670.0}
    v_out_sum: {reference: unreferenced_placeholder; isolated-test boundary value (outflow = equilibrium flow 1000 Pa / R);
        in a network it is supplied by the neighbouring vessel, sourced: 'no', value: 2.061e-08}
    a_vessel: {reference: 'Watanabe2013; Eq. (3.1), p. 969: fit h/r = a e^(b r) + c e^(d r) to the Avolio1980 arterial radius/wall-thickness
        data, a = 0.2802. Fitted on arteries (r ~0.2-1.4 cm); used here down to capillaries = extrapolation (h/r -> a + c
        = 0.41 as r -> 0)', sourced: 'yes', value: 0.2802}
    b_vessel: {reference: 'Watanabe2013; Eq. (3.1): b = -5.053 cm^-1 = -505.3 m^-1 (r in cm, Fig. 2)', sourced: 'yes', value: -505.3}
    beta_g: {reference: definitional; gravity switch (0 = off). Not used by any equation (gravity term commented out), sourced: definitional,
      value: 0.0}
    c_vessel: {reference: 'Watanabe2013; Eq. (3.1): c = 0.1324', sourced: 'yes', value: 0.1324}
    d_vessel: {reference: 'Watanabe2013; Eq. (3.1): d = -0.1114 cm^-1 = -11.14 m^-1', sourced: 'yes', value: -11.14}
    g: {reference: definitional; gravitational acceleration 9.81 m/s^2. Not used by any equation (gravity term commented out),
      sourced: definitional, value: 9.81}
    mu: {reference: 'Watanabe2013; p. 976, mu = 0.04 P = 0.004 Pa s (whole-blood modelling value for large arteries). NOTE:
        for microvessels the apparent viscosity is lower in vitro (Pries1992 law via Secomb2013: rel. viscosity 1.27 at 8
        um, 1.78 at 30 um, x plasma 1.1-1.3 mPa s -> ~1.5-2.1 mPa s) and higher in vivo (Pries1994: 10 um vessels ~4x glass
        tube). One global value for all vessel classes', sourced: 'yes', value: 0.004}
    rho: {reference: 'Watanabe2013; p. 976, rho = 1.04 g/cm^3 = 1040 kg/m^3 (Trudnowski1974 measured 1050.6 kg/m^3 at 37 C).
        Not used by any equation (the gravity/inertia terms are commented out)', sourced: 'yes', value: 1040.0}
  validation:
    baseline: {status: pending, reason: 'no single-compartment data: an isolated 0D segment with constant BCs has no measured
        counterpart. Candidate for a network built from these components: Pries1990 rat-mesentery networks (segment diameters,
        lengths, measured velocities/pressures), or the Boas2008 arteriole-capillary-venule chain (60 -> 25 mmHg); not set
        up'}
    calibrate: {status: pending, reason: 'no single-compartment data: an isolated 0D segment with constant BCs has no measured
        counterpart. Candidate for a network built from these components: Pries1990 rat-mesentery networks (segment diameters,
        lengths, measured velocities/pressures), or the Boas2008 arteriole-capillary-venule chain (60 -> 25 mmHg); not set
        up'}
