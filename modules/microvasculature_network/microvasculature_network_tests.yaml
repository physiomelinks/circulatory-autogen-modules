- vessel_type: capillary
  BC_type: vp_micro
  module_type: vp_capillary_type_micro
  sim_time: 0.5
  dt: 0.005
  solver_info: {rtol: 1.0e-08, atol: 1.0e-24, MaximumStep: 0.0003125}
  timestep:
    dts: [0.02, 0.01, 0.005, 0.0025]
    t_end: 0.5
  stability:
    supported:
    - {solver: CVODE_myokit, rtol: 1.0e-08, atol: 1.0e-24}
    max_step_start: 0.08
    fixed_step:
      schemes: [euler, heun, rk4]
      dt_start: 0.08
  outputs: [u, v, q_C, q_us, q, R, C]
  invariants:
  - description: 'Poiseuille resistance and thin-wall compliance: R = 8 mu l/(pi r^4), C = 2 pi r^3 l/(E h), h = r(a e^(b
      r) + c e^(d r)) (Avolio wall-thickness fit)'
    expr: np.allclose(R, 8*mu*l/(np.pi*r**4), rtol=1e-9) & np.allclose(C, 2*np.pi*r**3*l/(E*r*(a_vessel*np.exp(b_vessel*r)
      + c_vessel*np.exp(d_vessel*r))), rtol=1e-9)
  - description: 'exact solution with constant BCs: u(t) = u_ss + (u(0) - u_ss) e^(-t/RC), u_ss = u_out + R v_in, u(0) = q_C_init/C
      + u_ext'
    expr: np.max(np.abs(u - ((u_out + R*v_in) + ((q_C_init/C + u_ext) - ((u_out + R*v_in)))*np.exp(-t/(R*C))))) <= 1e-6*(np.max(np.abs(u))
      + 1.0) + 1e-4*abs(((u_out + R*v_in)) - ((q_C_init/C + u_ext)))
  - description: 'Ohm law at the outlet: v = (u - u_out)/R'
    expr: np.max(np.abs(v*R - (u - u_out))) <= 1e-8*(np.max(np.abs(u)) + abs(u_out) + 1.0)
  - description: 'volume balance: q_C(t) - q_C(0) = integral of (v_in - v)'
    expr: np.max(np.abs(q_C - q_C[0] - np.concatenate([[0.0], np.cumsum(0.5*((v_in - v)[1:] + (v_in - v)[:-1])*np.diff(t))])))
      <= (1e-3 + ((t[1] - t[0])/(R*C))**2/6)*np.max(np.abs(q_C - q_C[0])) + 1e-8*np.min(C)*np.max(np.abs(u))
  - description: total volume q = q_us + q_C with q_us = pi r^2 l
    expr: np.allclose(q_us, np.pi*r**2*l, rtol=1e-9) & np.allclose(q, q_us + q_C, rtol=1e-9, atol=1e-30)
  notes: 'Flow-in/pressure-out capillary compartment (radius r, no u_0): u = q_C/C + u_ext, q_C(0) = q_C_init, Poiseuille
    R and thin-wall C, no inertance. Linear first-order, time constant RC (nominal 0.141 s).'
  run_parameters: {v_in: 7.54e-14}
  bc_sweep:
    ranges:
      u_out: {min: 0.0, max: 2590.0, points: 5}
      v_in: {min: 0.0, max: 4.524e-13, points: 5}
      q_C_init: {min: 0.0, max: 3.674e-14, points: 3}
      u_ext: {min: -1000.0, max: 1000.0, points: 5}
    rationale: BCs span the reference pressure u_0 up to u_0 + 3 dp (dp = test pressure drop of the vessel class) and flows
      0 to 3x the equilibrium flow dp/R; u_ext -1000..1000 Pa (tissue pressure); geometry, E, mu and the wall-thickness coefficients
      at 0.5-2x (the exact solution is re-evaluated at every point, so all invariants must hold across the whole region).
  reference_proposals:
    E: {reference: 'Salipante2022; capillary-scale vessel-on-chip Young modulus 3.0-10.0 kPa, 4.3 kPa for one vessel (in vitro,
        not tissue)', sourced: 'yes', value: 4300.0}
    l: {reference: 'Boas2008; Table 1, capillary length 250 um (from Vovenko 1999, as cited there)', sourced: 'yes', value: 0.00025}
    r: {reference: 'Boas2008; Table 1, capillary diameter 8 um -> r = 4 um (Zweifach1977: true capillaries ~7-8 um)', sourced: 'yes',
      value: 4.0e-06}
    u_ext: {reference: definitional; no external (tissue) pressure acting on the vessel in the isolated test (0 Pa); in a
        network this is the surrounding tissue pressure, sourced: definitional, value: 0.0}
    q_C_init: {reference: definitional; test starts from zero stressed volume (u(0) = u_ext), sourced: definitional, value: 0.0}
    u_out: {reference: unreferenced_placeholder; isolated-test boundary value (u_0 - 1500 Pa); in a network it is supplied
        by the neighbouring vessel, sourced: 'no', value: 1090.0}
    v_in: {reference: unreferenced_placeholder; isolated-test boundary value (equilibrium flow 1500 Pa / R); in a network
        it is supplied by the neighbouring vessel, sourced: 'no', value: 1.508e-13}
    a_vessel: {reference: 'Watanabe2013; Eq. (3.1), p. 969: fit h/r = a e^(b r) + c e^(d r) to the Avolio1980 arterial radius/wall-thickness
        data, a = 0.2802. Fitted on arteries (r ~0.2-1.4 cm); used here down to capillaries = extrapolation (h/r -> a + c
        = 0.41 as r -> 0)', sourced: 'yes', value: 0.2802}
    b_vessel: {reference: 'Watanabe2013; Eq. (3.1): b = -5.053 cm^-1 = -505.3 m^-1 (r in cm, Fig. 2)', sourced: 'yes', value: -505.3}
    c_vessel: {reference: 'Watanabe2013; Eq. (3.1): c = 0.1324', sourced: 'yes', value: 0.1324}
    d_vessel: {reference: 'Watanabe2013; Eq. (3.1): d = -0.1114 cm^-1 = -11.14 m^-1', sourced: 'yes', value: -11.14}
    mu: {reference: 'Watanabe2013; p. 976, mu = 0.04 P = 0.004 Pa s (whole-blood modelling value for large arteries). NOTE:
        for microvessels the apparent viscosity is lower in vitro (Pries1992 law via Secomb2013: rel. viscosity 1.27 at 8
        um, 1.78 at 30 um, x plasma 1.1-1.3 mPa s -> ~1.5-2.1 mPa s) and higher in vivo (Pries1994: 10 um vessels ~4x glass
        tube). One global value for all vessel classes', sourced: 'yes', value: 0.004}
    rho: {reference: 'Watanabe2013; p. 976, rho = 1.04 g/cm^3 = 1040 kg/m^3 (Trudnowski1974 measured 1050.6 kg/m^3 at 37 C).
        Not used by any equation (the gravity/inertia terms are commented out)', sourced: 'yes', value: 1040.0}
  validation:
    baseline: {status: pending, reason: 'candidate: Williams1988 human nailfold capillary pressures (arteriolar limb 37.7,
        apex 19.4, venular limb 14.6 mmHg, steady mean values): a pp/vp capillary between fixed arteriolar- and venular-limb
        pressures should give the apex pressure; not set up because a single steady value only checks (u_in + u_out)/2 and
        needs the owner to agree it is a meaningful baseline'}
    calibrate: {status: pending, reason: 'candidate: Williams1988 human nailfold capillary pressures (arteriolar limb 37.7,
        apex 19.4, venular limb 14.6 mmHg, steady mean values): a pp/vp capillary between fixed arteriolar- and venular-limb
        pressures should give the apex pressure; not set up because a single steady value only checks (u_in + u_out)/2 and
        needs the owner to agree it is a meaningful baseline'}
