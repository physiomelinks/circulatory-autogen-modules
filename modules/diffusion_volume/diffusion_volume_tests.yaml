module: diffusion_volume
reviewed: false
known_issues: []
defaults:
  sim_time: 5.0
  pre_time: 0.0
  dt: 0.001
  solver: CVODE_myokit
  solver_info:
    rtol: 1.0e-10
    atol: 1.0e-14
    MaximumStep: 0.01
  bc_sweep:
    factors:
    - 0.5
    - 0.75
    - 1.0
    - 1.5
    - 2.0
    ranges:
      C_P_init:
        min: 0.0
        max: 0.2
        points: 5
      C_N:
        min: 0.0
        max: 0.2
        points: 5
      C_S:
        min: 0.0
        max: 0.2
        points: 5
      C_E:
        min: 0.0
        max: 0.2
        points: 5
      C_W:
        min: 0.0
        max: 0.2
        points: 5
      flux_c:
        min: 0.0
        max: 2.0e-15
        points: 5
      no_flux_flag_N:
        min: 0
        max: 1
        points: 2
      no_flux_flag_S:
        min: 0
        max: 1
        points: 2
      no_flux_flag_E:
        min: 0
        max: 1
        points: 2
      no_flux_flag_W:
        min: 0
        max: 1
        points: 2
      x_P:
        min: 1.0e-05
        max: 5.0e-05
        points: 4
        scale: log
      y_P:
        min: 1.0e-05
        max: 5.0e-05
        points: 4
        scale: log
      z_P:
        min: 1.0e-05
        max: 5.0e-05
        points: 4
        scale: log
      y_N:
        min: 1.0e-05
        max: 5.0e-05
        points: 4
        scale: log
      y_S:
        min: 1.0e-05
        max: 5.0e-05
        points: 4
        scale: log
      x_E:
        min: 1.0e-05
        max: 5.0e-05
        points: 4
        scale: log
      x_W:
        min: 1.0e-05
        max: 5.0e-05
        points: 4
        scale: log
      sigma_diff:
        min: 5.0e-10
        max: 5.0e-09
        points: 5
        scale: log
      M:
        min: -0.2
        max: 0.0
        points: 5
      k_reduce:
        min: 5
        max: 500
        points: 5
        scale: log
    rationale: Tissue O2 as the solute. Concentrations 0-0.2 mM cover PO2 0 to about 150 mmHg at 1.27 uM/mmHg (anoxic to arterial). flux_c 0 to
      about 4x the maximal consumption of the nominal 20 um cell. Cell and neighbour sizes 10-50 um span finite-volume cells from one cell to
      intercapillary spacing. sigma_diff 5e-10 to 5e-9 m2/s brackets the tissue O2 diffusivity (about 2-3e-9, below water). M from -0.2 mM/s (about
      4x the cortical maximum, heavy exercise) to 0, which also checks the exact linear solution. k_reduce 5-500 per mM puts the half-saturation
      between 0.0014 and 0.14 mM (about 1-110 mmHg PO2), around the 0.0133 mM (10.5 mmHg) Michaelis constant.
  timestep:
    scheme: rk4
    dts:
    - 0.004
    - 0.002
    - 0.001
    - 0.0005
    t_end: 0.5
    min_order: 0.8
    tol: 0.0001
    cvode_tol: 0.001
  stability:
    supported:
    - solver: CVODE_myokit
      rtol: 1.0e-06
      atol: 1.0e-08
components:
- vessel_type: tissue_diffusion
  BC_type: nn
  module_type: diffusion_volume_one_species
  outputs:
  - C_P
  - D_N
  - D_S
  - D_E
  - D_W
  - V_P
  - M_reduced
  notes: One finite-volume tissue cell (size x_P by y_P by z_P) for a single solute (intended for dissolved O2; its capillary_to_flux_port matches
    the gas_exchange capillary ports ub_O2_t and flux_O2_c). dC_P/dt = [sum_k D_k (C_k - C_P) + flux_c]/V_P + M_reduced, where D_k = no_flux_flag_k
    sigma_diff (face area)/(centre-to-centre distance) and M_reduced = M (1 - exp(-k_reduce C_P)). M enters with a plus sign, so consumption needs
    M < 0 (the same convention as M_O2 = -1.8e-7 in gas_exchange tissue_GE_simple). no_flux_flag_k = 1 means the face is open; 0 closes it. With
    constant neighbours and M = 0 the equation is linear with the exact solution C_P = C_inf + (C_P_init - C_inf) exp(-t sum_k D_k / V_P), where
    C_inf = (sum_k D_k C_k + flux_c)/sum_k D_k. The time constant at the nominal point is about 0.04 s.
  run_parameters:
    C_P_init: 0.02
    C_N: 0.08
  invariants:
  - description: face conductances match their definition D_N = flag_N sigma_diff x_P z_P/((y_P + y_N)/2) etc. and V_P = x_P y_P z_P (exact)
    expr: np.allclose(D_N, no_flux_flag_N*sigma_diff*x_P*z_P/((y_P + y_N)/2), rtol=1e-9, atol=0) and np.allclose(D_S, no_flux_flag_S*sigma_diff*x_P*z_P/((y_P
      + y_S)/2), rtol=1e-9, atol=0) and np.allclose(D_E, no_flux_flag_E*sigma_diff*y_P*z_P/((x_P + x_E)/2), rtol=1e-9, atol=0) and np.allclose(D_W,
      no_flux_flag_W*sigma_diff*y_P*z_P/((x_P + x_W)/2), rtol=1e-9, atol=0) and np.allclose(V_P, x_P*y_P*z_P, rtol=1e-9)
  - description: 'mass balance: C_P(t_end) - C_P(0) = integral of [sum_k D_k (C_k - C_P) + flux_c]/V_P + M_reduced dt (trapezoid; 1e-3 of the
      total change plus 1e-8 of |C_P|)'
    expr: abs((C_P[-1] - C_P[0]) - np.trapz((D_N*(C_N - C_P) + D_S*(C_S - C_P) + D_E*(C_E - C_P) + D_W*(C_W - C_P) + flux_c)/V_P + M*(1 - np.exp(-k_reduce*C_P)),
      t)) <= 1e-3*np.ptp(C_P) + 1e-8*np.max(np.abs(C_P)) + 1e-15
  - description: 'steady state reached by t_end: net flux + consumption balance (dC_P/dt at t_end below 1e-6 of the largest flux term per volume)
      (run point only: in joint corners with almost-closed faces and low sigma_diff the time constant V_P/sum D_k exceeds seconds, so t_end is
      not a steady state)'
    expr: abs((D_N[-1]*(C_N - C_P[-1]) + D_S[-1]*(C_S - C_P[-1]) + D_E[-1]*(C_E - C_P[-1]) + D_W[-1]*(C_W - C_P[-1]) + flux_c)/V_P[-1] + M*(1
      - np.exp(-k_reduce*C_P[-1]))) <= 1e-6*max(abs(M), (D_N[-1] + D_S[-1] + D_E[-1] + D_W[-1])*max(C_N, C_S, C_E, C_W, np.max(C_P))/V_P[-1] +
      abs(flux_c)/V_P[-1], 1e-12)
    applies: run
  - description: with consumption only (M <= 0) and non-negative neighbours and flux, C_P stays in [0, max(C_P_init, C_inf)] where C_inf = (sum
      D_k C_k + flux_c)/sum D_k is the no-consumption steady state
    expr: (M > 0) or (np.all(C_P >= -1e-8*np.max(np.abs(C_P)) - 1e-15) and np.all(C_P <= max(C_P_init, (D_N[0]*C_N + D_S[0]*C_S + D_E[0]*C_E +
      D_W[0]*C_W + flux_c)/(D_N[0] + D_S[0] + D_E[0] + D_W[0])) + 1e-8*np.max(np.abs(C_P)) + 1e-15))
  - description: 'exact solution when M = 0: C_P = C_inf + (C_P_init - C_inf) exp(-t sum D_k/V_P) (relative 1e-5; checked on the sweep points
      with M = 0)'
    expr: (M != 0) or (np.max(np.abs(C_P - ((D_N[0]*C_N + D_S[0]*C_S + D_E[0]*C_E + D_W[0]*C_W + flux_c)/(D_N[0] + D_S[0] + D_E[0] + D_W[0]) +
      (C_P_init - (D_N[0]*C_N + D_S[0]*C_S + D_E[0]*C_E + D_W[0]*C_W + flux_c)/(D_N[0] + D_S[0] + D_E[0] + D_W[0]))*np.exp(-t*(D_N[0] + D_S[0]
      + D_E[0] + D_W[0])/V_P[0])))) <= 1e-5*max(np.max(np.abs(C_P)), 1e-9))
  reference_proposals:
    C_P_init:
      reference: unreferenced_placeholder; 0.0597 mM = mean cortical tissue PO2 47 mmHg (CelayaAlcala2021, reference conditions) x O2 solubility
        1.27 uM/mmHg (Fang2008, Bunsen coefficient 1.27e-15 umol um^-3 mmHg^-1 = 1.27e-3 mol m^-3 mmHg^-1); illustrative starting value
      sourced: false
      value: 0.0597
    C_N:
      reference: unreferenced_placeholder; neighbour at the same mean tissue O2 as C_P_init (47 mmHg x 1.27 uM/mmHg, CelayaAlcala2021 / Fang2008);
        set by the neighbouring cell in a network
      sourced: false
      value: 0.0597
    C_S:
      reference: unreferenced_placeholder; as C_N
      sourced: false
      value: 0.0597
    C_E:
      reference: unreferenced_placeholder; as C_N
      sourced: false
      value: 0.0597
    C_W:
      reference: unreferenced_placeholder; as C_N
      sourced: false
      value: 0.0597
    flux_c:
      reference: unreferenced_placeholder; 4.46e-16 mol/s = |M| x V_P (0.0558 mM/s x 8e-15 m3), i.e. capillary supply equal to the maximal consumption
        of the nominal 20 um cell; set by the capillary module in a network
      sourced: false
      value: 4.46e-16
    no_flux_flag_N:
      reference: definitional; 1 = face open to diffusion, 0 = no-flux boundary
      sourced: definitional
      value: 1
    no_flux_flag_S:
      reference: definitional; 1 = face open to diffusion, 0 = no-flux boundary
      sourced: definitional
      value: 1
    no_flux_flag_E:
      reference: definitional; 1 = face open to diffusion, 0 = no-flux boundary
      sourced: definitional
      value: 1
    no_flux_flag_W:
      reference: definitional; 1 = face open to diffusion, 0 = no-flux boundary
      sourced: definitional
      value: 1
    x_P:
      reference: unreferenced_placeholder; 20 um finite-volume cell edge (order of the intercapillary half-spacing); a discretisation choice
      sourced: false
      value: 2.0e-05
    y_P:
      reference: unreferenced_placeholder; 20 um cell edge, as x_P
      sourced: false
      value: 2.0e-05
    z_P:
      reference: unreferenced_placeholder; 20 um cell depth, as x_P
      sourced: false
      value: 2.0e-05
    y_N:
      reference: unreferenced_placeholder; neighbour cell size 20 um (uniform grid)
      sourced: false
      value: 2.0e-05
    y_S:
      reference: unreferenced_placeholder; neighbour cell size 20 um (uniform grid)
      sourced: false
      value: 2.0e-05
    x_E:
      reference: unreferenced_placeholder; neighbour cell size 20 um (uniform grid)
      sourced: false
      value: 2.0e-05
    x_W:
      reference: unreferenced_placeholder; neighbour cell size 20 um (uniform grid)
      sourced: false
      value: 2.0e-05
    sigma_diff:
      reference: unreferenced_placeholder; 2.4e-9 m2/s tissue O2 diffusivity. Consistent with CelayaAlcala2021 Table 1 D*alpha = 9.375e-10 cm3
        O2 cm^-1 s^-1 mmHg^-1 if alpha = 3.89e-5 cm3 O2 cm^-3 mmHg^-1 (giving D = 2.41e-5 cm2/s); that alpha value was not verified. Below O2
        in water at 37 C, 2.6e-9 m2/s from the Han & Bartels (1996) correlation quoted in SteynRoss2023
      sourced: false
      value: 2.4e-09
    M:
      reference: CelayaAlcala2021; Table 1 maximal O2 demand M0 = 7.5 cm3 O2 per 100 cm3 per min (rat cortex) = 1.25e-3 cm3 O2 cm^-3 s^-1 x 4.4615e-5
        mol/cm3 O2 (STP, 22.414 L/mol) = 5.58e-2 mol m^-3 s^-1 = 0.0558 mM/s, negative because M enters dC_P/dt with a plus sign (consumption)
      sourced: true
      value: -0.0558
    k_reduce:
      reference: unreferenced_placeholder; 52 per mM puts the half-saturation of M(1 - exp(-k C)) at the Michaelis constant P0 = 10.5 mmHg (CelayaAlcala2021)
        x 1.27 uM/mmHg (Fang2008) = 0.0133 mM, k = ln 2/0.0133. Derived by matching a different functional form (the source uses Michaelis-Menten
        M0 P/(P + P0))
      sourced: false
      value: 52.0
  validation:
    baseline:
      status: not_applicable
      reason: a single finite-volume cell has no measurable counterpart on its own; verified against the exact linear solution, mass balance and
        the steady state. Tissue PO2 data (e.g. CelayaAlcala2021 cortex) apply to an assembled grid of cells with capillaries.
    calibrate:
      status: not_applicable
      reason: 'as baseline: calibration against tissue PO2 maps belongs to an assembled diffusion grid, not one cell'
review:
  comment: M enters dC_P/dt with a plus sign (M_reduced = M(1 - exp(-k_reduce C_P))), so consumption needs M < 0. Please confirm this convention
    (gas_exchange uses M_O2 < 0 the same way); with M > 0 the term is a production term that grows with C. The consumption law 1 - exp(-k C) is
    not the usual Michaelis-Menten form, so k_reduce has no direct literature value (proposed 52 per mM from P0 = 10.5 mmHg). x_P, y_P, z_P are
    cell dimensions, not positions, and no_flux_flag = 1 means the face is open, which inverts what the name suggests. All values except M are
    placeholders.
  summary: 'Single finite-volume tissue cell for one solute (intended for dissolved O2; its capillary_to_flux_port matches gas_exchange GE_capillary
    ub_O2_t/flux_O2_c). I proposed O2 values: M from Celaya-Alcala et al. (2021) cortical M0 (sourced); sigma_diff, concentrations, geometry,
    flux_c and k_reduce as reasoned placeholders. Invariants: face conductances and V_P match their definitions exactly, discrete mass balance,
    steady state at t_end, bounds 0 <= C_P <= max(C_P_init, C_inf) under consumption, and the exact exponential solution when M = 0 (checked at
    the M = 0 sweep point; a 0.1% error in the time constant would be detected). All V&V tests pass (81-run sweep over 20 parameters, RK4 order
    4.06, stability 9/9) with CVODE rtol 1e-10 set in the spec so the mass balance can be checked tightly. Validation is not_applicable for a
    single cell.'
  questions:
  - 'Sign convention for M: confirm consumption is M < 0 (proposed M = -0.0558 mM/s = Celaya-Alcala 2021 M0 of 7.5 cm3 O2/100 cm3/min, converted
    at 22.414 L/mol). If M is meant to be a positive consumption rate, the CellML needs "- M_reduced".'
  - 'sigma_diff = 2.4e-9 m2/s (placeholder): Celaya-Alcala 2021 gives only D*alpha = 9.375e-10 cm3 O2/(cm s mmHg), which gives D = 2.41e-5 cm2/s
    only if alpha = 3.89e-5 (not verified). Water at 37 C is 2.6e-9 m2/s. Do you have a preferred tissue D source?'
  - 'k_reduce = 52 per mM: derived by matching the half-saturation of 1 - exp(-k C) to Michaelis P0 = 10.5 mmHg x 1.27 uM/mmHg (Fang 2008). Keep
    this form, or switch the CellML to Michaelis-Menten M C/(C + C50) to match the literature?'
  - Geometry (20 um cubes), neighbour concentrations (0.0597 mM = 47 mmHg) and flux_c (= maximal consumption of the cell) are illustrative. Are
    these the grid/operating point you intend?
  - 'Validation: agree it is not_applicable for one cell? A grid of these cells plus GE_capillary could later be compared with cortical PO2 distributions
    (e.g. Celaya-Alcala 2021).'
  proposed_fixes: []
  findings:
  - Time constant V_P/sum D_k is about 0.04 s at the nominal point, and the steady state is reached well within 5 s across the whole sweep.
  - 'Exact solution check at M = 0: max relative error 6e-10 with rtol 1e-10. With the default rtol 1e-6 CVODE errors (about 6e-8 mM) are comparable
    to the small changes near the nominal equilibrium, which is why the spec tightens the solver tolerances.'
  - 'Concentration units: the CellML uses millimolar, the gas_exchange capillary uses mol_per_m3 (numerically identical); the unit conversion
    is consistent.'
  - Joint risk (512 samples) first gave P(fail) = 0.125, all from the steady-state-at-t_end invariant in corners with nearly closed faces (fractional
    flags) and low sigma_diff, where V_P/sum D_k is several seconds. That is a test-horizon issue, not a model defect, so that invariant is now
    applied at the run point only; mass balance, bounds and the exact M = 0 solution hold in every sample.
