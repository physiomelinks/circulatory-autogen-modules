module: diffusion_volume
reviewed: true
known_issues: []
defaults:
  sim_time: 5.0
  pre_time: 0.0
  dt: 0.001
  solver: CVODE_myokit
  solver_info: {rtol: 1.0e-10, atol: 1.0e-14, MaximumStep: 0.01}
  bc_sweep:
    factors: [0.5, 0.75, 1.0, 1.5, 2.0]
    ranges:
      C_P_init: {min: 0.0, max: 0.2, points: 5}
      flux_c: {min: 0.0, max: 2.0e-15, points: 5}
      sigma_diff: {min: 5.0e-10, max: 5.0e-09, points: 5, scale: log}
      M: {min: -0.2, max: 0.0, points: 5}
      A_f: {min: 1.0e-10, max: 2.5e-09, points: 4, scale: log}
      open_flag: {min: 0, max: 1, points: 2}
      V_P: {min: 4.0e-15, max: 1.25e-13, points: 4, scale: log}
      d_up: {min: 5.0e-06, max: 2.5e-05, points: 4, scale: log}
      d_down: {min: 5.0e-06, max: 2.5e-05, points: 4, scale: log}
      C50: {min: 0.0014, max: 0.14, points: 5, scale: log}
    rationale: 'Tissue O2 as the solute. Concentrations 0-0.2 mM cover PO2 0 to about 150 mmHg at 1.27 uM/mmHg (anoxic to
      arterial). flux_c 0 to about 4x the maximal consumption of the nominal 20 um cell. Cell and neighbour sizes 10-50 um
      span finite-volume cells from one cell to intercapillary spacing. sigma_diff 5e-10 to 5e-9 m2/s brackets the tissue
      O2 diffusivity (about 2-3e-9, below water). M from -0.2 mM/s (about 4x the cortical maximum, heavy exercise) to 0, which
      also checks the exact linear solution. C50 0.0014-0.14 mM (about 1-110 mmHg PO2) brackets the 0.0133 mM (10.5 mmHg)
      Michaelis constant. V_P 4e-15 to 1.25e-13 m^3 (about 16-50 um cubes). V_P is swept alone, with the harness faces fixed
      at 20 um: below about 4e-15 the time constant V_P/sum D (5 ms at 1e-15) is too short for the trapezoidal mass-balance
      check at the 1 ms output interval.'
  timestep:
    scheme: rk4
    dts: [0.004, 0.002, 0.001, 0.0005]
    t_end: 0.5
    min_order: 0.8
    tol: 0.0001
    cvode_tol: 0.001
  stability:
    supported:
    - {solver: CVODE_myokit, rtol: 1.0e-06, atol: 1.0e-08}
components:
- vessel_type: tissue_diffusion_volume
  BC_type: nn
  module_type: diffusion_volume
  outputs: [C_P, V_P, M_reduced, fN/J_down, fW/J_down, fS/J_up, fE/J_up, fN/D, fW/D, fS/D, fE/D, fN/C_up, fW/C_up, fS/C_down,
    fE/C_down]
  notes: 'One finite-volume cell of volume V_P, any shape of one solute (intended for dissolved O2; its capillary_to_flux_port
    matches the gas_exchange capillary ports ub_O2_t and flux_O2_c). dC_P/dt = (J_in + J_out + flux_c)/V_P + M_reduced, M_reduced
    = M C_P/(C_P + C50) (Michaelis-Menten; 1 - exp(-k C) before the 2026-09-29 review). J_in and J_out are the sums of the
    fluxes of every diffusion face connected to the entrance and exit diffusion_face_ports (list-form multi_port [True, sum]:
    C_P is shared with each face, the faces'' fluxes are summed), so a grid of any shape needs no ordered ports; with no face
    on a port its sum is 0. Split on 2026-09-29 from the former tissue_diffusion cell, which had its four N/S/E/W faces built
    in and could only be wired as a north-south chain (libcuflynx paired east-west neighbours with the NS ports). Checked
    identical to it (max difference 0.0) for a single cell and a north-south chain, and a 3x3 non-uniform grid matches a direct
    numpy finite-volume solve to 8e-11. Tested here as the old cell was: with four boundary faces (tissue_diffusion_face with
    the outer side unconnected, i.e. a fixed concentration). M enters with a plus sign, so consumption needs M < 0.'
  run_parameters: {C_P_init: 0.02}
  harness:
    vessel_array:
    - [mod, nn, tissue_diffusion_volume, fN fW, fS fE]
    - [fN, nn, tissue_diffusion_face, '', mod]
    - [fW, nn, tissue_diffusion_face, '', mod]
    - [fS, nn, tissue_diffusion_face, mod, '']
    - [fE, nn, tissue_diffusion_face, mod, '']
    parameters:
    - [A_f_fN, m2, 4.0e-10, 'harness: 20 um x 20 um face (x_P z_P of the uniform grid)']
    - [d_up_fN, metre, 1.0e-05, 'harness: centre-to-face distance, half a 20 um cell']
    - [d_down_fN, metre, 1.0e-05, 'harness: centre-to-face distance, half a 20 um cell']
    - [open_flag_fN, dimensionless, 1, 'harness: open face']
    - [C_up_fN, millimolar, 0.08, 'harness: fixed boundary concentration (the old C_N = 0.08 run point; others 47 mmHg x 1.27
        uM/mmHg)']
    - [A_f_fW, m2, 4.0e-10, 'harness: 20 um x 20 um face (x_P z_P of the uniform grid)']
    - [d_up_fW, metre, 1.0e-05, 'harness: centre-to-face distance, half a 20 um cell']
    - [d_down_fW, metre, 1.0e-05, 'harness: centre-to-face distance, half a 20 um cell']
    - [open_flag_fW, dimensionless, 1, 'harness: open face']
    - [C_up_fW, millimolar, 0.0597, 'harness: fixed boundary concentration (the old C_N = 0.08 run point; others 47 mmHg x
        1.27 uM/mmHg)']
    - [A_f_fS, m2, 4.0e-10, 'harness: 20 um x 20 um face (x_P z_P of the uniform grid)']
    - [d_up_fS, metre, 1.0e-05, 'harness: centre-to-face distance, half a 20 um cell']
    - [d_down_fS, metre, 1.0e-05, 'harness: centre-to-face distance, half a 20 um cell']
    - [open_flag_fS, dimensionless, 1, 'harness: open face']
    - [C_down_fS, millimolar, 0.0597, 'harness: fixed boundary concentration (the old C_N = 0.08 run point; others 47 mmHg
        x 1.27 uM/mmHg)']
    - [A_f_fE, m2, 4.0e-10, 'harness: 20 um x 20 um face (x_P z_P of the uniform grid)']
    - [d_up_fE, metre, 1.0e-05, 'harness: centre-to-face distance, half a 20 um cell']
    - [d_down_fE, metre, 1.0e-05, 'harness: centre-to-face distance, half a 20 um cell']
    - [open_flag_fE, dimensionless, 1, 'harness: open face']
    - [C_down_fE, millimolar, 0.0597, 'harness: fixed boundary concentration (the old C_N = 0.08 run point; others 47 mmHg
        x 1.27 uM/mmHg)']
    - [sigma_diff, m2_per_s, 2.41e-09, Secomb2020 tissue O2 diffusivity (the face module's sigma_diff)]
  bc_sweep:
    exclude: [J_in, J_out]
    rationale: the volume's own constants and flux_c; J_in and J_out are the summed face fluxes
  invariants:
  - {description: 'mass balance: C_P(t_end) - C_P(0) = integral of (sum of face fluxes + flux_c)/V_P + M_reduced dt (trapezoid;
      1e-3 of the total change plus 1e-8 of |C_P|)', expr: 'abs((C_P[-1] - C_P[0]) - np.trapz(((fN__J_down + fW__J_down +
      fS__J_up + fE__J_up) + flux_c)/V_P + M*C_P/(C_P + C50), t)) <= 1e-3*np.ptp(C_P) + 1e-8*np.max(np.abs(C_P)) + 1e-15'}
  - {applies: run, description: 'steady state reached by t_end: net flux + consumption balance (below 1e-6 of the largest
      flux term per volume)', expr: 'abs(((fN__J_down + fW__J_down + fS__J_up + fE__J_up)[-1] + flux_c)/V_P[-1] + M*C_P[-1]/(C_P[-1]
      + C50)) <= 1e-6*max(abs(M), (fN__D + fW__D + fS__D + fE__D)[-1]*max(np.max(fN__C_up), np.max(fW__C_up), np.max(fS__C_down),
      np.max(fE__C_down), np.max(C_P))/V_P[-1] + abs(flux_c)/V_P[-1], 1e-12)'}
  - {description: 'with consumption only (M <= 0) and non-negative boundary concentrations and flux, C_P stays in [0, max(C_P_init,
      C_inf)], C_inf the no-consumption steady state', expr: '(M > 0) or (np.all(C_P >= -1e-8*np.max(np.abs(C_P)) - 1e-15)
      and np.all(C_P <= max(C_P_init, ((fN__D*fN__C_up + fW__D*fW__C_up + fS__D*fS__C_down + fE__D*fE__C_down)[0] + flux_c)/(fN__D
      + fW__D + fS__D + fE__D)[0]) + 1e-8*np.max(np.abs(C_P)) + 1e-15))'}
  - {description: 'exact solution when M = 0: C_P = C_inf + (C_P_init - C_inf) exp(-t sum D_k/V_P) (relative 1e-5)', expr: '(M
      != 0) or (np.max(np.abs(C_P - (((fN__D*fN__C_up + fW__D*fW__C_up + fS__D*fS__C_down + fE__D*fE__C_down)[0] + flux_c)/(fN__D
      + fW__D + fS__D + fE__D)[0] + (C_P_init - ((fN__D*fN__C_up + fW__D*fW__C_up + fS__D*fS__C_down + fE__D*fE__C_down)[0]
      + flux_c)/(fN__D + fW__D + fS__D + fE__D)[0])*np.exp(-t*(fN__D + fW__D + fS__D + fE__D)[0]/V_P[0])))) <= 1e-5*max(np.max(np.abs(C_P)),
      1e-9))'}
  validation:
    baseline: {status: not_applicable, reason: 'a single finite-volume cell has no measurable counterpart on its own; verified
        against the exact linear solution, mass balance and the steady state. Tissue PO2 data (e.g. CelayaAlcala2021 cortex)
        apply to an assembled grid of cells with capillaries.'}
    calibrate: {status: not_applicable, reason: 'as baseline: calibration against tissue PO2 maps belongs to an assembled
        diffusion grid, not one cell'}
- vessel_type: tissue_diffusion_face
  BC_type: nn
  module_type: diffusion_face
  outputs: [D, J, J_up, J_down, va/C_P, vb/C_P, va/V_P, vb/V_P]
  notes: 'A diffusion face between an upstream and a downstream volume, for any mesh (2D or 3D, any cell shape): D = open_flag
    sigma_diff A_f/(d_up + d_down), the face area over the distance between the two cell centres through the face (d_up, d_down:
    each centre''s distance to the face; for box cells, half the cell width normal to the face; in 2D, A_f is the edge length
    times the depth). J = D (C_up - C_down) into the downstream volume (J_down = J) and -J into the upstream one (J_up = -J),
    so the pair conserves mass. open_flag = 1 opens the face, 0 closes it. With one side unconnected, that side''s concentration
    is a fixed boundary value. Tested between two closed cells of different sizes with no consumption: V_a C_a + V_b C_b is
    conserved and C_a - C_b decays as exp(-D (1/V_a + 1/V_b) t).'
  harness:
    vessel_array:
    - [va, nn, tissue_diffusion_volume, '', mod]
    - [mod, nn, tissue_diffusion_face, va, vb]
    - [vb, nn, tissue_diffusion_volume, mod, '']
    parameters:
    - [C_P_init_va, millimolar, 0.08, 'harness: two cells at different concentrations']
    - [flux_c_va, mol_per_s, 0, 'harness: closed cell']
    - [M_va, millimolar_per_s, 0, 'harness: no consumption']
    - [C50_va, millimolar, 0.0133, harness (unused with M = 0)]
    - [C_P_init_vb, millimolar, 0.02, 'harness: two cells at different concentrations']
    - [flux_c_vb, mol_per_s, 0, 'harness: closed cell']
    - [M_vb, millimolar_per_s, 0, 'harness: no consumption']
    - [C50_vb, millimolar, 0.0133, harness (unused with M = 0)]
    - [V_P_va, m3, 8.000000000000002e-15, 'harness: 20 x 20 x 20 um cell']
    - [V_P_vb, m3, 1.2000000000000003e-14, 'harness: 30 x 20 x 20 um cell']
  bc_sweep:
    exclude: [C_up, C_down]
    rationale: the face constants; C_up and C_down come from the connected cells
  invariants:
  - {description: 'D = open_flag sigma_diff A_f/(d_up + d_down), J = D (C_up - C_down) with C_up, C_down the connected cells''
      C_P, J_down = J, J_up = -J (exact)', expr: 'np.allclose(D, open_flag*sigma_diff*A_f/(d_up + d_down), rtol=1e-12, atol=0)
      and np.allclose(J, D*(va__C_P - vb__C_P), rtol=1e-9, atol=1e-30) and np.array_equal(J_down, J) and np.array_equal(J_up,
      -J)'}
  - {description: 'mass is conserved across the face: V_a C_a + V_b C_b is constant (relative 1e-9)', expr: np.ptp(va__V_P*va__C_P
      + vb__V_P*vb__C_P) <= 1e-9*np.max(np.abs(va__V_P*va__C_P + vb__V_P*vb__C_P))}
  - {description: 'exact solution: C_a - C_b = (C_a0 - C_b0) exp(-D (1/V_a + 1/V_b) t) (relative 1e-6 of the initial difference)',
    expr: 'np.max(np.abs((va__C_P - vb__C_P) - (va__C_P[0] - vb__C_P[0])*np.exp(-D[0]*(1/va__V_P[0] + 1/vb__V_P[0])*t))) <=
      1e-6*abs(va__C_P[0] - vb__C_P[0]) + 1e-15'}
  validation:
    baseline: {status: not_applicable, reason: a face is the flux law between two finite-volume cells; verified against the
        exact two-cell solution and mass conservation. Tissue PO2 data apply to an assembled grid.}
    calibrate: {status: not_applicable, reason: as baseline}
