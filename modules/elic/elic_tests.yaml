module: elic
reviewed: false
known_issues: [port variable u_in not in variables_and_units, port variable u_a not in variables_and_units, port variable
    v_a not in variables_and_units]
defaults:
  sim_time: 2.0
  pre_time: 0.0
  dt: 0.01
  solver: CVODE_myokit
  bc_sweep:
    factors: [0.5, 0.75, 1.0, 1.5, 2.0]
    ranges: {}
  timestep:
    scheme: rk4
    dts: [0.004, 0.002, 0.001, 0.0005]
    min_order: 0.8
    tol: 0.0001
    cvode_tol: 0.001
  stability:
    supported:
    - {solver: CVODE_myokit, rtol: 1.0e-06, atol: 1.0e-08}
components:
- vessel_type: terminal
  BC_type: pp_controller
  module_type: controller_type
  outputs: [u, v, v_T, R_T, q_T]
  invariants: []
  validation:
    baseline: {status: pending, reason: validation data not chosen yet}
    calibrate: {status: pending, reason: validation data not chosen yet}
- vessel_type: pressure_observer
  BC_type: nn
  module_type: p_observer_type
  outputs: [u]
  invariants: []
  validation:
    baseline: {status: pending, reason: validation data not chosen yet}
    calibrate: {status: pending, reason: validation data not chosen yet}
- vessel_type: flow_observer
  BC_type: nn
  module_type: f_observer_type
  outputs: [v]
  invariants: []
  validation:
    baseline: {status: pending, reason: validation data not chosen yet}
    calibrate: {status: pending, reason: validation data not chosen yet}
- vessel_type: terminal2
  BC_type: pp_controller
  module_type: controller2_type
  outputs: [u, v, v_T, R_T, error_flow_percent, q_T]
  invariants: []
  validation:
    baseline: {status: pending, reason: validation data not chosen yet}
    calibrate: {status: pending, reason: validation data not chosen yet}
