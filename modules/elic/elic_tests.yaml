module: elic
reviewed: false
known_issues:
- port variable u_in not in variables_and_units
- port variable u_a not in variables_and_units
- port variable v_a not in variables_and_units
defaults:
  sim_time: 2.0
  pre_time: 0.0
  dt: 0.01
  solver: CVODE_myokit
  bc_sweep:
    factors:
    - 0.5
    - 0.75
    - 1.0
    - 1.5
    - 2.0
    ranges: {}
  timestep:
    scheme: rk4
    dts:
    - 0.004
    - 0.002
    - 0.001
    - 0.0005
    min_order: 0.8
    tol: 0.0001
    cvode_tol: 0.001
  stability:
    supported:
    - solver: CVODE_myokit
      rtol: 1.0e-06
      atol: 1.0e-08
components:
- vessel_type: terminal
  BC_type: pp_controller
  module_type: controller_type
  sim_time: 2.0
  dt: 0.001
  solver_info:
    rtol: 1.0e-08
    atol: 1.0e-16
  outputs: &id002
  - u
  - u_C
  - v
  - v_T
  - q_T
  - R_T
  - check
  - error
  - error_flow_percent
  - u2
  - u5
  - u8
  - aa2
  - cc2
  - aa5
  - cc5
  - aa8
  - cc8
  harness: &id003
    parameters:
    - - u_in_mod
      - J_per_m3
      - 12000.0
      - 'test value: inlet pressure when run alone (fed by the parent vessel in a network); needs the proposed config fix'
    - - u_a_mod
      - J_per_m3
      - 12000.0
      - 'test value: constant observed pressure (fed by a pressure_observer in a network); needs the proposed config fix'
    - - v_a_mod
      - m3_per_s
      - 1.0e-06
      - 'test value: constant observed flow (fed by a flow_observer in a network); needs the proposed config fix'
  run_parameters:
    pressure_d: 13000
    meanflow_4dflow: 1.24e-05
  notes: 'Controlled terminal: compliance C_T (state q_T, viscoelastic damper 0.01/C_T) between two resistive-inertive branches
    R_T/2 with hard-coded I_T = 1e-6, draining to u_out = 0. R_T is set online by an adaptive controller: three membership
    functions of the pressure error (pressure_d - u_a; logistic/Gaussian with 1 Pa width) weight linear consequents aa_i error
    + cc_i, whose coefficients learn at rate learning_rate (critic - K_a r_a), r_a = BFF_ASL - v_a/meanflow_4dflow (u_a, v_a
    from pressure/flow observers). Tested alone with constant u_in, u_a, v_a (harness values) at pressure_d = 13000 Pa and
    meanflow_4dflow = 1.24e-5 m3/s (the cerebral_elic values).'
  invariants:
  - description: 'R_T follows the CellML piecewise law: 1 Pa s m^-3 if check <= 0, check if 0 < check <= 1e13, 1e13 above
      (NB values in (0, 1) pass through unclamped)'
    expr: np.max(np.abs(R_T - np.where(check <= 0, 1.0, np.minimum(check, 1e13)))) <= 1e-9*max(1.0, np.max(np.abs(R_T)))
  - description: 'physical bound: terminal flows stay below 1e-3 m3/s (60 L/min, far above any single terminal) - fails when
      the learned output goes negative and R_T drops to the 1 Pa s m^-3 floor'
    expr: (np.max(np.abs(v)) <= 1e-3) & (np.max(np.abs(v_T)) <= 1e-3)
  - description: 'the three membership functions (negative / zero / positive pressure error) form a partition of unity: u2
      + u5 + u8 = 1'
    expr: np.max(np.abs(u2 + u5 + u8 - 1)) <= 1e-9
  - description: constant observed pressure => constant error, so d(aa_i)/dt = error d(cc_i)/dt gives the first integral aa_i
      - 100 = error (cc_i - 100) (both start at 100), i = 2, 5, 8
    expr: (np.max(np.abs((aa2 - 100) - error*(cc2 - 100))) <= 1e-6*max(1.0, np.max(np.abs(aa2 - 100)))) & (np.max(np.abs((aa5
      - 100) - error*(cc5 - 100))) <= 1e-6*max(1.0, np.max(np.abs(aa5 - 100)))) & (np.max(np.abs((aa8 - 100) - error*(cc8
      - 100))) <= 1e-6*max(1.0, np.max(np.abs(aa8 - 100))))
  - description: pressure error is pressure_d - u_a with the harness value u_a = 12000.0 Pa
    expr: np.max(np.abs(error - (pressure_d - 12000.0))) <= 1e-9*max(1.0, abs(pressure_d))
  - description: 'flow-fraction error: error_flow_percent = 100 (BFF_ASL - v_a/meanflow_4dflow), harness v_a = 1e-06 m3/s'
    expr: np.max(np.abs(error_flow_percent - 100*(BFF_ASL - 1e-06/meanflow_4dflow))) <= 1e-6*max(1.0, np.max(np.abs(error_flow_percent)))
  - description: 'volume balance: q_T(t) - q_T(t0) = integral of (v - v_T) dt from t0 = 10 ms (after the sub-ms inertial start-up),
      trapezoid on the output grid'
    expr: np.max(np.abs((q_T - q_T[t >= 0.01][0])[t >= 0.01] - np.concatenate([[0.0], np.cumsum(0.5*np.diff(t[t >= 0.01])*((v
      - v_T)[t >= 0.01][1:] + (v - v_T)[t >= 0.01][:-1]))]))) <= 1e-3*max(np.max(np.abs(q_T - q_T[0])), 1e-18) + 1e-18
  - description: 'pressure law: u_C = q_T/C_T and u = u_C + (0.01/C_T)(v - v_T)'
    expr: (np.max(np.abs(u_C - q_T/C_T)) <= 1e-6*max(1.0, np.max(np.abs(u_C)))) & (np.max(np.abs(u - (u_C + 0.01/C_T*(v -
      v_T)))) <= 1e-6*max(1.0, np.max(np.abs(u))))
  bc_sweep: &id004
    ranges:
      C_T:
        min: 1.0e-14
        max: 1.0e-12
        points: 3
        scale: log
      BFF_ASL:
        min: 0.02
        max: 0.5
        points: 3
        scale: log
      pressure_d:
        min: 8000
        max: 16000
        points: 3
      meanflow_4dflow:
        min: 1.0e-06
        max: 0.0003
        points: 3
        scale: log
    rationale: C_T spans two decades around the ADAN-derived cerebral terminal value 2.6e-13 m3/Pa; BFF_ASL spans 2-50 % flow
      fractions (the cerebral_elic values are 9-31 %); pressure_d spans 60-120 mmHg (the library nominal 520346 Pa is questioned
      in the review); meanflow spans a single cerebral territory (~1e-6) to the current library value 3e-4 m3/s.
  timestep:
    dts:
    - 1.0e-05
    - 5.0e-06
    - 2.5e-06
    - 1.25e-06
    t_end: 0.01
  stability:
    t_end: 0.5
  reference_proposals:
    C_T:
      reference: unreferenced_placeholder; 2.64334e-13 m3/Pa is the value circulatory_autogen cerebral_elic gives this terminal
        ("ADAN_218"); ADAN is Blanco2015, but the per-terminal compliance could not be checked against the published model
        tables
      sourced: 'no'
      value: 2.64334e-13
    BFF_ASL:
      reference: unreferenced_placeholder; blood-flow fraction of this territory from a patient arterial-spin-labelling (ASL)
        MRI measurement in the intended use; 0.0896 is the cerebral_elic "defined_by_user" value for a posterior-cerebral
        terminal
      sourced: 'no'
      value: 0.0896
    pressure_d: &id005
      reference: unreferenced_placeholder; desired pressure at the observed site ("defined_by_user"). NB the library value
        520346 Pa (3903 mmHg) is not physiological; circulatory_autogen cerebral_elic uses 13000 Pa
      sourced: 'no'
    meanflow_4dflow: &id006
      reference: unreferenced_placeholder; total flow of the territory from 4D-flow MRI in the intended use ("defined_by_user");
        3e-4 m3/s is cardiac-output scale, whereas cerebral_elic uses 1.24e-5 m3/s
      sourced: 'no'
  expected_failures:
    run_test: 'libcuflynx exits during generation ("the port variable u_in is not a variable for vessel type: terminal"):
      u_in, u_a and v_a are used in the entrance ports but missing from variables_and_units. Evidence (patched copy with the
      fix): see review.findings'
    verification_test_invariants: 'libcuflynx exits during generation ("the port variable u_in is not a variable for vessel
      type: terminal"): u_in, u_a and v_a are used in the entrance ports but missing from variables_and_units. Evidence (patched
      copy with the fix): see review.findings'
    verification_test_BC: 'Generation fails as for run_test (port variables missing from variables_and_units). With the fix
      (patched copy) the sweep runs, but whenever pressure_d <= u_a (observed pressure at or above target: pressure_d = 8000
      and 12000 Pa with u_a = 12000 Pa; at error = 0 check decays into (0, 1), which the piecewise passes through unclamped)
      the critic 1e-6 error (v/v_ref)^2 is negative, the consequent coefficients learn downwards without bound, check < 0
      and R_T falls to its 1 Pa s m^-3 floor: the terminal short-circuits (v ~ 1.2e4 m3/s) and the physical-bound invariant
      fails. See review.proposed_fixes.'
    verification_test_timestep: 'Generation fails as for run_test (port variables missing from variables_and_units). Even
      with the fix (patched copy) this test fails: the RK4 reference is evaluated in Python and math.exp overflows in the
      membership functions x1/x3 = 1/(1 + exp((-/+error + 1)/0.01)) once |error| exceeds ~7 Pa (OverflowError; the same error
      stops solve_ivp in the stability matrix, where only CVODE works), and the flow equations are extremely stiff anyway
      (I_T/R_T ~ 1e-6/(1e8-1e13) = 1e-14-1e-19 s), so no explicit fixed-step scheme can run at a practical dt.'
    stability_test: 'libcuflynx exits during generation ("the port variable u_in is not a variable for vessel type: terminal"):
      u_in, u_a and v_a are used in the entrance ports but missing from variables_and_units. Evidence (patched copy with the
      fix): see review.findings'
  validation:
    baseline:
      status: not_applicable
      reason: adaptive controller acting as a boundary condition; its targets (pressure_d, BFF_ASL, meanflow_4dflow) are patient
        inputs. Validation belongs to the closed-loop cerebral network (e.g. achieved territory flow fractions vs ASL), not
        to the terminal alone
    calibrate:
      status: not_applicable
      reason: the controller identifies R_T online; nothing to calibrate in isolation
- vessel_type: pressure_observer
  BC_type: nn
  module_type: p_observer_type
  sim_time: 2.0
  dt: 0.001
  outputs:
  - art/u
  - art/v
  - art/q_C
  harness:
    vessel_array:
    - - pressure_in
      - nn_constant
      - inlet_pressure
      - ''
      - art
    - - art
      - pv
      - arterial
      - pressure_in
      - flow_out mod
    - - flow_out
      - nn_constant
      - outlet_flow
      - art
      - ''
    - - mod
      - nn
      - pressure_observer
      - art
      - ''
    parameters: &id001
    - - P_pressure_in
      - J_per_m3
      - 13000
      - 'test value (harness): inlet pressure ~97.5 mmHg'
    - - v_flow_out
      - m3_per_s
      - 5.0e-06
      - 'test value (harness): constant outflow 5 mL/s'
    - - E_art
      - J_per_m3
      - 400000
      - 'BG arterial pv example value (FinalModel: ADAN_86)'
    - - l_art
      - metre
      - 0.0432111
      - 'BG arterial pv example value (FinalModel: ADAN_86)'
    - - r_0_art
      - metre
      - 0.0117401
      - 'BG arterial pv example value (FinalModel: ADAN_86)'
    - - u_0_art
      - J_per_m3
      - 10640
      - BG arterial pv example value (80 mmHg reference)
    - - u_ext_art
      - J_per_m3
      - 0
      - 'test value (harness): no external pressure'
    - - theta_art
      - dimensionless
      - 90
      - 'test value (harness): horizontal vessel (no gravity term)'
    - - beta_g
      - dimensionless
      - 1
      - 'test value (harness): '
    - - rho
      - Js2_per_m5
      - 1050
      - 'test value (harness): blood density'
    - - mu
      - Js_per_m3
      - 0.004
      - 'test value (harness): blood viscosity'
    - - g
      - m_per_s2
      - 9.81
      - 'test value (harness): '
    - - a_vessel
      - dimensionless
      - 0.2802
      - 'test value (harness): wall-thickness law constants (h/r0 = a e^{b r0} + c e^{d r0})'
    - - b_vessel
      - per_m
      - -505.3
      - 'test value (harness): '
    - - c_vessel
      - dimensionless
      - 0.1324
      - 'test value (harness): '
    - - d_vessel
      - per_m
      - -11.14
      - 'test value (harness): '
  notes: 'Pure pass-through ("observer"): its only variable u is mapped in from the source vessel''s pressure (pressure_feedback_port)
    and out to every controlled terminal (multi_port pressure/flow feed). It has no equations; after flattening the variable
    is the source vessel''s own u, so it cannot be logged separately. Tested in a network pressure_in -> BG arterial pv (art)
    -> constant outflow, with the observer attached to art: the network generates and the source vessel is unaffected. Its
    consumer (terminal / terminal2) cannot be generated until the port-variable fix (see review).'
  invariants:
  - description: with the observer attached, the source vessel reaches its analytic steady state u = P_in - R v_out = 13000
      - 23169.05 x 5e-6 Pa and v = v_out (observer does not load it)
    expr: (abs(art__u[-1] - 12999.884154745678) <= 1e-5*13000) & (abs(art__v[-1] - 5.0e-06) <= 1e-3*5.0e-06)
  - description: 'source vessel volume balance: q_C(t) = integral of (v - v_out) dt (trapezoid, 1 % of swing)'
    expr: np.max(np.abs(art__q_C - art__q_C[0] - np.concatenate([[0.0], np.cumsum(0.5*np.diff(t)*((art__v - 5.0e-06)[1:] +
      (art__v - 5.0e-06)[:-1]))]))) <= 1e-2*np.max(np.abs(art__q_C - art__q_C[0]))
  bc_sweep:
    rationale: the observer has no parameters of its own; nothing to sweep (the test network's parameters are fixtures)
  timestep:
    dts:
    - 0.0004
    - 0.0002
    - 0.0001
    - 5.0e-05
    t_end: 0.2
  validation:
    baseline:
      status: not_applicable
      reason: signal pass-through with no equations or physiological counterpart
    calibrate:
      status: not_applicable
      reason: signal pass-through with no parameters
