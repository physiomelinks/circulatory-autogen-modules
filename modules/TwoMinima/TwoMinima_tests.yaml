module: TwoMinima
reviewed: true
known_issues: []
defaults:
  sim_time: 5.0
  pre_time: 0.0
  dt: 0.01
  solver: CVODE_myokit
  bc_sweep:
    factors: [0.5, 0.75, 1.0, 1.5, 2.0]
    ranges:
      a: {min: -3, max: 3, points: 7}
      c: {min: 0.1, max: 10, points: 7, scale: log}
      x_init: {min: -5, max: 5, points: 5}
  timestep:
    scheme: rk4
    dts: [0.004, 0.002, 0.001, 0.0005]
    min_order: 0.8
    tol: 0.0001
    cvode_tol: 0.001
    t_end: 5.0
  stability:
    supported:
    - {solver: CVODE_myokit, rtol: 1.0e-06, atol: 1.0e-08}
components:
- vessel_type: TwoMinima
  BC_type: nn
  module_type: TwoMinima_main_type
  outputs: [x]
  invariants:
  - {description: matches the exact solution x = a² + (x₀ − a²)e^(−ct) to 1e-5 (relative), expr: 'np.max(np.abs(x - (a*a +
      (x_init - a*a)*np.exp(-c*t)))) <= 1e-5 * max(1.0, a*a, abs(x_init))'}
  validation:
    baseline: {status: not_applicable, reason: optimiser test fixture with no physiological counterpart; the exact solution
        is checked as a verification invariant}
    calibrate:
      status: active
      source: circulatory_autogen two-minima fixture (resources/TwoMinima_obs_data.json)
      obs_data: validation/TwoMinima__nn_obs_data.json
      params_for_id: validation/TwoMinima__nn_params_for_id.csv
      validation_obs_data: validation/TwoMinima__nn_obs_data.json
      starts:
      - {a: 1.0}
      - {a: -1.0}
      expected_parameters: {a: 2.0}
      expected_compare: abs
      expected_rtol: 0.05
      method: sp_minimize
      optimiser_options: {cost_convergence: 1.0e-08}
      z_threshold: 2.0
      do_ad: true
  notes: Linear relaxation dx/dt = c(a² − x) to the steady state a². Used by circulatory_autogen to test calibration with
    two equally good optima (a = ±2 both give a steady state of 4).
