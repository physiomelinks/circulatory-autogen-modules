review:
  summary: 'Self-contained bond-graph blood-volume-control model: arterial-side (ac) and venous-side (vc) blood water, one
    gut (lumen + epithelium) and one kidney (proximal tubule + epithelium), with osmotic water fluxes, glomerular filtration,
    capillary flow ac -> vc (k_cc_W), a constant heart flow vc -> ac (v_lv_W) and two simplified NKE fluxes. It is the single-block
    version of BVC_GI + BVC_Kidney + BVC_Na_circ plus blood compartments. All 45 parameters were TODO: gut/kidney values proposed
    from P. Hunter''s unpublished set; the ac/vc compartment values (E_ac, E_vc, U/L, k_cc_W, v_lv_W, initial volumes) have
    no source anywhere I could find and are placeholders chosen near equilibrium. Verification: exact total-water and total-Na
    solutions, all constitutive/flux laws incl. both NKE closed forms, bounds, and the equilibrium (equal pressures, isotonic
    gut lumen); 200-run sweep over all 45 constants, RK4 timestep and solver matrix pass.'
  comment: Same physics caveats as BVC_GI/BVC_Kidney (NKE without ATP term and with a suspicious exp(2Fu/RT); amount-difference
    Na exchange; k_pt_W = 0; toy volumes of 0.03-0.5 L and 11.5 mmol of blood Na). E_ac, E_vc, U_ac/vc, L_ac/vc, k_cc_W, v_lv_W,
    q_ac_W_init and q_vc_W_init are unsourced placeholders I chose (v_lv_W = 0, i.e. no heart). The compliance law u = E (q
    - U)/(L - q)^2 is singular at L, so initial volumes must stay below L (the sweep ranges respect that).
  questions:
  - All values are proposed from P. Hunter's unpublished parameter set (CA_user_volume_control/ANS_CVS_BVC_parameters.csv,
    data_reference "Peter_Hunter", same values in ANS_CVS_BVolCtl_FA_MG_PH_v2.cellml; the modules were added to circulatory_autogen
    by M. H. Shafieizadegan). I found no publication giving these values (the related bioRxiv preprint Hunter et al. 2026,
    "The biophysical basis of enterocyte homeostasis", doi 10.64898/2026.01.28.702213, is cellular and does not contain them),
    so they are marked unreferenced_placeholder. Is there a report/thesis to cite, or should they stay placeholders?
  - The ac/vc blood compartments (E_ac, E_vc, U_ac_W, U_vc_W, L_ac_W, L_vc_W, k_cc_W, v_lv_W, q_ac_W_init, q_vc_W_init) have
    no values anywhere (P. Hunter's set and the CA examples only cover the GI/kidney parts). I proposed placeholders near
    equilibrium (ac = pt law, vc chosen so u_vc is about u_ac, v_lv_W = 0). Do you have the intended values (is this Hunter's
    3-compartment BVC model)?
  - RT = 2500 J/mol (T = 300.7 K) is the source value; keep it, or use body temperature (2578.8 J/mol at 310.15 K)? F is proposed
    as the exact CODATA value 96485.33212 C/mol (the source used 0.965e5).
  - 'NKE law (all four modules share it): 3 k (A^3 B^2 - C^3 D^2 exp(2 F u/RT))/((1+A^3)(1+B^2)(1+C^3)(1+D^2)). (a) It has
    no ATP-hydrolysis term, so it is a gradient-driven exchanger, not a pump: in the source parameters it moves Na out of
    the epithelium only because blood-side K (q_vc_K/q_vc_W = 0.3-0.4 M) is set far above epithelial K (24 mM), the reverse
    of physiology (plasma about 4-5 mM, cells about 140 mM); with physiological K it would run backwards. (b) The electrical
    factor: one pump cycle moves net +1 charge out, so with u = psi_in - psi_out = -40 mV the reverse term would normally
    carry exp(-F u/RT) (= 4.7), not exp(+2 F u/RT) (= 0.046). Is this a deliberate simplification (and which sign convention
    does u_*Epi_e use), or should the law be corrected (e.g. to the bond-graph NKE of the Hunter group) before these modules
    are used?'
  - 'Na exchange laws use amount differences, not concentrations: v_gi_Na = kK (q_gi_Na - q_giEpi_Na), v_pt_Na = kK (q_pt_Na
    - q_ptEpi_Na), v_gl_Na = kK (q_vc_Na - q_pt_Na). At steady state this equalises amounts, not concentrations (gut lumen
    146 mM vs epithelium 8 mM because the volumes are 0.028 vs 0.5 L), and glomerular Na filtration is not tied to the filtered
    water (a convective v_gl_W c_vc_Na would be expected). Intended?'
  - v_lv_W is a constant flow from vc to ac (a heart with fixed output, independent of filling). With v_lv_W > 0 at steady
    state the capillary flow v_cc_W must carry it back; is a constant v_lv_W intended?
  - 'Validation pending (see candidate): accept?'
  proposed_fixes: []
  findings:
  - With the proposed values the model relaxes within about 2 s to u_ac = u_vc = u_pt = 1.84 kPa and c_gi_Na = c_vc_Na = 135
    mM; total Na then declines slowly at v_out2_Na = 1.16e-6 mol/s (the gut in/outflows balance, the kidney excretes).
  - 'Exact invariants: q_tot_W and q_tot_Na follow initial + (in - out) t to 1e-8 relative over the whole sweep (internal
    exchanges cancel exactly).'
  - 'Joint failure risk (256 Latin-hypercube samples over the tested box): P(fail) = 0.12 [0.08, 0.16]; most influential L_ac_W,
    q_ac_W_init, U_vc_W - i.e. joint draws with the initial volume at or above the compliance limit L (u = E (q - U)/(L -
    q)^2 is singular there). Single-parameter sweeps all pass; the tested ranges are only jointly valid with q_init < L.'
