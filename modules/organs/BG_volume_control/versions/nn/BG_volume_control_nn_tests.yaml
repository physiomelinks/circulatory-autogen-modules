module_type: BG_volume_control
version: nn
reviewed: false
notes: 'Self-contained blood-volume-control model (no ports): water in ac, vc, gut lumen (gi) and proximal tubule (pt) plus
  fixed epithelial volumes; Na in vc, gi, pt and the two epithelia. Water: dq_ac = v_lv - v_cc - v_gl, dq_vc = v_cc + v_gi
  + v_pt - v_lv, dq_gi = v_in - v_gi - v_out1, dq_pt = v_gl - v_pt - v_out2, with u = E (q - U)/(L - q)^2 for ac, vc, pt and
  osmotic pressures RT c. Na: gut and tubule exchange by amount differences and two simplified NKE fluxes return Na to vc.
  Totals q_tot_W and q_tot_Na change only by the external in/outflows, which gives exact linear solutions.'
