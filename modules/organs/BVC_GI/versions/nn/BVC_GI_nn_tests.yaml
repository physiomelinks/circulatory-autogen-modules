module_type: BVC_GI
version: nn
reviewed: false
notes: 'Gut lumen + epithelium of the blood-volume-control system (bond-graph style, litre/kPa/mol units): dq_gi_W/dt = v_giIn_W
  - v_gi_W - v_giOut_W with osmotic water flux v_gi_W = k_gi_W RT (c_vc - c_gi); dq_gi_Na/dt = v_giIn_Na - v_gi_Na - v_giOut_Na
  with v_gi_Na = kK_gi_Na (q_gi_Na - q_giEpi_Na); dq_giEpi_Na/dt = v_gi_Na - v_giEpi_NKE with a simplified Na/K-ATPase flux
  to the blood. Blood-side Na and volume (q_vc_Na from BVC_Na_circ, q_vc_W from the intestinal capillary) are BCs, so it runs
  alone. Totals are conserved exactly: water gains only v_giIn_W - v_giOut_W - v_gi_W, lumen+epithelium Na only v_giIn_Na
  - v_giOut_Na - v_giEpi_NKE.'
