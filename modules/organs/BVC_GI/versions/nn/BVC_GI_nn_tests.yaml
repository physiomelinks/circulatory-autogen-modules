review:
  summary: 'Gut (GI) compartment of the blood-volume-control (BVC) system: lumen water and Na (q_gi_W, q_gi_Na) and epithelial
    Na (q_giEpi_Na); osmotic water exchange with blood (v_gi_W), lumen-to-epithelium Na transfer (v_gi_Na) and a simplified
    Na/K-ATPase (NKE) flux to the blood (v_giEpi_NKE, exported to BVC_Na_circ). All 20 parameters were TODO; values proposed
    from P. Hunter''s unpublished BVC parameter set (the source of these modules). It runs alone (q_vc_Na, q_vc_W are BCs).
    Verification: exact water and Na balances, all constitutive laws incl. the NKE closed form, positivity, and the analytic
    steady state (lumen isotonic with blood, NKE equilibrium) - all pass, as do the 90-run BC sweep, RK4 timestep convergence
    and the CVODE solver matrix. Main open points are physical (NKE law, amount-difference Na exchange, K values), not numerical.'
  comment: The NKE law has no ATP term and its electrical factor exp(2Fu/RT) looks sign/valence-inverted for a 3Na:2K pump
    with u = -40 mV; it only pumps Na "outwards" because blood K (q_vc_K = 0.03 mol, about 380 mM) is set above epithelial
    K (24 mM). Na exchange uses amount differences (q_gi_Na - q_giEpi_Na), so steady state equalises amounts not concentrations.
    All values are an unpublished toy parameter set (0.028 L lumen, K_Na = K_K = 1 L/mol); at steady state net absorption
    is zero with the proposed balanced in/outflows. The water/Na balance invariants are checked with a trapezoid integral
    of the logged fluxes, so their tolerance includes a dt*max|v| quadrature term.
  questions:
  - All values are proposed from P. Hunter's unpublished parameter set (CA_user_volume_control/ANS_CVS_BVC_parameters.csv,
    data_reference "Peter_Hunter", same values in ANS_CVS_BVolCtl_FA_MG_PH_v2.cellml; the modules were added to circulatory_autogen
    by M. H. Shafieizadegan). I found no publication giving these values (the related bioRxiv preprint Hunter et al. 2026,
    "The biophysical basis of enterocyte homeostasis", doi 10.64898/2026.01.28.702213, is cellular and does not contain them),
    so they are marked unreferenced_placeholder. Is there a report/thesis to cite, or should they stay placeholders?
  - RT = 2500 J/mol (T = 300.7 K) is the source value; keep it, or use body temperature (2578.8 J/mol at 310.15 K)? F is proposed
    as the exact CODATA value 96485.33212 C/mol (the source used 0.965e5).
  - 'NKE law (all four modules share it): 3 k (A^3 B^2 - C^3 D^2 exp(2 F u/RT))/((1+A^3)(1+B^2)(1+C^3)(1+D^2)). (a) It has
    no ATP-hydrolysis term, so it is a gradient-driven exchanger, not a pump: in the source parameters it moves Na out of
    the epithelium only because blood-side K (q_vc_K/q_vc_W = 0.3-0.4 M) is set far above epithelial K (24 mM), the reverse
    of physiology (plasma about 4-5 mM, cells about 140 mM); with physiological K it would run backwards. (b) The electrical
    factor: one pump cycle moves net +1 charge out, so with u = psi_in - psi_out = -40 mV the reverse term would normally
    carry exp(-F u/RT) (= 4.7), not exp(+2 F u/RT) (= 0.046). Is this a deliberate simplification (and which sign convention
    does u_*Epi_e use), or should the law be corrected (e.g. to the bond-graph NKE of the Hunter group) before these modules
    are used?'
  - 'Na exchange laws use amount differences, not concentrations: v_gi_Na = kK (q_gi_Na - q_giEpi_Na), v_pt_Na = kK (q_pt_Na
    - q_ptEpi_Na), v_gl_Na = kK (q_vc_Na - q_pt_Na). At steady state this equalises amounts, not concentrations (gut lumen
    146 mM vs epithelium 8 mM because the volumes are 0.028 vs 0.5 L), and glomerular Na filtration is not tied to the filtered
    water (a convective v_gl_W c_vc_Na would be expected). Intended?'
  - 'In a network, c_vc_Na = q_vc_Na/q_vc_W divides the whole-circulation Na (BVC_Na_circ) by the volume of the LOCAL capillary
    that supplies osmotic_vol_port (intestinal or peritubular), so the GI and each kidney see different blood Na concentrations
    (source values: 146 mM at the gut, 55 mM at the kidneys for the same q_vc_Na). Should q_vc_W be the circulating (plasma)
    volume instead?'
  - 'v_giIn_Na: the CA_user_volume_control csv has 0 but the full CellML (ANS_CVS_BVolCtl_FA_MG_PH_v2) uses v_giIn_Na0 = 1.16e-6
    mol/s; I proposed 1.16e-6 (balances v_giOut_Na = 1.16e-6, so there is a steady state). Which is intended? Note that with
    in = out the gut contributes no net Na to the body at steady state.'
  - q_vc_K and q_giEpi_K are fixed constants (K is not tracked); q_vc_K = 0.03 mol gives 380 mM in the 0.079 L intestinal
    capillary. Confirm these, or should blood and epithelial K be swapped / made physiological?
  - 'Validation: pending (no data mapping onto this toy compartment). Accept pending, or suggest a data set (e.g. intestinal
    perfusion Na/water absorption)?'
  proposed_fixes: []
  findings:
  - 'With the proposed values the component relaxes (about 4 s) to an exact steady state: c_gi_Na = q_vc_Na/q_vc_W = 146 mM,
    q_gi_Na = q_giEpi_Na, v_giEpi_NKE = 0 (NKE thermodynamic equilibrium, c_giEpi = 8.26 mM), checked analytically.'
  - 'Initial transient is fast: v_giEpi_NKE starts at -0.021 mol/s (Na flows from blood INTO the epithelium) because the initial
    state is far from NKE equilibrium; relaxation rates up to about 100 /s at the top of the swept rate-constant ranges (CVODE
    handles it; RK4 converges at dt <= 4 ms).'
  - The water/Na balance invariants use a trapezoid integral of the output fluxes (no built-in cumulative-integral helper);
    tolerance 1e-5 relative plus dt max|v|/10.
  - 'Joint failure risk (512 samples): P(fail) = 0.018 [0.009, 0.033]; weakly attributed (K_Na, k_giEpi_NKE, q_vc_W), consistent
    with joint draws that make the initial NKE/osmotic transient much faster than the 1 ms output step so the trapezoid-integrated
    balance invariants exceed their tolerance, rather than a solver failure. Single-parameter sweeps all pass.'
