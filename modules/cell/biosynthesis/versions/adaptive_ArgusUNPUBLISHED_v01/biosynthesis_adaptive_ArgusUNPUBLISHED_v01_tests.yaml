notes: 'The rest of a cell''s energy budget besides pumps and protein turnover. Upkeep: mRNA turnover (n L c_recycle ln2/t_half),
  ribosome rRNA upkeep (n L c_recycle k), membrane lipid turnover (n_lipid c_lipid k, with n_lipid = 2 A_surface / area_per_lipid,
  so it scales with membrane area). Damage D (1 = lethal) accrues at r_dmg (Q10 2) and is repaired at repair_level r_rep_max
  D/(K_D + D), costing C_repair per unit: a cell can spend energy on repair or leave damage to accumulate and rely on replication.
  Growth: the game sets growth_level, the ATP put into a daughter in multiples of the resting turnover J_ref, throttled as
  ATP falls from rest to ATP_floor, like protein synthesis; P_growth is the ATP invested so far, and the cell can divide when
  growth_progress = P_growth / M_daughter reaches 1, with M_daughter = M_build_bio (RNA, lipids, DNA) + M_build_protein (every
  protein_pool''s M_build, summed on daughter_share). glycogen_progress is the share of a daughter the glycogen store (M_glyc_ATP
  from the cytosol) could finish. Everything slows as ATP runs out (f_ATP = 1 at the resting ATP). At rest the cell builds
  a daughter for 1.8e11 ATP, close to Lynch & Marinov''s growth cost 2.66e10 V^0.97 (1.6e11 for 6.28 um3); proteins are 89%
  of it.'
