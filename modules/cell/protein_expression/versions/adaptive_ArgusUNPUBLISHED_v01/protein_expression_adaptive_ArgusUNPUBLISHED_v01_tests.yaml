notes: 'The protein synthesis of an adaptive cell, serving its protein_pools (one per protein, on the protein_synthesis port:
  their ATP use, turnover, build spending, daughter share and membrane area are summed here, and each receives the cytosol
  ATP, s_build and R_reg). Building is limited to J_cap = build_capacity J_ref throttle R_reg. build_capacity is what the
  cell''s ribosomes can make, in multiples of the resting ATP turnover J_ref: n_ribo k_elong f_active (c_syn + c_poly) / N_A
  / J_ref, with k_elong about 5 aa/s at 20 C (Farewell & Neidhardt 1998, extrapolated) and f_active 0.8 of the ribosomes translating
  (Dai et al. 2016), 4 ~P per peptide bond (Stouthamer 1973) plus the amino acids'' synthesis from glucose; building backs
  off linearly as ATP falls from rest (ATP_ref) to ATP_floor (the stringent response), so it never starves the cell. When
  the pools ask for more, each gets the same share s_build = J_cap/J_demand_total. The summed ATP goes to the cytosol on the
  ATP_hydrolysis_port. The membrane area the pools take is compared with the most the cell surface allows (area_max_fraction
  of it); the game keeps targets within it. Biosynthesis throttles growth the same way (its own ATP_floor and J_ref, the same
  values of parameters.json). Regulation: R_reg = prod_s (1 - reg_on_s + reg_on_s f_s), the f_s from cell/expression_regulation
  on synthesis_regulation (1 at and above rest; switches set by the game, all 0 by default), scales the whole of protein synthesis,
  as the stringent response does: J_cap, and on protein_synthesis each pool''s replacement of its degraded copies (R_syn there),
  so a cell that cuts it saves the turnover cost and loses protein at k_deg (1 - R_reg).'
