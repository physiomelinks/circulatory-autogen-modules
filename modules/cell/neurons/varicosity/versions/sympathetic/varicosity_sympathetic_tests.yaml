module_type: varicosity
version: sympathetic
reviewed: false
description: 'Sympathetic-neuron varicosity (SN_simple''s SN_varicosity) built from its parts: a pass-through membrane (the
  axon sets V), four-compartment Ca handling with E_Ca, N-type Ca channel, NaCa exchanger, IP3R, RyR and NE release. Each
  submodule becomes <instance>_<submodule> in a model; the membrane takes the axon''s potential: per_submodule_inputs {"membrane":
  ["<axon>"]}; NE (synaptic_NE) is available from NE. Default parameters are SN_simple''s (its default instance). Split out
  of the monolithic SN_soma / SN_varicosity (sympathetic_monolithic_v01) by a one-off script (tools/build_sn_modules.py, removed;
  in git history). Tested through the neuron sympathetic version.'
expected_failures:
  phlynx_export_test: 'PhLynx has no supermodule support: it builds models from CellML module configs only, and a module_format
    "supermodule" entry (submodules expanded by libcuflynx) has no PhLynx form'
reference_proposals:
  B_Ca_init_Ca:
    reference: unreferenced_placeholder; owner's hand-set value in the SN_simple model (CA token 'user_defined'); at equilibrium
      with Cai_init the free buffer would be B_tot Kd/(Kd + Cai) = 7.990 mM (Kd = 80 uM)
    sourced: 'no'
  B_Ca_total_Ca:
    reference: 'Matveev2002; Table 1 ("actual" set): total of the FIXED (immobile) buffer 8 mM (= value). Matveev''s mobile
      buffer is 0.56 mM (Kd 4 uM); here the 8 mM is used for the model''s buffer'
    sourced: 'yes'
  Ca_ER_init_Ca:
    reference: unreferenced_placeholder; owner's hand-set value in the SN_simple model (CA token 'to_be_checked_in_neurons');
      0.6 mM is 2-10x the resting ER-lumen Ca measured in rat sensory neurons (60-270 uM, Solovyova2002, Abstract/Results)
    sourced: 'no'
    also_cites:
    - Solovyova2002
  Cai_init_Ca:
    reference: Wanaverbecq2003; resting [Ca2+]i 102 +- 4 nM (n = 83) in cultured rat superior cervical ganglion neurons (indo-1),
      Results, first section; 1e-4 mM = value. (Replaces the CA reference Hagiwara1981, which could not be opened)
    sourced: 'yes'
  Cao_Ca:
    reference: 'Tao2011; Supporting Material (Document S1) parameter list: [Ca2+]o = 2 mM (listed for the SA-node cell; no
      separate neuron value). Khaliq2003 also uses 2 mM'
