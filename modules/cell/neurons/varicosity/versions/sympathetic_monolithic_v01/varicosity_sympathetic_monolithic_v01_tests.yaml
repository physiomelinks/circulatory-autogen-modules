module_type: varicosity
version: sympathetic_monolithic_v01
reviewed: false
notes: 'Owner''s sympathetic varicosity: N-type Ca current, NCX, four-compartment Ca handling as in SN_soma, and a phenomenological
  NE release/reuptake driven by Cai above a baseline. The membrane potential is an input (from the axon), so alone the Ca-channel
  gates have exact solutions and total Ca is conserved up to the membrane fluxes.'
expected_failures:
  run_test: 'generation fails: the global constants R and F are in units J_per_MK / C_per_M in cell_parameters.csv and the
    Paci components, which are not defined anywhere (known issue), while the SN components declare the same globals as J_per_mol_K
    / C_per_mol (libcuflynx exits: ''units of J_per_MK in parameters.csv file does not match with units of J_per_mol_K in
    module_config.json for param R''). Fix: use the defined J_per_mol_K / C_per_mol everywhere (CellML, config, parameters)
    for R and F. With the proposed fixes applied to a copy of the library, all tests of this component pass.'
