module_type: soma
version: sympathetic_monolithic_v01
reviewed: false
notes: 'Owner''s sympathetic stellate-ganglion neuron soma ("SN_simple"): Na (NaV1.7-like and NaV1.6), L-type Ca, Kv2, Kv1.5,
  Kv4.2, BK, SK and M currents, NCX and Na/K pump, Na/K leaks, a four-compartment Ca model (sub-membrane, bulk, pre-ER and
  ER; mobile buffer; SERCA, RyR, IP3R, leak and diffusion) and Na/K concentrations. Every gating time constant has epsilon_tau
  = 0.1 ms added. Verified with exact conservation laws (charge, total Ca).'
reference_proposals:
  V_rest_approx:
    reference: 'Davis2020; resting membrane potential of rat stellate neurons: Wistar -72.6 +- 1.0 mV (Fig. 4C), SHR -70.3
      +- 1.4 mV (Fig. 5D); -70 mV approximates it (the Davis 2021 thesis cited by the CA token could not be found)'
    sourced: 'yes'
  h_BK_min:
    reference: 'Khaliq2003; Table 1 and bkpkj.mod: BK h y0 = 0.085 (= value)'
    sourced: 'yes'
  z_BK_coeff:
    reference: 'Khaliq2003; Methods Eq. 13 and bkpkj.mod: z_coef = 0.001 mM (= value)'
    sourced: 'yes'
  V_mid_m:
    reference: Tao2011; Supporting Material (Document S1) Eq. 86 (Belluzzi-Sacchi I_Na m_inf V1/2 = -36 mV, k = 7.2 mV); modified
      here to 20 mV (was 36)
    sourced: 'yes'
    also_cites:
    - BelluzziSacchi1991
