module_type: SN_Ca_handling_varicosity
version: nn
reviewed: false
notes: Four-compartment Ca of the SN varicosity, as SN_Ca_handling_soma except that the ER leak j_leak_Ca enters the sub-membrane
  Cai (not the bulk), as in the original SN_varicosity; also gives E_Ca = RT/F ln(Cao/Cai) (sic, no factor 1/2, as in the
  original). Built by tools/build_sn_modules.py; SN_simple_flat checks that the assembled parts reproduce SN_simple.
