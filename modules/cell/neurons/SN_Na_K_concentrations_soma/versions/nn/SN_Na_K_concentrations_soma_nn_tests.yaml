    / C_per_mol, but the module''s global rows in neurons_parameters.csv carry the undefined J_per_MK / C_per_M of the Paci/Tao
    components (libcuflynx exits: units in parameters.csv do not match module_config.json). Fix: the pending review question
    on unifying R and F to J_per_mol_K / C_per_mol. With that fix applied to a copy of the library this component''s run and
    invariant tests pass; it generates and reproduces SN_simple in SN_simple_flat.'
