- vessel_type: SN_varicosity
  BC_type: nn
  module_type: SN_varicosity
  sim_time: 0.2
  dt: 2.0e-05
  timestep:
    scheme: rk4
    dts:
    - 2.0e-06
    - 1.0e-06
    - 5.0e-07
    - 2.5e-07
    t_end: 0.002
    min_order: 0.8
    tol: 0.001
    cvode_tol: 0.01
  outputs:
  - c
  - hc
  - i_Ca_N
  - Cai
  - CaB_Cai
  - Ca_bulk
  - CaB_Ca_bulk
  - Ca_ER_pre
  - CaB_Ca_ER_pre
  - Ca_ER
  - j_Ca_N
  - j_NaCa_Ca
  - NE
  - h_IP3
  - c_RyR
  - hc_RyR
  invariants:
  - description: N-type Ca activation c matches the exact clamp solution c_inf(V) + (c_init - c_inf) exp(-t/tau), tau = |tau_c(V)|/1000
      + epsilon_tau (0.1 ms)
    expr: np.max(np.abs(c - ((1/(1 + np.exp(-(V + V_mid_c)/V_den_c))) + (c_init - (1/(1 + np.exp(-(V + V_mid_c)/V_den_c))))*np.exp(-t/(np.abs((tau_c_min
      + (tau_c_max - tau_c_min)/(1 + np.exp((V_mid_c - 20 + V)/V_den_c)))/1000) + 1e-4))))) <= 1e-6
  - description: inactivation hc matches its exact clamp solution (V_mid_hc = V_mid_c + 11, V_den_hc = V_den_c)
    expr: np.max(np.abs(hc - ((1/(1 + np.exp((V + V_mid_c + 11)/V_den_c))) + (hc_init - (1/(1 + np.exp((V + V_mid_c + 11)/V_den_c))))*np.exp(-t/(np.abs(tau_hc/1000)
      + 1e-4))))) <= 1e-6
  - description: total Ca (free + buffered, four compartments) changes only by the plasma-membrane fluxes j_Ca_N + j_NaCa_Ca
      (trapezoid integral)
    expr: np.max(np.abs(((Vol*(c_SL*(Cai + CaB_Cai) + (1 - c_SL - c_ER - c_ER_pre)*(Ca_bulk + CaB_Ca_bulk) + c_ER_pre*(Ca_ER_pre
      + CaB_Ca_ER_pre) + c_ER*Ca_ER)) - (Vol*(c_SL*(Cai + CaB_Cai) + (1 - c_SL - c_ER - c_ER_pre)*(Ca_bulk + CaB_Ca_bulk)
      + c_ER_pre*(Ca_ER_pre + CaB_Ca_ER_pre) + c_ER*Ca_ER))[0]) - np.concatenate(([0.0], np.cumsum(0.5*((j_Ca_N + j_NaCa_Ca)[1:]+(j_Ca_N
      + j_NaCa_Ca)[:-1])*np.diff(t)))))) <= 1e-3*np.max(np.abs(np.concatenate(([0.0], np.cumsum(0.5*((j_Ca_N + j_NaCa_Ca)[1:]+(j_Ca_N
      + j_NaCa_Ca)[:-1])*np.diff(t)))))) + 1e-23
  - description: NE never falls below its baseline NE_init
    expr: np.all(NE >= NE_init - 1e-12)
  - description: gates stay in [0, 1]
    expr: np.all((c >= -1e-6) & (c <= 1 + 1e-6)) & np.all((hc >= -1e-6) & (hc <= 1 + 1e-6)) & np.all((h_IP3 >= -1e-6) & (h_IP3
      <= 1 + 1e-6)) & np.all((c_RyR >= -1e-6) & (c_RyR <= 1 + 1e-6)) & np.all((hc_RyR >= -1e-6) & (hc_RyR <= 1 + 1e-6))
  - description: concentrations stay positive
    expr: np.all((Cai > 0) & (Ca_bulk > 0) & (Ca_ER > 0) & (Ca_ER_pre > 0))
  run_parameters:
    V: -10.0
  bc_sweep:
    factors:
    - 0.5
    - 1.0
    - 2.0
    ranges:
      V:
        min: -90.0
        max: 30.0
        points: 5
      NE_init:
        min: 0.0
        max: 0.001
        points: 3
      k_IP3:
        min: 0.0
        max: 3.0e-20
        points: 3
      B_Ca_init:
        min: 4.0
        max: 7.95
        points: 3
      B_Ca_total:
        min: 8.0
        max: 16.0
        points: 3
      h_IP3_init:
        min: 0.0
        max: 1.0
        points: 3
      c_init:
        min: 0.0
        max: 1.0
        points: 3
      hc_init:
        min: 0.0
        max: 1.0
        points: 3
    rationale: clamped varicosity potential -90 to +30 mV (rest to action-potential peak); NE baseline 0-1 uM; k_IP3 (0 by
      default) up to a small value; other constants by factors 0.5-2. Gate initial values over [0, 1]; the free-buffer initial
      value must not exceed B_Ca_total (the bound buffer would be negative), so B_Ca_init spans 4-7.95 mM and B_Ca_total 8-16
      mM.
  notes: 'Owner''s sympathetic varicosity: N-type Ca current, NCX, four-compartment Ca handling as in SN_soma, and a phenomenological
    NE release/reuptake driven by Cai above a baseline. The membrane potential is an input (from the axon), so alone the Ca-channel
    gates have exact solutions and total Ca is conserved up to the membrane fluxes.'
  reference_proposals:
    c_init:
      reference: unreferenced_placeholder; not given in Tao 2011 (no initial conditions listed); c_inf(-70 mV) is about 0.002
        with these parameters
      sourced: 'no'
    hc_init:
      reference: unreferenced_placeholder; not given in Tao 2011 (no initial conditions listed)
      sourced: 'no'
    V_mid_c:
