- vessel_type: electric_potentials_Paci_2013
  BC_type: nn
  module_type: electric_potentials_Paci_2013
  sim_time: 0.01
  dt: 0.001
  outputs:
  - E_Na
  - E_K
  - E_Ks
  - E_Ca
  invariants:
  - description: 'Nernst: E_Na = RT/F ln(Nao/Nai)'
    expr: np.max(np.abs(E_Na - R*T/F*np.log(Nao/Nai))) <= 1e-12
  - description: 'Nernst: E_K = RT/F ln(Ko/Ki)'
    expr: np.max(np.abs(E_K - R*T/F*np.log(Ko/Ki))) <= 1e-12
  - description: GHK-type I_Ks reversal E_Ks = RT/F ln((Ko + PkNa Nao)/(Ki + PkNa Nai))
    expr: np.max(np.abs(E_Ks - R*T/F*np.log((Ko + PkNa*Nao)/(Ki + PkNa*Nai)))) <= 1e-12
  - description: 'Nernst (z = 2): E_Ca = 0.5 RT/F ln(Cao/Cai)'
    expr: np.max(np.abs(E_Ca - 0.5*R*T/F*np.log(Cao/Cai))) <= 1e-12
  - description: E_Ks lies between E_K and E_Na
    expr: np.all((E_Ks >= E_K - 1e-12) & (E_Ks <= E_Na + 1e-12))
  bc_sweep:
    ranges:
      Nai:
        min: 5.0
        max: 20.0
        points: 4
      Cai:
        min: 1.0e-05
        max: 0.001
        points: 3
        scale: log
      T:
        min: 295.0
        max: 310.15
        points: 2
      R:
        min: 8.314
        max: 8.314
        points: 1
      F:
        min: 96485.0
        max: 96485.0
        points: 1
    rationale: intracellular Na 5-20 mM, Ca 1e-5 to 1e-3 mM, extracellular/intracellular constants by the default factors
      0.5-2, T room to body temperature; R and F are physical constants.
  notes: 'Paci 2013 reversal potentials (algebraic): Nernst potentials for Na, K and Ca and the Na-permeable I_Ks reversal.'
