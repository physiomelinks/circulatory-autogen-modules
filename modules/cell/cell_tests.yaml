- vessel_type: NE_release_Tao_2011
  BC_type: nn
  module_type: NE_release_Tao_2011
  sim_time: 0.05
  dt: 1.0e-05
  timestep:
    scheme: rk4
    dts:
    - 0.0001
    - 5.0e-05
    - 2.5e-05
    - 1.25e-05
    t_end: 0.01
    min_order: 0.8
    tol: 0.0001
    cvode_tol: 0.001
  outputs:
  - Cai
  - V_Ca
  - V_1Ca
  - V_2Ca
  - V_3Ca
  - V_4Ca
  - V_5Ca
  - NE
  invariants:
  - description: 'vesicle-site occupancy is conserved: V_Ca + V_1Ca + ... + V_5Ca stays at its initial total (all rate terms
      of the 5-site binding scheme cancel in the sum)'
    expr: np.max(np.abs((V_Ca + V_1Ca + V_2Ca + V_3Ca + V_4Ca + V_5Ca) - (V_Ca + V_1Ca + V_2Ca + V_3Ca + V_4Ca + V_5Ca)[0]))
      <= 1e-9
  - description: Cai is exactly Cai(t) = -i_Ca/(2 F V_Z 1e-6 K_Ca) (1 - exp(-K_Ca t)) from 0 for constant i_Ca
    expr: np.max(np.abs(Cai - (-i_Ca/(2*F*V_Z*1e-6*K_Ca))*(1 - np.exp(-K_Ca*t)))) <= 1e-6*max(1e-12, np.max(np.abs(Cai)))
  run_parameters:
    i_Ca: -0.1
  bc_sweep:
    ranges:
      i_Ca:
        min: -0.5
        max: 0.0
        points: 3
    rationale: N-type Ca current of a varicosity during an action potential is of the order of 0.1 nA or less.
  notes: 'Tao 2011 Ca-triggered NE release at a sympathetic varicosity: Ca entry into an active-zone volume V_Z, a 5-site
    Ca-binding scheme for vesicle fusion (calyx-of-Held kinetics), release rate E = gamma V_5Ca, NE in the cleft with reuptake
    P_up. NOTE: the occupancy states start at 0 (V_Ca = 0, so nothing can ever bind: the first state should start at the number
    of releasable vesicles/1) and several units are inconsistent (see review).'
  reference_proposals:
    i_Ca:
      reference: definitional; N-type Ca current supplied by the neuron in a network; 0 alone (test operating point)
      sourced: definitional
      value: 0.0
    K_off:
      reference: 'Tao2011; Supporting Material (Document S1) p. 8 parameter table: Koff = 9.5 /ms = 9500 /s (= SchneggenburgerNeher2000
        Fig. 3e koff 9,500 /s); config declares per_s, the CellML per_millis (9.5)'
      sourced: 'yes'
      value: 9500.0
    K_on:
      reference: 'Tao2011; Supporting Material (Document S1) p. 8 parameter table: Kon = 90 /(mM ms) = 90 m^3/(mmol s) (=
        SchneggenburgerNeher2000 kon 9e7 /(M s))'
      sourced: 'yes'
      value: 90.0
    K_Ca:
      reference: unreferenced_placeholder; Ca clearance rate K[Ca] of Tao 2011 Eq. 2 is not given numerically in the paper
        or supplement; 1000 /s (1 ms clearance) as an order of magnitude
      sourced: 'no'
      value: 1000.0
    b:
      reference: 'Tao2011; Supporting Material (Document S1) p. 8 parameter table: b = 0.25 (cooperativity; = SchneggenburgerNeher2000)'
      sourced: 'yes'
      value: 0.25
    gamma:
      reference: 'Tao2011; Supporting Material (Document S1) p. 8 parameter table: gamma = 6 /ms (= SchneggenburgerNeher2000
        6,000 /s); the module units m3_per_M_millis are inconsistent with E = gamma V_5Ca in per_millis'
      sourced: 'yes'
      value: 6.0
    C_m:
      reference: 'Tao2011; Supporting Material (Document S1) p. 8 parameter table: neuron Cm = 240 pF (declared but unused
        by the equations of this component)'
      sourced: 'yes'
      value: 240.0
    V_Z:
      reference: 'Tao2011; Supporting Material (Document S1) p. 8 parameter table: VZ = 10e-17 L (active-zone volume)'
      sourced: 'yes'
      value: 1.0e-16
    a:
      reference: 'Tao2011; main text (Eq. 3): a = 4000 NE molecules per vesicle'
      sourced: 'yes'
      value: 4000.0
    n:
      reference: 'Tao2011; main text (Eq. 3): n = 12 releasable vesicles per varicosity'
      sourced: 'yes'
      value: 12.0
    V_cleft:
      reference: 'Tao2011; Supporting Material (Document S1) p. 8 parameter table: Vcleft = 1.5e-15 L'
      sourced: 'yes'
      value: 1.5e-15
    P_up:
      reference: 'Tao2011; Supporting Material (Document S1) p. 8 parameter table: Pup = 10000 /ms (NE reuptake)'
      sourced: 'yes'
      value: 10000.0
    F:
      reference: CODATA2018; Faraday constant 96485.33212 C/mol, rounded to 96485 C/mol
      sourced: 'yes'
  expected_failures:
    run_test: 'generation fails: undefined units M_per_m3 and m3_per_M_millis (known issues), F in C_per_M (see R/F note),
      and the config declares K_off per_s / Cai M_per_m3 while the CellML uses per_millis / millimol_per_m3. With these defined/aligned
      on a copy the component runs and its invariants hold, but the model is not usable as is (see review: vesicle states
      start at 0, units of V_Ca and gamma).'
