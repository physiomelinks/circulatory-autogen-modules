module: cell
reviewed: false
known_issues:
- 'undefined units: C_per_M'
- 'undefined units: J_per_MK'
- 'undefined units: M_per_m3'
- 'undefined units: m3_per_M_millis'
- port variable d not in variables_and_units
defaults:
  sim_time: 2.0
  pre_time: 0.0
  dt: 0.01
  solver: CVODE_myokit
  bc_sweep:
    factors:
    - 0.5
    - 0.75
    - 1.0
    - 1.5
    - 2.0
    ranges: {}
  timestep:
    scheme: rk4
    dts:
    - 0.004
    - 0.002
    - 0.001
    - 0.0005
    min_order: 0.8
    tol: 0.0001
    cvode_tol: 0.001
  stability:
    supported:
    - solver: CVODE_myokit
      rtol: 1.0e-06
      atol: 1.0e-08
  solver_info:
    rtol: 1.0e-08
    atol: 1.0e-10
components:
- vessel_type: myocyte_membrane_voltage
  BC_type: nn
  module_type: myocyte_membrane_voltage
  sim_time: 0.02
  dt: 0.0001
  timestep:
    scheme: rk4
    dts:
    - 0.002
    - 0.001
    - 0.0005
    - 0.00025
    t_end: 0.02
    min_order: 0.8
    tol: 0.0001
    cvode_tol: 0.001
  outputs:
  - Vm
  invariants:
  - description: 'with the currents held constant, Vm is exactly linear: Vm = Vm_init - (sum of ionic currents - i_stim) t
      (currents in A/F = V/s, as Paci 2013 dVm/dt = -(I_ion - I_stim)/Cm)'
    expr: np.max(np.abs(Vm - (Vm_init - (i_CaL + i_K1 + i_f + i_Na + i_Kr + i_Ks + i_to + i_PCa + i_NaK + i_NaCa + i_b_Ca
      + i_b_Na - i_stim)*t))) <= 1e-7
  run_parameters:
    i_Na: -2.0
    i_K1: 0.5
    i_stim: 1.0
  bc_sweep:
    ranges:
      i_CaL:
        min: -10.0
        max: 10.0
        points: 3
      i_K1:
        min: -10.0
        max: 10.0
        points: 3
      i_f:
        min: -10.0
        max: 10.0
        points: 3
      i_Na:
        min: -10.0
        max: 10.0
        points: 3
      i_Kr:
        min: -10.0
        max: 10.0
        points: 3
      i_Ks:
        min: -10.0
        max: 10.0
        points: 3
      i_to:
        min: -10.0
        max: 10.0
        points: 3
      i_PCa:
        min: -10.0
        max: 10.0
        points: 3
      i_NaK:
        min: -10.0
        max: 10.0
        points: 3
      i_NaCa:
        min: -10.0
        max: 10.0
        points: 3
      i_b_Ca:
        min: -10.0
        max: 10.0
        points: 3
      i_b_Na:
        min: -10.0
        max: 10.0
        points: 3
      i_stim:
        min: -10.0
        max: 10.0
        points: 3
      Vm_init:
        min: -0.1
        max: 0.05
        points: 4
    rationale: each current over +/-10 A/F (covers the hiPSC-CM range apart from the I_Na upstroke peak, whose value does
      not change the linear-integration check), Vm_init -100 to +50 mV.
  notes: 'Membrane potential of the Paci 2013 hiPSC-CM: dVm/dt = -(sum of 12 ionic currents - i_stim), currents normalised
    by capacitance (A/F). Alone, with the currents as constant inputs, the solution is exactly linear in time.'
  reference_proposals:
    i_CaL:
      reference: definitional; i_CaL is supplied by a connected module in a network; 0 alone (test operating point)
      sourced: definitional
      value: 0.0
    i_K1:
      reference: definitional; i_K1 is supplied by a connected module in a network; 0 alone (test operating point)
      sourced: definitional
      value: 0.0
    i_f:
      reference: definitional; i_f is supplied by a connected module in a network; 0 alone (test operating point)
      sourced: definitional
      value: 0.0
    i_Na:
      reference: definitional; i_Na is supplied by a connected module in a network; 0 alone (test operating point)
      sourced: definitional
      value: 0.0
    i_Kr:
      reference: definitional; i_Kr is supplied by a connected module in a network; 0 alone (test operating point)
      sourced: definitional
      value: 0.0
    i_Ks:
      reference: definitional; i_Ks is supplied by a connected module in a network; 0 alone (test operating point)
      sourced: definitional
      value: 0.0
    i_to:
      reference: definitional; i_to is supplied by a connected module in a network; 0 alone (test operating point)
      sourced: definitional
      value: 0.0
    i_PCa:
      reference: definitional; i_PCa is supplied by a connected module in a network; 0 alone (test operating point)
      sourced: definitional
      value: 0.0
    i_NaK:
      reference: definitional; i_NaK is supplied by a connected module in a network; 0 alone (test operating point)
      sourced: definitional
      value: 0.0
    i_NaCa:
      reference: definitional; i_NaCa is supplied by a connected module in a network; 0 alone (test operating point)
      sourced: definitional
      value: 0.0
    i_b_Ca:
      reference: definitional; i_b_Ca is supplied by a connected module in a network; 0 alone (test operating point)
      sourced: definitional
      value: 0.0
    i_b_Na:
      reference: definitional; i_b_Na is supplied by a connected module in a network; 0 alone (test operating point)
      sourced: definitional
      value: 0.0
    i_stim:
      reference: definitional; i_stim is supplied by a connected module in a network; 0 alone (test operating point)
      sourced: definitional
      value: 0.0
    Vm_init:
      reference: 'Paci2013; initial membrane potential in the authors'' CellML (PMR workspace sseveri/paci_hyttinen_aaltosetala_severi_2013,
        ventricularVersion): Vm_init = -0.074334 V'
      sourced: 'yes'
      value: -0.0743340057623841
  validation:
    baseline:
      status: not_applicable
      reason: a pure charge integrator; validation belongs to the assembled Paci 2013 cell (action potential against Ma et
        al. 2011 hiPSC-CM data).
    calibrate:
      status: not_applicable
      reason: no free parameters besides the initial value.
- vessel_type: sympathetic_neuron_membrane_voltage
  BC_type: nn
  module_type: sympathetic_neuron_membrane_voltage
  sim_time: 0.02
  dt: 0.0001
  timestep:
    scheme: rk4
    dts:
    - 0.002
    - 0.001
    - 0.0005
    - 0.00025
    t_end: 0.02
    min_order: 0.8
    tol: 0.0001
    cvode_tol: 0.001
  outputs:
  - Vm
  - Vm_volt
  invariants:
  - description: 'with constant currents Vm is exactly linear: Vm = Vm_init - 1e6 (sum I - i_stim)/C_m t (nA/pF = 1e6 mV/s)'
    expr: np.max(np.abs(Vm - (Vm_init - 1e6*(i_Ca + i_Na + i_A + i_KV + i_KCa - i_stim)/C_m*t))) <= 1e-6*max(1.0, np.max(np.abs(Vm)))
  - description: Vm_volt = Vm/1000
    expr: np.max(np.abs(Vm_volt - Vm/1000)) <= 1e-12
  run_parameters:
    i_Na: -0.1
    i_KV: 0.02
    i_stim: 0.02
  bc_sweep:
    ranges:
      i_Ca:
        min: -1.0
        max: 1.0
        points: 3
      i_Na:
        min: -1.0
        max: 1.0
        points: 3
      i_A:
        min: -1.0
        max: 1.0
        points: 3
      i_KV:
        min: -1.0
        max: 1.0
        points: 3
      i_KCa:
        min: -1.0
        max: 1.0
        points: 3
      i_stim:
        min: -1.0
        max: 1.0
        points: 3
      Vm_init:
        min: -90.0
        max: 30.0
        points: 4
      C_m:
        min: 10.0
        max: 200.0
        points: 3
        scale: log
    rationale: currents +/-1 nA (a sympathetic neuron action potential reaches a few nA of I_Na at most), Vm_init -90 to +30
      mV, C_m 10-200 pF (small to large ganglion neurons).
  notes: 'Membrane potential of the Tao 2011 sympathetic neuron: dVm/dt = -(I_Ca + I_Na + I_A + I_KV + I_KCa - i_stim)/C_m
    (nA, pF, mV, s). Alone with constant currents the solution is exactly linear.'
  reference_proposals:
    i_Ca:
      reference: definitional; i_Ca is supplied by a connected module in a network; 0 alone (test operating point)
      sourced: definitional
      value: 0.0
    i_Na:
      reference: definitional; i_Na is supplied by a connected module in a network; 0 alone (test operating point)
      sourced: definitional
      value: 0.0
    i_A:
      reference: definitional; i_A is supplied by a connected module in a network; 0 alone (test operating point)
      sourced: definitional
      value: 0.0
    i_KV:
      reference: definitional; i_KV is supplied by a connected module in a network; 0 alone (test operating point)
      sourced: definitional
      value: 0.0
    i_KCa:
      reference: definitional; i_KCa is supplied by a connected module in a network; 0 alone (test operating point)
      sourced: definitional
      value: 0.0
    i_stim:
      reference: definitional; i_stim is supplied by a connected module in a network; 0 alone (test operating point)
      sourced: definitional
      value: 0.0
    C_m:
      reference: 'Tao2011; Supporting Material (Document S1) p. 8 parameter table: neuron Cm = 240 pF'
      sourced: 'yes'
      value: 240.0
    Vm_init:
      reference: unreferenced_placeholder; -60 mV, near the resting potential of rat sympathetic neurones; Tao 2011 lists
        no initial conditions
      sourced: 'no'
      value: -60.0
  validation:
    baseline:
      status: not_applicable
      reason: a pure charge integrator; validation belongs to the assembled Tao 2011 neuron (action potential shape).
    calibrate:
      status: not_applicable
      reason: no free parameters besides C_m and the initial value.
  expected_failures:
    run_test: 'generation fails: Vm_volt is exposed in the config but has no interface in the CellML; fix: public_interface=''out''.
      With the proposed fixes applied to a copy of the library, all tests of this component pass.'
    verification_test_invariants: 'generation fails: Vm_volt is exposed in the config but has no interface in the CellML;
      fix: public_interface=''out''. With the proposed fixes applied to a copy of the library, all tests of this component
      pass.'
    verification_test_BC: 'generation fails: Vm_volt is exposed in the config but has no interface in the CellML; fix: public_interface=''out''.
      With the proposed fixes applied to a copy of the library, all tests of this component pass.'
    verification_test_timestep: 'generation fails: Vm_volt is exposed in the config but has no interface in the CellML; fix:
      public_interface=''out''. With the proposed fixes applied to a copy of the library, all tests of this component pass.'
    stability_test: 'generation fails: Vm_volt is exposed in the config but has no interface in the CellML; fix: public_interface=''out''.
      With the proposed fixes applied to a copy of the library, all tests of this component pass.'
- vessel_type: Ca_dynamics_Paci_2013
  BC_type: nn
  module_type: Ca_dynamics_Paci_2013
  sim_time: 0.5
  dt: 0.0005
  timestep:
    scheme: rk4
    dts:
    - 0.0005
    - 0.00025
    - 0.000125
    - 6.25e-05
    t_end: 0.1
    min_order: 0.8
    tol: 0.0001
    cvode_tol: 0.001
  outputs:
  - Cai
  - Ca_SR
  - g
  - i_up
  - i_rel
  - i_leak
  invariants:
  - description: 'total Ca content (free + rapidly buffered, cytosol + SR, in um^3 mM) changes only by the sarcolemmal fluxes:
      Q(t) = Q(0) - (I_CaL + I_bCa + I_PCa - 2 I_NaCa) Cm/(2 F 1e-18) t (exact for constant currents; SR uptake, release and
      leak cancel)'
    expr: np.max(np.abs(((Vc*(Cai + Buf_C*Cai/(Cai + Kbuf_C)) + V_SR*(Ca_SR + Buf_SR*Ca_SR/(Ca_SR + Kbuf_SR))) - (Vc*(Cai
      + Buf_C*Cai/(Cai + Kbuf_C)) + V_SR*(Ca_SR + Buf_SR*Ca_SR/(Ca_SR + Kbuf_SR)))[0]) + (i_CaL + i_b_Ca + i_PCa - 2*i_NaCa)*Cm/(2*F*1e-18)*t))
      <= 1e-5*np.max(np.abs((Vc*(Cai + Buf_C*Cai/(Cai + Kbuf_C)) + V_SR*(Ca_SR + Buf_SR*Ca_SR/(Ca_SR + Kbuf_SR))))) + 1e-9
  - description: Ca2+ release gate g stays in [0, 1]
    expr: np.all((g >= -1e-9) & (g <= 1 + 1e-9))
  - description: SERCA uptake i_up = VmaxUp/(1 + Kup^2/Cai^2) (Paci 2013)
    expr: np.max(np.abs(i_up - VmaxUp/(1 + Kup**2/Cai**2))) <= 1e-9*VmaxUp
  - description: leak i_leak = V_leak (Ca_SR - Cai)
    expr: np.max(np.abs(i_leak - V_leak*(Ca_SR - Cai))) <= 1e-12
  run_parameters:
    i_CaL: -0.5
    i_NaCa: 0.1
    Ca_SR_init: 0.3
  bc_sweep:
    ranges:
      i_CaL:
        min: -3.0
        max: 0.0
        points: 3
      i_PCa:
        min: 0.0
        max: 0.4
        points: 3
      i_b_Ca:
        min: -0.5
        max: 0.5
        points: 3
      i_NaCa:
        min: -0.5
        max: 0.5
        points: 3
      Vm:
        min: -0.1
        max: 0.05
        points: 3
      Cai_init:
        min: 1.0e-05
        max: 0.001
        points: 3
        scale: log
      Ca_SR_init:
        min: 0.05
        max: 1.0
        points: 3
      g_init:
        min: 0.0
        max: 1.0
        points: 3
    rationale: currents over the ranges seen during a Paci 2013 beat (I_CaL down to about -3 A/F, others below 0.5 A/F), Vm
      -100 to +50 mV (both sides of the -60 mV threshold of const2), Cai 1e-5 to 1e-3 mM, Ca_SR 0.05-1 mM (positive, physiological),
      g over [0, 1]; constants by the default factors 0.5-2.
  notes: 'Paci 2013 intracellular Ca handling: cytosolic Cai and SR Ca_SR with rapid buffering (Buf_C, Buf_SR), SERCA uptake
    i_up, release i_rel (gated by the L-type d gate and g) and leak. d comes from the I_CaL d gate. With the sarcolemmal currents
    held constant the total Ca content changes linearly (exact conservation law).'
  reference_proposals:
    a_rel:
      reference: 'Paci2013; value in the authors'' CellML (PMR workspace sseveri/paci_hyttinen_aaltosetala_severi_2013, ventricularVersion):
        a_rel = 16.464'
      sourced: 'yes'
      value: 16.464
    b_rel:
      reference: 'Paci2013; value in the authors'' CellML (PMR workspace sseveri/paci_hyttinen_aaltosetala_severi_2013, ventricularVersion):
        b_rel = 0.25'
      sourced: 'yes'
      value: 0.25
    c_rel:
      reference: 'Paci2013; value in the authors'' CellML (PMR workspace sseveri/paci_hyttinen_aaltosetala_severi_2013, ventricularVersion):
        c_rel = 8.232'
      sourced: 'yes'
      value: 8.232
    tau_g:
      reference: 'Paci2013; value in the authors'' CellML (PMR workspace sseveri/paci_hyttinen_aaltosetala_severi_2013, ventricularVersion):
        tau_g = 0.002'
      sourced: 'yes'
      value: 0.002
    Kup:
      reference: 'Paci2013; value in the authors'' CellML (PMR workspace sseveri/paci_hyttinen_aaltosetala_severi_2013, ventricularVersion):
        Kup = 0.00025'
      sourced: 'yes'
      value: 0.00025
    Buf_C:
