  outputs:
  - V
  - I
  - I_channels
  invariants:
  - description: 'exact RC relaxation: V = V_in + (V_rest_approx - V_in) exp(-t (1 + channel_ratio) 1e6/(R C)) (MOhm, pF,
      s)'
    expr: np.max(np.abs(V - (V_in + (V_rest_approx - V_in)*np.exp(-t*(1 + channel_ratio)*1e6/(R*C))))) <= 1e-6*max(1.0, np.max(np.abs(V)))
  - description: I = (V_in - V)/R and I_channels = channel_ratio I
    expr: np.max(np.abs(I - (V_in - V)/R)) + np.max(np.abs(I_channels - channel_ratio*I)) <= 1e-9
  run_parameters:
    V_in: -20.0
  bc_sweep:
    ranges:
      V_in:
        min: -90.0
        max: 40.0
        points: 5
      V_rest_approx:
        min: -80.0
        max: -50.0
        points: 3
      channel_ratio:
        min: 0.0
        max: 2.0
        points: 3
    rationale: soma potential -90 to +40 mV; resting potential -80 to -50 mV; channel_ratio 0-2; R and C by 0.5-2.
  notes: 'Owner''s passive axon segment: axial current I = (V_in - V)/R from the soma, plus a lumped "channel" current proportional
    to it (channel_ratio), charging C. Exact RC solution for a constant soma potential.'
  reference_proposals:
    channel_ratio:
      reference: unreferenced_placeholder; owner's hand-set value in the SN_simple model (CA token 'user_defined')
      sourced: 'no'
    C:
      reference: unreferenced_placeholder; owner's hand-set value in the SN_simple model (CA token 'to_be_determined')
      sourced: 'no'
    R:
      reference: unreferenced_placeholder; owner's hand-set value in the SN_simple model (CA token 'to_be_determined')
      sourced: 'no'
    V_rest_approx:
      reference: unreferenced_placeholder; owner's value (-70 mV, same as SN_soma, cf. Davis2020)
      sourced: 'no'
    V_in:
      reference: definitional; soma potential supplied by SN_soma in a network; -70 mV (= V_rest_approx) alone
      sourced: definitional
      value: -70.0
  validation:
    baseline:
      status: not_applicable
      reason: phenomenological cable stand-in; no directly comparable measurement.
    calibrate:
      status: not_applicable
      reason: R and C would need conduction-delay data; none chosen.
review:
  comment: Seven of nine components do not generate as committed. R and F carry units J_per_MK/C_per_M (undefined) in the
    parameters file and Paci components but J_per_mol_K/C_per_mol in the SN components, so libcuflynx exits for the SN soma/varicosity
    too; Ca_dynamics_Paci_2013 has Vm 'dimensionless' vs volt, the unlisted port variable d and five outputs without interface;
    Vm_volt has no interface. NE_release_Tao_2011 is a prototype with inconsistent units (V_Ca.. in J_per_M, gamma m3_per_M_millis)
    and all vesicle states starting at 0 so nothing can bind. SN_soma's Nai balance omits i_Na1_6, adds epsilon_tau = 0.1
    ms to every time constant, and several CA references are wrong or unverifiable (Nai_mid_NaK is Paci's 40 mM, not Lindblad's
    11; tau_z_BK 5 vs Khaliq 1 ms).
  summary: '9 components: Paci 2013 membrane potential, Ca handling, Na balance and reversal potentials; Tao 2011 sympathetic-neuron
    membrane and NE release; the owner''s sympathetic neuron soma, varicosity and axon (SN_simple). Specs with exact checks
    throughout: linear charge/mass integrators, total-Ca conservation (Paci SR+cytosol; SN four compartments), Nernst identities,
    full charge conservation for the SN soma, exact clamp solutions for the varicosity Ca gates and the axon RC. ~180 SN references
    checked (web, Crossref): most Channelpedia/Khaliq/Shannon/Li-Rinzel/Tao/Martin values confirmed, several flagged. In the
    repo only myocyte_membrane_voltage and SN_axon generate; with the proposed unit/interface fixes on a patched copy, every
    component passes every test (NE_release only trivially: its vesicle states stay identically 0).'
  questions:
  - Approve unifying the units of the globals R and F to the defined J_per_mol_K / C_per_mol (CellML, config and parameters)
    - this alone unblocks electric_potentials, Na_dynamics, SN_soma and SN_varicosity.
  - 'Ca_dynamics_Paci_2013: Ca_SR initial value in the original Paci CellML is NEGATIVE (-0.2734 mM). Keep it (faithful),
    or use a positive quasi-steady value? The tests run at Ca_SR_init = 0.3 mM.'
  - 'SN_soma: j_Na1_6 is computed but not included in dNai/dt (i_Na1_6 changes V but no ion pool). Intended? The charge-conservation
    invariant accounts for it explicitly.'
  - 'SN_soma: I_in enters dV/dt with the sign of an outward current (positive I_in hyperpolarises). Intended convention?'
  - 'SN_soma/varicosity: epsilon_tau = 0.1 ms is added to every gating time constant, which dominates the fast Na activation
    (tau_m 0.06 ms in Belluzzi-Sacchi). Intended?'
  - 'References to correct: Nai_mid_NaK = 40 mM is Paci 2013''s Km_Na (Lindblad 1996 uses 11 mM); tau_z_BK = 5 ms vs Khaliq
    2003 1 ms; tau_w_min cited to Gupta 2016 (an SK bladder paper) looks wrong; g_KCa_BK ''70 uS/cm2 in Khaliq'' - units could
    not be confirmed; K_mr in SN_varicosity also ''was 1.7''.'
  - 'Unverifiable CA references (full text or thesis not accessible): Matveev2002 (buffer), Gupta2016 (SK), BoronBoulpaep2017,
    Hagiwara1981, Bennett1998 (varicosity volume), Wu2012 (soma volume), Davis 2021 thesis/transcriptomic (Cm 30 pF, g_M,
    g_Kv2). Can you supply them? They are proposed with sourced: no.'
  - 'NE_release_Tao_2011: Tao 2011 values proposed (Koff 9.5/ms, Kon 90/(mM ms), b 0.25, gamma 6/ms, VZ 1e-16 L, Vcleft 1.5e-15
    L, Pup 1e4/ms, n 12, a 4000; = Schneggenburger & Neher 2000). K_Ca is not given in Tao 2011 (placeholder 1000/s). Tao
    Eq. 2 multiplies i_Ca by Cm (current per capacitance); here C_m is unused. Rework the component (units, V_Ca initial occupancy)
    before review?'
  - 'sympathetic_neuron_membrane_voltage: C_m = 240 pF (Tao 2011 table) proposed; Vm_init -60 mV placeholder. OK?'
  - 'SN_soma/varicosity sweeps: B_Ca_init must stay below B_Ca_total (else the bound buffer is negative and the run fails).
    Consider parametrising the initial buffer as a fraction.'
  - Validation is pending everywhere except the pure integrators (not_applicable). Can you supply stellate-neuron current-clamp
    traces (Paterson group / Davis) for SN_soma baseline and calibration of the to_be_identified conductances?
  proposed_fixes:
  - 'cell_modules.cellml, cell_modules_config.json, cell_parameters.csv: R in J_per_mol_K and F in C_per_mol everywhere (replace
    J_per_MK / C_per_M).'
  - 'Ca_dynamics_Paci_2013: Vm units ''dimensionless'' -> ''volt'' (config and parameters); add [''d'', ''dimensionless'',
    ''access'', ''boundary_condition''] and a parameters row; public_interface=''out'' for Ca_SR, g, i_up, i_rel, i_leak.'
  - 'sympathetic_neuron_membrane_voltage: public_interface=''out'' for Vm_volt.'
  - 'NE_release_Tao_2011: define M_per_m3 / m3_per_M_millis or (better) use millimol_per_m3 and per_millis consistently; config
    K_off per_s -> per_millis and Cai M_per_m3 -> millimol_per_m3 (as the CellML); give V_Ca a non-zero initial occupancy.'
  findings:
  - 'Patched copy: Ca_dynamics total-Ca conservation holds to 1e-5 relative across 104 sweep runs; SN_soma charge conservation
    (Cm dV = F(Vol dNa + Vol dK + 2 dN_Ca) + external/Na1.6 charge) and four-compartment Ca conservation hold at the run point
    and over 366 sweep runs; SN varicosity gate exact solutions and Ca conservation hold over 191 sweep runs.'
  - 'SN_soma and SN_varicosity are stiff (buffer binding ~8e5 /s, diffusion ~1.5e5 /s): RK4 needs dt <= 2e-6 s.'
  - Paci Ca_dynamics nominal run uses the negative Ca_SR initial value of the original CellML; invariants still hold.
