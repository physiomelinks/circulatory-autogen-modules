reviewed: false
notes: 'Paci 2013 intracellular Na: dNai/dt = -Cm (I_Na + I_bNa + 3 I_NaK + 3 I_NaCa)/(F Vc). Linear in time for constant
  currents.


  Ports of the versions of ion_concentrations (they differ; allowed and documented, see modules/README.md, Versions):

  entrance internal_Na: cardiomyocyte_Paci2013_v01 [Nai]; SN_soma_Argus2026_v01 -

  exit NaCa_current: cardiomyocyte_Paci2013_v01 [i_NaCa]; SN_soma_Argus2026_v01 -

  exit NaK_current: cardiomyocyte_Paci2013_v01 [i_NaK]; SN_soma_Argus2026_v01 -

  exit Na_current: cardiomyocyte_Paci2013_v01 [i_Na]; SN_soma_Argus2026_v01 -

  exit b_Na_current: cardiomyocyte_Paci2013_v01 [i_b_Na]; SN_soma_Argus2026_v01 -

  exit internal_Na: cardiomyocyte_Paci2013_v01 [Nai]; SN_soma_Argus2026_v01 -

  general E_K_potential: cardiomyocyte_Paci2013_v01 -; SN_soma_Argus2026_v01 [E_K]

  general K_flux: cardiomyocyte_Paci2013_v01 -; SN_soma_Argus2026_v01 [j_K_total]

  general Na_Nernst_potential: cardiomyocyte_Paci2013_v01 -; SN_soma_Argus2026_v01 [E_Na]

  general Na_flux: cardiomyocyte_Paci2013_v01 -; SN_soma_Argus2026_v01 [j_Na_total]

  general compartment_volume: cardiomyocyte_Paci2013_v01 -; SN_soma_Argus2026_v01 [Vol]

  general internal_Na: cardiomyocyte_Paci2013_v01 -; SN_soma_Argus2026_v01 [Nai]'
