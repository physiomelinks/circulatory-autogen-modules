description: 'Cytosolic Na and K of the sympathetic-neuron soma: Vol dNai/dt = j_Na_total and Vol dKi/dt = j_K_total, the
  summed ion fluxes of the channels connected through the Na_flux / K_flux ports (multi_port sums), and the Nernst potentials
  E_Na = 1000 RT/F ln(Nao/Nai), E_K = 1000 RT/F ln(Ko/Ki) (mV) they give back to the channels. Tested in a harness with the
  Na and K leak channels at a fixed V, where the amounts change exactly by the integrated fluxes.'
notes: 'Cytosolic Na and K of the SN soma: Vol dNai/dt = j_Na_total, Vol dKi/dt = j_K_total (the ion fluxes of the channels
  connected through Na_flux / K_flux), and their Nernst potentials E_Na, E_K. Split out of the monolithic SN_soma / SN_varicosity
  (sympathetic_monolithic_v01) by a one-off script (tools/build_sn_modules.py, removed; in git history); SN_simple_flat checks
  that the assembled parts reproduce SN_simple. Geometry (2026-10-02): Vol is now an input (compartment_volume port) supplied
  by the membrane, Vol = k_V d^3; the value here is used when unconnected. Temperature (review 2026-10-05): the model is at
  room temperature, T = 295.15 K (22 degC), like the Davis 2021 thesis recordings it is calibrated to (was 310.15 K); this
  enters the Nernst/GHK terms.


  Ports of the versions of ion_concentrations (they differ; allowed and documented, see modules/README.md, Versions):

  entrance internal_Na: cardiomyocyte_Paci2013_v01 [Nai]; SN_soma_Argus2026_v01 -

