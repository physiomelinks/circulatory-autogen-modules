module_type: i_Kr_Xr1_gate
version: Paci2013_v01
reviewed: false
notes: 'Paci 2013 hiPSC-CM I_Kr activation Xr1 (V_half from the Ca-dependent formula of Paci 2013, using R, T, F, Cao, Q,
  L0) gate: dXr1/dt = (Xr1_inf(Vm) - Xr1)/tau_Xr1(Vm). Alone the membrane voltage is a boundary condition, i.e. a voltage
  clamp, so the gate has the exact solution used as the invariant. The run point steps the clamp from rest (-74.3 mV) to -20
  mV.'
known_issues:
- 'undefined units: C_per_M'
- 'undefined units: J_per_MK'
expected_failures:
  run_test: 'generation fails: Vm is declared ''dimensionless'' in ion_channel_modules_config.json (and the parameters file)
    but ''volt'' in the CellML, so the connection is rejected (Myokit: ''Connected variables must have compatible units'').
    Fix: declare Vm as volt in the config and parameters file. Also V_half is exposed in the config but has no interface in
    the CellML (fix: public_interface=''out''). Also R and F use the undefined units J_per_MK / C_per_M (known issue); fix:
    define them (joule/(mole kelvin), coulomb/mole) in ion_channel_units.cellml. With the proposed fix applied to a copy of
    the library, all tests of this component pass.'
