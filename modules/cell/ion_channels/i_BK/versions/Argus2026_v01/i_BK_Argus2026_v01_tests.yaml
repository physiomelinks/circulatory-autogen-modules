module_type: i_BK
version: Argus2026_v01
reviewed: true
description: 'BK (large-conductance Ca- and voltage-activated) K current of the sympathetic-neuron soma: i_KCa_BK = g m^3
  h z^2 (V - E_K), g = A rho gamma; Khaliq 2003 kinetics re-expressed around the gates'' midpoints, with the owner''s 1.505
  ms tau_m offset and a 6 mV leftward shift; z reads the shell Ca.'
notes: 'Copied verbatim from the owner''s SN_soma (now soma sympathetic_monolithic_v01 in modules/cell/neuron/soma, the SN_simple
  sympathetic neuron); every gating time constant has epsilon_tau = 0.001 ms (was 0.1 ms; changed on review 2026-10-02) added,
  as in the original. BK (large-conductance Ca-activated K) current of the SN soma, i_KCa_BK = g_KCa_BK m^3 h z (V - E_K),
  z driven by the sub-membrane Cai (Khaliq 2003 kinetics). z starts at its steady state at Cai_init. Split out of the monolithic
  SN_soma / SN_varicosity (sympathetic_monolithic_v01) by a one-off script (tools/build_sn_modules.py, removed; in git history);
  SN_simple_flat checks that the assembled parts reproduce SN_simple. BK follows Khaliq et al. 2003 (ModelDB 48332, bkpkj.mod):
  i = g m^3 z^2 h (V - E_K), z_inf = 1/(1 + z_coeff/Cai), tau_m = 1.505 + 1000/(exp((V + V_mid_m + 57.5)/10.1) + exp(-(V +
  V_mid_m - 62.2)/10)) ms, tau_h = 1.9 + 1000/(exp((V + V_mid_h + 16.5)/5.2) + exp(-(V + V_mid_h - 86.2)/12.9)) ms, with V_mid_m
  = V_mid_h - 3.1; at Khaliq''s midpoints (28.9, 32 mV) these are Khaliq''s 86.4, 33.3, 48.5, 54.2. Corrected 2026-10-02 from
  z^1 and offsets 80.2/39.5/90.2 (which reproduced Khaliq only with V_mid_m = 6.2, the slope). Deliberate differences from
  Khaliq: the tau_m constant is 1.505 ms (Khaliq 0.505 ms); V_mid_h is 26 mV (Khaliq 32); the +5 mV shift of V in Khaliq''s
  .mod is not applied. Geometry re-parameterisation (2026-10-02): the maximal conductance is g_KCa_BK = A_mem rho_BK gamma_BK
  (membrane area x channel density x single-channel conductance, 1e-6 uS/pS), A_mem from the membrane through membrane_area;
  the defaults reproduce the previous g_KCa_BK. Temperature (review 2026-10-05): the model is at room temperature, T = 295.15
  K (22 degC), like the Davis 2021 thesis recordings it is calibrated to; every gating time constant is divided by phi = Q10^((T
  - T_ref)/10 K) (Q10_BK, T_ref_BK). T_ref defaults to 295.15 K, so phi = 1 and the kinetics are unchanged; setting T_ref
  to the source''s recording temperature (on review) scales them, and the model can be run at 37 degC by changing T. tau_m:
  khaliq2003contribution; Methods Eq. 10: tau_m = 0.505 ms + 1/(exp((Vm+86.4)/10.1) + exp((Vm-33.3)/-10)) s, re-expressed around V_mid_m
  (57.5 = 86.4 - 28.9, 62.2 = 33.3 + 28.9); **offset raised here to 1.505 ms (was 0.505) ''to allow for g_Na to not be instantly
  blocked'' (CA 837d3aae, 2024-07-21)**. ModelDB 48332 evaluates the same at Vm + 5 mV. tau_h: khaliq2003contribution; Methods: tau_h
  = 1.9 ms + 1/(exp((Vm+48.5)/5.2) + exp((Vm-54.2)/-12.9)) s (= source, re-expressed around V_mid_h: 16.5 = 48.5 - 32, 86.2
  = 54.2 + 32).'
known_issues:
- 'Python/C generation unsupported: gate states start from computed initial values (e.g. m_init = m_inf(V_rest_approx)), which
  libCellML''s analyser rejects, so solve_ivp (and C/C++) can''t generate the model; CVODE/Myokit runs it. Kept on review
  (2026-10-03).'
