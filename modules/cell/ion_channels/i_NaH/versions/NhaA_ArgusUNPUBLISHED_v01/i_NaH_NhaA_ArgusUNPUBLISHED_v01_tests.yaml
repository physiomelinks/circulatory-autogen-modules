notes: 'NhaA, the main Na+/H+ antiporter of E. coli: 1 Na+ out for 2 H+ in (taglicht1993proton), electrogenic (+1 charge in
  per cycle), driven by the proton motive force. The cycle free energy over F is V + E_Na - 2 E_H (Na+ out costs E_Na - V,
  each H+ in gives V - E_H), and the rate is the linear flux-force law r = A_mem g_spec drive/F, the exchanger analogue of
  an Ohmic leak (placeholder kinetics; thermodynamics exact). It cannot hold Na+ down when V + E_Na > 2 E_H: in modern seawater
  (pH 8.1) at -105 mV with 20 mM Na+ inside it would run backwards, which is why marine bacteria add primary Na+ pumps. NhaA
  is strongly activated at alkaline pH; that regulation is not modelled.'
