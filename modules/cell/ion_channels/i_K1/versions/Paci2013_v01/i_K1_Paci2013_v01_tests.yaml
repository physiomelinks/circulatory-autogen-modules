notes: 'Paci 2013 hiPSC-CM (ventricular-like) inward rectifier I_K1 = g_K1 XK1_inf(Vm - E_K) (Vm - E_K) sqrt(Ko/5.4). NOTE:
  the Paci 2013 beta_K1 has a NEGATIVE term (-1.509 e^{...}), so XK1_inf = alpha/(alpha+beta) is not bounded to [0,1] in general;
  the invariant checks the formula, not a bound. Algebraic: all gates, concentrations and the membrane potential are inputs,
  so alone it is a pure function of its inputs, checked exactly against the original model equations.'
