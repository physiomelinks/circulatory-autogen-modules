module_type: i_f
version: Paci2013_v01
reviewed: false
notes: 'Paci 2013 hiPSC-CM (ventricular-like) funny current I_f = g_f Xf (Vm - E_f). Algebraic: all gates, concentrations
  and the membrane potential are inputs, so alone it is a pure function of its inputs, checked exactly against the original
  model equations.'
expected_failures:
  run_test: 'generation fails: the gate inputs Xf are declared private_interface=''in'' (a leftover of the original Paci encapsulation
    hierarchy) so they cannot be connected (libcellml: ''interface type required is public''). Fix: public_interface=''in''.
    With the proposed fix applied to a copy of the library, all tests of this component pass.'
