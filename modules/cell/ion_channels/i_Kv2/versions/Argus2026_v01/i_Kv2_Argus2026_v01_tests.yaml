module_type: i_Kv2
version: Argus2026_v01
reviewed: false
notes: Copied verbatim from the owner's SN_soma (modules/cell/neurons, the SN_simple sympathetic neuron); every gating time
  constant has epsilon_tau = 0.1 ms added, as in the original. Kv2 delayed-rectifier K current of the SN soma, i_Kv2 = g_Kv2
  (V - E_K) m_Kv2. Split out of the monolithic SN_soma / SN_varicosity (sympathetic_monolithic_v01) by a one-off script (tools/build_sn_modules.py, removed; in git history); SN_simple_flat checks that the assembled parts reproduce SN_simple.
