module_type: i_Kr
version: Paci2013_v01
reviewed: false
notes: 'Paci 2013 hiPSC-CM (ventricular-like) rapid delayed rectifier I_Kr = E4031_coeff g_Kr (Vm - E_K) Xr1 Xr2 sqrt(Ko/5.4).
  Algebraic: all gates, concentrations and the membrane potential are inputs, so alone it is a pure function of its inputs,
  checked exactly against the original model equations.'
known_issues:
- 'undefined units: C_per_M'
- 'undefined units: J_per_MK'
expected_failures:
  run_test: 'generation fails: the gate inputs Xr1, Xr2 are declared private_interface=''in'' (a leftover of the original
    Paci encapsulation hierarchy) so they cannot be connected (libcellml: ''interface type required is public''). Fix: public_interface=''in''.
    Also E4031_coeff is exposed in the config but has no public interface in the CellML; fix: public_interface=''out''. Also
    R and F use the undefined units J_per_MK / C_per_M (known issue); fix: define them (joule/(mole kelvin), coulomb/mole)
    in ion_channel_units.cellml. With the proposed fix applied to a copy of the library, all tests of this component pass.'
