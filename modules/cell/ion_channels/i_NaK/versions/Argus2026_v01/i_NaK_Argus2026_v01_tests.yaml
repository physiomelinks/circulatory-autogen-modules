module_type: i_NaK
version: Argus2026_v01
reviewed: false
notes: 'Copied verbatim from the owner''s SN_soma (now soma sympathetic_monolithic_v01 in modules/cell/neuron/soma, the SN_simple
  sympathetic neuron); every gating time constant has epsilon_tau = 0.1 ms added, as in the original. Na/K pump of the SN
  soma (Lindblad 1996 form), with its fluxes j_NaK_Na = -3 i_NaK/F and j_NaK_K = 2 i_NaK/F. Split out of the monolithic SN_soma
  / SN_varicosity (sympathetic_monolithic_v01) by a one-off script (tools/build_sn_modules.py, removed; in git history); SN_simple_flat
  checks that the assembled parts reproduce SN_simple. Geometry re-parameterisation (2026-10-02): the maximal current is k_NaK
  = A_mem rho_NaK r_NaK e (membrane area x density x turnover x elementary charge, one net charge per cycle), A_mem from the
  membrane through membrane_area; the defaults reproduce the previous k_NaK.'
reference_proposals:
  Ko:
    reference: 'BoronBoulpaep2017; typical extracellular K 4.5 mM [NOT VERIFIED: full text not accessible; value not seen
      in the source]'
    sourced: 'no'
  Ko_mid_NaK:
    reference: Nygren1998; I_NaK k_NaK_K = 1 mM (PMR CellML; = value). The pump form used here, Nai^1.5/(Nai^1.5 + K^1.5)
      (V+150)/(V+200), is Nygren 1998's; Lindblad1996 has the same K_mK = 1 mM but a different voltage factor
    sourced: 'yes'
    also_cites:
    - Lindblad1996
  Nai:
    reference: 'BoronBoulpaep2017; typical mammalian intracellular Na 15 mM, modified here to 13 mM (= Nai_init; constant
      when unconnected) [NOT VERIFIED: full text not accessible; value not seen in the source]'
    sourced: 'no'
  Nai_mid_NaK:
    reference: 'Paci2013; I_NaK Km_Na = 40 mM in the authors'' CellML (= tenTusscher2004 K_mNa). NOTE: the CA reference lindblad1996Model
      is wrong for this value: Lindblad 1996 and Nygren 1998 (whose Nai^1.5 pump form this is) use K_mNa = 11 mM. Keeping
      40 mM mixes the two models; 11 mM would be consistent with the form'
    sourced: 'yes'
    also_cites:
    - tenTusscher2004
    - Nygren1998
  Nai_power_NaK:
    reference: Nygren1998; I_NaK Na-dependence exponent 1.5 (PMR CellML; = value; also in Lindblad1996)
    sourced: 'yes'
    also_cites:
    - Lindblad1996
  V:
    reference: 'definitional; clamp value when unconnected: the SN resting potential (-70 mV, cf. Davis2020)'
    sourced: 'no'
    value: -70.0
  rho_NaK:
    value: 750.0
    reference: Landowne1970; ouabain binding, at most 750 Na/K pump sites/um^2 in rabbit vagus C fibres (Abstract, point 4;
      an upper limit)
    sourced: 'yes'
    previous: 'previous k_NaK (as proposed in review): unreferenced_placeholder; owner''s hand-set value in the SN_simple
      model (CA token ''user_defined'')'
