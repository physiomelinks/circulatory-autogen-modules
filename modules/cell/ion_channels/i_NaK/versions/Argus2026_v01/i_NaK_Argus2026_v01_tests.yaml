description: 'Na/K pump (3 Na out : 2 K in) of the sympathetic-neuron soma: Nygren 1998 form, instantaneous, k_NaK = A rho
  r e, with neuronal alpha3 Na affinity; its Na and K fluxes go to the soma''s balances.'
notes: 'Copied verbatim from the owner''s SN_soma (now soma sympathetic_monolithic_v01 in modules/cell/neuron/soma, the SN_simple
  sympathetic neuron); every gating time constant has epsilon_tau = 0.1 ms added, as in the original. Na/K pump of the SN
  soma (Lindblad 1996 form), with its fluxes j_NaK_Na = -3 i_NaK/F and j_NaK_K = 2 i_NaK/F. Split out of the monolithic SN_soma
  / SN_varicosity (sympathetic_monolithic_v01) by a one-off script (tools/build_sn_modules.py, removed; in git history); SN_simple_flat
  checks that the assembled parts reproduce SN_simple. Geometry re-parameterisation (2026-10-02): the maximal current is k_NaK
  = A_mem rho_NaK r_NaK e (membrane area x density x turnover x elementary charge, one net charge per cycle), A_mem from the
  membrane through membrane_area; the defaults reproduce the previous k_NaK. The Nai term is written 1/(1 + (Nai_mid/Nai)^p),
  identical to Nai^p/(Nai^p + Nai_mid^p), so libcellml can check its units. Reviewed 2026-10-05: the form is Nygren 1998 (human
  atrial; the voltage factor matches the neuronal alpha3 pump, Horisberger & Kharoubi-Hess 2002); Nai_mid 15 mM (neuronal
  alpha3), density 750 /um^2 (Landowne & Ritchie 1970, upper limit) and turnover 9 /s at 22 degC replace the inflated values
  (k_NaK 0.4 nA -> 3.2 pA). **With these, the soma is no longer in Na/K balance at rest until its leaks are recalibrated (calibration_workflow
  of the soma).**'
