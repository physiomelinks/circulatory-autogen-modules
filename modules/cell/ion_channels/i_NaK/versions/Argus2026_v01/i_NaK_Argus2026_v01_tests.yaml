module_type: i_NaK
version: Argus2026_v01
reviewed: false
notes: Copied verbatim from the owner's SN_soma (modules/cell/neurons, the SN_simple sympathetic neuron); every gating time
  constant has epsilon_tau = 0.1 ms added, as in the original. Na/K pump of the SN soma (Lindblad 1996 form), with its fluxes
  j_NaK_Na = -3 i_NaK/F and j_NaK_K = 2 i_NaK/F. Built by tools/build_sn_modules.py; SN_simple_flat checks that the assembled
  parts reproduce SN_simple.
expected_failures:
