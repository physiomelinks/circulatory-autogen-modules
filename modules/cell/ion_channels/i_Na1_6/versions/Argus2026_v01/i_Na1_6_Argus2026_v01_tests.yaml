module_type: i_Na1_6
version: Argus2026_v01
reviewed: false
notes: 'Copied verbatim from the owner''s SN_soma (modules/cell/neurons, the SN_simple sympathetic neuron); every gating time
  constant has epsilon_tau = 0.1 ms added, as in the original. NaV1.6 current of the SN soma, i_Na1_6 = g_Na1_6 g_Na1_6_mod
  (V - E_Na) m_Na1_6^3 h_Na1_6 (the same law as i_Na_SN). Two features of the original are kept so that SN_simple is reproduced:
  the gates start at i_Na_SN''s steady state (the original sets m_Na1_6''s initial value to m_init, computed from V_mid_m,
  V_den_m, V_mid_h, V_den_h, the NaV1.7 values, which are this component''s own parameters here), and its Na flux j_Na1_6
  = -i_Na1_6/F is computed but has no port, as the original leaves it out of dNai/dt. Built by tools/build_sn_modules.py;
  SN_simple_flat checks that the assembled parts reproduce SN_simple.'
expected_failures:
