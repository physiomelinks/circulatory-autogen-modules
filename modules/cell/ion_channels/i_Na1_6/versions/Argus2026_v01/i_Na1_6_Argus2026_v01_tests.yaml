module_type: i_Na1_6
version: Argus2026_v01
reviewed: false
notes: 'Copied verbatim from the owner''s SN_soma (modules/cell/neurons, the SN_simple sympathetic neuron); every gating time
  constant has epsilon_tau = 0.1 ms added, as in the original. NaV1.6 current of the SN soma, i_Na1_6 = g_Na1_6 g_Na1_6_mod
  (V - E_Na) m_Na1_6^3 h_Na1_6 (the same law as i_Na_SN). Two features of the original are kept so that SN_simple is reproduced:
  the gates start at i_Na_SN''s steady state (the original sets m_Na1_6''s initial value to m_init, computed from V_mid_m,
  V_den_m, V_mid_h, V_den_h, the NaV1.7 values, which are this component''s own parameters here), and its Na flux j_Na1_6
  = -i_Na1_6/F is computed but has no port, as the original leaves it out of dNai/dt. Split out of the monolithic SN_soma
  / SN_varicosity (sympathetic_monolithic_v01) by a one-off script (tools/build_sn_modules.py, removed; in git history); SN_simple_flat
  checks that the assembled parts reproduce SN_simple.'
reference_proposals:
  E_Na:
    reference: definitional; Nernst potential RT/F ln(Nao/Nai) at Nao 145, Nai 13 mM, 310.15 K (used when unconnected)
    sourced: 'no'
  V:
    reference: 'definitional; clamp value when unconnected: the SN resting potential (-70 mV, cf. Davis2020)'
    sourced: 'no'
    value: -70.0
  V_den_h:
    reference: Tao2011; Supporting Material (Document S1) Eq. 87 (k = 6.5 mV); modified here to 4 mV (was 6.5)
    sourced: 'yes'
    also_cites:
    - BelluzziSacchi1991
  V_den_h_Na1_6:
    reference: Tao2011; Supporting Material (Document S1) Eq. 87 (k = 6.5 mV); modified here to 8 mV (was 6.5)
    sourced: 'yes'
    also_cites:
    - BelluzziSacchi1991
  V_den_m:
    reference: Tao2011; Supporting Material (Document S1) Eq. 86 (k = 7.2 mV); modified here to 6 mV (was 7.2)
    sourced: 'yes'
    also_cites:
    - BelluzziSacchi1991
  V_den_m_Na1_6:
    reference: Tao2011; Supporting Material (Document S1) Eq. 86 (k = 7.2 mV); modified here to 8 mV (was 7.2)
    sourced: 'yes'
    also_cites:
    - BelluzziSacchi1991
  V_mid_h:
    reference: Tao2011; Supporting Material (Document S1) Eq. 87 (h_inf V1/2 = -53.2 mV, k = 6.5 mV); modified here to 40
      mV (was 53.2)
    sourced: 'yes'
    also_cites:
    - BelluzziSacchi1991
  V_mid_h_Na1_6:
    reference: 'Tao2011; Supporting Material (Document S1) Eq. 87: h_inf V1/2 = -53.2 mV (= value; reused for NaV1.6)'
    sourced: 'yes'
    also_cites:
    - BelluzziSacchi1991
  V_mid_m:
    reference: Tao2011; Supporting Material (Document S1) Eq. 86 (Belluzzi-Sacchi I_Na m_inf V1/2 = -36 mV, k = 7.2 mV); modified
      here to 20 mV (was 36)
    sourced: 'yes'
    also_cites:
    - BelluzziSacchi1991
  V_mid_m_Na1_6:
    reference: 'Tao2011; Supporting Material (Document S1) Eq. 86: m_inf V1/2 = -36 mV (= value; the Belluzzi-Sacchi I_Na
      gate reused for the NaV1.6 current; no NaV1.6-specific source)'
    sourced: 'yes'
    also_cites:
    - BelluzziSacchi1991
  V_rest_approx:
    reference: 'Davis2020; resting membrane potential of rat stellate neurons: Wistar -72.6 +- 1.0 mV (Fig. 4C), SHR -70.3
      +- 1.4 mV (Fig. 5D); -70 mV approximates it (the Davis 2021 thesis cited by the CA token could not be found)'
    sourced: 'yes'
  g_Na1_6:
    reference: unreferenced_placeholder; owner's hand-set value in the SN_simple model (CA token 'user_defined')
    sourced: 'no'
  g_Na1_6_mod:
    reference: definitional; scaling factor, 1 = unmodified
    sourced: 'no'
  tau_h_Na1_6_max:
    reference: unreferenced_placeholder; owner's hand-set value in the SN_simple model (CA token 'user_defined'); 300 ms slow
      recovery; no NaV1.6 source found
    sourced: 'no'
  tau_h_Na1_6_min:
    reference: unreferenced_placeholder; owner's hand-set value in the SN_simple model (CA token 'user_defined'); 0.15 ms
    sourced: 'no'
