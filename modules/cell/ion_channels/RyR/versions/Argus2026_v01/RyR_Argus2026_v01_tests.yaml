module_type: RyR
version: Argus2026_v01
reviewed: false
notes: 'Copied verbatim from the owner''s SN_soma (now soma sympathetic_monolithic_v01 in modules/cell/neuron/soma, the SN_simple
  sympathetic neuron); every gating time constant has epsilon_tau = 0.1 ms added, as in the original. Ryanodine receptor Ca
  release from the ER of the SN soma and varicosity (the same law in both): j_RyR = k_RyR (Ca_ER - Cai) c^3 hc^3, c activated
  by Cai and hc by Ca_ER. Split out of the monolithic SN_soma / SN_varicosity (sympathetic_monolithic_v01) by a one-off script
  (tools/build_sn_modules.py, removed; in git history); SN_simple_flat checks that the assembled parts reproduce SN_simple.
  Geometry re-parameterisation (2026-10-02): k_RyR = A_ER rho_RyR k_RyR_single (membrane area x density x per-protein permeability,
  1e-18 m3/um3), A_ER through the A_ER port; the defaults reproduce the previous k_RyR.'
