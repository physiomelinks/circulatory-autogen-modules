module_type: RyR
version: Argus2026_v01
reviewed: false
notes: 'Copied verbatim from the owner''s SN_soma (now soma sympathetic_monolithic_v01 in modules/cell/neuron/soma, the SN_simple
  sympathetic neuron); every gating time constant has epsilon_tau = 0.1 ms added, as in the original. Ryanodine receptor Ca
  release from the ER of the SN soma and varicosity (the same law in both): j_RyR = k_RyR (Ca_ER - Cai) c^3 hc^3, c activated
  by Cai and hc by Ca_ER. Split out of the monolithic SN_soma / SN_varicosity (sympathetic_monolithic_v01) by a one-off script
  (tools/build_sn_modules.py, removed; in git history); SN_simple_flat checks that the assembled parts reproduce SN_simple.
  Geometry re-parameterisation (2026-10-02): k_RyR = A_ER rho_RyR k_RyR_single (membrane area x density x per-protein permeability,
  1e-18 m3/um3), A_ER through the A_ER port; the defaults reproduce the previous k_RyR. Temperature (review 2026-10-05): the
  model is at room temperature, T = 295.15 K (22 degC), like the Davis 2021 thesis recordings it is calibrated to; every gating
  time constant is divided by phi = Q10^((T - T_ref)/10 K) (Q10_RyR, T_ref_RyR). T_ref defaults to 295.15 K, so phi = 1 and
  the kinetics are unchanged; setting T_ref to the source''s recording temperature (on review) scales them, and the model
  can be run at 37 degC by changing T. Superseded 2026-10-06: the SN model (soma sympathetic, varicosity sympathetic and
  their monolithic equivalents, SN_simple*) no longer uses this version; its RyR is HernandezCruz1997_v01. Reason: this law
  is inconsistent with the rat superior cervical ganglion CICR data (Hernandez-Cruz 1997): it gives store releases triggered
  at a luminal threshold (Ca_ER past Ca_ER_RyR_mid) that pace the soma''s resting firing, whereas influx alone does not
  trigger CICR in rat SCG neurons (reviews/RyR_HernandezCruz1997_comparison.html). Kept as a version for reference.'
