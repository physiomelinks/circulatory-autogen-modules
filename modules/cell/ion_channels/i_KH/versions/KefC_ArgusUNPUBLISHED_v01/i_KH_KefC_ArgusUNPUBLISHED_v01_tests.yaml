notes: 'KefC-type K+/H+ exchanger (gulati2024structure): 1 K+ out for 1 H+ in, electroneutral, so it is driven by the concentration
  gradients alone: free energy per cycle over F = E_H - E_K. With the membrane more negative than E_K, K+ keeps entering through
  the Trk channel; this exchanger returns it, so V can sit below E_K. Linear flux-force law r = A_mem g_spec (E_H - E_K)/F
  (placeholder kinetics; thermodynamics exact). In E. coli KefC is gated by glutathione (mostly closed); its basal activity
  stands in for all K+ efflux here.'
