module_type: i_Na
version: Paci2013_v01
reviewed: false
notes: 'Paci 2013 hiPSC-CM (ventricular-like) fast Na current I_Na = TTX_coeff g_Na m^3 h j (Vm - E_Na). Algebraic: all gates,
  concentrations and the membrane potential are inputs, so alone it is a pure function of its inputs, checked exactly against
  the original model equations.'
expected_failures:
  run_test: 'generation fails: the gate inputs m, h, j are declared private_interface=''in'' (a leftover of the original Paci
    encapsulation hierarchy) so they cannot be connected (libcellml: ''interface type required is public''). Fix: public_interface=''in''.
    Also TTX_coeff is exposed in the config but has no public interface in the CellML; fix: public_interface=''out''. With
    the proposed fix applied to a copy of the library, all tests of this component pass.'
  verification_test_invariants: 'generation fails: the gate inputs m, h, j are declared private_interface=''in'' (a leftover
    of the original Paci encapsulation hierarchy) so they cannot be connected (libcellml: ''interface type required is public'').
