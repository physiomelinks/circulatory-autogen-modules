module_type: i_CaL_f1_gate
version: Paci2013_v01
reviewed: false
notes: 'Paci 2013 hiPSC-CM I_CaL fast voltage inactivation f1 (Ca-dependent slowing via constf1) gate: df1/dt = (f1_inf(Vm)
  - f1)/tau_f1(Vm). Alone the membrane voltage is a boundary condition, i.e. a voltage clamp, so the gate has the exact solution
  used as the invariant. The run point steps the clamp from rest (-74.3 mV) to -20 mV. tau_f1 is multiplied by constf1 = 1
  + 1433 (Cai - 50e-6) while f1 is rising (f1_inf > f1); the sign of (f1_inf - f1) cannot change during a monotone relaxation,
  so the exact solution still applies.'
expected_failures:
