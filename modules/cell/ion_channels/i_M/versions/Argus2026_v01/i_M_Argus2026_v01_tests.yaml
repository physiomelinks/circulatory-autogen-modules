module_type: i_M
version: Argus2026_v01
reviewed: true
description: 'M (KCNQ2/3) K current of the sympathetic-neuron soma: i_M = g_M mod w (V - E_K), g = A rho gamma; w_inf from
  Martin & Pedersen 2023 with the owner''s slower tau_w; g_M from the Davis 2020 XE-991-sensitive current; its K flux goes
  to the soma''s K balance.'
notes: 'Copied verbatim from the owner''s SN_soma (now soma sympathetic_monolithic_v01 in modules/cell/neuron/soma, the SN_simple
  sympathetic neuron); every gating time constant has epsilon_tau = 0.001 ms (was 0.1 ms; changed on review 2026-10-02) added,
  as in the original. M-type (KCNQ) K current of the SN soma, i_M = g_M_mod g_M w (V - E_K); Delta_V_mid_w shifts the activation
  for drug studies. Split out of the monolithic SN_soma / SN_varicosity (sympathetic_monolithic_v01) by a one-off script (tools/build_sn_modules.py,
  removed; in git history); SN_simple_flat checks that the assembled parts reproduce SN_simple. Geometry re-parameterisation
  (2026-10-02): the maximal conductance is g_M = A_mem rho_M gamma_M (membrane area x channel density x single-channel conductance,
  1e-6 uS/pS), A_mem from the membrane through membrane_area; the defaults reproduce the previous g_M. Temperature (review
  2026-10-05): the model is at room temperature, T = 295.15 K (22 degC), like the Davis 2021 thesis recordings it is calibrated
  to; every gating time constant is divided by phi = Q10^((T - T_ref)/10 K) (Q10_M, T_ref_M). T_ref defaults to 295.15 K,
  so phi = 1 and the kinetics are unchanged; setting T_ref to the source''s recording temperature (on review) scales them,
  and the model can be run at 37 degC by changing T. tau_w shape: prefactor 2.0 and slopes 15/25 mV are the owner''s (CA 837d3aae,
  2024-07-21); MartinPedersen2023 has 3.3 and 10/20 mV; **tau_w peaks at 508 ms (Martin 142 ms at 37 degC) and has a 30 ms
  floor**. g_M calibration (2026-10-05): rho_M is calibrated with libcuflynx to instance davis2020_wistar (Davis2020 Fig.
  3C, Wistar XE-991-sensitive M current -4.032 pA/pF x an assumed Cm 30 pF; the measure, per Davis2021Thesis p. 172-173, is
  the deactivation relaxation in a 1 s step from -25 to -55 mV: the current after the ohmic jump minus that near the end of
  the step; E_K -96.4979 mV), giving rho_M 0.2029 /um^2, g_M 0.005479 uS (2.1x the earlier 0.00263 uS, which divided the density
  by the -25/-55 mV steady-state difference). The fitted g_M depends on tau_w: the 1 s step leaves the relaxation 87 % complete
  with the present tau_w (466 ms at -55 mV); refit g_M if tau_w changes. The default, the soma supermodule, the monolithic
  soma and SN_simple(_flat) use that value. To redo it: edit instances/davis2020_wistar/davis2020_wistar_obs_data.json (value,
  std, Cm, protocol) or _params_for_id.csv and run venv/bin/python -m pytest tests/test_modules.py --component i_M/Argus2026_v01
  -k ''calibrate and davis2020_wistar'' --include-unreviewed, which rewrites davis2020_wistar_calibrated_parameters.csv and
  _calibration.json; then venv/bin/python -m cam_testing.calibrate apply i_M/Argus2026_v01 davis2020_wistar (--dry-run first),
  which copies rho_M into the default, soma sympathetic, the monolithic soma and SN_simple(_flat). Provenance page: reviews/i_M_Argus2026_v01_g_M_fit.html
  (tools/i_M_davis2020_kinetics.py gm-report). tau_w refit (2026-10-05, not applied): instance davis2020_wistar_kinetics calibrates
  tau_w_num and tau_w_min with libcuflynx to the digitised Davis2020 Fig. 3C Wistar trace (n = 1, raw current; relaxation
  taus ~74 ms at -55 mV and ~160 ms back at -25 mV; tools/i_M_davis2020_kinetics.py). With the shape fixed no values fit both
  phases; the fit gives tau_w_num ~0, tau_w_min 105 ms (a nearly flat tau_w; the present one is 466 ms at -55 mV). The defaults
  are unchanged pending the owner''s decision: reviews/i_M_Argus2026_v01_tau_w_refit.html compares them; to adopt them run
  venv/bin/python -m cam_testing.calibrate apply i_M/Argus2026_v01 davis2020_wistar_kinetics, then recalibrate and apply davis2020_wistar
  (g_M depends on tau_w). tau_w kept on review (2026-10-05): the Davis 2020 trace (n = 1, one voltage) favours a faster flat
  tau_w (instance davis2020_wistar_kinetics, not applied), but the slow tau_w gives the SN_full fits their spike-frequency
  adaptation; SN_full now calibrates tau_w_num and tau_w_min.'
known_issues:
- 'Python/C generation unsupported: gate states start from computed initial values (e.g. m_init = m_inf(V_rest_approx)), which
  libCellML''s analyser rejects, so solve_ivp (and C/C++) can''t generate the model; CVODE/Myokit runs it. Kept on review
  (2026-10-03).'
