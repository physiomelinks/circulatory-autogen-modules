module_type: i_NaCa
version: Paci2013_v01
reviewed: false
notes: 'Paci 2013 hiPSC-CM (ventricular-like) Na/Ca exchanger I_NaCa (Luo-Rudy/ten Tusscher form with alpha scaling). Algebraic:
  all gates, concentrations and the membrane potential are inputs, so alone it is a pure function of its inputs, checked exactly
  against the original model equations.'
known_issues:
- 'undefined units: C_per_M'
- 'undefined units: J_per_MK'
- port variable Cai not in variables_and_units
expected_failures:
