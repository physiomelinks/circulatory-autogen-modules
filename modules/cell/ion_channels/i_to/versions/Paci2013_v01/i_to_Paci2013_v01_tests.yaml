module_type: i_to
version: Paci2013_v01
reviewed: false
notes: 'Paci 2013 hiPSC-CM (ventricular-like) transient outward current I_to = g_to (Vm - E_K) q r. Algebraic: all gates,
  concentrations and the membrane potential are inputs, so alone it is a pure function of its inputs, checked exactly against
  the original model equations.'
expected_failures:
  run_test: 'generation fails: the gate inputs q, r are declared private_interface=''in'' (a leftover of the original Paci
    encapsulation hierarchy) so they cannot be connected (libcellml: ''interface type required is public''). Fix: public_interface=''in''.
    With the proposed fix applied to a copy of the library, all tests of this component pass.'
  verification_test_invariants: 'generation fails: the gate inputs q, r are declared private_interface=''in'' (a leftover
    of the original Paci encapsulation hierarchy) so they cannot be connected (libcellml: ''interface type required is public'').
