module_type: i_CaL
version: Argus2026_v01
reviewed: false
notes: 'Copied verbatim from the owner''s SN_soma (now soma sympathetic_monolithic_v01 in modules/cell/neuron/soma, the SN_simple sympathetic neuron); every gating time
  constant has epsilon_tau = 0.1 ms added, as in the original. L-type Ca current of the SN soma: GHK flux with permeability
  p_Ca (1 + cAMP), gates c^2 hc; Ca flux j_Ca_L = -i_Ca_L/(2F) into the sub-membrane Ca. Split out of the monolithic SN_soma
  / SN_varicosity (sympathetic_monolithic_v01) by a one-off script (tools/build_sn_modules.py, removed; in git history); SN_simple_flat
  checks that the assembled parts reproduce SN_simple.'
reference_proposals:
  Cai:
    reference: definitional; resting cytosolic Ca 1e-4 mM (Cai_init, cf. Wanaverbecq2003) used when unconnected
    sourced: 'no'
  Cao:
    reference: 'Tao2011; Supporting Material (Document S1) parameter list: [Ca2+]o = 2 mM (listed for the SA-node cell; no
      separate neuron value). Khaliq2003 also uses 2 mM'
    sourced: 'yes'
    also_cites:
    - Khaliq2003
  V:
    reference: 'definitional; clamp value when unconnected: the SN resting potential (-70 mV, cf. Davis2020)'
    sourced: 'no'
    value: -70.0
  V_den_c:
    reference: Tao2011; Supporting Material (Document S1) Eq. 91 (k = 9.85 mV); modified here to 5 mV (was 9.85)
    sourced: 'yes'
    also_cites:
    - BelluzziSacchi1991
  V_mid_c:
    reference: 'Tao2011; Supporting Material (Document S1) Eq. 91: c_inf V1/2 = -8.1 mV (= value). Tao''s Ca current is a
      nonspecific high-voltage-activated current (Belluzzi-Sacchi), not specifically L- or N-type'
    sourced: 'yes'
    also_cites:
    - BelluzziSacchi1991
  V_rest_approx:
    reference: 'Davis2020; resting membrane potential of rat stellate neurons: Wistar -72.6 +- 1.0 mV (Fig. 4C), SHR -70.3
      +- 1.4 mV (Fig. 5D); -70 mV approximates it (the Davis 2021 thesis cited by the CA token could not be found)'
    sourced: 'yes'
  cAMP:
    reference: unreferenced_placeholder; owner's hand-set value in the SN_simple model (CA token 'user_defined'); dimensionless
      cAMP level scaling the Ca permeability
    sourced: 'no'
  p_Ca:
    reference: unreferenced_placeholder; owner's hand-set value in the SN_simple model (CA token 'to_be_identified'); Tao
      2011 P_Ca = 1.1e-16 cm/ms (WKY) is a permeability per area, not comparable to m3/s
    sourced: 'no'
    also_cites:
    - Tao2011
  tau_c_max:
    reference: unreferenced_placeholder; owner's modification of Tao2011 Eq. 92, whose tau_c spans 0.13-0.56 ms; 3 ms is about
      5x the source maximum (CA token changed_from_belluzi1991_curves)
    sourced: 'no'
    also_cites:
    - Tao2011
  tau_c_min:
    reference: unreferenced_placeholder; owner's modification of Tao2011 Eq. 92, whose tau_c spans 0.13-0.56 ms (CA token
      changed_from_belluzi1991_curves)
    sourced: 'no'
    also_cites:
    - Tao2011
  tau_hc:
    reference: 'Tao2011; Supporting Material (Document S1) Eq. 94: tau_hc = 1/(0.242 e^{0.145V} + 0.0434 e^{-0.0201V}) + 17
      ms, range 17.0-29.9 ms; 20 ms is a constant within that range'
    sourced: 'yes'
    also_cites:
    - BelluzziSacchi1991
review: reviews/ion_channel_review.yaml
review_scope: The review of the whole ion_channel module (47 entries) before the move to versions; only the parts about this
  version apply.
