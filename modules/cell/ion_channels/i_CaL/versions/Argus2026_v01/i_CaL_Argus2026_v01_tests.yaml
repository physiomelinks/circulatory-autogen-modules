module_type: i_CaL
version: Argus2026_v01
reviewed: false
notes: 'Copied verbatim from the owner''s SN_soma (modules/cell/neurons, the SN_simple sympathetic neuron); every gating time
  constant has epsilon_tau = 0.1 ms added, as in the original. L-type Ca current of the SN soma: GHK flux with permeability
  p_Ca (1 + cAMP), gates c^2 hc; Ca flux j_Ca_L = -i_Ca_L/(2F) into the sub-membrane Ca. Split out of the monolithic SN_soma / SN_varicosity (sympathetic_monolithic_v01) by a one-off script (tools/build_sn_modules.py, removed; in git history);
  SN_simple_flat checks that the assembled parts reproduce SN_simple.'
expected_failures:
  run_test: 'generation fails alone: this component (like SN_soma) declares the globals F and R in the defined units J_per_mol_K
    / C_per_mol, but the module''s global rows in ion_channel_parameters.csv carry the undefined J_per_MK / C_per_M of the
    Paci/Tao components (libcuflynx exits: units in parameters.csv do not match module_config.json). Fix: the pending review
    question on unifying R and F to J_per_mol_K / C_per_mol. With that fix applied to a copy of the library this component''s
    run and invariant tests pass; it generates and reproduces SN_simple in SN_simple_flat.'
