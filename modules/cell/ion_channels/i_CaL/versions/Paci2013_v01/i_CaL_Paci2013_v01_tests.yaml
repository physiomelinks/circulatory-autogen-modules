module_type: i_CaL
version: Paci2013_v01
reviewed: false
notes: 'Paci 2013 hiPSC-CM (ventricular-like) L-type Ca current (GHK form, 0.341 Cao activity factor) I_CaL = g_CaL 4 Vm F^2/(RT)
  (Cai e^{2VmF/RT} - 0.341 Cao)/(e^{2VmF/RT} - 1) d f1 f2 fCa. The nifedipine switches are declared but, exactly as in the
  original Paci 2013 CellML, nifed_coeff is computed and never multiplies I_CaL. Algebraic: all gates, concentrations and
  the membrane potential are inputs, so alone it is a pure function of its inputs, checked exactly against the original model
  equations.'
known_issues:
- 'undefined units: C_per_M'
- 'undefined units: J_per_MK'
expected_failures:
  run_test: 'generation fails: the gate inputs f1, f2, fCa are declared private_interface=''in'' (a leftover of the original
    Paci encapsulation hierarchy) so they cannot be connected (libcellml: ''interface type required is public''). Fix: public_interface=''in''.
    d is declared private_interface=''in'' public_interface=''out'' (an output) although it is an input here; fix: public_interface=''in''.
    Also R and F use the undefined units J_per_MK / C_per_M (known issue); fix: define them (joule/(mole kelvin), coulomb/mole)
    in ion_channel_units.cellml. With the proposed fix applied to a copy of the library, all tests of this component pass.'
  verification_test_invariants: 'generation fails: the gate inputs f1, f2, fCa are declared private_interface=''in'' (a leftover
