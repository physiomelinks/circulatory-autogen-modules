module_type: i_CaL_fCa_gate
version: Paci2013_v01
reviewed: false
notes: 'Paci 2013 Ca-dependent inactivation of I_CaL: dfCa/dt = constfCa (fCa_inf(Cai) - fCa)/tau_fCa, tau_fCa = 2 ms (hard-coded),
  with constfCa = 0 (no recovery) when Vm > -60 mV and fCa_inf > fCa. With Vm and Cai clamped the solution is exact (frozen
  or a single exponential).'
expected_failures:
  run_test: 'generation fails: Vm is declared ''dimensionless'' in ion_channel_modules_config.json (and the parameters file)
    but ''volt'' in the CellML, so the connection is rejected (Myokit: ''Connected variables must have compatible units'').
    Fix: declare Vm as volt in the config and parameters file. With the proposed fix applied to a copy of the library, all
    tests of this component pass.'
