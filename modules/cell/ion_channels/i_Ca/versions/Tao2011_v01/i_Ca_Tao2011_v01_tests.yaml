reference_proposals:
  P_Ca:
    reference: 'Tao2011; Supporting Material (Document S1) p. 8 neuron parameter table: PCa = 1.1e-16 cm/ms = 1.1e-15 m/s
      (WKY; 1.54e-16 cm/ms for SHR). NOTE the module''s GHK expression is not dimensionally consistent (see review)'
    sourced: 'yes'
    value: 1.1e-15
  Vm:
    reference: definitional; clamp potential supplied by the membrane module in a network; -60 mV alone (test operating point
      near rest)
    sourced: definitional
    value: -60.0
  Cai:
    reference: unreferenced_placeholder; resting cytosolic Ca 1e-4 mM (0.1 uM); Tao 2011 gives no neuron value
    sourced: 'no'
    value: 0.0001
  R:
    reference: Paci2013; gas constant as used in the authors' CellML (8.314472 J/(mol K), CODATA 2006)
    sourced: 'yes'
    value: 8.314472
  T:
    reference: Paci2013; temperature in the authors' CellML (310 K)
    sourced: 'yes'
    value: 310
  F:
    reference: Paci2013; Faraday constant as used in the authors' CellML (96485.3415 C/mol, CODATA 2006)
    sourced: 'yes'
    value: 96485.3415
  Cao:
    reference: 'Paci2013; extracellular Ca in the authors'' CellML (PMR workspace sseveri/paci_hyttinen_aaltosetala_severi_2013,
      ventricularVersion): Cao = 1.8 mM (note: the Tao 2011 neuron currents share this global; Tao 2011 used its own bath
      value)'
    sourced: 'yes'
    value: 1.8
