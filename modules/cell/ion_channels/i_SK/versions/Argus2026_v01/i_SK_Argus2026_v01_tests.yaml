module_type: i_SK
version: Argus2026_v01
reviewed: false
notes: 'Copied verbatim from the owner''s SN_soma (now soma sympathetic_monolithic_v01 in modules/cell/neuron/soma, the SN_simple
  sympathetic neuron); every gating time constant has epsilon_tau = 0.1 ms added, as in the original. SK (small-conductance
  Ca-activated K) current of the SN soma, i_KCa_SK = g_KCa_SK g_KCa_SK_mod m_SK (V - E_K), m_SK a Hill function of the sub-membrane
  (shell) Ca, Cai, through internal_Ca (review 2026-10-05; the original read the bulk cytosolic Ca, Ca_bulk, through bulk_Ca;
  SK now reads the Khaliq 2003 membrane shell, as BK does). m_SK starts at its steady state at Cai_init. Split out of the
  monolithic SN_soma / SN_varicosity (sympathetic_monolithic_v01) by a one-off script (tools/build_sn_modules.py, removed;
  in git history); SN_simple_flat checks that the assembled parts reproduce SN_simple. Geometry re-parameterisation (2026-10-02):
  the maximal conductance is g_KCa_SK = A_mem rho_SK gamma_SK (membrane area x channel density x single-channel conductance,
  1e-6 uS/pS), A_mem from the membrane through membrane_area; the defaults reproduce the previous g_KCa_SK. Temperature (review
  2026-10-05): the model is at room temperature, T = 295.15 K (22 degC), like the Davis 2021 thesis recordings it is calibrated
  to; every gating time constant is divided by phi = Q10^((T - T_ref)/10 K) (Q10_SK, T_ref_SK). T_ref defaults to 295.15 K,
  so phi = 1 and the kinetics are unchanged; setting T_ref to the source''s recording temperature (on review) scales them,
  and the model can be run at 37 degC by changing T.'
known_issues:
- 'Python/C generation unsupported: gate states start from computed initial values (e.g. m_init = m_inf(V_rest_approx)), which
  libCellML''s analyser rejects, so solve_ivp (and C/C++) can''t generate the model; CVODE/Myokit runs it. Kept on review
  (2026-10-03).'
reference_proposals:
  Cai:
    reference: definitional; resting sub-membrane (shell) Ca 1e-4 mM (Cai_init, cf. Wanaverbecq2003) used when unconnected
    sourced: 'no'
  Cai_init:
    reference: Wanaverbecq2003; resting [Ca2+]i 102 +- 4 nM (n = 83) in cultured rat superior cervical ganglion neurons (indo-1),
      Results, first section; 1e-4 mM = value. (Replaces the CA reference Hagiwara1981, which could not be opened)
    sourced: 'yes'
  E_K:
    reference: definitional; Nernst potential RT/F ln(Ko/Ki) at Ko 4.5, Ki 200 mM, 295.15 K (the soma defaults; used when
      unconnected)
    sourced: 'no'
  V:
    reference: 'definitional; clamp value when unconnected: the SN resting potential (-70 mV, cf. Davis2020)'
    sourced: 'no'
    value: -70.0
  g_KCa_SK_mod:
    reference: definitional; scaling factor, 1 = unmodified
    sourced: 'no'
  p_SK:
    reference: Hirschberg1998; Hill coefficient 3.2 +- 1.0 (single channel), 4.8 +- 1.5 (macropatch), 4.1 (Fig. 7A); 4 is
      within that range (CA reference Gupta2016 not accessible)
    sourced: 'yes'
  tau_m_SK:
    reference: Hirschberg1998; SK activation time constant 4.9 ms for a Ca jump to 9.5 uM, mean 4.1 +- 0.6 ms (Discussion,
      Fig. 13A); activation is Ca dependent (about 50 ms at 0.5 uM), so a constant 5 ms is the high-Ca limit (CA reference
      Gupta2016 not accessible)
    sourced: 'yes'
  rho_SK:
    reference: 'definitional; chosen so that g_KCa_SK = A rho gamma_SK (1e-6 uS/pS) reproduces the previous g_KCa_SK = 0.005
      microS (to_be_identified) with A = 3000 um^2 (the soma membrane area) and gamma_SK = 10.3 picoS; a density for calibration
      through gamma_SK. The previous g_KCa_SK (as proposed in review): unreferenced_placeholder; owner''s hand-set value in
      the SN_simple model (CA token ''to_be_identified'')'
    sourced: 'no'
review: reviews/ion_channel_review.yaml
review_scope: The review of the whole ion_channel module (47 entries) before the move to versions; only the parts about this
  version apply.
