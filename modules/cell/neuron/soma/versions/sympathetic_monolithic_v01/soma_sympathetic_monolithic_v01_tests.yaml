module_type: soma
version: sympathetic_monolithic_v01
reviewed: false
notes: 'Owner''s sympathetic stellate-ganglion neuron soma ("SN_simple"): Na (NaV1.7-like and NaV1.6), L-type Ca, Kv2, Kv1.5,
  Kv4.2, BK, SK and M currents, NCX and Na/K pump, Na/K leaks, a four-compartment Ca model (sub-membrane, bulk, pre-ER and
  ER; mobile buffer; SERCA, RyR, IP3R, leak and diffusion) and Na/K concentrations. Every gating time constant has epsilon_tau
  = 0.1 ms added. Verified with exact conservation laws (charge, total Ca). Geometry (2026-10-02): the soma is a compartment
  of diameter d: area A_mem = k_A d^2, volume Vol = k_V d^3, Cm = c_m A_mem. Each channel conductance is A_mem x density x
  single-channel conductance (g_X = A_mem rho_X gamma_X), p_Ca = A_mem rho_CaL p_Ca_single, the pump and exchanger maxima
  are A_mem x density x turnover x e; the ER volumes c_ER Vol and c_ER_pre Vol (spheres by default) give the ER areas A_ER
  (IP3R, RyR) and A_ER_pre (SERCA, Ca leak). The defaults reproduce every previous value (Cm 30 pF, Vol 7,500 um^3, the conductances,
  k_NaK, k_NaCa, k_SERCA, k_leak_Ca, k_IP3, k_RyR). Membrane shell (review 2026-10-05, Khaliq et al. 2003, ModelDB 48332 cadiff.mod):
  the sub-membrane compartment (Cai) is a shell V_shell = A_mem d_shell (d_shell 0.1 um) exchanging with the bulk as j_diffCa
  = -(V_shell/tau_shell)(Cai - Ca_bulk), tau_shell 1 ms (was a fraction c_SL = 0.02 of Vol with exchange D_Ca = 6e-12 m3/s);
  c_bulk = 1 - V_shell/Vol - c_ER - c_ER_pre; SK reads the shell Ca (Cai, was Ca_bulk), as BK does. Same equations as the
  modular soma sympathetic. Temperature (review 2026-10-05): the model is at room temperature, T = 295.15 K (22 degC), like
  the Davis 2021 thesis recordings it is calibrated to; every gating time constant is divided by phi = Q10^((T - T_ref)/10
  K) (Q10_m_Na, Q10_h_Na, T_ref_Na, Q10_m_Na1_6, Q10_h_Na1_6, T_ref_Na1_6, Q10_CaL, T_ref_CaL, Q10_Kv2, T_ref_Kv2, Q10_m_Kv1_5,
  Q10_h_Kv1_5, T_ref_Kv1_5, Q10_Kv4_2, T_ref_Kv4_2, Q10_BK, T_ref_BK, Q10_SK, T_ref_SK, Q10_M, T_ref_M, Q10_IP3R, T_ref_IP3R,
  Q10_RyR, T_ref_RyR). T_ref defaults to 295.15 K, so phi = 1 and the kinetics are unchanged; setting T_ref to the source''s
  recording temperature (on review) scales them, and the model can be run at 37 degC by changing T. RyR (review 2026-10-06):
  the inline RyR is now the Hernandez-Cruz, Escobar & Jimenez 1997 rat-SCG CICR model, the same equations and default values
  as RyR HernandezCruz1997_v01 (states a_RyR, i_RyR, l_RyR; P_RyR = a (1 - i) l^N; j_RyR = k_RyR P_RyR (Ca_ER - Cai); every
  rate times phi_RyR = Q10_RyR^((T - T_ref_RyR)/10 K), T_ref 295.65 K; k_RyR = A_ER rho_RyR k_RyR_single), replacing the owner''s
  c_RyR^3 hc_RyR^3 law (RyR Argus2026_v01), which is inconsistent with the rat-SCG CICR data. It stays the monolithic equivalent
  of the sympathetic supermodule. PMCA (review 2026-10-07): the plasma-membrane Ca-ATPase of the supermodule (PMCA Colegrove2000_v01,
  Hill pump of Colegrove, Albrecht & Friel 2000) is added inline, j_max_PMCA = A_mem rho_PMCA r_PMCA / N_A and j_PMCA = -j_max_PMCA
  Cai^n_PMCA/(K_PMCA^n_PMCA + Cai^n_PMCA), j_PMCA in the sub-membrane Ca balance after j_NaCa_Ca, so that the supermodule
  still reproduces this version.'
known_issues:
- 'Python/C generation unsupported: gate states start from computed initial values (e.g. m_init = m_inf(V_rest_approx)), which
  libCellML''s analyser rejects, so solve_ivp (and C/C++) can''t generate the model; CVODE/Myokit runs it. Kept on review
  (2026-10-03).'
