module_type: soma
version: sympathetic
reviewed: false
description: 'Sympathetic-neuron soma (SN_simple''s SN_soma) built from its parts: the membrane with the sensing filter, Na/K
  concentrations with their Nernst potentials, four-compartment Ca handling, and the ion channels i_Na, i_Na1_6, i_CaL, i_Kv2,
  i_Kv1_5, i_Kv4_2, i_BK, i_SK, i_M, i_NaCa, i_NaK, i_leak_Na, i_leak_K, IP3R and RyR (cell/ion_channels, versions Argus2026_v01).
  Each submodule becomes <instance>_<submodule> in a model; the membrane couples to the axon: per_submodule_outputs {"membrane":
  ["<axon>"]} (VI_port: V out, the axial current I_out in); optional stimulus through membrane''s i_stim. Default parameters
  are SN_simple''s (its default instance). Split out of the monolithic SN_soma / SN_varicosity (sympathetic_monolithic_v01)
  by a one-off script (tools/build_sn_modules.py, removed; in git history). Tested through the neuron sympathetic version.'
expected_failures:
  phlynx_export_test: 'PhLynx has no supermodule support: it builds models from CellML module configs only, and a module_format
    "supermodule" entry (submodules expanded by libcuflynx) has no PhLynx form'
