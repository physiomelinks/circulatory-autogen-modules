module_type: soma
version: sympathetic
reviewed: false
description: 'Sympathetic-neuron soma (SN_simple''s SN_soma) built from its parts: the membrane with the sensing filter, Na/K
  concentrations with their Nernst potentials, four-compartment Ca handling, and the ion channels i_Na, i_Na1_6, i_CaL, i_Kv2,
  i_Kv1_5, i_Kv4_2, i_BK, i_SK, i_M, i_NaCa, i_NaK, i_leak_Na, i_leak_K, IP3R and RyR (cell/ion_channels, versions Argus2026_v01; RyR HernandezCruz1997_v01 since review 2026-10-06).
  Each submodule becomes <instance>_<submodule> in a model; the membrane couples to the axon: per_submodule_outputs {"membrane":
  ["<axon>"]} (VI_port: V out, the axial current I_out in); optional stimulus through membrane''s i_stim. Default parameters
  are SN_simple''s (its default instance). Split out of the monolithic SN_soma / SN_varicosity (sympathetic_monolithic_v01)
  by a one-off script (tools/build_sn_modules.py, removed; in git history). Tested through the neuron sympathetic version.'
notes: 'Temperature (review 2026-10-05): the model is at room temperature, T = 295.15 K (22 degC), like the Davis 2021 thesis
  recordings it is calibrated to; every gating time constant is divided by phi = Q10^((T - T_ref)/10 K) (Q10_<X>_<submodule>,
  T_ref_<X>_<submodule> rows per gated channel, as in the channel modules). T_ref defaults to 295.15 K, so phi = 1 and the
  kinetics are unchanged; setting T_ref to the source''s recording temperature (on review) scales them, and the model can
  be run at 37 degC by changing T. RyR (review 2026-10-06): the RyR submodule is HernandezCruz1997_v01, the rat superior
  cervical ganglion CICR model of Hernandez-Cruz, Escobar & Jimenez 1997 (activating, inactivating and luminal Ca sites;
  rates times phi = Q10^((T - T_ref)/10 K), T_ref 295.65 K; k_RyR = A_ER rho_RyR k_RyR_single), with that version''s
  default-instance values and references (*_RyR rows). It replaced Argus2026_v01 (the owner''s c^3 hc^3 law), which is
  inconsistent with the rat-SCG CICR data (comparison: reviews/RyR_HernandezCruz1997_comparison.html). The rest of the soma
  (SERCA, buffers, K(Ca)) was tuned with the old RyR, so the resting balance is to be recalibrated.'
known_issues:
- 'Python/C generation unsupported: gate states start from computed initial values (e.g. m_init = m_inf(V_rest_approx)), which
  libCellML''s analyser rejects, so solve_ivp (and C/C++) can''t generate the model; CVODE/Myokit runs it. Kept on review
  (2026-10-03).'
expected_failures:
  phlynx_export_test: 'PhLynx has no supermodule support: it builds models from CellML module configs only, and a module_format
    "supermodule" entry (submodules expanded by libcuflynx) has no PhLynx form'
