module_type: SN_membrane_soma
version: nn
reviewed: true
description: 'Sympathetic-neuron soma membrane with a recording-electrode stage. dV/dt = (I_in_delayed - i_ion - I_out)/Cm:
  i_ion is the summed channel current (membrane_current port, a multi_port sum), I_out the axial current to the axon. The
  electrode: the injected current I_in charges the electrode capacitance C_sensed (V_sensed, the potential the electrode records)
  and reaches the membrane through R_diffSensed as I_in_delayed = (V_sensed - V)/R_diffSensed (tau = R_diffSensed C_sensed
  = 20 us). Positive I_in is a depolarising (inward) injected current. Geometry (2026-10-02): the membrane is a compartment
  of diameter d with area A_mem = k_A d^2 and volume Vol = k_V d^3 (shape factors; a sphere has k_A = pi, k_V = pi/6), and
  Cm = c_m A_mem with the specific capacitance c_m (1 uF/cm^2, Gentet et al. 2000). A_mem goes to the channels (membrane_area)
  and to the Ca part for its sub-membrane shell (shell_membrane_area, a separate port so the channels, which also connect to
  Ca, see a single area source), and Vol to the Na/K and Ca parts (compartment_volume). The defaults reproduce the previous Cm = 30 pF and Vol = 7,500 um^3.'
notes: 'Membrane of the SN soma: Cm dV/dt = -(i_ion + I_in_delayed + I_out), i_ion the sum of the currents of the channels
  connected through membrane_current. The injected current I_in reaches the membrane through a sensing/electrode filter (V_sensed,
  C_sensed, R_diffSensed) as I_in_delayed; I_out is the axial current into the axon (VI_port). Copied verbatim from SN_soma
  except that the channel currents are one summed port variable. Split out of the monolithic SN_soma / SN_varicosity (sympathetic_monolithic_v01)
  by a one-off script (tools/build_sn_modules.py, removed; in git history); SN_simple_flat checks that the assembled parts
  reproduce SN_simple. Geometry (2026-10-02): the membrane is a compartment of diameter d with area A_mem = k_A d^2 and volume
  Vol = k_V d^3 (shape factors; a sphere has k_A = pi, k_V = pi/6), and Cm = c_m A_mem with the specific capacitance c_m (1
  uF/cm^2, Gentet et al. 2000). A_mem goes to the channels (membrane_area) and Vol to the Na/K and Ca parts (compartment_volume).
  Since 2026-10-05 A_mem also goes to the Ca part (shell_membrane_area; its sub-membrane shell has volume A_mem d_shell).
  The defaults reproduce the previous Cm = 30 pF and Vol = 7,500 um^3.'
reference_proposals:
  k_A:
    value: 3.141592653589793
    reference: 'Wallis1996; rat stellate (putative cardiac) neurones, mean two-dimensional soma area 463 um^2 (Abstract; the
      area is not in the Mo et al. 1994 abstract). A sphere of that projected area has d = sqrt(4 x 463/pi) = 24.28 um, the
      present d (24.29 um, from Vol 7,500 um^3); proposed: a spherical soma, k_A = pi, so A = 1,853 um^2 and Cm = 18.5 pF
      (all conductances x 0.618 at fixed densities; needs re-calibration)'
    sourced: 'yes'
    also_cites:
    - MoWallisWatson1994
review: reviews/cell_review.yaml
review_scope: The review of the whole neurons module (11 entries) before the move to versions; only the parts about this version
  apply.
