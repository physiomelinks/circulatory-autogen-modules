module_type: SN_NE_release
version: nn
reviewed: false
notes: 'Noradrenaline release of the SN varicosity: dNE/dt = k_NE max(Cai - Cai_NE_base, 0) - k_NET (NE - NE_init), release
  driven by sub-membrane Ca above a baseline, reuptake by NET. Split out of the monolithic SN_soma / SN_varicosity (sympathetic_monolithic_v01)
  by a one-off script (tools/build_sn_modules.py, removed; in git history); SN_simple_flat checks that the assembled parts
  reproduce SN_simple.'
reference_proposals:
  Cai:
    reference: definitional; resting cytosolic Ca 1e-4 mM (Cai_init, cf. Wanaverbecq2003) used when unconnected
    sourced: 'no'
  Cai_NE_base:
    reference: 'definitional; release threshold set at the resting Cai (1e-4 mM, cf. Wanaverbecq2003: 102 nM in rat SCG) so
      release is zero at rest'
    sourced: 'no'
  NE_init:
    reference: definitional; baseline NE 0 (NE is relative to this baseline)
    sourced: 'no'
  k_NE:
    reference: unreferenced_placeholder; owner's hand-set value in the SN_simple model (CA token 'user_defined'); no source
      for a first-order release rate. The sister SN_full/SN_simple parameter files use 0.1 /s
    sourced: 'no'
  k_NET:
    reference: unreferenced_placeholder; owner's hand-set value in the SN_simple model (CA token 'user_defined'); NET uptake
      is reported as Michaelis-Menten kinetics, not a first-order constant. The sister SN_full/SN_simple parameter files use
      0.03 /s
    sourced: 'no'
review: reviews/cell_review.yaml
review_scope: The review of the whole neurons module (11 entries) before the move to versions; only the parts about this version
  apply.
