module_type: SN_varicosity_membrane
version: nn
reviewed: true
description: 'Membrane of a sympathetic-neuron varicosity: its geometry (a sphere of diameter d: A = k_A d^2, Vol = k_V d^3)
  for the varicosity''s channels and Ca handling, and its voltage, which equals the incoming axon voltage (V = V_in).'
notes: 'Membrane of the SN varicosity: it has no dynamics of its own (the axon sets its potential), so it passes the axon''s
  V_in on to the varicosity''s channels as V (V = V_in). Split out of the monolithic SN_soma / SN_varicosity (sympathetic_monolithic_v01)
  by a one-off script (tools/build_sn_modules.py, removed; in git history); SN_simple_flat checks that the assembled parts
  reproduce SN_simple. Geometry (2026-10-02): the varicosity membrane also defines the compartment: diameter d, area A_mem
  = k_A d^2 (to the channels, membrane_area) and volume Vol = k_V d^3 (to the Ca handling, compartment_volume), a sphere by
  default; the defaults reproduce the previous varicosity volume 1 um^3.'
review: reviews/cell_review.yaml
review_scope: The review of the whole neurons module (11 entries) before the move to versions; only the parts about this version
  apply.
