module_type: varicosity
version: sympathetic_monolithic_v01
reviewed: false
notes: 'Owner''s sympathetic varicosity: N-type Ca current, NCX, four-compartment Ca handling as in SN_soma, and a phenomenological
  NE release/reuptake driven by Cai above a baseline. The membrane potential is an input (from the axon), so alone the Ca-channel
  gates have exact solutions and total Ca is conserved up to the membrane fluxes.'
reference_proposals:
  c_init:
    reference: unreferenced_placeholder; initial c gate; Tao 2011 lists no initial conditions (CA token 'Tau2011' is wrong);
      c_inf(-70 mV) is about 4e-6 with V_mid_c 8.1, V_den_c 5
    sourced: 'no'
  hc_init:
    reference: unreferenced_placeholder; initial hc gate; Tao 2011 lists no initial conditions (CA token 'Tau2011' is wrong)
    sourced: 'no'
  V_mid_c:
    reference: 'Tao2011; Supporting Material (Document S1) Eq. 91: c_inf V1/2 = -8.1 mV (= value). Tao''s Ca current is a
      nonspecific high-voltage-activated current (Belluzzi-Sacchi), not specifically L- or N-type'
    sourced: 'yes'
    also_cites:
    - BelluzziSacchi1991
  V_den_c:
    reference: Tao2011; Supporting Material (Document S1) Eq. 91 (k = 9.85 mV); modified here to 5 mV (was 9.85)
    sourced: 'yes'
    also_cites:
    - BelluzziSacchi1991
  tau_c_min:
    reference: unreferenced_placeholder; owner's modification of Tao2011 Eq. 92, whose tau_c spans 0.13-0.56 ms (CA token
      changed_from_belluzi1991_curves)
    sourced: 'no'
    also_cites:
    - Tao2011
  tau_c_max:
    reference: unreferenced_placeholder; owner's modification of Tao2011 Eq. 92, whose tau_c spans 0.13-0.56 ms; 3 ms is about
      5x the source maximum (CA token changed_from_belluzi1991_curves)
    sourced: 'no'
    also_cites:
    - Tao2011
  tau_hc:
    reference: 'Tao2011; Supporting Material (Document S1) Eq. 94: tau_hc = 1/(0.242 e^{0.145V} + 0.0434 e^{-0.0201V}) + 17
      ms, range 17.0-29.9 ms; 20 ms is a constant within that range'
    sourced: 'yes'
    also_cites:
    - BelluzziSacchi1991
  Cai_init:
    reference: Wanaverbecq2003; resting [Ca2+]i 102 +- 4 nM (n = 83) in cultured rat superior cervical ganglion neurons (indo-1),
      Results, first section; 1e-4 mM = value. (Replaces the CA reference Hagiwara1981, which could not be opened)
    sourced: 'yes'
  B_Ca_init:
    reference: unreferenced_placeholder; owner's hand-set value in the SN_simple model (CA token 'user_defined'); at equilibrium
      with Cai_init the free buffer would be B_tot Kd/(Kd + Cai) = 7.990 mM (Kd = 80 uM)
    sourced: 'no'
  B_Ca_total:
    reference: 'Matveev2002; Table 1 ("actual" set): total of the FIXED (immobile) buffer 8 mM (= value). Matveev''s mobile
      buffer is 0.56 mM (Kd 4 uM); here the 8 mM is used for the model''s buffer'
    sourced: 'yes'
  k_bind_Ca:
    reference: 'Matveev2002; Table 1: buffer on-rate 0.5 /uM/ms (= 0.5e6 /mM/s, "actual" fixed buffer) and 0.1 /uM/ms in the
      "quoted" set (Tang et al. 2000); 0.1e6 /mM/s = the quoted value, paired here with the actual-set off-rate (was 0.5e6)'
    sourced: 'yes'
  k_unbind_Ca:
    reference: 'Matveev2002; Table 1 ("actual" set): fixed-buffer off-rate 8 /ms = 8e3 /s (= value; Kd 16 uM with kon 0.5
      /uM/ms; with the kon 0.1 used here Kd = 80 uM)'
    sourced: 'yes'
  k_bind_Ca_ER:
    reference: unreferenced_placeholder; owner's hand-set value in the SN_simple model (CA token 'user_defined')
    sourced: 'no'
  k_unbind_Ca_ER:
    reference: unreferenced_placeholder; Matveev2002 fixed-buffer off-rate 8e3 /s reused for the pre-ER buffer; no source
      for an ER-adjacent buffer
    sourced: 'no'
    also_cites:
    - Matveev2002
  Nai:
    reference: 'BoronBoulpaep2017; typical mammalian intracellular Na 15 mM, modified here to 13 mM (= Nai_init; constant
      when unconnected) [NOT VERIFIED: full text not accessible; value not seen in the source]'
    sourced: 'no'
  Nao:
    reference: 'BoronBoulpaep2017; typical extracellular Na 145 mM [NOT VERIFIED: full text not accessible; value not seen
      in the source]'
    sourced: 'no'
  NE_init:
    reference: definitional; baseline NE 0 (NE is relative to this baseline)
    sourced: 'no'
  Cai_NE_base:
    reference: 'definitional; release threshold set at the resting Cai (1e-4 mM, cf. Wanaverbecq2003: 102 nM in rat SCG) so
      release is zero at rest'
    sourced: 'no'
  k_NE:
    reference: unreferenced_placeholder; owner's hand-set value in the SN_simple model (CA token 'user_defined'); no source
      for a first-order release rate. The sister SN_full/SN_simple parameter files use 0.1 /s
    sourced: 'no'
  k_NET:
    reference: unreferenced_placeholder; owner's hand-set value in the SN_simple model (CA token 'user_defined'); NET uptake
      is reported as Michaelis-Menten kinetics, not a first-order constant. The sister SN_full/SN_simple parameter files use
      0.03 /s
    sourced: 'no'
  g_CaN:
    reference: unreferenced_placeholder; owner's hand-set value in the SN_simple model (CA token 'to_be_identified')
    sourced: 'no'
  Vol:
    reference: 'Brain1997; mouse vas deferens sympathetic varicosities: mean cross-sectional area 0.52 um^2 (n = 71), "a few
      micrometres in length" (pp. 493-494, 497), i.e. about 0.5-2 um^3; 1 um^3 is of that order. The CA reference Bennett1998
      could not be opened'
    sourced: 'yes'
    also_cites:
    - Bennett1998
  Cao:
    reference: 'Tao2011; Supporting Material (Document S1) parameter list: [Ca2+]o = 2 mM (listed for the SA-node cell; no
      separate neuron value). Khaliq2003 also uses 2 mM'
    sourced: 'yes'
    also_cites:
