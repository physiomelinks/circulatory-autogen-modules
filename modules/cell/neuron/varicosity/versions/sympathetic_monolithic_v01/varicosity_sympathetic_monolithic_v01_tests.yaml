module_type: varicosity
version: sympathetic_monolithic_v01
reviewed: false
notes: 'Owner''s sympathetic varicosity: N-type Ca current, NCX, four-compartment Ca handling as in SN_soma, and a phenomenological
  NE release/reuptake driven by Cai above a baseline. The membrane potential is an input (from the axon), so alone the Ca-channel
  gates have exact solutions and total Ca is conserved up to the membrane fluxes. Geometry (2026-10-02): the varicosity is
  a sphere of diameter d (area A_mem = k_A d^2, volume Vol = k_V d^3); g_CaN = A_mem rho_CaN gamma_CaN, k_NaCa = A_mem rho_NaCa
  r_NaCa e, and the ER areas from c_ER Vol and c_ER_pre Vol give k_IP3, k_RyR (A_ER) and k_SERCA, k_leak_Ca (A_ER_pre). The
  defaults reproduce the previous values. Temperature (review 2026-10-05): the model is at room temperature, T = 295.15 K
  (22 degC), like the Davis 2021 thesis recordings it is calibrated to; every gating time constant is divided by phi = Q10^((T
  - T_ref)/10 K) (Q10_CaN, T_ref_CaN, Q10_IP3R, T_ref_IP3R, Q10_RyR, T_ref_RyR). T_ref defaults to 295.15 K, so phi = 1 and
  the kinetics are unchanged; setting T_ref to the source''s recording temperature (on review) scales them, and the model
  can be run at 37 degC by changing T. RyR (review 2026-10-06): the inline RyR is now the Hernandez-Cruz, Escobar & Jimenez
  1997 rat-SCG CICR model, the same equations and default values as RyR HernandezCruz1997_v01 (states a_RyR, i_RyR, l_RyR;
  P_RyR = a (1 - i) l^N; j_RyR = k_RyR P_RyR (Ca_ER - Cai); every rate times phi_RyR = Q10_RyR^((T - T_ref_RyR)/10 K), T_ref
  295.65 K; k_RyR = A_ER rho_RyR k_RyR_single), replacing the owner''s c_RyR^3 hc_RyR^3 law (RyR Argus2026_v01), which is
  inconsistent with the rat-SCG CICR data. It stays the monolithic equivalent of the sympathetic supermodule. PMCA (review
  2026-10-07): the plasma-membrane Ca-ATPase of the supermodule (PMCA Colegrove2000_v01, Hill pump of Colegrove, Albrecht
  & Friel 2000) is added inline, j_max_PMCA = A_mem rho_PMCA r_PMCA / N_A and j_PMCA = -j_max_PMCA Cai^n_PMCA/(K_PMCA^n_PMCA
  + Cai^n_PMCA), j_PMCA in the sub-membrane Ca balance after j_NaCa_Ca, so that the supermodule still reproduces this version.
  NCX density (review 2026-10-07): rho_NaCa 400 /um^2 (hilgemann1991charge, cardiac, as in the soma; was 38719 /um^2, which
  reproduced the old k_NaCa 0.15 nA), so k_NaCa = 1.55 pA on the 4.836 um^2 varicosity.'
known_issues:
- 'Python/C generation unsupported: the RyR site occupancies start from computed initial values (a_RyR_init =
  kon_a Cai_init/(kon_a Cai_init + koff_a), likewise i_RyR_init and l_RyR_init at Ca_ER_init), which libCellML''s
  analyser rejects, so solve_ivp (and C/C++) can''t generate the model; CVODE/Myokit runs it. Since 2026-10-08.'
