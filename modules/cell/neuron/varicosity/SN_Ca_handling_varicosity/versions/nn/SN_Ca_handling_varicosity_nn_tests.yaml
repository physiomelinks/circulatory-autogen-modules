module_type: SN_Ca_handling_varicosity
version: nn
reviewed: false
notes: 'Four-compartment Ca of the SN varicosity, as SN_Ca_handling_soma except that the ER leak j_leak_Ca enters the sub-membrane
  Cai (not the bulk), as in the original SN_varicosity; also gives E_Ca = RT/F ln(Cao/Cai) (sic, no factor 1/2, as in the
  original). Split out of the monolithic SN_soma / SN_varicosity (sympathetic_monolithic_v01) by a one-off script (tools/build_sn_modules.py,
  removed; in git history); SN_simple_flat checks that the assembled parts reproduce SN_simple. Geometry (2026-10-02): Vol
  is an input (compartment_volume port) from the membrane. The ER volumes are V_ER = c_ER Vol and V_ER_pre = c_ER_pre Vol,
  with membrane areas A_ER = k_A_ER (V_ER/k_V_ER)^(2/3) and A_ER_pre = k_A_ER_pre (V_ER_pre/k_V_ER_pre)^(2/3) (shape factors;
  default a sphere). SERCA and the Ca leak move Ca across the pre-ER membrane, so k_SERCA = A_ER_pre rho_SERCA r_SERCA / N_A
  and k_leak_Ca = A_ER_pre rho_leak_Ca k_leak_Ca_single (1e-18 m3/um3); A_ER goes to IP3R and RyR (ER_membrane_area), whose
  release crosses the ER membrane. The diffusion constants D_Ca, D_Ca_ER are unchanged. The defaults reproduce the previous
  k_SERCA and k_leak_Ca. Temperature (review 2026-10-05): the model is at room temperature, T = 295.15 K (22 degC), like the
  Davis 2021 thesis recordings it is calibrated to (was 310.15 K); this enters the Nernst/GHK terms.'
reference_proposals:
  B_Ca_init:
    reference: unreferenced_placeholder; owner's hand-set value in the SN_simple model (CA token 'user_defined'); at equilibrium
      with Cai_init the free buffer would be B_tot Kd/(Kd + Cai) = 7.990 mM (Kd = 80 uM)
    sourced: 'no'
  B_Ca_total:
    reference: 'Matveev2002; Table 1 ("actual" set): total of the FIXED (immobile) buffer 8 mM (= value). Matveev''s mobile
      buffer is 0.56 mM (Kd 4 uM); here the 8 mM is used for the model''s buffer'
    sourced: 'yes'
  Ca_ER_init:
    reference: unreferenced_placeholder; owner's hand-set value in the SN_simple model (CA token 'to_be_checked_in_neurons');
      0.6 mM is 2-10x the resting ER-lumen Ca measured in rat sensory neurons (60-270 uM, Solovyova2002, Abstract/Results)
    sourced: 'no'
    also_cites:
    - Solovyova2002
  Cai_init:
    reference: Wanaverbecq2003; resting [Ca2+]i 102 +- 4 nM (n = 83) in cultured rat superior cervical ganglion neurons (indo-1),
      Results, first section; 1e-4 mM = value. (Replaces the CA reference Hagiwara1981, which could not be opened)
    sourced: 'yes'
  Cao:
    reference: 'Tao2011; Supporting Material (Document S1) parameter list: [Ca2+]o = 2 mM (listed for the SA-node cell; no
      separate neuron value). Khaliq2003 also uses 2 mM'
    sourced: 'yes'
    also_cites:
    - Khaliq2003
  D_Ca:
    reference: unreferenced_placeholder; owner's hand-set value in the SN_simple model (CA token 'identified_by_hand'); lumped
      sub-membrane-to-bulk exchange coefficient
    sourced: 'no'
  D_Ca_ER:
    reference: unreferenced_placeholder; owner's hand-set value in the SN_simple model (CA token 'need_to_change_for_volume');
      lumped pre-ER-to-ER exchange coefficient
    sourced: 'no'
  H_SERCA:
    reference: Shannon2004; Table 11, SR Ca pump Hill coefficient H = 1.787 (= value)
    sourced: 'yes'
  K_mf:
    reference: Shannon2004; Table 11, SR Ca pump Kmf = 0.246 uM; modified here to 0.1 uM (was 0.246e-3 mM)
    sourced: 'yes'
  K_mr:
    reference: Shannon2004; Table 11, SR Ca pump Kmr = 1.7 mM; modified here to 0.5 mM (was 1.7; the varicosity's CA reference
      omitted the change)
    sourced: 'yes'
  Vol:
    reference: 'Brain1997; mouse vas deferens sympathetic varicosities: mean cross-sectional area 0.52 um^2 (n = 71), "a few
      micrometres in length" (pp. 493-494, 497), i.e. about 0.5-2 um^3; 1 um^3 is of that order. The CA reference Bennett1998
      could not be opened'
    sourced: 'yes'
    also_cites:
    - Bennett1998
  c_ER:
    reference: unreferenced_placeholder; owner's hand-set value in the SN_simple model (CA token 'Li1994Equations_was_0.185');
      ER volume fraction. Li & Rinzel / De Young & Keizer c1 = 0.185 (DYK Table 1) is the ER/cytosol volume ratio, a different
      quantity, so 0.01 is not sourced
    sourced: 'no'
    also_cites:
    - DeYoungKeizer1992
  c_ER_pre:
    reference: unreferenced_placeholder; owner's hand-set value in the SN_simple model (CA token 'user_defined'); pre-ER volume
      fraction
    sourced: 'no'
  c_SL:
    reference: unreferenced_placeholder; owner's hand-set value in the SN_simple model (CA token 'user_defined_TO_BE_FOUND');
      sub-membrane volume fraction
    sourced: 'no'
  k_bind_Ca:
    reference: 'Matveev2002; Table 1: buffer on-rate 0.5 /uM/ms (= 0.5e6 /mM/s, "actual" fixed buffer) and 0.1 /uM/ms in the
      "quoted" set (Tang et al. 2000); 0.1e6 /mM/s = the quoted value, paired here with the actual-set off-rate (was 0.5e6)'
    sourced: 'yes'
  k_bind_Ca_ER:
    reference: unreferenced_placeholder; owner's hand-set value in the SN_simple model (CA token 'user_defined')
    sourced: 'no'
  k_unbind_Ca:
    reference: 'Matveev2002; Table 1 ("actual" set): fixed-buffer off-rate 8 /ms = 8e3 /s (= value; Kd 16 uM with kon 0.5
      /uM/ms; with the kon 0.1 used here Kd = 80 uM)'
    sourced: 'yes'
  k_unbind_Ca_ER:
    reference: unreferenced_placeholder; Matveev2002 fixed-buffer off-rate 8e3 /s reused for the pre-ER buffer; no source
      for an ER-adjacent buffer
    sourced: 'no'
    also_cites:
    - Matveev2002
  rho_SERCA:
    reference: 'definitional; chosen so that k_SERCA = A rho r_SERCA / N_A reproduces the previous k_SERCA = 1.5e-19 mol_per_s
      (to_be_identified) with A = 0.6476 um^2 (the varicosity pre-ER membrane area) and r_SERCA = 20 per_s; a density for
      calibration through r_SERCA. The previous k_SERCA (as proposed in review): unreferenced_placeholder; owner''s hand-set
      value in the SN_simple model (CA token ''to_be_identified''); scales with compartment volume (Shannon2004 Vmax = 286
      umol/L cytosol/s for the myocyte)'
    sourced: 'no'
  rho_leak_Ca:
    reference: 'definitional; chosen so that k_leak_Ca = A rho k_leak_Ca_single (1e-18 m3/um3) reproduces the previous k_leak_Ca
      = 2e-20 m3_per_s (user_defined) with A = 0.6476 um^2 (the varicosity pre-ER membrane area) and k_leak_Ca_single = 0.01
      um3_per_s; a density for calibration through k_leak_Ca_single. The previous k_leak_Ca (as proposed in review): unreferenced_placeholder;
      owner''s hand-set value in the SN_simple model (CA token ''user_defined'')'
    sourced: 'no'
review: reviews/cell_review.yaml
