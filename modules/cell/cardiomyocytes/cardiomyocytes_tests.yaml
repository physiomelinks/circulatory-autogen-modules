module: cardiomyocytes
reviewed: false
known_issues: ['undefined units: C_per_M', 'undefined units: J_per_MK', 'undefined units: M_per_m3', 'undefined units: m3_per_M_millis',
  port variable d not in variables_and_units]
defaults:
  sim_time: 2.0
  pre_time: 0.0
  dt: 0.01
  solver: CVODE_myokit
  bc_sweep:
    factors: [0.5, 0.75, 1.0, 1.5, 2.0]
    ranges: {}
  timestep:
    scheme: rk4
    dts: [0.004, 0.002, 0.001, 0.0005]
    min_order: 0.8
    tol: 0.0001
    cvode_tol: 0.001
  stability:
    supported:
    - {solver: CVODE_myokit, rtol: 1.0e-06, atol: 1.0e-08}
  solver_info: {rtol: 1.0e-08, atol: 1.0e-10}
review:
  comment: '[Split from the cell module on review; this block is the whole of cell''s review, of which only the parts about
    this module''s components apply.] Seven of nine components do not generate as committed. R and F carry units J_per_MK/C_per_M
    (undefined) in the parameters file and Paci components but J_per_mol_K/C_per_mol in the SN components, so libcuflynx exits
    for the SN soma/varicosity too; Ca_dynamics_Paci_2013 has Vm ''dimensionless'' vs volt, the unlisted port variable d and
    five outputs without interface; Vm_volt has no interface. NE_release_Tao_2011 is a prototype with inconsistent units (V_Ca..
    in J_per_M, gamma m3_per_M_millis) and all vesicle states starting at 0 so nothing can bind. SN_soma''s Nai balance omits
    i_Na1_6, adds epsilon_tau = 0.1 ms to every time constant, and several CA references are wrong or unverifiable (Nai_mid_NaK
    is Paci''s 40 mM, not Lindblad''s 11; tau_z_BK 5 vs Khaliq 1 ms).'
  summary: '9 components: Paci 2013 membrane potential, Ca handling, Na balance and reversal potentials; Tao 2011 sympathetic-neuron
    membrane and NE release; the owner''s sympathetic neuron soma, varicosity and axon (SN_simple). Specs with exact checks
    throughout: linear charge/mass integrators, total-Ca conservation (Paci SR+cytosol; SN four compartments), Nernst identities,
    full charge conservation for the SN soma, exact clamp solutions for the varicosity Ca gates and the axon RC. ~180 SN references
    checked (web, Crossref): most Channelpedia/Khaliq/Shannon/Li-Rinzel/Tao/Martin values confirmed, several flagged. In the
    repo only myocyte_membrane_voltage and SN_axon generate; with the proposed unit/interface fixes on a patched copy, every
    component passes every test (NE_release only trivially: its vesicle states stay identically 0).'
  questions: ['Approve unifying the units of the globals R and F to the defined J_per_mol_K / C_per_mol (CellML, config and
      parameters) - this alone unblocks electric_potentials, Na_dynamics, SN_soma and SN_varicosity.', 'Ca_dynamics_Paci_2013:
      Ca_SR initial value in the original Paci CellML is NEGATIVE (-0.2734 mM). Keep it (faithful), or use a positive quasi-steady
      value? The tests run at Ca_SR_init = 0.3 mM.', 'SN_soma: j_Na1_6 is computed but not included in dNai/dt (i_Na1_6 changes
      V but no ion pool). Intended? The charge-conservation invariant accounts for it explicitly.', 'SN_soma: I_in enters
      dV/dt with the sign of an outward current (positive I_in hyperpolarises). Intended convention?', 'SN_soma/varicosity:
      epsilon_tau = 0.1 ms is added to every gating time constant, which dominates the fast Na activation (tau_m 0.06 ms in
      Belluzzi-Sacchi). Intended?', 'References to correct: Nai_mid_NaK = 40 mM is Paci 2013''s Km_Na (Lindblad 1996 uses
      11 mM); tau_z_BK = 5 ms vs Khaliq 2003 1 ms; tau_w_min cited to Gupta 2016 (an SK bladder paper) looks wrong; g_KCa_BK
      ''70 uS/cm2 in Khaliq'' - units could not be confirmed; K_mr in SN_varicosity also ''was 1.7''.', 'Unverifiable CA references
      (full text or thesis not accessible): Matveev2002 (buffer), Gupta2016 (SK), BoronBoulpaep2017, Hagiwara1981, Bennett1998
      (varicosity volume), Wu2012 (soma volume), Davis 2021 thesis/transcriptomic (Cm 30 pF, g_M, g_Kv2). Can you supply them?
      They are proposed with sourced: no.', 'NE_release_Tao_2011: Tao 2011 values proposed (Koff 9.5/ms, Kon 90/(mM ms), b
      0.25, gamma 6/ms, VZ 1e-16 L, Vcleft 1.5e-15 L, Pup 1e4/ms, n 12, a 4000; = Schneggenburger & Neher 2000). K_Ca is not
      given in Tao 2011 (placeholder 1000/s). Tao Eq. 2 multiplies i_Ca by Cm (current per capacitance); here C_m is unused.
      Rework the component (units, V_Ca initial occupancy) before review?', 'sympathetic_neuron_membrane_voltage: C_m = 240
      pF (Tao 2011 table) proposed; Vm_init -60 mV placeholder. OK?', 'SN_soma/varicosity sweeps: B_Ca_init must stay below
      B_Ca_total (else the bound buffer is negative and the run fails). Consider parametrising the initial buffer as a fraction.',
    'Validation is pending everywhere except the pure integrators (not_applicable). Can you supply stellate-neuron current-clamp
      traces (Paterson group / Davis) for SN_soma baseline and calibration of the to_be_identified conductances?']
  proposed_fixes: ['cell_modules.cellml, cell_modules_config.json, cell_parameters.csv: R in J_per_mol_K and F in C_per_mol
      everywhere (replace J_per_MK / C_per_M).', 'Ca_dynamics_Paci_2013: Vm units ''dimensionless'' -> ''volt'' (config and
      parameters); add [''d'', ''dimensionless'', ''access'', ''boundary_condition''] and a parameters row; public_interface=''out''
      for Ca_SR, g, i_up, i_rel, i_leak.', 'sympathetic_neuron_membrane_voltage: public_interface=''out'' for Vm_volt.', 'NE_release_Tao_2011:
      define M_per_m3 / m3_per_M_millis or (better) use millimol_per_m3 and per_millis consistently; config K_off per_s ->
      per_millis and Cai M_per_m3 -> millimol_per_m3 (as the CellML); give V_Ca a non-zero initial occupancy.']
  findings: ['Patched copy: Ca_dynamics total-Ca conservation holds to 1e-5 relative across 104 sweep runs; SN_soma charge
      conservation (Cm dV = F(Vol dNa + Vol dK + 2 dN_Ca) + external/Na1.6 charge) and four-compartment Ca conservation hold
      at the run point and over 366 sweep runs; SN varicosity gate exact solutions and Ca conservation hold over 191 sweep
      runs.', 'SN_soma and SN_varicosity are stiff (buffer binding ~8e5 /s, diffusion ~1.5e5 /s): RK4 needs dt <= 2e-6 s.',
    Paci Ca_dynamics nominal run uses the negative Ca_SR initial value of the original CellML; invariants still hold.]
components:
- vessel_type: Ca_dynamics_Paci_2013
  BC_type: nn
  module_type: Ca_dynamics_Paci_2013
  sim_time: 0.5
  dt: 0.0005
  timestep:
    scheme: rk4
    dts: [0.0005, 0.00025, 0.000125, 6.25e-05]
    t_end: 0.1
    min_order: 0.8
    tol: 0.0001
    cvode_tol: 0.001
  outputs: [Cai, Ca_SR, g, i_up, i_rel, i_leak]
  invariants:
  - {description: 'total Ca content (free + rapidly buffered, cytosol + SR, in um^3 mM) changes only by the sarcolemmal fluxes:
      Q(t) = Q(0) - (I_CaL + I_bCa + I_PCa - 2 I_NaCa) Cm/(2 F 1e-18) t (exact for constant currents; SR uptake, release and
      leak cancel)', expr: 'np.max(np.abs(((Vc*(Cai + Buf_C*Cai/(Cai + Kbuf_C)) + V_SR*(Ca_SR + Buf_SR*Ca_SR/(Ca_SR + Kbuf_SR)))
      - (Vc*(Cai + Buf_C*Cai/(Cai + Kbuf_C)) + V_SR*(Ca_SR + Buf_SR*Ca_SR/(Ca_SR + Kbuf_SR)))[0]) + (i_CaL + i_b_Ca + i_PCa
      - 2*i_NaCa)*Cm/(2*F*1e-18)*t)) <= 1e-5*np.max(np.abs((Vc*(Cai + Buf_C*Cai/(Cai + Kbuf_C)) + V_SR*(Ca_SR + Buf_SR*Ca_SR/(Ca_SR
      + Kbuf_SR))))) + 1e-9'}
  - {description: 'Ca2+ release gate g stays in [0, 1]', expr: np.all((g >= -1e-9) & (g <= 1 + 1e-9))}
  - {description: SERCA uptake i_up = VmaxUp/(1 + Kup^2/Cai^2) (Paci 2013), expr: np.max(np.abs(i_up - VmaxUp/(1 + Kup**2/Cai**2)))
      <= 1e-9*VmaxUp}
  - {description: leak i_leak = V_leak (Ca_SR - Cai), expr: np.max(np.abs(i_leak - V_leak*(Ca_SR - Cai))) <= 1e-12}
  run_parameters: {i_CaL: -0.5, i_NaCa: 0.1, Ca_SR_init: 0.3}
  bc_sweep:
    ranges:
      i_CaL: {min: -3.0, max: 0.0, points: 3}
      i_PCa: {min: 0.0, max: 0.4, points: 3}
      i_b_Ca: {min: -0.5, max: 0.5, points: 3}
      i_NaCa: {min: -0.5, max: 0.5, points: 3}
      Vm: {min: -0.1, max: 0.05, points: 3}
      Cai_init: {min: 1.0e-05, max: 0.001, points: 3, scale: log}
      Ca_SR_init: {min: 0.05, max: 1.0, points: 3}
      g_init: {min: 0.0, max: 1.0, points: 3}
    rationale: currents over the ranges seen during a Paci 2013 beat (I_CaL down to about -3 A/F, others below 0.5 A/F), Vm
      -100 to +50 mV (both sides of the -60 mV threshold of const2), Cai 1e-5 to 1e-3 mM, Ca_SR 0.05-1 mM (positive, physiological),
      g over [0, 1]; constants by the default factors 0.5-2.
  notes: 'Paci 2013 intracellular Ca handling: cytosolic Cai and SR Ca_SR with rapid buffering (Buf_C, Buf_SR), SERCA uptake
    i_up, release i_rel (gated by the L-type d gate and g) and leak. d comes from the I_CaL d gate. With the sarcolemmal currents
    held constant the total Ca content changes linearly (exact conservation law).'
  reference_proposals:
    a_rel: {reference: 'Paci2013; value in the authors'' CellML (PMR workspace sseveri/paci_hyttinen_aaltosetala_severi_2013,
        ventricularVersion): a_rel = 16.464', sourced: 'yes', value: 16.464}
    b_rel: {reference: 'Paci2013; value in the authors'' CellML (PMR workspace sseveri/paci_hyttinen_aaltosetala_severi_2013,
        ventricularVersion): b_rel = 0.25', sourced: 'yes', value: 0.25}
    c_rel: {reference: 'Paci2013; value in the authors'' CellML (PMR workspace sseveri/paci_hyttinen_aaltosetala_severi_2013,
        ventricularVersion): c_rel = 8.232', sourced: 'yes', value: 8.232}
    tau_g: {reference: 'Paci2013; value in the authors'' CellML (PMR workspace sseveri/paci_hyttinen_aaltosetala_severi_2013,
        ventricularVersion): tau_g = 0.002', sourced: 'yes', value: 0.002}
    Kup: {reference: 'Paci2013; value in the authors'' CellML (PMR workspace sseveri/paci_hyttinen_aaltosetala_severi_2013,
        ventricularVersion): Kup = 0.00025', sourced: 'yes', value: 0.00025}
    Buf_C: {reference: 'Paci2013; value in the authors'' CellML (PMR workspace sseveri/paci_hyttinen_aaltosetala_severi_2013,
        ventricularVersion): Buf_C = 0.25', sourced: 'yes', value: 0.25}
    Buf_SR: {reference: 'Paci2013; value in the authors'' CellML (PMR workspace sseveri/paci_hyttinen_aaltosetala_severi_2013,
