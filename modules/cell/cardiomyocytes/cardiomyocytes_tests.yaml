- vessel_type: electric_potentials_Paci_2013
  BC_type: nn
  module_type: electric_potentials_Paci_2013
  sim_time: 0.01
  dt: 0.001
  outputs: [E_Na, E_K, E_Ks, E_Ca]
  invariants:
  - {description: 'Nernst: E_Na = RT/F ln(Nao/Nai)', expr: np.max(np.abs(E_Na - R*T/F*np.log(Nao/Nai))) <= 1e-12}
  - {description: 'Nernst: E_K = RT/F ln(Ko/Ki)', expr: np.max(np.abs(E_K - R*T/F*np.log(Ko/Ki))) <= 1e-12}
  - {description: GHK-type I_Ks reversal E_Ks = RT/F ln((Ko + PkNa Nao)/(Ki + PkNa Nai)), expr: np.max(np.abs(E_Ks - R*T/F*np.log((Ko
      + PkNa*Nao)/(Ki + PkNa*Nai)))) <= 1e-12}
  - {description: 'Nernst (z = 2): E_Ca = 0.5 RT/F ln(Cao/Cai)', expr: np.max(np.abs(E_Ca - 0.5*R*T/F*np.log(Cao/Cai))) <=
      1e-12}
  - {description: E_Ks lies between E_K and E_Na, expr: np.all((E_Ks >= E_K - 1e-12) & (E_Ks <= E_Na + 1e-12))}
  bc_sweep:
    ranges:
      Nai: {min: 5.0, max: 20.0, points: 4}
      Cai: {min: 1.0e-05, max: 0.001, points: 3, scale: log}
      T: {min: 295.0, max: 310.15, points: 2}
      R: {min: 8.314, max: 8.314, points: 1}
      F: {min: 96485.0, max: 96485.0, points: 1}
    rationale: intracellular Na 5-20 mM, Ca 1e-5 to 1e-3 mM, extracellular/intracellular constants by the default factors
      0.5-2, T room to body temperature; R and F are physical constants.
  notes: 'Paci 2013 reversal potentials (algebraic): Nernst potentials for Na, K and Ca and the Na-permeable I_Ks reversal.'
  reference_proposals:
    PkNa: {reference: 'Paci2013; value in the authors'' CellML (PMR workspace sseveri/paci_hyttinen_aaltosetala_severi_2013,
        ventricularVersion): PkNa = 0.03', sourced: 'yes', value: 0.03}
    Nai: {reference: 'Paci2013; initial value in the authors'' CellML (PMR workspace sseveri/paci_hyttinen_aaltosetala_severi_2013,
        ventricularVersion): Nai = 10.9248', sourced: 'yes', value: 10.9248496211574}
    Cai: {reference: 'Paci2013; initial value in the authors'' CellML (PMR workspace sseveri/paci_hyttinen_aaltosetala_severi_2013,
        ventricularVersion): Cai = 1.80774e-05', sourced: 'yes', value: 1.80773974140477e-05}
    R: {reference: 'CODATA2018; molar gas constant 8.314462618 J/(mol K), rounded to 8.314', sourced: 'yes'}
    T: {reference: unreferenced_placeholder; 310.15 K = 37 C (body temperature). The CA reference Tao2011 could not be checked
        for this value (Paci 2013 uses 310 K), sourced: 'no'}
    F: *id001
    Nao: {reference: 'Paci2013; value in the authors'' CellML (PMR workspace sseveri/paci_hyttinen_aaltosetala_severi_2013,
        ventricularVersion): Nao = 151 mM (Paci 2013 cell; used by the Paci components of this module)', sourced: 'yes', value: 151.0}
    Cao: {reference: 'Paci2013; value in the authors'' CellML (PMR workspace sseveri/paci_hyttinen_aaltosetala_severi_2013,
        ventricularVersion): Cao = 1.8 mM (Paci 2013 cell; used by the Paci components of this module)', sourced: 'yes', value: 1.8}
    Ki: {reference: 'Paci2013; value in the authors'' CellML (PMR workspace sseveri/paci_hyttinen_aaltosetala_severi_2013,
        ventricularVersion): Ki = 150 mM (Paci 2013 cell; used by the Paci components of this module)', sourced: 'yes', value: 150.0}
    Ko: {reference: 'Paci2013; value in the authors'' CellML (PMR workspace sseveri/paci_hyttinen_aaltosetala_severi_2013,
        ventricularVersion): Ko = 5.4 mM (Paci 2013 cell; used by the Paci components of this module)', sourced: 'yes', value: 5.4}
