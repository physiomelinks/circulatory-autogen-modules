    i_NaCa: {reference: definitional; i_NaCa is supplied by a connected module in a network; 0 alone (test operating point),
      sourced: definitional, value: 0.0}
    Vc: &id003 {reference: 'Paci2013; value in the authors'' CellML (PMR workspace sseveri/paci_hyttinen_aaltosetala_severi_2013,
        ventricularVersion): Vc = 8800 um^3 (Paci 2013 cell; used by the Paci components of this module)', sourced: 'yes',
      value: 8800.0}
    V_SR: {reference: 'Paci2013; value in the authors'' CellML (PMR workspace sseveri/paci_hyttinen_aaltosetala_severi_2013,
        ventricularVersion): V_SR = 583.73 um^3 (Paci 2013 cell; used by the Paci components of this module)', sourced: 'yes',
      value: 583.73}
    F: &id001 {reference: 'CODATA2018; Faraday constant 96485.33212 C/mol, rounded to 96485 C/mol', sourced: 'yes'}
    Cm: &id002 {reference: 'Paci2013; value in the authors'' CellML (PMR workspace sseveri/paci_hyttinen_aaltosetala_severi_2013,
        ventricularVersion): Cm = 9.87109e-11 F (Paci 2013 cell; used by the Paci components of this module)', sourced: 'yes',
      value: 9.87109e-11}
    d: {reference: definitional; I_CaL d gate supplied by i_CaL_d_gate_Paci_2013 in a network; Paci2013 initial value 8.96088e-5
        alone. Only applies once d is added to variables_and_units (proposed fix), sourced: definitional, value: 8.96088425225182e-05}
