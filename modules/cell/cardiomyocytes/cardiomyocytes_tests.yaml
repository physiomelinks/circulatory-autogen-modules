    Cai_init: {reference: 'Paci2013; initial value in the authors'' CellML (PMR workspace sseveri/paci_hyttinen_aaltosetala_severi_2013,
        ventricularVersion): Cai_init = 1.80774e-05', sourced: 'yes', value: 1.80773974140477e-05}
    Ca_SR_init: {reference: 'Paci2013; initial value in the authors'' CellML (PMR workspace sseveri/paci_hyttinen_aaltosetala_severi_2013,
        ventricularVersion): Ca_SR_init = -0.273423 mM (NEGATIVE in the original CellML; see review question)', sourced: 'yes',
      value: -0.2734234751931}
    g_init: {reference: 'Paci2013; initial value in the authors'' CellML (PMR workspace sseveri/paci_hyttinen_aaltosetala_severi_2013,
        ventricularVersion): g_init = 1', sourced: 'yes', value: 0.999999981028517}
    Vm: {reference: 'Paci2013; resting (initial) Vm in the authors'' CellML (PMR workspace sseveri/paci_hyttinen_aaltosetala_severi_2013,
        ventricularVersion): -0.0743340 V (clamp input here; declared dimensionless but used as volts)', sourced: 'yes', value: -0.0743340057623841}
    i_CaL: {reference: definitional; i_CaL is supplied by a connected module in a network; 0 alone (test operating point),
