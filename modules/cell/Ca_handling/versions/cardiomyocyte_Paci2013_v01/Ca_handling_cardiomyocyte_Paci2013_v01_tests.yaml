    d (used in i_rel) is not in variables_and_units (known issue); Ca_SR, g, i_up, i_rel, i_leak are exposed in the config
    but have no interface in the CellML; and the global constants R and F are in units J_per_MK / C_per_M in cell_parameters.csv
    and the Paci components, which are not defined anywhere (known issue), while the SN components declare the same globals
    as J_per_mol_K / C_per_mol (libcuflynx exits: ''units of J_per_MK in parameters.csv file does not match with units of
    J_per_mol_K in module_config.json for param R''). Fix: use the defined J_per_mol_K / C_per_mol everywhere (CellML, config,
    parameters) for R and F. Fixes: Vm -> volt, add d as a boundary_condition, public_interface=''out'' for the five variables,
    unified R/F units. With the proposed fixes applied to a copy of the library, all tests of this component pass.'
