module_type: Ca_handling
version: cardiomyocyte_Paci2013_v01
reviewed: false
notes: 'Paci 2013 intracellular Ca handling: cytosolic Cai and SR Ca_SR with rapid buffering (Buf_C, Buf_SR), SERCA uptake
  i_up, release i_rel (gated by the L-type d gate and g) and leak. d comes from the I_CaL d gate. With the sarcolemmal currents
  held constant the total Ca content changes linearly (exact conservation law).


  Ports of the versions of Ca_handling (they differ; allowed and documented, see modules/README.md, Versions):

  entrance CaL_current: cardiomyocyte_Paci2013_v01 [i_CaL]; SN_soma_Argus2026_v01 -; SN_varicosity_Argus2026_v01 -

  entrance internal_Ca: cardiomyocyte_Paci2013_v01 [Cai]; SN_soma_Argus2026_v01 -; SN_varicosity_Argus2026_v01 -

  entrance membrane_voltage: cardiomyocyte_Paci2013_v01 [Vm]; SN_soma_Argus2026_v01 -; SN_varicosity_Argus2026_v01 -

  exit CaL_current: cardiomyocyte_Paci2013_v01 [i_CaL]; SN_soma_Argus2026_v01 -; SN_varicosity_Argus2026_v01 -

  exit NaCa_current: cardiomyocyte_Paci2013_v01 [i_NaCa]; SN_soma_Argus2026_v01 -; SN_varicosity_Argus2026_v01 -

  exit PCa_current: cardiomyocyte_Paci2013_v01 [i_PCa]; SN_soma_Argus2026_v01 -; SN_varicosity_Argus2026_v01 -

  exit b_Ca_current: cardiomyocyte_Paci2013_v01 [i_b_Ca]; SN_soma_Argus2026_v01 -; SN_varicosity_Argus2026_v01 -

  exit internal_Ca: cardiomyocyte_Paci2013_v01 [Cai]; SN_soma_Argus2026_v01 -; SN_varicosity_Argus2026_v01 -

  exit internal_Ca_d_gate_port: cardiomyocyte_Paci2013_v01 [Cai, d]; SN_soma_Argus2026_v01 -; SN_varicosity_Argus2026_v01
  -

  general Ca_flux: cardiomyocyte_Paci2013_v01 -; SN_soma_Argus2026_v01 [j_Ca_in]; SN_varicosity_Argus2026_v01 [j_Ca_in]

  general Ca_potential: cardiomyocyte_Paci2013_v01 -; SN_soma_Argus2026_v01 -; SN_varicosity_Argus2026_v01 [E_Ca]

  general ER_Ca: cardiomyocyte_Paci2013_v01 -; SN_soma_Argus2026_v01 [Ca_ER]; SN_varicosity_Argus2026_v01 [Ca_ER]

  general ER_Ca_release: cardiomyocyte_Paci2013_v01 -; SN_soma_Argus2026_v01 [j_ER_release]; SN_varicosity_Argus2026_v01 [j_ER_release]

  general ER_membrane_area: cardiomyocyte_Paci2013_v01 -; SN_soma_Argus2026_v01 [A_ER]; SN_varicosity_Argus2026_v01 [A_ER]

  general bulk_Ca: cardiomyocyte_Paci2013_v01 -; SN_soma_Argus2026_v01 [Ca_bulk]; SN_varicosity_Argus2026_v01 [Ca_bulk]

  general compartment_volume: cardiomyocyte_Paci2013_v01 -; SN_soma_Argus2026_v01 [Vol]; SN_varicosity_Argus2026_v01 [Vol]

  general internal_Ca: cardiomyocyte_Paci2013_v01 -; SN_soma_Argus2026_v01 [Cai]; SN_varicosity_Argus2026_v01 [Cai]

  general shell_membrane_area: cardiomyocyte_Paci2013_v01 -; SN_soma_Argus2026_v01 [A_mem]; SN_varicosity_Argus2026_v01 -'
known_issues:
- 'undefined units: C_per_M'
- port variable d not in variables_and_units
