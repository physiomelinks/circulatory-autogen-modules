        found that reports it; equals R T with R = 8.314462618 J/(mol K) (CODATA2018) at T = 300.7 K; body temperature (310.15
        K) gives 2578.8 J/mol
      sourced: 'no'
      value: 2500
    F: &id013
      reference: CODATA2018; Faraday constant F = N_A e = 96485.33212 C/mol (exact in the 2019 SI); the source model used
        0.965e5
      sourced: 'yes'
      value: 96485.33212
    E_pt: &id014
      reference: unreferenced_placeholder; 1 J (tubular elastance scale of u = E (q - U)/(L - q)^2) from P. Hunter's unpublished
        blood-volume-control parameter set (CA_user_volume_control ANS_CVS_BVC_parameters.csv, data_reference 'Peter_Hunter';
        same value in ANS_CVS_BVolCtl_FA_MG_PH_v2.cellml); no publication found that reports it
      sourced: 'no'
      value: 1
    U_pt_W: &id015
      reference: unreferenced_placeholder; 0.1 L (tubular volume at zero pressure) from P. Hunter's unpublished blood-volume-control
        parameter set (CA_user_volume_control ANS_CVS_BVC_parameters.csv, data_reference 'Peter_Hunter'; same value in ANS_CVS_BVolCtl_FA_MG_PH_v2.cellml);
        no publication found that reports it
      sourced: 'no'
      value: 0.1
    L_pt_W: &id016
      reference: unreferenced_placeholder; 1 L (tubular volume limit; u_pt_W is singular there) from P. Hunter's unpublished
        blood-volume-control parameter set (CA_user_volume_control ANS_CVS_BVC_parameters.csv, data_reference 'Peter_Hunter';
        same value in ANS_CVS_BVolCtl_FA_MG_PH_v2.cellml); no publication found that reports it
      sourced: 'no'
      value: 1
    q_ptEpi_W: &id017
      reference: unreferenced_placeholder; 0.5 L (epithelial water volume) from P. Hunter's unpublished blood-volume-control
        parameter set (CA_user_volume_control ANS_CVS_BVC_parameters.csv, data_reference 'Peter_Hunter'; same value in ANS_CVS_BVolCtl_FA_MG_PH_v2.cellml);
        no publication found that reports it
      sourced: 'no'
      value: 0.5
    k_pt_W: &id018
      reference: 'unreferenced_placeholder; 0 L/(s kPa): no tubular water reabsorption in the source model from P. Hunter''s
        unpublished blood-volume-control parameter set (CA_user_volume_control ANS_CVS_BVC_parameters.csv, data_reference
        ''Peter_Hunter''; same value in ANS_CVS_BVolCtl_FA_MG_PH_v2.cellml); no publication found that reports it'
      sourced: 'no'
      value: 0
    k_gl_W: &id019
      reference: unreferenced_placeholder; 5 L/(s kPa) (glomerular water conductance) from P. Hunter's unpublished blood-volume-control
        parameter set (CA_user_volume_control ANS_CVS_BVC_parameters.csv, data_reference 'Peter_Hunter'; same value in ANS_CVS_BVolCtl_FA_MG_PH_v2.cellml);
        no publication found that reports it
      sourced: 'no'
      value: 5
    kK_pt_Na: &id020
      reference: unreferenced_placeholder; 1 1/s from P. Hunter's unpublished blood-volume-control parameter set (CA_user_volume_control
        ANS_CVS_BVC_parameters.csv, data_reference 'Peter_Hunter'; same value in ANS_CVS_BVolCtl_FA_MG_PH_v2.cellml); no publication
        found that reports it
      sourced: 'no'
      value: 1
    kK_gl_Na: &id021
      reference: unreferenced_placeholder; 1 1/s (gives a glomerular Na flux of about 3.5e-3 mol/s per kidney, some 20x the
        physiological filtered Na load of about 1.5e-4 mol/s per kidney) from P. Hunter's unpublished blood-volume-control
        parameter set (CA_user_volume_control ANS_CVS_BVC_parameters.csv, data_reference 'Peter_Hunter'; same value in ANS_CVS_BVolCtl_FA_MG_PH_v2.cellml);
        no publication found that reports it
      sourced: 'no'
      value: 1
    k_ptEpi_NKE: &id022
      reference: unreferenced_placeholder; 100000 mol/s (NKE rate constant) from P. Hunter's unpublished blood-volume-control
        parameter set (CA_user_volume_control ANS_CVS_BVC_parameters.csv, data_reference 'Peter_Hunter'; same value in ANS_CVS_BVolCtl_FA_MG_PH_v2.cellml);
        no publication found that reports it
      sourced: 'no'
      value: 100000
    K_Na: &id023
      reference: unreferenced_placeholder; 1 L/mol from P. Hunter's unpublished blood-volume-control parameter set (CA_user_volume_control
        ANS_CVS_BVC_parameters.csv, data_reference 'Peter_Hunter'; same value in ANS_CVS_BVolCtl_FA_MG_PH_v2.cellml); no publication
        found that reports it; a Na binding affinity of 1 L/mol (K_d = 1 M) is far weaker than NKE affinities in the literature
        (intracellular Na K_d of order 10 mM); treat as a lumped, non-physiological constant
      sourced: 'no'
      value: 1
    K_K: &id024
      reference: unreferenced_placeholder; 1 L/mol from P. Hunter's unpublished blood-volume-control parameter set (CA_user_volume_control
        ANS_CVS_BVC_parameters.csv, data_reference 'Peter_Hunter'; same value in ANS_CVS_BVolCtl_FA_MG_PH_v2.cellml); no publication
        found that reports it; lumped K binding affinity (K_d = 1 M); see K_Na
      sourced: 'no'
      value: 1
  notes: 'One kidney (glomerulus + proximal tubule + tubular epithelium) of the blood-volume-control system: glomerular water
    flux v_gl_W = k_gl_W (u_ac_W - u_pt_W) from the glomerular capillary pressure u_ac_W, tubular pressure u_pt_W = E_pt (q_pt_W
    - U_pt_W)/(L_pt_W - q_pt_W)^2, osmotic reabsorption v_pt_W = k_pt_W RT (c_vc - c_pt) (k_pt_W = 0 in the source), Na filtration
    v_gl_Na = kK_gl_Na (q_vc_Na - q_pt_Na), tubule-to-epithelium v_pt_Na and a simplified NKE flux to the blood. It cannot
    run alone: q_vc_W is declared with kind "variable " (known issue), so the test network supplies it: a peritubular capillary
    (BG capillary_simple_vol_ctl_uptake between an arteriole and a vein with constant 100/5 mmHg pressures, giving q_vc_W
    (m3 -> L) and receiving v_pt_W) and BVC_Na_circ (closing the Na loop, other inputs zero). u_ac_W stays a BC. The glomerular
    capillary (capillary_simple_vol_ctl_intake) is NOT in the network because libcuflynx names both L_per_s -> m3_per_s unit
    converters identically and the model fails to import (framework issue). Exact checks: closed Na balance q_vc_Na + q_pt_Na
    + q_ptEpi_Na = total - v_out2_Na t, tubular water balance, all constitutive laws, NKE closed form through the port unit
    conversion, bounds, and the analytic pressure steady state.'
- vessel_type: BVC_Kidney_left
  BC_type: nn
  module_type: BVC_Kidney_main_type
  outputs:
  - q_pt_W
  - q_pt_Na
  - q_ptEpi_Na
  - u_pt_W
  - c_pt_Na
  - c_ptEpi_Na
  - u_pt_osmotic
  - v_gl_W
  - v_pt_W
  - v_pt_Na
  - v_ptEpi_NKE
  - v_gl_Na
