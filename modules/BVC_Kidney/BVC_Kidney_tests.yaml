module: BVC_Kidney
reviewed: false
known_issues: [variable q_vc_W has kind 'variable ']
defaults:
  sim_time: 2.0
  pre_time: 0.0
  dt: 0.01
  solver: CVODE_myokit
  bc_sweep:
    factors: [0.5, 0.75, 1.0, 1.5, 2.0]
    ranges: {}
  timestep:
    scheme: rk4
    dts: [0.004, 0.002, 0.001, 0.0005]
    min_order: 0.8
    tol: 0.0001
    cvode_tol: 0.001
  stability:
    supported:
    - {solver: CVODE_myokit, rtol: 1.0e-06, atol: 1.0e-08}
components:
- vessel_type: BVC_Kidney_right
  BC_type: nn
  module_type: BVC_Kidney_main_type
  outputs: [u_pt_W, c_pt_Na, C_pt_Na, c_ptEpi_Na, C_ptEpi_Na, u_pt_osmotic]
  invariants: []
  validation:
    baseline: {status: pending, reason: validation data not chosen yet}
    calibrate: {status: pending, reason: validation data not chosen yet}
- vessel_type: BVC_Kidney_left
  BC_type: nn
  module_type: BVC_Kidney_main_type
  outputs: [u_pt_W, c_pt_Na, C_pt_Na, c_ptEpi_Na, C_ptEpi_Na, u_pt_osmotic]
  invariants: []
  validation:
    baseline: {status: pending, reason: validation data not chosen yet}
    calibrate: {status: pending, reason: validation data not chosen yet}
