    - - pin
      - nn_constant
      - inlet_pressure
      - ''
      - affA
    - - affA
      - pp
      - arterial_simple
      - pin
      - peri
    - - peri
      - vv
      - capillary_simple_vol_ctl_uptake
      - affA mod
      - venV mod
    - - venV
      - pp
      - venous
      - peri
      - pout
    - - pout
      - nn_constant
      - outlet_pressure
      - venV
      - ''
    - - mod
      - nn
      - BVC_Kidney_right
      - naCirc peri
      - naCirc peri
    - - naCirc
      - nn
      - BVC_Na_circ
      - mod
      - mod
    parameters:
    - - P_pin
