  validation: &id001
    baseline:
      status: pending
      reason: 'Candidate targets: single-kidney GFR (about 60 mL/min), filtered Na load (about 1.5e-4 mol/s per kidney) and
        proximal fractional Na reabsorption (about 2/3). Not set up: the component has no GFR in L/min terms (k_gl_W only
        sets the tubular pressure equilibrium, k_pt_W = 0 so no water is reabsorbed) and the source parameters give a glomerular
        Na flux of about 3.7e-3 mol/s, some 25x physiological, so the parameter set must be re-derived before validation is
        meaningful.'
    calibrate:
      status: pending
      reason: 'as baseline: needs a physiological re-parameterisation first.'
  reference_proposals:
    q_pt_W_init: &id002
      reference: unreferenced_placeholder; 0.521056165876984 L (proximal tubule water) from P. Hunter's unpublished blood-volume-control
        parameter set (CA_user_volume_control ANS_CVS_BVC_parameters.csv, data_reference 'Peter_Hunter'; same value in ANS_CVS_BVolCtl_FA_MG_PH_v2.cellml);
        no publication found that reports it
      sourced: 'no'
      value: 0.521056165876984
    q_pt_Na_init: &id003
      reference: unreferenced_placeholder; 0.00805209530950799 mol (tubular Na; 15.5 mM) from P. Hunter's unpublished blood-volume-control
        parameter set (CA_user_volume_control ANS_CVS_BVC_parameters.csv, data_reference 'Peter_Hunter'; same value in ANS_CVS_BVolCtl_FA_MG_PH_v2.cellml);
        no publication found that reports it
      sourced: 'no'
      value: 0.00805209530950799
    q_ptEpi_Na_init: &id004
      reference: unreferenced_placeholder; 0.00460774921555305 mol (epithelial Na; 9.2 mM in 0.5 L) from P. Hunter's unpublished
        blood-volume-control parameter set (CA_user_volume_control ANS_CVS_BVC_parameters.csv, data_reference 'Peter_Hunter';
        same value in ANS_CVS_BVolCtl_FA_MG_PH_v2.cellml); no publication found that reports it
      sourced: 'no'
      value: 0.00460774921555305
    u_ptEpi_e: &id005
      reference: unreferenced_placeholder; -0.04 V (-40 mV) from P. Hunter's unpublished blood-volume-control parameter set
        (CA_user_volume_control ANS_CVS_BVC_parameters.csv, data_reference 'Peter_Hunter'; same value in ANS_CVS_BVolCtl_FA_MG_PH_v2.cellml);
        no publication found that reports it
      sourced: 'no'
      value: -0.04
    q_vc_K: &id006
      reference: 'unreferenced_placeholder; 0.03 mol from P. Hunter''s unpublished blood-volume-control parameter set (CA_user_volume_control
        ANS_CVS_BVC_parameters.csv, data_reference ''Peter_Hunter''; same value in ANS_CVS_BVolCtl_FA_MG_PH_v2.cellml); no
        publication found that reports it; blood-side K amount; with the blood volumes of these modules (0.08-0.2 L) this
        is 150-380 mM, far above plasma K (about 4-5 mM): looks swapped with / not comparable to intracellular K'
      sourced: 'no'
      value: 0.03
    q_ptEpi_K: &id007
      reference: unreferenced_placeholder; 0.012 mol (24 mM in 0.5 L) from P. Hunter's unpublished blood-volume-control parameter
        set (CA_user_volume_control ANS_CVS_BVC_parameters.csv, data_reference 'Peter_Hunter'; same value in ANS_CVS_BVolCtl_FA_MG_PH_v2.cellml);
        no publication found that reports it
      sourced: 'no'
      value: 0.012
    v_out2_W: &id008
      reference: unreferenced_placeholder; 0 L/s (no urine water flow) from P. Hunter's unpublished blood-volume-control parameter
        set (CA_user_volume_control ANS_CVS_BVC_parameters.csv, data_reference 'Peter_Hunter'; same value in ANS_CVS_BVolCtl_FA_MG_PH_v2.cellml);
        no publication found that reports it
      sourced: 'no'
      value: 0
    v_out2_Na: &id009
      reference: unreferenced_placeholder; 1.16e-06 mol/s (Na excretion, about 100 mmol/day per kidney) from P. Hunter's unpublished
        blood-volume-control parameter set (CA_user_volume_control ANS_CVS_BVC_parameters.csv, data_reference 'Peter_Hunter';
        same value in ANS_CVS_BVolCtl_FA_MG_PH_v2.cellml); no publication found that reports it
      sourced: 'no'
      value: 1.16e-06
    u_ac_W: &id010
      reference: unreferenced_placeholder; 1.835 kPa = u_pt_W at q_pt_W_init with E_pt, U_pt_W, L_pt_W (so v_gl_W is close
        to 0 at t = 0); in a network supplied by the glomerular capillarys capillary_extracellular_port (physiological glomerular
        capillary pressure is about 6 kPa)
      sourced: 'no'
      value: 1.835
    q_vc_Na: &id011
      reference: unreferenced_placeholder; 0.0114979848860844 mol (BVC_Na_circ q_vc_Na_init, P. Hunter); in a network (and
        in the test network) supplied by BVC_Na_circ
      sourced: 'no'
      value: 0.0114979848860844
    RT: &id012
