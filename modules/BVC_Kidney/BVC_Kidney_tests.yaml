  invariants:
  - description: 'closed Na balance of the test network (kidney + Na_circ, other Na_circ inputs zero): q_vc_Na + q_pt_Na +
      q_ptEpi_Na = initial total - v_out2_Na t (exact; no quadrature)'
    expr: np.max(np.abs(naCirc__q_vc_Na + q_pt_Na + q_ptEpi_Na - (naCirc__q_vc_Na[0] + q_pt_Na_init + q_ptEpi_Na_init - v_out2_Na*t)))
      <= 1e-9*(naCirc__q_vc_Na[0] + q_pt_Na_init + q_ptEpi_Na_init)
  - description: 'tubular water balance: q_pt_W = q_pt_W_init + integral of (v_gl_W - v_pt_W) - v_out2_W t (trapezoid on the
      output grid; tolerance 1e-5 q_pt_W_init plus the trapezoid error bound dt max|v|/2, which covers initial transients
      faster than the output step)'
    expr: np.max(np.abs(q_pt_W - q_pt_W_init - np.concatenate([[0.0], np.cumsum(0.5*((v_gl_W - v_pt_W)[1:] + (v_gl_W - v_pt_W)[:-1])*np.diff(t))])
      + v_out2_W*t)) <= 1e-5*q_pt_W_init + 0.5*(t[1] - t[0])*np.max(np.abs(v_gl_W - v_pt_W))
  - description: 'constitutive relations: u_pt_W = E_pt (q_pt_W - U_pt_W)/(L_pt_W - q_pt_W)^2, v_gl_W = k_gl_W (u_ac_W - u_pt_W),
      v_pt_W = k_pt_W RT (c_vc - c_pt), v_gl_Na = kK_gl_Na (q_vc_Na - q_pt_Na), v_pt_Na = kK_pt_Na (q_pt_Na - q_ptEpi_Na),
      c = q/V, u_pt_osmotic = RT c_pt_Na (q_vc_W is the neighbour capillary volume peri/q converted m3 -> L)'
    expr: np.allclose(u_pt_W, E_pt*(q_pt_W - U_pt_W)/(L_pt_W - q_pt_W)**2, rtol=1e-9, atol=1e-12) and np.allclose(v_gl_W,
      k_gl_W*(u_ac_W - u_pt_W), rtol=1e-6, atol=1e-9*k_gl_W*max(1.0, abs(u_ac_W))) and np.allclose(v_pt_W, k_pt_W*RT*((naCirc__q_vc_Na/(1000*peri__q))
      - c_pt_Na), rtol=1e-6, atol=1e-15) and np.allclose(v_gl_Na, kK_gl_Na*(naCirc__q_vc_Na - q_pt_Na), rtol=1e-6, atol=1e-12)
      and np.allclose(v_pt_Na, kK_pt_Na*(q_pt_Na - q_ptEpi_Na), rtol=1e-6, atol=1e-12) and np.allclose(c_pt_Na, q_pt_Na/q_pt_W,
      rtol=1e-9) and np.allclose(c_ptEpi_Na, q_ptEpi_Na/q_ptEpi_W, rtol=1e-9) and np.allclose(u_pt_osmotic, RT*c_pt_Na, rtol=1e-9)
  - description: NKE flux equals its closed form 3 k (A^3 B^2 - C^3 D^2 exp(2 F u/RT))/((1+A^3)(1+C^3)(1+B^2)(1+D^2)) with
      the blood-side volume taken from the neighbour capillary (checks the m3 -> L port conversion)
    expr: np.allclose(v_ptEpi_NKE, 3*k_ptEpi_NKE*((K_Na*c_ptEpi_Na)**3*(K_K*q_vc_K/(1000*peri__q))**2 - (K_Na*(naCirc__q_vc_Na/(1000*peri__q)))**3*(K_K*q_ptEpi_K/q_ptEpi_W)**2*np.exp(2*F*u_ptEpi_e/RT))/((1
      + (K_Na*c_ptEpi_Na)**3)*(1 + (K_Na*(naCirc__q_vc_Na/(1000*peri__q)))**3)*(1 + (K_K*q_vc_K/(1000*peri__q))**2)*(1 + (K_K*q_ptEpi_K/q_ptEpi_W)**2)),
      rtol=1e-6, atol=1e-12)
  - description: tubular volume stays inside (0, L_pt_W) (u_pt_W is singular at L_pt_W) and Na amounts stay positive
    expr: np.all(q_pt_W > 0) and np.all(q_pt_W < L_pt_W) and np.all(q_pt_Na > 0) and np.all(q_ptEpi_Na > 0) and np.all(naCirc__q_vc_Na
      > 0)
  - description: 'analytic water steady state at the run point (k_pt_W = 0, v_out2_W = 0): u_pt_W -> u_ac_W, i.e. q_pt_W ->
      the root in (U, L) of u_ac (L - q)^2 = E (q - U)'
    applies: run
    expr: abs(q_pt_W[-1] - ((2*u_ac_W*L_pt_W + E_pt) - np.sqrt((2*u_ac_W*L_pt_W + E_pt)**2 - 4*u_ac_W*(u_ac_W*L_pt_W**2 +
      E_pt*U_pt_W)))/(2*u_ac_W)) < 1e-6 and abs(v_gl_W[-1]) < 1e-9
