module_type: efferent_respiratory_effector_Gee_Argus_2026
version: nn
reviewed: false
notes: 'Chemoreflex respiratory effector (multiplicative muscle-pressure form): peripheral and central drives act on respiratory
  rate (additive Delta_RR, first order) and on the muscle-pressure amplitude through multipliers alpha (first order towards
  1 + G u), with time constants switched by the sign of the drive / a CO2 threshold; outputs are clamped. With constant drives
  each state is an exact first-order response.'
expected_failures:
  run_test: u_p_resp is listed twice in the config variables_and_units (and twice in the parameters csv), so the generated
    component declares it twice and libcellml rejects the model (VARIABLE_NAME_UNIQUE). A patched copy with the duplicate
    removed generates and passes the invariants.
  verification_test_invariants: generation fails (see run_test)
  verification_test_BC: generation fails (see run_test)
  verification_test_timestep: generation fails (see run_test)
  stability_test: generation fails (see run_test)
