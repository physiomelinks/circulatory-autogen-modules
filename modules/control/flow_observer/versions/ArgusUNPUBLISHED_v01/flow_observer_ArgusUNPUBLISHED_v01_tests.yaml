notes: 'Pure pass-through ("observer"): its only variable v is mapped in from the source vessel''s flow (flow_feedback_port)
  and out to every controlled terminal (multi_port pressure/flow feed). It has no equations; after flattening the variable
  is the source vessel''s own v, so it cannot be logged separately. Tested in a network pressure_in -> BG arterial pv (art)
  -> constant outflow, with the observer attached to art: the network generates and the source vessel is unaffected. Its consumer
  (terminal / terminal2) cannot be generated until the port-variable fix (see review).'
