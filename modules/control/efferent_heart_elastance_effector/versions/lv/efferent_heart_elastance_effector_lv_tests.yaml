module_type: efferent_heart_elastance_effector
version: lv
reviewed: false
notes: 'Ursino (1998) left-ventricular Emax effector: sigma = G_theta ln(f_s - f_es_min + 1) above threshold, tau dDelta/dt
  = sigma - Delta (delay omitted). Exact: Delta = sigma (1 - e^(-t/tau)).'
reference_proposals:
  f_s:
    reference: circulatory_autogen; test operating point (10 spikes/s)
    sourced: false
    value: 10.0
  G_theta:
    reference: Ursino1998; G_Emax,lv = 0.475 mmHg/ml = 6.333e7 Pa/m3 (Cheng2010 Table; open reimplementations)
    sourced: true
  tau_theta:
    reference: Ursino1998; tau_Emax,lv = 8 s (Cheng2010 Table)
    sourced: true
  f_es_min:
    reference: Ursino1998; 2.66 spikes/s
    sourced: true
review: reviews/control_review.yaml
review_scope: The review of the whole control module (18 entries) before the move to versions; only the parts about this version
  apply.
