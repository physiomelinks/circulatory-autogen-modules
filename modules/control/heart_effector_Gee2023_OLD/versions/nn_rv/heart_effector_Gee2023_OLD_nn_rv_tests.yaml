notes: 'Compliance (inverse-elastance) form of the Gee2023 effector. The config points at module_type heart_effector_Gee2023
  (elastance form, no inv_* variables) instead of heart_effector_Gee2023_INV, so the generated model has no equations for
  the inv_* variables: myokit warns "No value set" and every output is 0. The invariants below are the INV component''s exact
  solution (initial inv_Delta_Es = 1e-7, inv_Delta_Ev = -1e-7).'
expected_failures:
  verification_test_invariants: config module_type is heart_effector_Gee2023 but the variables (inv_*) belong to heart_effector_Gee2023_INV;
    the generated model leaves inv_* unset (all outputs 0), so the INV-law invariants fail. Also heart_effector_Gee2023_INV
    declares inv_sigma_Es in J_per_m6 (should be m6_per_J). A patched copy fixing both runs and passes.
  verification_test_BC: same defect (see verification_test_invariants)
