module_type: unstressed_volume_effector_Gee2023
version: nn
reviewed: false
notes: 'Sympathetic effector (Gee 2023 eqs. S.52-S.53, Ursino 1998 form): sigma = G_Vusv ln(f - f_es_min + 1) for f >= f_es_min
  else 0, and tau_Vusv dDelta_Vusv/dt = -Delta_Vusv + sigma with Delta_Vusv(0) = 0. With constant f_esv the exact solution
  is Delta_Vusv = sigma (1 - exp(-t/tau_Vusv)). The Ursino/Gee pure time delay is not modelled.'
reference_proposals:
  G_Vusv:
    reference: 'Gee2023; Supplementary text (github v03 Model_documentation) Table S.13: G_Vu,sv = -265.4 mL per Hz (log map)
      (-265.4 mL per ln-unit = -2.654e-4 m3)'
    sourced: 'yes'
  tau_Vusv:
    reference: 'Gee2023; Supplementary text (github v03 Model_documentation) Simulink v03 Vusv block uses tau = 20 s (TransferFcn
      1/(20s+1)) with a separate 5 s transport delay. The csv value 5 s equals the DELAY D_Vu,sv of Table S.14, not the time
      constant. Proposed: tau_Vusv = 20 s'
    sourced: 'no'
  f_esv:
    reference: unreferenced_placeholder; test operating point for an input normally supplied by a neighbour (sympathetic efferent
      firing; run point 6 Hz above f_es_min)
    sourced: 'no'
    value: 4.0
  f_es_min:
    reference: 'Gee2023; Supplementary text (github v03 Model_documentation) Table S.12: f_es,min = 2.66 Hz (Simulink constant
      2.66 - 1)'
    sourced: 'yes'
review: reviews/parasympathetic_review.yaml
review_scope: The review of the whole parasympathetic module (14 entries) before the move to versions; only the parts about
  this version apply.
