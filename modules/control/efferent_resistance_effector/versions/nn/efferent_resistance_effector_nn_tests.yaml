    sourced: false
  tau_theta:
    reference: Ursino1998; tau_R,sp = 6 s (Gee2023 Simulink [6 1] for the R effector)
    sourced: true
  f_es_min:
    reference: Ursino1998; f_es,min = 2.66 spikes/s (Cheng2010 Table; Gee2023 Simulink 2.66)
    sourced: true
  f_es_mid:
    reference: unreferenced_placeholder; "to_be_calibrated" half-saturation of the Argus effector
    sourced: false
