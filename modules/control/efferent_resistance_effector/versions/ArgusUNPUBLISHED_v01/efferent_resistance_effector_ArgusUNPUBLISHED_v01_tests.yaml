module_type: efferent_resistance_effector
version: ArgusUNPUBLISHED_v01
reviewed: false
notes: 'Saturating resistance effector (Argus variant): tau_theta dsigma/dt = max(f_s - f_es_min, 0) - sigma; Delta_theta
  = G_theta sigma/(f_es_mid + sigma), a dimensionless fractional change (Michaelis-Menten saturation, unlike the Ursino logarithm).
  Exact: sigma = S (1 - e^(-t/tau)), S = max(f_s - f_es_min, 0).


  Ports of the versions of efferent_resistance_effector (the same port types):

  entrance sympathetic_efferent_firing_rate_port: ArgusUNPUBLISHED_v01 [f_s]; Ursino1998_v01 [f_s]

  exit resistance_delta_port: ArgusUNPUBLISHED_v01 [Delta_theta]; Ursino1998_v01 [Delta_theta]'
