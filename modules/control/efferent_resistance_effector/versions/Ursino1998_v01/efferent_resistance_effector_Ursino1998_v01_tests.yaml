module_type: efferent_resistance_effector
version: Ursino1998_v01
reviewed: false
notes: 'Ursino (1998) resistance effector: sigma = G_theta ln(f_s - f_es_min + 1) for f_s >= f_es_min (else 0), tau_theta
  dDelta/dt = sigma - Delta (pure delay omitted). Exact: Delta = sigma (1 - e^(-t/tau)).


  Ports of the versions of efferent_resistance_effector (the same port types):

  entrance sympathetic_efferent_firing_rate_port: ArgusUNPUBLISHED_v01 [f_s]; Ursino1998_v01 [f_s]

  exit resistance_delta_port: ArgusUNPUBLISHED_v01 [Delta_theta]; Ursino1998_v01 [Delta_theta]'
expected_failures:
  run_test: config declares Delta_theta and sigma_theta in Js_per_m3 but the CellML component uses Js_per_m6; libcellml rejects
    the generated model (map_variables units mismatch, "metre^-3"). Patched copy with Js_per_m6 in the config runs and passes
    both invariants.
  verification_test_invariants: generation fails (see run_test)
  verification_test_BC: generation fails (see run_test)
  verification_test_timestep: generation fails (see run_test)
  stability_test: generation fails (see run_test)
reference_proposals:
  f_s:
    reference: circulatory_autogen; test operating point (10 spikes/s)
    sourced: false
    value: 10.0
  G_theta:
    reference: Ursino1998; G_R,sp = 0.695 mmHg s/ml = 0.695 x 133.322 / 1e-6 = 9.266e7 Pa s/m3 (splanchnic peripheral resistance;
      Gee2023 Simulink Gx(3) = 0.695). Use 0.653 mmHg s/ml (8.706e7) for the extrasplanchnic bed
    sourced: true
    value: 9.266e7
  tau_theta:
    reference: Ursino1998; tau_R = 6 s (Gee2023 Simulink [6 1])
    sourced: true
    value: 6.0
  f_es_min:
    reference: Ursino1998; 2.66 spikes/s
    sourced: true
review: reviews/control_review.yaml
review_scope: The review of the whole control module (18 entries) before the move to versions; only the parts about this version
  apply.
