module_type: peripheral_resistance_effector
version: ArgusUNPUBLISHED_v01
reviewed: false
notes: 'Sympathetic effector (Gee 2023 eqs. S.52-S.53, Ursino 1998 form): sigma = G_Rsp ln(f - f_es_min + 1) for f >= f_es_min
  else 0, and tau_Rsp dDelta_Rsp/dt = -Delta_Rsp + sigma with Delta_Rsp(0) = 0. With constant f_esp the exact solution is
  Delta_Rsp = sigma (1 - exp(-t/tau_Rsp)). The Ursino/Gee pure time delay is not modelled.'
reference_proposals:
  G_Rsp:
    reference: 'gee2023closed; Supplementary text (github v03 Model_documentation) Table S.13: G_R,sp = 0.695 mmHg s mL^-1 per Hz
      (0.695 mmHg s mL^-1 Hz^-1 x 133.322 Pa/mmHg x 1e6 mL/m3 = 9.266e7 Pa s m^-3 Hz^-1)'
    sourced: 'yes'
  tau_Rsp:
    reference: 'gee2023closed; Supplementary text (github v03 Model_documentation) Simulink v03 Rsp block uses tau = 6 s (TransferFcn
      1/(6s+1)) with a separate 2 s transport delay. The csv value 2 s equals the DELAY D_R,sp of Table S.14 (listed under
      "time constants"), not the time constant. Proposed: tau_Rsp = 6 s'
    sourced: 'no'
  f_esp:
    reference: unreferenced_placeholder; test operating point for an input normally supplied by a neighbour (sympathetic efferent
      firing; run point 6 Hz above f_es_min)
    sourced: 'no'
    value: 4.0
  f_es_min:
    reference: 'gee2023closed; Supplementary text (github v03 Model_documentation) Table S.12: f_es,min = 2.66 Hz (Simulink constant
      2.66 - 1)'
    sourced: 'yes'
review: reviews/parasympathetic_review.yaml
review_scope: The review of the whole parasympathetic module (14 entries) before the move to versions; only the parts about
  this version apply.
