notes: 'Central integration to vagal efferent activity (Ursino 1998 sigmoid plus the Ursino & Magosso 2000 chemoreceptor term):
  f_v = (f_ev_0 + f_ev_inf e^y)/(1 + e^y) + W_cv f_apc - theta_v, y = (f_ab - f_ab_0)/k_ev. Purely algebraic.'
