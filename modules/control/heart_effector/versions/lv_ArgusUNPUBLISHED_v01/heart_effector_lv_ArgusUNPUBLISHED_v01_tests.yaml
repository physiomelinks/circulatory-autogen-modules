module_type: heart_effector
version: lv_ArgusUNPUBLISHED_v01
reviewed: false
notes: 'Heart contractility effector in elastance form after Gee et al. 2023: sympathetic sigma_Es = G_Es ln(f_esh - f_es_min
  + 1) (above threshold) and vagal sigma_Ev = G_Ev f_PNDMV_filt, each first-order filtered; Delta_Emax = scale (Delta_Es +
  Delta_Ev). Gee2023 works in compliance (1/E) form; the gains here are user-defined elastance-domain values.


  Ports of the versions of heart_effector (they differ; allowed and documented, see modules/README.md, Versions):

  entrance sympathetic_efferent_heart_freq: lv_ArgusUNPUBLISHED_v01 [f_esh]; rv_ArgusUNPUBLISHED_OLD [f_esh]; rv_ArgusUNPUBLISHED_v01
  [f_esh]

  entrance vagal_efferent_filt_firing_rate_port: lv_ArgusUNPUBLISHED_v01 [f_PNDMV_filt]; rv_ArgusUNPUBLISHED_OLD [f_PNDMV_filt];
  rv_ArgusUNPUBLISHED_v01 [f_PNDMV_filt]

  exit Elastance_delta_port: lv_ArgusUNPUBLISHED_v01 [Delta_Emax]; rv_ArgusUNPUBLISHED_OLD [Delta_Emax]; rv_ArgusUNPUBLISHED_v01
  [Delta_Emax]

  exit Elastance_delta_port_lv: lv_ArgusUNPUBLISHED_v01 [Delta_Emax]; rv_ArgusUNPUBLISHED_OLD -; rv_ArgusUNPUBLISHED_v01 -

  exit Elastance_delta_port_rv: lv_ArgusUNPUBLISHED_v01 -; rv_ArgusUNPUBLISHED_OLD [Delta_Emax]; rv_ArgusUNPUBLISHED_v01 [Delta_Emax]'
reference_proposals:
  f_esh:
    reference: circulatory_autogen; test operating point (5 Hz)
    sourced: false
    value: 5.0
  f_PNDMV_filt:
    reference: circulatory_autogen; test operating point (1 Hz)
    sourced: false
    value: 1.0
  G_Es:
    reference: 'unreferenced_placeholder; "user_defined_was_1.29e9_Gee2023_inv": Gee2023 Simulink Gs_Emaxlv = 0.103 ml/mmHg
      per unit ln-activity, and 1/(0.103e-6/133.322) = 1.29e9 Pa/m3 - but inverting a compliance gain is not the same law,
      so 1e7 is a user value'
    sourced: false
  tau_Es:
    reference: unreferenced_placeholder; library says Gee2023, but the Gee2023 Simulink model (BioModels MODEL2402270001)
      uses tau = 8 s for the sympathetic contractility effector, not 2 s
    sourced: false
  G_Ev:
    reference: unreferenced_placeholder; "user_defined_was_6.5e8_Gee2023_inv" (Gee2023 Simulink Gv_Emaxlv = 0.2053 ml/mmHg
      per Hz; 1/(0.2053e-6/133.322) = 6.49e8)
    sourced: false
  tau_Ev:
    reference: unreferenced_placeholder; library says Gee2023, but the Gee2023 Simulink model uses tau = 1.5 s for the vagal
      contractility effector, not 0.2 s
    sourced: false
  scale:
    reference: definitional; 1 for the left ventricle (Gee2023 scales only the RV)
    sourced: definitional
  f_es_min:
    reference: Ursino1998; 2.66 spikes/s (Gee2023 Simulink "2.66 - 1" inside the log)
    sourced: true
review: reviews/control_review.yaml
review_scope: The review of the whole control module (18 entries) before the move to versions; only the parts about this version
  apply.
