notes: 'Local circuit neurons of the intrinsic cardiac nervous system (Gee 2023 eq. S.1 + eq. 3): weighted sum of vagal (DMV
  + NActr), baroreceptor and cardiopulmonary inputs minus sympathetic heart efferent, clipped at 0, then the sigmoid. Gee
  2023 feeds the vagal efferent f_ev; here f_DMV + f_NActr. Parameters were re-identified by the module author (identified-11-6-24).
  Algebraic.'
