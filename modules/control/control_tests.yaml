- vessel_type: efferent_venous_us_volume_and_compliance_effector
  BC_type: nn
  module_type: efferent_venous_us_volume_and_compliance_effector_Argus_type
  sim_time: 100.0
  dt: 0.1
  timestep: {t_end: 100.0, dts: [0.2, 0.1, 0.05, 0.025]}
  outputs: [Delta_theta_us, sigma_theta_us, Delta_theta_compliance, sigma_theta_compliance]
  notes: 'Venous unstressed-volume and compliance effector (Argus saturating form), two independent first-order filters of
    max(f_s - f_es_min, 0). BUG: Delta_theta_us is computed with G_theta_compliance, so G_theta_us is unused.'
  invariants:
  - description: 'sigma_theta_us exact first-order solution'
    expr: 'np.max(np.abs(sigma_theta_us - max(f_s - f_es_min, 0)*(1 - np.exp(-t/tau_theta_us)))) <= 1e-4*max(1e-6, abs(f_s - f_es_min))'
  - description: 'sigma_theta_compliance exact first-order solution'
    expr: 'np.max(np.abs(sigma_theta_compliance - max(f_s - f_es_min, 0)*(1 - np.exp(-t/tau_theta_compliance)))) <= 1e-4*max(1e-6,
      abs(f_s - f_es_min))'
  - description: 'Delta_theta_compliance = G_theta_compliance sigma/(f_es_mid + sigma)'
    expr: 'np.max(np.abs(Delta_theta_compliance - G_theta_compliance*sigma_theta_compliance/(f_es_mid + sigma_theta_compliance)))
      <= 1e-9*max(1.0, abs(G_theta_compliance))'
  - description: 'Delta_theta_us = G_theta_us sigma_us/(f_es_mid + sigma_us) (intended law; fails when G_theta_us differs
      from G_theta_compliance)'
    expr: 'np.max(np.abs(Delta_theta_us - G_theta_us*sigma_theta_us/(f_es_mid + sigma_theta_us))) <= 1e-9*max(1.0, abs(G_theta_us))'
  expected_failures:
    verification_test_BC: 'Delta_theta_us uses G_theta_compliance instead of G_theta_us (CellML), so the intended-law
      invariant fails whenever G_theta_us is swept away from G_theta_compliance (both 0.3 nominally). See proposed_fixes.'
  bc_sweep:
    ranges:
      f_s: {min: 0.0, max: 60.0, points: 7}
    rationale: 'f_s from silent to f_es_max; gains and time constants 0.5-2x.'
  reference_proposals:
    f_s: {reference: 'circulatory_autogen; test operating point (10 spikes/s)', sourced: no, value: 10.0}
    G_theta_us: {reference: 'unreferenced_placeholder; "assumed_to_be_improved" fractional change (currently unused, see bug)',
      sourced: no}
    G_theta_compliance: {reference: 'unreferenced_placeholder; "assumed_to_be_improved"', sourced: no}
    tau_theta_us: {reference: 'Ursino1998; tau_V,u = 20 s (Cheng2010 Table tau_as_usv = 20 s; Gee2023 Simulink [20 1])',
      sourced: yes}
    tau_theta_compliance: {reference: 'unreferenced_placeholder; assumed equal to tau_theta_us (Ursino1998 has no venous
        compliance effector)', sourced: no}
    f_es_min: {reference: 'Ursino1998; 2.66 spikes/s', sourced: yes}
    f_es_mid: {reference: 'unreferenced_placeholder; "to_be_calibrated"', sourced: no}
  validation:
    baseline: {status: not_applicable, reason: 'effector transfer block with placeholder gains; exact solution checked.'}
    calibrate: {status: not_applicable, reason: 'see baseline'}

