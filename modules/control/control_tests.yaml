- vessel_type: efferent_heart_period_effector
  BC_type: nn
  module_type: efferent_heart_period_effector_type
  sim_time: 20.0
  dt: 0.01
  timestep: {t_end: 20.0}
  outputs: [Delta_Ts, Delta_Tv, Delta_T, sigma_Ts, sigma_Tv]
  notes: 'Ursino (1998) heart-period effector: sympathetic sigma_Ts = G_Ts ln(f_s - f_es_min + 1) (above threshold),
    vagal sigma_Tv = G_Tv f_v, each first-order filtered (tau_Ts, tau_Tv; delays omitted); Delta_T = Delta_Ts + Delta_Tv.'
  invariants:
  - description: 'Delta_Ts = sigma_Ts (1 - exp(-t/tau_Ts)), sigma_Ts = G_Ts ln(f_s - f_es_min + 1) above threshold'
    expr: 'np.max(np.abs(Delta_Ts - (G_Ts*np.log(f_s - f_es_min + 1) if f_s >= f_es_min else 0.0)*(1 - np.exp(-t/tau_Ts)))) <=
      1e-5*max(1e-3, abs(G_Ts)*5)'
  - description: 'Delta_Tv = G_Tv f_v (1 - exp(-t/tau_Tv))'
    expr: 'np.max(np.abs(Delta_Tv - G_Tv*f_v*(1 - np.exp(-t/tau_Tv)))) <= 1e-4*max(1e-3, abs(G_Tv*f_v))'
  - description: 'Delta_T = Delta_Ts + Delta_Tv'
    expr: 'np.max(np.abs(Delta_T - (Delta_Ts + Delta_Tv))) <= 1e-12'
  bc_sweep:
    ranges:
      f_s: {min: 0.0, max: 60.0, points: 7}
      f_v: {min: 0.0, max: 15.0, points: 5}
    rationale: 'sympathetic from silent to f_es_max; vagal 0-15 spikes/s (Ursino range f_ev,0 3.2 to f_ev,inf 6.3 plus
      chemoreceptor contribution); gains/time constants 0.5-2x.'
  reference_proposals:
    f_s: {reference: 'circulatory_autogen; test operating point (10 spikes/s)', sourced: no, value: 10.0}
    f_v: {reference: 'circulatory_autogen; test operating point (5 spikes/s)', sourced: no, value: 5.0}
    G_Ts: {reference: 'unreferenced_placeholder; "user_defined" -0.1 s; Ursino1998 G_Ts = -0.13 s (Cheng2010 Table; Gee2023
        Simulink Gx(7) = -0.13) - propose -0.13 if the Ursino value is intended', sourced: no}
    G_Tv: {reference: 'unreferenced_placeholder; "user_defined" 0.05 s^2; Ursino1998 G_Tv = 0.09 s/(spikes/s) (open
        reimplementations)', sourced: no}
    tau_Ts: {reference: 'Ursino1998; tau_Ts = 2 s (library cites Gee2023, whose Simulink model uses [2 1], copied from
        Ursino)', sourced: yes}
    tau_Tv: {reference: 'Ursino1998; tau_Tv = 1.5 s (Gee2023 Simulink [1.5 1])', sourced: yes}
    f_es_min: {reference: 'Ursino1998; 2.66 spikes/s', sourced: yes}
  validation:
    baseline: {status: pending, reason: 'Candidate: heart-period response to vagal/sympathetic stimulation (e.g. the VNS
        heart-rate data shipped with the Gee2023 BioModels entry, Rajendran 2019 pig data) - needs a network with a heart;
        not set up.'}
    calibrate: {status: pending, reason: 'see baseline'}

# ------------------------------------------------------------------------------------------------
- vessel_type: local_flow_control_muscle
  BC_type: nn
  module_type: local_flow_control_muscle_type
  sim_time: 100.0
  dt: 0.1
  timestep: {t_end: 100.0, dts: [0.2, 0.1, 0.05, 0.025]}
  outputs: [x_O2, x_CO2, phi_P_CO2_a, C_O2_p, R_local_multiplier]
  notes: 'Local metabolic control of skeletal-muscle resistance (Ursino & Magosso 2000 O2 term, Magosso & Ursino 2001 CO2
    term): tau_O2 dx_O2/dt = C_O2_p - C_O2_vm_nom - x_O2, tau_CO2 dx_CO2/dt = phi(P_CO2_a) - x_CO2 with phi a tanh-like
    sigmoid of PaCO2, R_mult = (1 + x_CO2)/(1 - g_O2_m x_O2). ISSUE: C_O2_p is an input of the CellML component but the
    config declares it a "variable" with no port, so stand-alone it is unset (myokit warns "No value set for C_O2_p" and
    uses 0). R_mult is singular at x_O2 = 1/g_O2_m (C_O2_p = 0.188 ml/ml).'
  invariants:
  - description: 'x_O2 = (C_O2_p - C_O2_vm_nom)(1 - exp(-t/tau_O2)) (constant C_O2_p)'
    expr: 'np.max(np.abs(x_O2 - (C_O2_p - C_O2_vm_nom)*(1 - np.exp(-t/tau_O2)))) <= 1e-4*max(1e-3, np.max(np.abs(C_O2_p - C_O2_vm_nom)))'
  - description: 'phi_P_CO2_a = (1 - e^z)/(1 + e^z), z = (P_CO2_a - P_CO2_a_nom)/k_CO2_m'
    expr: 'np.max(np.abs(phi_P_CO2_a - (1 - np.exp((P_CO2_a - P_CO2_a_nom)/k_CO2_m))/(1 + np.exp((P_CO2_a - P_CO2_a_nom)/k_CO2_m))))
      <= 1e-12'
  - description: 'x_CO2 = phi (1 - exp(-t/tau_CO2))'
    expr: 'np.max(np.abs(x_CO2 - phi_P_CO2_a*(1 - np.exp(-t/tau_CO2)))) <= 1e-4*max(1e-2, np.max(np.abs(phi_P_CO2_a)))'
  - description: 'R_local_multiplier = (1 + x_CO2)/(1 - g_O2_m x_O2)'
    expr: 'np.max(np.abs(R_local_multiplier - (1 + x_CO2)/(1 - g_O2_m*x_O2))) <= 1e-9*np.max(np.abs(R_local_multiplier))'
  - description: 'the resistance multiplier stays positive'
    expr: 'np.min(R_local_multiplier) > 0'
  bc_sweep:
    ranges:
      P_CO2_a: {min: 3333, max: 9333, points: 7}
      P_O2_a: {min: 4000, max: 20000, points: 3}
      g_O2_m: {min: 15, max: 45, points: 3}
    rationale: 'PaCO2 25-70 mmHg; PaO2 is unused; g_O2_m limited to 15-45 (x0.5-1.5) because with C_O2_p = 0 (unset, see
      notes) larger values are harmless but a C_O2_p above 0.188 ml/ml makes R_mult singular.'
  reference_proposals:
    P_CO2_a: {reference: 'West2008; 40 mmHg = 5332.9 Pa', sourced: yes, value: 5332.8}
    P_O2_a: {reference: 'West2008; 100 mmHg = 13332 Pa (unused by the equations)', sourced: yes, value: 13332.0}
    P_CO2_a_nom: {reference: 'West2008; 40 mmHg', sourced: yes}
    k_CO2_m: {reference: 'MagossoUrsino2001; 142.8 mmHg = 19038 Pa (value from circulatory_autogen; not verified against the
        paywalled paper)', sourced: yes}
    C_O2_vm_nom: {reference: 'UrsinoMagosso2000; nominal muscle venous O2 content 0.155 ml/ml (not verified against the
        paper)', sourced: yes}
    tau_O2: {reference: 'UrsinoMagosso2000; 10 s (not verified against the paper)', sourced: yes}
    tau_CO2: {reference: 'MagossoUrsino2001; 20 s (Cheng2010 Table tau_cc = 20 s for the CO2 response)', sourced: yes}
    g_O2_m: {reference: 'UrsinoMagosso2000; 30 (not verified against the paper)', sourced: yes}
  validation:
    baseline: {status: pending, reason: 'Candidate: muscle (forearm/calf) vascular conductance vs arterial PCO2 or O2
        content; needs an obtainable dataset and the C_O2_p port fix.'}
    calibrate: {status: pending, reason: 'see baseline'}

- vessel_type: local_flow_control_brain
  BC_type: nn
  module_type: local_flow_control_brain_type
  sim_time: 100.0
  dt: 0.1
  timestep: {t_end: 100.0, dts: [0.2, 0.1, 0.05, 0.025]}
  run_parameters: {C_O2_p: 0.13, P_CO2_a: 6000.0}
  outputs: [x_O2, x_CO2, phi_P_CO2_a, G_p, R_local_multiplier]
  notes: 'Local control of cerebral resistance: x_O2 as for muscle (nominal C_O2_vb_nom), x_CO2 filtered from the Ursino
    & Lodi-type CBF-PaCO2 sigmoid ratio phi = (A + B/(1 + C P^D))/(A + B/(1 + C P_nom^D)) - 1 with P in Pa (C_b_lc
    converted from the mmHg form: 10570 x 133.322^5.2551 ~ 1.53e15), G_p = 1 - g_O2_b x_O2 + x_CO2, R_mult = 1/G_p.'
  invariants:
  - description: 'x_O2 = (C_O2_p - C_O2_vb_nom)(1 - exp(-t/tau_O2))'
    expr: 'np.max(np.abs(x_O2 - (C_O2_p - C_O2_vb_nom)*(1 - np.exp(-t/tau_O2)))) <= 1e-4*max(1e-3, abs(C_O2_p - C_O2_vb_nom))'
  - description: 'phi_P_CO2_a is the normalised CO2 reactivity sigmoid (0 at P_CO2_a_nom)'
    expr: 'np.max(np.abs(phi_P_CO2_a - ((A_b_lc + B_b_lc/(1 + C_b_lc*np.exp(D_b_lc*np.log(P_CO2_a))))/(A_b_lc + B_b_lc/(1 +
      C_b_lc*np.exp(D_b_lc*np.log(P_CO2_a_nom)))) - 1))) <= 1e-10'
  - description: 'x_CO2 = phi (1 - exp(-t/tau_CO2)); G_p = 1 - g_O2_b x_O2 + x_CO2; R = 1/G_p'
    expr: '(np.max(np.abs(x_CO2 - phi_P_CO2_a*(1 - np.exp(-t/tau_CO2)))) <= 1e-4*max(1e-2, np.max(np.abs(phi_P_CO2_a)))) &
      (np.max(np.abs(G_p - (1 - g_O2_b*x_O2 + x_CO2))) <= 1e-12) & (np.max(np.abs(R_local_multiplier*G_p - 1)) <= 1e-9)'
  - description: 'the cerebral conductance factor stays positive'
    expr: 'np.min(G_p) > 0'
  bc_sweep:
    ranges:
      P_CO2_a: {min: 3333, max: 9333, points: 7}
      P_O2_a: {min: 4000, max: 20000, points: 3}
      C_O2_p: {min: 0.08, max: 0.19, points: 6}
      g_O2_b: {min: 5, max: 15, points: 3}
    rationale: 'PaCO2 25-70 mmHg (the range of CO2-reactivity data); C_O2_p 0.08-0.19 ml/ml (cerebral venous/capillary
      O2 content from hypoxic to hyperoxic); G_p becomes <= 0 (negative resistance) above ~C_O2_vb_nom + (1 + x_CO2)/g_O2_b,
      so g_O2_b is limited to 0.5-1.5x.'
  reference_proposals:
    P_CO2_a: {reference: 'West2008; 40 mmHg = 5332.9 Pa', sourced: yes, value: 5332.8}
    P_O2_a: {reference: 'West2008; 100 mmHg (unused)', sourced: yes, value: 13332.0}
    C_O2_p: {reference: 'circulatory_autogen; test operating point = C_O2_vb_nom (0.14 ml/ml)', sourced: no, value: 0.14}
    C_O2_vb_nom: {reference: 'UrsinoMagosso2000; nominal cerebral venous O2 content 0.14 ml/ml (not verified against the paper)',
      sourced: yes}
    g_O2_b: {reference: 'UrsinoMagosso2000; 10 (not verified)', sourced: yes}
    A_b_lc: {reference: 'MagossoUrsino2001; A = 20.9 (CBF-PaCO2 curve; not verified against the paper)', sourced: yes}
    B_b_lc: {reference: 'MagossoUrsino2001; B = 92.8 (not verified)', sourced: yes}
    C_b_lc: {reference: 'MagossoUrsino2001; C = 10570 (mmHg form) converted to Pa: 10570 x 133.322^(-D) = 1.53e15 (conversion
        checked; the mmHg value itself not verified)', sourced: yes}
    D_b_lc: {reference: 'MagossoUrsino2001; D = -5.251 (library -5.2551 - owner to check the digits)', sourced: yes}
    tau_O2: {reference: 'UrsinoMagosso2000; 10 s', sourced: yes}
    tau_CO2: {reference: 'MagossoUrsino2001; 20 s', sourced: yes}
    P_CO2_a_nom: {reference: 'West2008; 40 mmHg', sourced: yes}
  validation:
    baseline: {status: pending, reason: 'Candidate: steady-state CBF vs PaCO2 (the reactivity curve the A-D sigmoid was
        fitted to, e.g. Harper & Glass 1965 / Reivich 1964 as used by Ursino & Lodi); R_mult = 1/G_p predicts relative CBF at
        constant pressure, so a digitised CBF(PaCO2) table would be a direct baseline. Not set up (data not obtained).'}
    calibrate: {status: pending, reason: 'same data would identify A_b_lc..D_b_lc'}

# ------------------------------------------------------------------------------------------------
- vessel_type: heart_effector_Gee2023
  BC_type: nn_lv
  module_type: heart_effector_Gee2023
  sim_time: 40.0
  dt: 0.02
  timestep: {t_end: 20.0, dts: [0.02, 0.01, 0.005, 0.0025]}
  outputs: [Delta_Es, sigma_Es, Delta_Ev, sigma_Ev, Delta_Emax]
  notes: 'Heart contractility effector in elastance form after Gee et al. 2023: sympathetic sigma_Es = G_Es ln(f_esh -
    f_es_min + 1) (above threshold) and vagal sigma_Ev = G_Ev f_PNDMV_filt, each first-order filtered;
    Delta_Emax = scale (Delta_Es + Delta_Ev). Gee2023 works in compliance (1/E) form; the gains here are user-defined
    elastance-domain values.'
  invariants: &gee_invariants
  - description: 'Delta_Es = G_Es ln(f_esh - f_es_min + 1)(1 - exp(-t/tau_Es)) above threshold'
    expr: 'np.max(np.abs(Delta_Es - (G_Es*np.log(f_esh - f_es_min + 1) if f_esh >= f_es_min else 0.0)*(1 - np.exp(-t/tau_Es))))
      <= 1e-4*max(1.0, abs(G_Es)*5)'
  - description: 'Delta_Ev = G_Ev f_PNDMV_filt (1 - exp(-t/tau_Ev))'
    expr: 'np.max(np.abs(Delta_Ev - G_Ev*f_PNDMV_filt*(1 - np.exp(-t/tau_Ev)))) <= 1e-4*max(1.0, abs(G_Ev*f_PNDMV_filt))'
  - description: 'Delta_Emax = scale (Delta_Es + Delta_Ev)'
    expr: 'np.max(np.abs(Delta_Emax - scale*(Delta_Es + Delta_Ev))) <= 1e-9*max(1.0, np.max(np.abs(Delta_Emax)))'
  bc_sweep: &gee_sweep
    ranges:
      f_esh: {min: 0.0, max: 30.0, points: 6}
      f_PNDMV_filt: {min: 0.0, max: 20.0, points: 5}
    rationale: 'sympathetic cardiac drive 0-30 Hz and filtered parasympathetic postganglionic activity 0-20 Hz (Gee2023
      network ranges); gains/time constants 0.5-2x.'
  reference_proposals:
    f_esh: {reference: 'circulatory_autogen; test operating point (5 Hz)', sourced: no, value: 5.0}
    f_PNDMV_filt: {reference: 'circulatory_autogen; test operating point (1 Hz)', sourced: no, value: 1.0}
    G_Es: {reference: 'unreferenced_placeholder; "user_defined_was_1.29e9_Gee2023_inv": Gee2023 Simulink Gs_Emaxlv = 0.103
        ml/mmHg per unit ln-activity, and 1/(0.103e-6/133.322) = 1.29e9 Pa/m3 - but inverting a compliance gain is not the
        same law, so 1e7 is a user value', sourced: no}
    tau_Es: {reference: 'unreferenced_placeholder; library says Gee2023, but the Gee2023 Simulink model (BioModels
        MODEL2402270001) uses tau = 8 s for the sympathetic contractility effector, not 2 s', sourced: no}
    G_Ev: {reference: 'unreferenced_placeholder; "user_defined_was_6.5e8_Gee2023_inv" (Gee2023 Simulink Gv_Emaxlv = 0.2053
        ml/mmHg per Hz; 1/(0.2053e-6/133.322) = 6.49e8)', sourced: no}
    tau_Ev: {reference: 'unreferenced_placeholder; library says Gee2023, but the Gee2023 Simulink model uses tau = 1.5 s for
        the vagal contractility effector, not 0.2 s', sourced: no}
    scale: {reference: 'definitional; 1 for the left ventricle (Gee2023 scales only the RV)', sourced: definitional}
    f_es_min: {reference: 'Ursino1998; 2.66 spikes/s (Gee2023 Simulink "2.66 - 1" inside the log)', sourced: yes}
  validation:
    baseline: {status: pending, reason: 'Candidate: contractility (dP/dt max or Emax) change during vagus nerve stimulation
        from the data shipped with Gee2023 (BioModels MODEL2402270001, Rajendran 2019 pig data, .mat); needs a heart
        network; not set up.'}
    calibrate: {status: pending, reason: 'see baseline'}

- vessel_type: heart_effector_Gee2023
  BC_type: nn_rv
  module_type: heart_effector_Gee2023
  sim_time: 40.0
  dt: 0.02
  timestep: {t_end: 20.0, dts: [0.02, 0.01, 0.005, 0.0025]}
  outputs: [Delta_Es, sigma_Es, Delta_Ev, sigma_Ev, Delta_Emax]
  notes: 'Right-ventricular version of heart_effector_Gee2023 (scale = 0.5903).'
  invariants: *gee_invariants
  bc_sweep: *gee_sweep
  reference_proposals:
    f_esh: {reference: 'circulatory_autogen; test operating point (5 Hz)', sourced: no, value: 5.0}
    f_PNDMV_filt: {reference: 'circulatory_autogen; test operating point (1 Hz)', sourced: no, value: 1.0}
    G_Es: {reference: 'unreferenced_placeholder; "user_defined"', sourced: no}
    tau_Es: {reference: 'unreferenced_placeholder; Gee2023 Simulink uses 8 s for the RV sympathetic effector (not 2 s)',
      sourced: no}
    G_Ev: {reference: 'unreferenced_placeholder; "user_defined"', sourced: no}
    tau_Ev: {reference: 'unreferenced_placeholder; Gee2023 Simulink uses 1.5 s for the RV vagal effector (not 0.2 s)',
      sourced: no}
    scale: {reference: 'Gee2023; RV/LV scaling 0.5903 (Simulink gain 1/0.5903 on the compliance-domain RV effectors)',
      sourced: yes}
    f_es_min: {reference: 'Ursino1998; 2.66 spikes/s', sourced: yes}
  validation:
    baseline: {status: pending, reason: 'as for nn_lv'}
    calibrate: {status: pending, reason: 'as for nn_lv'}

- vessel_type: heart_effector_Gee2023_OLD
  BC_type: nn_rv
  module_type: heart_effector_Gee2023
  sim_time: 20.0
  dt: 0.01
  timestep: {t_end: 10.0, dts: [0.01, 0.005, 0.0025, 0.00125]}
  outputs: [inv_Delta_Es, inv_sigma_Es, inv_Delta_Ev, inv_sigma_Ev, Delta_Emax]
  notes: 'Compliance (inverse-elastance) form of the Gee2023 effector. The config points at module_type
    heart_effector_Gee2023 (elastance form, no inv_* variables) instead of heart_effector_Gee2023_INV, so the generated
    model has no equations for the inv_* variables: myokit warns "No value set" and every output is 0. The invariants
    below are the INV component''s exact solution (initial inv_Delta_Es = 1e-7, inv_Delta_Ev = -1e-7).'
  invariants:
  - description: 'inv_Delta_Es = s + (1e-7 - s) exp(-t/tau_Es), s = -inv_G_Es ln(f_esh - f_es_min + 1) (INV law)'
    expr: 'np.max(np.abs(inv_Delta_Es - ((-inv_G_Es*np.log(f_esh - f_es_min + 1) if f_esh >= f_es_min else 0.0) + (1e-7 -
      (-inv_G_Es*np.log(f_esh - f_es_min + 1) if f_esh >= f_es_min else 0.0))*np.exp(-t/tau_Es)))) <= 2e-2*np.max(np.abs(inv_Delta_Es))'
  - description: 'Delta_Emax = scale (1/inv_Delta_Es + 1/inv_Delta_Ev)'
    expr: 'np.all(np.isfinite(1/inv_Delta_Es)) and np.max(np.abs(Delta_Emax - scale*(1/inv_Delta_Es + 1/inv_Delta_Ev))) <=
      1e-6*np.max(np.abs(Delta_Emax)) + 1e-9'
  expected_failures:
    verification_test_invariants: 'config module_type is heart_effector_Gee2023 but the variables (inv_*) belong to
      heart_effector_Gee2023_INV; the generated model leaves inv_* unset (all outputs 0), so the INV-law invariants fail.
      Also heart_effector_Gee2023_INV declares inv_sigma_Es in J_per_m6 (should be m6_per_J). A patched copy fixing both
      runs and passes.'
    verification_test_BC: 'same defect (see verification_test_invariants)'
  bc_sweep:
    sweep: bcs
    ranges:
      f_esh: {min: 3.0, max: 30.0, points: 5}
      f_PNDMV_filt: {min: 0.5, max: 20.0, points: 5}
    rationale: 'only the inputs are swept: inv_Delta_* cross zero (1/0 singularity in Delta_Emax) for other signs/sizes of
      the gains, which is a fragility of the compliance form.'
  reference_proposals:
    inv_G_Es: {reference: 'unreferenced_placeholder; order-of-magnitude value keeping inv_Delta_Es positive (-1e-7 m6/J)',
      sourced: no, value: -1.0e-7}
    tau_Es: {reference: 'Gee2023; tau = 8 s (Simulink sympathetic contractility effector)', sourced: yes, value: 8.0}
    f_esh: {reference: 'circulatory_autogen; test operating point (5 Hz)', sourced: no, value: 5.0}
    inv_G_Ev: {reference: 'unreferenced_placeholder; order-of-magnitude value keeping inv_Delta_Ev negative (-2e-8 m6 s/J)',
      sourced: no, value: -2.0e-8}
    tau_Ev: {reference: 'Gee2023; tau = 1.5 s (Simulink vagal contractility effector)', sourced: yes, value: 1.5}
    f_PNDMV_filt: {reference: 'circulatory_autogen; test operating point (5 Hz)', sourced: no, value: 5.0}
    scale: {reference: 'Gee2023; RV scaling 0.5903', sourced: yes, value: 0.5903}
    f_es_min: {reference: 'Ursino1998; 2.66 spikes/s', sourced: yes}
  validation:
    baseline: {status: not_applicable, reason: 'superseded ("OLD") variant; owner to decide whether to delete it. Exact
        solution used for verification.'}
    calibrate: {status: not_applicable, reason: 'see baseline'}

review:
  comment: 'Four components do not generate or are mis-wired: efferent_resistance_effector_Ursino (config units Js_per_m3 vs
    CellML Js_per_m6), both respiratory effectors (u_p_resp listed twice; efferent_respiratory_effector also names
    Delta_P_mus in the config but alpha_P_mus in the CellML), and heart_effector_Gee2023_OLD (points at the elastance
    component instead of _INV, so all outputs are 0). efferent_venous_us_volume_and_compliance_effector ignores
    G_theta_us, and local_flow_control_muscle has no way to receive C_O2_p (declared "variable", so it is silently 0).
    Provenance is shaky: the Magosso/Ursino and Spencer papers are paywalled (values checked only against open secondary
    sources), several "Magosso2001AndUrsino2000"/"Gee2023" values do not match those sources (k_ab, W_cv, W_bs, W_cs,
    tau_Es, tau_Ev), and "Bizzotto2022" could not be identified.'
  summary: 'control: 18 reflex-control components (baro/chemoreceptor afferents, central integration to vagal, sympathetic
    and respiratory efferents, Ursino/Argus/Gee effectors, local metabolic flow control). Every component runs alone with
    its inputs as boundary conditions (no harness needed) and is verified against exact solutions: first-order filter
    step responses, exact algebraic sigmoid/exponential/log maps, clamps and bounds. 64+ tests pass; the 4 defective
    components are recorded as expected failures with evidence from a patched copy of the library (all pass once fixed).
    Reference proposals for all 160 parameter entries (TODO values given placeholder or derived values) and a proposed
    bib (Ursino1998, UrsinoMagosso2000, MagossoUrsino2001, Spencer1979, Albanese2016, Gee2023, Cheng2010, West2008).
    Validation is pending (candidate data identified, not obtainable/set up) or not_applicable (pure signal blocks).'
  questions:
  - 'Paywalled primary sources: Ursino1998 values (P_n, k_a, f_min/max, tau_z/p, f_es,0/inf, k_es, f_es,min, effector G/tau)
    were checked against the open Cheng2010 table (PMC2965826) and the Gee2023 Simulink model, not the paper itself.
    MagossoUrsino2001/UrsinoMagosso2000 values (AA, BB, K_O2, K_CO2, K_stat, K_dyn, tau_cap, k_CO2_m, g_O2_m/b, C_O2_v*_nom,
    A-D_b_lc, W_cv, theta_v, f_es_max) could not be checked at all. Please confirm them against your copies.'
  - 'baroreceptor: P_nom = 12000 Pa (90 mmHg; "modified from 1.25e4") and k_ab = 1610 Pa (12.08 mmHg) vs Ursino1998 P_n = 92
    mmHg (12266 Pa), k_a = 11.758 mmHg (1567.6 Pa). Keep the modified values (and say why) or revert?'
  - 'afferent_to_sympathetic_efferent: W_bs = -1.14, W_cs = 12 are not the Ursino & Magosso 2000 weights (W_b = 1 with a
    minus sign, W_c,sp = 5 / W_c,sh = 1) and there is no offset theta_s, so at f_ab = 25, f_apc = 3.7 f_s = 43 spikes/s.
    Where do -1.14 and 12 come from (calibration?) - mark them unsourced?'
  - 'afferent_to_vagal_efferent: W_cv = 0.208 vs 0.2 in Ursino & Magosso 2000 reimplementations - typo or deliberate?'
  - 'chemoreceptor: C_CO2_a_nom = 0.36 ml/ml while normal arterial CO2 content with the module''s own Spencer constants is
    0.485 ml/ml, so the resting static drive is non-zero (f_c_stat = 2.85 at the proposed normal inputs). Is 0.36
    intended? Which paper is the content-based chemoreceptor from (MagossoUrsino2001 uses PaCO2/PaO2; Albanese2016?)'
  - 'Spencer constants: k_1 (14.99 mmHg), alpha_1 (0.03198), beta_1 (0.008275) differ from the Cheng2010 table that also
