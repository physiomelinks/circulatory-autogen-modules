- vessel_type: efferent_respiratory_effector
  BC_type: nn
  module_type: efferent_respiratory_effector_type
  sim_time: 400.0
  dt: 0.5
  timestep: {t_end: 200.0, dts: [0.4, 0.2, 0.1, 0.05]}
  outputs: [tau_pA, tau_pf, G_cA, G_cf, tau_cA, tau_cf, Delta_RR_resp, Delta_P_mus]
  notes: 'Chemoreflex respiratory effector (additive form): respiratory-rate and muscle-pressure changes are first-order
    responses to central (u_c_resp) and peripheral (u_p_resp) drives, with sign/threshold-switched gains and time
    constants, then clamped. The CellML names the muscle-pressure states alpha_P_mus* (dimensionless) while the config
    and parameters use Delta_P_mus* (J_per_m3); G_pA, G_cA are Js_per_m3, so Delta_P_mus [Pa] is the dimensionally
    consistent reading.'
  invariants:
  - description: 'Delta_P_mus is the clamped sum of two exact first-order responses G_cA u_c (1 - e^(-t/tau_cA)) + G_pA u_p
      (1 - e^(-t/tau_pA))'
    expr: 'np.max(np.abs(Delta_P_mus - np.clip(G_cA*u_c_resp*(1 - np.exp(-t/tau_cA)) + G_pA*u_p_resp*(1 - np.exp(-t/tau_pA)),
      Delta_P_mus_min, Delta_P_mus_max))) <= 1e-4*max(1.0, abs(Delta_P_mus_min), abs(Delta_P_mus_max))'
  - description: 'Delta_RR_resp is the clamped sum of G_cf u_c (1 - e^(-t/tau_cf)) + G_pf u_p (1 - e^(-t/tau_pf))'
    expr: 'np.max(np.abs(Delta_RR_resp - np.clip(G_cf*u_c_resp*(1 - np.exp(-t/tau_cf)) + G_pf*u_p_resp*(1 - np.exp(-t/tau_pf)),
      Delta_RR_resp_min, Delta_RR_resp_max))) <= 1e-4*max(1e-3, abs(Delta_RR_resp_min), abs(Delta_RR_resp_max))'
  expected_failures:
    run_test: 'two defects: (1) u_p_resp is listed twice in variables_and_units (duplicate variable -> libcellml
      VARIABLE_NAME_UNIQUE); (2) the config/parameters declare Delta_P_mus, Delta_P_mus_max/min (J_per_m3) but the CellML
      component uses alpha_P_mus* (dimensionless). A patched copy (duplicate removed, CellML alpha_P_mus* renamed to
      Delta_P_mus* with J_per_m3 units) generates and passes both invariants.'
    verification_test_invariants: 'generation fails (see run_test)'
    verification_test_BC: 'generation fails (see run_test)'
    verification_test_timestep: 'generation fails (see run_test)'
    stability_test: 'generation fails (see run_test)'
  bc_sweep:
    ranges:
      u_c_resp: {min: -200.0, max: 1000.0, points: 7}
      u_p_resp: {min: -5.0, max: 15.0, points: 5}
      u_CO2_c_thresh: {min: 0.0, max: 100.0, points: 3}
    rationale: 'as for the multiplicative variant: PCO2 excess -1.5..+7.5 mmHg (numerically in Pa with K_c_resp = 1) and
      chemoreceptor firing -5..+15 spikes/s about nominal.'
  reference_proposals:
    u_c_resp: {reference: 'circulatory_autogen; test operating point (100)', sourced: no, value: 100.0}
    u_p_resp: {reference: 'circulatory_autogen; test operating point (1)', sourced: no, value: 1.0}
    G_pA: {reference: 'unreferenced_placeholder; library cites "Bizotto2022" (-120 Pa s, converted from dyne/cm2); no such
        publication could be identified - owner to give the full reference (possibly Albanese2016 chemoreflex table)',
      sourced: no}
    G_pf: {reference: 'unreferenced_placeholder; "user_defined"', sourced: no}
    tau_pA_min: {reference: 'unreferenced_placeholder; "Bizzotto2022_converted" - source not identified', sourced: no}
    tau_pA_max: {reference: 'unreferenced_placeholder; "Bizzotto2022_converted" - source not identified', sourced: no}
    tau_pf_min: {reference: 'unreferenced_placeholder; "Bizzotto2022_converted" - source not identified', sourced: no}
    tau_pf_max: {reference: 'unreferenced_placeholder; "Bizzotto2022_converted" - source not identified', sourced: no}
    G_cA_max: {reference: 'unreferenced_placeholder; "Bizotto2022" - source not identified', sourced: no}
    G_cf_max: {reference: 'unreferenced_placeholder; "Bizzotto2022_converted" - source not identified', sourced: no}
    tau_cA_min: {reference: 'unreferenced_placeholder; "Bizzotto2022_converted" - source not identified', sourced: no}
    tau_cA_max: {reference: 'unreferenced_placeholder; "Bizzotto2022_converted" - source not identified', sourced: no}
    tau_cf_min: {reference: 'unreferenced_placeholder; "Bizzotto2022_converted" - source not identified', sourced: no}
    tau_cf_max: {reference: 'unreferenced_placeholder; "Bizzotto2022_converted" - source not identified', sourced: no}
    u_CO2_c_thresh: {reference: 'unreferenced_placeholder; calibrated ("from_ICUHealthy")', sourced: no}
    Delta_RR_resp_max: {reference: 'unreferenced_placeholder; calibrated ("from_ICUHealthy")', sourced: no}
    Delta_P_mus_max: {reference: 'unreferenced_placeholder; calibrated ("from_ICUHealthy")', sourced: no}
    Delta_RR_resp_min: {reference: 'unreferenced_placeholder; calibrated ("from_ICUHealthy")', sourced: no}
