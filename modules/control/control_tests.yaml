module: control
reviewed: false
known_issues: []
defaults:
  sim_time: 40.0
  pre_time: 0.0
  dt: 0.05
  solver: CVODE_myokit
  bc_sweep:
    factors: [0.5, 0.75, 1.0, 1.5, 2.0]
    ranges: {}
    rationale: 'Constants not listed in ranges are swept over 0.5-2x their nominal value (the gains/time constants of
      these reflex blocks are uncertain to about that extent across the Ursino/Magosso/Gee model family).'
  timestep:
    scheme: rk4
    dts: [0.04, 0.02, 0.01, 0.005]
    min_order: 0.8
    tol: 0.0001
    cvode_tol: 0.001
    t_end: 40.0
  stability:
    supported:
    - {solver: CVODE_myokit, rtol: 1.0e-06, atol: 1.0e-08}
components:

# ------------------------------------------------------------------------------------------------
- vessel_type: baroreceptor
  BC_type: nn
  module_type: baroreceptor_type
  sim_time: 20.0
  dt: 0.01
  timestep: {t_end: 20.0}
  outputs: [P_baro, f_ab]
  notes: 'Carotid-sinus baroreceptor afferent (Ursino 1998): a first-order lead-lag filter of systemic pressure,
    tau_pb dP_baro/dt = P_sys + tau_zb dP_sys/dt - P_baro, followed by the static sigmoid
    f_ab = (f_ab_min + f_ab_max e^x)/(1 + e^x), x = (P_baro - P_nom)/k_ab. With constant P_sys and dP_sys_dt the
    filter has the exact solution P_baro = X + (P_baro_init - X) e^(-t/tau_pb), X = P_sys + tau_zb dP_sys_dt.'
  invariants:
  - description: 'P_baro matches the exact first-order solution X + (P_baro_init - X) exp(-t/tau_pb), X = P_sys + tau_zb dP_sys_dt'
    expr: 'np.max(np.abs(P_baro - ((P_sys + tau_zb*dP_sys_dt) + (P_baro_init - (P_sys + tau_zb*dP_sys_dt))*np.exp(-t/tau_pb))))
      <= 1e-4*max(abs(P_sys + tau_zb*dP_sys_dt), abs(P_baro_init))'
  - description: 'f_ab is the static sigmoid of P_baro (exact algebraic identity)'
    expr: 'np.max(np.abs(f_ab - (f_ab_min + f_ab_max*np.exp((P_baro - P_nom)/k_ab))/(1 + np.exp((P_baro - P_nom)/k_ab))))
      <= 1e-8*max(1.0, f_ab_max)'
  - description: 'afferent firing stays between its saturation levels f_ab_min and f_ab_max'
    expr: '(np.min(f_ab) >= min(f_ab_min, f_ab_max) - 1e-9) & (np.max(f_ab) <= max(f_ab_min, f_ab_max) + 1e-9)'
  bc_sweep:
    ranges:
      P_sys: {min: 6666, max: 26664, points: 7}
      dP_sys_dt: {min: -2000, max: 2000, points: 5}
      P_baro_init: {min: 8000, max: 20000, points: 5}
      P_nom: {min: 10666, max: 14666, points: 5}
      tau_zb: {min: 0.0, max: 12.0, points: 5}
      tau_pb: {min: 0.5, max: 8.0, points: 5, scale: log}
      k_ab: {min: 800, max: 3200, points: 5, scale: log}
      f_ab_min: {min: 0.0, max: 10.0, points: 5}
      f_ab_max: {min: 25.0, max: 80.0, points: 5}
    rationale: 'P_sys 50-200 mmHg (hypotension to severe hypertension, mean or systolic); dP_sys_dt +-2000 Pa/s
      (15 mmHg/s, slow ramps; pulsatile dP/dt is far larger but the input is meant to be smoothed); P_nom 80-110 mmHg
      around the Ursino 92 mmHg set point; time constants and slopes 0.5-2x the Ursino values; saturations spanning
      reported afferent ranges.'
  reference_proposals:
    P_sys: {reference: 'circulatory_autogen; test operating point (125 mmHg) for the stand-alone afferent; in a network
        it is the carotid/aortic pressure', sourced: no}
    dP_sys_dt: {reference: 'circulatory_autogen; test operating point (0.2 mmHg/s); in a network it is dP/dt of the
        sensed pressure', sourced: no}
    P_baro_init: {reference: 'definitional; initial filtered pressure (93 mmHg), chosen near the set point to shorten the
        transient', sourced: definitional}
    P_nom: {reference: 'Ursino1998; P_n = 92 mmHg (12266 Pa) in the paper (value corroborated by Cheng2010 Table and
        the Gee2023 Simulink model); the library value 12000 Pa (90 mmHg) is a modification - owner to confirm which to keep',
        sourced: yes}
    tau_zb: {reference: 'Ursino1998; tau_z = 6.37 s (corroborated by Cheng2010 Table, Gee2023 Simulink [6.37 1]); primary
        table not accessible (paywall)', sourced: yes}
    tau_pb: {reference: 'Ursino1998; tau_p = 2.076 s (corroborated by Cheng2010 Table, Gee2023 Simulink [2.076 1])', sourced: yes}
    f_ab_min: {reference: 'Ursino1998; f_min = 2.52 spikes/s (corroborated by Cheng2010 Table)', sourced: yes}
    f_ab_max: {reference: 'Ursino1998; f_max = 47.78 spikes/s (corroborated by Cheng2010 Table)', sourced: yes}
    k_ab: {reference: 'Ursino1998; k_a = 11.758 mmHg = 1567.6 Pa (Cheng2010 Table). The library value 1610 Pa (12.08 mmHg)
        does NOT match; propose 1567.6 Pa unless the change was deliberate', sourced: yes}
  validation:
    baseline: {status: pending, reason: 'Candidate: the static carotid-sinus afferent firing vs sinus pressure curve that
        Ursino 1998 fitted (f_min, f_max, P_n, k_a); the underlying data (and the paper) are paywalled and could not be
        obtained. An open alternative is a human neck-chamber HR-pressure sigmoid, but that validates the whole reflex
        arc, not this afferent block.'}
    calibrate: {status: pending, reason: 'same data as baseline would identify P_nom, k_ab, f_ab_min, f_ab_max'}

# ------------------------------------------------------------------------------------------------
- vessel_type: chemoreceptor
  BC_type: nn
  module_type: chemoreceptor_type
  sim_time: 20.0
  dt: 0.01
  timestep: {t_end: 20.0, dts: [0.02, 0.01, 0.005, 0.0025]}
  outputs: [S_O2_a, X_O2, phi_stat, phi_CO2_dyn, f_c_stat, f_c_dyn, f_apc, phi_apc, P_O2_a, C_O2_a_diss]
  notes: 'Peripheral (carotid body) chemoreceptor. Arterial O2 content is inverted through the Spencer (1979)
    dissociation curves to P_O2_a and a saturation S_O2_a; a static O2-CO2 interaction term phi_stat (CO2 content
    above C_CO2_a_nom, scaled by an O2 factor) is saturated to f_c_stat; a dynamic term driven by dC_CO2/dt is
    low-pass filtered (tau_cap) and saturated to f_c_dyn; their sum is low-pass filtered to phi_apc and rectified to
    f_apc. With constant inputs: phi_CO2_dyn = dot_C_CO2_a tau_CO2_cc_dyn (1 - e^(-t/tau_cap)) exactly, and with
    dot_C_CO2_a = 0, phi_apc = f_c_stat (1 - e^(-t/tau_cap)) exactly.'
  invariants:
  - description: 'phi_CO2_dyn matches its exact solution dot_C_CO2_a tau_CO2_cc_dyn (1 - exp(-t/tau_cap))'
    expr: 'np.max(np.abs(phi_CO2_dyn - dot_C_CO2_a*tau_CO2_cc_dyn*(1 - np.exp(-t/tau_cap)))) <= 1e-4*max(1e-6, abs(dot_C_CO2_a*tau_CO2_cc_dyn))'
  - description: 'f_c_dyn = K_dyn (1 - exp(-phi_CO2_dyn/K_dyn)) (algebraic)'
    expr: 'np.max(np.abs(f_c_dyn - K_dyn*(1 - np.exp(-phi_CO2_dyn/K_dyn)))) <= 1e-8*max(1.0, K_dyn)'
  - description: 'X_O2 = AA (1 - S_O2_a) + BB (algebraic)'
    expr: 'np.max(np.abs(X_O2 - (AA*(1 - S_O2_a) + BB))) <= 1e-8*max(1.0, abs(AA) + abs(BB))'
  - description: 'phi_stat and f_c_stat follow the static O2-CO2 interaction law (zero below C_CO2_a_nom)'
    expr: 'np.max(np.abs(f_c_stat - np.where(C_CO2_a >= C_CO2_a_nom, K_stat*(1 - np.exp(-(K_CO2*(C_CO2_a - C_CO2_a_nom)*K_O2*(1
      - np.exp(-X_O2/K_O2)))/K_stat)), 0.0))) <= 1e-8*max(1.0, K_stat)'
  - description: 'with dC_CO2/dt = 0, phi_apc matches the exact solution f_c_stat (1 - exp(-t/tau_cap))'
    expr: '(dot_C_CO2_a != 0) or (np.max(np.abs(phi_apc - f_c_stat*(1 - np.exp(-t/tau_cap)))) <= 1e-4*max(1e-6, np.max(np.abs(f_c_stat))))'
  - description: 'f_apc = max(phi_apc, 0)'
    expr: 'np.max(np.abs(f_apc - np.maximum(phi_apc, 0))) <= 1e-12 + 1e-9*np.max(np.abs(phi_apc))'
  - description: 'S_O2_a lies in [0, 1] and P_O2_a is positive at the physiological run point'
    expr: '(np.min(S_O2_a) >= 0) & (np.max(S_O2_a) <= 1) & (np.min(P_O2_a) > 0)'
    applies: run
  bc_sweep:
    ranges:
      C_O2_a: {min: 0.10, max: 0.204, points: 6}
      C_CO2_a: {min: 0.30, max: 0.60, points: 7}
      dot_C_CO2_a: {min: -0.002, max: 0.002, points: 5}
      saturation_cap: {min: 0.99, max: 0.99999, points: 3}
    rationale: 'C_O2_a 0.10-0.204 ml/ml spans severe hypoxaemia (PaO2 ~ 25 mmHg) to full saturation just below the
      capping level C_O2_sat*saturation_cap; C_CO2_a 0.30-0.60 ml/ml spans hypocapnia to marked hypercapnia around the
      normal 0.485; dC_CO2/dt +-0.002 /s (a 0.1 ml/ml change over ~50 s, a fast hypercapnic step); saturation_cap is a
      numerical guard (<1). Other constants 0.5-2x nominal.'
  reference_proposals:
    C_O2_a: {reference: 'Spencer1979; 0.1987 ml/ml = O2 content from the module''s own Spencer constants at PaO2 100 mmHg,
        PaCO2 40 mmHg (normal arterial tensions, West2008)', sourced: yes, value: 0.1987}
    C_CO2_a: {reference: 'Spencer1979; 0.485 ml/ml = CO2 content from the module''s Spencer constants at PaO2 100 mmHg,
        PaCO2 40 mmHg (West2008)', sourced: yes, value: 0.485}
    dot_C_CO2_a: {reference: 'definitional; steady arterial CO2 content (no dynamic chemoreceptor drive)', sourced: definitional,
      value: 0.0}
    AA: {reference: 'MagossoUrsino2001; A = 600 (chemoreceptor O2 term; value in circulatory_autogen resources - not verified
        against the paywalled paper; this content-based chemoreceptor may instead come from Albanese2016)', sourced: yes}
    BB: {reference: 'MagossoUrsino2001; B = 10.18 (as AA: not verified against the paper)', sourced: yes}
    C_CO2_a_nom: {reference: 'unreferenced_placeholder; library note says "changed_from_0.36" but the value is 0.36; normal
        arterial CO2 content with the module''s Spencer curve is 0.485 ml/ml, so 0.36 gives a large resting f_c_stat - owner
        to confirm the source and intended value', sourced: no}
    K_O2: {reference: 'MagossoUrsino2001; K_O2 = 200 (not verified against the paper)', sourced: yes}
    K_CO2: {reference: 'MagossoUrsino2001; K_CO2 = 1 /s (not verified against the paper)', sourced: yes}
    K_stat: {reference: 'MagossoUrsino2001; K_stat = 20 spikes/s (not verified against the paper)', sourced: yes}
    K_dyn: {reference: 'MagossoUrsino2001; K_dyn = 45 spikes/s (not verified against the paper)', sourced: yes}
    tau_cap: {reference: 'MagossoUrsino2001; 3.5 s (not verified against the paper)', sourced: yes}
    tau_CO2_cc_dyn: {reference: 'MagossoUrsino2001; 600 (a gain, dimensionless here, despite the tau name; not verified
        against the paper)', sourced: yes}
    alpha_O2: {reference: 'West2008; O2 solubility 0.003 ml O2/(100 ml blood mmHg) = 3e-5 /133.322 Pa = 2.25e-7 /Pa. The
        library 2.33e-7 corresponds to 0.0031 ml/(100 ml mmHg) - both are common textbook values', sourced: yes}
    Hgb: {reference: 'West2008; normal haemoglobin ~15 g/100 ml = 150 kg/m3 (textbook value; page not checked)', sourced: yes}
    k_1: {reference: 'Spencer1979; K1 = 14.99 mmHg = 1998.5 Pa (value as in circulatory_autogen; could not read the paper;
        Cheng2010 Table cites Spencer1979 with K1 = 13 - owner to check)', sourced: yes}
    k_2: {reference: 'Spencer1979; K2 = 194.4 mmHg = 25917 Pa (matches Cheng2010 Table citing Spencer1979)', sourced: yes}
    h_1: {reference: 'Spencer1979; a1 = 0.3836 (matches Cheng2010 Table)', sourced: yes}
    h_2: {reference: 'Spencer1979; a2 = 1.819 (matches Cheng2010 Table)', sourced: yes}
    alpha_1: {reference: 'Spencer1979; alpha1 = 0.03198 /mmHg = 2.40e-4 /Pa (Cheng2010 Table cites 0.02598 - owner to check)',
      sourced: yes}
    alpha_2: {reference: 'Spencer1979; alpha2 = 0.05591 /mmHg = 4.19e-4 /Pa (matches Cheng2010 Table)', sourced: yes}
    beta_1: {reference: 'Spencer1979; beta1 = 0.008275 /mmHg = 6.21e-5 /Pa (Cheng2010 Table cites 0.012275 - owner to check)',
      sourced: yes}
    beta_2: {reference: 'Spencer1979; beta2 = 0.03255 /mmHg = 2.44e-4 /Pa (matches Cheng2010 Table). Note other
        circulatory_autogen parameter files carry 2.4415e-5 (a factor-10 typo)', sourced: yes}
    overcap_solubility: {reference: 'unreferenced_placeholder; numerical guard (Pa per unit excess content above the
        saturation cap)', sourced: no}
    saturation_cap: {reference: 'unreferenced_placeholder; numerical guard keeping the Spencer inversion finite', sourced: no}
    C_O2_sat: {reference: 'Spencer1979; C1 = 9.0 mmol/l converted with 22.72 ml/mmol = 0.2045 ml/ml (the conversion factor
        is not the STPD 22.4 ml/mmol - owner to confirm)', sourced: yes}
    C_CO2_sat: {reference: 'Spencer1979; C2 = 86.11 mmol/l x 22.72 ml/mmol = 1.9564 ml/ml (same conversion as C_O2_sat)',
      sourced: yes}
  validation:
    baseline: {status: pending, reason: 'Candidate: steady-state carotid-body firing vs PaO2 at several PaCO2 levels
        (the data MagossoUrsino2001 fitted the O2-CO2 interaction to). Requires the paper/figure (paywalled); not set up.'}
    calibrate: {status: pending, reason: 'same data would identify AA, BB, K_O2, K_stat'}

# ------------------------------------------------------------------------------------------------
- vessel_type: afferent_to_vagal_efferent
  BC_type: nn
  module_type: afferent_to_vagal_efferent_type
  sim_time: 1.0
  dt: 0.1
  outputs: [f_v]
  notes: 'Central integration to vagal efferent activity (Ursino 1998 sigmoid plus the Ursino & Magosso 2000 chemoreceptor
    term): f_v = (f_ev_0 + f_ev_inf e^y)/(1 + e^y) + W_cv f_apc - theta_v, y = (f_ab - f_ab_0)/k_ev. Purely algebraic.'
  invariants:
  - description: 'f_v equals the algebraic vagal law'
    expr: 'np.max(np.abs(f_v - ((f_ev_0 + f_ev_inf*np.exp((f_ab - f_ab_0)/k_ev))/(1 + np.exp((f_ab - f_ab_0)/k_ev)) + W_cv*f_apc
      - theta_v))) <= 1e-9*max(1.0, abs(f_ev_inf) + abs(W_cv*f_apc))'
  - description: 'vagal activity is non-negative for non-negative afferent inputs'
    expr: '(f_apc < 0) or (np.min(f_v) >= 0)'
  bc_sweep:
    ranges:
      f_ab: {min: 0.0, max: 50.0, points: 6}
      f_apc: {min: 0.0, max: 20.0, points: 5}
      theta_v: {min: -2.0, max: 0.0, points: 5}
    rationale: 'f_ab covers the full baroreceptor output range (f_ab_min 2.52 to f_ab_max 47.78 spikes/s); f_apc 0-20
      spikes/s covers chemoreceptor output up to K_stat; theta_v offset around the Ursino & Magosso -0.68.'
  reference_proposals:
    f_ab: {reference: 'circulatory_autogen; test operating point = f_ab_0 (baroreceptor output at the vagal set point)',
      sourced: no, value: 25.0}
    f_apc: {reference: 'circulatory_autogen; test operating point = f_apc_nom (3.7 spikes/s)', sourced: no, value: 3.7}
    W_cv: {reference: 'UrsinoMagosso2000; W_c,v = 0.2 in open reimplementations of that model (e.g. Baby-Monitor-Simulator
        chemo_f.m); the library 0.208 does not match - owner to confirm (could be a MagossoUrsino2001 value)', sourced: yes}
    f_ev_0: {reference: 'Ursino1998; f_ev,0 = 3.2 spikes/s (Cheng2010 Table, citing MagossoUrsino2001)', sourced: yes}
    f_ev_inf: {reference: 'Ursino1998; f_ev,inf = 6.3 spikes/s (Cheng2010 Table)', sourced: yes}
    f_ab_0: {reference: 'Ursino1998; f_cs,0 = 25 spikes/s (Cheng2010 Table)', sourced: yes}
    theta_v: {reference: 'UrsinoMagosso2000; theta_v = -0.68 spikes/s (open reimplementations; primary not read)', sourced: yes}
    k_ev: {reference: 'Ursino1998; k_ev = 7.06 spikes/s (Cheng2010 Table)', sourced: yes}
  validation:
    baseline: {status: not_applicable, reason: 'central integration block with no directly measurable counterpart in
        isolation (vagal firing is not measured against f_ab); verified against its exact algebraic law. Closed-loop
        validation (HR response) belongs to a network that uses it.'}
    calibrate: {status: not_applicable, reason: 'see baseline'}

# ------------------------------------------------------------------------------------------------
- vessel_type: afferent_to_respiratory_efferent
  BC_type: nn
  module_type: afferent_to_respiratory_efferent_type
  sim_time: 1.0
  dt: 0.1
  outputs: [u_c_resp, u_p_resp]
  run_parameters: {P_CO2_a: 6000.0, f_apc: 5.0}
  notes: 'Linear central (u_c_resp, from arterial PCO2) and peripheral (u_p_resp, from chemoreceptor firing) respiratory
    drives. Purely algebraic. P_O2_a is an input but is not used by any equation.'
  invariants:
  - description: 'u_c_resp = K_c_resp (P_CO2_a - P_CO2_a_nom)'
    expr: 'np.max(np.abs(u_c_resp - K_c_resp*(P_CO2_a - P_CO2_a_nom))) <= 1e-9*max(1.0, abs(K_c_resp*P_CO2_a))'
  - description: 'u_p_resp = K_p_resp (f_apc - f_apc_nom)'
    expr: 'np.max(np.abs(u_p_resp - K_p_resp*(f_apc - f_apc_nom))) <= 1e-9*max(1.0, abs(K_p_resp*f_apc))'
  bc_sweep:
    ranges:
      P_CO2_a: {min: 3333, max: 9333, points: 7}
      P_O2_a: {min: 4000, max: 20000, points: 3}
      f_apc: {min: 0.0, max: 20.0, points: 5}
    rationale: 'PaCO2 25-70 mmHg (hyperventilation to marked hypercapnia); PaO2 30-150 mmHg (unused, checked for
      finiteness); f_apc over the chemoreceptor output range.'
  reference_proposals:
    P_CO2_a: {reference: 'West2008; normal arterial PCO2 40 mmHg = 5332.9 Pa', sourced: yes, value: 5332.8}
    P_O2_a: {reference: 'West2008; normal arterial PO2 ~100 mmHg = 13332 Pa (unused by the equations)', sourced: yes, value: 13332.0}
    f_apc: {reference: 'circulatory_autogen; test operating point = f_apc_nom', sourced: no, value: 3.7}
    f_apc_nom: {reference: 'unreferenced_placeholder; library cites "Magosso2001_changed_from_3.7" but the value is 3.7 and
        could not be checked against MagossoUrsino2001 (paywalled); at the module''s nominal inputs the chemoreceptor
        steady state f_apc is ~2.9, not 3.7', sourced: no}
    K_c_resp: {reference: 'unreferenced_placeholder; "to_be_identified" gain (1 per Pa per s)', sourced: no}
    K_p_resp: {reference: 'unreferenced_placeholder; "to_be_identified" gain', sourced: no}
    P_CO2_a_nom: {reference: 'West2008; 40 mmHg = 5332.9 Pa (library cites MagossoUrsino2001, whose nominal PaCO2 is also 40
        mmHg per Cheng2010 IC 40.4 Torr)', sourced: yes}
  validation:
    baseline: {status: not_applicable, reason: 'linear signal-conditioning block with placeholder gains; verified against
        its exact law. Ventilatory CO2/O2 response data belong to the respiratory network that uses it.'}
    calibrate: {status: not_applicable, reason: 'see baseline'}

# ------------------------------------------------------------------------------------------------
- vessel_type: afferent_to_sympathetic_efferent
  BC_type: nn
  module_type: afferent_to_sympathetic_efferent_type
  sim_time: 1.0
  dt: 0.1
  outputs: [f_s]
  notes: 'Sympathetic efferent activity (Ursino 1998 exponential): f_s = min(f_es_inf + (f_es_0 - f_es_inf)
    exp(k_es (W_bs f_ab + W_cs f_apc)), f_es_max). W_bs carries the (negative) baroreceptor sign. Unlike Ursino &
    Magosso 2000 there is no offset theta_s, so at f_ab = 25, f_apc = 3.7 the output is ~43 spikes/s (Ursino resting
    value is a few spikes/s).'
  invariants:
  - description: 'f_s equals the saturated exponential law'
    expr: 'np.max(np.abs(f_s - np.minimum(f_es_inf + (f_es_0 - f_es_inf)*np.exp(k_es*(W_bs*f_ab + W_cs*f_apc)), f_es_max)))
      <= 1e-9*max(1.0, f_es_max)'
  - description: 'f_s never exceeds f_es_max and stays above f_es_inf (when f_es_0 > f_es_inf)'
    expr: '(np.max(f_s) <= f_es_max + 1e-9) & ((f_es_0 <= f_es_inf) or (np.min(f_s) >= min(f_es_inf, f_es_max) - 1e-9))'
  bc_sweep:
    ranges:
      f_ab: {min: 0.0, max: 50.0, points: 6}
      f_apc: {min: 0.0, max: 20.0, points: 5}
    rationale: 'full baroreceptor and chemoreceptor output ranges.'
  reference_proposals:
    f_ab: {reference: 'circulatory_autogen; test operating point = f_ab_0', sourced: no, value: 25.0}
    f_apc: {reference: 'circulatory_autogen; test operating point = f_apc_nom', sourced: no, value: 3.7}
    W_bs: {reference: 'unreferenced_placeholder; UrsinoMagosso2000 uses W_b,sp = W_b,sh = 1 with a minus sign in the exponent
        (open reimplementations); -1.14 is not found there', sourced: no}
    W_cs: {reference: 'unreferenced_placeholder; UrsinoMagosso2000 uses W_c,sp = 5, W_c,sh = 1 (open reimplementations); 12
        is not found there', sourced: no}
    f_es_0: {reference: 'Ursino1998; f_es,0 = 16.11 spikes/s (Cheng2010 Table; Gee2023 Simulink f_es0 - f_es_inf = 14.01)',
      sourced: yes}
    f_es_inf: {reference: 'Ursino1998; f_es,inf = 2.10 spikes/s (Cheng2010 Table)', sourced: yes}
    f_es_max: {reference: 'UrsinoMagosso2000; f_es,max = 60 spikes/s (open reimplementations; Gee2023 Simulink saturation 60)',
      sourced: yes}
    k_es: {reference: 'Ursino1998; k_es = 0.0675 s (Gee2023 Simulink gain -0.0675; Cheng2010 lists 0.07)', sourced: yes}
  validation:
    baseline: {status: pending, reason: 'Candidate: muscle sympathetic nerve activity vs diastolic pressure (human MSNA
        baroreflex curves, e.g. Kienbaum-type sigmoid data) would test the combined baroreceptor + sympathetic mapping; needs
        an obtainable dataset and a network with the baroreceptor; not set up.'}
    calibrate: {status: pending, reason: 'see baseline'}

# ------------------------------------------------------------------------------------------------
- vessel_type: efferent_resistance_effector
  BC_type: nn
  module_type: efferent_resistance_effector_Argus_type
  outputs: [Delta_theta, sigma_theta]
  notes: 'Saturating resistance effector (Argus variant): tau_theta dsigma/dt = max(f_s - f_es_min, 0) - sigma;
    Delta_theta = G_theta sigma/(f_es_mid + sigma), a dimensionless fractional change (Michaelis-Menten saturation, unlike
    the Ursino logarithm). Exact: sigma = S (1 - e^(-t/tau)), S = max(f_s - f_es_min, 0).'
  invariants:
  - description: 'sigma_theta matches max(f_s - f_es_min, 0) (1 - exp(-t/tau_theta))'
    expr: 'np.max(np.abs(sigma_theta - max(f_s - f_es_min, 0)*(1 - np.exp(-t/tau_theta)))) <= 1e-4*max(1e-6, abs(f_s - f_es_min))'
  - description: 'Delta_theta = G_theta sigma/(f_es_mid + sigma)'
    expr: 'np.max(np.abs(Delta_theta - G_theta*sigma_theta/(f_es_mid + sigma_theta))) <= 1e-9*max(1.0, abs(G_theta))'
  - description: 'Delta_theta stays within [0, G_theta) (for G_theta >= 0)'
    expr: '(G_theta < 0) or ((np.min(Delta_theta) >= -1e-12) & (np.max(Delta_theta) < G_theta + 1e-12))'
  bc_sweep:
    ranges:
      f_s: {min: 0.0, max: 60.0, points: 7}
    rationale: 'f_s from silent to f_es_max (60 spikes/s); gains/time constants 0.5-2x.'
  reference_proposals:
    f_s: {reference: 'circulatory_autogen; test operating point (10 spikes/s, above f_es_min)', sourced: no, value: 10.0}
    G_theta: {reference: 'unreferenced_placeholder; "assumed that R can double"', sourced: no}
    tau_theta: {reference: 'Ursino1998; tau_R,sp = 6 s (Gee2023 Simulink [6 1] for the R effector)', sourced: yes}
    f_es_min: {reference: 'Ursino1998; f_es,min = 2.66 spikes/s (Cheng2010 Table; Gee2023 Simulink 2.66)', sourced: yes}
    f_es_mid: {reference: 'unreferenced_placeholder; "to_be_calibrated" half-saturation of the Argus effector', sourced: no}
  validation:
    baseline: {status: not_applicable, reason: 'effector transfer block with placeholder gain; verified against its exact
        solution; validation of vascular resistance responses belongs to a closed-loop network.'}
    calibrate: {status: not_applicable, reason: 'see baseline'}

