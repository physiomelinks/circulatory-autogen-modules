- vessel_type: efferent_respiratory_effector_Gee_Argus_2026
  BC_type: nn
  module_type: efferent_respiratory_effector_Gee_Argus_2026_type
  sim_time: 400.0
  dt: 0.5
  timestep: {t_end: 200.0, dts: [0.4, 0.2, 0.1, 0.05]}
  outputs: [tau_pA, tau_pf, G_cA, G_cf, tau_cA, tau_cf, Delta_RR_c, Delta_RR_p, alpha_P_mus_c, alpha_P_mus_p, Delta_RR_resp,
    alpha_P_mus]
  notes: 'Chemoreflex respiratory effector (multiplicative muscle-pressure form): peripheral and central drives act on
    respiratory rate (additive Delta_RR, first order) and on the muscle-pressure amplitude through multipliers alpha
    (first order towards 1 + G u), with time constants switched by the sign of the drive / a CO2 threshold; outputs are
    clamped. With constant drives each state is an exact first-order response.'
  invariants:
  - description: 'Delta_RR_c = G_cf u_c_resp (1 - exp(-t/tau_cf))'
    expr: 'np.max(np.abs(Delta_RR_c - G_cf*u_c_resp*(1 - np.exp(-t/tau_cf)))) <= 1e-4*max(1e-6, np.max(np.abs(G_cf*u_c_resp))) + 1e-9'
  - description: 'Delta_RR_p = G_pf u_p_resp (1 - exp(-t/tau_pf))'
    expr: 'np.max(np.abs(Delta_RR_p - G_pf*u_p_resp*(1 - np.exp(-t/tau_pf)))) <= 1e-4*max(1e-6, np.max(np.abs(G_pf*u_p_resp))) + 1e-9'
  - description: 'alpha_P_mus_c = 1 + G_cA u_c_resp (1 - exp(-t/tau_cA)) (starts at 1)'
    expr: 'np.max(np.abs(alpha_P_mus_c - (1 + G_cA*u_c_resp*(1 - np.exp(-t/tau_cA))))) <= 1e-4*max(1.0, np.max(np.abs(G_cA*u_c_resp)))'
  - description: 'alpha_P_mus_p = 1 + G_pA u_p_resp (1 - exp(-t/tau_pA))'
    expr: 'np.max(np.abs(alpha_P_mus_p - (1 + G_pA*u_p_resp*(1 - np.exp(-t/tau_pA))))) <= 1e-4*max(1.0, np.max(np.abs(G_pA*u_p_resp)))'
  - description: 'outputs are the clamped sum / product'
    expr: '(np.max(np.abs(Delta_RR_resp - np.clip(Delta_RR_c + Delta_RR_p, Delta_RR_resp_min, Delta_RR_resp_max))) <= 1e-12)
      & (np.max(np.abs(alpha_P_mus - np.clip(alpha_P_mus_c*alpha_P_mus_p, alpha_P_mus_min, alpha_P_mus_max))) <= 1e-12)'
  expected_failures:
    run_test: 'u_p_resp is listed twice in the config variables_and_units (and twice in the parameters csv), so the
      generated component declares it twice and libcellml rejects the model (VARIABLE_NAME_UNIQUE). A patched copy with the
      duplicate removed generates and passes the invariants.'
    verification_test_invariants: 'generation fails (see run_test)'
    verification_test_BC: 'generation fails (see run_test)'
    verification_test_timestep: 'generation fails (see run_test)'
    stability_test: 'generation fails (see run_test)'
  bc_sweep:
    ranges:
      u_c_resp: {min: -200.0, max: 1000.0, points: 7}
      u_p_resp: {min: -5.0, max: 15.0, points: 5}
      u_CO2_c_thresh: {min: 0.0, max: 100.0, points: 3}
    rationale: 'u_c_resp = K_c_resp (PaCO2 - PaCO2_nom) with K_c_resp = 1 is numerically the PCO2 excess in Pa: -200 to
      +1000 Pa (-1.5 to +7.5 mmHg); u_p_resp spans chemoreceptor firing -5..+15 spikes/s about f_apc_nom.'
  reference_proposals:
    u_c_resp: {reference: 'circulatory_autogen; test operating point (100, above the CO2 threshold)', sourced: no, value: 100.0}
    u_p_resp: {reference: 'circulatory_autogen; test operating point (1)', sourced: no, value: 1.0}
    G_pA: {reference: 'unreferenced_placeholder; fractional muscle-pressure gain per unit peripheral drive (0.01 s, order of
        magnitude only; the additive sibling uses -120 Pa s)', sourced: no, value: 0.01}
    G_pf: {reference: 'unreferenced_placeholder; copied from the additive sibling efferent_respiratory_effector (0.014855,
        "user_defined")', sourced: no, value: 0.014855}
    tau_pA_min: {reference: 'unreferenced_placeholder; copied from the sibling (10 s, library cites "Bizzotto2022", not found)',
      sourced: no, value: 10.0}
    tau_pA_max: {reference: 'unreferenced_placeholder; copied from the sibling (83 s)', sourced: no, value: 83.0}
    tau_pf_min: {reference: 'unreferenced_placeholder; copied from the sibling (17.526 s)', sourced: no, value: 17.526}
    tau_pf_max: {reference: 'unreferenced_placeholder; copied from the sibling (174.78 s)', sourced: no, value: 174.78}
    G_cA_max: {reference: 'unreferenced_placeholder; fractional gain (0.001 s per unit u_c, order of magnitude only)', sourced: no,
      value: 0.001}
    G_cf_max: {reference: 'unreferenced_placeholder; copied from the sibling (1.12e-4)', sourced: no, value: 1.12e-4}
    tau_cA_min: {reference: 'unreferenced_placeholder; copied from the sibling (30 s)', sourced: no, value: 30.0}
    tau_cA_max: {reference: 'unreferenced_placeholder; copied from the sibling (105 s)', sourced: no, value: 105.0}
    tau_cf_min: {reference: 'unreferenced_placeholder; copied from the sibling (35 s)', sourced: no, value: 35.0}
    tau_cf_max: {reference: 'unreferenced_placeholder; copied from the sibling (400 s)', sourced: no, value: 400.0}
    u_CO2_c_thresh: {reference: 'unreferenced_placeholder; copied from the sibling (41.98, "from_ICUHealthy" calibration)',
      sourced: no, value: 41.978}
    Delta_RR_resp_max: {reference: 'unreferenced_placeholder; copied from the sibling (0.75 /s)', sourced: no, value: 0.75}
    Delta_RR_resp_min: {reference: 'unreferenced_placeholder; copied from the sibling (-0.15 /s)', sourced: no, value: -0.15}
    alpha_P_mus_max: {reference: 'unreferenced_placeholder; muscle pressure may at most triple (3)', sourced: no, value: 3.0}
    alpha_P_mus_min: {reference: 'unreferenced_placeholder; muscle pressure may fall to 20 % (0.2)', sourced: no, value: 0.2}
  validation:
    baseline: {status: pending, reason: 'Candidate: ventilatory (rate and effort) response to a hypercapnic step; needs the
        respiratory network and real parameter values first.'}
    calibrate: {status: pending, reason: 'see baseline'}

