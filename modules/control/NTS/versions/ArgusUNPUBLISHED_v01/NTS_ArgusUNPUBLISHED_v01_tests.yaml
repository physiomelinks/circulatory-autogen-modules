notes: 'Nucleus tractus solitarius neuronal subtypes (Gee 2023 eq. 3, from Park 2020): one sigmoid per afferent input, f =
  (f_min - f_max)/(1 + (f_in/f_mid)^k) + f_max, rising from f_min (zero input) to f_max. The chemoreceptor (ch) subtype is
  an addition of this library (hand-tuned, not in Gee 2023). Algebraic.'
