module: BVC_Na_circ
reviewed: false
known_issues: []
defaults:
  sim_time: 10.0
  pre_time: 0.0
  dt: 0.01
  solver: CVODE_myokit
  solver_info:
    rtol: 1.0e-08
    atol: 1.0e-12
  bc_sweep:
    factors:
    - 0.5
    - 0.75
    - 1.0
    - 1.5
    - 2.0
    ranges:
      q_vc_Na_init:
        min: 0.001
        max: 1.0
        points: 5
        scale: log
      v_giEpi_NKE:
        min: -0.001
        max: 0.001
        points: 5
      v_lptEpi_NKE:
        min: -0.005
        max: 0.005
        points: 5
      v_rptEpi_NKE:
        min: -0.005
        max: 0.005
        points: 5
      v_lgl_Na:
        min: 0
        max: 0.005
        points: 5
      v_rgl_Na:
        min: 0
        max: 0.005
        points: 5
    rationale: Na_circ is a pure integrator, so any finite constant fluxes work; the ranges span the magnitudes the fluxes
      take in the source model (glomerular Na flux about 3.5e-3 mol/s per kidney with kK_gl_Na = 1 /s; NKE fluxes of either
      sign, since the simplified NKE runs backwards when the gradients reverse), and q_vc_Na_init spans 1 mmol to 1 mol (source-model
      value 11.5 mmol; a physiological extracellular Na pool is about 2 mol). q_vc_Na may become negative for draining fluxes
      over long runs; that is not claimed as an invariant because the component itself has no positivity constraint.
  timestep:
    scheme: rk4
    dts:
    - 0.04
    - 0.02
    - 0.01
    - 0.005
    min_order: 0.8
    tol: 0.0001
    cvode_tol: 0.001
    t_end: 10.0
  stability:
    supported:
    - solver: CVODE_myokit
      rtol: 1.0e-06
      atol: 1.0e-08
components:
- vessel_type: BVC_Na_circ
  BC_type: nn
  module_type: BVC_Na_circ_main_type
  outputs:
  - q_vc_Na
  invariants:
  - description: 'exact solution: q_vc_Na = q_vc_Na_init + (v_giEpi_NKE + v_lptEpi_NKE + v_rptEpi_NKE - v_lgl_Na - v_rgl_Na)
      t (sodium mass balance of the circulation)'
    expr: np.max(np.abs(q_vc_Na - (q_vc_Na_init + (v_giEpi_NKE + v_lptEpi_NKE + v_rptEpi_NKE - v_lgl_Na - v_rgl_Na)*t))) <=
      1e-9*max(1.0e-3, np.max(np.abs(q_vc_Na)))
  notes: 'Circulating (extracellular/blood) sodium pool of the blood-volume-control (BVC) system: dq_vc_Na/dt = v_giEpi_NKE
    + v_lptEpi_NKE + v_rptEpi_NKE - v_lgl_Na - v_rgl_Na. It gains the Na pumped out of the gut and proximal-tubule epithelia
    by the Na/K-ATPase (NKE) and loses the Na filtered at the two glomeruli; it exports q_vc_Na to BVC_GI and both BVC_Kidney
    components. Alone, with constant fluxes, the exact solution is linear in t. The nominal fluxes are test values (net +1.16e-6
    mol/s, the GI Na intake of the source model); in a network they are supplied by the GI and kidney components.'
  run_parameters:
    v_giEpi_NKE: 1.16e-06
    v_lptEpi_NKE: 0.0037
    v_rptEpi_NKE: 0.0037
    v_lgl_Na: 0.0038
    v_rgl_Na: 0.0036
  validation:
    baseline:
      status: not_applicable
      reason: a pure sodium integrator (mass balance) with no physiological counterpart on its own; it is verified against
        its exact solution. Whole-body sodium-balance data (e.g. plasma Na with changes in intake) belong to a network using
        BVC_GI, BVC_Kidney and BVC_Na_circ together.
    calibrate:
      status: not_applicable
      reason: 'no free rate parameters: the only constant is the initial Na content, which is an initial condition, not a
        behaviour to calibrate.'
  reference_proposals:
    q_vc_Na_init:
      reference: unreferenced_placeholder; 0.0114979848860844 mol from P. Hunter's unpublished BVC parameter set (CA_user_volume_control
        ANS_CVS_BVC_parameters.csv, "Peter_Hunter"); it is a steady state of that toy model, not a measured Na pool (about
        2 mol for 14 L of extracellular fluid at 140 mM)
      sourced: false
      value: 0.0114979848860844
    v_giEpi_NKE:
      reference: unreferenced_placeholder; test value 1.16e-6 mol/s (about 100 mmol/day, the GI Na intake of the source parameter
        set); supplied by BVC_GI in a network
      sourced: false
      value: 1.16e-06
    v_lptEpi_NKE:
      reference: unreferenced_placeholder; test value, of the order of the source model's proximal-tubule NKE flux (3.7e-3
        mol/s); supplied by BVC_Kidney_left in a network
      sourced: false
      value: 0.0037
    v_rptEpi_NKE:
      reference: unreferenced_placeholder; test value (see v_lptEpi_NKE); supplied by BVC_Kidney_right in a network
      sourced: false
      value: 0.0037
    v_lgl_Na:
      reference: unreferenced_placeholder; test value equal to v_lptEpi_NKE (steady state of a kidney); supplied by BVC_Kidney_left
        in a network
      sourced: false
      value: 0.0037
    v_rgl_Na:
      reference: unreferenced_placeholder; test value equal to v_rptEpi_NKE; supplied by BVC_Kidney_right in a network
      sourced: false
      value: 0.0037
review:
  summary: 'Circulating Na pool of the blood-volume-control system: a pure integrator of the NKE fluxes from gut and both
    proximal tubules minus the two glomerular filtration fluxes. All 6 parameters were TODO; q_vc_Na_init proposed from P.
    Hunter''s unpublished parameter set, the five flux BCs as test values (they are supplied by BVC_GI / BVC_Kidney in a network).
    Verified against its exact linear solution across the flux ranges; all tests pass.'
  comment: The module is a trivially correct integrator; the questions are about what q_vc_Na means. It is the whole-circulation
    Na, but BVC_GI and BVC_Kidney divide it by the volume of their local capillary (osmotic_vol_port), so each organ sees
    a different blood Na concentration. q_vc_Na_init = 11.5 mmol is a toy-model value (a physiological extracellular Na pool
    is about 2 mol).
  questions:
  - 'q_vc_Na_init = 0.0115 mol (P. Hunter''s unpublished set, a steady state of that toy model): keep as an unreferenced placeholder,
    or re-derive it (extracellular Na is about 140 mM x 14 L = 2 mol)?'
  - 'In a network, c_vc_Na = q_vc_Na/q_vc_W divides the whole-circulation Na (BVC_Na_circ) by the volume of the LOCAL capillary
    that supplies osmotic_vol_port (intestinal or peritubular), so the GI and each kidney see different blood Na concentrations
    (source values: 146 mM at the gut, 55 mM at the kidneys for the same q_vc_Na). Should q_vc_W be the circulating (plasma)
    volume instead?'
  - 'The GI flux port is not multi_port while the kidney ports are: intended (a single gut)?'
  - 'Validation not_applicable (pure mass balance, verified exactly): agree?'
  proposed_fixes: []
  findings:
  - Exact solution q_vc_Na = q_vc_Na_init + (sum of inflows - outflows) t holds to 1e-9 relative over 5 values of each flux
    (including negative NKE fluxes, which the simplified NKE produces when it runs backwards) and q_vc_Na_init from 1 mmol
    to 1 mol.
  - 'Joint failure risk (512 samples): P(fail) = 0.000 [0.000, 0.007].'
