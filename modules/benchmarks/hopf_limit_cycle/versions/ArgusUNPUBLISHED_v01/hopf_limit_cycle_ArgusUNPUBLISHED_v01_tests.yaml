module_type: hopf_limit_cycle
version: ArgusUNPUBLISHED_v01
reviewed: false
notes: "A limit-cycle oscillator in Cartesian coordinates, cubic right-hand side: r2 = x^2 + y^2, thdot = w (1 + beta (r2 - 1) + gamma z), x' = a x (1 - r2) - thdot y, y' = a y (1 - r2) + thdot x, z' = -lam z + c z^2 - d z^3 + kappa (r2 - 1); r2 and z2 = z^2 are the lift variables. rhs_reference holds reference right-hand-side values at 20 points, which verification_test_rhs checks to 1e-12. Inputs a run schedule varies per run or beat are parameters; forcings in time are written in the CellML. Zero matrix entries are left out of the equations."
