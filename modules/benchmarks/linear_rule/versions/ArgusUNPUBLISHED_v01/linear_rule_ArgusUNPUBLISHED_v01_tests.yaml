notes: "Linear and autonomous, with the beat length set by the state: dx/dt = A x + f0, and T_next = Tbar (1 + kappa c.(x - xbar)), the length of a beat starting at x. rhs_reference holds reference right-hand-side values at 20 points, which verification_test_rhs checks to 1e-12. Inputs a run schedule varies per run or beat are parameters; forcings in time are written in the CellML. Zero matrix entries are left out of the equations."
