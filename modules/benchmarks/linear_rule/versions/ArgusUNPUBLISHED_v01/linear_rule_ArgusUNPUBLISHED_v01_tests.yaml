notes: "QPoPInf paper test 2: linear and autonomous, with the beat length set by the state: dx/dt = A x + f0, and T_next = Tbar (1 + kappa c.(x - xbar)), the length of a beat starting at x. Written from the paper harness (small_step_compare.py sys_linear_rule at cf7b1cd); rhs_reference holds the harness's right-hand side at 20 points, which verification_test_rhs checks to 1e-12. Inputs the rom run schedule varies per run or beat are parameters; forcings in time are written in the CellML. Zero matrix entries are left out of the equations."
