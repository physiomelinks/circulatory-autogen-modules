module_type: quadratic_oscillator
version: ArgusUNPUBLISHED_v01
reviewed: false
notes: "A damped linear oscillator y driving z quadratically, z fed back into y1 by back: y1' = -0.1 y1 - w y2 + back z y2, y2' = w y1 - 0.1 y2, z' = -z + y1^2 + y1 y2; parameterisation default has back = 0, back_coupled has back = 0.5. rhs_reference holds reference right-hand-side values at 20 points, which verification_test_rhs checks to 1e-12. Inputs a run schedule varies per run or beat are parameters; forcings in time are written in the CellML. Zero matrix entries are left out of the equations."
