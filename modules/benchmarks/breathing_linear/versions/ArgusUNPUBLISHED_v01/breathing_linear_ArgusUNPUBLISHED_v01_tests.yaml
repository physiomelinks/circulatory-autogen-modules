notes: "QPoPInf paper test 6: test 1's system without inputs, forced by breathing with a second harmonic: dx/dt = (A0 + A1 cos theta) x + g sin theta + br (cos ph + h2 cos(2 ph + psi2)), ph = 2 pi t / T_r + phi0; cos ph, sin ph, cos 2ph and sin 2ph are the forcing features. Written from the paper harness (small_step_compare.py sys_breathing at cf7b1cd); rhs_reference holds the harness's right-hand side at 20 points, which verification_test_rhs checks to 1e-12. Inputs the rom run schedule varies per run or beat are parameters; forcings in time are written in the CellML. Zero matrix entries are left out of the equations."
