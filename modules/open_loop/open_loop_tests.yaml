module: open_loop
reviewed: false
known_issues: []
defaults:
  sim_time: 2.0
  pre_time: 0.0
  dt: 0.01
  solver: CVODE_myokit
  bc_sweep:
    factors: [0.5, 0.75, 1.0, 1.5, 2.0]
    ranges: {}
  timestep:
    scheme: rk4
    dts: [0.004, 0.002, 0.001, 0.0005]
    min_order: 0.8
    tol: 0.0001
    cvode_tol: 0.001
  stability:
    supported:
    - {solver: CVODE_myokit, rtol: 1.0e-06, atol: 1.0e-08}
components:
- vessel_type: inlet_flow
  BC_type: nn_adan
  module_type: adan_flow_fourier_BC_type
  outputs: [v]
  invariants: []
  validation:
    baseline: {status: pending, reason: validation data not chosen yet}
    calibrate: {status: pending, reason: validation data not chosen yet}
- vessel_type: inlet_flow
  BC_type: nn_adan_2
  module_type: adan_flow_interp_BC_type
  outputs: [v]
  invariants: []
  validation:
    baseline: {status: pending, reason: validation data not chosen yet}
    calibrate: {status: pending, reason: validation data not chosen yet}
- vessel_type: inlet_flow
  BC_type: nn_aorticbif
  module_type: aorticbif_flow_BC_type
  outputs: [v]
  invariants: []
  validation:
    baseline: {status: pending, reason: validation data not chosen yet}
    calibrate: {status: pending, reason: validation data not chosen yet}
- vessel_type: terminalOL
  BC_type: pp_controller
  module_type: controller_OL_type
  outputs: [u, u_C, v, v_T, q, R_T]
  invariants: []
  validation:
    baseline: {status: pending, reason: validation data not chosen yet}
    calibrate: {status: pending, reason: validation data not chosen yet}
- vessel_type: terminalOL
  BC_type: pp_wFB
  module_type: pp_T_OL_wFB_type
  outputs: [u, u_C, v, v_T, q, R_T]
  invariants: []
  validation:
    baseline: {status: pending, reason: validation data not chosen yet}
    calibrate: {status: pending, reason: validation data not chosen yet}
