module_type: material_prop_const_ven
version: Olufsen2000_v01
reviewed: false
notes: 'Venous (collapsible-tube) stiffness from wall bending: K_tube = E (h/r0)³ / (12 (1 − ν²)) (the shapiro1977steady thin-shell
  law used in muller2014global-type venous tube laws). Note that with h/r0 = 0.05 and E ~ 1 MPa this gives K ≈ 15 Pa, far softer
  than the c0-based venous K (≈ 200-1500 Pa for c0 = 1.5-4 m/s).'
reference_proposals:
