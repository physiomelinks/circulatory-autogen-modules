module_type: material_prop_const_ven
version: nn
reviewed: false
notes: 'Venous (collapsible-tube) stiffness from wall bending: K_tube = E (h/r0)³ / (12 (1 − ν²)) (the Shapiro1977 thin-shell
  law used in Muller2014-type venous tube laws). Note that with h/r0 = 0.05 and E ~ 1 MPa this gives K ≈ 15 Pa, far softer
  than the c0-based venous K (≈ 200-1500 Pa for c0 = 1.5-4 m/s).'
reference_proposals:
  hr_ratio:
    reference: Toro2022; venous wall thickness h0 = 5% of r0 (h/r0 = 0.05, citing Blanco2015)
    sourced: 'yes'
    value: 0.05
  E:
    reference: 'Petrova2025; Table 1: human great saphenous vein circumferential initial Young modulus 1.15 +- 0.84 MPa (0-0.5
      kPa stress); basilic vein 2.13 +- 3.10 MPa. Peripheral veins, strongly nonlinear; no human vena-cava value found'
    sourced: 'yes'
    value: 1150000.0
  nu:
    reference: 'Alastruey2011; Eq. (3): Poisson ratio sigma = 0.5 (incompressible wall); gives K = E h / ((1 - nu^2) r0) =
      4Eh/(3r0), Eq. (4)'
    sourced: 'yes'
review: reviews/vessel_properties_review.yaml
review_scope: The review of the whole vessel_properties module (8 entries) before the move to versions; only the parts about
  this version apply.
