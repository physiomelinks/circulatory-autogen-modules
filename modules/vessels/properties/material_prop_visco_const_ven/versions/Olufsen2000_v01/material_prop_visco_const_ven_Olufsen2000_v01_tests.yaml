reference_proposals:
  l:
    reference: 'unreferenced_placeholder; test segment length 5 cm. Only a test value: l is supplied by the connected vessel'
    sourced: 'no'
    value: 0.05
  r_0:
    reference: 'unreferenced_placeholder; test radius of a medium vein (5 mm), inside the [r0_min, r0_max] = [0.8, 8] mm range
      of toro2022cerebrospinal Eq. (85). Only a test value: r_0 is supplied by the connected vessel'
    sourced: 'no'
    value: 0.005
  hr_ratio:
    reference: toro2022cerebrospinal; venous wall thickness h0 = 5% of r0 (h/r0 = 0.05, citing blanco2015anatomically)
    sourced: 'yes'
    value: 0.05
  E:
    reference: 'petrova2025nonlinear; Table 1: human great saphenous vein circumferential initial Young modulus 1.15 +- 0.84 MPa (0-0.5
      kPa stress); basilic vein 2.13 +- 3.10 MPa. Peripheral veins, strongly nonlinear; no human vena-cava value found'
    sourced: 'yes'
    value: 1150000.0
  K_m:
    reference: 'toro2022cerebrospinal; Sec. 2.1.1: venous viscoelastic parameter K_M = 5e4 dyn s/cm^2 = 5e3 Pa s'
    sourced: 'yes'
    value: 5000
  nu:
    reference: 'alastruey2011pulse; Eq. (3): Poisson ratio sigma = 0.5 (incompressible wall); gives K = E h / ((1 - nu^2) r0) =
      4Eh/(3r0), Eq. (4)'
    sourced: 'yes'
  SMvolfrac_ven:
    reference: 'toro2022cerebrospinal; Sec. 2.1.1: smooth-muscle volume fraction 8% for veins'
    sourced: 'yes'
    value: 0.08
review: reviews/vessel_properties_review.yaml
review_scope: The review of the whole vessel_properties module (8 entries) before the move to versions; only the parts about
  this version apply.
