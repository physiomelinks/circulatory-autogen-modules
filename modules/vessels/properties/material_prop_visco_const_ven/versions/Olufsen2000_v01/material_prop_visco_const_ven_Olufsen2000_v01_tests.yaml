module_type: material_prop_visco_const_ven
version: Olufsen2000_v01
reviewed: false
notes: 'material_prop_const_ven plus K_tube_visco = (2/3) Γ h/(l π r0³) with Γ = SMvolfrac_ven K_m. The equation uses h, which
  the component never defines (it has hr_ratio, so h = hr_ratio r0 is presumably intended). See review.proposed_fixes: as
  written the CellML does not generate.'
expected_failures:
  run_test: 'CellML defect: K_tube_visco uses h, which is not declared or computed in material_prop_visco_const_ven_type (model
    rejected: "ci element h does not correspond with any variable"). In a patched copy with h = hr_ratio r_0 every verification
    test passes.'
  verification_test_invariants: 'CellML defect: K_tube_visco uses h, which is not declared or computed in material_prop_visco_const_ven_type
    (model rejected: "ci element h does not correspond with any variable"). In a patched copy with h = hr_ratio r_0 every
    verification test passes.'
  verification_test_BC: 'CellML defect: K_tube_visco uses h, which is not declared or computed in material_prop_visco_const_ven_type
    (model rejected: "ci element h does not correspond with any variable"). In a patched copy with h = hr_ratio r_0 every
    verification test passes.'
  verification_test_timestep: 'CellML defect: K_tube_visco uses h, which is not declared or computed in material_prop_visco_const_ven_type
    (model rejected: "ci element h does not correspond with any variable"). In a patched copy with h = hr_ratio r_0 every
    verification test passes.'
  stability_test: 'CellML defect: K_tube_visco uses h, which is not declared or computed in material_prop_visco_const_ven_type
    (model rejected: "ci element h does not correspond with any variable"). In a patched copy with h = hr_ratio r_0 every
