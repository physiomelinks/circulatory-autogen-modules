module_type: material_prop_visco_fromPWV
version: Olufsen2000_v01
reviewed: false
notes: 'material_prop_fromPWV plus the lumped visco-elastic coefficient K_tube_visco = (2/3) Γ h/(l π r0³). The equation uses
  a wall thickness h that the component never defines or imports. See review.proposed_fixes: as written the CellML does not
  generate.'
expected_failures:
  run_test: 'CellML defect: K_tube_visco uses h, which is not declared or computed in material_prop_visco_fromPWV_type, so
    libcellml/Myokit reject the model ("ci element h does not correspond with any variable"). In a patched copy (h = r0 (a
    e^{b r0} + c e^{d r0}) as in material_prop_visco_const, with a..d_vessel added to the config) every verification test
    passes.'
  verification_test_invariants: 'CellML defect: K_tube_visco uses h, which is not declared or computed in material_prop_visco_fromPWV_type,
    so libcellml/Myokit reject the model ("ci element h does not correspond with any variable"). In a patched copy (h = r0
    (a e^{b r0} + c e^{d r0}) as in material_prop_visco_const, with a..d_vessel added to the config) every verification test
    passes.'
  verification_test_BC: 'CellML defect: K_tube_visco uses h, which is not declared or computed in material_prop_visco_fromPWV_type,
    so libcellml/Myokit reject the model ("ci element h does not correspond with any variable"). In a patched copy (h = r0
    (a e^{b r0} + c e^{d r0}) as in material_prop_visco_const, with a..d_vessel added to the config) every verification test
    passes.'
  verification_test_timestep: 'CellML defect: K_tube_visco uses h, which is not declared or computed in material_prop_visco_fromPWV_type,
    so libcellml/Myokit reject the model ("ci element h does not correspond with any variable"). In a patched copy (h = r0
