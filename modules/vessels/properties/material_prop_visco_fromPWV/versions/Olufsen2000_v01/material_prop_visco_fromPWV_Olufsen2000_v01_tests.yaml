  stability_test: 'CellML defect: K_tube_visco uses h, which is not declared or computed in material_prop_visco_fromPWV_type,
    so libcellml/Myokit reject the model ("ci element h does not correspond with any variable"). In a patched copy (h = r0
    (a e^{b r0} + c e^{d r0}) as in material_prop_visco_const, with a..d_vessel added to the config) every verification test
    passes.'
reference_proposals:
  l:
    reference: 'circulatory_autogen; ADAN-86 ascending aorta (segment 1) length used in cvs_model_with_arm_0d (ADAN_86); not
      checkable in the papers. Only a test value: l is supplied by the connected vessel'
    sourced: 'no'
    value: 0.0153234
  r_0:
    reference: 'circulatory_autogen; ADAN-86 ascending aorta (segment 1) radius used in cvs_model_with_arm_0d (ADAN_86, from
      Safaei2016 / Blanco2015 geometry); the per-vessel value is not printed in those papers. Only a test value: r_0 is supplied
      by the connected vessel'
    sourced: 'no'
    value: 0.015642
  K_m:
    reference: 'Toro2022; Sec. 2.1.1: arterial viscoelastic parameter K_M = 3e5 dyn s/cm^2 = 3e4 Pa s'
    sourced: 'yes'
    value: 30000
  m_tube:
    reference: 'Toro2022; Eqs. (2)-(5): tube-law exponents m = 0.5, n = 0 for arteries'
    sourced: 'yes'
    value: 0.5
  n_tube:
    reference: 'Toro2022; Eqs. (2)-(5): tube-law exponents m = 0.5, n = 0 for arteries'
    sourced: 'yes'
    value: 0.0
  rho:
    reference: Trudnowski1974; whole-blood specific gravity 1.0506 at 37 C (n = 25) = 1050.6 kg/m^3 (abstract values read
      via a search rendering, full text not read). 1050 is also used by Alastruey2011; Toro2022 use 1060
    sourced: 'yes'
    value: 1050
    note: (proposed for the vessel_properties global rho under material_prop_fromPWV/Olufsen2000_v01)
  k_1:
    reference: 'Toro2022; Eq. (84) (after Olufsen1999): k1 = 3e6 g s^-2 cm^-1 = 3e5 Pa. Olufsen2000 values (2e7 g s^-2 cm^-1
      = 2e6 Pa, via Duanmu et al. 2019) give a stiffer aorta (c0 7.4 vs 5.0 m/s)'
    sourced: 'yes'
    value: 300000.0
    note: (proposed for the vessel_properties global k_1 under material_prop_fromPWV/Olufsen2000_v01)
  k_2:
    reference: 'Toro2022; Eq. (84): k2 = -7 cm^-1 = -700 m^-1 (Olufsen2000: -22.53 cm^-1, secondary)'
    sourced: 'yes'
    value: -700.0
    note: (proposed for the vessel_properties global k_2 under material_prop_fromPWV/Olufsen2000_v01)
  k_3:
    reference: 'Toro2022; Eq. (84): k3 = 40e4 g s^-2 cm^-1 = 4e4 Pa (Olufsen2000: 8.65e5 g s^-2 cm^-1 = 8.65e4 Pa, secondary)'
    sourced: 'yes'
    value: 40000.0
    note: (proposed for the vessel_properties global k_3 under material_prop_fromPWV/Olufsen2000_v01)
review: reviews/vessel_properties_review.yaml
review_scope: The review of the whole vessel_properties module (8 entries) before the move to versions; only the parts about
  this version apply.
