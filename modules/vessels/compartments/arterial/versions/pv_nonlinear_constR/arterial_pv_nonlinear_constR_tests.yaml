    the library the component generates and all its tests pass (see review.proposed_fixes)'
  verification_test_invariants: 'libcuflynx exits during generation: "the port variable r is not a variable for vessel type
    ..., BC_type: ..._nonlinear_constR" (the radius_0_and_s_port exit port lists r, which constR types do not have). With
