module_type: arterial
version: pv_nonlinear_constR
reviewed: false
notes: 'pv vessel with a nonlinear tube law. Jacobian timescales (nominal: fastest 4e-05 s, slowest decay 9.6e-05 s; run:
  fastest 0.002 s, slowest decay 15 s, shortest oscillation period 0.013 s).'
known_issues:
- port variable r not in variables_and_units
