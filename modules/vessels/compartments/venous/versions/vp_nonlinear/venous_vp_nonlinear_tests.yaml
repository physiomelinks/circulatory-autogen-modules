module_type: venous
version: vp_nonlinear
reviewed: false
notes: 'vp vessel with a nonlinear tube law. Jacobian timescales (nominal: fastest 1.3e-05 s, slowest decay 7 s; run: fastest
  0.14 s, slowest decay 9.4 s, shortest oscillation period 0.91 s).'
reference_proposals:
  K_tube:
    reference: unreferenced_placeholder; venous collapsible-tube stiffness K = E/(12(1-nu^2)) (h/r)^3 (vessel_properties material_prop_const_ven
      formula); order of magnitude 10 Pa for thin-walled veins; supplied by a vessel_properties module when connected
    sourced: 'no'
    value: 10.0
  m_tube:
    reference: Muller2014; venous tube law exponents m = 10, n = -3/2 (primary text not accessible; confirmed in secondary
      sources citing it, e.g. Muller et al. 2023 Front Physiol 14:1162391; the exponents are usually attributed to Shapiro-type
      collapsible-tube laws, origin not verified)
    sourced: 'yes'
    value: 10.0
  n_tube:
    reference: Muller2014; venous tube law exponents m = 10, n = -3/2 (primary text not accessible; confirmed in secondary
      sources citing it, e.g. Muller et al. 2023 Front Physiol 14:1162391; the exponents are usually attributed to Shapiro-type
      collapsible-tube laws, origin not verified)
    sourced: 'yes'
    value: -1.5
  l:
    reference: unreferenced_placeholder; large-vein geometry (l = 0.1 m), order of magnitude only
    sourced: 'no'
    value: 0.1
  r_0:
    reference: unreferenced_placeholder; large-vein geometry (r_0 = 0.01 m), order of magnitude only
    sourced: 'no'
    value: 0.01
  u_0:
    reference: unreferenced_placeholder; reference pressure of the venous tube law taken as 0 Pa (transmural)
    sourced: 'no'
    value: 0.0
  u_ext:
    reference: definitional; external (transmural reference) pressure taken as 0 Pa gauge when the module is used alone
    sourced: definitional
    value: 0.0
  u_out:
    reference: unreferenced_placeholder; boundary condition supplied by the connected neighbour in a network; test value 0
      Pa (0 mmHg), typical outlet pressure for this vessel class
    sourced: 'no'
    value: 0.0
  v_in:
    reference: unreferenced_placeholder; boundary condition supplied by the connected neighbour in a network; test value 6.28319e-05
      m^3/s
    sourced: 'no'
    value: 6.28319e-05
  theta:
    reference: definitional; inclination angle in degrees, only used when beta_g = 1 (the momentum equation has beta_g rho
      g l cos(theta)); 90 = horizontal, as for most siblings in this file
    sourced: definitional
    value: 90.0
  I_scale:
    reference: definitional; no scaling of the inertance I = rho l/(pi r0^2)
    sourced: definitional
    value: 1.0
  beta_g:
    reference: definitional; gravity switch in beta_g rho g l cos(theta) (0 = off, as in the circulatory_autogen models; 1
      = on). Library value 1 is a test_fft fixture value
    sourced: definitional
    value: 0.0
  rho:
    reference: Boileau2015; Table II, blood mass density 1050 kg m^-3 (Safaei2018 Sec. 2.2.4 uses 1040). Library value 1 is
      a test_fft fixture value
    sourced: 'yes'
    value: 1050.0
    also_cites:
    - Safaei2018
  mu:
    reference: Boileau2015; Table II, blood viscosity 4 mPa s = 0.004 Pa s (also Safaei2018 Sec. 2.2.4). Library value 1 is
      a test_fft fixture value
    sourced: 'yes'
    value: 0.004
    also_cites:
    - Safaei2018
  g:
    reference: definitional; standard gravity 9.81 m s^-2 (library value 1 is a test_fft fixture value)
    sourced: definitional
    value: 9.81
  R_flag:
    reference: definitional; switch for the viscous (Poiseuille) resistance, 1 = on
    sourced: definitional
review: reviews/BG_review.yaml
review_scope: The review of the whole BG module (116 entries) before the move to versions; only the parts about this version
  apply.
