notes: 'Pressure-in / flow-out RC compartment without inertance (SI (m3, Pa)): dq/dt = v - v_out, v = (u_in - u)/R, u = u_0
  + (q - q_0)/C. Linear first order; alone with constant BCs the exact solution relaxes with time constant RC. Duplicate of
  the litre/kPa component with SI units.'
