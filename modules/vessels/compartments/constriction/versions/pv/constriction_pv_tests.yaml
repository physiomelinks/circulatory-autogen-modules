notes: 'Single resistive-compliant segment with geometry-derived R (Poiseuille) and C (thin wall, wall thickness from the
  global a-d fit); flows are algebraic (no inertance). Jacobian timescales (nominal: fastest 0.0005 s, slowest decay 0.0005
  s; run: fastest 1e-05 s, slowest decay 1e-05 s).'
