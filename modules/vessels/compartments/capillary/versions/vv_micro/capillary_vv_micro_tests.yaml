module_type: capillary
version: vv_micro
reviewed: false
notes: 'capillary (vv) entry of this config that points at the BG library type vv_simple_type (defined in modules/BG, resolved
  because libcuflynx merges the whole library). That type has an inertance I (dv/dt = (Δu - R v)/I) and a viscoelastic term
  R_v = 0.01/C, but this config entry does not declare I, so the generated model leaves I unset (Myokit: "No value set for
  I", I = 0 -> division by zero) and the component cannot run. Geometry-free (R, C, q_0 given directly). Invariants (volume
  balance, pressure law) verified on a patched copy with I declared. After that fix the entry is still extremely stiff: I/R
  ~ 5.2e-07 s (with I = rho l/(pi r^2)) against a relaxation time (R + 0.01/C) C ~ 0.15 s, so explicit fixed-step schemes
  (timestep test) are not practical; the _micro types (no inertance) are the natural choice for microvessels.'
expected_failures:
  run_test: 'module defect: this config entry uses the BG type vv_simple_type which has an inertance I (dv/dt = (du - R v)/I),
    but the entry does not declare I in variables_and_units, so the generated model leaves I unset (Myokit: "No value set
    for I"; I = 0 -> division by zero at t = 0). Verified: adding ["I", "Js2_per_m6", "access", "constant"] to the entry in
    a patched copy makes it generate and run. See review.proposed_fixes.'
  verification_test_invariants: 'module defect: this config entry uses the BG type vv_simple_type which has an inertance I
