notes: 'Flow through a conductance: v = G_wCont (u_in - u_out), G_wCont = G/(1 + Delta_R). Written as conductance x pressure difference, so with Delta_R constant a product with another state stays polynomial. Delta_R is the fractional increase of the resistance 1/G (0 at rest) from the resistance_delta_port, the port the terminals and the resistance drug combiner use (resistance R (1 + Delta_R)). The flow is also on a flow_port (multi) for gas-exchange modules downstream.'
