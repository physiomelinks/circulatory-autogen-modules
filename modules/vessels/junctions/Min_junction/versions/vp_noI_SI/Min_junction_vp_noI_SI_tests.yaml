module_type: Min_junction
version: vp_noI_SI
reviewed: false
notes: 'Flow-in / pressure-out RC compartment without inertance (SI (m3, Pa)): dq/dt = v_in_sum - v, v = (u - u_out)/R, u
  = u_0 + (q - q_0)/C. Linear first order with time constant RC. Junction variant: the inflow/outflow is the sum over several
  neighbours (a single constant alone). Duplicate of the litre/kPa component with SI units. Tested in a harness (a1 + a2 ->
  mod): libcuflynx builds a junction only between real vessels, so the neighbours are "simple_2" vp_noI (upstream, constant
  inflow at their open inlet) / pv_noI (downstream, constant outflow at their open outlet) compartments with the same R and
  C. The neighbours are dynamic, so the checks are the port sums, the Ohm and P-V laws, and mass balance rather than the single-compartment
  exact solution.'
