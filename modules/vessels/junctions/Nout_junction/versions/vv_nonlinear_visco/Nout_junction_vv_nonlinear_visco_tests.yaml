module_type: Nout_junction
version: vv_nonlinear_visco
reviewed: false
notes: 'vv vessel with a nonlinear tube law. Tested in a harness network (libcuflynx sums the flows at a Min/Nout node only
  when real vessels are connected there): mod (Nout_junction vv_nonlinear_visco); bcin (inlet_flow constant); dn1 (arterial_simple
  pv); bcout1 (outlet_flow constant); dn2 (arterial_simple pv); bcout2 (outlet_flow constant). Jacobian timescales (nominal:
  fastest 2.1e-05 s, slowest decay 0.01 s, shortest oscillation period 0.01 s; run: fastest 0.001 s, slowest decay 0.062 s,
  shortest oscillation period 0.011 s).'
expected_failures:
  verification_test_invariants: 'the stated viscoelastic law is not implemented: vv_Min/Nout/MinNout_nonlinear_visco_type
    declare K_tube_visco but their pressure equations omit the 2 K_visco (inflow - v) / (v - outflow) terms that the other
    *_nonlinear_visco types have, so u = u_0 + K((q_p/q0_2)^m - (q_p/q0_2)^n) + u_ext exactly and the visco invariant fails
    (see review.proposed_fixes)'
  verification_test_BC: 'the stated viscoelastic law is not implemented: vv_Min/Nout/MinNout_nonlinear_visco_type declare
    K_tube_visco but their pressure equations omit the 2 K_visco (inflow - v) / (v - outflow) terms that the other *_nonlinear_visco
    types have, so u = u_0 + K((q_p/q0_2)^m - (q_p/q0_2)^n) + u_ext exactly and the visco invariant fails (see review.proposed_fixes)'
