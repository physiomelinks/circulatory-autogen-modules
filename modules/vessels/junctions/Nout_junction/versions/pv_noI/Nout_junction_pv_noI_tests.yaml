module_type: Nout_junction
version: pv_noI
reviewed: false
notes: 'Pressure-in / flow-out RC compartment without inertance (litre / kPa): dq/dt = v - v_out_sum, v = (u_in - u)/R, u
  = u_0 + (q - q_0)/C. Linear first order; alone with constant BCs the exact solution relaxes with time constant RC. Junction
  variant: the inflow/outflow is the sum over several neighbours (a single constant alone). Tested in a harness (mod -> b1
  + b2): libcuflynx builds a junction only between real vessels, so the neighbours are "simple" vp_noI (upstream, constant
  inflow at their open inlet) / pv_noI (downstream, constant outflow at their open outlet) compartments with the same R and
  C. The neighbours are dynamic, so the checks are the port sums, the Ohm and P-V laws, and mass balance rather than the single-compartment
  exact solution.'
