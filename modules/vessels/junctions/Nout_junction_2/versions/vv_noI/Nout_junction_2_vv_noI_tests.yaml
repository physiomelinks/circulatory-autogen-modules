module_type: Nout_junction_2
version: vv_noI
reviewed: false
notes: 'Pure compliance (SI (m3, Pa)): dq/dt = v_in - v_out_sum, u = u_d = u_0 + (q - q_0)/C. With constant flows the volume
  changes linearly (exact). Junction variant: the inflow/outflow is the sum over several neighbours (a single constant alone).
  Duplicate of the litre/kPa component with SI units. Tested in a harness (mod -> b1 + b2): libcuflynx builds a junction only
  between real vessels, so the neighbours are "simple_2" vp_noI (upstream, constant inflow at their open inlet) / pv_noI (downstream,
  constant outflow at their open outlet) compartments with the same R and C. The neighbours are dynamic, so the checks are
  the port sums, the Ohm and P-V laws, and mass balance rather than the single-compartment exact solution.'
