module_type: venule
version: pv_micro_noI_visco
reviewed: false
notes: 'venule (pv) pv_micro without its inertance: the same geometry-free component (R, C, q_0 given directly) with the viscoelastic
  term R_v = 0.01/C, the same ports and parameter values, and the flows algebraic. They are the I -> 0 limit of pv_micro''s
  flow equations, solved explicitly (v = (u_in - (u_0 + u_C + u_ext) + R_v*v_out)/(R + R_v)); the invariants check the original''s
  flow laws with I = 0. Derived from venule/pv_micro, whose parameter sources and references it shares (not yet reviewed itself).'
reference_proposals:
  R:
    reference: 'unreferenced_placeholder; derived for the test from the proposed venule geometry: R = 8 mu l/(pi r_0^4) (Poiseuille,
      mu = 0.004 Pa s). In a network this is set per vessel (value in Pa_s_per_uL; 9082000000000.0 Js_per_m6)'
    sourced: 'no'
    value: 9082.0
  C:
    reference: 'unreferenced_placeholder; derived for the test from the proposed venule geometry: C = 2 pi r_0^3 l/(E h),
      h from the watanabe2013mathematical fit (value in uL_per_Pa; 2.851e-17 m6_per_J)'
    sourced: 'no'
    value: 2.851e-08
  q_0:
    reference: 'unreferenced_placeholder; derived for the test: q_0 = pi r_0^2 l for the proposed venule geometry (value in
      uL; 1.052e-13 m3)'
    sourced: 'no'
    value: 0.0001052
  u_ext:
    reference: definitional; no external (tissue) pressure acting on the vessel in the isolated test (0 Pa); in a network
      this is the surrounding tissue pressure
    sourced: definitional
    value: 0.0
  u_0:
    reference: boas2008vascular; PV = 25 mmHg for the 35 um venule (model boundary condition) = 3.33 kPa
    sourced: 'yes'
    value: 3330.0
  u_in:
    reference: unreferenced_placeholder; isolated-test boundary value (u_0 + 500 Pa); in a network it is supplied by the neighbouring
      vessel
    sourced: 'no'
    value: 3830.0
  v_out:
    reference: unreferenced_placeholder; isolated-test boundary value (equilibrium flow 500 Pa / R); in a network it is supplied
      by the neighbouring vessel (value in uL_per_s; 5.505e-11 m3_per_s)
    sourced: 'no'
    value: 0.05505
