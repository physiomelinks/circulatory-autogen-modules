reference_proposals:
  R:
    reference: 'unreferenced_placeholder; derived for the test from the proposed venule geometry: R = 8 mu l/(pi r_0^4) (Poiseuille,
      mu = 0.004 Pa s). In a network this is set per vessel'
    sourced: 'no'
    value: 9082000000000.0
  C:
    reference: 'unreferenced_placeholder; derived for the test from the proposed venule geometry: C = 2 pi r_0^3 l/(E h),
      h from the watanabe2013mathematical fit'
    sourced: 'no'
    value: 2.851e-17
  q_0:
    reference: 'unreferenced_placeholder; derived for the test: q_0 = pi r_0^2 l for the proposed venule geometry'
    sourced: 'no'
    value: 1.052e-13
  u_ext:
    reference: definitional; no external (tissue) pressure acting on the vessel in the isolated test (0 Pa); in a network
      this is the surrounding tissue pressure
    sourced: definitional
    value: 0.0
  u_0:
    reference: boas2008vascular; PV = 25 mmHg for the 35 um venule (model boundary condition) = 3.33 kPa
    sourced: 'yes'
    value: 3330.0
