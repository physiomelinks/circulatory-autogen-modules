module_type: artery_Minlet
version: pv_micro
reviewed: false
notes: 'Pressure-in/flow-out artery compartment: one Poiseuille resistance R = 8 mu l/(pi r_0^4) and one thin-wall compliance
  C = 2 pi r_0^3 l/(E h) (h from the Avolio wall-thickness fit), no inertance. u = u_0 + u_ext + q_C/C, q_C(0) = 0. Alone
  with constant BCs it is a linear first-order system with time constant RC (nominal 3.48e-05 s), so the exact solution is
  the invariant. Identical to pv_Nout_type_micro except for a stray initial_value on the input v_out_sum, which breaks generation
  (see expected_failures).'
expected_failures:
  run_test: 'module defect: the input variable v_out_sum carries initial_value="0.0" in the CellML; libcellml/Myokit reject
    the connected set ("Multiple initial values defined in connected variable set"), so the model cannot be generated. Verified:
    removing the initial_value in a patched copy makes it generate and pass. See review.proposed_fixes.'
  verification_test_invariants: 'module defect: the input variable v_out_sum carries initial_value="0.0" in the CellML; libcellml/Myokit
    reject the connected set ("Multiple initial values defined in connected variable set"), so the model cannot be generated.
    Verified: removing the initial_value in a patched copy makes it generate and pass. See review.proposed_fixes.'
  verification_test_BC: 'module defect: the input variable v_out_sum carries initial_value="0.0" in the CellML; libcellml/Myokit
    reject the connected set ("Multiple initial values defined in connected variable set"), so the model cannot be generated.
    Verified: removing the initial_value in a patched copy makes it generate and pass. See review.proposed_fixes.'
  verification_test_timestep: 'module defect: the input variable v_out_sum carries initial_value="0.0" in the CellML; libcellml/Myokit
    reject the connected set ("Multiple initial values defined in connected variable set"), so the model cannot be generated.
    Verified: removing the initial_value in a patched copy makes it generate and pass. See review.proposed_fixes.'
  stability_test: 'module defect: the input variable v_out_sum carries initial_value="0.0" in the CellML; libcellml/Myokit
    reject the connected set ("Multiple initial values defined in connected variable set"), so the model cannot be generated.
    Verified: removing the initial_value in a patched copy makes it generate and pass. See review.proposed_fixes.'
reference_proposals:
  E:
    reference: 'Watanabe2013; Sec. 3.3 quoting Olufsen1999: E h/r_0 = k1 e^(k2 r_0) + k3, k1 = 2.0e7 dyn/cm^2, k2 = -22.53
      cm^-1, k3 = 8.65e5 dyn/cm^2 -> E h/r_0 = 1.42 MPa at r_0 = 180 um; with h/r_0 = 0.388 (Watanabe2013 fit) E = 3.66 MPa
      (derived)'
    sourced: 'yes'
    value: 3660000.0
  l:
    reference: unreferenced_placeholder; segment length 5 mm (order of magnitude; no verified source)
    sourced: 'no'
    value: 0.005
  r_0:
    reference: Watanabe2013; smallest arm arteries (perforators) lumen radius 0.018 cm = 180 um, used as the representative
      small artery feeding a microvascular network
    sourced: 'yes'
    value: 0.00018
  u_ext:
    reference: definitional; no external (tissue) pressure acting on the vessel in the isolated test (0 Pa); in a network
      this is the surrounding tissue pressure
    sourced: definitional
    value: 0.0
  u_0:
    reference: unreferenced_placeholder; small-artery reference pressure 80 mmHg = 10.67 kPa (Zweifach1974 pressure distribution
      could not be read to verify)
    sourced: 'no'
    value: 10670.0
  theta:
    reference: 'definitional; vessel inclination angle [deg]: 0 = horizontal. Not used by any equation (the gravity term is
      commented out in the CellML)'
    sourced: definitional
    value: 0.0
  u_in:
    reference: unreferenced_placeholder; isolated-test boundary value (upstream pressure = u_0 + 1000 Pa); in a network it
      is supplied by the neighbouring vessel
    sourced: 'no'
    value: 11670.0
  v_out_sum:
    reference: unreferenced_placeholder; isolated-test boundary value (outflow = equilibrium flow 1000 Pa / R); in a network
      it is supplied by the neighbouring vessel
    sourced: 'no'
    value: 2.061e-08
  a_vessel:
    reference: 'Watanabe2013; Eq. (3.1), p. 969: fit h/r = a e^(b r) + c e^(d r) to the Avolio1980 arterial radius/wall-thickness
      data, a = 0.2802. Fitted on arteries (r ~0.2-1.4 cm); used here down to capillaries = extrapolation (h/r -> a + c =
      0.41 as r -> 0)'
    sourced: 'yes'
    value: 0.2802
  b_vessel:
    reference: 'Watanabe2013; Eq. (3.1): b = -5.053 cm^-1 = -505.3 m^-1 (r in cm, Fig. 2)'
    sourced: 'yes'
    value: -505.3
  beta_g:
    reference: definitional; gravity switch (0 = off). Not used by any equation (gravity term commented out)
    sourced: definitional
    value: 0.0
  c_vessel:
    reference: 'Watanabe2013; Eq. (3.1): c = 0.1324'
    sourced: 'yes'
    value: 0.1324
  d_vessel:
    reference: 'Watanabe2013; Eq. (3.1): d = -0.1114 cm^-1 = -11.14 m^-1'
    sourced: 'yes'
    value: -11.14
  g:
    reference: definitional; gravitational acceleration 9.81 m/s^2. Not used by any equation (gravity term commented out)
    sourced: definitional
    value: 9.81
  mu:
    reference: 'Watanabe2013; p. 976, mu = 0.04 P = 0.004 Pa s (whole-blood modelling value for large arteries). NOTE: for
      microvessels the apparent viscosity is lower in vitro (Pries1992 law via Secomb2013: rel. viscosity 1.27 at 8 um, 1.78
      at 30 um, x plasma 1.1-1.3 mPa s -> ~1.5-2.1 mPa s) and higher in vivo (Pries1994: 10 um vessels ~4x glass tube). One
      global value for all vessel classes'
    sourced: 'yes'
    value: 0.004
  rho:
    reference: Watanabe2013; p. 976, rho = 1.04 g/cm^3 = 1040 kg/m^3 (Trudnowski1974 measured 1050.6 kg/m^3 at 37 C). Not
      used by any equation (the gravity/inertia terms are commented out)
    sourced: 'yes'
    value: 1040.0
review: reviews/microvasculature_network_review.yaml
