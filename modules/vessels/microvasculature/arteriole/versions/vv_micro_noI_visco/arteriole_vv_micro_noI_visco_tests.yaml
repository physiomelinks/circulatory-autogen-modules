module_type: arteriole
version: vv_micro_noI_visco
reviewed: false
notes: 'arteriole (vv) vv_micro without its inertance: the same geometry-free component (R, C, q_0 given directly) with the
  viscoelastic term R_v = 0.01/C, the same ports and parameter values, and the flows algebraic. They are the I -> 0 limit
  of vv_micro''s flow equations, solved explicitly (v = ((u_0 + u_C + u_ext) - (u_0 + u_C_d + u_ext) + 2*R_v*(v_in + v_out))/(R
  + 4*R_v)); the invariants check the original''s flow laws with I = 0. Derived from arteriole/vv_micro, whose parameter sources
  and references it shares (not yet reviewed itself).'
reference_proposals:
  R:
    reference: 'unreferenced_placeholder; derived for the test from the proposed arteriole geometry: R = 8 mu l/(pi r_0^4)
      (Poiseuille, mu = 0.004 Pa s). In a network this is set per vessel (value in Pa_s_per_uL; 18830000000000.0 Js_per_m6)'
    sourced: 'no'
    value: 18830.0
  C:
    reference: 'unreferenced_placeholder; derived for the test from the proposed arteriole geometry: C = 2 pi r_0^3 l/(E h),
      h from the watanabe2013mathematical fit (value in uL_per_Pa; 1.978e-17 m6_per_J)'
    sourced: 'no'
    value: 1.978e-08
  q_0:
    reference: 'unreferenced_placeholder; derived for the test: q_0 = pi r_0^2 l for the proposed arteriole geometry (value
      in uL; 7.306e-14 m3)'
    sourced: 'no'
    value: 7.306e-05
  u_ext:
    reference: definitional; no external (tissue) pressure acting on the vessel in the isolated test (0 Pa); in a network
      this is the surrounding tissue pressure
    sourced: definitional
    value: 0.0
  u_0:
    reference: boas2008vascular; PA = 60 mmHg for the 30 um arteriole (model boundary condition) = 8.0 kPa. u_0 is the pressure
      at q_C = 0 (reference/initial pressure)
    sourced: 'yes'
    value: 8000.0
  v_in:
    reference: unreferenced_placeholder; isolated-test boundary value (flow 1500 Pa / R); in a network it is supplied by the
      neighbouring vessel (value in uL_per_s; 7.965e-11 m3_per_s)
    sourced: 'no'
    value: 0.07965
  v_out:
    reference: unreferenced_placeholder; isolated-test boundary value (flow 1500 Pa / R); in a network it is supplied by the
      neighbouring vessel (value in uL_per_s; 7.965e-11 m3_per_s)
    sourced: 'no'
    value: 0.07965
