module_type: vein
version: vp_micro_noI_visco
reviewed: false
notes: 'vein (vp) vp_micro without its inertance: the same geometry-free component (R, C, q_0 given directly) with the viscoelastic
  term R_v = 0.01/C, the same ports and parameter values, and the flows algebraic. They are the I -> 0 limit of vp_micro''s
  flow equations, solved explicitly (v = ((u_0 + u_C + u_ext) + R_v*v_in - u_out)/(R + R_v)); the invariants check the original''s
  flow laws with I = 0. Derived from vein/vp_micro, whose parameter sources and references it shares (not yet reviewed itself).'
reference_proposals:
  R:
    reference: 'unreferenced_placeholder; derived for the test from the proposed vein geometry: R = 8 mu l/(pi r_0^4) (Poiseuille,
      mu = 0.004 Pa s). In a network this is set per vessel (value in Pa_s_per_uL; 31830000000.0 Js_per_m6)'
    sourced: 'no'
    value: 31.83
  C:
    reference: 'unreferenced_placeholder; derived for the test from the proposed vein geometry: C = 2 pi r_0^3 l/(E h), h
      from the watanabe2013mathematical fit (value in uL_per_Pa; 3.261e-14 m6_per_J)'
    sourced: 'no'
    value: 3.261e-05
  q_0:
    reference: 'unreferenced_placeholder; derived for the test: q_0 = pi r_0^2 l for the proposed vein geometry (value in
      uL; 6.283e-10 m3)'
    sourced: 'no'
    value: 0.6283
  u_ext:
    reference: definitional; no external (tissue) pressure acting on the vessel in the isolated test (0 Pa); in a network
      this is the surrounding tissue pressure
    sourced: definitional
    value: 0.0
  u_0:
    reference: unreferenced_placeholder; small-vein pressure 10 mmHg = 1.333 kPa (order of magnitude)
    sourced: 'no'
    value: 1333.0
  u_out:
    reference: unreferenced_placeholder; isolated-test boundary value (u_0 - 300 Pa); in a network it is supplied by the neighbouring
      vessel
    sourced: 'no'
    value: 1033.0
  v_in:
    reference: unreferenced_placeholder; isolated-test boundary value (equilibrium flow 300 Pa / R); in a network it is supplied
      by the neighbouring vessel (value in uL_per_s; 9.425e-09 m3_per_s)
    sourced: 'no'
    value: 9.425
