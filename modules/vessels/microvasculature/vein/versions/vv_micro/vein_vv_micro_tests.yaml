module_type: vein
version: vv_micro
reviewed: false
notes: 'vein (vv) entry of this config that points at the BG library type vv_simple_type (defined in modules/BG, resolved
  because libcuflynx merges the whole library). That type has an inertance I (dv/dt = (Δu - R v)/I) and a viscoelastic term
  R_v = 0.01/C. I is declared in the config but has no value yet (TODO, see expected_failures), so the component cannot run.
  Geometry-free (R, C, q_0 given directly). Invariants (volume balance, pressure law) verified on a patched copy with I given
  a value. After that fix the entry is still extremely stiff: I/R ~ 1.3e-03 s (with I = rho l/(pi r^2)) against a relaxation
  time (R + 0.01/C) C ~ 0.011 s, so explicit fixed-step schemes (timestep test) are not practical; the _micro types (no inertance)
  are the natural choice for microvessels.'
