module_type: artery_Min
version: vv_micro
reviewed: false
notes: 'Flow-in/flow-out artery compartment: one Poiseuille resistance between two half compliances C/2 (states q_C, q_C_d),
  no inertance. Alone with constant flows the total volume changes linearly and the volume difference relaxes with time constant
  RC/4 (nominal 8.69e-06 s): both are exact invariants. The CellML adds a constant "+ 2 Pa" to u and u_d (remnant of a commented-out
  viscous term 2 R_v (v_in - v) with R_v = 0), recorded as a defect. Test network: the Sum flow_port is closed by a constant
  inflow (inlet_flow constant_flow_port, vin); since multi_port Sum sums (2026-09-29), an unconnected Sum port is 0, not
  a parameter.'
expected_failures:
  verification_test_invariants: 'module defect: u = u_0 + u_C + u_ext + 2 {J_per_m3} (and u_d likewise) in the CellML; the
    "+2" is left over from the commented-out term 2 R_v (v_in - v). u is 2 Pa above the pressure law (run shows u(0) = u_0
    + 2). See review.proposed_fixes.'
reference_proposals:
  E:
    reference: 'watanabe2013mathematical; Sec. 3.3 quoting olufsen1999structured: E h/r_0 = k1 e^(k2 r_0) + k3, k1 = 2.0e7 dyn/cm^2, k2 = -22.53
      cm^-1, k3 = 8.65e5 dyn/cm^2 -> E h/r_0 = 1.42 MPa at r_0 = 180 um; with h/r_0 = 0.388 (watanabe2013mathematical fit) E = 3.66 MPa
      (derived)'
    sourced: 'yes'
    value: 3660000.0
  l:
    reference: unreferenced_placeholder; segment length 5 mm (order of magnitude; no verified source)
    sourced: 'no'
    value: 0.005
  r_0:
    reference: watanabe2013mathematical; smallest arm arteries (perforators) lumen radius 0.018 cm = 180 um, used as the representative
      small artery feeding a microvascular network
    sourced: 'yes'
    value: 0.00018
  u_ext:
    reference: definitional; no external (tissue) pressure acting on the vessel in the isolated test (0 Pa); in a network
      this is the surrounding tissue pressure
    sourced: definitional
    value: 0.0
  u_0:
    reference: unreferenced_placeholder; small-artery reference pressure 80 mmHg = 10.67 kPa (Zweifach1974 pressure distribution
      could not be read to verify)
    sourced: 'no'
    value: 10670.0
  theta:
    reference: 'definitional; vessel inclination angle [deg]: 0 = horizontal. Not used by any equation (the gravity term is
      commented out in the CellML)'
    sourced: definitional
    value: 0.0
  v_in_sum:
    reference: unreferenced_placeholder; isolated-test boundary value (flow 1000 Pa / R); in a network it is supplied by the
      neighbouring vessel
    sourced: 'no'
    value: 2.061e-08
  v_out:
    reference: unreferenced_placeholder; isolated-test boundary value (flow 1000 Pa / R); in a network it is supplied by the
      neighbouring vessel
    sourced: 'no'
    value: 2.061e-08
  a_vessel:
    reference: 'watanabe2013mathematical; Eq. (3.1), p. 969: fit h/r = a e^(b r) + c e^(d r) to the avolio1980multi arterial radius/wall-thickness
      data, a = 0.2802. Fitted on arteries (r ~0.2-1.4 cm); used here down to capillaries = extrapolation (h/r -> a + c =
      0.41 as r -> 0)'
    sourced: 'yes'
    value: 0.2802
  b_vessel:
    reference: 'watanabe2013mathematical; Eq. (3.1): b = -5.053 cm^-1 = -505.3 m^-1 (r in cm, Fig. 2)'
    sourced: 'yes'
    value: -505.3
  beta_g:
    reference: definitional; gravity switch (0 = off). Not used by any equation (gravity term commented out)
    sourced: definitional
    value: 0.0
  c_vessel:
    reference: 'watanabe2013mathematical; Eq. (3.1): c = 0.1324'
    sourced: 'yes'
    value: 0.1324
  d_vessel:
    reference: 'watanabe2013mathematical; Eq. (3.1): d = -0.1114 cm^-1 = -11.14 m^-1'
    sourced: 'yes'
    value: -11.14
  g:
    reference: definitional; gravitational acceleration 9.81 m/s^2. Not used by any equation (gravity term commented out)
    sourced: definitional
    value: 9.81
  mu:
    reference: 'watanabe2013mathematical; p. 976, mu = 0.04 P = 0.004 Pa s (whole-blood modelling value for large arteries). NOTE: for
      microvessels the apparent viscosity is lower in vitro (pries1992blood law via secomb2013blood: rel. viscosity 1.27 at 8 um, 1.78
      at 30 um, x plasma 1.1-1.3 mPa s -> ~1.5-2.1 mPa s) and higher in vivo (pries1994resistance: 10 um vessels ~4x glass tube). One
      global value for all vessel classes'
    sourced: 'yes'
    value: 0.004
  rho:
    reference: watanabe2013mathematical; p. 976, rho = 1.04 g/cm^3 = 1040 kg/m^3 (trudnowski1974specific measured 1050.6 kg/m^3 at 37 C). Not
      used by any equation (the gravity/inertia terms are commented out)
    sourced: 'yes'
    value: 1040.0
