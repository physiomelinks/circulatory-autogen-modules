module_type: lung_mechanics
version: ventilated_ArgusUNPUBLISHED_v01
reviewed: false
notes: 'Mechanically-ventilated lung (author''s model): ventilator pressure P_vent with a PI(leaky-integral) controller to
  the set pressure P_in and compliance C_vent, tube resistance R_tube to a mouth compliance C_m (with a pressure-relief leak
  above P_leak_threshold), then trachea-bronchi-alveoli as in simple_lung_bg with resistances split from R_tot and compliances
  from C_tot (alveolar compliance switches between inspiration and expiration by beta_C_insp_to_exp). Spontaneous effort P_mus
  is a quadratic B-spline (8 control points P_d_i on knots k_w apart) scaled by P_d_multiplier and the controller input alpha_P_mus.
  alpha_LR and q_str are hard-coded to 1. ALL VALUES ARE PROPOSED PLACEHOLDERS so the component can be verified; they are
  not a calibrated patient.


  Ports of the versions of lung_mechanics (the same port types):

  entrance lung_flow_and_volume_port: ArgusUNPUBLISHED_v01 [v_ml, v_bA, q_D, q_A]; ventilated_ArgusUNPUBLISHED_v01 [v_mt,
  v_bA, q_D, q_A]

  entrance respiratory_lung_muscle_pressure_port: ArgusUNPUBLISHED_v01 [Delta_P_mus]; ventilated_ArgusUNPUBLISHED_v01 [alpha_P_mus]

  entrance respiratory_rate_port: ArgusUNPUBLISHED_v01 [Delta_RR_resp]; ventilated_ArgusUNPUBLISHED_v01 [Delta_RR_resp]

  exit s_gating: ArgusUNPUBLISHED_v01 [s_floor]; ventilated_ArgusUNPUBLISHED_v01 [s_floor]

  exit thoracic_pressure_port: ArgusUNPUBLISHED_v01 [P_mus]; ventilated_ArgusUNPUBLISHED_v01 [P_pl]

  exit volume_stretch_port: ArgusUNPUBLISHED_v01 [q_str]; ventilated_ArgusUNPUBLISHED_v01 [q_str]'
