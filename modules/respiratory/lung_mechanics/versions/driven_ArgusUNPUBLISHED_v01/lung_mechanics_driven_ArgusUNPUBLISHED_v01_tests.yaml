notes: 'The lung mechanics of lung_bond_graph_Argus_Chase_qstr (CA_user_FA_MG, as in the calibrated ICUHealthy model): mouth with a ventilator pressure loop (P_vent, P_err_int, holding the mouth at P_in), trachea, bronchi and alveoli, each a linear compliance referenced to pleural pressure, and a pleural compliance charged through R_plwall from the muscle pressure P_mus. Differences: P_mus is an input (muscle_pressure_port), not the version''s own B-spline generator, so there is no breathing-rate state or phase; C_A = alpha_C_A_to_tot C_tot at all times (the calibrated model''s inspiration/expiration ratio beta_C_insp_to_exp is 1); q_str = q_A_stressed as in the qstr version. Linear in its states except q_D = max(q_t + q_b + q_t_us + q_b_us, q_D_min) and the leak max(P_m - P_leak_threshold, 0)/R_leak (negligible at R_leak 1e10). The harness drives it with muscle_pressure cosine_EllweinFix2018_v01.'
