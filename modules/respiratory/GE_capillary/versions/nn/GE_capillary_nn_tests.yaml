module_type: GE_capillary
version: nn
reviewed: false
notes: 'Single capillary O2 exchange (author''s model): well-mixed capillary O2 content with inflow/outflow and a permeability
  flux to tissue, flux = 2 pi r L perm (ub_c - ub_t) on free (dissolved) O2; the venous free O2 is reconstructed from an assumed
  exponential axial profile whose decay rate solves (1 - exp(-kL))/(kL) = C_0 via a Pade approximation of the Lambert W function;
  contents <-> pressures via Spencer curves in mmHg. CO2 is passed through (C_CO2_c = C_CO2_a). All inputs are boundary conditions,
  so it runs alone.'
expected_failures:
  run_test: 'the component cannot be generated: (1) its config lists d_1, d_2, r_1, r_2, s_1, s_2 twice (J_per_m3/J2_per_m6
    and mmHg/mmHg2), so libcuflynx declares them twice (libcellml VARIABLE_NAME_UNIQUE); (2) the CellML uses the global saturation_cap
    without declaring it. Evidence: in a patched copy of the library (duplicates removed, saturation_cap declared and added
    to the config as global_constant) it generates and runs.'
