module_type: gas_transport_simple
version: Albanese2016_v01
reviewed: false
notes: 'Well-mixed blood gas transport compartment (volume q_0, flow v) without exchange: q_0 dC/dt = v (C_in - C_out), plus
  output partial pressures from the analytic inverse of the Spencer curves. With constant inflow content and flow, C_out =
  C_in + (C_init - C_in) exp(-v t/q_0). Harness: pp_I terminal as a steady flow source (5 L/min).'
