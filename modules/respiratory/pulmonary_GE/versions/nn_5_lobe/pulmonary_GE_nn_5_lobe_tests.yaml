notes: 'Five-lobe variant of pulmonary_GE: the capillary flow is the sum of five lobar flow ports (v = v_1 + ... + v_5); otherwise
  the same equations without the over-cap solubility term. Harness as for pulmonary_GE with five pp_I terminals (1 L/min each).'
expected_failures:
