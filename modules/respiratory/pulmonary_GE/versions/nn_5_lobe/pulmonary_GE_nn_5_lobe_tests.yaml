    declaring it, and the config does not list it (libcellml MATH_CI_VARIABLE_REFERENCE). Evidence: in a patched library copy
    (saturation_cap declared public_interface in and added to the config as global_constant) the component generates, runs
    and all 5 invariants hold.'
