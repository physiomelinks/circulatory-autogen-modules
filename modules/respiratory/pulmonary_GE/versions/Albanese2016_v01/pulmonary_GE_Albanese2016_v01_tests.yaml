module_type: pulmonary_GE
version: Albanese2016_v01
reviewed: false
notes: 'Pulmonary capillary gas exchange (after Albanese 2016): well-mixed capillary of volume q_0 fed by v (1 - shunt) of
  mixed-venous blood, diffusive exchange M = k (P_A - P_p) with the alveoli, capillary partial pressures from the analytic
  inverse of the Spencer (1979) O2/CO2 dissociation curves (Bohr/Haldane coupled), and arterial content = flow-weighted mix
  of capillary and shunted blood. Albanese assumes instantaneous alveolar-capillary equilibrium; this module adds a finite
  exchange conductance. Harness: steady pulmonary flow (pp_I terminal, 5 L/min), constant mixed-venous blood (gas_transport_simple
  held at 15/53 ml/dl), an arterial gas_transport_simple sink (needed: see known config issue), respiratory_gas_transport
  and the simple_lung_bg lung (library values).'
reference_proposals:
