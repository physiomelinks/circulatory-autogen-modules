module: delay
reviewed: true
known_issues: []
defaults:
  sim_time: 10.0
  pre_time: 0.0
  dt: 0.01
  solver: CVODE_myokit
  bc_sweep:
    factors: [0.5, 0.75, 1.0, 1.5, 2.0]
    ranges:
      delay: {min: 0.05, max: 2.0, points: 6, scale: log}
      k_e: {min: 0.1, max: 10, points: 5, scale: log}
  timestep:
    scheme: rk4
    dts: [0.004, 0.002, 0.001, 0.0005]
    min_order: 0.8
    tol: 0.0001
    cvode_tol: 0.001
    t_end: 10.0
  stability:
    supported:
    - {solver: CVODE_myokit, rtol: 1.0e-06, atol: 1.0e-08}
components:
- vessel_type: delay_test
  BC_type: nn
  module_type: delay_test
  outputs: [V, V_delay]
  invariants:
  - {description: 'V_delay equals V shifted by the delay (t ≥ delay), to 1e-3 of max|V|', expr: 'np.max(np.abs(np.interp(t[t
      >= delay] - delay, t, V) - V_delay[t >= delay])) <= 1e-3 * np.max(np.abs(V))'}
  validation:
    baseline: {status: skipped, reason: 'test fixture for the delay feature, no physical system'}
    calibrate: {status: skipped, reason: 'test fixture for the delay feature, no physical system'}
  notes: 'Test fixture for libcuflynx''s delayed-variable feature (delay_info in the module config): dV/dt = sin(10t) + sin(t)
    + 10 − k_e V, and V_delay(t) = V(t − delay).'
  expected_failures: {run_test: 'libcuflynx applies delay_info only in the C++ generator (model_type cpp); CellML and Python
      models silently use V_delay = V, so the delay is missing', verification_test_BC: 'libcuflynx applies delay_info only
      in the C++ generator (model_type cpp); CellML and Python models silently use V_delay = V, so the delay is missing'}
