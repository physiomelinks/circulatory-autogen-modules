module: BG
reviewed: false
known_issues: [port variable u_in not in variables_and_units, port variable r not in variables_and_units]
defaults:
  sim_time: 2.0
  pre_time: 0.0
  dt: 0.01
  solver: CVODE_myokit
  bc_sweep:
    factors: [0.5, 0.75, 1.0, 1.5, 2.0]
    ranges: {}
  timestep:
    scheme: rk4
    dts: [0.004, 0.002, 0.001, 0.0005]
    min_order: 0.8
    tol: 0.0001
    cvode_tol: 0.001
  stability:
    supported:
    - {solver: CVODE_myokit, rtol: 1.0e-06, atol: 1.0e-08}
components:
- vessel_type: arterial_simple
  BC_type: vp
  module_type: vp_simple_type
  sim_time: 1.0
  dt: 0.0005
  solver_info: {rtol: 1.0e-07, atol: 1.0e-14}
  reference_solver_info: {rtol: 1.0e-10, atol: 1.0e-16}
  outputs: [u, v, q, q_C]
  invariants:
  - {description: 'u = u_0 + (q - q_0)/C + u_ext + R_v (v_in - v), R_v = 0.01 s/C', expr: np.max(np.abs((u) - (u_0 + (q -
      q_0)/(C) + u_ext + (0.01/(C))*(v_in - v)))) <= 1e-08*(np.max(np.abs(u)) + np.max(np.abs(u_0 + (q - q_0)/(C) + u_ext
      + (0.01/(C))*(v_in - v)))) + 1e-30}
  - {description: 'volume balance: d(q)/dt = (v_in) - (v) (trapezoidal integral of the flows from t = 0.001 s, rel. tol 0.005)',
    expr: 'np.max(np.abs((((q) + 0*t)[(t >= 0.001)] - ((q) + 0*t)[(t >= 0.001)][0]) - np.concatenate(([0.0], np.cumsum(0.5*((((v_in)
      - (v) + 0*t))[(t >= 0.001)][1:] + (((v_in) - (v) + 0*t))[(t >= 0.001)][:-1])*np.diff(t[(t >= 0.001)])))))) <= 0.005*np.ptp(((q)
      + 0*t)[(t >= 0.001)]) + 1e-5*np.max(np.abs(((q) + 0*t))) + 1e-9*np.max(np.abs(((v_in) - (v) + 0*t)))*t[-1] + 1e-18'}
  - {description: 'steady state at t_end: v = v_in', expr: 'abs((v)[-1] - (v_in)) <= 0.001*(abs(v_in) + 1e-12 + np.max(np.abs(v)))
      + 1e-18'}
  - {description: 'steady state at t_end: u = u_out + R (v_in)', expr: 'abs((u)[-1] - (u_out + R*(v_in) + 0)) <= 0.001*(abs(u_out)
      + 1.0 + np.max(np.abs(u))) + 1e-18'}
  run_parameters: {}
  bc_sweep:
    factors: [0.5, 0.75, 1.0, 1.5, 2.0]
    ranges:
      q_0: [0.0, 1.0e-05]
      u_ext: [-500.0, 1000.0]
      u_out: [6000.0, 16000.0]
      v_in: [0.0, 0.0002]
    exclude: []
    rationale: 'Boundary conditions span physiological operating values for the vessel class (arterial inlet 60-150 mmHg,
      venous 0-15 mmHg, flows 0-2x the nominal flow; +-0.5% for the nonlinear vv types, whose volume drifts by (v_in - v_out)
      t and collapses the tube if the imbalance is larger); constants are swept 0.5-2x their value; rho and mu are swept 0.5-2x
      their library (test_fft fixture) value of 1; beta_g 0-1; g 1-9.81; the wall-thickness constants a-d between the fixture
      value 1 and the proposed Blanco 2015 values. The physiological rho/mu (1050, 0.004) cannot yet be combined with the
      others at the run point (framework issue), so the swept regime is the library one. Excluded: tube-law exponents (they
      define the law), switches (R_flag, blood_ctl_dir).'
  timestep:
    scheme: rk4
    dts: [2.0e-14, 1.0e-14, 5.0e-15, 2.5e-15]
    t_end: 5.0e-11
    min_order: 0.8
    tol: 0.0001
    cvode_tol: 0.001
  stability:
    t_end: 1.0
    supported:
    - {solver: CVODE_myokit, rtol: 1.0e-07, atol: 1.0e-14}
    time_budget: 10.0
    cvode:
    - {rtol: 0.0001, atol: 1.0e-08}
    - {rtol: 1.0e-06, atol: 1.0e-08}
    - {rtol: 1.0e-07, atol: 1.0e-14}
    solve_ivp: [LSODA]
    fixed_step:
      schemes: [rk4]
      dt_start: 2.0e-14
  notes: 'vp lumped linear R-C-I vessel. Jacobian timescales (nominal: fastest 2.3e-14 s, slowest decay 0.013 s; run: fastest
    2.3e-14 s, slowest decay 0.013 s).'
  reference_proposals:
    q_0: {reference: 'unreferenced_placeholder; circulatory_autogen 3compartment_extra_ops: "user_defined_TO_DO" (value 0)',
      sourced: 'no'}
    R: {reference: 'Safaei2018; Table S3 R_par = 10.664e6 J s m^-6 (0.08 mmHg s/mL), pulmonary arteries; Safaei et al. model
        the pulmonary loop after Blanco & Feijoo 2013, whose Table 8 (the circulatory_autogen label) could not be checked
        (paywalled)', sourced: 'yes'}
    C:
      reference: 'unreferenced_placeholder; circulatory_autogen 3compartment_extra_ops "to_be_identified". The digits match
        Safaei2018 Table S3 C_par = 0.0309077e-6 m^6/J, but this value is 100x smaller: check whether this is intended'
      sourced: 'no'
      also_cites: [Safaei2018]
    I:
      reference: 'unreferenced_placeholder; I = 0.000001 is a small nonzero stand-in: Safaei2018 Table S3 gives I = 0 for
        the pulmonary arteries and veins (circulatory_autogen label Blanco_2013_Table_8 not verifiable). Makes the module
        very stiff (I/R ~ 1e-13 s)'
      sourced: 'no'
      also_cites: [Safaei2018]
    u_ext: {reference: 'definitional; u_ext = 0 (circulatory_autogen 3compartment_extra_ops: user_defined)', sourced: definitional}
    u_0:
      reference: 'unreferenced_placeholder; circulatory_autogen 3compartment_extra_ops: "Mynard&Smolich_2015_assumedRefOf11mmHg"
        (value 1463); an assumed reference pressure. Not found in the accessible Mynard2015 supplementary files'
      sourced: 'no'
      also_cites: [Mynard2015]
    u_out: {reference: 'unreferenced_placeholder; boundary condition supplied by the connected neighbour in a network; test
        value 12665.6 Pa (95 mmHg), typical outlet pressure for this vessel class', sourced: 'no', value: 12665.6}
    v_in: {reference: unreferenced_placeholder; boundary condition supplied by the connected neighbour in a network; test
        value 0.0001 m^3/s, sourced: 'no', value: 0.0001}
  validation:
    baseline: {status: pending, reason: 'a single vessel under constant boundary conditions has no measured counterpart; validation
        needs a network assembled from these modules. Candidate: the Boileau et al. (2015) benchmark reference solutions (e.g.
        the aortic-bifurcation and 37-artery test cases, whose 1D reference pressure/flow waveforms are published as supplementary
        data), compared with a chain of these 0D segments (proposal only, not set up).'}
    calibrate: {status: pending, reason: 'a single vessel under constant boundary conditions has no measured counterpart;
        validation needs a network assembled from these modules. Candidate: the Boileau et al. (2015) benchmark reference
        solutions (e.g. the aortic-bifurcation and 37-artery test cases, whose 1D reference pressure/flow waveforms are published
        as supplementary data), compared with a chain of these 0D segments (proposal only, not set up).'}
- vessel_type: arterial_simple
  BC_type: vp_nonlinear
  module_type: vp_simple_nonlinear_type
  sim_time: 1.0
  dt: 0.0001
  solver_info: {rtol: 1.0e-07, atol: 1.0e-14}
  reference_solver_info: {rtol: 1.0e-10, atol: 1.0e-16}
  outputs: [u, v, q, R_nonlinear]
  invariants:
  - {description: u = u_0 + u_ext + K_tube ((q/q_0)^m - (q/q_0)^n), expr: np.max(np.abs((u) - (u_0 + u_ext + K_tube*((q/q_0)**m_tube
      - (q/q_0)**n_tube)))) <= 1e-08*(np.max(np.abs(u)) + np.max(np.abs(u_0 + u_ext + K_tube*((q/q_0)**m_tube - (q/q_0)**n_tube))))
      + 1e-30}
  - {description: R_nonlinear = R (q_init/q)^2, expr: np.max(np.abs((R_nonlinear) - (R*(q_init/q)**2))) <= 1e-08*(np.max(np.abs(R_nonlinear))
      + np.max(np.abs(R*(q_init/q)**2))) + 1e-30}
  - {description: 'volume balance: d(q)/dt = (v_in) - (v) (trapezoidal integral of the flows from t = 0 s, rel. tol 0.05)',
    expr: 'np.max(np.abs((((q) + 0*t)[(t >= 0)] - ((q) + 0*t)[(t >= 0)][0]) - np.concatenate(([0.0], np.cumsum(0.5*((((v_in)
      - (v) + 0*t))[(t >= 0)][1:] + (((v_in) - (v) + 0*t))[(t >= 0)][:-1])*np.diff(t[(t >= 0)])))))) <= 0.05*np.ptp(((q) +
      0*t)[(t >= 0)]) + 1e-5*np.max(np.abs(((q) + 0*t))) + 1e-9*np.max(np.abs(((v_in) - (v) + 0*t)))*t[-1] + 1e-18'}
  - {description: 'steady state at t_end: v = v_in', expr: 'abs((v)[-1] - (v_in)) <= 0.001*(abs(v_in) + 1e-12 + np.max(np.abs(v)))
      + 1e-18'}
  - {description: 'steady state at t_end: u = u_out + R (v_in)', expr: 'abs((u)[-1] - (u_out + R_nonlinear[-1]*(v_in) + 0))
      <= 0.001*(abs(u_out) + 1.0 + np.max(np.abs(u))) + 1e-18'}
  - {description: q stays positive (the tube law needs a positive volume), expr: np.all(q > 0)}
  run_parameters: {}
  bc_sweep:
    factors: [0.5, 0.75, 1.0, 1.5, 2.0]
    ranges:
      u_ext: [-500.0, 1000.0]
      u_out: [6000.0, 16000.0]
      v_in: [0.0, 0.0002]
    exclude: [m_tube, n_tube]
    rationale: 'Boundary conditions span physiological operating values for the vessel class (arterial inlet 60-150 mmHg,
      venous 0-15 mmHg, flows 0-2x the nominal flow; +-0.5% for the nonlinear vv types, whose volume drifts by (v_in - v_out)
      t and collapses the tube if the imbalance is larger); constants are swept 0.5-2x their value; rho and mu are swept 0.5-2x
      their library (test_fft fixture) value of 1; beta_g 0-1; g 1-9.81; the wall-thickness constants a-d between the fixture
      value 1 and the proposed Blanco 2015 values. The physiological rho/mu (1050, 0.004) cannot yet be combined with the
      others at the run point (framework issue), so the swept regime is the library one. Excluded: tube-law exponents (they
      define the law), switches (R_flag, blood_ctl_dir).'
  timestep:
    scheme: rk4
    dts: [0.002, 0.001, 0.0005, 0.00025]
    t_end: 1.0
    min_order: 0.8
    tol: 0.0001
    cvode_tol: 0.001
  stability:
    t_end: 1.0
    supported:
    - {solver: CVODE_myokit, rtol: 1.0e-07, atol: 1.0e-14}
    time_budget: 10.0
    cvode:
    - {rtol: 0.0001, atol: 1.0e-08}
    - {rtol: 1.0e-06, atol: 1.0e-08}
    - {rtol: 1.0e-07, atol: 1.0e-14}
    solve_ivp: [LSODA]
    fixed_step:
      schemes: [rk4]
      dt_start: 0.005
  notes: 'vp vessel with a nonlinear tube law. Jacobian timescales (nominal: fastest 0.0031 s, slowest decay 0.019 s, shortest
    oscillation period 0.021 s; run: fastest 0.0031 s, slowest decay 0.019 s, shortest oscillation period 0.021 s).'
  reference_proposals:
    u_0: {reference: unreferenced_placeholder; reference pressure 80 mmHg as used by the ADAN-based siblings in this file
        ("AssumedRefOf80mmHg"), sourced: 'no', value: 10640.0}
    q_init: {reference: unreferenced_placeholder; initial volume 10 mL (must equal a positive volume; also the reference volume
        of R_nonlinear), sourced: 'no', value: 1.0e-05}
    q_0: {reference: 'Mynard2015; Supplemental File 1, aortic root: A0 = 6.9419 cm^2, length 1 cm, so A0 l = 6.94 mL = 6.94e-6
        m^3 (as arterial_simple vv); a zero-pressure segment volume used as a generic unstressed volume', sourced: 'yes',
      value: 6.94e-06}
    R: {reference: 'Safaei2018; Table S3 R_par = 10.664e6 J s m^-6 (0.08 mmHg s/mL), pulmonary arteries, used here as a generic
        lumped arterial compartment (as the arterial_simple vp sibling does)', sourced: 'yes', value: 10664000.0}
    K_tube: {reference: 'Olufsen2000; placeholder K = rho c0^2/(m - n), c0^2 = 2/(3 rho) (k1 e^(k2 r0) + k3), k1 = 2e6 Pa,
        k2 = -2253 m^-1, k3 = 8.65e4 Pa (converted from g s^-2 cm^-1, cm^-1), r0 = 0.01508 m, rho = 1050 (vessel_properties
        material_prop_fromPWV formula); normally supplied by a vessel_properties module', sourced: 'no', value: 115333.0}
    m_tube: {reference: 'Boileau2015; Eq. (3) arterial tube law P - Pext = Pd + beta/Ad (sqrt(A) - sqrt(Ad)), i.e. m = 1/2,
        n = 0', sourced: 'yes', value: 0.5}
    n_tube: {reference: 'Boileau2015; Eq. (3) arterial tube law P - Pext = Pd + beta/Ad (sqrt(A) - sqrt(Ad)), i.e. m = 1/2,
        n = 0', sourced: 'yes', value: 0.0}
    u_ext: {reference: definitional; external (transmural reference) pressure taken as 0 Pa gauge when the module is used
        alone, sourced: definitional, value: 0.0}
    I:
      reference: unreferenced_placeholder; inertance 1e5 Pa s^2 m^-3, order of rho l/(pi r^2) for a large artery (1050 x 0.05/(pi
        0.0115^2) = 1.3e5); Safaei2018 Table S3 sets I = 0 for the pulmonary arteries, which this ODE module cannot take
      sourced: 'no'
      value: 100000.0
      also_cites: [Safaei2018]
    u_out: {reference: 'unreferenced_placeholder; boundary condition supplied by the connected neighbour in a network; test
        value 12665.6 Pa (95 mmHg), typical outlet pressure for this vessel class', sourced: 'no', value: 12665.6}
    v_in: {reference: unreferenced_placeholder; boundary condition supplied by the connected neighbour in a network; test
        value 0.0001 m^3/s, sourced: 'no', value: 0.0001}
  validation:
    baseline: {status: pending, reason: 'a single vessel under constant boundary conditions has no measured counterpart; validation
        needs a network assembled from these modules. Candidate: the Boileau et al. (2015) benchmark reference solutions (e.g.
        the aortic-bifurcation and 37-artery test cases, whose 1D reference pressure/flow waveforms are published as supplementary
        data), compared with a chain of these 0D segments (proposal only, not set up).'}
    calibrate: {status: pending, reason: 'a single vessel under constant boundary conditions has no measured counterpart;
        validation needs a network assembled from these modules. Candidate: the Boileau et al. (2015) benchmark reference
        solutions (e.g. the aortic-bifurcation and 37-artery test cases, whose 1D reference pressure/flow waveforms are published
        as supplementary data), compared with a chain of these 0D segments (proposal only, not set up).'}
- vessel_type: arterial
  BC_type: vp
  module_type: vp_type
  sim_time: 60.0
  dt: 0.005
  solver_info: {rtol: 1.0e-07, atol: 1.0e-14}
  reference_solver_info: {rtol: 1.0e-10, atol: 1.0e-16}
  outputs: [u, v, q, q_C, R, C, I]
  invariants:
  - {description: 'R = 8 mu l/(pi r0^4), C = 2 pi r0^3 l/(E h), I = rho l/(pi r0^2), h = r0 (a e^{b r0} + c e^{d r0})', expr: 'np.max(np.abs((np.concatenate((R,
      C, I))) - (np.concatenate((8*mu*l/(np.pi*r_0**4) + 0*t, (2*np.pi*r_0**3*l/(E*r_0*(a_vessel*np.exp(b_vessel*r_0) + c_vessel*np.exp(d_vessel*r_0))))
      + 0*t, rho*l/(np.pi*r_0**2) + 0*t))))) <= 1e-08*(np.max(np.abs(np.concatenate((R, C, I)))) + np.max(np.abs(np.concatenate((8*mu*l/(np.pi*r_0**4)
      + 0*t, (2*np.pi*r_0**3*l/(E*r_0*(a_vessel*np.exp(b_vessel*r_0) + c_vessel*np.exp(d_vessel*r_0)))) + 0*t, rho*l/(np.pi*r_0**2)
      + 0*t))))) + 1e-30'}
  - {description: q = q_C (+ q_C_d) + q_0 with q_0 = pi r0^2 l (unstressed volume from geometry), expr: np.max(np.abs((q)
      - (q_C + np.pi*r_0**2*l))) <= 1e-08*(np.max(np.abs(q)) + np.max(np.abs(q_C + np.pi*r_0**2*l))) + 1e-30}
  - {description: 'u = u_0 + (q - np.pi*r_0**2*l)/(2*np.pi*r_0**3*l/(E*r_0*(a_vessel*np.exp(b_vessel*r_0) + c_vessel*np.exp(d_vessel*r_0))))
      + u_ext + R_v (v_in - v), R_v = 0.01 s/C', expr: np.max(np.abs((u) - (u_0 + (q - np.pi*r_0**2*l)/((2*np.pi*r_0**3*l/(E*r_0*(a_vessel*np.exp(b_vessel*r_0)
      + c_vessel*np.exp(d_vessel*r_0))))) + u_ext + (0.01/((2*np.pi*r_0**3*l/(E*r_0*(a_vessel*np.exp(b_vessel*r_0) + c_vessel*np.exp(d_vessel*r_0))))))*(v_in
      - v)))) <= 1e-08*(np.max(np.abs(u)) + np.max(np.abs(u_0 + (q - np.pi*r_0**2*l)/((2*np.pi*r_0**3*l/(E*r_0*(a_vessel*np.exp(b_vessel*r_0)
      + c_vessel*np.exp(d_vessel*r_0))))) + u_ext + (0.01/((2*np.pi*r_0**3*l/(E*r_0*(a_vessel*np.exp(b_vessel*r_0) + c_vessel*np.exp(d_vessel*r_0))))))*(v_in
      - v)))) + 1e-30}
  - {description: 'volume balance: d(q)/dt = (v_in) - (v) (trapezoidal integral of the flows from t = 0 s, rel. tol 0.05)',
    expr: 'np.max(np.abs((((q) + 0*t)[(t >= 0)] - ((q) + 0*t)[(t >= 0)][0]) - np.concatenate(([0.0], np.cumsum(0.5*((((v_in)
      - (v) + 0*t))[(t >= 0)][1:] + (((v_in) - (v) + 0*t))[(t >= 0)][:-1])*np.diff(t[(t >= 0)])))))) <= 0.05*np.ptp(((q) +
      0*t)[(t >= 0)]) + 1e-5*np.max(np.abs(((q) + 0*t))) + 1e-9*np.max(np.abs(((v_in) - (v) + 0*t)))*t[-1] + 1e-18'}
  - {description: 'steady state at t_end: v = v_in', expr: 'abs((v)[-1] - (v_in)) <= 0.001*(abs(v_in) + 1e-12 + np.max(np.abs(v)))
      + 1e-18'}
  - {description: 'steady state at t_end: u = u_out + R (v_in) + gravity term', expr: 'abs((u)[-1] - (u_out + (8*mu*l/(np.pi*r_0**4))*(v_in)
      + beta_g*rho*g*l*np.cos(theta*np.pi/180))) <= 0.001*(abs(u_out) + 1.0 + np.max(np.abs(u))) + 1e-18'}
  run_parameters: {}
  bc_sweep:
    factors: [0.5, 0.75, 1.0, 1.5, 2.0]
    ranges:
      u_ext: [-500.0, 1000.0]
      theta: [0.0, 90.0]
      u_out: [6000.0, 16000.0]
      v_in: [0.0, 1.256638]
      beta_g: [0.0, 1.0]
      g: [1.0, 9.81]
      a_vessel: [0.2, 1.0]
      b_vessel: [-600.0, 1.0]
      c_vessel: [0.1, 1.0]
      d_vessel: [-15.0, 1.0]
      l: [0.5, 1.5]
      r_0: [0.75, 2.0]
    exclude: []
    rationale: 'Boundary conditions span physiological operating values for the vessel class (arterial inlet 60-150 mmHg,
      venous 0-15 mmHg, flows 0-2x the nominal flow; +-0.5% for the nonlinear vv types, whose volume drifts by (v_in - v_out)
      t and collapses the tube if the imbalance is larger); constants are swept 0.5-2x their value; rho and mu are swept 0.5-2x
      their library (test_fft fixture) value of 1; beta_g 0-1; g 1-9.81; the wall-thickness constants a-d between the fixture
      value 1 and the proposed Blanco 2015 values. The physiological rho/mu (1050, 0.004) cannot yet be combined with the
      others at the run point (framework issue), so the swept regime is the library one. Excluded: tube-law exponents (they
      define the law), switches (R_flag, blood_ctl_dir).'
  timestep:
    scheme: rk4
    dts: [0.002, 0.001, 0.0005, 0.00025]
    t_end: 5.0
    min_order: 0.8
    tol: 0.0001
    cvode_tol: 0.001
  stability:
    t_end: 2.0
    supported:
    - {solver: CVODE_myokit, rtol: 1.0e-07, atol: 1.0e-14}
    time_budget: 10.0
    cvode:
    - {rtol: 0.0001, atol: 1.0e-08}
    - {rtol: 1.0e-06, atol: 1.0e-08}
    - {rtol: 1.0e-07, atol: 1.0e-14}
    solve_ivp: [LSODA]
    fixed_step:
      schemes: [rk4]
      dt_start: 0.01
  notes: 'vp linear R-C-I vessel with coefficients from geometry (Poiseuille R, thin-wall C, inertance I). Jacobian timescales
    (nominal: fastest 0.13 s, slowest decay 2.8 s; run: fastest 2.2e+04 s, slowest decay 6.6e+04 s, shortest oscillation period
    1.5e+05 s).'
  reference_proposals:
    E: {reference: 'unreferenced_placeholder; Young modulus copied from split_junction pv (ADAN_86, 0.4 MPa) (replaces the
        library value 1, a test_fft fixture value; the tests still use the library value)', sourced: 'no', value: 400000.0}
    l: {reference: 'unreferenced_placeholder; geometry copied from a sibling in this file (split_junction pv, ADAN_86) (replaces
        the library value 1, a test_fft fixture value; the tests still use the library value)', sourced: 'no', value: 0.014796}
    r_0: {reference: 'unreferenced_placeholder; geometry copied from a sibling in this file (split_junction pv, ADAN_86) (replaces
        the library value 1, a test_fft fixture value; the tests still use the library value)', sourced: 'no', value: 0.0133364}
    u_0: {reference: 'unreferenced_placeholder; reference pressure 80 mmHg as used by the ADAN-based siblings in this file
        ("AssumedRefOf80mmHg") (replaces the library value 1, a test_fft fixture value; the tests still use the library value)',
      sourced: 'no', value: 10640.0}
    u_ext: {reference: 'definitional; external (transmural reference) pressure taken as 0 Pa gauge when the module is used
        alone (replaces the library value 1, a test_fft fixture value; the tests still use the library value)', sourced: definitional,
      value: 0.0}
    theta: {reference: 'definitional; inclination angle in degrees, only used when beta_g = 1 (the momentum equation has beta_g
        rho g l cos(theta)); 90 = horizontal, as for most siblings in this file (replaces the library value 1, a test_fft
        fixture value; the tests still use the library value)', sourced: definitional, value: 90.0}
    u_out: {reference: 'unreferenced_placeholder; boundary condition supplied by the connected neighbour in a network; test
        value 12665.6 Pa (95 mmHg), typical outlet pressure for this vessel class (replaces the library value 1, a test_fft
