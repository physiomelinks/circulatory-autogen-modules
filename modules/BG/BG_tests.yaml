      + np.max(np.abs(np.concatenate((u_0 + q_C/(C/2) + u_ext + 2*(0.01/(C))*(v_in - v), u_0 + q_C_d/(C/2) + u_ext + 2*(0.01/(C))*(v
      - (v_out_1 + v_out_2))))))) + 1e-30'}
