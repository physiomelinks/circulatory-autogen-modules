    hr_ratio: *id034
    E: *id035
    K_m: &id054 {reference: 'Toro2022; Sec. 2.1.1: venous viscoelastic parameter K_M = 5e4 dyn s/cm^2 = 5e3 Pa s', sourced: 'yes',
      value: 5000}
    nu: *id008
    SMvolfrac_ven: {reference: 'Toro2022; Sec. 2.1.1: smooth-muscle volume fraction 8% for veins', sourced: 'yes', value: 0.08}
  expected_failures: {run_test: 'CellML defect: K_tube_visco uses h, which is not declared or computed in material_prop_visco_const_ven_type
      (model rejected: "ci element h does not correspond with any variable"). In a patched copy with h = hr_ratio r_0 every
