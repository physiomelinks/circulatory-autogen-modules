module: vessel_properties
reviewed: false
known_issues: []
defaults:
  sim_time: 0.1
  pre_time: 0.0
  dt: 0.01
  solver: CVODE_myokit
  bc_sweep:
    factors: [0.5, 0.75, 1.0, 1.5, 2.0]
    ranges: {}
  timestep:
    scheme: rk4
    dts: [0.004, 0.002, 0.001, 0.0005]
    min_order: 0.8
    tol: 0.0001
    cvode_tol: 0.001
    t_end: 0.1
  stability:
    supported:
    - {solver: CVODE_myokit, rtol: 1.0e-06, atol: 1.0e-08}
components:
- vessel_type: material_prop_const
  BC_type: nn
  module_type: material_prop_const_type
  outputs: [K_tube, h]
  invariants:
  - &id001 {description: 'wall thickness follows the Avolio/Blanco fit h = r0 (a e^{b r0} + c e^{d r0}) (relative 1e-9)',
    expr: np.max(np.abs((h) - (r_0*(a_vessel*np.exp(b_vessel*r_0) + c_vessel*np.exp(d_vessel*r_0))))) <= 1e-9*np.max(np.abs(r_0*(a_vessel*np.exp(b_vessel*r_0)
      + c_vessel*np.exp(d_vessel*r_0))))}
  - &id002 {description: thin-wall tube stiffness K_tube = E h / ((1 − ν²) r0) (relative 1e-9), expr: np.max(np.abs((K_tube)
      - (E*(r_0*(a_vessel*np.exp(b_vessel*r_0) + c_vessel*np.exp(d_vessel*r_0)))/((1 - nu**2)*r_0)))) <= 1e-9*np.max(np.abs(E*(r_0*(a_vessel*np.exp(b_vessel*r_0)
      + c_vessel*np.exp(d_vessel*r_0)))/((1 - nu**2)*r_0)))}
  - &id003 {description: stiffness and wall thickness are positive and h/r0 is between 0 and 0.5 (thin wall), expr: (np.all(K_tube
      > 0)) & np.all((h > 0) & (h/r_0 < 0.5))}
  bc_sweep:
    ranges:
      r_0: &id004 {min: 0.001, max: 0.016, points: 5, scale: log}
      E: &id005 {min: 50000.0, max: 2000000.0, points: 5, scale: log}
      nu: &id006 [0.3, 0.5]
    rationale: Arterial radii 1-16 mm (small arteries to the aorta, ADAN range) and lengths 0.5-20 cm; E 0.05-2 MPa (identified
      value to above the ADAN elastin/large-artery range); nu 0.3-0.5; wall viscosity K_M 1e3-1e5 Pa s around Toro2022/Muller2023
      (3-3.6e4) and smooth-muscle fractions 0.05-0.55 (Muller2023 weights 0.10-0.55); Olufsen-type k1 1e5-3e6 Pa, k2 -2500..-500
      m^-1, k3 2e4-1e5 Pa spanning the Toro2022 and Olufsen2000 sets; rho 1040-1060 kg/m^3; tube-law exponents around m =
      0.5, n = 0. The Avolio/Blanco thickness-fit coefficients are swept by factors 0.5-2.
  notes: 'Arterial wall stiffness for a vessels tube law: wall thickness from the Avolio/Blanco radius fit h(r0), and K_tube
    = E h / ((1 − ν²) r0) (Pa). Algebraic: connected to a vessel that supplies r_0 and receives K_tube; tested alone with
    r_0 as a parameter.'
  reference_proposals:
    r_0: &id007 {reference: 'circulatory_autogen; ADAN-86 ascending aorta (segment 1) radius used in cvs_model_with_arm_0d
        (ADAN_86, from Safaei2016 / Blanco2015 geometry); the per-vessel value is not printed in those papers. Only a test
        value: r_0 is supplied by the connected vessel', sourced: 'no', value: 0.015642}
    E: {reference: 'unreferenced_placeholder; same value as material_prop_visco_const E (identified by calibration of cvs_model_0d,
        07_02_2026). For comparison the ADAN elastin modulus is E_e = 4.0e6 dyn/cm^2 = 0.4 MPa (Muller2023 Sec. 2.4.2.1),
        0.34 MPa for large arteries after the 0.85 elastin weight', sourced: 'no', value: 108067.60432}
    nu: &id008 {reference: 'Alastruey2011; Eq. (3): Poisson ratio sigma = 0.5 (incompressible wall); gives K = E h / ((1 -
        nu^2) r0) = 4Eh/(3r0), Eq. (4)', sourced: 'yes'}
    a_vessel: &id009 {reference: 'Muller2023; Eq. (43): h = r0 (a e^{b r0} + c e^{d r0}), a = 0.2802 (fit by Blanco2015 to
        the wall-thickness data of Avolio1980; Avolio1980 itself not read)', sourced: 'yes'}
    b_vessel: &id010 {reference: 'Muller2023; Eq. (43): b = -5.053 cm^-1 = -505.3 m^-1 (fit by Blanco2015 to Avolio1980 data)',
      sourced: 'yes'}
    c_vessel: &id011 {reference: 'Muller2023; Eq. (43): c = 0.1324 (fit by Blanco2015 to Avolio1980 data)', sourced: 'yes'}
    d_vessel: &id012 {reference: 'Muller2023; Eq. (43): d = -0.1114 cm^-1 = -11.14 m^-1 (fit by Blanco2015 to Avolio1980 data)',
      sourced: 'yes'}
  validation: &id013
    baseline: {status: pending, reason: 'candidate: compare the implied wave speed c0 = sqrt(K_tube (m - n)/rho) with measured
        pulse wave velocities of named arteries vs radius (e.g. the Charlton2019 in-silico/in-vivo PWV database or Avolio1980
        segment data); needs a network-level geometry table, not set up.'}
    calibrate: {status: not_applicable, reason: algebraic constitutive relation with no dynamics; parameters are calibrated
        in the vessel network that uses it.}
- vessel_type: material_prop_visco_const
  BC_type: nn
  module_type: material_prop_visco_const_type
  outputs: [K_tube, K_tube_visco, h, Gamma]
  invariants:
  - *id001
  - *id002
  - *id003
  - &id017 {description: wall viscosity Γ = SMvolfrac_art · K_m (relative 1e-12), expr: np.max(np.abs((Gamma) - (SMvolfrac_art*K_m)))
      <= 1e-12*np.max(np.abs(SMvolfrac_art*K_m))}
  - {description: 'lumped visco-elastic coefficient K_tube_visco = (2/3) Γ h / (l π r0³) (the 0D form of the Kelvin-Voigt
      term, Alastruey2011 Eq. 4) (relative 1e-9)', expr: np.max(np.abs((K_tube_visco) - ((2.0/3.0)*Gamma*(h)/(l*np.pi*r_0**3))))
      <= 1e-9*np.max(np.abs((2.0/3.0)*Gamma*(h)/(l*np.pi*r_0**3)))}
  bc_sweep:
    ranges:
      r_0: *id004
      l: &id018 {min: 0.005, max: 0.2, points: 4, scale: log}
      E: *id005
      nu: *id006
      K_m: &id019 {min: 1000.0, max: 100000.0, points: 3, scale: log}
      SMvolfrac_art: &id020 [0.05, 0.55]
    rationale: Arterial radii 1-16 mm (small arteries to the aorta, ADAN range) and lengths 0.5-20 cm; E 0.05-2 MPa (identified
      value to above the ADAN elastin/large-artery range); nu 0.3-0.5; wall viscosity K_M 1e3-1e5 Pa s around Toro2022/Muller2023
      (3-3.6e4) and smooth-muscle fractions 0.05-0.55 (Muller2023 weights 0.10-0.55); Olufsen-type k1 1e5-3e6 Pa, k2 -2500..-500
      m^-1, k3 2e4-1e5 Pa spanning the Toro2022 and Olufsen2000 sets; rho 1040-1060 kg/m^3; tube-law exponents around m =
      0.5, n = 0. The Avolio/Blanco thickness-fit coefficients are swept by factors 0.5-2.
  notes: 'As material_prop_const, plus a lumped visco-elastic coefficient: wall viscosity Γ = SMvolfrac_art K_m (Toro2022)
    and K_tube_visco = (2/3) Γ h/(l π r0³) (Pa s m^-3), the 0D (volume-rate) form of the Kelvin-Voigt wall term of Alastruey2011
    / Toro2022. Used by BG arterial vv_nonlinear_visco vessels in cvs_model_with_arm_0d.'
  reference_proposals:
    l: &id027 {reference: 'circulatory_autogen; ADAN-86 ascending aorta (segment 1) length used in cvs_model_with_arm_0d (ADAN_86);
        not checkable in the papers. Only a test value: l is supplied by the connected vessel', sourced: 'no', value: 0.0153234}
    r_0: *id007
    E: {reference: 'unreferenced_placeholder; identified by calibration of cvs_model_0d (07_02_2026); no literature source.
        ADAN elastin modulus for comparison: 0.4 MPa (Muller2023 Sec. 2.4.2.1)', sourced: 'no'}
    K_m: {reference: 'Toro2022; Sec. 2.1.1: arterial viscoelastic parameter K_M = 3e5 dyn s/cm^2 = 3e4 Pa s (wall viscosity
        = K_M x smooth-muscle fraction)', sourced: 'yes'}
    SMvolfrac_art: {reference: 'Toro2022; Sec. 2.1.1: smooth-muscle volume fraction 10% for arteries', sourced: 'yes'}
    nu: *id008
    a_vessel: *id009
    b_vessel: *id010
    c_vessel: *id011
    d_vessel: *id012
  validation: *id013
- vessel_type: material_prop_fromPWV
  BC_type: nn
  module_type: material_prop_fromPWV_type
  outputs: [K_tube, c0]
  invariants:
  - &id014 {description: 'Olufsen wave speed c0 = sqrt(2/(3ρ) (k1 e^{k2 r0} + k3)) (relative 1e-9)', expr: np.max(np.abs((c0)
      - ((2.0/(3.0*rho)*(k_1*np.exp(k_2*r_0) + k_3))**0.5))) <= 1e-9*np.max(np.abs((2.0/(3.0*rho)*(k_1*np.exp(k_2*r_0) + k_3))**0.5))}
  - &id015 {description: 'K_tube = ρ c0² / (m − n), i.e. the tube law reproduces the wave speed c0 at A = A0 (relative 1e-9)',
    expr: np.max(np.abs((K_tube) - (rho*c0**2/(m_tube - n_tube)))) <= 1e-9*np.max(np.abs(rho*c0**2/(m_tube - n_tube)))}
  - &id016 {description: 'at the run point the arterial wave speed is physiological, 3-15 m/s', expr: '(c0[0] >= 3) & (c0[0]
      <= 15)', applies: run}
  bc_sweep:
    ranges:
      r_0: *id004
      k_1: &id021 {min: 100000.0, max: 3000000.0, points: 4, scale: log}
      k_2: &id022 [-2500.0, -500.0]
      k_3: &id023 [20000.0, 100000.0]
      rho: &id024 [1040.0, 1060.0]
      m_tube: &id025 [0.25, 1.0]
      n_tube: &id026 [-0.5, 0.0]
    rationale: Arterial radii 1-16 mm (small arteries to the aorta, ADAN range) and lengths 0.5-20 cm; E 0.05-2 MPa (identified
      value to above the ADAN elastin/large-artery range); nu 0.3-0.5; wall viscosity K_M 1e3-1e5 Pa s around Toro2022/Muller2023
      (3-3.6e4) and smooth-muscle fractions 0.05-0.55 (Muller2023 weights 0.10-0.55); Olufsen-type k1 1e5-3e6 Pa, k2 -2500..-500
      m^-1, k3 2e4-1e5 Pa spanning the Toro2022 and Olufsen2000 sets; rho 1040-1060 kg/m^3; tube-law exponents around m =
      0.5, n = 0. The Avolio/Blanco thickness-fit coefficients are swept by factors 0.5-2.
  notes: 'Arterial stiffness from an empirical wave speed: c0 = sqrt(2/(3ρ)(k1 e^{k2 r0} + k3)) (Olufsen; Toro2022 Eq. 84)
    and K_tube = ρ c0²/(m − n) so that the tube law p = K[(A/A0)^m − (A/A0)^n] has wave speed c0 at A0.'
  reference_proposals:
    r_0: *id007
    m_tube: &id028 {reference: 'Toro2022; Eqs. (2)-(5): tube-law exponents m = 0.5, n = 0 for arteries', sourced: 'yes', value: 0.5}
    n_tube: &id029 {reference: 'Toro2022; Eqs. (2)-(5): tube-law exponents m = 0.5, n = 0 for arteries', sourced: 'yes', value: 0.0}
    rho: &id039 {reference: 'Trudnowski1974; whole-blood specific gravity 1.0506 at 37 C (n = 25) = 1050.6 kg/m^3 (abstract
        values read via a search rendering, full text not read). 1050 is also used by Alastruey2011; Toro2022 use 1060', sourced: 'yes',
      value: 1050}
    k_1: {reference: 'Toro2022; Eq. (84) (after Olufsen1999): k1 = 3e6 g s^-2 cm^-1 = 3e5 Pa. Olufsen2000 values (2e7 g s^-2
        cm^-1 = 2e6 Pa, via Duanmu et al. 2019) give a stiffer aorta (c0 7.4 vs 5.0 m/s)', sourced: 'yes', value: 300000.0}
    k_2: {reference: 'Toro2022; Eq. (84): k2 = -7 cm^-1 = -700 m^-1 (Olufsen2000: -22.53 cm^-1, secondary)', sourced: 'yes',
      value: -700.0}
    k_3: {reference: 'Toro2022; Eq. (84): k3 = 40e4 g s^-2 cm^-1 = 4e4 Pa (Olufsen2000: 8.65e5 g s^-2 cm^-1 = 8.65e4 Pa, secondary)',
      sourced: 'yes', value: 40000.0}
  validation: *id013
- vessel_type: material_prop_visco_fromPWV
  BC_type: nn
  module_type: material_prop_visco_fromPWV_type
  outputs: [K_tube, K_tube_visco, c0, Gamma]
  invariants:
  - *id014
  - *id015
  - *id016
  - *id017
  - {description: 'lumped visco-elastic coefficient K_tube_visco = (2/3) Γ h / (l π r0³) (the 0D form of the Kelvin-Voigt
      term, Alastruey2011 Eq. 4) (relative 1e-9)', expr: np.max(np.abs((K_tube_visco) - ((2.0/3.0)*Gamma*(r_0*(a_vessel*np.exp(b_vessel*r_0)
      + c_vessel*np.exp(d_vessel*r_0)))/(l*np.pi*r_0**3)))) <= 1e-9*np.max(np.abs((2.0/3.0)*Gamma*(r_0*(a_vessel*np.exp(b_vessel*r_0)
      + c_vessel*np.exp(d_vessel*r_0)))/(l*np.pi*r_0**3)))}
  bc_sweep:
    ranges:
      r_0: *id004
      l: *id018
      K_m: *id019
      SMvolfrac_art: *id020
      k_1: *id021
      k_2: *id022
      k_3: *id023
      rho: *id024
      m_tube: *id025
      n_tube: *id026
    rationale: Arterial radii 1-16 mm (small arteries to the aorta, ADAN range) and lengths 0.5-20 cm; E 0.05-2 MPa (identified
      value to above the ADAN elastin/large-artery range); nu 0.3-0.5; wall viscosity K_M 1e3-1e5 Pa s around Toro2022/Muller2023
      (3-3.6e4) and smooth-muscle fractions 0.05-0.55 (Muller2023 weights 0.10-0.55); Olufsen-type k1 1e5-3e6 Pa, k2 -2500..-500
      m^-1, k3 2e4-1e5 Pa spanning the Toro2022 and Olufsen2000 sets; rho 1040-1060 kg/m^3; tube-law exponents around m =
      0.5, n = 0. The Avolio/Blanco thickness-fit coefficients are swept by factors 0.5-2.
  notes: 'material_prop_fromPWV plus the lumped visco-elastic coefficient K_tube_visco = (2/3) Γ h/(l π r0³). The equation
    uses a wall thickness h that the component never defines or imports. See review.proposed_fixes: as written the CellML
    does not generate.'
  reference_proposals:
    l: *id027
    r_0: *id007
    K_m: {reference: 'Toro2022; Sec. 2.1.1: arterial viscoelastic parameter K_M = 3e5 dyn s/cm^2 = 3e4 Pa s', sourced: 'yes',
      value: 30000}
    m_tube: *id028
    n_tube: *id029
  expected_failures: {run_test: 'CellML defect: K_tube_visco uses h, which is not declared or computed in material_prop_visco_fromPWV_type,
      so libcellml/Myokit reject the model ("ci element h does not correspond with any variable"). In a patched copy (h =
      r0 (a e^{b r0} + c e^{d r0}) as in material_prop_visco_const, with a..d_vessel added to the config) every verification
      test passes.', verification_test_invariants: 'CellML defect: K_tube_visco uses h, which is not declared or computed
      in material_prop_visco_fromPWV_type, so libcellml/Myokit reject the model ("ci element h does not correspond with any
      variable"). In a patched copy (h = r0 (a e^{b r0} + c e^{d r0}) as in material_prop_visco_const, with a..d_vessel added
      to the config) every verification test passes.', verification_test_BC: 'CellML defect: K_tube_visco uses h, which is
      not declared or computed in material_prop_visco_fromPWV_type, so libcellml/Myokit reject the model ("ci element h does
      not correspond with any variable"). In a patched copy (h = r0 (a e^{b r0} + c e^{d r0}) as in material_prop_visco_const,
      with a..d_vessel added to the config) every verification test passes.', verification_test_timestep: 'CellML defect:
      K_tube_visco uses h, which is not declared or computed in material_prop_visco_fromPWV_type, so libcellml/Myokit reject
      the model ("ci element h does not correspond with any variable"). In a patched copy (h = r0 (a e^{b r0} + c e^{d r0})
      as in material_prop_visco_const, with a..d_vessel added to the config) every verification test passes.', stability_test: 'CellML
      defect: K_tube_visco uses h, which is not declared or computed in material_prop_visco_fromPWV_type, so libcellml/Myokit
      reject the model ("ci element h does not correspond with any variable"). In a patched copy (h = r0 (a e^{b r0} + c e^{d
      r0}) as in material_prop_visco_const, with a..d_vessel added to the config) every verification test passes.'}
  validation: *id013
- vessel_type: material_prop_const_ven
  BC_type: nn
  module_type: material_prop_const_ven_type
  outputs: [K_tube]
  invariants:
  - &id030 {description: venous (collapsible-tube) stiffness K_tube = E (h/r0)³ / (12 (1 − ν²)) (relative 1e-9), expr: np.max(np.abs((K_tube)
      - (E/(12*(1 - nu**2))*hr_ratio**3))) <= 1e-9*np.max(np.abs(E/(12*(1 - nu**2))*hr_ratio**3))}
  - {description: K_tube is positive, expr: np.all(K_tube > 0)}
  bc_sweep:
    ranges:
      hr_ratio: &id031 [0.02, 0.1]
      E: &id032 {min: 200000.0, max: 10000000.0, points: 4, scale: log}
      nu: &id033 [0.3, 0.5]
    rationale: 'Venous radii 0.8-8 mm (the Toro2022 venous network range, which the c0(r0) law requires: r0_min <= r0 <= r0_max),
      lengths 0.5-20 cm, h/r0 0.02-0.1, venous E 0.2-10 MPa (Petrova2025 initial to tangent moduli), K_M 1e3-1e5 Pa s, smooth-muscle
      fraction 0.04-0.2, venous tube-law exponents m 5-12, n -2..-1, c0 bounds 3-5 / 1-2 m/s and radius bounds 6-12 / 0.5-2
      mm (r_0 = 5 mm stays inside).'
  notes: 'Venous (collapsible-tube) stiffness from wall bending: K_tube = E (h/r0)³ / (12 (1 − ν²)) (the Shapiro1977 thin-shell
    law used in Muller2014-type venous tube laws). Note that with h/r0 = 0.05 and E ~ 1 MPa this gives K ≈ 15 Pa, far softer
    than the c0-based venous K (≈ 200-1500 Pa for c0 = 1.5-4 m/s).'
  reference_proposals:
    hr_ratio: &id034 {reference: 'Toro2022; venous wall thickness h0 = 5% of r0 (h/r0 = 0.05, citing Blanco2015)', sourced: 'yes',
      value: 0.05}
    E: &id035 {reference: 'Petrova2025; Table 1: human great saphenous vein circumferential initial Young modulus 1.15 +-
        0.84 MPa (0-0.5 kPa stress); basilic vein 2.13 +- 3.10 MPa. Peripheral veins, strongly nonlinear; no human vena-cava
        value found', sourced: 'yes', value: 1150000.0}
    nu: *id008
  validation: &id036
    baseline: {status: pending, reason: 'candidate: venous wave speeds vs radius (the Toro2022 / Muller2014 c0 range 1.5-4
        m/s is a model choice, not data); no measured venous stiffness-radius dataset identified yet.'}
    calibrate: {status: not_applicable, reason: algebraic constitutive relation with no dynamics; calibrated in the network
        that uses it.}
- vessel_type: material_prop_visco_const_ven
  BC_type: nn
  module_type: material_prop_visco_const_ven_type
  outputs: [K_tube, K_tube_visco, Gamma]
  invariants:
  - *id030
  - &id042 {description: wall viscosity Γ = SMvolfrac_ven · K_m (relative 1e-12), expr: np.max(np.abs((Gamma) - (SMvolfrac_ven*K_m)))
