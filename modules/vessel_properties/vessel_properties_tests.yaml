      <= 1e-9*np.max(np.abs((2.0/3.0)*Gamma*(hr_ratio*r_0)/(l*np.pi*r_0**3)))}
  bc_sweep:
    ranges:
      r_0: &id037 {min: 0.0008, max: 0.008, points: 5, scale: log}
      l: &id043 {min: 0.005, max: 0.2, points: 4, scale: log}
      hr_ratio: *id031
      E: *id032
      nu: *id033
      K_m: &id044 {min: 1000.0, max: 100000.0, points: 3, scale: log}
      SMvolfrac_ven: &id045 [0.04, 0.2]
    rationale: 'Venous radii 0.8-8 mm (the Toro2022 venous network range, which the c0(r0) law requires: r0_min <= r0 <= r0_max),
      lengths 0.5-20 cm, h/r0 0.02-0.1, venous E 0.2-10 MPa (Petrova2025 initial to tangent moduli), K_M 1e3-1e5 Pa s, smooth-muscle
      fraction 0.04-0.2, venous tube-law exponents m 5-12, n -2..-1, c0 bounds 3-5 / 1-2 m/s and radius bounds 6-12 / 0.5-2
      mm (r_0 = 5 mm stays inside).'
  notes: 'material_prop_const_ven plus K_tube_visco = (2/3) Γ h/(l π r0³) with Γ = SMvolfrac_ven K_m. The equation uses h,
