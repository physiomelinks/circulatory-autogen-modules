module_type: heart_new_valve
version: vp
reviewed: false
notes: 'heart_new_valve: heart_simple with a modified valve loss B = Rmod rho /(A_eff + eps) (instead of rho/(2 A_eff^2))
  and valve velocity outputs vel = v/A_nn. Same harness.'
expected_failures:
  verification_test_timestep: 'RK4 self-convergence is not monotone: normalised differences between successive step sizes
    are 1.5e-3, 2.6e-4, 3.9e-4 for dt 2e-4 -> 2.5e-5; the largest differences are in A_eff_miv / A_eff_trv / v_miv around
    mitral and tricuspid closure and the atrial kick (t ~ 0.47 and 0.97 s). The valve-state law is only piecewise smooth (dzeta/dt
    switches branch at dp = 0; zeta = max(zeta_pre, 0) clamp; floor() phase variables), so the fixed-step solution cannot
    show the RK4 order. The finest fixed-step run agrees with tight CVODE to 1.3e-4 (normalised), so the solution itself is
    consistent.'
  verification_test_invariants: Aortic backflow is 16% and pulmonary backflow 8% of the forward volume over the last cycle
    (tricuspid/mitral 0%), versus 1.3% aortic backflow for heart_simple with the same parameters. B = Rmod rho/(A_eff + eps)
    grows only as 1/A_eff as the valve closes (rho/(2 A_eff^2) in Mynard 2012), so closure is leaky. Depends on the placeholder
    Rmod = 3000 (TODO in the csv) and on the unit issue in proposed_fixes.
