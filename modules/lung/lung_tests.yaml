module: lung
reviewed: false
known_issues: []
defaults:
  sim_time: 2.0
  pre_time: 0.0
  dt: 0.01
  solver: CVODE_myokit
  bc_sweep:
    factors:
    - 0.5
    - 0.75
    - 1.0
    - 1.5
    - 2.0
    ranges: {}
  timestep:
    scheme: rk4
    dts:
    - 0.004
    - 0.002
    - 0.001
    - 0.0005
    min_order: 0.8
    tol: 0.0001
    cvode_tol: 0.001
  stability:
    supported:
    - solver: CVODE_myokit
      rtol: 1.0e-06
      atol: 1.0e-08
components:
- vessel_type: simple_lung_bg
  BC_type: nn
  module_type: simple_lung_bond_graph_type
  notes: 'Respiratory mechanics after Albanese et al. (2016) / Rideout-Fukui: series larynx (extrathoracic), trachea, bronchi and alveoli, each
    a linear compliance with a resistance to the next, the intrathoracic ones referenced to pleural pressure. Differences from Albanese: the chest
    wall is a pleural compliance C_pl charged through a resistance R_plwall from the muscle pressure generator P_mus (Albanese: P_pl follows P_mus
    through C_cw directly), and alpha_LR scales all airway resistances. P_mus is the Albanese parabolic/exponential profile (eq. 2-6) offset to
    P_plEE, with breathing rate and amplitude adjustable by controller inputs Delta_RR_resp / Delta_P_mus. Initial volumes are hard-coded in the
    CellML (q_l = 10 L, q_t = q_b = 1 L), giving a violent ~50 ms start-up transient.'
  sim_time: 30.0
  dt: 0.005
  outputs:
  - P_l
  - P_t
  - P_b
  - P_A
  - P_pl
  - P_mus
  - q_l
  - q_t
  - q_b
  - q_A_stressed
  - q_pl
  - q_A
  - q_D
  - v_ml
  invariants:
  - description: P_mus equals the exact Albanese (2016, eq. 2-6) waveform evaluated at t (parabolic inspiration, exponential expiration, tau =
      T_E/5, period 1/(1/T_resp + flag Delta_RR))
    expr: np.max(np.abs(P_mus - (np.where((np.mod(t/(1/(1/T_resp + flag_RR_control*Delta_RR_resp)), 1.0)*T_resp) < ((T_resp/(1 + IE_ratio))*IE_ratio),
      (P_plEE + np.maximum(-flag_P_mus_control*Delta_P_mus, 0)) - ((P_mus_min + flag_P_mus_control*Delta_P_mus) - (P_plEE + np.maximum(-flag_P_mus_control*Delta_P_mus,
      0)))/(((T_resp/(1 + IE_ratio))*IE_ratio)*(T_resp/(1 + IE_ratio)))*(np.mod(t/(1/(1/T_resp + flag_RR_control*Delta_RR_resp)), 1.0)*T_resp)**2
      + ((P_mus_min + flag_P_mus_control*Delta_P_mus) - (P_plEE + np.maximum(-flag_P_mus_control*Delta_P_mus, 0)))*T_resp/(((T_resp/(1 + IE_ratio))*IE_ratio)*(T_resp/(1
      + IE_ratio)))*(np.mod(t/(1/(1/T_resp + flag_RR_control*Delta_RR_resp)), 1.0)*T_resp), (P_plEE + np.maximum(-flag_P_mus_control*Delta_P_mus,
      0)) + ((P_mus_min + flag_P_mus_control*Delta_P_mus) - (P_plEE + np.maximum(-flag_P_mus_control*Delta_P_mus, 0)))/(1 - np.exp(-(T_resp/(1
      + IE_ratio))/((T_resp/(1 + IE_ratio))/5)))*(np.exp(-((np.mod(t/(1/(1/T_resp + flag_RR_control*Delta_RR_resp)), 1.0)*T_resp) - ((T_resp/(1
      + IE_ratio))*IE_ratio))/((T_resp/(1 + IE_ratio))/5)) - np.exp(-(T_resp/(1 + IE_ratio))/((T_resp/(1 + IE_ratio))/5))))))) <= 1e-4*abs((P_mus_min
      + flag_P_mus_control*Delta_P_mus) - (P_plEE + np.maximum(-flag_P_mus_control*Delta_P_mus, 0))) + 1e-6
  - description: 'airway volume balance: q_l + q_t + q_b + q_A_stressed changes by the time integral of the mouth flow v_ml (trapezoid, after
      the 0.5 s start-up transient)'
    expr: np.max(np.abs(((q_l + q_t + q_b + q_A_stressed) - np.concatenate(([0.0], np.cumsum(0.5*np.diff(t)*((v_ml)[1:] + (v_ml)[:-1])))))[t >=
      0.5] - ((q_l + q_t + q_b + q_A_stressed) - np.concatenate(([0.0], np.cumsum(0.5*np.diff(t)*((v_ml)[1:] + (v_ml)[:-1])))))[t >= 0.5][0]))
      <= 2e-3*np.ptp((q_l + q_t + q_b + q_A_stressed)[t >= 0.5]) + 1e-9
  - description: 'thoracic volume balance: q_pl + q_t + q_b + q_A_stressed changes only through the chest-wall flow (P_mus - P_pl)/R_plwall'
    expr: np.max(np.abs(((q_pl + q_t + q_b + q_A_stressed) - np.concatenate(([0.0], np.cumsum(0.5*np.diff(t)*(((P_mus - P_pl)/R_plwall)[1:] +
      ((P_mus - P_pl)/R_plwall)[:-1])))))[t >= 0.5] - ((q_pl + q_t + q_b + q_A_stressed) - np.concatenate(([0.0], np.cumsum(0.5*np.diff(t)*(((P_mus
      - P_pl)/R_plwall)[1:] + ((P_mus - P_pl)/R_plwall)[:-1])))))[t >= 0.5][0])) <= 2e-3*np.ptp((q_pl + q_t + q_b + q_A_stressed)[t >= 0.5]) +
      1e-9
  - description: 'constitutive relations: P_A = q_A_stressed/C_A + P_pl, P_pl = q_pl/C_pl, q_A = q_A_stressed + q_A_us'
    expr: (np.max(np.abs(P_A - (q_A_stressed/C_A + P_pl))) <= 1e-6*np.max(np.abs(P_A)) + 1e-9) & (np.max(np.abs(P_pl - q_pl/C_pl)) <= 1e-6*np.max(np.abs(P_pl))
      + 1e-9) & (np.max(np.abs(q_A - q_A_stressed - q_A_us)) <= 1e-12)
  - description: dead space q_D = max(q_l + q_t + q_b + unstressed volumes, q_D_min) and alveolar volume stays positive
    expr: (np.max(np.abs(q_D - np.maximum(q_l + q_t + q_b + q_l_us + q_t_us + q_b_us, q_D_min))) <= 1e-12) & np.all(q_A > 0)
  bc_sweep:
    ranges:
      Delta_RR_resp:
        min: -0.08
        max: 0.3
        points: 5
      Delta_P_mus:
        min: -800
        max: 300
        points: 5
      P_mus_min:
        min: -2000
        max: -600
        points: 5
      P_plEE:
        min: -900
        max: -200
        points: 5
      T_resp:
        min: 2.0
        max: 8.0
        points: 5
      IE_ratio:
        min: 0.3
        max: 1.0
        points: 4
      flag_P_mus_control:
        min: 0
        max: 1
        points: 2
      flag_RR_control:
        min: 0
        max: 1
        points: 2
      q_D_min:
        min: 0.0
        max: 0.0001
        points: 3
      alpha_LR:
        min: 0.5
        max: 3.0
        points: 4
    rationale: Breathing rate 7.5-30 /min via T_resp and via the controller input Delta_RR (-0.08..+0.3 /s around 0.2 /s), inspiratory effort
      1-15 cmH2O (P_mus_min, Delta_P_mus), end-expiratory pleural pressure -9..-2 cmH2O, I:E 0.3-1, airway resistance multiplier 0.5-3 (bronchoconstriction).
      Compliances, resistances and unstressed volumes use the default 0.5-2x factors.
  timestep:
    t_end: 2.0
    dts:
    - 0.0005
    - 0.00025
    - 0.000125
    - 6.25e-05
  reference_proposals:
    flag_P_mus_control:
      reference: 'definitional; switch: 1 = muscle-pressure amplitude follows the controller input Delta_P_mus'
      sourced: definitional
    flag_RR_control:
      reference: 'definitional; switch: 1 = rate follows the controller input Delta_RR_resp'
      sourced: definitional
    P_mus_min:
      reference: 'Albanese2014; P_mus,min = -5 cmH2O relative to baseline (Table 2-5, [MODEL], tuned for VT ~ 500 ml); here absolute: P_plEE -
        490 Pa = -980 Pa'
      sourced: 'yes'
    P_plEE:
      reference: Albanese2014; P_pl,EE = -5 cmH2O = -490 Pa (Table 2-5, citing West2008)
      sourced: 'yes'
    q_D_min:
      reference: unreferenced_placeholder; numerical floor on dead-space volume (10 ml)
      sourced: 'no'
    q_l_us:
      reference: Albanese2014; V_u,l = 34.4 ml (Table 2-5, from Fukui1972) = 3.44e-5 m3
      sourced: 'yes'
    q_t_us:
      reference: Albanese2014; V_u,t = 6.63 ml (Table 2-5, from Fukui1972) = 6.63e-6 m3
      sourced: 'yes'
    q_b_us:
      reference: Albanese2014; V_u,b = 18.7 ml (Table 2-5, from Rideout1991/Fukui1972) = 1.87e-5 m3
      sourced: 'yes'
    q_A_us:
      reference: Albanese2014; V_u,A = 1.263 L (Table 2-5, set so FRC = 2.4 L) = 1.263e-3 m3. LIBRARY VALUE 1.26e-6 m3 IS 1000x TOO SMALL (ml/L
        slip) -- see proposed fix
      sourced: 'yes'
    R_ml:
      reference: Albanese2014; R_ml = 1.021 cmH2O s/L (Table 2-5, from Rideout1991) = 1.001e5 Pa s/m3 (1 cmH2O s/L = 9.807e4 Pa s/m3). Library
        2.5e5 is 2.5x larger; the reason for the change is not recorded
      sourced: 'yes'
    R_lt:
      reference: Albanese2014; R_lt = 0.3369 cmH2O s/L = 3.304e4 Pa s/m3. Library 8.5e4 (2.6x)
      sourced: 'yes'
    R_tb:
      reference: Albanese2014; R_tb = 0.3063 cmH2O s/L = 3.004e4 Pa s/m3. Library 8.0e4 (2.7x)
      sourced: 'yes'
    R_bA:
      reference: Albanese2014; R_bA = 0.0817 cmH2O s/L = 8.01e3 Pa s/m3. Library 2.2e4 (2.7x)
      sourced: 'yes'
    R_plwall:
      reference: unreferenced_placeholder; chest-wall resistance is not in Albanese (chest-wall viscous resistance neglected there); library 1e4
        Pa s/m3
      sourced: 'no'
    alpha_LR:
      reference: definitional; airway-resistance multiplier, 1 = nominal
      sourced: definitional
    C_l:
      reference: Albanese2014; C_l = 0.00127 L/cmH2O (Table 2-5, from Fukui1972) = 1.295e-8 m6/J (1 L/cmH2O = 1.0197e-5 m6/J)
      sourced: 'yes'
    C_t:
      reference: Albanese2014; C_t = 0.00238 L/cmH2O (Table 2-5, from Fukui1972) = 2.427e-8 m6/J
      sourced: 'yes'
    C_b:
      reference: Albanese2014; C_b = 0.0131 L/cmH2O (Table 2-5, from Fukui1972) = 1.336e-7 m6/J. LIBRARY 1.34e-6 IS 10x LARGER (not noted in the
        csv)
      sourced: 'yes'
    C_A:
      reference: Albanese2014; C_A = 0.2 L/cmH2O (Table 2-5, from Fukui1972) = 2.04e-6 m6/J. Library 2.04e-5 (10x, "to get ~3 L") -- with q_A_us
        1000x small this gives an end-expiratory lung volume of ~14 L
      sourced: 'yes'
    C_pl:
      reference: Albanese2014; chest-wall compliance C_cw = 0.2445 L/cmH2O (Table 2-5, citing van Meurs) = 2.49e-6 m6/J; library 2.5e-6 matches
      sourced: 'yes'
    T_resp:
      reference: Albanese2014; RR = 12 breaths/min (Table 2-5) -> T = 5 s
      sourced: 'yes'
    Delta_RR_resp:
      reference: definitional; controller input, 0 = no respiratory-rate change
      sourced: definitional
    Delta_P_mus:
      reference: definitional; controller input, 0 = no effort change
      sourced: definitional
    IE_ratio:
      reference: Albanese2014; IE_ratio = 0.6 (Table 2-5, [MODEL])
      sourced: 'yes'
    P_m:
      reference: definitional; mouth (airway opening) pressure = atmospheric = 0 gauge
      sourced: definitional
  validation:
    baseline:
      status: pending
      reason: 'candidate: normal quiet-breathing values used by Albanese to tune the model (Albanese2014 section 2.4.3: FRC 2.4 L, tidal volume
        ~500 ml at 12 /min, P_pl,EE -5 cmH2O, all citing West2008). With library values the model gives end-expiratory lung volume 14.0 L and
        VT 0.88 L (with Albanese C_A, C_b, q_A_us: 2.48 L and 0.67 L). Set up as a baseline once the parameter fix is decided.'
    calibrate:
      status: pending
      reason: 'candidate: flow/volume/pleural-pressure traces of healthy quiet breathing (e.g. Mecklenburgh & Mapleson 1998 averaged P_mus/flow,
        used by Albanese); owner to choose'
- vessel_type: lung_bg_Argus_Chase
  BC_type: nn
  module_type: lung_bond_graph_Argus_Chase_type
  notes: 'Mechanically-ventilated lung (author''s model): ventilator pressure P_vent with a PI(leaky-integral) controller to the set pressure
    P_in and compliance C_vent, tube resistance R_tube to a mouth compliance C_m (with a pressure-relief leak above P_leak_threshold), then trachea-bronchi-alveoli
    as in simple_lung_bg with resistances split from R_tot and compliances from C_tot (alveolar compliance switches between inspiration and expiration
    by beta_C_insp_to_exp). Spontaneous effort P_mus is a quadratic B-spline (8 control points P_d_i on knots k_w apart) scaled by P_d_multiplier
    and the controller input alpha_P_mus. alpha_LR and q_str are hard-coded to 1. ALL VALUES ARE PROPOSED PLACEHOLDERS so the component can be
    verified; they are not a calibrated patient.'
  sim_time: 20.0
  dt: 0.001
  solver_info:
    rtol: 1.0e-08
    atol: 1.0e-10
  outputs:
  - P_m
  - P_vent
  - P_err_int
  - P_t
  - P_b
  - P_A
  - P_pl
  - P_mus
  - P_d
  - q_t
  - q_b
  - q_A
  - q_pl
  - q_D
  - v_vm
  - v_mt
  - v_leak
  invariants:
  - description: 'B-spline effort is a partition of unity inside the spline support: P_d is a convex combination of the control points'
    expr: np.all((P_d >= min(0, P_d_1, P_d_2, P_d_3, P_d_4, P_d_5, P_d_6, P_d_7, P_d_8) - 1e-9) & (P_d <= max(0, P_d_1, P_d_2, P_d_3, P_d_4, P_d_5,
      P_d_6, P_d_7, P_d_8) + 1e-9))
  - description: P_mus = P_d P_d_multiplier alpha (alpha = alpha_P_mus when flag_P_mus_control = 1, else 1)
    expr: np.max(np.abs(P_mus - P_d*P_d_multiplier*(alpha_P_mus if flag_P_mus_control == 1 else 1.0))) <= 1e-9 + 1e-9*np.max(np.abs(P_mus))
  - description: 'mouth volume balance: C_m P_m changes by the time integral of v_vm - v_mt - v_leak (after the 0.5 s start-up transient)'
    expr: np.max(np.abs((C_m*P_m - np.concatenate(([0.0], np.cumsum(0.5*np.diff(t)*((v_vm - v_mt - v_leak)[1:] + (v_vm - v_mt - v_leak)[:-1])))))[t
      >= 0.5] - (C_m*P_m - np.concatenate(([0.0], np.cumsum(0.5*np.diff(t)*((v_vm - v_mt - v_leak)[1:] + (v_vm - v_mt - v_leak)[:-1])))))[t >=
      0.5][0])) <= 2e-3*max(np.ptp(C_m*P_m[t >= 0.5]), 1e-12) + 1e-12
  - description: 'airway volume balance: q_t + q_b + q_A changes by the time integral of the mouth-to-trachea flow v_mt (after 0.5 s)'
    expr: np.max(np.abs(((q_t + q_b + q_A) - np.concatenate(([0.0], np.cumsum(0.5*np.diff(t)*((v_mt)[1:] + (v_mt)[:-1])))))[t >= 0.5] - ((q_t
      + q_b + q_A) - np.concatenate(([0.0], np.cumsum(0.5*np.diff(t)*((v_mt)[1:] + (v_mt)[:-1])))))[t >= 0.5][0])) <= 2e-3*np.ptp((q_t + q_b +
      q_A)[t >= 0.5]) + 1e-9
  - description: leak flow is zero below the threshold and non-negative
    expr: np.all(v_leak >= 0) & np.all(np.where(P_m < P_leak_threshold, v_leak == 0, True))
  bc_sweep:
    ranges:
      alpha_P_mus:
        min: 0.0
        max: 2.0
        points: 5
      Delta_RR_resp:
        min: -0.08
        max: 0.3
        points: 5
      P_in:
        min: 0
        max: 2000
        points: 5
      flag_P_mus_control:
        min: 0
        max: 1
        points: 2
      flag_RR_control:
        min: 0
        max: 1
        points: 2
      beta_C_insp_to_exp:
        min: 0.7
        max: 1.3
        points: 3
      frac_R_bA:
        min: 0.05
        max: 0.5
        points: 4
      alpha_C_A_to_tot:
        min: 0.8
        max: 0.99
        points: 3
      P_d_multiplier:
        min: 0
        max: 3
        points: 4
    rationale: Set pressure (CPAP/PEEP) 0-20 cmH2O, effort scaling 0-2x (apnoeic to strong effort) and rate -0.08..+0.3 /s, resistance split and
      compliance fractions over plausible ranges; the rest uses the default 0.5-2x factors around the placeholders.
  timestep:
    t_end: 2.0
    dts:
    - 0.0005
    - 0.00025
    - 0.000125
    - 6.25e-05
  stability:
    supported:
    - solver: CVODE_myokit
      rtol: 1.0e-06
      atol: 1.0e-08
      MaximumStep: 0.001
    - solver: CVODE_myokit
      rtol: 1.0e-08
      atol: 1.0e-10
  reference_proposals:
    flag_P_mus_control:
      reference: 'definitional; switch: 1 = effort amplitude follows alpha_P_mus'
      sourced: definitional
      value: 0
    flag_RR_control:
      reference: 'definitional; switch: 1 = rate follows Delta_RR_resp'
      sourced: definitional
      value: 0
    alpha_P_mus:
      reference: definitional; controller input, 1 = nominal effort
      sourced: definitional
      value: 1.0
    Delta_RR_resp:
      reference: definitional; controller input, 0 = no rate change
      sourced: definitional
      value: 0.0
    P_d_multiplier:
      reference: unreferenced_placeholder; component is the author's (Argus/Chase) own mechanical-ventilation lung model with no values in the
        library -- effort scale 1
      sourced: 'no'
      value: 1.0
    P_d_1:
      reference: unreferenced_placeholder; component is the author's (Argus/Chase) own mechanical-ventilation lung model with no values in the
        library -- spline control points shape a ~5 cmH2O inspiratory effort in the first ~40% of the cycle
      sourced: 'no'
      value: -100.0
    P_d_2:
      reference: 'unreferenced_placeholder; component is the author''s (Argus/Chase) own mechanical-ventilation lung model with no values in the
        library -- '
      sourced: 'no'
      value: -350.0
    P_d_3:
      reference: 'unreferenced_placeholder; component is the author''s (Argus/Chase) own mechanical-ventilation lung model with no values in the
        library -- '
      sourced: 'no'
      value: -490.0
    P_d_4:
      reference: 'unreferenced_placeholder; component is the author''s (Argus/Chase) own mechanical-ventilation lung model with no values in the
        library -- '
      sourced: 'no'
      value: -300.0
    P_d_5:
      reference: 'unreferenced_placeholder; component is the author''s (Argus/Chase) own mechanical-ventilation lung model with no values in the
        library -- '
      sourced: 'no'
      value: -100.0
    P_d_6:
      reference: 'unreferenced_placeholder; component is the author''s (Argus/Chase) own mechanical-ventilation lung model with no values in the
        library -- '
      sourced: 'no'
      value: 0.0
    P_d_7:
      reference: 'unreferenced_placeholder; component is the author''s (Argus/Chase) own mechanical-ventilation lung model with no values in the
        library -- '
      sourced: 'no'
      value: 0.0
    P_d_8:
      reference: 'unreferenced_placeholder; component is the author''s (Argus/Chase) own mechanical-ventilation lung model with no values in the
        library -- '
      sourced: 'no'
      value: 0.0
    k_w:
      reference: unreferenced_placeholder; component is the author's (Argus/Chase) own mechanical-ventilation lung model with no values in the
        library -- knot spacing T_resp/10 so the 10 knots span one breath
      sourced: 'no'
      value: 0.5
    q_D_min:
      reference: unreferenced_placeholder; component is the author's (Argus/Chase) own mechanical-ventilation lung model with no values in the
        library -- dead-space floor as simple_lung_bg (10 ml)
      sourced: 'no'
      value: 1.0e-05
    q_t_us:
      reference: Albanese2014; V_u,t = 6.63 ml (Table 2-5) -- borrowed from the adult Albanese model
      sourced: 'yes'
      value: 6.63e-06
    q_b_us:
      reference: Albanese2014; V_u,b = 18.7 ml (Table 2-5) -- borrowed from the adult Albanese model
      sourced: 'yes'
      value: 1.87e-05
    q_A_us:
      reference: Albanese2014; V_u,A = 1.263 L (Table 2-5) -- borrowed from the adult Albanese model
      sourced: 'yes'
      value: 0.001263
    frac_R_bA:
      reference: 'unreferenced_placeholder; component is the author''s (Argus/Chase) own mechanical-ventilation lung model with no values in the
        library -- fraction of R_tot in the alveolar duct segment (Albanese: 0.0817/1.74 = 0.05 of the airway resistance)'
      sourced: 'no'
      value: 0.2
    R_tot:
      reference: unreferenced_placeholder; component is the author's (Argus/Chase) own mechanical-ventilation lung model with no values in the
        library -- total airway resistance 10 cmH2O s/L (a typical intubated-patient order of magnitude)
      sourced: 'no'
      value: 980000.0
    R_plwall:
      reference: unreferenced_placeholder; component is the author's (Argus/Chase) own mechanical-ventilation lung model with no values in the
        library -- as simple_lung_bg (1e4 Pa s/m3)
      sourced: 'no'
      value: 10000.0
    R_leak:
      reference: unreferenced_placeholder; component is the author's (Argus/Chase) own mechanical-ventilation lung model with no values in the
        library -- relief leak resistance
      sourced: 'no'
      value: 1000000.0
    P_leak_threshold:
      reference: unreferenced_placeholder; component is the author's (Argus/Chase) own mechanical-ventilation lung model with no values in the
        library -- relief pressure 40 cmH2O
      sourced: 'no'
      value: 3900.0
    C_t:
      reference: Albanese2014; C_t = 0.00238 L/cmH2O (Table 2-5) = 2.43e-8 m6/J -- borrowed
      sourced: 'yes'
      value: 2.43e-08
    C_pl:
      reference: Albanese2014; chest-wall compliance 0.2445 L/cmH2O = 2.49e-6 m6/J (Table 2-5) -- borrowed
      sourced: 'yes'
      value: 2.5e-06
    C_vent:
      reference: unreferenced_placeholder; component is the author's (Argus/Chase) own mechanical-ventilation lung model with no values in the
        library -- ventilator circuit compliance ~1 ml/cmH2O
      sourced: 'no'
      value: 1.0e-08
    C_m:
      reference: unreferenced_placeholder; component is the author's (Argus/Chase) own mechanical-ventilation lung model with no values in the
        library -- mouth/Y-piece compliance ~1 ml/cmH2O
      sourced: 'no'
      value: 1.0e-08
