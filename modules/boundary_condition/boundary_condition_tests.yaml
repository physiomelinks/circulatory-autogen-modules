module: boundary_condition
reviewed: false
known_issues: []
defaults:
  sim_time: 2.0
  pre_time: 0.0
  dt: 0.001
  solver: CVODE_myokit
  solver_info: {rtol: 1.0e-08, atol: 1.0e-12}
  bc_sweep:
    factors: [0.5, 0.75, 1.0, 1.5, 2.0]
    ranges: {}
  timestep:
    scheme: rk4
    dts: [0.004, 0.002, 0.001, 0.0005]
    min_order: 0.8
    tol: 0.0001
    cvode_tol: 0.001
  stability:
    supported:
    - {solver: CVODE_myokit, rtol: 1.0e-06, atol: 1.0e-08}
components:
- vessel_type: outlet_pressure
  BC_type: nn_constant
  module_type: constant_pressure_BC_type
  outputs: [va/u, va/v, va/q]
  harness:
    vessel_array:
    - [flow_in, nn_constant, inlet_flow, '', va]
    - [va, vp, arterial_simple, flow_in, mod]
    - [mod, nn_constant, outlet_pressure, va, '']
    parameters:
    - [v_flow_in, m3_per_s, 0.0001, harness test value (6 L/min)]
    - [R_va, Js_per_m6, 10000000.0, harness test value]
    - [C_va, m6_per_J, 1.0e-08, harness test value]
    - [I_va, Js2_per_m6, 100000.0, harness test value]
    - [q_0_va, m3, 0, 'harness: zero unstressed volume']
    - [u_0_va, J_per_m3, 0, 'harness: zero reference pressure']
    - [u_ext_va, J_per_m3, 0, 'harness: zero external pressure']
  invariants:
  - {description: 'the vessels outflow reaches the constant inflow at steady state (v → 1e-4 m^3/s, 0.1%)', expr: 'abs(va__v[-1]
      - 1e-4) <= 1e-7'}
  - {description: 'the vessel pressure settles at the imposed outlet pressure plus the resistive drop, u → P + R v = P + 1000
      Pa (±1 Pa)', expr: 'abs(va__u[-1] - (P + 1e7*1e-4)) <= 1.0'}
  - {description: 'vessel volume balance: q(t) − q(0) = ∫(v_in − v) dt with v_in = 1e-4 (trapezoidal, 0.1%)', expr: 'np.max(np.abs((va__q
      - va__q[0]) - np.concatenate(([0.0], np.cumsum(0.5*(((1e-4) - (va__v))[1:] + ((1e-4) - (va__v))[:-1])*np.diff(t))))))
      <= 1e-3*max(1e-12, np.max(np.abs(va__q - va__q[0])))'}
  bc_sweep:
    ranges:
      P: {min: 0.0, max: 2000.0, points: 5}
    exclude: [v]
    rationale: 'Outlet (venous / right-atrial) pressures from 0 to 15 mmHg (0-2000 Pa). v is excluded: it is the flow the
      connected vessel supplies (a port input), so its parameter value is not used when connected.'
  notes: Constant pressure P imposed at the outlet of a vessel (the vessel supplies the flow v through the port). Alone it
    computes nothing; tested downstream of a constant inflow (1e-4 m^3/s) and a BG arterial_simple vp vessel, whose steady
    state (v = inflow, u = P + R v) is analytic.
  validation:
    baseline: {status: not_applicable, reason: prescribed boundary value (a constant pressure); nothing to validate on its
        own. Verified against the analytic steady state of a test vessel.}
    calibrate: {status: not_applicable, reason: prescribed boundary value (a constant pressure); nothing to validate on its
        own. Verified against the analytic steady state of a test vessel.}
  reference_proposals:
    P: {reference: 'Klabunde2021; right-atrial pressure typically averages < 5 mmHg (cvphysiology.com, PCWP page); 666 Pa
        = 5 mmHg', sourced: 'yes'}
    v: {reference: definitional; the flow v is supplied by the connected vessel through the port; the parameter value is only
        used when unconnected, sourced: definitional}
- vessel_type: inlet_pressure
  BC_type: nn_constant
  module_type: constant_pressure_BC_type
  outputs: [va/u, va/v, va/q]
  harness:
    vessel_array:
    - [mod, nn_constant, inlet_pressure, '', va]
    - [va, pv, arterial_simple, mod, flow_out]
    - [flow_out, nn_constant, outlet_flow, va, '']
    parameters:
    - [v_flow_out, m3_per_s, 0.0001, harness test value (6 L/min)]
    - [R_va, Js_per_m6, 10000000.0, harness test value]
    - [C_va, m6_per_J, 1.0e-08, harness test value]
    - [I_va, Js2_per_m6, 100000.0, harness test value]
    - [q_0_va, m3, 0, 'harness: zero unstressed volume']
    - [u_0_va, J_per_m3, 0, 'harness: zero reference pressure']
    - [u_ext_va, J_per_m3, 0, 'harness: zero external pressure']
  invariants:
  - {description: 'the vessels inflow reaches the constant outflow at steady state (v → 1e-4 m^3/s, 0.1%)', expr: 'abs(va__v[-1]
      - 1e-4) <= 1e-7'}
  - {description: 'the vessel pressure settles at the imposed inlet pressure minus the resistive drop, u → P − R v = P − 1000
      Pa (±1 Pa)', expr: 'abs(va__u[-1] - (P - 1e7*1e-4)) <= 1.0'}
  - {description: 'vessel volume balance: q(t) − q(0) = ∫(v − v_out) dt with v_out = 1e-4 (trapezoidal, 0.1%)', expr: 'np.max(np.abs((va__q
      - va__q[0]) - np.concatenate(([0.0], np.cumsum(0.5*(((va__v) - (1e-4))[1:] + ((va__v) - (1e-4))[:-1])*np.diff(t))))))
      <= 1e-3*max(1e-12, np.max(np.abs(va__q - va__q[0])))'}
  bc_sweep:
    ranges:
      P: {min: 5000.0, max: 16000.0, points: 5}
    exclude: [v]
    rationale: 'Inlet (arterial) pressures from about 40 to 120 mmHg (5000-16000 Pa). v is excluded: it is the flow the connected
      vessel supplies (a port input).'
  notes: Constant pressure P imposed at the inlet of a vessel (the vessel supplies the flow v through the port). Tested upstream
    of a BG arterial_simple pv vessel draining into a constant outflow (1e-4 m^3/s); steady state u = P − R v is analytic.
  validation:
    baseline: {status: not_applicable, reason: prescribed boundary value (a constant pressure); verified against the analytic
        steady state of a test vessel.}
    calibrate: {status: not_applicable, reason: prescribed boundary value (a constant pressure); verified against the analytic
        steady state of a test vessel.}
  reference_proposals:
    P: {reference: 'Klabunde2021; normal mean arterial pressure ~93 mmHg for 120/80 mmHg (MAP = DP + (SP - DP)/3, cvphysiology.com
        MAP page); 93 mmHg = 12399 Pa', sourced: 'yes', value: 12399}
    v: {reference: definitional; the flow v is supplied by the connected vessel through the port; the parameter value is only
        used when unconnected, sourced: definitional}
- vessel_type: outlet_flow
  BC_type: nn_constant
  module_type: constant_flow_BC_type
  outputs: [va/u, va/v, va/q]
  harness:
    vessel_array:
    - [p_in, nn_constant, inlet_pressure, '', va]
    - [va, pv, arterial_simple, p_in, mod]
    - [mod, nn_constant, outlet_flow, va, '']
    parameters:
    - [P_p_in, J_per_m3, 12000, harness test value (90 mmHg)]
    - [R_va, Js_per_m6, 10000000.0, harness test value]
    - [C_va, m6_per_J, 1.0e-08, harness test value]
    - [I_va, Js2_per_m6, 100000.0, harness test value]
    - [q_0_va, m3, 0, 'harness: zero unstressed volume']
    - [u_0_va, J_per_m3, 0, 'harness: zero reference pressure']
    - [u_ext_va, J_per_m3, 0, 'harness: zero external pressure']
  invariants:
  - {description: 'the vessels inflow reaches the imposed outflow at steady state (v_vessel → v, 0.1% or 1e-8 m^3/s)', expr: 'abs(va__v[-1]
      - v) <= max(1e-3*abs(v), 1e-8)'}
  - {description: vessel pressure settles at P_in − R v = 12000 − 1e7 v (±1 Pa), expr: 'abs(va__u[-1] - (12000.0 - 1e7*v))
      <= 1.0'}
  - {description: 'vessel volume balance: q(t) − q(0) = ∫(v_vessel − v) dt (trapezoidal, 0.1%)', expr: 'np.max(np.abs((va__q
      - va__q[0]) - np.concatenate(([0.0], np.cumsum(0.5*(((va__v) - (v))[1:] + ((va__v) - (v))[:-1])*np.diff(t)))))) <= 1e-3*max(1e-12,
      np.max(np.abs(va__q - va__q[0])))'}
  bc_sweep:
    ranges:
      v: {min: 0.0, max: 0.00015, points: 5}
    exclude: [P]
    rationale: 'Outflows from 0 to 9 L/min (0-1.5e-4 m^3/s), rest to exercise cardiac output. P is excluded: it is the pressure
      the connected vessel supplies (a port input).'
  notes: Constant flow v drawn from the outlet of a vessel (the vessel supplies the pressure P through the port). Tested downstream
    of a constant inlet pressure (12000 Pa) and a BG arterial_simple pv vessel; steady state u = P_in − R v is analytic.
  validation:
    baseline: {status: not_applicable, reason: prescribed boundary value (a constant flow); verified against the analytic
        steady state of a test vessel.}
    calibrate: {status: not_applicable, reason: prescribed boundary value (a constant flow); verified against the analytic
        steady state of a test vessel.}
  reference_proposals:
    v: {reference: Demir2025; resting cardiac output ~4900 mL/min (70 bpm x 70 mL); 5 L/min = 8.333e-5 m^3/s is the rounded
        value, sourced: 'yes', value: 8.3333e-05}
    P: {reference: definitional; the pressure P is supplied by the connected vessel through the port; the parameter value
        is only used when unconnected, sourced: definitional}
- vessel_type: inlet_flow
  BC_type: nn_constant
  module_type: constant_flow_BC_type
  outputs: [va/u, va/v, va/q]
  harness:
    vessel_array:
    - [mod, nn_constant, inlet_flow, '', va]
    - [va, vp, arterial_simple, mod, p_out]
    - [p_out, nn_constant, outlet_pressure, va, '']
    parameters:
    - [P_p_out, J_per_m3, 666, harness test value (5 mmHg)]
    - [R_va, Js_per_m6, 10000000.0, harness test value]
    - [C_va, m6_per_J, 1.0e-08, harness test value]
    - [I_va, Js2_per_m6, 100000.0, harness test value]
    - [q_0_va, m3, 0, 'harness: zero unstressed volume']
    - [u_0_va, J_per_m3, 0, 'harness: zero reference pressure']
    - [u_ext_va, J_per_m3, 0, 'harness: zero external pressure']
  invariants:
  - {description: 'the vessels outflow reaches the imposed inflow at steady state (v_vessel → v, 0.1% or 1e-8 m^3/s)', expr: 'abs(va__v[-1]
      - v) <= max(1e-3*abs(v), 1e-8)'}
  - {description: vessel pressure settles at P_out + R v = 666 + 1e7 v (±1 Pa), expr: 'abs(va__u[-1] - (666.0 + 1e7*v)) <=
      1.0'}
  - {description: 'vessel volume balance: q(t) − q(0) = ∫(v − v_vessel) dt (trapezoidal, 0.1%)', expr: 'np.max(np.abs((va__q
      - va__q[0]) - np.concatenate(([0.0], np.cumsum(0.5*(((v) - (va__v))[1:] + ((v) - (va__v))[:-1])*np.diff(t)))))) <= 1e-3*max(1e-12,
      np.max(np.abs(va__q - va__q[0])))'}
  bc_sweep:
    ranges:
      v: {min: 0.0, max: 0.00015, points: 5}
    exclude: [P]
    rationale: 'Inflows from 0 to 9 L/min (0-1.5e-4 m^3/s). P is excluded: it is the pressure the connected vessel supplies
      (a port input).'
  notes: Constant flow v into the inlet of a vessel (the vessel supplies the pressure P). Tested upstream of a BG arterial_simple
    vp vessel draining into a constant outlet pressure (666 Pa); steady state u = P_out + R v is analytic.
  validation:
    baseline: {status: not_applicable, reason: prescribed boundary value (a constant flow); verified against the analytic
        steady state of a test vessel.}
    calibrate: {status: not_applicable, reason: prescribed boundary value (a constant flow); verified against the analytic
        steady state of a test vessel.}
  reference_proposals:
    v: {reference: 'Demir2025; resting cardiac output ~4900 mL/min (70 bpm x 70 mL); 83333e-9 m^3/s = 5.0 L/min, the rounded
        value', sourced: 'yes'}
    P: {reference: definitional; the pressure P is supplied by the connected vessel through the port; the parameter value
        is only used when unconnected, sourced: definitional}
- vessel_type: inlet_flow
  BC_type: nn_fourier_8
  module_type: fourier_flow_8_BC_type
  outputs: [v, va/v, va/q, va/u]
  harness:
    vessel_array:
    - [mod, nn_fourier_8, inlet_flow, '', va]
    - [va, vp, arterial_simple, mod, p_out]
    - [p_out, nn_constant, outlet_pressure, va, '']
    parameters:
    - [P_p_out, J_per_m3, 666, harness test value (5 mmHg)]
    - [R_va, Js_per_m6, 10000000.0, harness test value]
    - [C_va, m6_per_J, 1.0e-08, harness test value]
    - [I_va, Js2_per_m6, 100000.0, harness test value]
    - [q_0_va, m3, 0, 'harness: zero unstressed volume']
    - [u_0_va, J_per_m3, 0, 'harness: zero reference pressure']
    - [u_ext_va, J_per_m3, 0, 'harness: zero external pressure']
  invariants:
  - {description: v is exactly the 8-harmonic Fourier series Σ A_i cos(2π i t/T + φ_i) (relative 1e-9), expr: 'np.max(np.abs(v
      - (A_0*np.cos(2*np.pi*0*t/T + phi_0) + A_1*np.cos(2*np.pi*1*t/T + phi_1) + A_2*np.cos(2*np.pi*2*t/T + phi_2) + A_3*np.cos(2*np.pi*3*t/T
      + phi_3) + A_4*np.cos(2*np.pi*4*t/T + phi_4) + A_5*np.cos(2*np.pi*5*t/T + phi_5) + A_6*np.cos(2*np.pi*6*t/T + phi_6)
      + A_7*np.cos(2*np.pi*7*t/T + phi_7) + A_8*np.cos(2*np.pi*8*t/T + phi_8)))) <= 1e-9*max(1e-30, np.max(np.abs(v)))'}
  - {description: 'v is periodic with the heart period T: its mean over the last whole period equals A_0 cos φ_0 (1e-3 of
      max |v|)', expr: 'abs(np.trapz(v[t >= t[-1] - T], t[t >= t[-1] - T])/T - A_0*np.cos(phi_0)) <= 1e-3*np.max(np.abs(v))
      + 1e-12', applies: run}
  - {description: 'vessel volume balance: q(t) − q(0) = ∫(v − v_vessel) dt (trapezoidal, 0.1%)', expr: 'np.max(np.abs((va__q
      - va__q[0]) - np.concatenate(([0.0], np.cumsum(0.5*(((v) - (va__v))[1:] + ((v) - (va__v))[:-1])*np.diff(t)))))) <= 1e-3*max(1e-12,
      np.max(np.abs(va__q - va__q[0])))'}
  bc_sweep:
    ranges:
      phi_0: [-3.14159, 3.14159]
      phi_2: [-3.14159, 3.14159]
      A_2: {min: 0.0, max: 0.0002, points: 3}
      T: [0.5, 2.0]
    exclude: [P]
    rationale: 'Amplitudes are swept by factors 0.5-2 of their nominal values (zero harmonics mostly left at zero, A_2 swept
      to 2e-4 as a representative), phases over the full circle for a zero and a non-zero harmonic, and T from 0.5 to 2 s
      (heart rates 30-120 bpm). P is excluded: it is the pressure the connected vessel supplies.'
  dt: 0.001
  notes: 'Periodic inflow from an 8-harmonic Fourier series v(t) = Σ_{i=0..8} A_i cos(2π i t/T + φ_i), T the (global) heart
    period. Tested feeding a BG arterial_simple vp vessel into a constant outlet pressure. The library values (A_0 = 1e-4,
    A_1 = 1e-3, A_4 = 1e-4 m^3/s) are test values: A_1 = 1e-3 gives a peak inflow of ~1.1e-3 m^3/s and a large reverse flow
    (−9e-4 m^3/s), which is not an aortic waveform.'
  validation:
    baseline: {status: pending, reason: 'candidate: fit the 8 harmonics to a published measured aortic-root inflow waveform
        (e.g. the openly available input data of the Boileau et al. 2015 1D benchmark) and compare v(t) with it; not set up
        because no source with explicit Fourier coefficients was verified.'}
    calibrate: {status: pending, reason: 'same candidate: calibrate A_i, phi_i to the measured inflow waveform and validate
        on a held-out cycle.'}
  reference_proposals:
    A_0: {reference: unreferenced_placeholder; test waveform coefficient (test_fft example); no published Fourier coefficient
        set found, sourced: 'no'}
    A_1: {reference: unreferenced_placeholder; test waveform coefficient (test_fft example); no published Fourier coefficient
        set found, sourced: 'no'}
    A_2: {reference: unreferenced_placeholder; test waveform coefficient (test_fft example); no published Fourier coefficient
        set found, sourced: 'no'}
    A_3: {reference: unreferenced_placeholder; test waveform coefficient (test_fft example); no published Fourier coefficient
        set found, sourced: 'no'}
    A_4: {reference: unreferenced_placeholder; test waveform coefficient (test_fft example); no published Fourier coefficient
        set found, sourced: 'no'}
    A_5: {reference: unreferenced_placeholder; test waveform coefficient (test_fft example); no published Fourier coefficient
        set found, sourced: 'no'}
    A_6: {reference: unreferenced_placeholder; test waveform coefficient (test_fft example); no published Fourier coefficient
        set found, sourced: 'no'}
    A_7: {reference: unreferenced_placeholder; test waveform coefficient (test_fft example); no published Fourier coefficient
        set found, sourced: 'no'}
    A_8: {reference: unreferenced_placeholder; test waveform coefficient (test_fft example); no published Fourier coefficient
        set found, sourced: 'no'}
    phi_0: {reference: unreferenced_placeholder; test waveform phase (test_fft example), sourced: 'no'}
    phi_1: {reference: unreferenced_placeholder; test waveform phase (test_fft example), sourced: 'no'}
    phi_2: {reference: unreferenced_placeholder; test waveform phase (test_fft example), sourced: 'no'}
    phi_3: {reference: unreferenced_placeholder; test waveform phase (test_fft example), sourced: 'no'}
    phi_4: {reference: unreferenced_placeholder; test waveform phase (test_fft example), sourced: 'no'}
    phi_5: {reference: unreferenced_placeholder; test waveform phase (test_fft example), sourced: 'no'}
    phi_6: {reference: unreferenced_placeholder; test waveform phase (test_fft example), sourced: 'no'}
    phi_7: {reference: unreferenced_placeholder; test waveform phase (test_fft example), sourced: 'no'}
    phi_8: {reference: unreferenced_placeholder; test waveform phase (test_fft example), sourced: 'no'}
    P: {reference: definitional; the pressure P is supplied by the connected vessel through the port; the parameter value
        is only used when unconnected, sourced: definitional}
    T: {reference: 'unreferenced_placeholder; heart period 1 s (60 bpm), labelled biobeat_measurement in circulatory_autogen;
        the measurement is not available. Klabunde2021 uses 70 bpm (T = 0.857 s) as a resting value', sourced: 'no'}
- vessel_type: inlet_flow
  BC_type: nn_constant_2
  module_type: constant_flow_2_BC_type
  outputs: [v_1, v_2]
  invariants:
  - {description: both flows are constant in time and non-negative, expr: '(np.ptp(v_1) == 0) & (np.ptp(v_2) == 0) & (v_1[0]
      >= 0) & (v_2[0] >= 0)'}
  - {description: at the run point the flows are the library values 3.1e-6 m^3/s, expr: '(abs(v_1[0] - 3.1e-6) <= 1e-18) &
      (abs(v_2[0] - 3.1e-6) <= 1e-18)', applies: run}
  bc_sweep:
    ranges:
      v_1: {min: 0.0, max: 1.0e-05, points: 3}
      v_2: {min: 0.0, max: 1.0e-05, points: 3}
    rationale: 0-600 mL/min per inlet, covering single cerebral feeding-artery flows.
  notes: 'Two constant inflows v_1, v_2 on one port (flow_inlet_BC_2_port), consumed only by BG 2in2out_junction vv (e.g.
    the two inflows of a cerebral junction). Tested alone: the component has no equations, so only the constants can be checked;
    a harness with a 2in2out_junction needs a full cerebral network.'
  validation:
    baseline: {status: not_applicable, reason: prescribed boundary values (two constant flows); nothing to validate on their
        own.}
    calibrate: {status: not_applicable, reason: prescribed boundary values (two constant flows); nothing to validate on their
        own.}
  reference_proposals:
    v_1: {reference: 'Zarrinkoob2015; Table 1: ICA flow 257 +- 48 mL/min (4.28e-6 m^3/s), VA 100 +- 22 mL/min, total CBF 717
        mL/min. The library value 3.1e-6 m^3/s (186 mL/min) is not in the paper: it is ~tCBF/4 (2.99e-6), i.e. between an
        ICA and a VA flow', sourced: 'no'}
    v_2: {reference: 'Zarrinkoob2015; as v_1: 3.1e-6 m^3/s is ~tCBF/4, not a tabulated value (ICA 4.28e-6, VA 1.67e-6 m^3/s)',
      sourced: 'no'}
- vessel_type: lung_vol_generator
  BC_type: nn
  module_type: lung_Vol_generator_type
  outputs: [q_lung_V, q_b]
  sim_time: 60.0
  dt: 0.01
  invariants:
  - {description: 'q_lung_V is exactly amp(t) sin(2π t/T(t) + φ) + q_baseline, with the piecewise amplitude and period of
      the perturbation windows (relative 1e-9)', expr: 'np.max(np.abs(q_lung_V - (np.where((t < t_start_q_lung_amp) | (t >
      t_end_q_lung_amp), q_lung_max, q_lung_max*q_lung_max_multiplier)*np.sin(2*np.pi/np.where((t < t_start_T_lung) | (t >
      t_end_T_lung), T_lung_0, T_lung_0*T_lung_multiplier)*t + phi_lung) + q_lung_baseline))) <= 1e-9*np.max(np.abs(q_lung_V))'}
  - {description: q_b is the baseline volume, expr: np.max(np.abs(q_b - q_lung_baseline)) <= 1e-12*abs(q_lung_baseline)}
  - {description: 'lung volume stays within baseline ± the largest amplitude, and positive', expr: 'np.all(np.abs(q_lung_V
      - q_lung_baseline) <= q_lung_max*max(1.0, q_lung_max_multiplier)*(1 + 1e-9)) & np.all(q_lung_V > 0)'}
  run_parameters: {T_lung_multiplier: 0.5, q_lung_max_multiplier: 1.5}
  bc_sweep:
    ranges:
      T_lung_0: {min: 2.5, max: 6.0, points: 4}
      q_lung_max: {min: 0.0001, max: 0.0005, points: 3}
      q_lung_baseline: {min: 0.0018, max: 0.0035, points: 3}
      phi_lung: [-3.14159, 3.14159]
      T_lung_multiplier: {min: 0.5, max: 2.0, points: 3}
      q_lung_max_multiplier: {min: 0.5, max: 3.0, points: 3}
      t_start_T_lung: [0.0, 30.0]
      t_end_T_lung: [30.0, 60.0]
      t_start_q_lung_amp: [0.0, 30.0]
      t_end_q_lung_amp: [30.0, 60.0]
    rationale: Breathing periods 2.5-6 s (10-24 breaths/min), half tidal volumes 0.1-0.5 L, mid-tidal baselines 1.8-3.5 L
      (about FRC), rate and depth multipliers from halving to doubling/tripling (exercise-like), perturbation windows anywhere
      in the 60 s run.
  notes: 'Prescribed lung volume for driving lung stretch receptors: q_lung_V = amp sin(2π t/T_lung + φ) + q_baseline, with
    the breathing period multiplied by T_lung_multiplier inside [t_start_T_lung, t_end_T_lung] and the amplitude by q_lung_max_multiplier
    inside [t_start_q_lung_amp, t_end_q_lung_amp]; q_b = q_baseline. Because the phase is 2π t/T with absolute t, a change
    of T makes the volume jump (discontinuous q_lung_V at the window edges). Run point: rate doubled (T × 0.5) and depth ×
    1.5 in the windows.'
  validation:
    baseline: {status: not_applicable, reason: prescribed input (a sinusoidal lung volume); its values are sourced physiological
        constants. Validation belongs to the stretch-receptor model it drives.}
    calibrate: {status: not_applicable, reason: prescribed input (a sinusoidal lung volume); its values are sourced physiological
        constants. Validation belongs to the stretch-receptor model it drives.}
  reference_proposals:
    phi_lung: {reference: definitional; breathing starts at mid-tidal volume (zero phase), sourced: definitional, value: 0.0}
    T_lung_0: {reference: MedlinePlusTachypnea; normal adult resting breathing rate 12-20 breaths/min; 15 breaths/min gives
        T = 4 s, sourced: 'yes', value: 4.0}
    q_lung_max: {reference: HallettReid2023; tidal volume ~500 mL in a healthy adult male; amplitude = TV/2 = 2.5e-4 m^3,
      sourced: 'yes', value: 0.00025}
    q_lung_baseline: {reference: Hopkins2022; FRC about 3 L; baseline = FRC + TV/2 = 3.25e-3 m^3 so that the trough of the
        sine is FRC (HallettReid2023 TV 0.5 L), sourced: 'yes', value: 0.00325}
    T_lung_multiplier: {reference: definitional; 1 = no change of breathing period in the perturbation window, sourced: definitional,
      value: 1.0}
    q_lung_max_multiplier: {reference: definitional; 1 = no change of tidal amplitude in the perturbation window, sourced: definitional,
      value: 1.0}
    t_start_T_lung: {reference: unreferenced_placeholder; protocol choice (perturbation window start), sourced: 'no', value: 20.0}
    t_end_T_lung: {reference: unreferenced_placeholder; protocol choice (perturbation window end), sourced: 'no', value: 40.0}
    t_start_q_lung_amp: {reference: unreferenced_placeholder; protocol choice (perturbation window start), sourced: 'no',
      value: 30.0}
    t_end_q_lung_amp: {reference: unreferenced_placeholder; protocol choice (perturbation window end), sourced: 'no', value: 50.0}
- vessel_type: CO2_O2_generator
  BC_type: nn
  module_type: CO2_O2_generator_type
  outputs: [C_O2_a, C_CO2_a, dot_C_CO2_a]
  sim_time: 60.0
  dt: 0.01
  invariants:
  - {description: 'C_O2_a is exactly C_O2_a0, multiplied by C_O2_multiplier inside [t_start_C_O2, t_end_C_O2]', expr: 'np.max(np.abs(C_O2_a
      - np.where((t < t_start_C_O2) | (t > t_end_C_O2), C_O2_a0, C_O2_a0*C_O2_multiplier))) <= 1e-12'}
  - {description: 'C_CO2_a is exactly C_CO2_a0, multiplied by C_CO2_multiplier inside [t_start_C_CO2, t_end_C_CO2]', expr: 'np.max(np.abs(C_CO2_a
      - np.where((t < t_start_C_CO2) | (t > t_end_C_CO2), C_CO2_a0, C_CO2_a0*C_CO2_multiplier))) <= 1e-12'}
  - {description: 'dot_C_CO2_a is identically zero (as written; see review: it ignores the step in C_CO2_a)', expr: np.all(dot_C_CO2_a
      == 0)}
  - {description: contents are non-negative volume fractions below 1 (mL gas per mL blood), expr: np.all((C_O2_a >= 0) & (C_O2_a
      < 1) & (C_CO2_a >= 0) & (C_CO2_a < 1))}
  run_parameters: {C_O2_multiplier: 0.8, C_CO2_multiplier: 1.1}
  bc_sweep:
    ranges:
      C_O2_a0: {min: 0.1, max: 0.22, points: 3}
      C_CO2_a0: {min: 0.4, max: 0.6, points: 3}
      C_O2_multiplier: {min: 0.5, max: 1.1, points: 3}
      C_CO2_multiplier: {min: 0.8, max: 1.3, points: 3}
      t_start_C_O2: [0.0, 30.0]
      t_end_C_O2: [30.0, 60.0]
      t_start_C_CO2: [0.0, 30.0]
      t_end_C_CO2: [30.0, 60.0]
    rationale: Arterial O2 contents from severe hypoxaemia to normal (0.10-0.22 mL/mL), CO2 contents 0.40-0.60 mL/mL (hypo-
      to hypercapnia); multipliers from strong hypoxia (×0.5) to mild hyperoxia, and ×0.8-1.3 for CO2; step windows anywhere
      in the 60 s run. Multiplied values stay below 1 (volume fraction).
  notes: 'Prescribed arterial blood-gas contents for driving the chemoreceptor (control module): C_O2_a and C_CO2_a are baseline
    values stepped by a multiplier inside a time window; dot_C_CO2_a (the CO2-content derivative the chemoreceptors dynamic
    term uses) is fixed at 0. Run point: O2 × 0.8 (hypoxic step) and CO2 × 1.1 in the windows.'
  validation:
    baseline: {status: not_applicable, reason: prescribed input (arterial gas contents); its values are sourced constants.
        Validation belongs to the chemoreceptor model it drives.}
    calibrate: {status: not_applicable, reason: prescribed input (arterial gas contents); its values are sourced constants.
        Validation belongs to the chemoreceptor model it drives.}
  reference_proposals:
    C_O2_a0: {reference: Demir2025; arterial O2 content CaO2 approximately 20 mL O2/dL = 0.20 mL/mL, sourced: 'yes', value: 0.2}
    C_CO2_a0: {reference: Arthurs2005; total CO2 in arterial blood 48 mL per 100 mL = 0.48 mL/mL (p. 207). Note control/chemoreceptor
        uses C_CO2_a_nom = 0.36, sourced: 'yes', value: 0.48}
    C_O2_multiplier: {reference: definitional; 1 = no O2 step, sourced: definitional, value: 1.0}
    C_CO2_multiplier: {reference: definitional; 1 = no CO2 step, sourced: definitional, value: 1.0}
    t_start_C_O2: {reference: unreferenced_placeholder; protocol choice (step window start), sourced: 'no', value: 20.0}
    t_end_C_O2: {reference: unreferenced_placeholder; protocol choice (step window end), sourced: 'no', value: 40.0}
    t_start_C_CO2: {reference: unreferenced_placeholder; protocol choice (step window start), sourced: 'no', value: 30.0}
    t_end_C_CO2: {reference: unreferenced_placeholder; protocol choice (step window end), sourced: 'no', value: 50.0}
- vessel_type: muscle_pressure
  BC_type: nn_constant
  module_type: constant_pressure_generator_type
  outputs: [tc/P_thor]
  harness:
    vessel_array:
    - [mod, nn_constant, muscle_pressure, '', tc]
    - [tc, nn, thoracic_cavity, mod, '']
    parameters: []
  invariants:
  - {description: 'the constant pressure reaches the consumer through the thoracic_pressure_port: thoracic_cavity P_thor =
      P for all t', expr: 'np.max(np.abs(tc__P_thor - P)) <= 1e-12*max(1.0, abs(P))'}
  bc_sweep:
    ranges:
      P: {min: -1000.0, max: 500.0, points: 4}
    rationale: Pressures from −1000 Pa (about −10 cmH2O, inspiratory pleural pressure) to +500 Pa (mild expiratory effort).
  notes: Constant pressure P exposed on a thoracic_pressure_port (consumed by lung thoracic_cavity as P_pl or by the parasympathetic
    cardiopulmonary receptor as P_mus). Tested driving lung/thoracic_cavity, whose P_thor = P_pl.
  validation:
    baseline: {status: not_applicable, reason: prescribed boundary value (a constant pressure); verified through its consumer
        (thoracic_cavity).}
    calibrate: {status: not_applicable, reason: prescribed boundary value (a constant pressure); verified through its consumer
        (thoracic_cavity).}
  reference_proposals:
    P: {reference: definitional; relaxed respiratory muscles (no muscle pressure) at rest; set per protocol, sourced: definitional,
      value: 0.0}
- vessel_type: outlet_flow
  BC_type: nn_constant_flow_port
  module_type: constant_flow_BC_type
  outputs: [v]
  notes: 'A constant flow v on a single-variable flow_port (entrance: it takes the flow a module sends out), for closing a
    module''s multi_port Sum flow_port in a test network (e.g. microvasculature_network''s v_out_sum / v_in_sum). Uses the
    same CellML component as outlet_flow nn_constant; P is unused (no pressure on a flow_port).'
  bc_sweep:
    exclude: [P]
    ranges:
      v: {min: 0.0, max: 1.0e-07, points: 5}
    rationale: flows 0-1e-7 m^3/s span the microvasculature operating points; P is unused
  invariants:
  - {description: the flow is the constant v, expr: 'np.all(v == v[0])'}
  validation:
    baseline: {status: not_applicable, reason: test fixture (a constant boundary flow)}
    calibrate: {status: not_applicable, reason: test fixture}
- vessel_type: inlet_flow
  BC_type: nn_constant_flow_port
  module_type: constant_flow_BC_type
  outputs: [v]
  notes: 'A constant flow v on a single-variable flow_port (exit: it supplies a module the flow v), for closing a module''s
    multi_port Sum flow_port in a test network (e.g. microvasculature_network''s v_out_sum / v_in_sum). Uses the same CellML
    component as outlet_flow nn_constant; P is unused (no pressure on a flow_port).'
  bc_sweep:
    exclude: [P]
    ranges:
      v: {min: 0.0, max: 1.0e-07, points: 5}
    rationale: flows 0-1e-7 m^3/s span the microvasculature operating points; P is unused
  invariants:
  - {description: the flow is the constant v, expr: 'np.all(v == v[0])'}
  validation:
    baseline: {status: not_applicable, reason: test fixture (a constant boundary flow)}
    calibrate: {status: not_applicable, reason: test fixture}
review:
  comment: 'Config-only fix already applied: the four constant pressure/flow BCs declared port variables (v for pressure BCs,
    P for flow BCs) that were missing from variables_and_units, so libcuflynx exited whenever they were connected — please
    confirm. The nn_fourier_8 coefficients are test values (A_1 = 1e-3 m^3/s gives ~0.9 L/s reverse flow) with no source;
    T = 1 s ("biobeat_measurement") is unverifiable. lung_vol_generator jumps in volume when T_lung changes (phase 2πt/T uses
    absolute t), and CO2_O2_generator sets dot_C_CO2_a = 0 even while C_CO2_a steps. C_CO2_a0 = 0.48 (literature) disagrees
    with the chemoreceptor nominal 0.36.'
  summary: 'Boundary-condition sources for circulatory models: constant pressure/flow inlets and outlets, a two-flow inlet,
    an 8-harmonic Fourier inflow, and prescribed lung-volume, blood-gas and muscle-pressure generators. Every component now
    has a test: the constant BCs and the Fourier inflow drive a BG arterial_simple test vessel (R 1e7, C 1e-8, I 1e5) whose
    steady state and volume balance are analytic; muscle_pressure drives lung/thoracic_cavity (P_thor = P); the generators
    are checked against their exact closed forms including the perturbation windows. All run/invariant/sweep/stability tests
    pass (timestep skipped for the algebraic components). References proposed for every parameter (physiology values from
    Klabunde, Demir 2025, Zarrinkoob 2015, StatPearls, Arthurs 2005); test waveform/protocol values marked unreferenced.'
  questions: ['Confirm the APPLIED config fix (v added to the pressure BCs, P to the flow BCs as boundary_condition variables;
      the CellML already declared them).', 'outlet_pressure P = 666 Pa: confirm Klabunde2021 (RA pressure < 5 mmHg). Note
      StatPearls (Shah & Louis) gives a clinical CVP of 8-12 mmHg; which do you want?', 'inlet_pressure P (TODO): proposed
      12399 Pa = 93 mmHg MAP (Klabunde2021), the same as the librarys P_baro_init. OK?', 'outlet_flow v (TODO): proposed 8.3333e-5
      m^3/s = 5 L/min (Demir2025 gives ~4.9 L/min at rest). OK, and same reference for inlet_flow v?', 'inlet_flow nn_constant_2
      v_1 = v_2 = 3.1e-6 m^3/s (186 mL/min, "cerebral_elic: user_defined"): Zarrinkoob2015 gives ICA 257 mL/min (4.28e-6)
      and VA 100 mL/min (1.67e-6); 3.1e-6 is ~total CBF/4. Keep (sourced no), or use per-artery values?', 'nn_fourier_8: the
      A_i/phi_i are test values (large reverse flow). Do you have the "Alfred database" waveform they came from, or should
      they be fitted to a published aortic inflow (validation pending)? Is T = 1 s the intended global heart period?', 'lung_vol_generator:
      proposed T_lung_0 = 4 s (15/min, MedlinePlus 12-20/min), amplitude 2.5e-4 m^3 (TV/2, StatPearls TV 500 mL), baseline
      3.25e-3 m^3 (FRC 3 L + TV/2 so the trough is FRC; StatPearls FRC). Is q_lung_baseline meant to be FRC (end-expiratory)
      or mid-tidal?', 'lung_vol_generator: q_lung_V = amp sin(2πt/T + φ) with absolute t, so switching T at t_start_T_lung/t_end_T_lung
      makes the volume jump. Intended? (A phase integral dθ/dt = 2π/T would make it continuous.)', 'CO2_O2_generator: C_O2_a0
      = 0.20 (Demir2025) and C_CO2_a0 = 0.48 (Arthurs2005) are content fractions (mL gas per mL blood). The chemoreceptors
      C_CO2_a_nom is 0.36 (labelled Magosso2001/Ursino2000, not verified here): which convention should the generator use?',
    'CO2_O2_generator: dot_C_CO2_a is fixed at 0 even across the C_CO2 step, so the chemoreceptors dynamic CO2 term never
      sees the step. Intended?', 'muscle_pressure P (TODO): proposed 0 Pa (relaxed muscles), definitional. Or a pleural pressure
      (about -5 cmH2O = -490 Pa at FRC) if it drives thoracic_cavity P_pl?', 'Perturbation windows (lung and gas generators)
      proposed as 20-40 s / 30-50 s placeholders with multipliers 1 (no perturbation). OK as defaults?']
  proposed_fixes: ['APPLIED, please confirm: boundary_condition_modules_config.json — added v (m3_per_s, boundary_condition)
      to outlet_pressure/inlet_pressure nn_constant and P (J_per_m3, boundary_condition) to outlet_flow/inlet_flow nn_constant;
      they are port variables the CellML already declared, and without them libcuflynx exited whenever the BCs were connected.',
    'lung_Vol_generator_type (optional): make the breathing phase continuous across a change of T_lung, e.g. dθ/dt = 2π/T_lung
      and q_lung_V = amp sin(θ + φ) + q_baseline.', 'CO2_O2_generator_type (optional): if the dynamic chemoreceptor response
      to a CO2 step matters, provide dot_C_CO2_a consistent with C_CO2_a (e.g. a first-order filtered step and its derivative)
      instead of 0.']
  findings: ['The constant BCs have no equations; they are tested through a BG arterial_simple test vessel whose steady state
      (u = P ± R v, v = imposed flow) and volume balance q(t) − q(0) = ∫(v_in − v_out) dt are checked in every sweep run.
      This needed CVODE atol 1e-12 (volumes ~1e-5 m^3; the default atol 1e-8 m^3 gives 0.2% balance errors).', 'Port inputs
      (v of the pressure BCs, P of the flow BCs and of the Fourier inflow) are excluded from the sweep: when connected their
      parameter values are unused.', 'inlet_flow nn_constant_2 can only be tested alone (its only consumer is BG 2in2out_junction
      vv, which needs a full cerebral network); its invariants only check the constants.', 'Timestep tests are skipped for
      the algebraic components (constant_flow_2, lung, CO2/O2, muscle pressure).', 'Risk (512 Sobol samples, joint over the
      sweep box): P(fail) = 0 for all nine components.']
