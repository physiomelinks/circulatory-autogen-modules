module: NKE_pump
reviewed: false
known_issues: []
defaults:
  sim_time: 20.0
  pre_time: 0.0
  dt: 0.01
  solver: CVODE_myokit
  bc_sweep:
    factors:
    - 0.5
    - 0.75
    - 1.0
    - 1.5
    - 2.0
    ranges:
      K_1:
        min: 0.1
        max: 10
        points: 5
        scale: log
      K_2:
        min: 0.1
        max: 10
        points: 5
        scale: log
      K_3:
        min: 0.1
        max: 10
        points: 5
        scale: log
      K_4:
        min: 0.1
        max: 10
        points: 5
        scale: log
      kappa_2:
        min: 0.1
        max: 10
        points: 5
        scale: log
      kappa_4:
        min: 0.1
        max: 10
        points: 5
        scale: log
      z_1:
        min: -0.5
        max: 0.5
        points: 5
      flag_0:
        min: 0
        max: 1
        points: 2
    rationale: 'K_1..K_4, kappa_2 and kappa_4 have no sourced values (all 1); a two-decade log range around 1 is swept as the claimed working
      region. z_1 spans -0.5..0.5, which covers both the current value 0.5 and the Pan et al. (2020) charge split (-0.055 on the intracellular
      Na+ binding step). flag_0 is a switch: 0 holds u_e at -0.12 V, 1 ramps it at 1 mV/s.'
  timestep:
    scheme: rk4
    dts:
    - 1.0e-05
    - 5.0e-06
    - 2.5e-06
    - 1.25e-06
    t_end: 0.005
    min_order: 0.8
    tol: 0.0001
    cvode_tol: 0.001
  stability:
    supported:
    - solver: CVODE_myokit
      rtol: 1.0e-06
      atol: 1.0e-08
components:
- vessel_type: NKE_pump
  BC_type: nn
  module_type: NKE_pump
  outputs:
  - v_1
  - v_2
  - v_3
  - v_4
  - u_e
  - q_1
  - q_2
  - q_3
  - q_4
  - v_NKE
  - u_equil
  - Power_external
  - Power_dissipation
  notes: 'Four-state bond-graph Na+/K+-ATPase cycle, a lumped form of the Post-Albers scheme like the Smith & Crampin (2004) / Terkildsen et al.
    (2007) 4-state reduction. The reactions are R1: P1 + 2K_o <-> P2 + Pi; R2: P2 + ATP <-> P3 + 2K_i; R3: P3 + 3Na_i <-> P4 + ADP (charge z_1);
    R4: P4 <-> P1 + 3Na_o (charge z_2 = -1 - z_1). Ions and metabolites are chemostats (constant amounts); u_e = q_mem/C_m is held at -0.12 V
    (flag_0 = 0) or ramped at 1 mV/s (flag_0 = 1). The ion/metabolite thermodynamic constants (K_Ki, K_Ke, K_Nai, K_Nae, K_ATP, K_ADP, K_Pi) and
    C_m = 153400 fF are hard-coded and match Pan et al. (2020) Table 2. kappa_1 = kappa_3 = 1e4 fmol/s are hard-coded (fast steps), and v_NKE
    is an algebraic rapid-equilibrium (kappa_1, kappa_3 -> infinity) steady-state flux. The fast steps (about 4e4 1/s) make the system stiff,
    (largest Jacobian eigenvalue about -9.2e4 1/s at the nominal point, RK4 limit dt < 3e-5 s), so the RK4 convergence test uses dt <= 1e-5 s
    over 5 ms.'
  invariants:
  - description: total pump amount q_1+q_2+q_3+q_4 is conserved (relative drift < 1e-6)
    expr: np.ptp(q_1 + q_2 + q_3 + q_4) <= 1e-6 * np.max(q_1 + q_2 + q_3 + q_4)
  - description: pump state amounts stay non-negative
    expr: np.all(np.array([q_1, q_2, q_3, q_4]) >= -1e-9 * np.max(q_1 + q_2 + q_3 + q_4))
  - description: 'second law: every reaction dissipates, so Power_dissipation >= 0'
    expr: np.all(Power_dissipation >= -1e-9 * max(1e-12, np.max(np.abs(Power_dissipation))))
  - description: 'energy balance (exact identity): Power_external - Power_dissipation = sum_i u_i dq_i/dt with u_i = RT ln(K_i q_i), dq_1/dt =
      v_4 - v_1 etc.'
    expr: np.max(np.abs(Power_external - Power_dissipation - 0.0025773*(np.log(K_1*q_1)*(v_4 - v_1) + np.log(K_2*q_2)*(v_1 - v_2) + np.log(K_3*q_3)*(v_2
      - v_3) + np.log(K_4*q_4)*(v_3 - v_4)))) <= 1e-6 * max(1e-12, np.max(np.abs(Power_external)))
  - description: 'cycle steady state at t_end: v_1 = v_2 = v_3 = v_4, so Na+ efflux (3 v_4) : K+ influx (2 v_1) = 3 : 2 and net charge 1 e per
      cycle (relative 1e-4)'
    expr: max(abs(v_1[-1] - v_4[-1]), abs(v_2[-1] - v_4[-1]), abs(v_3[-1] - v_4[-1])) <= 1e-4 * max(abs(v_4[-1]), 1e-12)
    applies: run
  - description: v_NKE equals the exact rapid-equilibrium (kappa_1, kappa_3 -> infinity) steady-state flux of the module's own reaction scheme
      (two-pool cycle q_1+q_2, q_3+q_4; relative 1e-6). Algebraic check, independent of the ODE solution.
    applies: run
    expr: '(lambda N, vN, K1, K2, K3, K4, k2, k4, z1, ph, qt, QKo, QPi, QATP, QKi, QNai, QADP, QNao: (lambda r1, r3: (lambda bp, bm, gp, gm: N.max(N.abs(vN
      - qt*(bp*gp - bm*gm)/(bp + bm + gp + gm))) <= 1e-6*N.max(N.abs(qt*(bp*gp - bm*gm)/(bp + bm + gp + gm))))(k2*K2*QATP*r1/(1 + r1), k2*K3*QKi**2/(1
      + r3), k4*K4*r3/(1 + r3), k4*K1*QNao**3*N.exp((-1 - z1)*ph)/(1 + r1)))(K1*QKo**2/(K2*QPi), K3*QNai**3/(K4*QADP*N.exp(z1*ph))))(np, v_NKE,
      K_1, K_2, K_3, K_4, kappa_2, kappa_4, z_1, 0.0964853321/0.0025773*u_e, q_1 + q_2 + q_3 + q_4, 0.009236*27.9828, 0.04565*0.038, 2.3715*380,
      0.0012595*0.038, 0.00083514*1900, 7.976e-05*0.038, 0.0061242*777.3)'
  validation:
    baseline:
      status: pending
      reason: 'candidate: steady-state Na/K pump current-voltage curves in guinea-pig ventricular myocytes (NakaoGadsby1989, J Gen Physiol 94:539;
        the data Terkildsen2007 and Pan2020 fitted). This needs sourced K/kappa values first (the current values are all 1) and pump current I
        = F v_4 per pump. It also needs u_e as a sweepable input: it is hard-coded through q_mem_init.'
    calibrate:
      status: pending
      reason: 'as baseline: fit K_1..K_4, kappa_2, kappa_4, z_1 to the NakaoGadsby1989 I-V data (via Pan2020) once u_e and the ion amounts are
        exposed as parameters'
  expected_failures:
    verification_test_invariants: v_NKE (algebraic steady-state flux) uses exp(-F u_e/RT) in A_0 where the reaction scheme gives exp(+F u_e/RT)
      (net charge z_1 + z_2 = -1 per cycle). At the nominal point v_NKE = 627.9 fmol/s, but the exact rapid-equilibrium flux of the same scheme
      is 0.2758 fmol/s (and the ODE steady state is 0.00714 fmol/s with the finite kappa_1 = kappa_3 = 1e4). At u_e = 0 the two agree (0.99577).
      With the sign flipped in a patched copy the v_NKE invariant holds to 1e-6 (checked at the nominal point, and offline for u_e in {-0.2, -0.12,
      0, 0.1} V and a second parameter set).
  reference_proposals:
    K_1:
      reference: 'unreferenced_placeholder; value 1 per fmol. The seeded source ''NKE_pump: Alfred_database'' could not be identified or checked.
        The lumped 4-state constants would have to be derived from the 15-state bond graph of Pan2020 (Table 2) by the Smith & Crampin (SmithCrampin2004)
        lumping'
      sourced: 'no'
    K_2:
      reference: unreferenced_placeholder; value 1 per fmol, no source (see K_1)
      sourced: 'no'
    K_3:
      reference: unreferenced_placeholder; value 1 per fmol, no source (see K_1)
      sourced: 'no'
    K_4:
      reference: unreferenced_placeholder; value 1 per fmol, no source (see K_1)
      sourced: 'no'
    kappa_2:
      reference: unreferenced_placeholder; value 1 fmol/s, no source. With kappa_1 = kappa_3 = 1e4 hard-coded the model is stiff (eigenvalues
        to -9.2e4 1/s); a lumped rate from Pan2020 / Terkildsen2007 would replace it
      sourced: 'no'
    kappa_4:
      reference: unreferenced_placeholder; value 1 fmol/s, no source (see kappa_2)
      sourced: 'no'
    flag_0:
      reference: definitional; 0 holds u_e at q_mem_init/C_m = -0.12 V, 1 ramps it at 1 mV/s (dq_mem/dt = flag_0 1e-3 C_m)
      sourced: definitional
    z_1:
      reference: unreferenced_placeholder; value 0.5 (so z_2 = -1.5), no source. Pan2020 Table 2 puts charge -0.0550 on R5 (binding of the third
        intracellular Na+) and -0.9450 on R8 (extracellular Na+ release), which in this module (z_1 on Na_i binding, z_2 = -1 - z_1 on Na_o release)
        suggests z_1 = -0.055
      sourced: 'no'
review:
  comment: v_NKE/A_0 has the wrong sign on the voltage term (exp(-F u_e/RT) where the reaction scheme needs exp(+F u_e/RT)), and u_equil has the
    same sign error, so both diagnostics are wrong whenever u_e != 0 (v_NKE = 628 fmol/s vs 0.28 exact at -0.12 V). All eight parameters (K_1..K_4,
    kappa_2, kappa_4, z_1) are unsourced placeholders (1, 1, 1, 1, 1, 1, 0.5); the seeded 'Alfred_database' reference could not be identified.
    u_e and the ion/metabolite amounts are hard-coded rather than parameters. The hard-coded kappa_1 = kappa_3 = 1e4 make the model stiff (about
    9e4 1/s) but not fast enough for the rapid-equilibrium assumption behind v_NKE at the nominal point.
  summary: 'Four-state bond-graph Na+/K+-ATPase cycle (R1: 2K_o in / Pi out; R2: ATP in / 2K_i out; R3: 3Na_i in / ADP out, charge z_1; R4: 3Na_o
    out, charge z_2 = -1 - z_1). Ions and metabolites are chemostats. This is the 4-state lumping of Smith & Crampin (2004) / Terkildsen et al.
    (2007) written as a bond graph. The hard-coded ion/metabolite constants and C_m = 153400 fF match Pan et al. (2020) Table 2 exactly. I set
    up 6 invariants: total pump conserved, states >= 0, second law (every reaction dissipates), the exact energy-balance identity P_ext - P_diss
    = sum u_i dq_i/dt, cycle steady state v_1 = v_2 = v_3 = v_4 (3 Na out : 2 K in : 1 net charge per cycle), and v_NKE vs the exact rapid-equilibrium
    flux of the same scheme. All hold across the sweep except the v_NKE check, which fails because of a sign bug (expected failure; the fix is
    checked on a patched copy). The RK4 convergence test needs dt <= 1e-5 s because of the stiffness. The stability matrix passes. Validation
    is pending (Nakao & Gadsby 1989 I-V data), because no parameter is sourced.'
  questions:
  - 'Which paper or database is this 4-state reduction and its K_1..K_4, kappa_2, kappa_4, z_1 from? I could not identify the seeded "NKE_pump:
    Alfred_database" for K_1. The scheme matches the Smith & Crampin (2004) / Terkildsen (2007) 4-state lumping, but Pan et al. (2020) only has
    the 15-state bond graph. All eight are proposed as unreferenced_placeholder.'
  - 'z_1 = 0.5 (z_2 = -1.5): should it follow Pan et al. (2020) Table 2, where the charge on the third intracellular Na+ binding step (R5) is
    -0.055 and on extracellular Na+ release (R8) is -0.945, i.e. z_1 = -0.055 in this module''s convention?'
  - Approve the proposed fix to A_0 and u_equil (below)? v_NKE and u_equil are algebraic diagnostics and do not affect the ODEs.
  - The hard-coded amounts (q_Na_i = 1900 fmol = 50 mM in 38 pL; q_K_i = q_ADP = q_Pi = 0.038 fmol, about 1 uM; q_ATP = 380 fmol = 10 mM) look
    like a K_i-free, product-free experimental protocol, not physiological conditions. Is that intended? Should u_e (q_mem_init) and the ion/metabolite
    amounts become parameters so they can be swept and validated?
  - Use the Nakao & Gadsby (1989) pump I-V curves (the data Terkildsen 2007 and Pan 2020 fitted) as the validation baseline once real parameters
    exist? It needs I_pump = F v_4 and u_e as an input.
  proposed_fixes:
  - 'A_0: replace exp(-F u_e/RT) with exp(+F u_e/RT). The overall cycle carries net charge z_1 + z_2 = -1, so the forward/reverse ratio of the
    rate laws gives (Q_ATP Q_Ko^2 Q_Nai^3)/(Q_ADP Q_Pi Q_Ki^2 Q_Nao^3) exp(+F u_e/RT). Evidence: in a patched copy the invariant "v_NKE = exact
    rapid-equilibrium flux" holds to 1e-6. Offline, the corrected formula matches the kappa_1 = kappa_3 = 1e10 ODE steady state at u_e = -0.2,
    -0.12, 0 and 0.1 V for two parameter sets. The current formula only agrees at u_e = 0.'
  - 'u_equil: change to -(RT/F) ln(...) (the same argument), or rename it to say it is the negative of the pump reversal potential. The dynamic
    cycle flux reverses at u_e = -1.062 V, while the module''s u_equil = +1.062 V.'
  findings:
  - 'At the nominal point (all K, kappa = 1, z_1 = 0.5, u_e = -0.12 V) the ODE steady-state turnover is 0.00714 fmol/s per 1 fmol of pump. The
    rapid-equilibrium limit is 0.276 fmol/s: kappa_1 K_1 Q_Ko^2 = 668 1/s is slower than kappa_2 K_2 Q_ATP = 901 1/s, so step 1 is not "fast".
    Even after the fix, v_NKE will not match the dynamics unless kappa_1 and kappa_3 are much larger.'
  - Jacobian eigenvalues at the nominal point are about -9.2e4, -4.0e4 and -9.2e2 1/s. RK4 needs dt < 3e-5 s; CVODE handles it at rtol 1e-6.
  - At steady state Power_external = Power_dissipation = 6.49e-4 nW (second law and energy balance hold exactly).
