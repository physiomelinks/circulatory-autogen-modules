module: input_stimulation
reviewed: false
known_issues: []
defaults:
  sim_time: 3.0
  pre_time: 0.0
  dt: 0.001
  solver: CVODE_myokit
  bc_sweep:
    factors: [0.5, 0.75, 1.0, 1.5, 2.0]
    ranges: {}
  timestep:
    scheme: rk4
    dts: [0.004, 0.002, 0.001, 0.0005]
    min_order: 0.8
    tol: 0.0001
    cvode_tol: 0.001
  stability:
    supported:
    - {solver: CVODE_myokit, rtol: 1.0e-06, atol: 1.0e-08}
components:
- vessel_type: electrical_stim_input_Paci_2013
  BC_type: nn
  module_type: stim_mode_Paci_2013
  sim_time: 3.0
  outputs: [i_stim_period, i_stim]
  notes: 'Paci et al. (2013) stimulus current density: i_stim = stim_flag i_stim_amplitude/Cm (A/F) during the first i_stim_pulse_duration
    of each period between i_stim_start and i_stim_end, else 0; i_stim_period = 1/i_stim_frequency, frequency in Hz (the Paci
    CellML uses beats per minute with period = 60/f; converted on review 2026-09-29). Algebraic, no states. Sign: i_stim =
    +amplitude/Cm, as in the Paci model, where dVm/dt = -(sum of ionic currents) - i_stim, so a positive amplitude hyperpolarises
    and pacing uses a negative amplitude (the Myokit port uses -5.5e-10 A). Reviewed 2026-09-29: the CellML variables were
    renamed to the config names (they did not match, so no parameter reached the equations and i_stim was identically 0).'
  invariants:
  - {description: 'i_stim is the exact rectangular pulse train: stim_flag i_stim_amplitude/Cm while t_start <= t <= t_end
      and (t - t_start) mod period <= pulse_duration, else 0 (samples within 1e-9 s of an edge excluded)', expr: '(lambda
      N, i, t, s, e, P, d, a: N.all((N.abs(i - N.where((t >= s) & (t <= e) & (N.mod(t - s, P) <= d), a, 0.0)) <= 1e-9*max(abs(a),
      1e-300)) | (N.minimum(N.mod(t - s, P), P - N.mod(t - s, P)) < 1e-9) | (N.abs(N.mod(t - s, P) - d) < 1e-9) | (N.abs(t
      - e) < 1e-9)))(np, i_stim, t, i_stim_start, i_stim_end, 1.0/i_stim_frequency, i_stim_pulse_duration, stim_flag*i_stim_amplitude/Cm)'}
  - {description: i_stim_period = 1/i_stim_frequency (Hz), expr: 'np.allclose(i_stim_period, 1.0/i_stim_frequency, rtol=1e-12,
      atol=0)'}
  bc_sweep:
    ranges:
      stim_flag: {min: 0, max: 1, points: 2}
      i_stim_start: {min: 0.0, max: 0.5, points: 3}
      i_stim_end: {min: 1.0, max: 800.0, points: 3}
      i_stim_frequency: {min: 0.5, max: 3.0, points: 4}
      i_stim_pulse_duration: {min: 0.001, max: 0.01, points: 4}
      i_stim_amplitude: {min: 1.0e-10, max: 2.0e-09, points: 4, scale: log}
      Cm: {min: 5.0e-11, max: 2.0e-10, points: 4, scale: log}
    rationale: Pacing from 30 to 180 beats/min (0.33-2 s periods), pulses of 1-10 ms, amplitudes 0.1-2 nA and capacitances
      50-200 pF bracket the Paci 2013 hiPSC-CM protocol (60 bpm, 5 ms, 0.55 nA, 98.7 pF). t_end = 1 s checks that pacing stops;
      stim_flag 0 checks the switch.
  validation:
    baseline: {status: not_applicable, reason: 'prescribed stimulus waveform (an input, not a physiological response); verified
        against its exact analytic pulse train'}
    calibrate: {status: not_applicable, reason: 'prescribed stimulus waveform (an input, not a physiological response); verified
        against its exact analytic pulse train'}
- vessel_type: voltage_change
  BC_type: nn
  module_type: voltage_change
  outputs: [Vm]
  notes: 'Prescribed membrane-voltage ramp Vm = -0.08 + 0.01 t V (from -80 mV at 10 mV/s), a test input for voltage-dependent
    components (multi_port). No parameters and no states. Reviewed 2026-09-29: the config unit of Vm was "V" (undefined);
    now volt, as in the CellML.'
  invariants:
  - {description: Vm is the exact ramp -0.08 V + 0.01 V/s t, expr: np.max(np.abs(Vm - (-0.08 + 0.01*t))) <= 1e-12}
  validation:
    baseline: {status: not_applicable, reason: prescribed voltage ramp (test input); verified against its exact analytic form}
    calibrate: {status: not_applicable, reason: prescribed voltage ramp (test input); verified against its exact analytic
        form}
- vessel_type: i_stim_periodic
  BC_type: nn
  module_type: i_stim_periodic
  sim_time: 3.0
  outputs: [i]
  notes: 'Rectangular stimulus current in nA: i = -stim_flag i_amplitude during the first pulse_duration of each period between
    t_start and t_end (negative = inward/depolarising in the usual convention). Algebraic, no states. Sign: i = -stim_flag
    i_amplitude, so a positive amplitude gives a negative (inward, depolarising in the usual convention) current; the opposite
    sign to the Paci component. Timing and amplitude reuse the Paci 2013 protocol (no source of its own).'
  invariants:
  - {description: 'i is the exact rectangular pulse train: -stim_flag i_amplitude while t_start <= t <= t_end and (t - t_start)
      mod period <= pulse_duration, else 0 (samples within 1e-9 s of an edge excluded)', expr: '(lambda N, i, t, s, e, P,
      d, a: N.all((N.abs(i - N.where((t >= s) & (t <= e) & (N.mod(t - s, P) <= d), a, 0.0)) <= 1e-9*max(abs(a), 1e-300)) |
      (N.minimum(N.mod(t - s, P), P - N.mod(t - s, P)) < 1e-9) | (N.abs(N.mod(t - s, P) - d) < 1e-9) | (N.abs(t - e) < 1e-9)))(np,
      i, t, t_start, t_end, period, pulse_duration, -stim_flag*i_amplitude)'}
  - {description: 'charge per period: over the first two full periods the integral of i equals 2 (-stim_flag i_amplitude pulse_duration)
      to within one output step of samples (trapezoid)', expr: '(t_start + 2*period > t[-1]) or (t_end < t_start + 2*period)
      or (abs(np.trapz(np.where((t >= t_start) & (t < t_start + 2*period), i, 0.0), t) - 2*(-stim_flag*i_amplitude*pulse_duration))
      <= 2*stim_flag*abs(i_amplitude)*(t[1] - t[0]) + 1e-15)'}
  bc_sweep:
    ranges:
      stim_flag: {min: 0, max: 1, points: 2}
      t_start: {min: 0.0, max: 0.5, points: 3}
      t_end: {min: 1.0, max: 800.0, points: 3}
      period: {min: 0.33, max: 2.0, points: 4}
      pulse_duration: {min: 0.001, max: 0.01, points: 4}
      i_amplitude: {min: 0.1, max: 20.0, points: 4, scale: log}
    rationale: Periods 0.33-2 s (30-180 beats/min), 1-10 ms pulses and 0.1-20 nA amplitudes cover hiPSC-CM (0.55 nA, Paci
      2013) to adult-myocyte-scale stimuli. t_end = 1 s checks that pacing stops; stim_flag 0 checks the switch.
  validation:
    baseline: {status: not_applicable, reason: prescribed stimulus waveform (an input); verified against its exact analytic
        pulse train}
    calibrate: {status: not_applicable, reason: prescribed stimulus waveform (an input); verified against its exact analytic
        pulse train}
