      & np.allclose(v_MV, np.where(u_LA > u_LV, (u_LA - u_LV)/(1000000.0*R_MV), 0.0), rtol=1e-8, atol=1e-9*np.max(np.abs(v_MV)))
  - description: 'ventricular elastance E = u/(q - q_us) follows the prescribed activation exactly: E(mt) = (Emax - Emin)(x)
      exp((1 - x^2)/2) + Emin, x = min(mt, 0.4)/To_pk, for mt < 0.6, Emin after (mt = t/T mod 1; points within 1e-6 of a switch
      are skipped)'
    expr: np.allclose((u_LV/(q_LV - 0.001*q_LV_us))[np.abs(np.mod(t/T, 1) - 0.6) > 1e-6], (1000000.0*(np.where(np.mod(t/T,
      1) < 0.6, (E_LVmax - E_LVmin)*(np.minimum(np.mod(t/T, 1), 0.4)/To_pk)*np.exp(0.5*(1 - (np.minimum(np.mod(t/T, 1), 0.4)/To_pk)**2)),
