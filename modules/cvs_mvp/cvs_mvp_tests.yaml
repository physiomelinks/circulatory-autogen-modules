module: cvs_mvp
reviewed: false
known_issues: [module_type heart_simplesimple_type_OLD is not a component in the library]
defaults:
  sim_time: 2.0
  pre_time: 0.0
  dt: 0.01
  solver: CVODE_myokit
  bc_sweep:
    factors: [0.5, 0.75, 1.0, 1.5, 2.0]
    ranges: {}
  timestep:
    scheme: rk4
    dts: [0.004, 0.002, 0.001, 0.0005]
    min_order: 0.8
    tol: 0.0001
    cvode_tol: 0.001
  stability:
    supported:
    - {solver: CVODE_myokit, rtol: 1.0e-06, atol: 1.0e-08}
components:
- vessel_type: heart_simple_OLD
  BC_type: vp
  module_type: heart_simplesimple_type_OLD
  skip: 'module_type heart_simplesimple_type_OLD does not exist in cvs_mvp_modules.cellml (or anywhere in the library); structure
    known issue. Its ports (v_headV, v_lArmV, v_rArmV, v_V1, v_pulmV, u_AA, u_pulmA) belong to an older arm/head network;
    proposed fix: delete this config entry.'
  outputs: []
  invariants: []
  notes: Stale config entry for a removed heart type (kept here only so the spec mirrors the config).
  reference_proposals:
    v_pulmV: {reference: unreferenced_placeholder; boundary condition of the non-existent heart_simplesimple_type_OLD; proposed
        to delete the entry, sourced: 'no'}
    v_headV: {reference: unreferenced_placeholder; boundary condition of the non-existent heart_simplesimple_type_OLD; proposed
        to delete the entry, sourced: 'no'}
    v_lArmV: {reference: unreferenced_placeholder; boundary condition of the non-existent heart_simplesimple_type_OLD; proposed
        to delete the entry, sourced: 'no'}
    v_rArmV: {reference: unreferenced_placeholder; boundary condition of the non-existent heart_simplesimple_type_OLD; proposed
        to delete the entry, sourced: 'no'}
    v_V1: {reference: unreferenced_placeholder; boundary condition of the non-existent heart_simplesimple_type_OLD; proposed
        to delete the entry, sourced: 'no'}
    u_AA: {reference: unreferenced_placeholder; boundary condition of the non-existent heart_simplesimple_type_OLD; proposed
        to delete the entry, sourced: 'no'}
    u_pulmA: {reference: unreferenced_placeholder; boundary condition of the non-existent heart_simplesimple_type_OLD; proposed
        to delete the entry, sourced: 'no'}
  validation:
    baseline: {status: not_applicable, reason: component does not exist in the CellML}
    calibrate: {status: not_applicable, reason: component does not exist in the CellML}
- vessel_type: heart_simple
  BC_type: vp
  module_type: heart_simplesimple_type
  sim_time: 8.0
  dt: 0.001
  solver_info: {rtol: 1.0e-07, atol: 1.0e-09, MaximumStep: 0.001}
  timestep:
    dts: [0.0035, 0.00175, 0.000875, 0.0004375]
    t_end: 4.2
    min_order: 0.8
    tol: 0.1
    cvode_tol: 0.05
  stability:
    supported:
    - {solver: CVODE_myokit, rtol: 1.0e-07, atol: 1.0e-09, MaximumStep: 0.001}
  outputs: [q_LV, u_LV, q_RV, u_RV, q_LA, u_LA, q_RA, u_RA, v_AV, v_PV, v_MV, v_TV, q]
  invariants:
  - description: 'valves are ideal diodes: all valve flows >= 0'
    expr: np.all(v_AV >= 0) & np.all(v_PV >= 0) & np.all(v_MV >= 0) & np.all(v_TV >= 0)
  - description: atrial pressure-volume laws u_A = E_A (q_A - q_A_us) (constant elastance; units converted)
    expr: np.allclose(u_LA, 1.0*E_LA*(q_LA - 1.0*q_LA_us), rtol=1e-8, atol=1e-9*np.max(np.abs(u_LA))) & np.allclose(u_RA,
      1.0*E_RA*(q_RA - 1.0*q_RA_us), rtol=1e-8, atol=1e-9*np.max(np.abs(u_RA)))
  - description: 'valve laws: open valve flow = pressure drop / R, closed = 0 (aortic and mitral)'
    expr: np.allclose(v_AV, np.where(u_LV > u_root, (u_LV - u_root)/(1.0*R_AV), 0.0), rtol=1e-8, atol=1e-9*np.max(np.abs(v_AV)))
      & np.allclose(v_MV, np.where(u_LA > u_LV, (u_LA - u_LV)/(1.0*R_MV), 0.0), rtol=1e-8, atol=1e-9*np.max(np.abs(v_MV)))
  - description: 'ventricular elastance E = u/(q - q_us) follows the prescribed activation exactly: E(mt) = (Emax - Emin)(x)
      exp((1 - x^2)/2) + Emin, x = min(mt, 0.4)/To_pk, for mt < 0.6, Emin after (mt = t/T mod 1; points within 1e-6 of a switch
      are skipped)'
    expr: np.allclose((u_LV/(q_LV - 1.0*q_LV_us))[np.abs(np.mod(t/T, 1) - 0.6) > 1e-6], (1.0*(np.where(np.mod(t/T, 1) < 0.6,
      (E_LVmax - E_LVmin)*(np.minimum(np.mod(t/T, 1), 0.4)/To_pk)*np.exp(0.5*(1 - (np.minimum(np.mod(t/T, 1), 0.4)/To_pk)**2)),
      0.0) + E_LVmin))[np.abs(np.mod(t/T, 1) - 0.6) > 1e-6], rtol=1e-7) & np.allclose((u_RV/(q_RV - 1.0*q_RV_us))[np.abs(np.mod(t/T,
      1) - 0.6) > 1e-6], (1.0*(np.where(np.mod(t/T, 1) < 0.6, (E_RVmax - E_RVmin)*(np.minimum(np.mod(t/T, 1), 0.4)/To_pk)*np.exp(0.5*(1
      - (np.minimum(np.mod(t/T, 1), 0.4)/To_pk)**2)), 0.0) + E_RVmin))[np.abs(np.mod(t/T, 1) - 0.6) > 1e-6], rtol=1e-7)
  - description: 'volume balance of the whole heart: q(t) - q(0) = integral of (v_pvn + v_ivc + v_svc - v_AV - v_PV)'
    expr: np.max(np.abs(q - q[0] - np.concatenate([[0.0], np.cumsum(0.5*((v_pvn + v_ivc + v_svc - v_AV - v_PV)[1:] + (v_pvn
      + v_ivc + v_svc - v_AV - v_PV)[:-1])*np.diff(t))]))) <= 2e-2*(np.max(q) - np.min(q)) + 1e-9*np.max(q)
  - description: 'periodic steady state after 10 beats: the last cycle repeats the previous one (volumes within 0.1 %)'
    expr: np.max(np.abs(q_LV[t >= t[-1] - T] - np.interp(t[t >= t[-1] - T] - T, t, q_LV))) <= 1e-3*np.max(q_LV)
    applies: run
  - description: 'at the periodic state the ejected volume per beat equals the inflow per beat: integral of v_AV over the
      last cycle = v_pvn T and of v_PV = (v_ivc + v_svc) T (within 0.5 %)'
    expr: abs(np.sum(0.5*(v_AV[t >= t[-1] - T][1:] + v_AV[t >= t[-1] - T][:-1])*np.diff(t[t >= t[-1] - T])) - v_pvn*T) <=
      5e-3*v_pvn*T and abs(np.sum(0.5*(v_PV[t >= t[-1] - T][1:] + v_PV[t >= t[-1] - T][:-1])*np.diff(t[t >= t[-1] - T])) -
      (v_ivc + v_svc)*T) <= 5e-3*(v_ivc + v_svc)*T
    applies: run
  - description: chamber volumes stay positive
    expr: np.all(q_LV > 0) & np.all(q_RV > 0) & np.all(q_LA > 0) & np.all(q_RA > 0)
  notes: 'Four-chamber time-varying-elastance heart in litre/kPa. Ventricles: u = E(t)(q - q_us) with E(mt) = (Emax - Emin)(mt/To_pk)
    exp((1 - (mt/To_pk)^2)/2) + Emin for mt < 0.4, held at its mt = 0.4 value until mt = 0.6, then Emin (discontinuous drop
    at mt = 0.6). Atria: constant elastance (passive). Valves: ideal diodes with resistance. Alone, venous inflows (v_pvn,
    v_ivc, v_svc) are constant and the aortic/pulmonary root pressures (u_root, u_par) are held constant; the heart settles
    to a periodic state in which the mean ejection equals the inflow.'
  bc_sweep:
    ranges:
      u_root: {min: 8.0, max: 16.0, points: 3}
      u_par: {min: 1.0, max: 3.5, points: 3}
      delay: {min: 0.0, max: 0.5, points: 3}
    rationale: Aortic root pressure 8-16 kPa (60-120 mmHg) and pulmonary artery pressure 1-3.5 kPa (7.5-26 mmHg) span normal
      and hypo/hypertensive afterloads; every other constant (elastances, unstressed volumes, valve resistances, T, To_pk,
      venous inflows) at 0.5-2x nominal. delay only affects the unused output mta.
  reference_proposals:
    T: {reference: 'Bozkurt2019; Table 1 (adult): cardiac cycle T = 0.8 s', sourced: 'yes', value: 0.8}
    delay: {reference: 'definitional; atrial activation delay (fraction of T). Only used for the output mta, which no equation
        uses (atria have constant elastance)', sourced: definitional, value: 0.0}
    To_pk: {reference: 'Bozkurt2019; Table 1 (adult): end of ventricular systole T1 = 0.33 T, used as the time-to-peak fraction.
        NOTE: Bozkurt uses a raised-cosine activation, not the x exp((1-x^2)/2) form of this module; value transferred, shape
        not', sourced: 'no', value: 0.33}
    E_LVmax: {reference: 'Bozkurt2019; Table 1 (adult): LV end-systolic elastance Ees = 2.5 mmHg/mL = 333.3 kPa/L', sourced: 'yes',
      value: 333.3}
    E_LVmin: {reference: 'unreferenced_placeholder; no linear LV diastolic elastance found in a verified source (Bozkurt2019
        and Smith2004 use a nonlinear EDPVR). 10 kPa/L = 0.075 mmHg/mL, order of magnitude of the EDPVR slope at normal filling',
      sourced: 'no', value: 10.0}
    E_RVmax: {reference: 'Bozkurt2019; Table 1 (adult): RV end-systolic elastance Ees = 1 mmHg/mL = 133.3 kPa/L', sourced: 'yes',
      value: 133.3}
    E_RVmin: {reference: 'unreferenced_placeholder; no linear RV diastolic elastance in a verified source; 6.7 kPa/L = 0.05
        mmHg/mL, order of magnitude', sourced: 'no', value: 6.7}
    E_LA: {reference: 'Bozkurt2019; Table 1 (adult): LA minimum elastance 0.2 mmHg/mL = 26.7 kPa/L (this module has a constant,
        passive atrium; Bozkurt atria are active, Emax 0.3 mmHg/mL)', sourced: 'yes', value: 26.7}
    E_RA: {reference: 'Bozkurt2019; Table 1 (adult): RA minimum elastance 0.2 mmHg/mL = 26.7 kPa/L (passive atrium, see E_LA)',
      sourced: 'yes', value: 26.7}
    q_LV_us: {reference: 'Bozkurt2019; Table 1 (adult): LV V0 = 15 mL = 0.015 L', sourced: 'yes', value: 0.015}
    q_RV_us: {reference: 'Bozkurt2019; Table 1 (adult): RV V0 = 40 mL = 0.040 L', sourced: 'yes', value: 0.04}
    q_LA_us: {reference: 'Bozkurt2019; Table 1 (adult): LA V0 = 5 mL = 0.005 L', sourced: 'yes', value: 0.005}
    q_RA_us: {reference: 'Bozkurt2019; Table 1 (adult): RA V0 = 5 mL = 0.005 L', sourced: 'yes', value: 0.005}
    q_LV_init: {reference: unreferenced_placeholder; initial condition (typical adult LV end-diastolic volume ~120 mL); the
        periodic state does not depend on it, sourced: 'no', value: 0.12}
    q_RV_init: {reference: unreferenced_placeholder; initial condition (typical RV end-diastolic volume ~140 mL), sourced: 'no',
      value: 0.14}
    q_LA_init: {reference: unreferenced_placeholder; initial condition (~50 mL), sourced: 'no', value: 0.05}
    q_RA_init: {reference: unreferenced_placeholder; initial condition (~50 mL), sourced: 'no', value: 0.05}
    R_AV: {reference: 'Bozkurt2019; Table 2 (adult) (valve resistances): aortic valve 0.002 mmHg s/mL = 0.2666 kPa s/L', sourced: 'yes',
      value: 0.2666}
    R_MV: {reference: 'Bozkurt2019; Table 2 (adult) (valve resistances): mitral valve 0.002 mmHg s/mL = 0.2666 kPa s/L', sourced: 'yes',
      value: 0.2666}
    R_PV: {reference: 'Bozkurt2019; Table 2 (adult) (valve resistances): pulmonary valve 0.001 mmHg s/mL = 0.1333 kPa s/L',
      sourced: 'yes', value: 0.1333}
    R_TV: {reference: 'Bozkurt2019; Table 2 (adult) (valve resistances): tricuspid valve 0.001 mmHg s/mL = 0.1333 kPa s/L',
      sourced: 'yes', value: 0.1333}
    v_pvn: {reference: unreferenced_placeholder; isolated-test boundary value (pulmonary venous return = cardiac output 5
        L/min); in a network it is supplied by the neighbouring vessel, sourced: 'no', value: 0.0833}
    v_ivc: {reference: unreferenced_placeholder; isolated-test boundary value (IVC return 3 L/min); in a network it is supplied
        by the neighbouring vessel, sourced: 'no', value: 0.05}
    v_svc: {reference: unreferenced_placeholder; isolated-test boundary value (SVC return 2 L/min); in a network it is supplied
        by the neighbouring vessel, sourced: 'no', value: 0.0333}
    u_root: {reference: unreferenced_placeholder; isolated-test boundary value (aortic root pressure held at 90 mmHg); in
        a network it is supplied by the neighbouring vessel, sourced: 'no', value: 12.0}
    u_par: {reference: unreferenced_placeholder; isolated-test boundary value (pulmonary artery pressure held at 15 mmHg);
        in a network it is supplied by the neighbouring vessel, sourced: 'no', value: 2.0}
  validation: &id001
    baseline: {status: pending, reason: 'candidate: normal adult LV pressure-volume loop (EDV ~120 mL, ESV ~50 mL, LVSP ~120
        mmHg) e.g. Bozkurt2019 Fig./Table of adult haemodynamics; needs the isolated heart coupled to a closed loop (constant
        BCs cannot give a physiological loop) and a heart source for this elastance shape'}
    calibrate: {status: pending, reason: as baseline}
- vessel_type: heart_simple_2
  BC_type: vp
  module_type: heart_simplesimple_type2
  sim_time: 8.0
  dt: 0.001
  solver_info: {rtol: 1.0e-07, atol: 1.0e-12, MaximumStep: 0.001}
  timestep:
    dts: [0.0035, 0.00175, 0.000875, 0.0004375]
    t_end: 4.2
    min_order: 0.8
    tol: 0.1
    cvode_tol: 0.05
  stability:
    supported:
    - {solver: CVODE_myokit, rtol: 1.0e-07, atol: 1.0e-12, MaximumStep: 0.001}
