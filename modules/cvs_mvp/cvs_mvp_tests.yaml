    - {solver: CVODE_myokit, rtol: 1.0e-08, atol: 1.0e-13}
  outputs: [q, u, v, a1/v, a1/q, a2/v, a2/q]
  invariants:
  - description: Ohm law v = (u - u_out)/R and pressure-volume law u = u_0 + (q - q_0)/C
    expr: np.allclose(v*R, u - u_out, rtol=1e-8, atol=1e-9*np.max(np.abs(u))) & np.allclose(u, u_0 + (q - q_0)/C, rtol=1e-8,
      atol=1e-9*np.max(np.abs(u)))
  - description: 'volume stays positive (q > 0) at the run point (not across the sweep: a constant forced outflow can legitimately
      drain the compartment below zero)'
    expr: np.all(q > 0)
    applies: run
  - description: 'mass balance of the junction with its neighbours: q(t) - q_init = integral of ((a1__v + a2__v) - (v)), the
      sums taken over the connected neighbours'
    expr: np.max(np.abs(q - q_init - np.concatenate([[0.0], np.cumsum(0.5*(((a1__v + a2__v) - (v))[1:] + ((a1__v + a2__v)
      - (v))[:-1])*np.diff(t))]))) <= 1e-2*np.max(np.abs(q - q_init)) + 1e-6*abs(q_init)
  notes: 'Flow-in / pressure-out RC compartment without inertance (SI (m3, Pa)): dq/dt = v_in_sum - v, v = (u - u_out)/R,
    u = u_0 + (q - q_0)/C. Linear first order with time constant RC. Junction variant: the inflow/outflow is the sum over
    several neighbours (a single constant alone). Duplicate of the litre/kPa component with SI units. Tested in a harness
    (a1 + a2 -> mod): libcuflynx builds a junction only between real vessels, so the neighbours are "simple_2" vp_noI (upstream,
    constant inflow at their open inlet) / pv_noI (downstream, constant outflow at their open outlet) compartments with the
    same R and C. The neighbours are dynamic, so the checks are the port sums, the Ohm and P-V laws, and mass balance rather
    than the single-compartment exact solution.'
  bc_sweep:
    ranges:
      u_out: {min: 0.0, max: 12000.0, points: 5}
      q_init: {min: 0.0001, max: 0.000406, points: 3}
      u_0: {min: 0.0, max: 6000.0, points: 3}
