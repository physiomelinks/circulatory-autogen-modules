        0 kPa = 0 Pa]', sourced: definitional, value: 0.0}
    C: {reference: 'Bozkurt2019; Table 2 (adult): systemic arterioles C = 1.7 mL/mmHg = 0.01275 L/kPa (representative compartment)
        [SI variant: 0.01275 L_per_kPa = 1.275e-08 m3/Pa]', sourced: 'yes', value: 1.275e-08}
    q_init: {reference: 'definitional; initial volume q_0 + C x 12 kPa (mean systemic pressure 90 mmHg) = 0.253 L [SI variant:
