module_type: valve
version: pp
reviewed: false
notes: 'Mynard et al. 2012 valve: the state zeta opens at (1 - zeta) K_vo dp under a forward pressure difference
  and closes at zeta K_vc dp under a reverse one (Eq. 6-7, thresholds 0); A_eff = ((M_st - M_rg) zeta + M_rg) A_ann
  (Eq. 4-5); dp = B v|v| + L dv/dt with B = rho/(2 A_eff^2), L = rho l_eff/A_eff (Eq. 1-3). Parameterisations per heart
  valve (aov default, miv, puv, trv) and Mynard''s mild and severe aortic stenosis cases; l_eff from Mynard & Smolich
  2015 Table 4 (the 2012 paper gives none). Tests are driven by a prescribed pressure (an obs_data protocol); CVODE''s
  step is capped at 1 ms, because a closed valve is static and CVODE otherwise steps over a short forward-pressure window.'
expected_failures:
  validation_test_baseline[aov]: 'the Liang 2009 Fig. 4f aortic-flow item (nrmse 0.24; Mynard''s zeta and A_eff items pass,
    0.027 and 0.026) is a cross-model comparison: Liang''s valve is a different model (Bernoulli plus the Garcia term, EOA
    4.0 cm^2, Eq. 13-14) from Mynard''s with A_ann 6.8 cm^2, and its pressure difference is the difference of two separately
    digitised curves (Fig. 4a, 4b), good to about 1-2 mmHg, to which the open valve''s flow is very sensitive.'
  validation_test_baseline[aov_severe_stenosis]: 'the A_eff item (nrmse 0.32): Mynard 2012 is inconsistent here. Fig. 4
    peaks at 0.68 cm^2, but Table III''s M_st = 0.15 on A_ann 6.8 cm^2 gives 1.02 cm^2 (the normal and mild cases agree
    with the table). The valve state zeta, which is independent of A_ann, matches Fig. 5 (nrmse 0.006).'
