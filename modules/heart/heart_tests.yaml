    - - R_aortic_root
      - Js_per_m6
      - 1000000.0
      - circulatory_autogen 3compartment example (to_be_identified)
    - - C_aortic_root
      - m6_per_J
      - 1.2028e-08
      - circulatory_autogen 3compartment example (to_be_identified)
    - - u_ext_aortic_root
      - J_per_m3
      - 0.0
      - circulatory_autogen 3compartment example (user_defined)
    - - I_aortic_root
      - Js2_per_m6
      - 100000.0
      - 'harness: inertance set to 1e5 Pa s2/m3 (~ rho l/A of a large vessel) instead of the 3compartment value 10000 (to_be_identified),
