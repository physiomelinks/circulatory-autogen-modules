    - - Delta_q_us_pvn
      - dimensionless
      - 0.0
      - circulatory_autogen 3compartment example (user_defined)
    - - Delta_C_pvn
      - dimensionless
      - 0.0
      - circulatory_autogen 3compartment example (user_defined)
    - - R_par
      - Js_per_m6
      - 10664000.0
      - circulatory_autogen 3compartment example (Blanco_2013_Table_8)
    - - C_par
      - m6_per_J
      - 3.09077e-10
      - circulatory_autogen 3compartment example (to_be_identified)
    - - u_ext_par
      - J_per_m3
      - 0.0
      - circulatory_autogen 3compartment example (user_defined)
    - - I_par
      - Js2_per_m6
      - 100000.0
      - 'harness: inertance set to 1e5 Pa s2/m3 (~ rho l/A of a large vessel) instead of the 3compartment value 0.000001 (Blanco_2013_Table_8),
