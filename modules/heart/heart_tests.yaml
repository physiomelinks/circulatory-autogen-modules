      - 100000.0
      - 'harness: inertance set to 1e5 Pa s2/m3 (~ rho l/A of a large vessel) instead of the 3compartment value 0.01 (small_chosen),
        which made the network (not the heart) extremely stiff (R/I up to 1e13 1/s)'
    - - q_us_0_pvn
      - m3
