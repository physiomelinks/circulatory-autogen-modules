- vessel_type: heart_nonstiff
  BC_type: vp_wCont
  module_type: heart_nonstiff
  outputs:
  - q_lv
  - q_rv
  - q_la
  - q_ra
  - u_lv
  - u_rv
  - u_la
  - u_ra
  - v_aov
  - v_miv
  - v_trv
  - v_puv
  - e_a
  - e_v
  - A_eff_aov
  - A_eff_miv
  - A_eff_trv
  - A_eff_puv
  - q_heart
  - aortic_root/u
  - par/u
  - sum_blood_volume/q_volume_sum_sum
  - T_wCont
  invariants:
  - description: 'closed-loop blood volume is conserved: the network total (heart + 5 vessels) stays at its initial value'
    expr: np.ptp(sum_blood_volume__q_volume_sum_sum) <= 1e-6*np.mean(sum_blood_volume__q_volume_sum_sum)
  - description: q_heart is the sum of the four chamber volumes
    expr: np.max(np.abs(q_heart - (q_ra + q_rv + q_la + q_lv))) <= 1e-9*np.max(q_heart)
  - description: 'LV volume balance: q_lv(t) - q_lv(0) = integral of (v_miv - v_aov) (trapezoid on the output grid)'
    expr: np.max(np.abs(q_lv - q_lv[0] - np.concatenate([[0.0], np.cumsum(0.5*((v_miv - v_aov)[1:] + (v_miv - v_aov)[:-1])*np.diff(t))])))
      <= 5e-3*np.ptp(q_lv)
  - description: 'RV volume balance: q_rv(t) - q_rv(0) = integral of (v_trv - v_puv)'
    expr: np.max(np.abs(q_rv - q_rv[0] - np.concatenate([[0.0], np.cumsum(0.5*((v_trv - v_puv)[1:] + (v_trv - v_puv)[:-1])*np.diff(t))])))
      <= 5e-3*np.ptp(q_rv)
  - description: 'LV pressure-volume law holds exactly: u_lv = (e_v E_lv_A + E_lv_B)(q_lv - q_lv_us) + u_intraThor (E_lv_A
      + Delta_E_lv)'
    expr: np.max(np.abs(u_lv - ((e_v*(E_lv_A + Delta_E_lv) + E_lv_B)*(q_lv - q_lv_us) + u_intraThor))) <= 1e-6*np.max(np.abs(u_lv))
  - description: 'RA pressure-volume law holds exactly: u_ra = (e_a E_ra_A + E_ra_B)(q_ra - q_ra_us) + u_intraThor'
    expr: np.max(np.abs(u_ra - ((e_a*E_ra_A + E_ra_B)*(q_ra - q_ra_us) + u_intraThor))) <= 1e-6*np.max(np.abs(u_ra)) + 1e-9
  - description: activation functions e_a, e_v stay in [0, 1] and both reach full activation (max > 0.99) every run
    expr: (np.min(e_a) >= 0) & (np.max(e_a) <= 1) & (np.min(e_v) >= 0) & (np.max(e_v) <= 1) & (np.max(e_a) > 0.99) & (np.max(e_v)
      > 0.99)
  - description: all four chamber volumes stay positive
    expr: (np.min(q_lv) > 0) & (np.min(q_rv) > 0) & (np.min(q_la) > 0) & (np.min(q_ra) > 0)
  - description: valve effective areas stay within [M_rg A_nn, M_st A_nn] (valve state 0 <= zeta <= 1; zeta is clamped below
      by max(zeta_pre, 0) but not above, so 1e-4 relative numerical overshoot is allowed)
    expr: (np.min(A_eff_aov) >= M_rg_aov*A_nn_aov*(1 - 1e-6) - 1e-12) & (np.max(A_eff_aov) <= M_st_aov*A_nn_aov*(1 + 1e-4))
      & (np.min(A_eff_miv) >= M_rg_miv*A_nn_miv*(1 - 1e-6) - 1e-12) & (np.max(A_eff_miv) <= M_st_miv*A_nn_miv*(1 + 1e-4))
      & (np.min(A_eff_trv) >= M_rg_trv*A_nn_trv*(1 - 1e-6) - 1e-12) & (np.max(A_eff_trv) <= M_st_trv*A_nn_trv*(1 + 1e-4))
      & (np.min(A_eff_puv) >= M_rg_puv*A_nn_puv*(1 - 1e-6) - 1e-12) & (np.max(A_eff_puv) <= M_st_puv*A_nn_puv*(1 + 1e-4))
  - description: 'valves: backflow volume over the last cycle is < 5% of the forward volume, for all four valves (M_rg = 0:
      closure transients only)'
    applies: run
    expr: (-np.sum(np.minimum(v_aov, 0)[t >= t[-1] - T_wCont[0]]) <= 0.05*np.sum(np.maximum(v_aov, 0)[t >= t[-1] - T_wCont[0]]))
      & (-np.sum(np.minimum(v_miv, 0)[t >= t[-1] - T_wCont[0]]) <= 0.05*np.sum(np.maximum(v_miv, 0)[t >= t[-1] - T_wCont[0]]))
      & (-np.sum(np.minimum(v_trv, 0)[t >= t[-1] - T_wCont[0]]) <= 0.05*np.sum(np.maximum(v_trv, 0)[t >= t[-1] - T_wCont[0]]))
      & (-np.sum(np.minimum(v_puv, 0)[t >= t[-1] - T_wCont[0]]) <= 0.05*np.sum(np.maximum(v_puv, 0)[t >= t[-1] - T_wCont[0]]))
  - description: 'periodic steady state (after pre_time): q_lv, q_rv, q_la change by < 1% of their range over the last cycle'
    applies: run
    expr: (abs(q_lv[-1] - q_lv[np.argmin(np.abs(t - (t[-1] - T_wCont[0])))]) <= 0.01*np.ptp(q_lv)) & (abs(q_rv[-1] - q_rv[np.argmin(np.abs(t
      - (t[-1] - T_wCont[0])))]) <= 0.01*np.ptp(q_rv)) & (abs(q_la[-1] - q_la[np.argmin(np.abs(t - (t[-1] - T_wCont[0])))])
      <= 0.01*np.ptp(q_la))
  - description: at steady state LV and RV eject the same volume per beat (within 2%)
    applies: run
    expr: abs(np.sum(v_aov[t >= t[-1] - T_wCont[0]]) - np.sum(v_puv[t >= t[-1] - T_wCont[0]])) <= 0.02*np.sum(v_aov[t >= t[-1]
      - T_wCont[0]])
  - description: the LV pressure oscillates with the heart period T_wCont = max(T + Delta_T, T_min) (within 1%)
    applies: run
    expr: abs(period(t, u_lv) - T_wCont[0]) <= 0.01*T_wCont[0]
  - description: heart period T_wCont = max(T + Delta_T, T_min)
    expr: np.max(np.abs(T_wCont - max(T + Delta_T, T_min))) <= 1e-12
  harness:
    vessel_array:
    - - ivc_zero
      - nn_constant
      - inlet_flow
      - ''
      - mod
    - - mod
      - vp_wCont
      - heart_nonstiff
      - ivc_zero venous_svc pvn
      - aortic_root par volume_sum
    - - aortic_root
      - vv
      - arterial_simple
      - mod
      - systemic_T volume_sum
    - - systemic_T
      - pp_spec_I
      - terminal
      - aortic_root
      - venous_svc volume_sum
    - - venous_svc
      - vp
      - venous
      - systemic_T
      - mod volume_sum
    - - pvn
      - vp
      - venous
      - par
      - mod volume_sum
    - - par
      - vp
      - arterial_simple
      - mod
      - pvn volume_sum
    - - volume_sum
      - nn
      - volume_sum
      - pvn par mod aortic_root systemic_T venous_svc
      - ''
  solver_info:
    rtol: 1.0e-06
    atol: 1.0e-08
    MaximumStep: 0.0001
  stability:
    t_end: 2.0
    fixed_step:
      schemes:
      - euler
      - heun
      - rk4
      dt_start: 0.0004
    supported:
    - solver: CVODE_myokit
      rtol: 1.0e-06
      atol: 1.0e-08
      MaximumStep: 0.0001
  notes: 'heart_simple_wCont with linearised valve losses: B v|v| replaced by R_lin v with R_lin = 2 B v_ref (the tangent
    of the Bernoulli loss at flow v_ref), meant to reduce stiffness. Same harness.'
  expected_failures:
    verification_test_invariants: 'Model behaviour: at the nominal point the RA volume goes negative every beat (min q_ra
      = -7.3 ml, u_ra down to -105 Pa suction through the linearised tricuspid valve). heart_simple_wCont with the same parameters
      keeps min q_ra = +7.5 ml. The linear loss R_lin = 2 B v_ref (v_ref 50-100 ml/s) is much smaller than the Bernoulli loss
      at peak flows (~500 ml/s), so the open valves under-resist. (With MaximumStep 1e-3 the beats were also irregular; with
      the declared MaximumStep 1e-4 backflow is <1% and the state is periodic.)'
    verification_test_BC: 'Same defect as verification_test_invariants: q_ra < 0 in 244 of 247 sweep runs (only the runs that
      raise the RA volume avoid it).'
    verification_test_timestep: 'RK4 is unstable at dt = 2e-4 and 1e-4 (non-finite; differences 163 at 1e-4) and only finite
      at 5e-5. Linearising the valve makes it stiffer, not less stiff: with the valve closed R_lin/L = v_ref/(l_eff A_eff)
      -> v_ref/(l_eff eps) ~ 5e11 1/s regardless of the flow, whereas the Bernoulli loss rate |v|/(l_eff A_eff) vanishes with
      the flow.'
  validation:
    baseline:
      status: proposed
      source: 'Maceira2006LV; Table 8, all subjects (n = 120, 60 men / 60 women, SSFP CMR): EDV 142 +- 21 ml, ESV 47 +- 10
        ml, SV 95 +- 14 ml, EF 67 +- 4.6 %. Pressures: Table 1 brachial cuff blood pressure, range of the age-decile means
        of men and women (systolic 115-135, diastolic 68-79 mmHg); brachial, not central aortic, pressure, so the pressure
        targets are approximate. Checked directly in the scmr.org PDF of the paper. A target passes when |model - mean| <=
        2 SD, or the model lies in the range.'
      source_short: Maceira 2006 normal adults
      pre_time: 20.0
      sim_time: 5.0
      targets:
      - name: LV end-diastolic volume
        expr: np.max(q_lv)*1e6
        value: 142
        std: 21
        units: ml
      - name: LV end-systolic volume
        expr: np.min(q_lv)*1e6
        value: 47
        std: 10
        units: ml
      - name: LV stroke volume
        expr: np.ptp(q_lv)*1e6
        value: 95
        std: 14
        units: ml
      - name: LV ejection fraction
        expr: 100*np.ptp(q_lv)/np.max(q_lv)
        value: 67
        std: 4.6
