module: heart
reviewed: false
known_issues: []
defaults:
  sim_time: 5.0
  pre_time: 20.0
  dt: 0.001
  solver: CVODE_myokit
  solver_info:
    rtol: 1.0e-06
    atol: 1.0e-08
    MaximumStep: 0.001
  bc_sweep:
    factors:
    - 0.5
    - 0.75
    - 1.0
    - 1.5
    - 2.0
    ranges:
      T:
        min: 0.6
        max: 1.5
        points: 5
      T_min:
        min: 0.25
        max: 0.5
        points: 3
      t_astart:
        min: 0.6
        max: 0.95
        points: 5
      t_vstart:
        min: 0.0
        max: 0.1
        points: 3
      T_vc:
        min: 0.2
        max: 0.4
        points: 5
      T_vr:
        min: 0.08
        max: 0.25
        points: 5
      T_ac:
        min: 0.08
        max: 0.25
        points: 5
      T_ar:
        min: 0.08
        max: 0.25
        points: 5
      rho:
        min: 1040
        max: 1070
        points: 3
      M_rg_trv:
        min: 0.0
        max: 0.05
        points: 3
      M_rg_puv:
        min: 0.0
        max: 0.05
        points: 3
      M_rg_miv:
        min: 0.0
        max: 0.05
        points: 3
      M_rg_aov:
        min: 0.0
        max: 0.05
        points: 3
      M_st_trv:
        min: 0.5
        max: 1.0
        points: 3
      M_st_puv:
        min: 0.5
        max: 1.0
        points: 3
      M_st_miv:
        min: 0.5
        max: 1.0
        points: 3
      M_st_aov:
        min: 0.5
        max: 1.0
        points: 3
      u_intraThor:
        min: -1000
        max: 1000
        points: 5
      Delta_T:
        min: -0.4
        max: 0.5
        points: 5
      Delta_E_lv:
        min: -100000000.0
        max: 100000000.0
        points: 5
      Delta_E_rv:
        min: -30000000.0
        max: 30000000.0
        points: 5
      R_ASD:
        min: 1000000.0
        max: 100000000.0
        points: 5
        scale: log
      beta:
        min: 1.8
        max: 2.2
        points: 3
      A_nn_trv:
        min: 0.0004
        max: 0.001
        points: 4
    exclude:
    - u_root
    - u_par
    - v_ivc
    - v_svc
    - v_pvn
    plot_output: q_lv
    rationale: 'Heart timing: T 0.6-1.5 s (HR 40-100 bpm; T_vc + T_vr = 0.49 s bounds T below), T_vc/T_vr/T_ac/T_ar about
      their Liang 2009 values within physiological bounds, t_astart 0.6-0.95 s (atrial kick in late diastole), t_vstart 0-0.1
      s. Elastances, unstressed and initial volumes, valve rate constants K_vo/K_vc, annulus areas, l_eff, v_ref: x0.5-2 of
      nominal (covers the healthy spread and the control-driven changes Delta_E). M_rg 0-0.05 (mild regurgitant orifice),
      M_st 0.5-1 (up to moderate stenosis); A_nn_trv only 4-10 cm2, because above ~10.2 cm2 the RA volume goes negative (linear
      P-V law allows suction, u_ra < 0; recorded as a finding). rho 1040-1070 kg/m3 (blood). u_intraThor +-1 kPa (+-7.5 mmHg,
      respiratory swing), Delta_T -0.4..0.5 s (baroreflex period changes; T_min floor), Delta_E_lv +-100 MPa/m3 and Delta_E_rv
      +-30 MPa/m3 (inotropic control), R_ASD 1e6-1e8 Pa s/m3 (large to small defect). The inputs connected by the harness
      network (u_root, u_par, v_ivc, v_svc, v_pvn) are not parameters of the network model and are excluded. Invariants marked
      applies: run (steady state, backflow, period) are checked at the nominal point only, since the sweep deliberately includes
      regurgitant valves and slow transients.'
  timestep:
    scheme: rk4
    dts:
    - 0.0002
    - 0.0001
    - 5.0e-05
    - 2.5e-05
    min_order: 0.8
    tol: 0.001
    cvode_tol: 0.01
    t_end: 1.0
  harness:
    parameters:
    - - v_ivc_zero
      - m3_per_s
      - 0.0
