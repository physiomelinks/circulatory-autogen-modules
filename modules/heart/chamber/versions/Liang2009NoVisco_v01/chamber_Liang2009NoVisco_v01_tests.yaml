module_type: chamber
version: Liang2009NoVisco_v01
reviewed: true
notes: 'Heart chamber with the time-varying elastance of Liang et al. 2009 (MBEC 47:743). A phase chi_floor = P(s), computed from
  the cardiac clock''s beat phase s, rises over contraction (T_c), relaxation (T_r) and diastole; the activation is e = (1 - cos(2 pi
  chi_final))/2 in [0, 1], and the pressure u = (e E_A_eff + E_B)(q - q_us) + u_ext with E_A_eff = E_A + Delta_E (a
  controller''s change), dq/dt = v_in - v_out. Tested in a harness with cardiac_clock/Liang2009_v01 driving it (review
  2026-10-09; it was clamped at mt = 0.5 before, so nothing moved).
  Solver: the activation e is a C1 function of the beat phase s (its second derivative jumps at the four phase
  boundaries); the spec runs CVODE with MaximumStep 1 ms.
  Parameterisations (review 2026-10-12): lv (the default), rv, la and ra, from Liang 2009 Table 2 (E_A, E_B, T_cp, T_rp,
  t_c; mmHg/ml converted at 133.322368e6 J/m^6) and Korakianitis & Shi 2006 Table 1 (unstressed volumes V_x,0 = q_us).
  lv starts at its end-diastolic volume (Liang Fig. 4e, digitised), the others at their unstressed volumes.
  **Departure from Liang 2009: the chamber pressure omits the viscoelastic term S dV/dt of Liang Eq. 9 (S = P x 0.0005
  s/ml), as the circulatory_autogen model does, so the pressure differs from Liang''s where dV/dt is large (ejection and
  rapid filling).**
  The lv dead volume q_us stays Korakianitis''s 5 ml: calibrated with the afterload and preload to Liang''s P-V loop
  (Fig. 4e EDV and ESV) in the validation loop with a contracting left atrium, it comes out at 5.3 ml (chamber
  Liang2009NoVisco_v01) and 4.3 ml (Liang2009_v01), confirming it; q_us stays in the calibration as a check, not applied
  (review 2026-10-12).
  The phase chi (contraction, relaxation and diastole, piecewise linear in the beat phase, with chi_floor and the
  activation e = (1 - cos(2 pi chi_final))/2) is ArgusUnpublished work (argus2026unpublished): Liang''s activation is an
  explicit function of time (Eqs. 11-12); here it is a function of the clock''s beat phase s, chi_floor = P(s) and
  chi = floor(s - t_start/T) + P(s), so it follows the clock''s period and stays in phase when the period changes. It is
  the closed form of the gated, integrated phase state of the original law (docs/heart/cardiac_clock_phase.md).'
expected_failures:
  verification_test_timestep: 'The harness''s only state is q, whose rate is a smooth function of time, so the fixed-step
    solutions agree to round-off at every dt: the successive differences (1.3e-11 to 5.1e-11) grow as dt halves, round-off
    accumulating over more steps, just above the test''s round-off floor (timestep.roundoff, default 1e-11), and "differences
    do not decrease" fails. It is not a convergence failure (docs/heart/cardiac_clock_phase.md).'
  cuflynx_parameterisation_omex_test[lv]: 'Fails until a CUFLynx update: the released CUFLynx (0.7.1) bundles a libcuflynx that
    predates held-out data in prediction_items (circulatory_autogen #535/#536) and data_reference on items (#618), and
    rejects lv_obs_data.json. Checked on
    2026-10-13 with CUFLynx run from source on a libcuflynx with #536: the archive loads and runs; its outputs match
    libcuflynx to 3.6e-6 (the pulmonary conduit''s valve flow pvc_module/v; the test''s tolerance is 1e-6), the stiff valve
    difference the heart archives also show.'
  validation_test_baseline: 'lv: the peak LV pressure is 120.6 mmHg vs Liang''s 108 (target 97-119) at periodic steady state: without Liang''s
    viscoelastic S dV/dt term (Eq. 9) the ejection pressure is 13 % high; chamber/Liang2009_v01, with the term, peaks at
    115.6 mmHg and passes. The other held-out targets (minimum and end-diastolic pressure) and the calibration pass
    (review 2026-10-12).'
review:
  summary: 'Reviewed 2026-10-09 to 2026-10-13 with Finbar Argus (was chamber/vv). Liang 2009 time-varying elastance without
    the viscoelastic term; parameterisations lv (default), rv, la, ra traced to Liang Table 2 and Korakianitis & Shi 2006
    Table 1 (mmHg at 133.322368 Pa); lv starts at Liang''s Fig. 4e EDV.'
  decisions:
  - 'tests: a cardiac_clock harness (was clamped, constant); 5 invariants; BC sweep with T 0.4-1.5 s; CVODE MaximumStep 1 ms
    (the piecewise phase rate mistimed beats without it); time-step test partial after a 30 s warm-up (first order across a switch)'
  - 'validation: a left-heart loop with a contracting LA; afterload (compliance bounded to Liang''s ~1.5 ml/mmHg), preload
    and q_us calibrated to Liang Fig. 4b and the Fig. 4e EDV/ESV at periodic steady state (spec periodic_steady_state);
    the Fig. 4a LV pressure held out (nrmse 0.075); q_us stays Korakianitis''s 5 ml (the calibration confirms it)'
  - 'the omitted viscoelastic S dV/dt is a bold departure: the peak LV pressure is 120.6 vs 108 mmHg (expected failure);
    chamber/Liang2009_v01 has the term'
  - 'creator Finbar Argus; the gated phase variable chi is ArgusUnpublished work'
