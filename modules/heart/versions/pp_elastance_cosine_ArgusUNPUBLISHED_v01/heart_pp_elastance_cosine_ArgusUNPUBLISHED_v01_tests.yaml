notes: 'One ventricle with a raised-cosine time-varying elastance E = E_min + (s_heart E_max - E_min)(1 - c)/2, pressure u = E (q - q_0), and smooth inlet and outlet valves v = G dP sigma(k_valve dP), sigma(x) = 1/(1 + exp(-x)), written (1 + tanh(x/2))/2 so it cannot overflow, dP the pressure drop across the valve. The valves let a little blood back while dP < 0: at most about 0.28 G/k_valve, decaying as exp(-k_valve |dP|) (at the default parameters about 0.1% of the forward stroke volume through the outlet valve). Not polynomial: the valves are logistic. f comes through heart_frequency_port, and s_heart (strength, 1 at rest; scales E_max) through heart_strength_port. The phase oscillator is written as c = cos(theta), s = sin(theta), dc/dt = -2 pi f s, ds/dt = 2 pi f c, so the beat shape (1 - c) is polynomial in the states (built for a known-structure test model for Operator Inference, ICUHealthy models/simple). c^2 + s^2 = 1 is conserved by the equations; the solver lets it drift slowly (about 2e-5 per 10 minutes at 70 bpm with rtol 1e-8, atol 1e-10, max step 0.25 ms, faster at higher f).'
