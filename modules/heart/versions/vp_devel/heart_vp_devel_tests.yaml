module_type: heart
version: vp_devel
reviewed: false
notes: 'heart_devel (marked "unvalidated" in the CellML): heart_simple with a patient-specific aortic valve law B_aov = gamma
  rho (pi r_ao^2)^beta /(r_lvot^4 A_eff^beta), A_eff_aov based on the measured valve area A_aov, L_aov from r_lvot, and saturating
  B values for all valves. It cannot currently be generated (see expected_failures).'
expected_failures:
  run_test: 'heart_devel cannot be generated: the config declares B_aov, B_trv, B_puv, B_miv as dimensionless variables while
    the CellML declares them Js2_per_m9, and A_eff_trv/puv/miv/aov and u_rv, u_lv (declared "variable" in the config) have
    no public_interface in the CellML component. libcellml: "Variable ''A_eff_trv'' in component ''mod_module'' has no interface
    type set"; "Variable ''B_trv'' ... units of ''Js2_per_m9'' and an equivalent variable ... non-matching units of ''dimensionless''".
    A patched copy (B_* units Js2_per_m9 in the config; public_interface="out" on A_eff_* and u_rv, u_lv) generates and runs
    in the harness (LV peak 233 mmHg vs aortic 137 mmHg, i.e. a stenotic aortic valve as intended).'
