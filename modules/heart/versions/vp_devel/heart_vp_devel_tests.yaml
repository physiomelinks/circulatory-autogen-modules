reference_proposals:
  u_root:
    reference: 'definitional; port input: the aortic root pressure (from the aortic_root vessel) is supplied by the connected
      vessel, so this value is only used if the port is left unconnected'
    sourced: definitional
    value: 0.0
  u_par:
    reference: 'definitional; port input: the pulmonary artery pressure (from par) is supplied by the connected vessel, so
      this value is only used if the port is left unconnected'
    sourced: definitional
    value: 0.0
  v_ivc:
    reference: 'definitional; port input: the IVC inflow is supplied by the connected vessel, so this value is only used if
      the port is left unconnected'
    sourced: definitional
    value: 0.0
  v_svc:
    reference: 'definitional; port input: the SVC inflow is supplied by the connected vessel, so this value is only used if
      the port is left unconnected'
    sourced: definitional
    value: 0.0
  v_pvn:
    reference: 'definitional; port input: the pulmonary venous inflow is supplied by the connected vessel, so this value is
      only used if the port is left unconnected'
    sourced: definitional
    value: 0.0
  rho:
    reference: trudnowski1974specific; whole-blood specific gravity 1.0506 at 37 C (abstract) -> 1050 kg/m3
    sourced: 'yes'
  T:
    reference: 'unreferenced_placeholder; resting heart period chosen by the user (60 bpm); Liang 2009 uses a 1.0 s cycle
      (secondary confirmation: Liu et al. arXiv:2512.15482 Table A1 and Rabineau et al. 2021 Front Physiol Table 1 reproduce
      Liang 2009 Table 2; primary table not accessed (paywalled))'
    sourced: 'no'
    also_cites:
    - rabineau2021closed
  q_ra_us:
    reference: 'korakianitis2006numerical; Table 1 unstressed volume RA 4 ml (secondary confirmation: Laubscher arXiv:2204.03701
      Table 1; primary not accessed)'
    sourced: 'yes'
  q_rv_us:
    reference: 'korakianitis2006numerical; Table 1 unstressed volume RV 10 ml (secondary confirmation: Laubscher arXiv:2204.03701
      Table 1; primary not accessed)'
    sourced: 'yes'
  q_la_us:
    reference: 'korakianitis2006numerical; Table 1 unstressed volume LA 4 ml (secondary confirmation: Laubscher arXiv:2204.03701
      Table 1; primary not accessed)'
    sourced: 'yes'
  q_lv_us:
    reference: 'korakianitis2006numerical; Table 1 unstressed volume LV 5 ml (secondary confirmation: Laubscher arXiv:2204.03701
      Table 1; primary not accessed)'
    sourced: 'yes'
  q_ra_init:
    reference: unreferenced_placeholder; initial RA volume set equal to its unstressed volume (4 ml); no initial volumes found
      in Korakianitis 2006. Initial volumes set the total blood volume of a closed loop
    sourced: 'no'
  q_rv_init:
    reference: unreferenced_placeholder; 100 ml initial RV volume (the CA csv cites Korakianitis 2006 Table 1, but 100 ml
      is not a V0 there - V0 is 10 ml); initial condition only, but it sets the closed-loop blood volume
    sourced: 'no'
  q_la_init:
    reference: unreferenced_placeholder; initial LA volume set equal to its unstressed volume (4 ml); no initial volumes found
      in Korakianitis 2006
    sourced: 'no'
  q_lv_init:
    reference: unreferenced_placeholder; 100 ml initial LV volume, user defined; sets part of the closed-loop blood volume
    sourced: 'no'
  T_ac:
    reference: 'liang2009multi; Table 2 atrial contraction duration 0.17 s (secondary confirmation: Liu et al. arXiv:2512.15482
      Table A1 and Rabineau et al. 2021 Front Physiol Table 1 reproduce Liang 2009 Table 2; primary table not accessed (paywalled))'
    sourced: 'yes'
    also_cites:
    - rabineau2021closed
  T_ar:
    reference: 'liang2009multi; Table 2 atrial relaxation duration 0.17 s (secondary confirmation: Liu et al. arXiv:2512.15482
      Table A1 and Rabineau et al. 2021 Front Physiol Table 1 reproduce Liang 2009 Table 2; primary table not accessed (paywalled))'
    sourced: 'yes'
    also_cites:
    - rabineau2021closed
  t_astart:
    reference: 'liang2009multi; Table 2 atrial contraction onset 0.8 s in a 1.0 s cycle (secondary confirmation: Liu et al.
      arXiv:2512.15482 Table A1 and Rabineau et al. 2021 Front Physiol Table 1 reproduce Liang 2009 Table 2; primary table
      not accessed (paywalled))'
    sourced: 'yes'
    also_cites:
    - rabineau2021closed
  T_vc:
    reference: 'liang2009multi; Table 2 gives ventricular contraction duration 0.30 s, NOT 0.34 s (secondary confirmation:
      Liu et al. arXiv:2512.15482 Table A1 and Rabineau et al. 2021 Front Physiol Table 1 reproduce Liang 2009 Table 2; primary
      table not accessed (paywalled)); 0.34 s is unsourced - propose 0.30 or mark as a user choice'
    sourced: 'no'
    also_cites:
    - rabineau2021closed
  T_vr:
    reference: 'liang2009multi; Table 2 ventricular relaxation duration 0.15 s (secondary confirmation: Liu et al. arXiv:2512.15482
      Table A1 and Rabineau et al. 2021 Front Physiol Table 1 reproduce Liang 2009 Table 2; primary table not accessed (paywalled))'
    sourced: 'yes'
    also_cites:
    - rabineau2021closed
  t_vstart:
    reference: 'liang2009multi; Table 2 ventricular contraction onset 0 s (secondary confirmation: Liu et al. arXiv:2512.15482
      Table A1 and Rabineau et al. 2021 Front Physiol Table 1 reproduce Liang 2009 Table 2; primary table not accessed (paywalled))'
    sourced: 'yes'
    also_cites:
    - rabineau2021closed
  E_ra_A:
    reference: 'liang2009multi; Table 2 RA active elastance 0.06 mmHg/ml: 0.06 mmHg/ml x 133.322 Pa/mmHg / 1e-6 m3/ml = 8e+06
      Pa/m3 (secondary confirmation: Liu et al. arXiv:2512.15482 Table A1 and Rabineau et al. 2021 Front Physiol Table 1 reproduce
      Liang 2009 Table 2; primary table not accessed (paywalled))'
    sourced: 'yes'
    also_cites:
    - rabineau2021closed
  E_ra_B:
    reference: 'liang2009multi; Table 2 RA passive elastance 0.07 mmHg/ml: 0.07 mmHg/ml x 133.322 Pa/mmHg / 1e-6 m3/ml = 9.33e+06
      Pa/m3 (secondary confirmation: Liu et al. arXiv:2512.15482 Table A1 and Rabineau et al. 2021 Front Physiol Table 1 reproduce
      Liang 2009 Table 2; primary table not accessed (paywalled))'
    sourced: 'yes'
    also_cites:
    - rabineau2021closed
  E_rv_A:
    reference: unreferenced_placeholder; 60e6 Pa/m3 (0.45 mmHg/ml) is user defined; liang2009multi Table 2 gives 0.55 mmHg/ml
      = 7.33e7 Pa/m3 (secondary sources)
    sourced: 'no'
    also_cites:
    - rabineau2021closed
  E_rv_B:
    reference: unreferenced_placeholder; 0.2e6 Pa/m3 (0.0015 mmHg/ml) is user defined and ~30x below liang2009multi Table 2
      (0.05 mmHg/ml = 6.67e6 Pa/m3, secondary sources) - very compliant RV
    sourced: 'no'
    also_cites:
    - rabineau2021closed
  E_la_A:
    reference: 'liang2009multi; Table 2 LA active elastance 0.07 mmHg/ml: 0.07 mmHg/ml x 133.322 Pa/mmHg / 1e-6 m3/ml = 9.33e+06
      Pa/m3 (secondary confirmation: Liu et al. arXiv:2512.15482 Table A1 and Rabineau et al. 2021 Front Physiol Table 1 reproduce
      Liang 2009 Table 2; primary table not accessed (paywalled))'
    sourced: 'yes'
    also_cites:
    - rabineau2021closed
  E_la_B:
    reference: 'liang2009multi; Table 2 LA passive elastance 0.09 mmHg/ml: 0.09 mmHg/ml x 133.322 Pa/mmHg / 1e-6 m3/ml = 1.2e+07
      Pa/m3 (secondary confirmation: Liu et al. arXiv:2512.15482 Table A1 and Rabineau et al. 2021 Front Physiol Table 1 reproduce
      Liang 2009 Table 2; primary table not accessed (paywalled))'
    sourced: 'yes'
    also_cites:
    - rabineau2021closed
  E_lv_A:
    reference: unreferenced_placeholder; 200e6 Pa/m3 (1.5 mmHg/ml) is user defined; liang2009multi Table 2 gives 2.75 mmHg/ml
      = 3.67e8 Pa/m3 (secondary sources)
    sourced: 'no'
    also_cites:
    - rabineau2021closed
  E_lv_B:
    reference: unreferenced_placeholder; 20e6 Pa/m3 (0.15 mmHg/ml) is user defined; liang2009multi Table 2 gives 0.08 mmHg/ml
      = 1.07e7 Pa/m3 (one secondary source gives 0.10)
    sourced: 'no'
  K_vo_trv:
    reference: 'mynard2015one; tricuspid opening rate 40 mmHg^-1 s^-1 = 0.30 Pa^-1 s^-1 (secondary confirmation: Rabineau
      et al. 2021 Front Physiol 12:734311 Table 1, values "adapted from Mynard and Smolich (2015)"; primary table not accessed
      (paywalled)); valve law from mynard2012simple'
    sourced: 'yes'
    also_cites:
    - rabineau2021closed
  K_vo_puv:
    reference: 'mynard2015one; pulmonary opening rate 26.7 mmHg^-1 s^-1 = 0.20 Pa^-1 s^-1 (secondary confirmation: Rabineau
      et al. 2021 Front Physiol 12:734311 Table 1, values "adapted from Mynard and Smolich (2015)"; primary table not accessed
      (paywalled))'
    sourced: 'yes'
    also_cites:
    - rabineau2021closed
  K_vo_miv:
    reference: 'mynard2015one; secondary sources give mitral K_vo = 26.7 mmHg^-1 s^-1 = 0.20 Pa^-1 s^-1 (Rabineau 2021 Table
      1; Kondiboyina 2022 Table B2: 0.02 cgs), NOT 0.3 - value unconfirmed'
    sourced: 'no'
    also_cites:
    - rabineau2021closed
  K_vo_aov:
    reference: mynard2015one; secondary sources give aortic K_vo = 0.20 Pa^-1 s^-1 (Rabineau 2021 Table 1; Kondiboyina 2022
      Table B2), NOT 0.12 - value unconfirmed
    sourced: 'no'
    also_cites:
    - rabineau2021closed
  K_vc_trv:
    reference: 'mynard2015one; tricuspid closing rate 53.3 mmHg^-1 s^-1 = 0.40 Pa^-1 s^-1 (secondary confirmation: Rabineau
      et al. 2021 Front Physiol 12:734311 Table 1, values "adapted from Mynard and Smolich (2015)"; primary table not accessed
      (paywalled))'
    sourced: 'yes'
    also_cites:
    - rabineau2021closed
  K_vc_puv:
    reference: 'mynard2015one; pulmonary closing rate 26.7 mmHg^-1 s^-1 = 0.20 Pa^-1 s^-1 (secondary confirmation: Rabineau
      et al. 2021 Front Physiol 12:734311 Table 1, values "adapted from Mynard and Smolich (2015)"; primary table not accessed
      (paywalled))'
    sourced: 'yes'
    also_cites:
    - rabineau2021closed
  K_vc_miv:
    reference: 'mynard2015one; mitral closing rate 53.3 mmHg^-1 s^-1 = 0.40 Pa^-1 s^-1 (secondary confirmation: Rabineau
      et al. 2021 Front Physiol 12:734311 Table 1, values "adapted from Mynard and Smolich (2015)"; primary table not accessed
      (paywalled))'
    sourced: 'yes'
    also_cites:
    - rabineau2021closed
  K_vc_aov:
    reference: mynard2015one; secondary sources give aortic K_vc = 0.20 Pa^-1 s^-1 (Rabineau 2021 Table 1; Kondiboyina 2022
      Table B2), NOT 0.12 - value unconfirmed
    sourced: 'no'
    also_cites:
    - rabineau2021closed
  M_rg_trv:
    reference: 'definitional; healthy valve: no regurgitant area (A_eff = M_rg A_nn when closed) in the mynard2012simple model'
    sourced: definitional
  M_rg_puv:
    reference: 'definitional; healthy valve: no regurgitant area (A_eff = M_rg A_nn when closed) in the mynard2012simple model'
    sourced: definitional
  M_rg_miv:
    reference: 'definitional; healthy valve: no regurgitant area (A_eff = M_rg A_nn when closed) in the mynard2012simple model'
    sourced: definitional
  M_rg_aov:
    reference: 'definitional; healthy valve: no regurgitant area (A_eff = M_rg A_nn when closed) in the mynard2012simple model'
    sourced: definitional
  M_st_trv:
    reference: 'definitional; healthy valve: no stenosis (fully open A_eff = M_st A_nn = A_nn) in the mynard2012simple model'
    sourced: definitional
  M_st_puv:
    reference: 'definitional; healthy valve: no stenosis (fully open A_eff = M_st A_nn = A_nn) in the mynard2012simple model'
    sourced: definitional
  M_st_miv:
    reference: 'definitional; healthy valve: no stenosis (fully open A_eff = M_st A_nn = A_nn) in the mynard2012simple model'
    sourced: definitional
  M_st_aov:
    reference: 'definitional; healthy valve: no stenosis (fully open A_eff = M_st A_nn = A_nn) in the mynard2012simple model'
    sourced: definitional
  l_eff:
    reference: unreferenced_placeholder; 2 cm effective valve length, to be identified; Mynard 2015 (via Rabineau 2021 Table
      1) uses 2.0 cm for the AV valves, 1.5 cm pulmonary and 1.0 cm aortic, so one shared l_eff matches only the AV valves
    sourced: 'no'
    also_cites:
    - rabineau2021closed
  A_nn_trv:
    reference: unreferenced_placeholder; 8.0 cm2 not found in any accessible source (Mynard 2015 via Rabineau 2021 gives A_eff,max
      6.0 cm2 tricuspid); CA cites Mynard_2012
    sourced: 'no'
    also_cites:
    - rabineau2021closed
  A_nn_puv:
    reference: unreferenced_placeholder; 7.1 cm2 not found (secondary sources give ~5.7 cm2, adjusted by Rabineau); CA cites
      Mynard_2012
    sourced: 'no'
    also_cites:
    - rabineau2021closed
  A_nn_miv:
    reference: 'unreferenced_placeholder; 7.7 cm2 not found (Mynard 2015 via Rabineau 2021: 5.1 cm2; Kondiboyina 2022: 5.1
      cm2); CA cites Mynard_2012'
    sourced: 'no'
    also_cites:
    - rabineau2021closed
  A_nn_aov:
    reference: 'unreferenced_placeholder; 6.8 cm2 not found (secondary sources: 4.9-5.0 cm2); CA cites Mynard_2012'
    sourced: 'no'
    also_cites:
    - rabineau2021closed
  r_ao:
    reference: unreferenced_placeholder; subject-specific BioBeat measurement (aortic radius 14.3 mm) - not a literature source;
      owner to confirm provenance/citation
    sourced: 'no'
  r_lvot:
    reference: unreferenced_placeholder; subject-specific BioBeat measurement (LVOT radius 10.0 mm) - owner to confirm provenance
    sourced: 'no'
  gamma:
    reference: unreferenced_placeholder; population mean of the owner's own parameter identification (07/09/22), not a published
      value
    sourced: 'no'
  beta:
    reference: definitional; beta = 2 is the value for which B_aov = gamma rho (pi r_ao^2)^beta / (r_lvot^4 A_eff^beta) has
      units kg m^-7 (Js2_per_m9); any other value makes the equation dimensionally inconsistent
    sourced: definitional
  A_aov:
    reference: unreferenced_placeholder; subject-specific BioBeat measurement (aortic valve area 1.72 cm2, moderate-stenosis
      range) - owner to confirm provenance
    sourced: 'no'
review: reviews/heart_review.yaml
review_scope: The review of the whole heart module (8 entries) before the move to versions; only the parts about this version
