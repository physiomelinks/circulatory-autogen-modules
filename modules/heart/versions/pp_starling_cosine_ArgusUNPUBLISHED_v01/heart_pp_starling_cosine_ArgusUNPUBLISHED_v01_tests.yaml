notes: 'Valveless preload-driven pulsatile pump from the inlet (venous) to the outlet (arterial) vessel: v = s_heart K f max(u_in - P_v0, 0)(1 - c). Its mean over a beat is s_heart K f (u_in - P_v0), a linear Frank-Starling relation (stroke volume K (u_in - P_v0)), while u_in >= P_v0, where the pump is exactly polynomial; below P_v0 (the stressed venous volume used up, e.g. by a long bleed) it gives no flow instead of pumping backwards, which drove the model to negative volumes and contents and stopped the solver. The outlet pressure u_out is taken from the outlet port and does not change the flow. f (heart frequency, Hz) comes through heart_frequency_port, e.g. from ans_linear, and s_heart (strength, 1 at rest) through heart_strength_port. With the lifted variables a = f c and b = f s the flow is v = s_heart K (u_in - P_v0)(f - a), quadratic in (u_in, f, a), and da/dt, db/dt are quadratic when df/dt is linear in the states. The phase oscillator is written as c = cos(theta), s = sin(theta), dc/dt = -2 pi f s, ds/dt = 2 pi f c, so the beat shape (1 - c) is polynomial in the states (built for a known-structure test model for Operator Inference, ICUHealthy models/simple). c^2 + s^2 = 1 is conserved by the equations; the solver lets it drift slowly (about 2e-5 per 10 minutes at 70 bpm with rtol 1e-8, atol 1e-10, max step 0.25 ms, faster at higher f).'
