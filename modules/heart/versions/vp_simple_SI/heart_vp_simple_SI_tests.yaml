module_type: heart
version: vp_simple_SI
reviewed: false
notes: 'Four-chamber time-varying-elastance heart in litre/kPa. Ventricles: u = E(t)(q - q_us) with E(mt) = (Emax - Emin)(mt/To_pk)
  exp((1 - (mt/To_pk)^2)/2) + Emin for mt < 0.4, held at its mt = 0.4 value until mt = 0.6, then Emin (discontinuous drop
  at mt = 0.6). Atria: constant elastance (passive). Valves: ideal diodes with resistance. Alone, venous inflows (v_pvn, v_ivc,
  v_svc) are constant and the aortic/pulmonary root pressures (u_root, u_par) are held constant; the heart settles to a periodic
  state in which the mean ejection equals the inflow. SI duplicate (m3, Pa); its global constants are shared with heart_simple
  and declared in litre/kPa, so CellML converts them on connection (E x 1e6, q x 1e-3, R x 1e6).'
expected_failures:
  run_test: 'module defect: heart_simplesimple_type2 (SI) shares its global constants (T, E_LVmax, q_LV_us, R_AV, ...) with
    heart_simplesimple_type, and cvs_mvp_parameters.csv declares them once in litre/kPa units; libcuflynx refuses to generate
    ("units of litre in parameters.csv file does not match with units of m3 in module_config.json for param q_LV_init"). See
    review.proposed_fixes.'
  verification_test_invariants: 'module defect: heart_simplesimple_type2 (SI) shares its global constants (T, E_LVmax, q_LV_us,
    R_AV, ...) with heart_simplesimple_type, and cvs_mvp_parameters.csv declares them once in litre/kPa units; libcuflynx
    refuses to generate ("units of litre in parameters.csv file does not match with units of m3 in module_config.json for
    param q_LV_init"). See review.proposed_fixes.'
  verification_test_BC: 'module defect: heart_simplesimple_type2 (SI) shares its global constants (T, E_LVmax, q_LV_us, R_AV,
    ...) with heart_simplesimple_type, and cvs_mvp_parameters.csv declares them once in litre/kPa units; libcuflynx refuses
    to generate ("units of litre in parameters.csv file does not match with units of m3 in module_config.json for param q_LV_init").
    See review.proposed_fixes.'
  verification_test_timestep: 'module defect: heart_simplesimple_type2 (SI) shares its global constants (T, E_LVmax, q_LV_us,
    R_AV, ...) with heart_simplesimple_type, and cvs_mvp_parameters.csv declares them once in litre/kPa units; libcuflynx
    refuses to generate ("units of litre in parameters.csv file does not match with units of m3 in module_config.json for
    param q_LV_init"). See review.proposed_fixes.'
  stability_test: 'module defect: heart_simplesimple_type2 (SI) shares its global constants (T, E_LVmax, q_LV_us, R_AV, ...)
    with heart_simplesimple_type, and cvs_mvp_parameters.csv declares them once in litre/kPa units; libcuflynx refuses to
    generate ("units of litre in parameters.csv file does not match with units of m3 in module_config.json for param q_LV_init").
    See review.proposed_fixes.'
reference_proposals:
  T:
    reference: 'Bozkurt2019; Table 1 (adult): cardiac cycle T = 0.8 s'
    sourced: 'yes'
    value: 0.8
  delay:
    reference: definitional; atrial activation delay (fraction of T). Only used for the output mta, which no equation uses
      (atria have constant elastance)
    sourced: definitional
    value: 0.0
  To_pk:
    reference: 'Bozkurt2019; Table 1 (adult): end of ventricular systole T1 = 0.33 T, used as the time-to-peak fraction. NOTE:
      Bozkurt uses a raised-cosine activation, not the x exp((1-x^2)/2) form of this module; value transferred, shape not'
    sourced: 'no'
    value: 0.33
  E_LVmax:
    reference: 'Bozkurt2019; Table 1 (adult): LV end-systolic elastance Ees = 2.5 mmHg/mL = 333.3 kPa/L'
    sourced: 'yes'
    value: 333.3
  E_LVmin:
    reference: unreferenced_placeholder; no linear LV diastolic elastance found in a verified source (Bozkurt2019 and Smith2004
      use a nonlinear EDPVR). 10 kPa/L = 0.075 mmHg/mL, order of magnitude of the EDPVR slope at normal filling
    sourced: 'no'
    value: 10.0
  E_RVmax:
    reference: 'Bozkurt2019; Table 1 (adult): RV end-systolic elastance Ees = 1 mmHg/mL = 133.3 kPa/L'
    sourced: 'yes'
    value: 133.3
  E_RVmin:
    reference: unreferenced_placeholder; no linear RV diastolic elastance in a verified source; 6.7 kPa/L = 0.05 mmHg/mL,
      order of magnitude
    sourced: 'no'
    value: 6.7
  E_LA:
    reference: 'Bozkurt2019; Table 1 (adult): LA minimum elastance 0.2 mmHg/mL = 26.7 kPa/L (this module has a constant, passive
      atrium; Bozkurt atria are active, Emax 0.3 mmHg/mL)'
    sourced: 'yes'
    value: 26.7
  E_RA:
    reference: 'Bozkurt2019; Table 1 (adult): RA minimum elastance 0.2 mmHg/mL = 26.7 kPa/L (passive atrium, see E_LA)'
