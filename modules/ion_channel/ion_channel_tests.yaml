- vessel_type: i_CaL_Paci_2013
  BC_type: nn
  module_type: i_CaL_Paci_2013
  sim_time: 0.01
  dt: 0.001
  outputs:
  - i_CaL
  invariants:
  - description: 'i_CaL equals the Paci 2013 expression transcribed from the authors'' CellML: L-type Ca current (GHK form,
      0'
    expr: np.max(np.abs(i_CaL - (g_CaL*4*Vm*F**2/(R*T)*(Cai*np.exp(2*Vm*F/(R*T)) - 0.341*Cao)/(np.exp(2*Vm*F/(R*T)) - 1)*d*f1*f2*fCa)))
      <= 1e-9*max(1.0, np.max(np.abs(g_CaL*4*Vm*F**2/(R*T)*(Cai*np.exp(2*Vm*F/(R*T)) - 0.341*Cao)/(np.exp(2*Vm*F/(R*T)) -
      1)*d*f1*f2*fCa)))
  run_parameters:
    Vm: 0.01
    d: 0.8
    f1: 0.9
    f2: 0.9
    fCa: 0.9
    Cai: 0.0001
