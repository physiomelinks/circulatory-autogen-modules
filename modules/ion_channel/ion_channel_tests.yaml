- vessel_type: i_Ca_Tao_2011
  BC_type: nn
  module_type: i_Ca_Tao_2011
  sim_time: 5.0
  dt: 0.005
  timestep:
    scheme: rk4
    dts:
    - 0.02
    - 0.01
    - 0.005
    - 0.0025
    t_end: 5.0
    min_order: 0.8
    tol: 0.0001
    cvode_tol: 0.001
  outputs:
  - i_Ca
  - c
  - tau_c
  - hc
  - tau_hc
  invariants:
  - description: 'c follows the Tao 2011 steady state (Suppl. Eq. 91) from c(0) = 0: c = c_bar(Vm) (1 - exp(-t/tau_c)), using
      the module''s own tau_c'
    expr: np.max(np.abs(c - (1/(1+np.exp(-(Vm+8.1)/9.85)))*(1 - np.exp(-t/tau_c)))) <= 1e-5
  - description: tau_c equals Tao 2011 Suppl. Eq. 92 (ms) converted to seconds
    expr: np.max(np.abs(tau_c - (1/(0.343*np.exp(0.0925*Vm)+1.88*np.exp(-0.00732*Vm))+0.1)/1000)) <= 1e-6*max(1e-3, np.max(np.abs((1/(0.343*np.exp(0.0925*Vm)+1.88*np.exp(-0.00732*Vm))+0.1)/1000)))
  - description: c stays in [0, 1]
    expr: np.all((c >= -1e-9) & (c <= 1 + 1e-9))
  - description: 'hc follows the Tao 2011 steady state (Suppl. Eq. 93) from hc(0) = 0: hc = hc_bar(Vm) (1 - exp(-t/tau_hc)),
      using the module''s own tau_hc'
    expr: np.max(np.abs(hc - (1/(1+np.exp((Vm+19.91)/4.5)))*(1 - np.exp(-t/tau_hc)))) <= 1e-5
  - description: tau_hc equals Tao 2011 Suppl. Eq. 94 (ms) converted to seconds
    expr: np.max(np.abs(tau_hc - (1/(0.242*np.exp(0.145*Vm)+0.0434*np.exp(-0.0201*Vm))+17)/1000)) <= 1e-6*max(1e-3, np.max(np.abs((1/(0.242*np.exp(0.145*Vm)+0.0434*np.exp(-0.0201*Vm))+17)/1000)))
  - description: hc stays in [0, 1]
    expr: np.all((hc >= -1e-9) & (hc <= 1 + 1e-9))
  - description: i_Ca = 4*F**2*Vm*P_Ca/(R*T)*(Cai*np.exp(2*Vm*F/(R*T)) - Cao)/(np.exp(2*Vm*F/(R*T)) - 1)*c**2*hc (Tao 2011
      Suppl.; the module's encoded form)
    expr: np.max(np.abs(i_Ca - (4*F**2*Vm*P_Ca/(R*T)*(Cai*np.exp(2*Vm*F/(R*T)) - Cao)/(np.exp(2*Vm*F/(R*T)) - 1)*c**2*hc)))
      <= 1e-9*max(1.0, np.max(np.abs(4*F**2*Vm*P_Ca/(R*T)*(Cai*np.exp(2*Vm*F/(R*T)) - Cao)/(np.exp(2*Vm*F/(R*T)) - 1)*c**2*hc)))
  run_parameters:
    Vm: -20.0
  bc_sweep:
    ranges:
      Vm:
        min: -90.0
        max: 30.0
        points: 5
      Cai:
        min: 5.0e-05
        max: 0.001
        points: 3
        scale: log
      R:
        min: 8.314472
        max: 8.314472
        points: 1
      F:
        min: 96485.3415
        max: 96485.3415
        points: 1
      T:
        min: 295
        max: 310
        points: 2
      Cao:
        min: 1.0
        max: 5.0
        points: 3
    rationale: clamp potential -90 to +30 mV (rest to action-potential peak of a sympathetic neuron); reversal potential +/-20
      mV about the Tao value; conductances by 0.5-2; Cai 0.05-1 uM, Cao 1-5 mM (Belluzzi & Sacchi used 5 mM), T room to body
      temperature, R and F constant.
  notes: 'Tao 2011 rat sympathetic neuron N-type Ca current I_Ca (GHK) (kinetics from Belluzzi & Sacchi). Gates are internal
    states starting at 0 (hard-coded initial values), so alone, with Vm clamped, each has the exact solution x_bar(Vm)(1 -
    exp(-t/tau_x)). Invariants compare with the Tao 2011 Supporting Material equations (read from the rendered PDF): they
    fail on the time units and on steady state has the wrong sign: module 1/(1+exp(-(V+19.91)/4.5)), Tao Eq. 93 1/(1+exp((V+19.91)/4.5))
    (recorded as expected failures).'
  reference_proposals:
    P_Ca:
      reference: 'Tao2011; Supporting Material (Document S1) p. 8 neuron parameter table: PCa = 1.1e-16 cm/ms = 1.1e-15 m/s
        (WKY; 1.54e-16 cm/ms for SHR). NOTE the module''s GHK expression is not dimensionally consistent (see review)'
      sourced: 'yes'
      value: 1.1e-15
    Vm:
      reference: definitional; clamp potential supplied by the membrane module in a network; -60 mV alone (test operating
        point near rest)
      sourced: definitional
      value: -60.0
    Cai:
      reference: unreferenced_placeholder; resting cytosolic Ca 1e-4 mM (0.1 uM); Tao 2011 gives no neuron value
      sourced: 'no'
      value: 0.0001
    R: *id003
    T: *id002
    F: *id004
    Cao: *id005
  expected_failures:
    run_test: 'generation fails: the gate and time-constant variables c, tau_c, hc, tau_hc are exposed in the config but have
      no interface in the CellML (libcellml: ''interface type required is public''); fix: public_interface=''out''. undefined
      units C_per_M / J_per_MK (the globals F and R): generation fails. Proposed fix: define C_per_M = coulomb/mole and J_per_MK
      = joule/(mole kelvin) in ion_channel_units.cellml (or rename to the existing C_per_mol / J_per_mol_K used by the cell
      module). With the fix this test passes on a patched copy.'
    verification_test_invariants: 'generation fails: the gate and time-constant variables c, tau_c, hc, tau_hc are exposed
      in the config but have no interface in the CellML (libcellml: ''interface type required is public''); fix: public_interface=''out''.
      undefined units C_per_M / J_per_MK (the globals F and R): generation fails. Proposed fix: define C_per_M = coulomb/mole
      and J_per_MK = joule/(mole kelvin) in ion_channel_units.cellml (or rename to the existing C_per_mol / J_per_mol_K used
      by the cell module). After that fix (patched copy): the module deviates from Tao 2011 Suppl.: every time constant is
      declared in seconds but the Tao 2011 / Belluzzi & Sacchi expressions give milliseconds (Supplement p. 8 table is in
