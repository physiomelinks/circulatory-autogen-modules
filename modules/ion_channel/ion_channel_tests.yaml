module: ion_channel
reviewed: false
known_issues:
- 'undefined units: C_per_M'
- 'undefined units: J_per_MK'
- port variable Cai not in variables_and_units
defaults:
  sim_time: 2.0
  pre_time: 0.0
  dt: 0.01
  solver: CVODE_myokit
  bc_sweep:
    factors:
    - 0.5
    - 0.75
    - 1.0
    - 1.5
    - 2.0
    ranges: {}
  timestep:
    scheme: rk4
    dts:
    - 0.004
    - 0.002
    - 0.001
    - 0.0005
    min_order: 0.8
    tol: 0.0001
    cvode_tol: 0.001
  stability:
    supported:
    - solver: CVODE_myokit
      rtol: 1.0e-06
      atol: 1.0e-08
  solver_info:
    rtol: 1.0e-08
    atol: 1.0e-10
components:
- vessel_type: i_Na_Paci_2013
  BC_type: nn
  module_type: i_Na_Paci_2013
  sim_time: 0.01
  dt: 0.001
  outputs:
  - i_Na
  - TTX_coeff
  invariants:
  - description: 'i_Na equals the Paci 2013 expression transcribed from the authors'' CellML: fast Na current I_Na = TTX_coeff
      g_Na m^3 h j (Vm - E_Na)'
    expr: np.max(np.abs(i_Na - (np.where(TTX_3uM==1, 0.18, np.where(TTX_10uM==1, 0.06, np.where(TTX_30uM==1, 0.02, 1)))*g_Na*m**3*h*j*(Vm
      - E_Na)))) <= 1e-9*max(1.0, np.max(np.abs(np.where(TTX_3uM==1, 0.18, np.where(TTX_10uM==1, 0.06, np.where(TTX_30uM==1,
      0.02, 1)))*g_Na*m**3*h*j*(Vm - E_Na))))
  - description: i_Na is outward (>= 0) above E_Na and inward below
    expr: np.all(i_Na*(Vm - E_Na) >= 0)
  run_parameters:
    Vm: -0.02
    m: 0.9
    h: 0.5
    j: 0.5
  bc_sweep:
    ranges:
      Vm:
        min: -0.1
        max: 0.05
        points: 6
      E_Na:
        min: 0.04015674307053439
        max: 0.10015674307053439
        points: 3
      m:
        min: 0.0
        max: 1.0
        points: 5
      h:
        min: 0.0
        max: 1.0
        points: 5
      j:
        min: 0.0
        max: 1.0
        points: 5
      TTX_3uM:
        min: 0
        max: 1
        points: 2
      TTX_10uM:
        min: 0
        max: 1
        points: 2
      TTX_30uM:
        min: 0
        max: 1
        points: 2
      T:
        min: 295
        max: 310
        points: 2
    rationale: 'Clamp inputs span the physiological operating range of a hiPSC-CM: Vm -100 to +50 mV, reversal potentials
      +/-30 mV about their resting values, gates over [0, 1], Cai 1e-5 to 1e-3 mM, Nai 5-20 mM, extracellular concentrations
      +/-50 %, T room to body temperature; drug switches 0/1; conductances by the default factors 0.5-2. R and F are physical
      constants (not swept).'
  notes: 'Paci 2013 hiPSC-CM (ventricular-like) fast Na current I_Na = TTX_coeff g_Na m^3 h j (Vm - E_Na). Algebraic: all
    gates, concentrations and the membrane potential are inputs, so alone it is a pure function of its inputs, checked exactly
    against the original model equations.'
  reference_proposals:
    g_Na:
      reference: 'Paci2013; value in the authors'' CellML (PMR workspace sseveri/paci_hyttinen_aaltosetala_severi_2013, ventricularVersion):
        g_Na = 3671.23'
      sourced: 'yes'
      value: 3671.2302
    Vm:
      reference: 'Paci2013; resting (initial) membrane potential in the authors'' CellML (PMR workspace sseveri/paci_hyttinen_aaltosetala_severi_2013,
        ventricularVersion): -0.0743340 V (operating point; a voltage-clamp input here)'
      sourced: 'yes'
      value: -0.0743340057623841
    E_Na:
      reference: 'definitional; Nernst potential of the Paci2013 electric_potentials at the CellML initial state (R=8.314472,
        T=310, F=96485.3415, Nao=151, Ko=5.4, Ki=150, Cao=1.8 mM, Nai=10.9248, Cai=1.80774e-5 mM): E_Na = 0.0701567 V'
      sourced: definitional
      value: 0.07015674307053439
    m:
      reference: 'Paci2013; initial (quasi-steady) value in the authors'' CellML (PMR workspace sseveri/paci_hyttinen_aaltosetala_severi_2013,
        ventricularVersion): m = 0.102953'
      sourced: 'yes'
      value: 0.102953468725004
    h:
      reference: 'Paci2013; initial (quasi-steady) value in the authors'' CellML (PMR workspace sseveri/paci_hyttinen_aaltosetala_severi_2013,
        ventricularVersion): h = 0.786927'
      sourced: 'yes'
      value: 0.786926637881461
    j:
      reference: 'Paci2013; initial (quasi-steady) value in the authors'' CellML (PMR workspace sseveri/paci_hyttinen_aaltosetala_severi_2013,
        ventricularVersion): j = 0.253943'
      sourced: 'yes'
      value: 0.253943221774722
    T: &id002
      reference: Paci2013; temperature in the authors' CellML (310 K)
      sourced: 'yes'
      value: 310
    TTX_3uM:
      reference: definitional; drug-block switch (0 = no drug, 1 = drug applied), 0 as in the authors' CellML (PMR workspace
        sseveri/paci_hyttinen_aaltosetala_severi_2013, ventricularVersion)
      sourced: definitional
      value: 0
    TTX_10uM:
      reference: definitional; drug-block switch (0 = no drug, 1 = drug applied), 0 as in the authors' CellML (PMR workspace
        sseveri/paci_hyttinen_aaltosetala_severi_2013, ventricularVersion)
      sourced: definitional
      value: 0
    TTX_30uM:
      reference: definitional; drug-block switch (0 = no drug, 1 = drug applied), 0 as in the authors' CellML (PMR workspace
        sseveri/paci_hyttinen_aaltosetala_severi_2013, ventricularVersion)
      sourced: definitional
      value: 0
  validation:
    baseline:
      status: pending
      reason: 'candidate: the hiPSC-CM I-V / conductance data the current was fitted to (Ma et al. 2011, Am J Physiol Heart
        Circ Physiol 301:H2006, as used by Paci 2013) could be digitised and compared with the clamped steady-state current
        (gates at their steady state); needs the gate components composed with this one and owner approval of digitised data.'
    calibrate:
      status: pending
      reason: the maximal conductance could be identified from the same I-V data once a baseline is agreed.
  expected_failures:
    run_test: 'generation fails: the gate inputs m, h, j are declared private_interface=''in'' (a leftover of the original
      Paci encapsulation hierarchy) so they cannot be connected (libcellml: ''interface type required is public''). Fix: public_interface=''in''.
      Also TTX_coeff is exposed in the config but has no public interface in the CellML; fix: public_interface=''out''. With
      the proposed fix applied to a copy of the library, all tests of this component pass.'
    verification_test_invariants: 'generation fails: the gate inputs m, h, j are declared private_interface=''in'' (a leftover
      of the original Paci encapsulation hierarchy) so they cannot be connected (libcellml: ''interface type required is public'').
      Fix: public_interface=''in''. Also TTX_coeff is exposed in the config but has no public interface in the CellML; fix:
      public_interface=''out''. With the proposed fix applied to a copy of the library, all tests of this component pass.'
    verification_test_BC: 'generation fails: the gate inputs m, h, j are declared private_interface=''in'' (a leftover of
      the original Paci encapsulation hierarchy) so they cannot be connected (libcellml: ''interface type required is public'').
      Fix: public_interface=''in''. Also TTX_coeff is exposed in the config but has no public interface in the CellML; fix:
      public_interface=''out''. With the proposed fix applied to a copy of the library, all tests of this component pass.'
    verification_test_timestep: 'generation fails: the gate inputs m, h, j are declared private_interface=''in'' (a leftover
      of the original Paci encapsulation hierarchy) so they cannot be connected (libcellml: ''interface type required is public'').
      Fix: public_interface=''in''. Also TTX_coeff is exposed in the config but has no public interface in the CellML; fix:
      public_interface=''out''. With the proposed fix applied to a copy of the library, all tests of this component pass.'
    stability_test: 'generation fails: the gate inputs m, h, j are declared private_interface=''in'' (a leftover of the original
      Paci encapsulation hierarchy) so they cannot be connected (libcellml: ''interface type required is public''). Fix: public_interface=''in''.
      Also TTX_coeff is exposed in the config but has no public interface in the CellML; fix: public_interface=''out''. With
      the proposed fix applied to a copy of the library, all tests of this component pass.'
- vessel_type: i_Na_m_gate_Paci_2013
  BC_type: nn
  module_type: i_Na_m_gate_Paci_2013
  sim_time: 0.0004
  dt: 2.0e-06
  timestep:
    scheme: rk4
    dts:
    - 2.0000000000000003e-06
    - 1.0000000000000002e-06
    - 5.000000000000001e-07
    - 2.5000000000000004e-07
    t_end: 4.0e-05
    min_order: 0.8
    tol: 0.0001
    cvode_tol: 0.001
  outputs:
  - m
  invariants:
  - description: m matches the exact voltage-clamp solution m(t) = m_inf(Vm) + (m_init - m_inf) exp(-t/tau_m(Vm)), with m_inf
      and tau_m transcribed from the Paci 2013 CellML (not from this module)
    expr: np.max(np.abs(m - ((1/(1+np.exp((-(Vm*1000)-34.1)/5.9))**(1/3)) + (m_init - (1/(1+np.exp((-(Vm*1000)-34.1)/5.9))**(1/3)))*np.exp(-t/((1/(1+np.exp((-(Vm*1000)-60)/5)))*(0.1/(1+np.exp(((Vm*1000)+35)/5))+0.1/(1+np.exp(((Vm*1000)-50)/200)))/1000)))))
      <= 1e-5
  - description: m stays in [0, 1]
    expr: np.all((m >= -1e-9) & (m <= 1 + 1e-9))
  run_parameters:
    Vm: -0.02
  bc_sweep:
    ranges:
      Vm: &id001
        min: -0.1
        max: 0.05
        points: 7
      m_init:
        min: 0.0
        max: 1.0
        points: 5
    rationale: Vm spans the physiological range of a cardiomyocyte action potential/clamp protocol (-100 to +50 mV); the initial
      gate value spans its whole range [0, 1].
  notes: 'Paci 2013 hiPSC-CM I_Na activation m gate: dm/dt = (m_inf(Vm) - m)/tau_m(Vm). Alone the membrane voltage is a boundary
    condition, i.e. a voltage clamp, so the gate has the exact solution used as the invariant. The run point steps the clamp
    from rest (-74.3 mV) to -20 mV.'
  reference_proposals:
    m_init:
      reference: 'Paci2013; initial value in the authors'' CellML (PMR workspace sseveri/paci_hyttinen_aaltosetala_severi_2013,
        ventricularVersion): m_init = 0.102953'
      sourced: 'yes'
      value: 0.102953468725004
    Vm:
      reference: 'Paci2013; resting (initial) membrane potential in the authors'' CellML (PMR workspace sseveri/paci_hyttinen_aaltosetala_severi_2013,
        ventricularVersion): Vm = -0.0743340 V; here the clamped voltage (units declared dimensionless but used as volts)'
      sourced: 'yes'
      value: -0.0743340057623841
  validation:
    baseline:
      status: pending
      reason: 'candidate: the steady-state/time-constant curves of the m gate in Paci et al. 2013 (fitted to hiPSC-CM voltage-clamp
        data, Ma et al. 2011) could be digitised and compared with the clamp steady state; not set up (figure digitisation
        needs owner approval).'
    calibrate:
      status: not_applicable
      reason: gate kinetics have no free parameters in this module (all constants are hard-coded in the CellML), so there
        is nothing to identify.
  expected_failures:
    run_test: 'generation fails: Vm is declared ''dimensionless'' in ion_channel_modules_config.json (and the parameters file)
      but ''volt'' in the CellML, so the connection is rejected (Myokit: ''Connected variables must have compatible units'').
      Fix: declare Vm as volt in the config and parameters file. With the proposed fix applied to a copy of the library, all
      tests of this component pass.'
    verification_test_invariants: 'generation fails: Vm is declared ''dimensionless'' in ion_channel_modules_config.json (and
      the parameters file) but ''volt'' in the CellML, so the connection is rejected (Myokit: ''Connected variables must have
      compatible units''). Fix: declare Vm as volt in the config and parameters file. With the proposed fix applied to a copy
      of the library, all tests of this component pass.'
    verification_test_BC: 'generation fails: Vm is declared ''dimensionless'' in ion_channel_modules_config.json (and the
      parameters file) but ''volt'' in the CellML, so the connection is rejected (Myokit: ''Connected variables must have
      compatible units''). Fix: declare Vm as volt in the config and parameters file. With the proposed fix applied to a copy
      of the library, all tests of this component pass.'
    verification_test_timestep: 'generation fails: Vm is declared ''dimensionless'' in ion_channel_modules_config.json (and
      the parameters file) but ''volt'' in the CellML, so the connection is rejected (Myokit: ''Connected variables must have
      compatible units''). Fix: declare Vm as volt in the config and parameters file. With the proposed fix applied to a copy
      of the library, all tests of this component pass.'
    stability_test: 'generation fails: Vm is declared ''dimensionless'' in ion_channel_modules_config.json (and the parameters
      file) but ''volt'' in the CellML, so the connection is rejected (Myokit: ''Connected variables must have compatible
      units''). Fix: declare Vm as volt in the config and parameters file. With the proposed fix applied to a copy of the
      library, all tests of this component pass.'
