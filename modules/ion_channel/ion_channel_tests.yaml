module: ion_channel
reviewed: false
known_issues: ['undefined units: C_per_M', 'undefined units: J_per_MK', port variable Cai not in variables_and_units]
defaults:
  sim_time: 2.0
  pre_time: 0.0
  dt: 0.01
  solver: CVODE_myokit
  bc_sweep:
    factors: [0.5, 0.75, 1.0, 1.5, 2.0]
    ranges: {}
  timestep:
    scheme: rk4
    dts: [0.004, 0.002, 0.001, 0.0005]
    min_order: 0.8
    tol: 0.0001
    cvode_tol: 0.001
