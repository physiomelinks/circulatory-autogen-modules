- vessel_type: i_CaL_d_gate_Paci_2013
  BC_type: nn
  module_type: i_CaL_d_gate_Paci_2013
  sim_time: 0.01
  dt: 5.0e-05
  timestep:
    scheme: rk4
    dts:
    - 0.0001
    - 5.0e-05
    - 2.5e-05
    - 1.25e-05
    t_end: 0.002
    min_order: 0.8
    tol: 0.0001
    cvode_tol: 0.001
  outputs:
  - d
  invariants:
  - description: d matches the exact voltage-clamp solution d(t) = d_inf(Vm) + (d_init - d_inf) exp(-t/tau_d(Vm)), with d_inf
      and tau_d transcribed from the Paci 2013 CellML (not from this module)
    expr: np.max(np.abs(d - ((1/(1+np.exp(-((Vm*1000)+9.1)/7))) + (d_init - (1/(1+np.exp(-((Vm*1000)+9.1)/7))))*np.exp(-t/(((0.25+1.4/(1+np.exp((-(Vm*1000)-35)/13)))*(1.4/(1+np.exp(((Vm*1000)+5)/5)))+1/(1+np.exp((-(Vm*1000)+50)/20)))/1000)))))
      <= 1e-5
  - description: d stays in [0, 1]
    expr: np.all((d >= -1e-9) & (d <= 1 + 1e-9))
  run_parameters:
    Vm: -0.02
  bc_sweep:
    ranges:
      Vm: *id001
      d_init:
        min: 0.0
        max: 1.0
        points: 5
      Cai:
        min: 1.0e-05
        max: 0.001
        points: 3
        scale: log
    rationale: Vm spans the physiological range of a cardiomyocyte action potential/clamp protocol (-100 to +50 mV); the initial
      gate value spans its whole range [0, 1]; Cai spans diastolic to systolic values.
  notes: 'Paci 2013 hiPSC-CM I_CaL activation d gate: dd/dt = (d_inf(Vm) - d)/tau_d(Vm). Alone the membrane voltage is a boundary
    condition, i.e. a voltage clamp, so the gate has the exact solution used as the invariant. The run point steps the clamp
    from rest (-74.3 mV) to -20 mV.'
  reference_proposals:
    d_init:
      reference: 'Paci2013; initial value in the authors'' CellML (PMR workspace sseveri/paci_hyttinen_aaltosetala_severi_2013,
        ventricularVersion): d_init = 8.96088e-05'
      sourced: 'yes'
      value: 8.96088425225182e-05
    Vm:
      reference: 'Paci2013; resting (initial) membrane potential in the authors'' CellML (PMR workspace sseveri/paci_hyttinen_aaltosetala_severi_2013,
        ventricularVersion): Vm = -0.0743340 V; here the clamped voltage (units declared dimensionless but used as volts)'
      sourced: 'yes'
      value: -0.0743340057623841
    Cai:
      reference: definitional; Cai is declared as an input (port internal_Ca_d_gate_port) but does not appear in the d-gate
        equations; any value
      sourced: definitional
      value: 1.80773974140477e-05
  validation:
    baseline:
      status: pending
      reason: 'candidate: the steady-state/time-constant curves of the d gate in Paci et al. 2013 (fitted to hiPSC-CM voltage-clamp
        data, Ma et al. 2011) could be digitised and compared with the clamp steady state; not set up (figure digitisation
        needs owner approval).'
    calibrate:
      status: not_applicable
      reason: gate kinetics have no free parameters in this module (all constants are hard-coded in the CellML), so there
        is nothing to identify.
  expected_failures:
