- vessel_type: i_CaL_f1_gate_Paci_2013
  BC_type: nn
  module_type: i_CaL_f1_gate_Paci_2013
  sim_time: 0.5
  dt: 0.0025
  timestep:
    scheme: rk4
    dts:
    - 0.04
    - 0.02
    - 0.01
    - 0.005
    t_end: 0.8
    min_order: 0.8
    tol: 0.0001
    cvode_tol: 0.001
  outputs:
  - f1
  invariants:
  - description: f1 matches the exact voltage-clamp solution f1(t) = f1_inf(Vm) + (f1_init - f1_inf) exp(-t/tau_f1(Vm)), with
      f1_inf and tau_f1 transcribed from the Paci 2013 CellML (not from this module)
    expr: np.max(np.abs(f1 - ((1/(1+np.exp(((Vm*1000)+26)/3))) + (f1_init - (1/(1+np.exp(((Vm*1000)+26)/3))))*np.exp(-t/((20+1102.5*np.exp(-(((Vm*1000)+27)**2/15)**2)+200/(1+np.exp((13-(Vm*1000))/10))+180/(1+np.exp((30+(Vm*1000))/10)))*np.where(1/(1+np.exp(((Vm*1000)+26)/3))-f1_init>0,
      1+1433*(Cai-50e-6), 1)/1000))))) <= 1e-5
  - description: f1 stays in [0, 1]
    expr: np.all((f1 >= -1e-9) & (f1 <= 1 + 1e-9))
  run_parameters:
    Vm: -0.02
  bc_sweep:
    ranges:
      Vm: *id001
      f1_init:
        min: 0.0
        max: 1.0
        points: 5
      Cai:
        min: 1.0e-05
        max: 0.001
        points: 5
        scale: log
    rationale: Vm spans the physiological range of a cardiomyocyte action potential/clamp protocol (-100 to +50 mV); the initial
      gate value spans its whole range [0, 1]; Cai spans diastolic to systolic values.
  notes: 'Paci 2013 hiPSC-CM I_CaL fast voltage inactivation f1 (Ca-dependent slowing via constf1) gate: df1/dt = (f1_inf(Vm)
    - f1)/tau_f1(Vm). Alone the membrane voltage is a boundary condition, i.e. a voltage clamp, so the gate has the exact
    solution used as the invariant. The run point steps the clamp from rest (-74.3 mV) to -20 mV. tau_f1 is multiplied by
    constf1 = 1 + 1433 (Cai - 50e-6) while f1 is rising (f1_inf > f1); the sign of (f1_inf - f1) cannot change during a monotone
    relaxation, so the exact solution still applies.'
  reference_proposals:
