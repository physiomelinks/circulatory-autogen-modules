    expr: np.max(np.abs(i_KCa - (g_kcf*kcf*(Vm - E_K) + g_kcs*kcs*(Vm - E_K)))) <= 1e-9*max(1.0, np.max(np.abs(g_kcf*kcf*(Vm
      - E_K) + g_kcs*kcs*(Vm - E_K))))
  run_parameters:
    Vm: -20.0
  bc_sweep:
    ranges:
      Vm:
        min: -90.0
        max: 30.0
        points: 5
      E_K:
        min: -113.0
        max: -73.0
        points: 3
    rationale: clamp potential -90 to +30 mV (rest to action-potential peak of a sympathetic neuron); reversal potential +/-20
      mV about the Tao value; conductances by 0.5-2.
  notes: 'Tao 2011 rat sympathetic neuron Ca-dependent K current I_KCa (fast and slow components; voltage-gated only here,
    as in Tao 2011) (kinetics from Belluzzi & Sacchi). Gates are internal states starting at 0 (hard-coded initial values),
    so alone, with Vm clamped, each has the exact solution x_bar(Vm)(1 - exp(-t/tau_x)). Invariants compare with the Tao 2011
    Supporting Material equations (read from the rendered PDF): they fail on the time units and on steady state has the wrong
    sign: module 1/(1+exp((V+15.18)/4.0)), Tao Eq. 106 1/(1+exp(-(V+15.18)/4.0)) (recorded as expected failures).'
  reference_proposals:
    g_kcf:
      reference: 'Tao2011; Supporting Material (Document S1) p. 8 neuron parameter table: gKcf = 0.15 uS'
      sourced: 'yes'
      value: 0.15
    g_kcs:
      reference: 'Tao2011; Supporting Material (Document S1) p. 8 neuron parameter table: gKcs = 0.22 uS'
      sourced: 'yes'
      value: 0.22
    E_K:
      reference: 'Tao2011; Supporting Material (Document S1) p. 8 neuron parameter table: EK = -93 mV'
      sourced: 'yes'
      value: -93.0
    Vm:
      reference: definitional; clamp potential supplied by the membrane module in a network; -60 mV alone (test operating
        point near rest)
      sourced: definitional
      value: -60.0
  expected_failures:
    run_test: 'generation fails: the gate and time-constant variables kcf, tau_kcf, kcs, tau_kcs are exposed in the config
      but have no interface in the CellML (libcellml: ''interface type required is public''); fix: public_interface=''out''.
      With the fix this test passes on a patched copy.'
    verification_test_invariants: 'generation fails: the gate and time-constant variables kcf, tau_kcf, kcs, tau_kcs are exposed
      in the config but have no interface in the CellML (libcellml: ''interface type required is public''); fix: public_interface=''out''.
      After that fix (patched copy): the module deviates from Tao 2011 Suppl.: every time constant is declared in seconds
      but the Tao 2011 / Belluzzi & Sacchi expressions give milliseconds (Supplement p. 8 table is in ms; e.g. tau_hc = 17-30
      ms matches Belluzzi & Sacchi 1989 J Physiol 412:493 "tau = 29.3-17.6 ms"), so all gates are 1000x too slow; steady state
      has the wrong sign: module 1/(1+exp((V+15.18)/4.0)), Tao Eq. 106 1/(1+exp(-(V+15.18)/4.0))'
    verification_test_BC: 'generation fails: the gate and time-constant variables kcf, tau_kcf, kcs, tau_kcs are exposed in
      the config but have no interface in the CellML (libcellml: ''interface type required is public''); fix: public_interface=''out''.
      After that fix (patched copy): the module deviates from Tao 2011 Suppl.: every time constant is declared in seconds
      but the Tao 2011 / Belluzzi & Sacchi expressions give milliseconds (Supplement p. 8 table is in ms; e.g. tau_hc = 17-30
      ms matches Belluzzi & Sacchi 1989 J Physiol 412:493 "tau = 29.3-17.6 ms"), so all gates are 1000x too slow; steady state
      has the wrong sign: module 1/(1+exp((V+15.18)/4.0)), Tao Eq. 106 1/(1+exp(-(V+15.18)/4.0))'
    verification_test_timestep: 'generation fails: the gate and time-constant variables kcf, tau_kcf, kcs, tau_kcs are exposed
      in the config but have no interface in the CellML (libcellml: ''interface type required is public''); fix: public_interface=''out''.
      With the fix this test passes on a patched copy.'
    stability_test: 'generation fails: the gate and time-constant variables kcf, tau_kcf, kcs, tau_kcs are exposed in the
      config but have no interface in the CellML (libcellml: ''interface type required is public''); fix: public_interface=''out''.
      With the fix this test passes on a patched copy.'
  validation:
    baseline:
      status: pending
      reason: 'candidates: the voltage-clamp steady-state and time-constant data of Belluzzi & Sacchi (J Physiol 1985 358:91
        I_A; 1986 380:275 I_Na; 1988 397:127 I_KV; 1989 412:493 I_Ca; 1990 422:561 I_KCa), e.g. tau_hc 17.6-29.3 ms; set up
        after the unit/sign fixes.'
    calibrate:
      status: not_applicable
      reason: kinetic constants are hard-coded in the CellML; only the maximal conductance is a parameter.
- vessel_type: i_piezo_Na_Argus_unpublished
  BC_type: nn
  module_type: i_piezo_Na_Argus_unpublished
  sim_time: 0.1
  dt: 0.0002
  timestep:
    scheme: rk4
    dts:
    - 0.002
    - 0.001
    - 0.0005
    - 0.00025
    t_end: 0.1
    min_order: 0.8
    tol: 0.0001
    cvode_tol: 0.001
  outputs:
  - I_piezo
  - m_r
  - m_r_inf
  - m_V
  - m_V_inf
  invariants:
  - description: 'stretch gate: m_r = m_r_inf(r) + (m_r_init - m_r_inf) exp(-t/tau_r), m_r_inf = 1/(1 + exp(-(r - r_50)/k_r))'
    expr: np.max(np.abs(m_r - ((1/(1+np.exp(-(r - r_50)/k_r))) + (m_r_init - (1/(1+np.exp(-(r - r_50)/k_r))))*np.exp(-t/tau_r))))
      <= 1e-6
  - description: 'voltage gate: m_V = m_V_inf(Vm) + (m_V_init - m_V_inf) exp(-t/tau_V), m_V_inf = 1/(1 + exp(-(Vm - V_50)/k_V))'
    expr: np.max(np.abs(m_V - ((1/(1+np.exp(-(Vm - V_50)/k_V))) + (m_V_init - (1/(1+np.exp(-(Vm - V_50)/k_V))))*np.exp(-t/tau_V))))
      <= 1e-6
  - description: I_piezo = g m_r m_V (Vm - E_Na)
    expr: np.max(np.abs(I_piezo - g*m_r*m_V*(Vm - E_Na))) <= 1e-9*max(1.0, np.max(np.abs(I_piezo)))
  - description: gates stay in [0, 1]
    expr: np.all((m_r >= -1e-9) & (m_r <= 1 + 1e-9) & (m_V >= -1e-9) & (m_V <= 1 + 1e-9))
  run_parameters:
    r: 1.15
    Vm: -80.0
  bc_sweep:
    ranges:
      r:
        min: 1.0
        max: 1.3
        points: 4
      Vm:
        min: -100.0
        max: 40.0
        points: 5
      E_Na:
        min: 0.0
        max: 70.0
        points: 3
      m_r_init:
        min: 0.0
        max: 1.0
        points: 3
      m_V_init:
        min: 0.0
        max: 1.0
        points: 3
      V_50:
        min: -60.0
        max: 20.0
        points: 3
    rationale: stretch ratio 1.0-1.3 (unstretched to strongly stretched membrane), clamp potential -100 to +40 mV, reversal
      0 mV (non-selective cation, as measured for Piezo1) to +70 mV (pure Na); gate initial values over [0, 1]; V_50 -60 to
      +20 mV; other constants by factors 0.5-2.
  notes: 'Owner''s unpublished stretch-activated (Piezo-type) Na current: I = g m_r m_V (Vm - E_Na) with first-order stretch
    (m_r) and voltage (m_V) gates. Alone, with r and Vm clamped, both gates have exact solutions.'
  reference_proposals:
    g:
      reference: 'unreferenced_placeholder; order of magnitude only: 5 nS (0.005 uS) gives a few hundred pA at -80 mV, the
        size of whole-cell Piezo1 currents (e.g. Coste et al. 2010, not checked for this model)'
      sourced: 'no'
      value: 0.005
    Vm:
      reference: definitional; membrane potential supplied by a membrane module; -70 mV alone (test operating point)
      sourced: definitional
      value: -70.0
    E_Na:
      reference: definitional; reversal supplied by a Nernst module in a network; +60 mV alone (typical Na Nernst potential)
      sourced: definitional
      value: 60.0
    r:
      reference: definitional; stretch ratio from a mechanics module; 1.0 = unstretched
      sourced: definitional
      value: 1.0
    m_r_init:
      reference: definitional; channel closed at t = 0 (unstretched)
      sourced: definitional
      value: 0.0
    m_V_init:
      reference: unreferenced_placeholder; 0.5 (half-activated); no voltage-dependence data chosen
      sourced: 'no'
      value: 0.5
    tau_r:
      reference: 'unreferenced_placeholder; 5 ms: Piezo1 activates within milliseconds of a mechanical step (order of magnitude)'
      sourced: 'no'
      value: 0.005
    r_50:
      reference: unreferenced_placeholder; half-activation stretch ratio 1.1; no source chosen
      sourced: 'no'
      value: 1.1
    k_r:
      reference: unreferenced_placeholder; slope 0.02 of the stretch-ratio sigmoid; no source chosen
      sourced: 'no'
      value: 0.02
    tau_V:
      reference: unreferenced_placeholder; 10 ms; no source chosen
      sourced: 'no'
      value: 0.01
    V_50:
      reference: unreferenced_placeholder; 0 mV; no source chosen
      sourced: 'no'
      value: 0.0
    k_V:
      reference: unreferenced_placeholder; 20 mV slope; no source chosen
      sourced: 'no'
      value: 20.0
  validation:
    baseline:
      status: pending
      reason: 'candidate: Piezo1 pressure/stretch-response and I-V data (Coste et al. 2010, Science 330:55) once the model''s
        stretch variable is mapped to the experimental stimulus; owner to choose.'
    calibrate:
      status: pending
      reason: r_50, k_r, tau_r and g could be identified from the same data.
review:
  comment: 'Most components do not generate as committed: every Paci gate declares Vm ''dimensionless'' in the config but
    ''volt'' in the CellML; the Paci current components keep private_interface=''in'' on their gate inputs (leftover of the
    original encapsulation) and expose TTX/E4031/Chromanol_coeff and V_half without an interface; R/F use the undefined units
    J_per_MK/C_per_M; i_NaCa lacks Cai. The Tao 2011 neuron currents declare every tau in seconds although the Tao/Belluzzi-Sacchi
    expressions are in ms (all gates 1000x too slow), have sign errors in h_bar, hc_bar and kcs_bar, a spurious +17 in tau_h,
    and a GHK I_Ca that is not dimensionally consistent (Vm in mV inside exp(2VF/RT), P_Ca in m/s giving A/m2 not nA). piezo
    has no source.'
  summary: '31 components: 25 Paci 2013 hiPSC-CM pieces (12 algebraic currents, 13 gating variables), 5 Tao 2011 sympathetic-neuron
    currents (Belluzzi & Sacchi kinetics) and the owner''s unpublished Piezo-type current. Specs written for all: voltage-clamp
    exact solutions for every gate (Paci formulae transcribed from the authors'' CellML, Tao formulae from the Tao 2011 Supporting
    Material), exact algebraic identities for the currents, bounds, sweep ranges with rationale. All TODO values proposed
    (Paci constants/initial states from the authors'' CellML; Tao conductances/reversals from the Tao 2011 supplement table;
    piezo placeholders). In the repo only i_K1, i_b_Na, i_b_Ca, i_PCa and i_piezo generate; the rest are recorded expected
    failures with a proposed fix each. On a patched copy of the library with those fixes, all 25 Paci components and piezo
    pass every test; the Tao components then run but fail the source-comparison invariants (time units, signs), which is the
    point of recording them.'
  questions:
  - Confirm Paci2013 as the reference for every Paci constant and initial value (values taken from the authors' CellML, ventricular
    version, PMR workspace sseveri/paci_hyttinen_aaltosetala_severi_2013; the paper's appendix was not accessible). Gate/current
    BC operating points are the CellML initial state; E_x are Nernst values at it.
  - Approve the config/CellML fixes for the Paci components (see proposed_fixes); all were verified on a patched copy of the
    library, after which all 25 Paci components pass run/invariants/BC/timestep/stability.
  - 'Tao 2011 currents: approve (a) time constants in ms (divide by 1000 or declare tau in millis), (b) h_bar, hc_bar sign
    +(V+..), kcs_bar sign -(V+15.18)/4, (c) remove ''+ 17'' from tau_h (Tao Suppl. Eqs 87, 89, 93, 106; the published curves
    match Belluzzi & Sacchi''s measured time constants only in ms).'
  - 'i_Ca_Tao_2011 GHK: Vm (mV) is used directly in exp(2VmF/RT) (1000x too large, overflows above ~+10 mV) and P_Ca in m/s
    times concentration gives A/m2, not nA. What membrane area / units should P_Ca carry? Proposed P_Ca = 1.1e-15 m/s is Tao''s
    1.1e-16 cm/ms converted, but the current magnitude is meaningless until this is fixed.'
  - Global Cao is shared by the Paci (1.8 mM) and Tao (neuron) components; Tao lists 2 mM (SA-node table) and Belluzzi & Sacchi
    used 5 mM. Keep one global at the Paci value?
  - 'i_piezo_Na_Argus_unpublished: all 8 constants are order-of-magnitude placeholders (sourced: no). Is there a data set/source
    for r_50, k_r, tau_r, V_50, k_V, tau_V, g? Should it use E_Na (Piezo1 is non-selective, E_rev ~0 mV)?'
  - 'i_CaL_Paci_2013: nifedipine switches are inputs but nifed_coeff never multiplies I_CaL - exactly as in the original Paci
    CellML. Keep (faithful) or apply the block?'
  - 'Validation: all pending. Candidates: hiPSC-CM I-V / activation data of Ma et al. 2011 (used by Paci 2013) for the Paci
    currents; Belluzzi & Sacchi 1985-1990 J Physiol voltage-clamp data (e.g. tau_hc 17.6-29.3 ms, tau_kcf 0.8-2 ms) for the
    Tao currents after the fixes. Approve digitising these figures?'
  - i_CaL_d_gate_Paci_2013 declares Cai as an input (entrance port internal_Ca_d_gate_port [Cai, d]) that its equations never
    use, and d appears in its own entrance port. Intended?
  proposed_fixes:
  - 'ion_channel_modules_config.json + ion_channel_parameters.csv: Vm units ''dimensionless'' -> ''volt'' for the 13 Paci
    gate components (CellML declares volt; Myokit rejects the connection).'
  - 'ion_channel_modules.cellml: public_interface=''in'' (drop private_interface) for m, h, j (i_Na), f1, f2, fCa (i_CaL),
    Xr1, Xr2 (i_Kr), Xs (i_Ks), Xf (i_f), q, r (i_to); d in i_CaL: private_interface=''in'' public_interface=''out'' -> public_interface=''in''.'
  - 'ion_channel_modules.cellml: public_interface=''out'' for TTX_coeff, E4031_coeff, Chromanol_coeff, V_half (Xr1 gate) and
    for the Tao gate/tau variables (m, h, n, a, ha, kcf, kcs, c, hc and their tau_*) that the config exposes.'
  - 'ion_channel_units.cellml: define C_per_M = coulomb/mole and J_per_MK = joule/(mole kelvin) (or rename to C_per_mol /
    J_per_mol_K as in the cell module).'
  - 'i_NaCa_Paci_2013: add [''Cai'', ''millimolar'', ''access'', ''boundary_condition''] to variables_and_units and a parameters
    row (value 1.80774e-5 mM, Paci2013 initial Cai).'
  - 'Tao 2011 components: tau units ms (see question); h_bar = 1/(1+exp((Vm+53.2)/6.5)); hc_bar = 1/(1+exp((Vm+19.91)/4.5));
    kcs_bar = 1/(1+exp(-(Vm+15.18)/4.0)); tau_h without ''+ 17''; GHK exponent with Vm/1000.'
  findings:
  - 'Paci gates: exact voltage-clamp solutions hold to <1e-5 over Vm -100..+50 mV and all initial values; RK4 converges at
    order ~4; all 9 solver families work (m gate: 6/9 - tau_m falls to ~1e-8 s at -100 mV, very stiff).'
  - Paci currents are algebraic (timestep test skipped); the GHK I_CaL is 0/0 at exactly Vm = 0 (removable singularity, as
    in the original); sweep points avoid 0 V.
  - 'Paci i_K1: beta_K1 has a negative term (-1.509 e^{...}) as in the original, so XK1_inf is not bounded to [0,1] in general;
    only the formula is checked.'
  - 'Tao gates (patched copy): the gates follow their own tau exactly, but tau differs from the published ms expressions by
    1000x everywhere (and tau_h by the extra 17), and h, hc, kcs relax to the mirror-image steady state; I_Ca becomes NaN
    for Vm >~ +10 mV (exp overflow).'
  - 'Structure checks miss these defects: config-vs-CellML unit mismatches and config variables without a public interface
    are not detected (see framework needs).'
