module_type: lung_vol_generator
version: ArgusUNPUBLISHED_v01
reviewed: false
notes: 'Prescribed lung volume for driving lung stretch receptors: q_lung_V = amp sin(2π t/T_lung + φ) + q_baseline, with
  the breathing period multiplied by T_lung_multiplier inside [t_start_T_lung, t_end_T_lung] and the amplitude by q_lung_max_multiplier
  inside [t_start_q_lung_amp, t_end_q_lung_amp]; q_b = q_baseline. Because the phase is 2π t/T with absolute t, a change of
  T makes the volume jump (discontinuous q_lung_V at the window edges). Run point: rate doubled (T × 0.5) and depth × 1.5
  in the windows.'
reference_proposals:
  phi_lung:
    reference: definitional; breathing starts at mid-tidal volume (zero phase)
    sourced: definitional
    value: 0.0
  T_lung_0:
    reference: usnationallibraryofmedicinerapid; normal adult resting breathing rate 12-20 breaths/min; 15 breaths/min gives T = 4 s
    sourced: 'yes'
    value: 4.0
  q_lung_max:
    reference: hallettreid2023physiology; tidal volume ~500 mL in a healthy adult male; amplitude = TV/2 = 2.5e-4 m^3
    sourced: 'yes'
    value: 0.00025
  q_lung_baseline:
    reference: hopkins2022physiology; FRC about 3 L; baseline = FRC + TV/2 = 3.25e-3 m^3 so that the trough of the sine is FRC (hallettreid2023physiology
      TV 0.5 L)
    sourced: 'yes'
    value: 0.00325
  T_lung_multiplier:
    reference: definitional; 1 = no change of breathing period in the perturbation window
    sourced: definitional
    value: 1.0
  q_lung_max_multiplier:
    reference: definitional; 1 = no change of tidal amplitude in the perturbation window
    sourced: definitional
    value: 1.0
  t_start_T_lung:
    reference: unreferenced_placeholder; protocol choice (perturbation window start)
    sourced: 'no'
    value: 20.0
  t_end_T_lung:
    reference: unreferenced_placeholder; protocol choice (perturbation window end)
    sourced: 'no'
    value: 40.0
  t_start_q_lung_amp:
    reference: unreferenced_placeholder; protocol choice (perturbation window start)
    sourced: 'no'
    value: 30.0
  t_end_q_lung_amp:
    reference: unreferenced_placeholder; protocol choice (perturbation window end)
    sourced: 'no'
    value: 50.0
review: reviews/boundary_condition_review.yaml
review_scope: The review of the whole boundary_condition module (11 entries) before the move to versions; only the parts about
  this version apply.
