notes: 'Prescribed periodic inflow: 22-harmonic sine series with mean 7.9853e-6 m3/s. It reproduces the Boileau2015 iliac-bifurcation
  (aortic bifurcation) benchmark inflow to round-off (max difference 1e-20 m3/s) when T = 1.1 s, the benchmark period; with
  the module global T = 1 s it is time-compressed (max difference 2.6e-5 m3/s, 30 % of peak). The run point therefore uses
  T = 1.1 s. No states.'
