module_type: inlet_flow
version: nn_fourier_8
reviewed: false
notes: 'Periodic inflow from an 8-harmonic Fourier series v(t) = Σ_{i=0..8} A_i cos(2π i t/T + φ_i), T the (global) heart
  period. Tested feeding a BG arterial_simple vp vessel into a constant outlet pressure. The library values (A_0 = 1e-4, A_1
  = 1e-3, A_4 = 1e-4 m^3/s) are test values: A_1 = 1e-3 gives a peak inflow of ~1.1e-3 m^3/s and a large reverse flow (−9e-4
  m^3/s), which is not an aortic waveform.'
