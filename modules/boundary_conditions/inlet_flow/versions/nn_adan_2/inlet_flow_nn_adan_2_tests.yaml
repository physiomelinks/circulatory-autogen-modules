module_type: inlet_flow
version: nn_adan_2
reviewed: false
notes: 'Prescribed periodic inflow: piecewise-linear interpolation of 22 (t_k, q_k) knots of the Boileau2015 ADAN56 aortic-root
  inflow (knots identical to the benchmark data), repeated with t_loc = t - floor(t/T) T. The knot times are absolute (t_21
  = 1.0 s), so the waveform is only complete for T = 1 s; for T > 1 s t_loc exceeds the last knot and the piecewise has no
  otherwise branch. No states.'
reference_proposals:
  P:
    reference: unreferenced_placeholder; P is the pressure returned by the downstream vessel through the vessel port and does
      not enter the flow equation; 13332 Pa (100 mmHg) only lets the component run alone
    sourced: 'no'
    value: 13332
  T:
    reference: Boileau2015; ADAN56 benchmark cardiac period 1.0 s (inflow data span 0-1 s). NB the aortic-bifurcation inflow
      (nn_aorticbif) needs T = 1.1 s, the Boileau2015 iliac-bifurcation period, but T is one module-wide global
    sourced: 'yes'
review: reviews/open_loop_review.yaml
review_scope: The review of the whole open_loop module (5 entries) before the move to versions; only the parts about this
  version apply.
