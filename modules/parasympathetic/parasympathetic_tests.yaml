      - k_esh_gainLCN*f_esh + k_cp_gainLCN*f_cp, 0.0)/f_mid_LCN)**k_LCN) + f_max_LCN)))) <= 1e-9 * max(1.0, np.max(np.abs(f_LCN)))
  - description: f_LCN within [f_min_LCN, f_max_LCN]
