module: parasympathetic
reviewed: false
known_issues:
- 'undefined units: milliL'
defaults:
  sim_time: 2.0
  pre_time: 0.0
  dt: 0.01
  solver: CVODE_myokit
  bc_sweep:
    factors:
    - 0.5
    - 0.75
    - 1.0
    - 1.5
    - 2.0
    ranges: {}
  timestep:
    scheme: rk4
    dts:
    - 0.02
    - 0.01
    - 0.005
    - 0.0025
    min_order: 0.8
    tol: 0.0001
    cvode_tol: 0.001
    t_end: 10.0
  stability:
    supported:
    - solver: CVODE_myokit
      rtol: 1.0e-06
      atol: 1.0e-08
components:
- vessel_type: lung_stretch_receptor_Gee2023
  BC_type: nn
  module_type: lung_stretch_receptor_Gee2023
  notes: 'Slowly adapting lung stretch receptor (Gee 2023 eq. S.43): first-order low-pass filter of the lung stretch volume,
    tau_lung df_ls/dt = -f_ls + G_al q_str, f_ls(0) = 0. With constant q_str the exact solution is f_ls = G_al q_str (1 -
    exp(-t/tau_lung)).'
  sim_time: 10.0
  dt: 0.01
  outputs:
  - f_ls
  run_parameters:
    q_str: 0.0003
  invariants:
  - description: f_ls matches the exact first-order step response G_al q_str (1 - exp(-t/tau_lung))
    expr: np.max(np.abs(f_ls - (G_al*q_str*(1 - np.exp(-t/tau_lung))))) <= 1e-4 * max(1.0, np.max(np.abs(f_ls)))
  - description: f_ls >= 0 for non-negative stretch
    expr: np.all(f_ls >= -1e-9*max(1.0, np.max(np.abs(f_ls))))
  bc_sweep:
    ranges:
      q_str:
        min: 0.0
        max: 0.001
        points: 5
      tau_lung:
        min: 0.5
        max: 10
        points: 5
        scale: log
      G_al:
        min: 23290.0
        max: 23290000.0
        points: 4
        scale: log
    rationale: q_str 0-1 L covers rest to deep-breath stretch above the reference volume; tau_lung 0.5-10 s brackets the 2
      s of Gee 2023; G_al spans both candidate unit conversions (23.29 Hz/L = 2.329e4 and the csv 2.329e7 Hz/m3, see review)
      so the claimed range holds whichever is confirmed.
  reference_proposals:
    tau_lung:
      reference: 'Gee2023; Supplementary text (github v03 Model_documentation) Table S.8 / Simulink v03 block 1/(2s+1): time
        constant 2 s (the table lists tau_lung = 0.5 as a rate, eq. S.43 multiplies by it)'
      sourced: 'yes'
    G_al:
      reference: 'Gee2023; Supplementary text (github v03 Model_documentation) Table S.8: G_al = 23.291 (Simulink gain 23.29)
        with lung volume in litres (V_lung0 = 1.9, V_ln = 2.54), i.e. 23.29 Hz/L = 2.329e4 Hz/m3. The csv value 2.3291e7 implies
        Hz/mL -- 1000x larger; please confirm the conversion'
      sourced: 'yes'
    q_str:
      reference: definitional; no stretch beyond the reference lung volume at rest (input normally supplied by the lung model)
      sourced: definitional
  validation:
    baseline:
      status: pending
      reason: 'candidate: human/animal SAR firing vs lung volume data (Ursino-Magosso lineage models tune G_al to such data);
        not located in an obtainable table yet. Also depends on resolving the G_al unit question first.'
    calibrate:
      status: pending
      reason: 'candidate: human/animal SAR firing vs lung volume data (Ursino-Magosso lineage models tune G_al to such data);
        not located in an obtainable table yet. Also depends on resolving the G_al unit question first.'
- vessel_type: lung_stretch_receptor_with_threshold_OLD
  BC_type: nn
  module_type: lung_stretch_receptor_with_threshold
  notes: 'Older variant of the lung stretch receptor: the input is the lung volume V_lung = q_A + q_b above a threshold, tau_lung
    df_ls/dt = -f_ls + G_al max(V_lung - V_lung_stretch_thresh, 0). All parameters were TODO; proposed values (Gee 2023 conversions
    and typical lung volumes) let it be tested. Exact solution f_ls = G_al max(q_A + q_b - V_thr, 0)(1 - exp(-t/tau_lung)).'
  sim_time: 10.0
  dt: 0.01
  outputs:
  - f_ls
  - V_lung
  invariants:
  - description: V_lung = q_A + q_b
    expr: np.max(np.abs(V_lung - (q_A + q_b))) <= 1e-9 * max(1.0, np.max(np.abs(V_lung)))
  - description: f_ls matches the exact thresholded first-order step response
    expr: np.max(np.abs(f_ls - (G_al*max(q_A + q_b - V_lung_stretch_thresh, 0.0)*(1 - np.exp(-t/tau_lung))))) <= 1e-4 * max(1.0,
      np.max(np.abs(f_ls)))
  - description: f_ls >= 0
    expr: np.all(f_ls >= -1e-9*max(1.0, np.max(np.abs(f_ls))))
  bc_sweep:
    ranges:
      q_A:
        min: 0.0015
        max: 0.004
        points: 5
      q_b:
        min: 5.0e-05
        max: 0.0003
        points: 4
      tau_lung:
        min: 0.5
        max: 10
        points: 4
        scale: log
      G_al:
        min: 2329.0
        max: 232900.0
        points: 3
        scale: log
      V_lung_stretch_thresh:
        min: 0.0015
        max: 0.0035
        points: 5
    rationale: alveolar volume 1.5-4 L (residual to deep inspiration), bronchial/dead-space volume 50-300 mL, threshold 1.5-3.5
      L so both sub- and supra-threshold regimes are exercised; tau_lung and G_al bracket the Gee 2023 values by an order
      of magnitude.
  reference_proposals:
    tau_lung:
      reference: 'Gee2023; Supplementary text (github v03 Model_documentation) Simulink v03 1/(2s+1): 2 s'
      sourced: 'yes'
      value: 2.0
    G_al:
      reference: Gee2023; Supplementary text (github v03 Model_documentation) Table S.8, 23.29 Hz/L converted to 2.329e4 Hz/m3
        (volume in litres in the source model)
      sourced: 'yes'
      value: 23290.0
    q_A:
      reference: unreferenced_placeholder; ~FRC-level alveolar volume 2.5 L as a test operating point (normally supplied by
        the lung model)
      sourced: 'no'
      value: 0.0025
    q_b:
      reference: unreferenced_placeholder; ~150 mL anatomical dead space as a test operating point (normally supplied by the
        lung model)
      sourced: 'no'
      value: 0.00015
    V_lung_stretch_thresh:
      reference: Gee2023; Supplementary text (github v03 Model_documentation) Simulink v03 lung volume reference V_ln = 2.54
        L (stretch is measured above it) converted to 2.54e-3 m3; its use as a threshold here is the module author's choice
      sourced: 'no'
      value: 0.00254
  validation:
    baseline:
      status: not_applicable
      reason: superseded (_OLD) variant kept for compatibility; no separate validation planned. See the Gee2023 lung stretch
        receptor for the validation candidate.
    calibrate:
      status: not_applicable
      reason: superseded (_OLD) variant kept for compatibility; no separate validation planned. See the Gee2023 lung stretch
        receptor for the validation candidate.
- vessel_type: cardiopulmonary_receptor_Gee2023
  BC_type: nn
  module_type: cardiopulmonary_receptor_Gee2023
  notes: 'Cardiopulmonary (low-pressure) receptors (Gee 2023 eqs. S.41-S.42, from Ursino-Magosso): first-order low-pass filter
    of the transmural pulmonary venous pressure P_pvn - P_mus, then the sigmoid f_cp = f_maxl/(1 + exp((P_tn - P_l)/k_l)).
    With constant inputs P_l(t) = P_tr + (P_l_init - P_tr) exp(-t/tau_cp) exactly, and f_cp is the exact sigmoid of P_l.'
  sim_time: 10.0
  dt: 0.01
  outputs:
  - f_cp
  - P_pv_P_thor
  - P_l
  run_parameters:
    P_pvn: 1100.0
    P_mus: -500.0
  invariants:
  - description: transmural pressure P_pv_P_thor = P_pvn - P_mus
    expr: np.max(np.abs(P_pv_P_thor - (P_pvn - P_mus))) <= 1e-9 * max(1.0, np.max(np.abs(P_pv_P_thor)))
  - description: P_l matches the exact first-order response P_tr + (P_l_init - P_tr) exp(-t/tau_cp)
    expr: np.max(np.abs(P_l - ((P_pvn - P_mus) + (P_l_init - (P_pvn - P_mus))*np.exp(-t/tau_cp)))) <= 1e-4 * max(1.0, np.max(np.abs(P_l)))
  - description: f_cp is the static sigmoid of P_l
    expr: np.max(np.abs(f_cp - (f_maxl/(1 + np.exp((P_tn - P_l)/k_l))))) <= 1e-9 * max(1.0, np.max(np.abs(f_cp)))
  - description: f_cp in [0, f_maxl]
    expr: np.all((f_cp >= min(0.0, f_maxl) - 1e-9) & (f_cp <= max(0.0, f_maxl) + 1e-9))
  bc_sweep:
    ranges:
      P_pvn:
        min: 0.0
        max: 3000.0
        points: 5
      P_mus:
        min: -1500.0
        max: 1500.0
        points: 5
      P_l_init:
        min: 0.0
        max: 3000.0
        points: 4
      tau_cp:
        min: 0.5
        max: 10
        points: 4
        scale: log
      k_l:
        min: 100.0
        max: 2000.0
        points: 4
        scale: log
    rationale: pulmonary venous pressure 0-22 mmHg (hypovolaemia to congestion); intrathoracic/muscle pressure -11 to +11
      mmHg (deep inspiration to Valsalva); k_l spans both candidate slopes (1.43 mmHg Simulink, 11.76 mmHg supplement table);
      other constants x0.5-x2.
  reference_proposals:
    tau_cp:
      reference: 'Gee2023; Supplementary text (github v03 Model_documentation) Table S.7 and Simulink v03 1/(2s+1): 2 s'
      sourced: 'yes'
    P_l_init:
      reference: definitional; filter state starts at 0 Pa (Gee Simulink transfer function with zero initial state)
      sourced: definitional
    f_maxl:
      reference: 'Gee2023; Supplementary text (github v03 Model_documentation) Table S.7: f_max,l = 20 Hz'
      sourced: 'yes'
    P_tn:
      reference: 'Gee2023; Supplementary text (github v03 Model_documentation) Table S.7: P_tn = 10.80 mmHg = 1439.9 Pa'
      sourced: 'yes'
    k_l:
      reference: 'Gee2023; Supplementary text (github v03 Model_documentation) Simulink v03 cardiopulmonary block: k_l = 1.4286
        mmHg = 190.5 Pa (matches the csv). NOTE: supplementary Table S.7 lists k_l = 11.758 mmHg (1567.6 Pa), and the Simulink
        baroreceptor block uses k_a = 11.758 while Table S.6 gives 1.43 -- the two slopes appear swapped between table and
        code; owner to decide'
      sourced: 'yes'
    P_pvn:
      reference: unreferenced_placeholder; test operating point for an input normally supplied by a neighbour (pulmonary venous
        pressure; run point 1100 Pa ~ 8 mmHg)
      sourced: 'no'
    P_mus:
      reference: unreferenced_placeholder; test operating point for an input normally supplied by a neighbour (thoracic/respiratory-muscle
        pressure; the csv note says "TO_BE_SET_THIS_IS_WRONG"; run point -500 Pa ~ -3.75 mmHg (end-expiratory intrathoracic,
        Gee Table S.16 P_thor,max = -4 mmHg))
      sourced: 'no'
  validation:
    baseline:
      status: pending
      reason: 'candidate: cardiopulmonary afferent firing vs left atrial/pulmonary venous pressure recordings (the source
        used by Ursino-Magosso for f_max,l/P_tn/k_l); not yet located as an obtainable table. Resolve the k_l slope question
        first.'
    calibrate:
      status: pending
      reason: 'candidate: cardiopulmonary afferent firing vs left atrial/pulmonary venous pressure recordings (the source
        used by Ursino-Magosso for f_max,l/P_tn/k_l); not yet located as an obtainable table. Resolve the k_l slope question
        first.'
- vessel_type: sympathetic_afferent_Gee2023
  BC_type: nn
  module_type: sympathetic_afferent_Gee2023
  notes: 'Linear integration of afferent firing into the sympathetic drive to heart (h), peripheral circulation (p) and veins
    (v) (Gee 2023 eqs. S.46-S.48): f_asj = G_abj f_br +/- G_alj f_ls + G_acj (f_cp - 10). Lung stretch enters the heart pathway
    with a minus sign (Gee Simulink Gain8 = -1). The 10 Hz offset on f_cp is the Simulink constant fac0 = 10 (not written
    in the supplementary equations). Algebraic.'
  sim_time: 2.0
  dt: 0.01
  outputs:
  - f_ash
  - f_asp
  - f_asv
  invariants:
  - description: f_ash = G_abh f_br - G_alh f_ls + G_ach (f_cp - 10)
    expr: np.max(np.abs(f_ash - (G_abh*f_br - G_alh*f_ls + G_ach*(f_cp - 10)))) <= 1e-9 * max(1.0, np.max(np.abs(f_ash)))
  - description: f_asp = G_abp f_br + G_alp f_ls + G_acp (f_cp - 10)
    expr: np.max(np.abs(f_asp - (G_abp*f_br + G_alp*f_ls + G_acp*(f_cp - 10)))) <= 1e-9 * max(1.0, np.max(np.abs(f_asp)))
  - description: f_asv = G_abv f_br + G_alv f_ls + G_acv (f_cp - 10)
    expr: np.max(np.abs(f_asv - (G_abv*f_br + G_alv*f_ls + G_acv*(f_cp - 10)))) <= 1e-9 * max(1.0, np.max(np.abs(f_asv)))
  bc_sweep:
    ranges:
      f_br:
        min: 2.52
        max: 47.78
        points: 5
      f_ls:
        min: 0.0
        max: 30.0
        points: 4
      f_cp:
        min: 0.0
        max: 20.0
        points: 5
      G_alv:
        min: 0.0
        max: 1.0
        points: 3
      G_acv:
        min: 0.0
        max: 2.5
        points: 3
    rationale: f_br over the full baroreceptor range f_min-f_max (Gee Table S.6), f_cp over 0-f_max,l, f_ls 0-30 Hz; zero-valued
      gains swept 0-1 / 0-2.5 (the other pathways' values); other gains x0.5-x2.
  reference_proposals:
    G_abh:
      reference: 'Gee2023; Supplementary text (github v03 Model_documentation) Table S.9: G_ab,h = 1'
      sourced: 'yes'
    G_alh:
      reference: 'Gee2023; Supplementary text (github v03 Model_documentation) Table S.9: G_al,h = 1.541 (applied with sign
        -1)'
      sourced: 'yes'
    G_ach:
      reference: 'Gee2023; Supplementary text (github v03 Model_documentation) Table S.9: G_ac,h = 2'
      sourced: 'yes'
    G_abp:
      reference: 'Gee2023; Supplementary text (github v03 Model_documentation) Table S.10: G_ab,p = 1'
      sourced: 'yes'
    G_alp:
      reference: 'Gee2023; Supplementary text (github v03 Model_documentation) Table S.10: G_al,p = 0.33'
      sourced: 'yes'
    G_acp:
      reference: 'Gee2023; Supplementary text (github v03 Model_documentation) Table S.10: G_ac,p = 2.5'
      sourced: 'yes'
    G_abv:
      reference: 'Gee2023; Supplementary text (github v03 Model_documentation) Table S.11: G_ab,v = 1'
      sourced: 'yes'
    G_alv:
      reference: 'Gee2023; Supplementary text (github v03 Model_documentation) Table S.11: G_al,v = 0'
      sourced: 'yes'
    G_acv:
      reference: 'Gee2023; Supplementary text (github v03 Model_documentation) Table S.11: G_ac,v = 0'
      sourced: 'yes'
    f_br:
      reference: unreferenced_placeholder; test operating point for an input normally supplied by a neighbour (baroreceptor
        firing, 25 Hz ~ nominal f_ab_0 of Ursino 1998)
      sourced: 'no'
      value: 25.0
    f_ls:
      reference: unreferenced_placeholder; test operating point for an input normally supplied by a neighbour (lung stretch
        firing, 5 Hz)
      sourced: 'no'
      value: 5.0
    f_cp:
      reference: unreferenced_placeholder; test operating point for an input normally supplied by a neighbour (cardiopulmonary
        firing, 10 Hz = the offset fac0)
      sourced: 'no'
      value: 10.0
  validation: &id001
    baseline:
      status: not_applicable
      reason: 'intermediate neuronal population of the Gee 2023 reflex network: its firing rate is not measured on its own
        (parameters were identified from whole-system HR/elastance/ICN data), so there is no component-level data; checked
        against its exact static map. Validation belongs to the assembled closed-loop model (candidate: Gee 2023 Table 2 baseline
        SBP/DBP/HR/CO/EF and VNS % changes).'
    calibrate:
      status: not_applicable
      reason: 'intermediate neuronal population of the Gee 2023 reflex network: its firing rate is not measured on its own
        (parameters were identified from whole-system HR/elastance/ICN data), so there is no component-level data; checked
        against its exact static map. Validation belongs to the assembled closed-loop model (candidate: Gee 2023 Table 2 baseline
        SBP/DBP/HR/CO/EF and VNS % changes).'
- vessel_type: sympathetic_efferent_Gee2023
  BC_type: nn
  module_type: sympathetic_efferent_Gee2023
  notes: 'Sympathetic efferent static maps (Gee 2023 eqs. S.49-S.51, Ursino 1998 form): f_esj = f_esinf + (f_es0 - f_esinf)
    exp(-k_es f_asj). Algebraic; monotonically decreasing in f_asj, equal to f_es0 at zero drive and tending to f_esinf. (Ursino
    2000''s f_es,max cap is not included.)'
  sim_time: 2.0
  dt: 0.01
  outputs:
  - f_esh
  - f_esp
  - f_esv
  invariants:
  - description: f_esh = f_esinf + (f_es0 - f_esinf) exp(-k_es f_ash)
    expr: np.max(np.abs(f_esh - (f_esinf + (f_es0 - f_esinf)*np.exp(-k_es*f_ash)))) <= 1e-9 * max(1.0, np.max(np.abs(f_esh)))
  - description: f_esp = f_esinf + (f_es0 - f_esinf) exp(-k_es f_asp)
    expr: np.max(np.abs(f_esp - (f_esinf + (f_es0 - f_esinf)*np.exp(-k_es*f_asp)))) <= 1e-9 * max(1.0, np.max(np.abs(f_esp)))
  - description: f_esv = f_esinf + (f_es0 - f_esinf) exp(-k_es f_asv)
    expr: np.max(np.abs(f_esv - (f_esinf + (f_es0 - f_esinf)*np.exp(-k_es*f_asv)))) <= 1e-9 * max(1.0, np.max(np.abs(f_esv)))
  - description: for non-negative drive, efferent firing lies between f_esinf and f_es0
    expr: (np.all(f_ash < 0) | np.all((f_esh >= min(f_esinf, f_es0) - 1e-9) & (f_esh <= max(f_esinf, f_es0) + 1e-9))) & (np.all(f_asp
      < 0) | np.all((f_esp >= min(f_esinf, f_es0) - 1e-9) & (f_esp <= max(f_esinf, f_es0) + 1e-9))) & (np.all(f_asv < 0) |
      np.all((f_esv >= min(f_esinf, f_es0) - 1e-9) & (f_esv <= max(f_esinf, f_es0) + 1e-9)))
  bc_sweep:
    ranges:
      f_ash:
        min: -20.0
        max: 80.0
        points: 5
      f_asp:
        min: -20.0
        max: 80.0
        points: 5
      f_asv:
        min: -20.0
        max: 80.0
        points: 5
    rationale: afferent drive -20..80 Hz covers the range produced by the sympathetic afferent block over physiological receptor
      inputs (lung stretch and low f_cp make it negative); constants x0.5-x2.
  reference_proposals:
    f_esinf:
      reference: 'Gee2023; Supplementary text (github v03 Model_documentation) Table S.12: f_es,inf = 2.1 Hz (Simulink 2.1)'
      sourced: 'yes'
    f_es0:
      reference: 'Gee2023; Supplementary text (github v03 Model_documentation) Table S.12: f_es,0 = 16.11 Hz (Simulink f_es0
        - f_es,inf = 14.01)'
      sourced: 'yes'
    k_es:
      reference: 'Gee2023; Supplementary text (github v03 Model_documentation) Table S.12: k_es = 0.0675 s'
      sourced: 'yes'
    f_ash:
      reference: unreferenced_placeholder; test operating point for an input normally supplied by a neighbour (sympathetic
        afferent drive to heart)
      sourced: 'no'
      value: 20.0
    f_asp:
      reference: unreferenced_placeholder; test operating point for an input normally supplied by a neighbour (sympathetic
        afferent drive to periphery)
      sourced: 'no'
      value: 25.0
    f_asv:
      reference: unreferenced_placeholder; test operating point for an input normally supplied by a neighbour (sympathetic
        afferent drive to veins)
      sourced: 'no'
      value: 25.0
  validation: *id001
- vessel_type: peripheral_resistance_effector_Gee2023
  BC_type: nn
  module_type: peripheral_resistance_effector_Gee2023
  notes: 'Sympathetic effector (Gee 2023 eqs. S.52-S.53, Ursino 1998 form): sigma = G_Rsp ln(f - f_es_min + 1) for f >= f_es_min
    else 0, and tau_Rsp dDelta_Rsp/dt = -Delta_Rsp + sigma with Delta_Rsp(0) = 0. With constant f_esp the exact solution is
    Delta_Rsp = sigma (1 - exp(-t/tau_Rsp)). The Ursino/Gee pure time delay is not modelled.'
  sim_time: 30.0
  dt: 0.02
  outputs:
  - Delta_Rsp
  - sigma_Rsp
  run_parameters:
    f_esp: 6.0
  invariants:
  - description: static map sigma = G_Rsp ln(max(f_esp - f_es_min + 1, 1))
    expr: np.max(np.abs(sigma_Rsp - (np.where(f_esp >= f_es_min, G_Rsp*np.log(f_esp - f_es_min + 1), 0.0)))) <= 1e-9 * max(1.0,
      np.max(np.abs(sigma_Rsp)))
  - description: Delta_Rsp matches the exact first-order step response sigma (1 - exp(-t/tau_Rsp))
    expr: np.max(np.abs(Delta_Rsp - (np.where(f_esp >= f_es_min, G_Rsp*np.log(f_esp - f_es_min + 1), 0.0)*(1 - np.exp(-t/tau_Rsp)))))
      <= 1e-4 * max(1.0, np.max(np.abs(Delta_Rsp)))
  bc_sweep:
    ranges:
      f_esp:
        min: 0.0
        max: 60.0
        points: 7
      tau_Rsp:
        min: 1.0
        max: 30.0
        points: 4
        scale: log
    rationale: f_esp 0-60 Hz spans silent to maximal sympathetic firing (f_es,max = 60 Hz in Ursino 2000) and crosses f_es_min
      where the map switches; tau_Rsp 1-30 s covers the csv value and the Gee Simulink value; gain x0.5-x2.
  reference_proposals:
    G_Rsp:
      reference: 'Gee2023; Supplementary text (github v03 Model_documentation) Table S.13: G_R,sp = 0.695 mmHg s mL^-1 per
        Hz (0.695 mmHg s mL^-1 Hz^-1 x 133.322 Pa/mmHg x 1e6 mL/m3 = 9.266e7 Pa s m^-3 Hz^-1)'
      sourced: 'yes'
    tau_Rsp:
      reference: 'Gee2023; Supplementary text (github v03 Model_documentation) Simulink v03 Rsp block uses tau = 6 s (TransferFcn
        1/(6s+1)) with a separate 2 s transport delay. The csv value 2 s equals the DELAY D_R,sp of Table S.14 (listed under
        "time constants"), not the time constant. Proposed: tau_Rsp = 6 s'
      sourced: 'no'
    f_esp:
      reference: unreferenced_placeholder; test operating point for an input normally supplied by a neighbour (sympathetic
        efferent firing; run point 6 Hz above f_es_min)
      sourced: 'no'
      value: 4.0
    f_es_min:
      reference: 'Gee2023; Supplementary text (github v03 Model_documentation) Table S.12: f_es,min = 2.66 Hz (Simulink constant
        2.66 - 1)'
      sourced: 'yes'
  validation:
    baseline:
      status: not_applicable
      reason: effector gain/time constant of a reflex arm; component-level response (e.g. peripheral resistance or unstressed
        volume change after a step in sympathetic firing) is not available as data here; validation belongs to the closed-loop
        model.
    calibrate:
      status: not_applicable
      reason: effector gain/time constant of a reflex arm; component-level response (e.g. peripheral resistance or unstressed
        volume change after a step in sympathetic firing) is not available as data here; validation belongs to the closed-loop
        model.
- vessel_type: unstressed_volume_effector_Gee2023
  BC_type: nn
  module_type: unstressed_volume_effector_Gee2023
  notes: 'Sympathetic effector (Gee 2023 eqs. S.52-S.53, Ursino 1998 form): sigma = G_Vusv ln(f - f_es_min + 1) for f >= f_es_min
    else 0, and tau_Vusv dDelta_Vusv/dt = -Delta_Vusv + sigma with Delta_Vusv(0) = 0. With constant f_esv the exact solution
    is Delta_Vusv = sigma (1 - exp(-t/tau_Vusv)). The Ursino/Gee pure time delay is not modelled.'
  sim_time: 30.0
  dt: 0.02
  outputs:
  - Delta_Vusv
  - sigma_Vusv
  run_parameters:
    f_esv: 6.0
  invariants:
  - description: static map sigma = G_Vusv ln(max(f_esv - f_es_min + 1, 1))
    expr: np.max(np.abs(sigma_Vusv - (np.where(f_esv >= f_es_min, G_Vusv*np.log(f_esv - f_es_min + 1), 0.0)))) <= 1e-9 * max(1.0,
      np.max(np.abs(sigma_Vusv)))
  - description: Delta_Vusv matches the exact first-order step response sigma (1 - exp(-t/tau_Vusv))
    expr: np.max(np.abs(Delta_Vusv - (np.where(f_esv >= f_es_min, G_Vusv*np.log(f_esv - f_es_min + 1), 0.0)*(1 - np.exp(-t/tau_Vusv)))))
      <= 1e-4 * max(1.0, np.max(np.abs(Delta_Vusv)))
  bc_sweep:
    ranges:
      f_esv:
        min: 0.0
        max: 60.0
        points: 7
      tau_Vusv:
        min: 1.0
        max: 30.0
        points: 4
        scale: log
    rationale: f_esv 0-60 Hz spans silent to maximal sympathetic firing (f_es,max = 60 Hz in Ursino 2000) and crosses f_es_min
      where the map switches; tau_Vusv 1-30 s covers the csv value and the Gee Simulink value; gain x0.5-x2.
  reference_proposals:
    G_Vusv:
      reference: 'Gee2023; Supplementary text (github v03 Model_documentation) Table S.13: G_Vu,sv = -265.4 mL per Hz (log
        map) (-265.4 mL per ln-unit = -2.654e-4 m3)'
      sourced: 'yes'
    tau_Vusv:
      reference: 'Gee2023; Supplementary text (github v03 Model_documentation) Simulink v03 Vusv block uses tau = 20 s (TransferFcn
        1/(20s+1)) with a separate 5 s transport delay. The csv value 5 s equals the DELAY D_Vu,sv of Table S.14, not the
        time constant. Proposed: tau_Vusv = 20 s'
      sourced: 'no'
    f_esv:
      reference: unreferenced_placeholder; test operating point for an input normally supplied by a neighbour (sympathetic
        efferent firing; run point 6 Hz above f_es_min)
      sourced: 'no'
      value: 4.0
    f_es_min:
      reference: 'Gee2023; Supplementary text (github v03 Model_documentation) Table S.12: f_es,min = 2.66 Hz (Simulink constant
        2.66 - 1)'
      sourced: 'yes'
  validation:
    baseline:
      status: not_applicable
      reason: effector gain/time constant of a reflex arm; component-level response (e.g. peripheral resistance or unstressed
        volume change after a step in sympathetic firing) is not available as data here; validation belongs to the closed-loop
        model.
    calibrate:
      status: not_applicable
      reason: effector gain/time constant of a reflex arm; component-level response (e.g. peripheral resistance or unstressed
        volume change after a step in sympathetic firing) is not available as data here; validation belongs to the closed-loop
        model.
- vessel_type: NTS_Gee2023
  BC_type: nn
  module_type: NTS_Gee2023
  notes: 'Nucleus tractus solitarius neuronal subtypes (Gee 2023 eq. 3, from Park 2020): one sigmoid per afferent input, f
    = (f_min - f_max)/(1 + (f_in/f_mid)^k) + f_max, rising from f_min (zero input) to f_max. The chemoreceptor (ch) subtype
    is an addition of this library (hand-tuned, not in Gee 2023). Algebraic.'
  sim_time: 2.0
  dt: 0.01
  outputs:
  - f_NTS_br
  - f_NTS_ls
  - f_NTS_cp
  - f_NTS_ch
  invariants:
  - description: f_NTS_br is the exact sigmoid of f_br
    expr: np.max(np.abs(f_NTS_br - (((f_min_br - f_max_br)/(1 + (f_br/f_mid_br)**k_NTS_br) + f_max_br)))) <= 1e-9 * max(1.0,
      np.max(np.abs(f_NTS_br)))
  - description: f_NTS_ls is the exact sigmoid of f_ls
    expr: np.max(np.abs(f_NTS_ls - (((f_min_ls - f_max_ls)/(1 + (f_ls/f_mid_ls)**k_NTS_ls) + f_max_ls)))) <= 1e-9 * max(1.0,
      np.max(np.abs(f_NTS_ls)))
  - description: f_NTS_cp is the exact sigmoid of f_cp
    expr: np.max(np.abs(f_NTS_cp - (((f_min_cp - f_max_cp)/(1 + (f_cp/f_mid_cp)**k_NTS_cp) + f_max_cp)))) <= 1e-9 * max(1.0,
      np.max(np.abs(f_NTS_cp)))
  - description: f_NTS_ch is the exact sigmoid of f_apc
    expr: np.max(np.abs(f_NTS_ch - (((f_min_ch - f_max_ch)/(1 + (f_apc/f_mid_ch)**k_NTS_ch) + f_max_ch)))) <= 1e-9 * max(1.0,
      np.max(np.abs(f_NTS_ch)))
  - description: f_NTS_br within [f_min_br, f_max_br]
    expr: np.all((f_NTS_br >= min(f_min_br, f_max_br) - 1e-9) & (f_NTS_br <= max(f_min_br, f_max_br) + 1e-9))
  - description: f_NTS_ls within [f_min_ls, f_max_ls]
    expr: np.all((f_NTS_ls >= min(f_min_ls, f_max_ls) - 1e-9) & (f_NTS_ls <= max(f_min_ls, f_max_ls) + 1e-9))
  - description: f_NTS_cp within [f_min_cp, f_max_cp]
    expr: np.all((f_NTS_cp >= min(f_min_cp, f_max_cp) - 1e-9) & (f_NTS_cp <= max(f_min_cp, f_max_cp) + 1e-9))
  - description: f_NTS_ch within [f_min_ch, f_max_ch]
    expr: np.all((f_NTS_ch >= min(f_min_ch, f_max_ch) - 1e-9) & (f_NTS_ch <= max(f_min_ch, f_max_ch) + 1e-9))
  bc_sweep:
    ranges:
      f_br:
        min: 0.0
        max: 60.0
        points: 5
      f_ls:
        min: 0.0
        max: 30.0
        points: 4
      f_cp:
        min: 0.0
        max: 30.0
        points: 4
      f_apc:
        min: 0.0
        max: 20.0
        points: 5
    rationale: afferent inputs from silent to beyond their receptors' saturation (baroreceptor f_max 47.8 Hz, f_max,l 20 Hz,
      chemoreceptor f_apc up to ~20 Hz in hypoxia); sigmoid constants x0.5-x2.
  reference_proposals:
    f_min_br:
      reference: 'Gee2023; Supplementary text (github v03 Model_documentation) Simulink v03 BR cell group alpha = 0.304 Hz
        (Table S.17: 0.30)'
      sourced: 'yes'
    f_max_br:
      reference: 'Gee2023; Supplementary text (github v03 Model_documentation) Simulink v03 beta = 21.499 Hz (Table S.17:
        21.50)'
      sourced: 'yes'
    f_mid_br:
      reference: Gee2023; Supplementary text (github v03 Model_documentation) Simulink v03 fcs0 x fmidgain = 25 x 1.765 =
        44.125 Hz. Table S.17 lists 37.07 Hz -- table and code differ
      sourced: 'yes'
    k_NTS_br:
      reference: 'Gee2023; Supplementary text (github v03 Model_documentation) Table S.17 / Simulink: k = 21'
      sourced: 'yes'
    f_min_ls:
      reference: 'Gee2023; Supplementary text (github v03 Model_documentation) Table S.19 / Simulink: 2.75 Hz'
      sourced: 'yes'
    f_max_ls:
      reference: 'Gee2023; Supplementary text (github v03 Model_documentation) Simulink 2.753 + 28.816 = 31.569 Hz (Table
        S.19: 31.57)'
      sourced: 'yes'
    f_mid_ls:
      reference: unreferenced_placeholder; Gee 2023 Table S.19 / Simulink give f_mid,LSR = 11.126 Hz; the csv value 0.13 Hz
        is a local modification ("changed_from_11.126") -- 85x smaller, which saturates the LS subtype for any f_ls > ~0.5
        Hz. Owner to justify or revert
      sourced: 'no'
    k_NTS_ls:
      reference: 'Gee2023; Supplementary text (github v03 Model_documentation) Table S.19 / Simulink: k = 2'
      sourced: 'yes'
    f_min_cp:
      reference: 'Gee2023; Supplementary text (github v03 Model_documentation) Table S.18 / Simulink: 0.451 Hz'
      sourced: 'yes'
    f_max_cp:
      reference: Gee2023; Supplementary text (github v03 Model_documentation) Simulink 0.451 + 27.876 = 28.327 Hz
      sourced: 'yes'
    f_mid_cp:
      reference: 'unreferenced_placeholder; Gee 2023 Simulink uses f_mid,CPR = 10.21 Hz (Table S.18: 10.20, marked as the
        Park 2020 alternate value); the csv 20.2 Hz does not appear in Gee 2023 -- source unknown'
      sourced: 'no'
    k_NTS_cp:
      reference: 'Gee2023; Supplementary text (github v03 Model_documentation) Table S.18 / Simulink: k = 7'
      sourced: 'yes'
    f_min_ch:
      reference: unreferenced_placeholder; chemoreceptor NTS subtype is not in Gee 2023; value identified by the module author
        (2024-06-11)
      sourced: 'no'
    f_max_ch:
      reference: unreferenced_placeholder; hand-tuned by the module author
      sourced: 'no'
    f_mid_ch:
      reference: unreferenced_placeholder; hand-tuned by the module author
      sourced: 'no'
    k_NTS_ch:
      reference: unreferenced_placeholder; hand-tuned by the module author
      sourced: 'no'
    f_br:
      reference: unreferenced_placeholder; test operating point for an input normally supplied by a neighbour (baroreceptor
        firing 25 Hz)
      sourced: 'no'
      value: 25.0
    f_ls:
