    expr: np.max(np.abs(f_PNDMV_filt - (((f_min_PNDMV - f_max_PNDMV)/(1 + ((f_DMV + f_NActr + f_LCN)/f_mid_PNDMV)**k_PNDMV)
      + f_max_PNDMV)*(1 - np.exp(-t/tau_PNDMV))))) <= 1e-4 * max(1.0, np.max(np.abs(f_PNDMV_filt)))
  - description: f_PNDMV is the exact Gee 2023 sigmoid of its input
    expr: np.max(np.abs(f_PNDMV - (((f_min_PNDMV - f_max_PNDMV)/(1 + ((f_DMV + f_NActr + f_LCN)/f_mid_PNDMV)**k_PNDMV) + f_max_PNDMV))))
