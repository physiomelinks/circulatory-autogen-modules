  notes: 'ICN principal neurons receiving DMV input (Gee 2023 eqs. 2-3): sigmoid of f_DMV + f_NActr + f_LCN, then a first-order
    filter (muscarinic dynamics) tau_PNDMV df_filt/dt = f_PNDMV - f_filt, f_filt(0) = 0. With constant inputs the exact solution
    is f_filt = f_PNDMV (1 - exp(-t/tau_PNDMV)). Parameters re-identified by the module author.'
  sim_time: 15.0
  dt: 0.01
