- vessel_type: NA_Gee2023
  BC_type: nn
  module_type: NA_Gee2023
  notes: 'Nucleus ambiguus (Gee 2023 eqs. 1, 3): input is the summed NTS output, scaled by k_RSA during inspiration (respiratory-phase
    gate s_floor <= 0.4, i.e. s < T_insp/T_resp) and unscaled otherwise. Algebraic.'
  sim_time: 2.0
  dt: 0.01
  outputs:
  - f_NA
  - f_NTS_output
  - f_NA_input
  invariants:
  - description: f_NTS_output is the sum of the four NTS subtype outputs
    expr: np.max(np.abs(f_NTS_output - (f_NTS_br + f_NTS_ls + f_NTS_cp + f_NTS_ch))) <= 1e-9 * max(1.0, np.max(np.abs(f_NTS_output)))
  - description: 'RSA gate: f_NA_input = f_NTS_output if s_floor > 0.4 else k_RSA f_NTS_output'
    expr: np.max(np.abs(f_NA_input - (np.where(s_floor > 0.4, 1.0, k_RSA)*(f_NTS_br + f_NTS_ls + f_NTS_cp + f_NTS_ch)))) <=
      1e-9 * max(1.0, np.max(np.abs(f_NA_input)))
  - description: f_NA is the exact Gee 2023 sigmoid of its input
    expr: np.max(np.abs(f_NA - (((f_min_NA - f_max_NA)/(1 + (np.where(s_floor > 0.4, 1.0, k_RSA)*(f_NTS_br + f_NTS_ls + f_NTS_cp
      + f_NTS_ch)/f_mid_NA)**k_NA) + f_max_NA)))) <= 1e-9 * max(1.0, np.max(np.abs(f_NA)))
  - description: f_NA within [f_min_NA, f_max_NA]
    expr: np.all((f_NA >= min(f_min_NA, f_max_NA) - 1e-9) & (f_NA <= max(f_min_NA, f_max_NA) + 1e-9))
  bc_sweep:
    ranges:
      s_floor:
        min: 0.0
        max: 1.0
        points: 5
      f_NTS_br:
        min: 0.3
        max: 21.5
        points: 4
      f_NTS_ls:
        min: 2.75
        max: 31.57
        points: 4
      f_NTS_cp:
        min: 0.45
        max: 28.33
        points: 4
      f_NTS_ch:
        min: 0.0
        max: 25.0
        points: 4
      k_RSA:
        min: 0.0
        max: 1.0
        points: 5
    rationale: s_floor over the whole respiratory phase [0, 1] (both gate states); NTS outputs over their sigmoid ranges;
      k_RSA 0-1 (full gating to none); other constants x0.5-x2.
  reference_proposals:
    f_min_NA:
      reference: 'Gee2023; Supplementary text (github v03 Model_documentation) Table S.20 / Simulink alpha = 4.875: 4.88 Hz'
      sourced: 'yes'
    f_max_NA:
      reference: 'Gee2023; Supplementary text (github v03 Model_documentation) Table S.20 / Simulink 4.875 + 10.9 = 15.775:
        15.78 Hz'
      sourced: 'yes'
