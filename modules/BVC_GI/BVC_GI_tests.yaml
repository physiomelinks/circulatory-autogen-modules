module: BVC_GI
reviewed: false
known_issues: []
defaults:
  sim_time: 20.0
  pre_time: 0.0
  dt: 0.001
  solver: CVODE_myokit
  solver_info:
    rtol: 1.0e-08
    atol: 1.0e-12
  bc_sweep:
    factors:
    - 0.5
    - 0.75
    - 1.0
    - 1.5
    - 2.0
    ranges:
      RT:
        min: 2400
        max: 2600
        points: 3
      u_giEpi_e:
        min: -0.08
        max: 0.0
        points: 5
      v_giIn_W:
        min: 0
        max: 5.0e-05
        points: 3
      v_giOut_W:
        min: 0
        max: 5.0e-05
        points: 3
      v_giIn_Na:
        min: 0
        max: 5.0e-06
        points: 3
      v_giOut_Na:
        min: 0
        max: 5.0e-06
        points: 3
      k_gi_W:
        min: 0.0001
        max: 0.01
        points: 5
        scale: log
      kK_gi_Na:
        min: 0.1
        max: 10
        points: 5
        scale: log
      k_giEpi_NKE:
        min: 10000.0
        max: 1000000.0
        points: 5
        scale: log
    rationale: RT spans body temperatures 289-313 K (the source value 2500 J/mol is 300.7 K; 37 C is 2578.8 J/mol); u_giEpi_e
      spans epithelial membrane potentials -80 to 0 mV; lumen water and Na in/outflows span 0 to about twice daily intake
      (2 L/day water = 2.3e-5 L/s; 100 mmol/day Na = 1.16e-6 mol/s) so the lumen stays positive over the 20 s run; the three
      rate constants span two decades around the source values (the fastest gives relaxation rates of order 100 /s); every
      other constant (volumes, K amounts, affinities, initial amounts, and the blood-side BCs q_vc_Na, q_vc_W) is swept by
      0.5-2x its nominal value.
  timestep:
    scheme: rk4
    dts:
    - 0.004
    - 0.002
    - 0.001
    - 0.0005
    min_order: 0.8
    tol: 0.0001
    cvode_tol: 0.001
    t_end: 5.0
  stability:
    supported:
    - solver: CVODE_myokit
      rtol: 1.0e-06
      atol: 1.0e-08
components:
- vessel_type: BVC_GI
  BC_type: nn
  module_type: BVC_GI_main_type
  outputs:
  - q_gi_W
  - q_gi_Na
  - q_giEpi_Na
  - c_gi_Na
  - C_gi_Na
  - c_giEpi_Na
  - C_giEpi_Na
  - u_gi_osmotic
  - v_gi_W
  - v_gi_Na
  - v_giEpi_NKE
  invariants:
  - description: 'lumen water balance: q_gi_W = q_gi_W_init + (v_giIn_W - v_giOut_W) t - integral of v_gi_W (trapezoid on
      the output grid; tolerance 1e-5 q_gi_W_init plus the trapezoid error bound dt max|v|/10 for the fast initial transient)'
    expr: np.max(np.abs(q_gi_W - q_gi_W_init - (v_giIn_W - v_giOut_W)*t + np.concatenate([[0.0], np.cumsum(0.5*(v_gi_W[1:]
      + v_gi_W[:-1])*np.diff(t))]))) <= 1e-5*q_gi_W_init + 0.1*(t[1] - t[0])*np.max(np.abs(v_gi_W))
  - description: 'lumen + epithelium Na balance: q_gi_Na + q_giEpi_Na = initial + (v_giIn_Na - v_giOut_Na) t - integral of
      v_giEpi_NKE (Na leaves only through the NKE to the blood; same tolerance form)'
    expr: np.max(np.abs(q_gi_Na + q_giEpi_Na - q_gi_Na_init - q_giEpi_Na_init - (v_giIn_Na - v_giOut_Na)*t + np.concatenate([[0.0],
      np.cumsum(0.5*(v_giEpi_NKE[1:] + v_giEpi_NKE[:-1])*np.diff(t))]))) <= 1e-5*(q_gi_Na_init + q_giEpi_Na_init) + 0.1*(t[1]
      - t[0])*np.max(np.abs(v_giEpi_NKE))
  - description: 'constitutive relations: c = q/V, C = 1000 c, u_gi_osmotic = RT c_gi_Na, v_gi_W = k_gi_W (RT q_vc_Na/q_vc_W
      - u_gi_osmotic), v_gi_Na = kK_gi_Na (q_gi_Na - q_giEpi_Na)'
    expr: np.allclose(c_gi_Na, q_gi_Na/q_gi_W, rtol=1e-9) and np.allclose(c_giEpi_Na, q_giEpi_Na/q_giEpi_W, rtol=1e-9) and
      np.allclose(C_gi_Na, 1000*c_gi_Na, rtol=1e-12) and np.allclose(C_giEpi_Na, 1000*c_giEpi_Na, rtol=1e-12) and np.allclose(u_gi_osmotic,
      RT*c_gi_Na, rtol=1e-9) and np.allclose(v_gi_W, k_gi_W*(RT*q_vc_Na/q_vc_W - u_gi_osmotic), rtol=1e-6, atol=1e-9*k_gi_W*RT*q_vc_Na/q_vc_W)
      and np.allclose(v_gi_Na, kK_gi_Na*(q_gi_Na - q_giEpi_Na), rtol=1e-6, atol=1e-9*kK_gi_Na*q_gi_Na_init)
  - description: NKE flux equals its closed form 3 k (A^3 B^2 - C^3 D^2 exp(2 F u/RT)) / ((1+A^3)(1+C^3)(1+B^2)(1+D^2)), A
      = K_Na c_giEpi, B = K_K q_vc_K/q_vc_W, C = K_Na q_vc_Na/q_vc_W, D = K_K q_giEpi_K/q_giEpi_W; so its sign is that of
      the thermodynamic driving force
    expr: np.allclose(v_giEpi_NKE, 3*k_giEpi_NKE*((K_Na*c_giEpi_Na)**3*(K_K*q_vc_K/q_vc_W)**2 - (K_Na*q_vc_Na/q_vc_W)**3*(K_K*q_giEpi_K/q_giEpi_W)**2*np.exp(2*F*u_giEpi_e/RT))/((1
      + (K_Na*c_giEpi_Na)**3)*(1 + (K_Na*q_vc_Na/q_vc_W)**3)*(1 + (K_K*q_vc_K/q_vc_W)**2)*(1 + (K_K*q_giEpi_K/q_giEpi_W)**2)),
      rtol=1e-6, atol=1e-12)
  - description: volumes and amounts stay positive
    expr: np.all(q_gi_W > 0) and np.all(q_gi_Na > 0) and np.all(q_giEpi_Na > 0)
  - description: 'analytic steady state (balanced in/outflows at the run point): lumen isotonic with blood (c_gi_Na = q_vc_Na/q_vc_W),
      q_gi_Na = q_giEpi_Na, and NKE at equilibrium c_giEpi^3 = c_vc^3 (q_giEpi_K/q_giEpi_W)^2 (q_vc_W/q_vc_K)^2 exp(2 F u/RT)'
    applies: run
    expr: abs(c_gi_Na[-1]/(q_vc_Na/q_vc_W) - 1) < 1e-5 and abs(q_gi_Na[-1]/q_giEpi_Na[-1] - 1) < 1e-5 and abs(c_giEpi_Na[-1]/((q_vc_Na/q_vc_W)*((q_giEpi_K/q_giEpi_W)*(q_vc_W/q_vc_K))**(2.0/3.0)*np.exp(2*F*u_giEpi_e/(3*RT)))
      - 1) < 1e-5
  validation:
    baseline:
      status: pending
      reason: 'No time-series data identified that maps onto this lumped gut-lumen/epithelium compartment. Candidate: human
        intestinal perfusion studies of Na and water absorption (absorption rate vs luminal Na). Not set up because the source
        parameters are not physiological (e.g. 0.028 L lumen, 0.5 L epithelium, NKE without ATP drive), so the parameter set
        would have to be re-derived first.'
    calibrate:
      status: pending
      reason: 'as baseline: needs physiological absorption data and a physiological re-parameterisation first.'
  reference_proposals:
    RT:
      reference: unreferenced_placeholder; 2500 J/mol from P. Hunter's unpublished blood-volume-control parameter set (CA_user_volume_control
        ANS_CVS_BVC_parameters.csv, data_reference 'Peter_Hunter'; same value in ANS_CVS_BVolCtl_FA_MG_PH_v2.cellml); no publication
        found that reports it; equals R T with R = 8.314462618 J/(mol K) (CODATA2018) at T = 300.7 K; body temperature (310.15
        K) gives 2578.8 J/mol
      sourced: 'no'
      value: 2500
    F:
      reference: CODATA2018; Faraday constant F = N_A e = 96485.33212 C/mol (exact in the 2019 SI); the source model used
        0.965e5
      sourced: 'yes'
      value: 96485.33212
    q_gi_W_init:
      reference: unreferenced_placeholder; 0.0282852352956092 L (gut lumen water; a steady state of the source model) from
        P. Hunter's unpublished blood-volume-control parameter set (CA_user_volume_control ANS_CVS_BVC_parameters.csv, data_reference
        'Peter_Hunter'; same value in ANS_CVS_BVolCtl_FA_MG_PH_v2.cellml); no publication found that reports it
      sourced: 'no'
      value: 0.0282852352956092
    q_gi_Na_init:
      reference: unreferenced_placeholder; 0.00413018483992228 mol (lumen Na; 146 mM with q_gi_W_init) from P. Hunter's unpublished
        blood-volume-control parameter set (CA_user_volume_control ANS_CVS_BVC_parameters.csv, data_reference 'Peter_Hunter';
        same value in ANS_CVS_BVolCtl_FA_MG_PH_v2.cellml); no publication found that reports it
      sourced: 'no'
      value: 0.00413018483992228
    q_giEpi_Na_init:
      reference: unreferenced_placeholder; 0.00104446781277001 mol (epithelial Na; 2.1 mM in 0.5 L) from P. Hunter's unpublished
        blood-volume-control parameter set (CA_user_volume_control ANS_CVS_BVC_parameters.csv, data_reference 'Peter_Hunter';
        same value in ANS_CVS_BVolCtl_FA_MG_PH_v2.cellml); no publication found that reports it
      sourced: 'no'
      value: 0.00104446781277001
    u_giEpi_e:
      reference: unreferenced_placeholder; -0.04 V (epithelial membrane potential, -40 mV) from P. Hunter's unpublished blood-volume-control
        parameter set (CA_user_volume_control ANS_CVS_BVC_parameters.csv, data_reference 'Peter_Hunter'; same value in ANS_CVS_BVolCtl_FA_MG_PH_v2.cellml);
        no publication found that reports it
      sourced: 'no'
      value: -0.04
    v_giOut_W:
      reference: unreferenced_placeholder; 0 L/s (no faecal water loss) from P. Hunter's unpublished blood-volume-control
        parameter set (CA_user_volume_control ANS_CVS_BVC_parameters.csv, data_reference 'Peter_Hunter'; same value in ANS_CVS_BVolCtl_FA_MG_PH_v2.cellml);
        no publication found that reports it
      sourced: 'no'
      value: 0
    v_giOut_Na:
      reference: unreferenced_placeholder; 1.16e-06 mol/s (about 100 mmol/day) from P. Hunter's unpublished blood-volume-control
        parameter set (CA_user_volume_control ANS_CVS_BVC_parameters.csv, data_reference 'Peter_Hunter'; same value in ANS_CVS_BVolCtl_FA_MG_PH_v2.cellml);
        no publication found that reports it
      sourced: 'no'
      value: 1.16e-06
    v_giIn_W:
      reference: unreferenced_placeholder; 0 L/s (no water intake) from P. Hunter's unpublished blood-volume-control parameter
        set (CA_user_volume_control ANS_CVS_BVC_parameters.csv, data_reference 'Peter_Hunter'; same value in ANS_CVS_BVolCtl_FA_MG_PH_v2.cellml);
        no publication found that reports it
      sourced: 'no'
      value: 0
    v_giIn_Na:
      reference: unreferenced_placeholder; 1.16e-6 mol/s (about 100 mmol/day dietary Na) is v_giIn_Na0 in ANS_CVS_BVolCtl_FA_MG_PH_v2.cellml
        (P. Hunter); the CA_user_volume_control csv has 0 instead; 1.16e-6 balances v_giOut_Na so the lumen has a steady state
      sourced: 'no'
      value: 1.16e-06
    q_vc_Na:
      reference: unreferenced_placeholder; 0.0114979848860844 mol, the q_vc_Na_init of BVC_Na_circ in the source parameter
        set (P. Hunter); in a network supplied by BVC_Na_circ
      sourced: 'no'
      value: 0.0114979848860844
    q_vc_W:
      reference: unreferenced_placeholder; 0.0787096323180918 L, the intestinal-capillary volume (q_intestineC) in ANS_CVS_BVolCtl_FA_MG_PH_v2.cellml;
        gives c_vc = 146 mM, isotonic with q_gi at t = 0; in a network supplied by the capillarys osmotic_vol_port
      sourced: 'no'
      value: 0.0787096323180918
    q_vc_K:
      reference: 'unreferenced_placeholder; 0.03 mol from P. Hunter''s unpublished blood-volume-control parameter set (CA_user_volume_control
        ANS_CVS_BVC_parameters.csv, data_reference ''Peter_Hunter''; same value in ANS_CVS_BVolCtl_FA_MG_PH_v2.cellml); no
        publication found that reports it; blood-side K amount; with the blood volumes of these modules (0.08-0.2 L) this
        is 150-380 mM, far above plasma K (about 4-5 mM): looks swapped with / not comparable to intracellular K'
      sourced: 'no'
      value: 0.03
    q_giEpi_W:
      reference: unreferenced_placeholder; 0.5 L (epithelial water volume) from P. Hunter's unpublished blood-volume-control
        parameter set (CA_user_volume_control ANS_CVS_BVC_parameters.csv, data_reference 'Peter_Hunter'; same value in ANS_CVS_BVolCtl_FA_MG_PH_v2.cellml);
        no publication found that reports it
      sourced: 'no'
      value: 0.5
    k_gi_W:
      reference: unreferenced_placeholder; 0.001 L/(s kPa) (osmotic water permeability) from P. Hunter's unpublished blood-volume-control
        parameter set (CA_user_volume_control ANS_CVS_BVC_parameters.csv, data_reference 'Peter_Hunter'; same value in ANS_CVS_BVolCtl_FA_MG_PH_v2.cellml);
        no publication found that reports it
      sourced: 'no'
      value: 0.001
    kK_gi_Na:
      reference: unreferenced_placeholder; 1 1/s (lumen-to-epithelium Na rate) from P. Hunter's unpublished blood-volume-control
        parameter set (CA_user_volume_control ANS_CVS_BVC_parameters.csv, data_reference 'Peter_Hunter'; same value in ANS_CVS_BVolCtl_FA_MG_PH_v2.cellml);
        no publication found that reports it
      sourced: 'no'
      value: 1
    k_giEpi_NKE:
      reference: unreferenced_placeholder; 100000 mol/s (NKE rate constant) from P. Hunter's unpublished blood-volume-control
        parameter set (CA_user_volume_control ANS_CVS_BVC_parameters.csv, data_reference 'Peter_Hunter'; same value in ANS_CVS_BVolCtl_FA_MG_PH_v2.cellml);
        no publication found that reports it
      sourced: 'no'
      value: 100000
    q_giEpi_K:
      reference: unreferenced_placeholder; 0.012 mol (epithelial K; 24 mM in 0.5 L, well below intracellular K of about 140
        mM) from P. Hunter's unpublished blood-volume-control parameter set (CA_user_volume_control ANS_CVS_BVC_parameters.csv,
        data_reference 'Peter_Hunter'; same value in ANS_CVS_BVolCtl_FA_MG_PH_v2.cellml); no publication found that reports
        it
      sourced: 'no'
      value: 0.012
    K_Na:
      reference: unreferenced_placeholder; 1 L/mol from P. Hunter's unpublished blood-volume-control parameter set (CA_user_volume_control
        ANS_CVS_BVC_parameters.csv, data_reference 'Peter_Hunter'; same value in ANS_CVS_BVolCtl_FA_MG_PH_v2.cellml); no publication
        found that reports it; a Na binding affinity of 1 L/mol (K_d = 1 M) is far weaker than NKE affinities in the literature
        (intracellular Na K_d of order 10 mM); treat as a lumped, non-physiological constant
      sourced: 'no'
      value: 1
    K_K:
      reference: unreferenced_placeholder; 1 L/mol from P. Hunter's unpublished blood-volume-control parameter set (CA_user_volume_control
        ANS_CVS_BVC_parameters.csv, data_reference 'Peter_Hunter'; same value in ANS_CVS_BVolCtl_FA_MG_PH_v2.cellml); no publication
        found that reports it; lumped K binding affinity (K_d = 1 M); see K_Na
      sourced: 'no'
      value: 1
  notes: 'Gut lumen + epithelium of the blood-volume-control system (bond-graph style, litre/kPa/mol units): dq_gi_W/dt =
    v_giIn_W - v_gi_W - v_giOut_W with osmotic water flux v_gi_W = k_gi_W RT (c_vc - c_gi); dq_gi_Na/dt = v_giIn_Na - v_gi_Na
    - v_giOut_Na with v_gi_Na = kK_gi_Na (q_gi_Na - q_giEpi_Na); dq_giEpi_Na/dt = v_gi_Na - v_giEpi_NKE with a simplified
    Na/K-ATPase flux to the blood. Blood-side Na and volume (q_vc_Na from BVC_Na_circ, q_vc_W from the intestinal capillary)
    are BCs, so it runs alone. Totals are conserved exactly: water gains only v_giIn_W - v_giOut_W - v_gi_W, lumen+epithelium
    Na only v_giIn_Na - v_giOut_Na - v_giEpi_NKE.'
review:
  summary: 'Gut (GI) compartment of the blood-volume-control (BVC) system: lumen water and Na (q_gi_W, q_gi_Na) and epithelial
    Na (q_giEpi_Na); osmotic water exchange with blood (v_gi_W), lumen-to-epithelium Na transfer (v_gi_Na) and a simplified
    Na/K-ATPase (NKE) flux to the blood (v_giEpi_NKE, exported to BVC_Na_circ). All 20 parameters were TODO; values proposed
    from P. Hunter''s unpublished BVC parameter set (the source of these modules). It runs alone (q_vc_Na, q_vc_W are BCs).
    Verification: exact water and Na balances, all constitutive laws incl. the NKE closed form, positivity, and the analytic
    steady state (lumen isotonic with blood, NKE equilibrium) - all pass, as do the 90-run BC sweep, RK4 timestep convergence
    and the CVODE solver matrix. Main open points are physical (NKE law, amount-difference Na exchange, K values), not numerical.'
  comment: The NKE law has no ATP term and its electrical factor exp(2Fu/RT) looks sign/valence-inverted for a 3Na:2K pump
    with u = -40 mV; it only pumps Na "outwards" because blood K (q_vc_K = 0.03 mol, about 380 mM) is set above epithelial
    K (24 mM). Na exchange uses amount differences (q_gi_Na - q_giEpi_Na), so steady state equalises amounts not concentrations.
    All values are an unpublished toy parameter set (0.028 L lumen, K_Na = K_K = 1 L/mol); at steady state net absorption
    is zero with the proposed balanced in/outflows. The water/Na balance invariants are checked with a trapezoid integral
    of the logged fluxes, so their tolerance includes a dt*max|v| quadrature term.
  questions:
  - All values are proposed from P. Hunter's unpublished parameter set (CA_user_volume_control/ANS_CVS_BVC_parameters.csv,
    data_reference "Peter_Hunter", same values in ANS_CVS_BVolCtl_FA_MG_PH_v2.cellml; the modules were added to circulatory_autogen
    by M. H. Shafieizadegan). I found no publication giving these values (the related bioRxiv preprint Hunter et al. 2026,
    "The biophysical basis of enterocyte homeostasis", doi 10.64898/2026.01.28.702213, is cellular and does not contain them),
    so they are marked unreferenced_placeholder. Is there a report/thesis to cite, or should they stay placeholders?
  - RT = 2500 J/mol (T = 300.7 K) is the source value; keep it, or use body temperature (2578.8 J/mol at 310.15 K)? F is proposed
    as the exact CODATA value 96485.33212 C/mol (the source used 0.965e5).
  - 'NKE law (all four modules share it): 3 k (A^3 B^2 - C^3 D^2 exp(2 F u/RT))/((1+A^3)(1+B^2)(1+C^3)(1+D^2)). (a) It has
    no ATP-hydrolysis term, so it is a gradient-driven exchanger, not a pump: in the source parameters it moves Na out of
    the epithelium only because blood-side K (q_vc_K/q_vc_W = 0.3-0.4 M) is set far above epithelial K (24 mM), the reverse
    of physiology (plasma about 4-5 mM, cells about 140 mM); with physiological K it would run backwards. (b) The electrical
    factor: one pump cycle moves net +1 charge out, so with u = psi_in - psi_out = -40 mV the reverse term would normally
    carry exp(-F u/RT) (= 4.7), not exp(+2 F u/RT) (= 0.046). Is this a deliberate simplification (and which sign convention
    does u_*Epi_e use), or should the law be corrected (e.g. to the bond-graph NKE of the Hunter group) before these modules
    are used?'
  - 'Na exchange laws use amount differences, not concentrations: v_gi_Na = kK (q_gi_Na - q_giEpi_Na), v_pt_Na = kK (q_pt_Na
    - q_ptEpi_Na), v_gl_Na = kK (q_vc_Na - q_pt_Na). At steady state this equalises amounts, not concentrations (gut lumen
    146 mM vs epithelium 8 mM because the volumes are 0.028 vs 0.5 L), and glomerular Na filtration is not tied to the filtered
    water (a convective v_gl_W c_vc_Na would be expected). Intended?'
  - 'In a network, c_vc_Na = q_vc_Na/q_vc_W divides the whole-circulation Na (BVC_Na_circ) by the volume of the LOCAL capillary
    that supplies osmotic_vol_port (intestinal or peritubular), so the GI and each kidney see different blood Na concentrations
    (source values: 146 mM at the gut, 55 mM at the kidneys for the same q_vc_Na). Should q_vc_W be the circulating (plasma)
    volume instead?'
  - 'v_giIn_Na: the CA_user_volume_control csv has 0 but the full CellML (ANS_CVS_BVolCtl_FA_MG_PH_v2) uses v_giIn_Na0 = 1.16e-6
    mol/s; I proposed 1.16e-6 (balances v_giOut_Na = 1.16e-6, so there is a steady state). Which is intended? Note that with
    in = out the gut contributes no net Na to the body at steady state.'
  - q_vc_K and q_giEpi_K are fixed constants (K is not tracked); q_vc_K = 0.03 mol gives 380 mM in the 0.079 L intestinal
    capillary. Confirm these, or should blood and epithelial K be swapped / made physiological?
  - 'Validation: pending (no data mapping onto this toy compartment). Accept pending, or suggest a data set (e.g. intestinal
    perfusion Na/water absorption)?'
  proposed_fixes: []
  findings:
  - 'With the proposed values the component relaxes (about 4 s) to an exact steady state: c_gi_Na = q_vc_Na/q_vc_W = 146 mM,
    q_gi_Na = q_giEpi_Na, v_giEpi_NKE = 0 (NKE thermodynamic equilibrium, c_giEpi = 8.26 mM), checked analytically.'
  - 'Initial transient is fast: v_giEpi_NKE starts at -0.021 mol/s (Na flows from blood INTO the epithelium) because the initial
    state is far from NKE equilibrium; relaxation rates up to about 100 /s at the top of the swept rate-constant ranges (CVODE
    handles it; RK4 converges at dt <= 4 ms).'
  - The water/Na balance invariants use a trapezoid integral of the output fluxes (no built-in cumulative-integral helper);
    tolerance 1e-5 relative plus dt max|v|/10.
  - 'Joint failure risk (512 samples): P(fail) = 0.018 [0.009, 0.033]; weakly attributed (K_Na, k_giEpi_NKE, q_vc_W), consistent
    with joint draws that make the initial NKE/osmotic transient much faster than the 1 ms output step so the trapezoid-integrated
    balance invariants exceed their tolerance, rather than a solver failure. Single-parameter sweeps all pass.'
