module_type: thermal_volume
version: ArgusUNPUBLISHED_v01
reviewed: false
notes: 'The thermal counterpart of tissue_diffusion_volume: one well-mixed finite volume of heat capacity C_th = rho c_p V_th,
  dT/dt = (Q_in + Q_out + Q_src)/C_th. Q_in and Q_out are the summed heat flows of the heat_conduction_faces on its entrance
  and exit heat_face_ports (0 when none); Q_src is the heat released inside it (energy_metabolism Q_met through the heat_source_port).
  Only in-plane faces carry heat in AdaptOrDeity; the top and bottom of a 2D sheet are insulated.'
