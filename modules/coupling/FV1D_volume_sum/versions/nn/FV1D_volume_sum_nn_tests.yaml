module_type: FV1D_volume_sum
version: nn
reviewed: true
notes: Placeholder that receives the total volume q_sum of a 1D (C++ finite-volume) model. It has no equations. Its exit
  volume_port maps q_sum, so a volume_sum connected to it adds q_sum as a term of its multi_port sum. Alone it only holds q_sum.
known_issues:
- 'FV1D_volume_sum: a 1D model with a volume sum does not generate: libcuflynx''s C++ generator stops with KeyError
  ''bc_inlet0_or_outlet1'' on the volume-sum external variable (circulatory_autogen #609).'
expected_failures:
  cuflynx_simulate_test: placeholder with no equations (it only holds q_sum for a C++ 1D model), so CUFLynx has nothing to
    simulate and returns no outputs
