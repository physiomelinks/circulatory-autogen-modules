module_type: FV1D_vessel
version: vv
reviewed: true
notes: 'Marks a vessel as part of the C++ 1D finite-volume (Muller) solver: no CellML equations and no port variables of its
  own. libcuflynx generates the 0D model coupled to it through the C++ 0D-1D path (model_type cpp, couple_to_1d). Test network:
  flow inlet -> 0D vessel -> 1D vessel (mod) -> 0D terminal -> pressure outlet. run_test generates it from this library and
  compiles the generated model0d.cc; the simulation tests are not applicable because the 1D solver it couples to is not runnable
  here (libcuflynx solver1d is in development and circulatory_autogen itself only tests generation).'
known_issues:
- circulatory_autogen's 0D_1D_coupling_test network names a vessel 0D_vessel, not a valid CellML name (starts with a digit);
  the harness here uses vessel0d.
expected_failures:
  run_test: 'no valid network found yet: a 1D vessel between two 0D vessels (flow inlet -> 0D vp -> FV1D vv -> terminal pp ->
    pressure outlet). With circulatory_autogen #520 generation now stops earlier, in libcuflynx''s port-kind check: it reads
    a version''s first two letters as its port kinds and only skips names starting nn, so the outlet boundary ''constant'' (named
    nn_constant before the 2026-10-06 restructure) fails it ("term output BC is p, the input BC of p_out should be v"); before
    #520 libCellML did not analyse the generated model as an ODE.'
