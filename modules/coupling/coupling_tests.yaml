module: coupling
reviewed: true
known_issues: ['FV1D_volume_sum: its volume_ports list no variables, so it can''t be connected from CellML and only holds
    q_sum.', 'circulatory_autogen''s 0D_1D_coupling_test network names a vessel 0D_vessel, not a valid CellML name (starts
    with a digit); the harness here uses vessel0d.']
defaults:
  sim_time: 2.0
  pre_time: 0.0
  dt: 0.001
  solver: CVODE_myokit
  bc_sweep:
    factors: [0.5, 0.75, 1.0, 1.5, 2.0]
    ranges: {}
  timestep:
    scheme: rk4
    dts: [0.004, 0.002, 0.001, 0.0005]
    min_order: 0.8
    tol: 0.0001
    cvode_tol: 0.001
  stability:
    supported:
    - {solver: CVODE_myokit, rtol: 1.0e-06, atol: 1.0e-08}
components:
- vessel_type: coupler
  BC_type: pv_0D_1D
  module_type: pv_0D_1D_coupler_type
  outputs: [q_star, P_s_star, flux, vessel0d/u, vessel0d/v, imposter1d/P_t_star, imposter1d/A_star]
  harness:
    vessel_array:
    - [pressure_in, nn_constant, inlet_pressure, '', vessel0d]
    - [vessel0d, pv, arterial_simple, pressure_in, mod]
    - [mod, pv_0D_1D, coupler, vessel0d, imposter1d]
    - [imposter1d, nn, imposter_1D, mod, '']
    parameters:
    - [P_pressure_in, J_per_m3, 2000, harness test value (circulatory_autogen 0D_1D_coupling_test)]
    - [R_vessel0d, Js_per_m6, 10000000.0, harness test value (large-artery order; chosen so R/I and 1/sqrt(IC) are non-stiff)]
    - [C_vessel0d, m6_per_J, 1.0e-08, harness test value (circulatory_autogen 0D_1D_coupling_test)]
    - [I_vessel0d, Js2_per_m6, 100000.0, 'harness test value (rho l / A for a ~5 cm, r ~1.25 cm segment)']
    - [q_0_vessel0d, m3, 0, 'harness: zero unstressed volume']
    - [u_0_vessel0d, J_per_m3, 0, 'harness: zero reference pressure']
    - [u_ext_vessel0d, J_per_m3, 0, 'harness: zero external pressure']
    - [P_t_star_imposter1d, J_per_m3, 1000, harness test value (circulatory_autogen 0D_1D_coupling_test)]
    - [A_star_imposter1d, m2, 0.001, 'harness test value (circulatory_autogen 0D_1D_coupling_test); an area of 10 cm^2']
  invariants:
  - {description: 'static pressure at the interface is total minus dynamic pressure, P_s* = P_t* − ½ρ(q*/A*)²', expr: 'np.max(np.abs(P_s_star
      - (imposter1d__P_t_star - 0.5*rho*(q_star/imposter1d__A_star)**2))) <= 1e-9*max(1.0, np.max(np.abs(imposter1d__P_t_star)))'}
  - {description: 'flux is the time integral of ρ q* (trapezoidal integral of the output, relative error < 1e-3)', expr: 'np.max(np.abs(flux
      - np.concatenate(([0.0], np.cumsum(0.5*(rho*q_star[1:] + rho*q_star[:-1])*np.diff(t)))))) <= 1e-3*max(1e-30, np.max(np.abs(flux)))'}
  - {description: 'steady state: q* satisfies the analytic balance R q* = P_in − P_t* + ½ρ(q*/A*)² of the harness (P_in =
      2000 Pa, R = 1e7 Pa s m^-3), residual < 0.1% of P_in', expr: 'abs(1e7*q_star[-1] - (2000.0 - imposter1d__P_t_star[-1]
      + 0.5*rho*(q_star[-1]/imposter1d__A_star[-1])**2)) <= 2.0'}
  - {description: 'steady state: q* equals the closed-form root q = (R − sqrt(R² − 2kΔP))/k, k = ρ/A*², ΔP = P_in − P_t* (0.1%)',
    expr: 'abs(q_star[-1] - (1e7 - np.sqrt(1e14 - 2*(rho/imposter1d__A_star[-1]**2)*(2000.0 - imposter1d__P_t_star[-1])))/(rho/imposter1d__A_star[-1]**2))
      <= 1e-3*abs((1e7 - np.sqrt(1e14 - 2*(rho/imposter1d__A_star[-1]**2)*(2000.0 - imposter1d__P_t_star[-1])))/(rho/imposter1d__A_star[-1]**2))'}
  - {description: 'momentum balance at steady state: interface static pressure equals the 0D pressure (P_s_0D − P_s* → 0,
      < 0.1 Pa)', expr: 'abs(vessel0d__u[-1] - P_s_star[-1]) <= 0.1'}
  - {description: 'flow into the coupler equals flow out of the 0D vessel at steady state (inflow v of vessel0d = q*, 0.1%)',
    expr: 'abs(vessel0d__v[-1] - q_star[-1]) <= 1e-3*abs(q_star[-1])'}
  bc_sweep:
    ranges:
      I: {min: 20000.0, max: 500000.0, points: 5, scale: log}
      rho: {min: 1040.0, max: 1060.0, points: 3}
    rationale: I spans rho l / (pi r^2) for interface segments of about 1-10 cm with radii 0.8-1.5 cm (2e4-5e5 Pa s^2 m^-6);
      below ~1e4 the coupler becomes stiff relative to the harness dynamics. rho spans the usual whole-blood density range
      1040-1060 kg m^-3.
  timestep: {t_end: 2.0}
  notes: '0D-1D coupler: receives the 0D vessel''s static pressure P_s_0D and returns the interface flow q*; receives the
    1D side''s total pressure P_t* and area A* (m2) and returns flux, the mass accumulated through the interface (kg). Static
    pressure at the interface P_s* = P_t* − ½ρ(q*/A*)² (Bernoulli); flow driven through a lumped interface inertance I: dq*/dt
    = (P_s_0D − P_s*)/I; flux = ∫ρq* dt. Reviewed 2026-09-29: momentum sign fixed (was (P_s* − P_s_0D)/I, which diverges),
    A_star declared in m2 (was m3) and flux in kg (was m3_per_s). Tested in a harness: constant pressure inlet (2000 Pa) →
    BG arterial_simple pv vessel (R 1e7, C 1e-8, I 1e5) → coupler → imposter_1D (P_t* = 1000 Pa, A* = 1e-3 m2); R and I differ
    from circulatory_autogen''s 0D_1D_coupling_test (R 1e8, I 1e-6: L/R = 1e-14 s, too stiff for the fixed-step test).'
  validation:
    baseline: {status: not_applicable, reason: numerical interface between a 0D and a 1D model with no physiological counterpart
        of its own; verified against the analytic steady state of the harness. Validation belongs to a coupled 0D-1D model.}
    calibrate: {status: not_applicable, reason: numerical interface component; nothing to calibrate against data on its own.}
- vessel_type: imposter_1D
  BC_type: nn
  module_type: imposter_1D
  outputs: [P_t_star, A_star, coupler/flux, coupler/q_star]
  harness:
    vessel_array:
    - [pressure_in, nn_constant, inlet_pressure, '', vessel0d]
    - [vessel0d, pv, arterial_simple, pressure_in, coupler]
    - [coupler, pv_0D_1D, coupler, vessel0d, mod]
    - [mod, nn, imposter_1D, coupler, '']
    parameters:
    - [P_pressure_in, J_per_m3, 2000, harness test value (circulatory_autogen 0D_1D_coupling_test)]
    - [R_vessel0d, Js_per_m6, 10000000.0, harness test value]
    - [C_vessel0d, m6_per_J, 1.0e-08, harness test value]
    - [I_vessel0d, Js2_per_m6, 100000.0, harness test value]
    - [q_0_vessel0d, m3, 0, 'harness: zero unstressed volume']
    - [u_0_vessel0d, J_per_m3, 0, 'harness: zero reference pressure']
    - [u_ext_vessel0d, J_per_m3, 0, 'harness: zero external pressure']
    - [I_coupler, Js2_per_m6, 100000.0, harness test value]
    - [rho, Js2_per_m5, 1050, harness test value]
  invariants:
  - {description: P_t* and A* are constant in time (passed through from the imposter's constants), expr: '(np.ptp(P_t_star)
      == 0) & (np.ptp(A_star) == 0) & (A_star[0] > 0)'}
  - {description: the flux the imposter receives is the time integral of ρ q* from the coupler (ρ = 1050 in the harness; relative
      error < 1e-3), expr: 'np.max(np.abs(coupler__flux - np.concatenate(([0.0], np.cumsum(0.5*1050*(coupler__q_star[1:] +
      coupler__q_star[:-1])*np.diff(t)))))) <= 1e-3*max(1e-30, np.max(np.abs(coupler__flux)))'}
  - {description: 'the coupler reaches the analytic steady state set by the imposter''s P_t* and A*: R q* = P_in − P_t* +
      ½ρ(q*/A*)² (R = 1e7, P_in = 2000 Pa, ρ = 1050; residual < 2 Pa)', expr: 'abs(1e7*coupler__q_star[-1] - (2000.0 - P_t_star[-1]
      + 0.5*1050*(coupler__q_star[-1]/A_star[-1])**2)) <= 2.0'}
  bc_sweep:
    ranges:
      P_t_star: {min: 0.0, max: 1500.0, points: 4}
      A_star: {min: 0.0004, max: 0.001, points: 4}
    rationale: P_t* between 0 and 1500 Pa keeps the harness inflow (P_in = 2000 Pa) forward; A* spans 4-10 cm^2 (aorta-size
      cross-sections). Below ~3 cm^2 the Bernoulli term ½ρ(q/A)² brings the second (unstable) steady-state root of R q − ½ρ(q/A)²
      = ΔP close enough that the start-up transient escapes (A* = 2 cm^2 fails even with the sign fixed) — a property of the
      harness, not the imposter.
  notes: 'Stand-in for a 1D model at a 0D-1D interface: exposes a constant total pressure P_t* and area A* and receives the
    accumulated flux. Tested as the downstream end of the coupler harness.'
  validation:
    baseline: {status: not_applicable, reason: test fixture (stand-in for a 1D model) with no physiological counterpart.}
    calibrate: {status: not_applicable, reason: test fixture with no physiological counterpart.}
- vessel_type: FV1D_vessel
  BC_type: vp
  module_type: Muller_1d
  outputs: []
  invariants: []
  skip: 'module_format cpp: not a CellML component, cannot be tested in isolation'
  validation:
    baseline: {status: not_applicable, reason: 'C++ 1D finite-volume solver, not a CellML component; validated with the solver
        itself.'}
    calibrate: {status: not_applicable, reason: 'C++ component, not testable here.'}
- vessel_type: FV1D_vessel
  BC_type: pv
  module_type: Muller_1d
  outputs: []
  invariants: []
  skip: 'module_format cpp: not a CellML component, cannot be tested in isolation'
  validation:
    baseline: {status: not_applicable, reason: 'C++ 1D finite-volume solver, not a CellML component; validated with the solver
        itself.'}
    calibrate: {status: not_applicable, reason: 'C++ component, not testable here.'}
- vessel_type: FV1D_vessel
  BC_type: vv
  module_type: Muller_1d
  outputs: []
  invariants: []
  skip: 'module_format cpp: not a CellML component, cannot be tested in isolation'
  validation:
    baseline: {status: not_applicable, reason: 'C++ 1D finite-volume solver, not a CellML component; validated with the solver
        itself.'}
    calibrate: {status: not_applicable, reason: 'C++ component, not testable here.'}
- vessel_type: FV1D_vessel
  BC_type: nn
  module_type: Muller_1d
  outputs: []
  invariants: []
  skip: 'module_format cpp: not a CellML component, cannot be tested in isolation'
  validation:
    baseline: {status: not_applicable, reason: 'C++ 1D finite-volume solver, not a CellML component; validated with the solver
        itself.'}
    calibrate: {status: not_applicable, reason: 'C++ component, not testable here.'}
- vessel_type: volume_sum
  BC_type: nn
  module_type: volume_sum
  outputs: [sum_blood_volume/q_mod_sum, va/q, vb/q, va/v, vb/v, flow_out_a/v, flow_out_b/v]
  harness:
    vessel_array:
    - [p_in_a, nn_constant, inlet_pressure, '', va]
    - [va, pv, arterial_simple, p_in_a, flow_out_a mod]
    - [flow_out_a, nn_constant, outlet_flow, va, '']
    - [p_in_b, nn_constant, inlet_pressure, '', vb]
    - [vb, pv, arterial_simple, p_in_b, flow_out_b mod]
    - [flow_out_b, nn_constant, outlet_flow, vb, '']
    - [mod, nn, volume_sum, va vb, '']
    parameters:
    - [P_p_in_a, J_per_m3, 2000, harness test value]
    - [v_flow_out_a, m3_per_s, 0.0001, harness test value]
    - [R_va, Js_per_m6, 10000000.0, harness test value]
    - [C_va, m6_per_J, 1.0e-08, harness test value]
    - [I_va, Js2_per_m6, 100000.0, harness test value]
    - [q_0_va, m3, 0, 'harness: zero unstressed volume']
    - [u_0_va, J_per_m3, 0, 'harness: zero reference pressure']
    - [u_ext_va, J_per_m3, 0, 'harness: zero external pressure']
    - [P_p_in_b, J_per_m3, 1500, harness test value]
    - [v_flow_out_b, m3_per_s, 2.0e-05, harness test value]
    - [R_vb, Js_per_m6, 10000000.0, harness test value]
    - [C_vb, m6_per_J, 1.0e-08, harness test value]
    - [I_vb, Js2_per_m6, 100000.0, harness test value]
    - [q_0_vb, m3, 0, 'harness: zero unstressed volume']
    - [u_0_vb, J_per_m3, 0, 'harness: zero reference pressure']
    - [u_ext_vb, J_per_m3, 0, 'harness: zero external pressure']
  invariants:
  - {description: 'the output is exactly the sum of the connected vessels'' volumes, Σq = q_va + q_vb', expr: 'np.max(np.abs(sum_blood_volume__q_mod_sum
      - (va__q + vb__q))) <= 1e-12*max(1e-30, np.max(np.abs(sum_blood_volume__q_mod_sum)))'}
  - {description: 'volume balance: Σq(t) − Σq(0) = ∫(inflows − outflows) dt over both vessels (trapezoidal, < 1e-3 of max
      Σq)', expr: 'np.max(np.abs((sum_blood_volume__q_mod_sum - sum_blood_volume__q_mod_sum[0]) - np.concatenate(([0.0], np.cumsum(0.5*((va__v
      + vb__v - flow_out_a__v - flow_out_b__v)[1:] + (va__v + vb__v - flow_out_a__v - flow_out_b__v)[:-1])*np.diff(t))))))
      <= 1e-3*np.max(np.abs(sum_blood_volume__q_mod_sum))'}
  - {description: 'steady state: Σq → C_a (P_in,a − R v_out,a) + C_b (P_in,b − R v_out,b) = 1e-8 (2000 − 1000) + 1e-8 (1500
      − 200) = 2.3e-5 m^3 (0.1%)', expr: 'abs(sum_blood_volume__q_mod_sum[-1] - 2.3e-5) <= 2.3e-8'}
  notes: Sums the volumes q of the vessels connected to it (volume_port, multi_port sum); used to track total blood volume.
    Tested with two independent BG arterial_simple pv vessels, each between a constant pressure inlet and a constant flow
    outlet, so their volumes change in time. The summed volume is created by libcuflynx in a generated component (sum_blood_volume.q_mod_sum),
    not as mod/q.
  validation:
    baseline: {status: not_applicable, reason: bookkeeping component (sum of volumes); verified exactly.}
    calibrate: {status: not_applicable, reason: bookkeeping component; nothing to calibrate.}
  bc_sweep:
    exclude: [q]
    rationale: 'Nothing of the component to sweep: q is supplied by the connected vessels (the sum is formed by libcuflynx).
      The harness vessels have different pressures and outflows so the summed volumes differ and change in time.'
- vessel_type: volume_sum_2
  BC_type: nn
  module_type: volume_sum_2
  outputs: [q_sum, va/q, vb/q, va/v, vb/v, flow_out_a/v, flow_out_b/v]
  harness:
    vessel_array:
    - [p_in_a, nn_constant, inlet_pressure, '', va]
    - [va, pv, arterial_simple, p_in_a, flow_out_a mod]
    - [flow_out_a, nn_constant, outlet_flow, va, '']
    - [p_in_b, nn_constant, inlet_pressure, '', vb]
    - [vb, pv, arterial_simple, p_in_b, flow_out_b mod]
    - [flow_out_b, nn_constant, outlet_flow, vb, '']
    - [mod, nn, volume_sum_2, va vb, '']
    parameters:
    - [P_p_in_a, J_per_m3, 2000, harness test value]
    - [v_flow_out_a, m3_per_s, 0.0001, harness test value]
    - [R_va, Js_per_m6, 10000000.0, harness test value]
    - [C_va, m6_per_J, 1.0e-08, harness test value]
    - [I_va, Js2_per_m6, 100000.0, harness test value]
    - [q_0_va, m3, 0, 'harness: zero unstressed volume']
    - [u_0_va, J_per_m3, 0, 'harness: zero reference pressure']
    - [u_ext_va, J_per_m3, 0, 'harness: zero external pressure']
    - [P_p_in_b, J_per_m3, 1500, harness test value]
    - [v_flow_out_b, m3_per_s, 2.0e-05, harness test value]
    - [R_vb, Js_per_m6, 10000000.0, harness test value]
    - [C_vb, m6_per_J, 1.0e-08, harness test value]
    - [I_vb, Js2_per_m6, 100000.0, harness test value]
    - [q_0_vb, m3, 0, 'harness: zero unstressed volume']
    - [u_0_vb, J_per_m3, 0, 'harness: zero reference pressure']
    - [u_ext_vb, J_per_m3, 0, 'harness: zero external pressure']
  invariants:
  - {description: 'the output is exactly the sum of the connected vessels'' volumes, Σq = q_va + q_vb', expr: 'np.max(np.abs(q_sum
      - (va__q + vb__q))) <= 1e-12*max(1e-30, np.max(np.abs(q_sum)))'}
  - {description: 'volume balance: Σq(t) − Σq(0) = ∫(inflows − outflows) dt over both vessels (trapezoidal, < 1e-3 of max
      Σq)', expr: 'np.max(np.abs((q_sum - q_sum[0]) - np.concatenate(([0.0], np.cumsum(0.5*((va__v + vb__v - flow_out_a__v
      - flow_out_b__v)[1:] + (va__v + vb__v - flow_out_a__v - flow_out_b__v)[:-1])*np.diff(t)))))) <= 1e-3*np.max(np.abs(q_sum))'}
  - {description: 'steady state: Σq → C_a (P_in,a − R v_out,a) + C_b (P_in,b − R v_out,b) = 1e-8 (2000 − 1000) + 1e-8 (1500
      − 200) = 2.3e-5 m^3 (0.1%)', expr: 'abs(q_sum[-1] - 2.3e-5) <= 2.3e-8'}
  notes: Like volume_sum, but also exposes the summed volume q_sum on an exit volume_port so another component can use it
    (q_sum = Σq). Tested with the same two-vessel harness as volume_sum; q is set by the connections (its csv value is only
    used when nothing is connected).
  validation:
    baseline: {status: not_applicable, reason: bookkeeping component (sum of volumes); verified exactly.}
    calibrate: {status: not_applicable, reason: bookkeeping component; nothing to calibrate.}
  bc_sweep:
    exclude: [q]
    rationale: 'Nothing of the component to sweep: q is supplied by the connected vessels (the sum is formed by libcuflynx).
      The harness vessels have different pressures and outflows so the summed volumes differ and change in time.'
- vessel_type: FV1D_volume_sum
  BC_type: nn
  module_type: volume_sum_1D
  outputs: [q_sum]
  invariants:
  - {description: 'unconnected, q_sum is the constant boundary value it is given', expr: np.ptp(q_sum) == 0}
  notes: Placeholder that receives the total volume q_sum of a 1D (C++ finite-volume) model; the volume_port has no variables
    in the config, so it cannot be connected from CellML and has no equations. Alone it only holds q_sum.
  bc_sweep:
    ranges:
      q_sum: {min: 0.0, max: 0.005, points: 3}
    rationale: from empty to a whole-body blood volume (0-5 L); the component only stores the value.
  validation:
    baseline: {status: not_applicable, reason: bookkeeping component; verified exactly.}
    calibrate: {status: not_applicable, reason: bookkeeping component; nothing to calibrate.}
