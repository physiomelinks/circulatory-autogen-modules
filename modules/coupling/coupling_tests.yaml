      Σq)', expr: 'np.max(np.abs((q_sum - q_sum[0]) - np.concatenate(([0.0], np.cumsum(0.5*((va__v + vb__v - flow_out_a__v
      - flow_out_b__v)[1:] + (va__v + vb__v - flow_out_a__v - flow_out_b__v)[:-1])*np.diff(t)))))) <= 1e-3*np.max(np.abs(q_sum))'}
  - {description: 'steady state: Σq → C_a (P_in,a − R v_out,a) + C_b (P_in,b − R v_out,b) = 1e-8 (2000 − 1000) + 1e-8 (1500
      − 200) = 2.3e-5 m^3 (0.1%)', expr: 'abs(q_sum[-1] - 2.3e-5) <= 2.3e-8'}
  notes: Like volume_sum, but also exposes the summed volume q_sum on an exit volume_port so another component can use it
    (q_sum = Σq). Tested with the same two-vessel harness as volume_sum; q is set by the connections (its csv value is only
    used when nothing is connected).
  reference_proposals:
    q: {reference: definitional; the connected vessels supply q; 0 (empty) when nothing is connected, sourced: definitional,
      value: 0}
  validation:
    baseline: {status: not_applicable, reason: bookkeeping component (sum of volumes); verified exactly.}
    calibrate: {status: not_applicable, reason: bookkeeping component; nothing to calibrate.}
  bc_sweep:
    exclude: [q]
    rationale: 'Nothing of the component to sweep: q is supplied by the connected vessels (the sum is formed by libcuflynx).
      The harness vessels have different pressures and outflows so the summed volumes differ and change in time.'
- vessel_type: FV1D_volume_sum
  BC_type: nn
  module_type: volume_sum_1D
  outputs: [q_sum]
  invariants:
  - {description: 'unconnected, q_sum is the constant boundary value it is given', expr: np.ptp(q_sum) == 0}
  notes: Placeholder that receives the total volume q_sum of a 1D (C++ finite-volume) model; the volume_port has no variables
    in the config, so it cannot be connected from CellML and has no equations. Alone it only holds q_sum.
  reference_proposals:
    q_sum: {reference: 'unreferenced_placeholder; placeholder total 1D-network volume (order of 5e-4 m^3 = 0.5 L for the large
        arteries), only so the component can be run', sourced: 'no', value: 0.0005}
  bc_sweep:
    ranges:
      q_sum: {min: 0.0, max: 0.005, points: 3}
    rationale: from empty to a whole-body blood volume (0-5 L); the component only stores the value.
  validation:
    baseline: {status: not_applicable, reason: bookkeeping component; verified exactly.}
    calibrate: {status: not_applicable, reason: bookkeeping component; nothing to calibrate.}
review:
  comment: 'coupler: the momentum equation dq*/dt = (P_s* − P_s_0D)/I has the wrong sign (the loop diverges; fixed sign converges
    to the analytic steady state). A_star is declared in m3 but is an area (P_s* = P_t* − ½ρ(q/A)² needs m2), and d(flux)/dt
    = ρ q* makes flux a mass (kg), not m3_per_s. The interface inertance I has no source (order-of-magnitude ρl/A proposed).
    FV1D (C++) components are untestable here and FV1D_volume_sum has empty ports.'
  summary: '0D-1D coupling helpers: the pv_0D_1D coupler (Bernoulli static/total pressure conversion plus a lumped interface
    inertance), the imposter_1D stand-in for a 1D model, volume sums, and four C++ FV1D vessel entries (skipped). Harness
    networks built for the coupler/imposter (pressure inlet → BG arterial_simple pv → coupler → imposter_1D, non-stiff R 1e7/C
    1e-8/I 1e5) and for volume_sum/volume_sum_2 (two independent pressure-inlet → vessel → flow-outlet chains summed). Invariants
    encode the correct behaviour: Bernoulli identity, flux = ∫ρq* dt, analytic steady state (closed-form root), momentum balance;
    exact sums, volume balance and analytic steady-state volume for the sums. volume sums and FV1D_volume_sum pass everything;
    coupler/imposter invariant and sweep tests fail because of the coupler sign bug (recorded as expected failures; a patched
    copy passes all tests).'
  questions: ['Approve the coupler momentum-sign fix (dq*/dt = (P_s_0D − P_s*)/I)? Evidence in expected_failures: diverges
      as written; the patched copy passes run/invariants/sweep/timestep/stability and matches the analytic steady state.',
    'Approve changing A_star to m2 (coupler, imposter_1D config, CellML and units file)? The imposter/test A_star value 1e-3
      would then be 10 cm^2.', 'flux: d(flux)/dt = ρ q* accumulates mass (kg) but is declared m3_per_s. Is flux meant to be
      the mass flow rate ρ q* (algebraic, kg/s), the accumulated mass (kg), or the accumulated volume ∫q* dt (m3)? What does
      the 1D solver read from it?', 'Coupler I (TODO): proposed 1e5 Pa s^2 m^-6 as an order-of-magnitude placeholder (ρ l/A
      for a 5 cm, r 1.25 cm segment). Is I meant to be the inertance of half the first 1D cell, or of the 0D vessel? A formula-based
      value would be better than a constant.', 'rho (global, TODO): proposed 1050 kg/m^3 (Trudnowski1974, 1050.6 at 37 C).
      OK? (CA test used 1040; vessel_properties proposes the same 1050.)', 'The CA test network 0D_1D_coupling_test names
      a vessel 0D_vessel, which is not a valid CellML name (cannot start with a digit); the harness here uses vessel0d. Rename
      it in circulatory_autogens resources?', 'The harness uses R 1e7 / I 1e5 instead of CAs R 1e8 / I 1e-6 (I/R = 1e-14 s
      is too stiff for the fixed-step RK4 test). OK?', 'FV1D_volume_sum has volume_ports with no variables, so it cannot be
      connected from CellML and only stores q_sum; is it still used (placeholder q_sum proposed 5e-4 m^3)?', 'volume_sum_2:
      its q (boundary_condition) needs a csv value even though it is always connected; proposed 0 (definitional).']
  proposed_fixes: ['coupler (pv_0D_1D_coupler_type): momentum equation sign — change dq*/dt = (P_s* − P_s_0D)/I to dq*/dt
      = (P_s_0D − P_s*)/I (flow from the 0D vessel towards the 1D interface accelerates when the 0D static pressure is higher).
      Evidence: see coupler expected_failures; patched copy passes all tests.', 'coupler and imposter_1D: declare A_star in
      m2 (CellML variables, config variables_and_units, coupling_parameters.csv units) and add <units name="m2"> to coupling_units.cellml.
      Needed for P_s* = P_t* − ½ρ(q*/A*)² to be dimensionally a pressure (the patched copy uses this).', 'coupler: make flux
      dimensionally consistent — either declare it in kg (accumulated mass, d(flux)/dt = ρ q*) or change the equation to match
      m3_per_s (e.g. flux = q*, or d(flux)/dt = q* with units m3). Needs the owners intent.']
  findings: ['Connected inputs are not addressable as mod/<var> in the generated model (they are mapped onto the source component),
      so outputs refer to neighbours: P_s_0D is vessel0d/u, P_t*/A* are imposter1d/..., and the volume_sum total is libcuflynxs
      generated sum_blood_volume/q_mod_sum.', 'With the sign fixed, the harness loop is well posed only while the Bernoulli
      term is small: for A* <= ~2-3 cm^2 at ΔP = 1000 Pa the start-up transient reaches the second, unstable root of R q −
      ½ρ(q/A)² = ΔP and the simulation fails.', 'FV1D_vessel (C++, 4 entries) are skipped; FV1D_volume_sum only stores its
      q_sum (no equations, empty ports).', 'The coupler timestep and stability tests pass even as written: the divergence
      is a smooth exponential, reproduced consistently by RK4 and CVODE.', 'Risk (512 Sobol samples): coupler P(fail) = 1.0
      and imposter_1D 0.94 (the coupler sign bug; imposter failures concentrate at small A* and high P_t*); FV1D_volume_sum
      0; volume sums have no parameters to sample.']
