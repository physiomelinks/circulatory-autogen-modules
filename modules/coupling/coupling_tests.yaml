    calibrate: {status: not_applicable, reason: 'C++ component, not testable here.'}
  harness:
    vessel_array:
    - [p_in, nn_constant, inlet_pressure, '', ves]
    - [ves, pv, arterial_simple, p_in, mod]
    - [mod, pv, FV1D_vessel, ves, '']
    parameters:
    - [P_p_in, J_per_m3, 12399.0, library default (module parameters)]
    - [q_0_ves, m3, 6.94e-06, library default (module parameters)]
    - [R_ves, Js_per_m6, 10664000.0, library default (module parameters)]
    - [C_ves, m6_per_J, 3.09077e-08, library default (module parameters)]
    - [u_ext_ves, J_per_m3, 0.0, library default (module parameters)]
    - [u_0_ves, J_per_m3, 0.0, library default (module parameters)]
    - [u_in_ves, J_per_m3, 13332.2, library default (module parameters)]
    - [v_out_ves, m3_per_s, 0.0001, library default (module parameters)]
    - [I_ves, Js2_per_m6, 100000.0, library default (module parameters)]
  notes: 'Marks a vessel as part of the C++ 1D finite-volume (Muller) solver: no CellML equations and no port variables of
    its own. libcuflynx generates the 0D model coupled to it through the C++ 0D-1D path (model_type cpp, couple_to_1d). Test
    network: pressure inlet -> 0D arterial vessel -> 1D vessel (mod): the 0D vessel supplies the 1D inlet. run_test generates
    it from this library and compiles the generated model0d.cc; the simulation tests are not applicable because the 1D solver
