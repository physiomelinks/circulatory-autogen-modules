module: coupling
reviewed: false
known_issues: []
defaults:
  sim_time: 2.0
  pre_time: 0.0
  dt: 0.001
  solver: CVODE_myokit
  bc_sweep:
    factors: [0.5, 0.75, 1.0, 1.5, 2.0]
    ranges: {}
  timestep:
    scheme: rk4
    dts: [0.004, 0.002, 0.001, 0.0005]
    min_order: 0.8
    tol: 0.0001
    cvode_tol: 0.001
  stability:
    supported:
    - {solver: CVODE_myokit, rtol: 1.0e-06, atol: 1.0e-08}
components:
- vessel_type: coupler
  BC_type: pv_0D_1D
  module_type: pv_0D_1D_coupler_type
  outputs: [q_star, P_s_star, flux, vessel0d/u, vessel0d/v, imposter1d/P_t_star, imposter1d/A_star]
  harness:
    vessel_array:
    - [pressure_in, nn_constant, inlet_pressure, '', vessel0d]
    - [vessel0d, pv, arterial_simple, pressure_in, mod]
    - [mod, pv_0D_1D, coupler, vessel0d, imposter1d]
    - [imposter1d, nn, imposter_1D, mod, '']
    parameters:
    - [P_pressure_in, J_per_m3, 2000, harness test value (circulatory_autogen 0D_1D_coupling_test)]
    - [R_vessel0d, Js_per_m6, 10000000.0, harness test value (large-artery order; chosen so R/I and 1/sqrt(IC) are non-stiff)]
    - [C_vessel0d, m6_per_J, 1.0e-08, harness test value (circulatory_autogen 0D_1D_coupling_test)]
    - [I_vessel0d, Js2_per_m6, 100000.0, 'harness test value (rho l / A for a ~5 cm, r ~1.25 cm segment)']
    - [q_0_vessel0d, m3, 0, 'harness: zero unstressed volume']
    - [u_0_vessel0d, J_per_m3, 0, 'harness: zero reference pressure']
    - [u_ext_vessel0d, J_per_m3, 0, 'harness: zero external pressure']
    - [P_t_star_imposter1d, J_per_m3, 1000, harness test value (circulatory_autogen 0D_1D_coupling_test)]
    - [A_star_imposter1d, m3, 0.001, 'harness test value (circulatory_autogen 0D_1D_coupling_test); an area of 10 cm^2 (declared
        m3, see review)']
  invariants:
  - {description: 'static pressure at the interface is total minus dynamic pressure, P_s* = P_t* − ½ρ(q*/A*)²', expr: 'np.max(np.abs(P_s_star
      - (imposter1d__P_t_star - 0.5*rho*(q_star/imposter1d__A_star)**2))) <= 1e-9*max(1.0, np.max(np.abs(imposter1d__P_t_star)))'}
  - {description: 'flux is the time integral of ρ q* (trapezoidal integral of the output, relative error < 1e-3)', expr: 'np.max(np.abs(flux
      - np.concatenate(([0.0], np.cumsum(0.5*(rho*q_star[1:] + rho*q_star[:-1])*np.diff(t)))))) <= 1e-3*max(1e-30, np.max(np.abs(flux)))'}
  - {description: 'steady state: q* satisfies the analytic balance R q* = P_in − P_t* + ½ρ(q*/A*)² of the harness (P_in =
      2000 Pa, R = 1e7 Pa s m^-3), residual < 0.1% of P_in', expr: 'abs(1e7*q_star[-1] - (2000.0 - imposter1d__P_t_star[-1]
      + 0.5*rho*(q_star[-1]/imposter1d__A_star[-1])**2)) <= 2.0'}
  - {description: 'steady state: q* equals the closed-form root q = (R − sqrt(R² − 2kΔP))/k, k = ρ/A*², ΔP = P_in − P_t* (0.1%)',
    expr: 'abs(q_star[-1] - (1e7 - np.sqrt(1e14 - 2*(rho/imposter1d__A_star[-1]**2)*(2000.0 - imposter1d__P_t_star[-1])))/(rho/imposter1d__A_star[-1]**2))
      <= 1e-3*abs((1e7 - np.sqrt(1e14 - 2*(rho/imposter1d__A_star[-1]**2)*(2000.0 - imposter1d__P_t_star[-1])))/(rho/imposter1d__A_star[-1]**2))'}
  - {description: 'momentum balance at steady state: interface static pressure equals the 0D pressure (P_s_0D − P_s* → 0,
      < 0.1 Pa)', expr: 'abs(vessel0d__u[-1] - P_s_star[-1]) <= 0.1'}
  - {description: 'flow into the coupler equals flow out of the 0D vessel at steady state (inflow v of vessel0d = q*, 0.1%)',
    expr: 'abs(vessel0d__v[-1] - q_star[-1]) <= 1e-3*abs(q_star[-1])'}
  bc_sweep:
    ranges:
      I: {min: 20000.0, max: 500000.0, points: 5, scale: log}
      rho: {min: 1040.0, max: 1060.0, points: 3}
    rationale: I spans rho l / (pi r^2) for interface segments of about 1-10 cm with radii 0.8-1.5 cm (2e4-5e5 Pa s^2 m^-6);
      below ~1e4 the coupler becomes stiff relative to the harness dynamics. rho spans the usual whole-blood density range
      1040-1060 kg m^-3.
  timestep: {t_end: 2.0}
  notes: '0D-1D coupler: receives the 0D vessel''s static pressure P_s_0D and returns the interface flow q*, receives the
    1D side''s total pressure P_t* and area A* and returns the accumulated flux. Static pressure at the interface P_s* = P_t*
    − ½ρ(q*/A*)² (Bernoulli), interface flow driven through a lumped inertance I, and flux = ∫ρq* dt (a mass). Tested in a
    harness: constant pressure inlet (2000 Pa) → BG arterial_simple pv vessel (R 1e7, C 1e-8, I 1e5) → coupler → imposter_1D
    (constant P_t* = 1000 Pa, A* = 1e-3). With the momentum equation written as in the CellML (dq*/dt = (P_s* − P_s_0D)/I)
    the loop is unstable; the correct behaviour (analytic steady state) is encoded in the invariants. The harness R and I
    differ from circulatory_autogen''s 0D_1D_coupling_test (R 1e8, I 1e-6, which is 1e-14 s L/R and too stiff for the fixed-step
    test).'
  reference_proposals:
    I: {reference: 'unreferenced_placeholder; lumped interface inertance rho l / (pi r^2) for l ~ 5 cm, r ~ 1.25 cm (1050
        x 0.05 / 4.9e-4 = 1.07e5 Pa s^2 m^-6); order-of-magnitude only', sourced: 'no', value: 100000.0}
    rho: {reference: 'Trudnowski1974; whole-blood specific gravity 1.0506 at 37 C (n = 25), i.e. 1050.6 kg/m^3 (abstract values
        read via a search rendering; full text not read). circulatory_autogens 0D_1D_coupling_test used 1040', sourced: 'yes',
      value: 1050}
  validation:
    baseline: {status: not_applicable, reason: numerical interface between a 0D and a 1D model with no physiological counterpart
        of its own; verified against the analytic steady state of the harness. Validation belongs to a coupled 0D-1D model.}
    calibrate: {status: not_applicable, reason: numerical interface component; nothing to calibrate against data on its own.}
  expected_failures: {verification_test_invariants: 'Known issue (momentum-equation sign). Simulated as written the coupler
      loop diverges: with the harness (P_in 2000 Pa, R 1e7, C 1e-8, I 1e5; P_t* 1000 Pa, A* 1e-3) q* reaches 1.9e-2 m^3/s
      and P_s* −1.9e5 Pa at t = 2 s (circulatory_autogens own test network: P_s* → −1.9e7 Pa after 10 s), because dq*/dt =
      (P_s* − P_s_0D)/I accelerates flow towards the higher pressure. In a patched copy with dq*/dt = (P_s_0D − P_s*)/I (and
      A* in m2) all coupler tests pass: q* = 1.00502e-4 m^3/s, P_s* = 994.70 Pa, matching the analytic steady state R q =
      ΔP + ½ρ(q/A)² (analytic root 1.00531e-4 m^3/s and P_s* = 994.69 Pa with the dynamic-pressure term, 1e-4 without; 0.03%
      apart at t = 2 s); CAs network gives q* = 1.00005e-5, P_s* = 999.95 Pa vs analytic 1e-5.', verification_test_BC: 'Known
      issue (momentum-equation sign): every sweep run diverges and violates the steady-state invariants. Simulated as written
      the coupler loop diverges: with the harness (P_in 2000 Pa, R 1e7, C 1e-8, I 1e5; P_t* 1000 Pa, A* 1e-3) q* reaches 1.9e-2
      m^3/s and P_s* −1.9e5 Pa at t = 2 s (circulatory_autogens own test network: P_s* → −1.9e7 Pa after 10 s), because dq*/dt
      = (P_s* − P_s_0D)/I accelerates flow towards the higher pressure. In a patched copy with dq*/dt = (P_s_0D − P_s*)/I
      (and A* in m2) all coupler tests pass: q* = 1.00502e-4 m^3/s, P_s* = 994.70 Pa, matching the analytic steady state R
      q = ΔP + ½ρ(q/A)² (analytic root 1.00531e-4 m^3/s and P_s* = 994.69 Pa with the dynamic-pressure term, 1e-4 without;
      0.03% apart at t = 2 s); CAs network gives q* = 1.00005e-5, P_s* = 999.95 Pa vs analytic 1e-5.'}
- vessel_type: imposter_1D
  BC_type: nn
  module_type: imposter_1D
  outputs: [P_t_star, A_star, coupler/flux, coupler/q_star]
  harness:
    vessel_array:
    - [pressure_in, nn_constant, inlet_pressure, '', vessel0d]
    - [vessel0d, pv, arterial_simple, pressure_in, coupler]
    - [coupler, pv_0D_1D, coupler, vessel0d, mod]
    - [mod, nn, imposter_1D, coupler, '']
    parameters:
    - [P_pressure_in, J_per_m3, 2000, harness test value (circulatory_autogen 0D_1D_coupling_test)]
    - [R_vessel0d, Js_per_m6, 10000000.0, harness test value]
    - [C_vessel0d, m6_per_J, 1.0e-08, harness test value]
    - [I_vessel0d, Js2_per_m6, 100000.0, harness test value]
    - [q_0_vessel0d, m3, 0, 'harness: zero unstressed volume']
    - [u_0_vessel0d, J_per_m3, 0, 'harness: zero reference pressure']
    - [u_ext_vessel0d, J_per_m3, 0, 'harness: zero external pressure']
    - [I_coupler, Js2_per_m6, 100000.0, harness test value]
    - [rho, Js2_per_m5, 1050, harness test value]
  invariants:
  - {description: P_t* and A* are constant in time (passed through from the imposter's constants), expr: '(np.ptp(P_t_star)
      == 0) & (np.ptp(A_star) == 0) & (A_star[0] > 0)'}
  - {description: the flux the imposter receives is the time integral of ρ q* from the coupler (ρ = 1050 in the harness; relative
      error < 1e-3), expr: 'np.max(np.abs(coupler__flux - np.concatenate(([0.0], np.cumsum(0.5*1050*(coupler__q_star[1:] +
      coupler__q_star[:-1])*np.diff(t)))))) <= 1e-3*max(1e-30, np.max(np.abs(coupler__flux)))'}
  - {description: 'the coupler reaches the analytic steady state set by the imposter''s P_t* and A*: R q* = P_in − P_t* +
      ½ρ(q*/A*)² (R = 1e7, P_in = 2000 Pa, ρ = 1050; residual < 2 Pa)', expr: 'abs(1e7*coupler__q_star[-1] - (2000.0 - P_t_star[-1]
      + 0.5*1050*(coupler__q_star[-1]/A_star[-1])**2)) <= 2.0'}
  bc_sweep:
    ranges:
      P_t_star: {min: 0.0, max: 1500.0, points: 4}
      A_star: {min: 0.0004, max: 0.001, points: 4}
    rationale: P_t* between 0 and 1500 Pa keeps the harness inflow (P_in = 2000 Pa) forward; A* spans 4-10 cm^2 (aorta-size
      cross-sections). Below ~3 cm^2 the Bernoulli term ½ρ(q/A)² brings the second (unstable) steady-state root of R q − ½ρ(q/A)²
      = ΔP close enough that the start-up transient escapes (A* = 2 cm^2 fails even with the sign fixed) — a property of the
      harness, not the imposter.
  notes: 'Stand-in for a 1D model at a 0D-1D interface: exposes a constant total pressure P_t* and area A* and receives the
    accumulated flux. Tested as the downstream end of the coupler harness.'
  reference_proposals:
    P_t_star: {reference: circulatory_autogen; test value from the 0D_1D_coupling_test example (1000 Pa); in use P_t* comes
        from the 1D model, sourced: 'no', value: 1000}
    A_star: {reference: 'circulatory_autogen; test value from the 0D_1D_coupling_test example (1e-3 = an area of 10 cm^2,
        declared in m3; see proposed fix); in use A* comes from the 1D model', sourced: 'no', value: 0.001}
  validation:
    baseline: {status: not_applicable, reason: test fixture (stand-in for a 1D model) with no physiological counterpart.}
    calibrate: {status: not_applicable, reason: test fixture with no physiological counterpart.}
  expected_failures: {verification_test_invariants: 'Not an imposter defect: its harness contains the coupler, whose momentum-equation
      sign makes the loop diverge, so the coupler never reaches the steady state set by the imposters P_t*, A*. Passes in
      the patched copy (coupler sign fixed).', verification_test_BC: 'Not an imposter defect: the coupler in its harness diverges
      (momentum-equation sign; CVODE also fails on some runs). In the patched copy all 8 runs pass for P_t* 0-1500 Pa and
      A* 4-10 cm^2.'}
