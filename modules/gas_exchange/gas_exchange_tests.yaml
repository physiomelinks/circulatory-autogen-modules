  invariants:
  - description: 'Spencer inverse is exact: forward curve at (P_O2_p, P_CO2_p) returns C_O2_p (below the cap)'
    expr: np.max(np.where(C_O2_p < saturation_cap*C_O2_sat, np.abs(C_O2_sat*((P_O2_p)*(1 + beta_1*(P_CO2_p))/(k_1*(1 + alpha_1*(P_CO2_p))))**(1/h_1)/(1
      + ((P_O2_p)*(1 + beta_1*(P_CO2_p))/(k_1*(1 + alpha_1*(P_CO2_p))))**(1/h_1)) - C_O2_p), 0)) <= 1e-6*C_O2_sat
  - description: arterial content is the exact flow-weighted mix of capillary and shunted venous blood
    expr: np.max(np.abs(C_O2_a - ((1 - shunt_fraction)*C_O2_p + shunt_fraction*ven__C_O2_out))[t > 0.1]) <= 1e-9
  - description: Fick flux law M_O2 = k_O2 (P_O2_A - P_O2_p)
    expr: np.max(np.abs(M_O2 - k_O2*(resp__P_O2_A - P_O2_p))) <= 1e-9*max(1e-12, np.max(np.abs(M_O2)))
  - description: capillary O2 mass balance with v = sum of the five lobar flows (trapezoid; after the 1 s start-up transient)
    expr: np.max(np.abs((q_0*(C_O2_p - C_O2_p[0]) - np.concatenate(([0.0], np.cumsum(0.5*np.diff(t)*(((termp1__v_T + termp2__v_T + termp3__v_T
      + termp4__v_T + termp5__v_T)*(1 - shunt_fraction)*(ven__C_O2_out - C_O2_p) + M_O2)[1:] + ((termp1__v_T + termp2__v_T + termp3__v_T + termp4__v_T
      + termp5__v_T)*(1 - shunt_fraction)*(ven__C_O2_out - C_O2_p) + M_O2)[:-1])))))[t >= 1] - (q_0*(C_O2_p - C_O2_p[0]) - np.concatenate(([0.0],
      np.cumsum(0.5*np.diff(t)*(((termp1__v_T + termp2__v_T + termp3__v_T + termp4__v_T + termp5__v_T)*(1 - shunt_fraction)*(ven__C_O2_out - C_O2_p)
      + M_O2)[1:] + ((termp1__v_T + termp2__v_T + termp3__v_T + termp4__v_T + termp5__v_T)*(1 - shunt_fraction)*(ven__C_O2_out - C_O2_p) + M_O2)[:-1])))))[t
      >= 1][0])) <= 5e-3*max(np.ptp(q_0*C_O2_p), 1e-9)
  - description: 'bounds: C_O2_p >= 0, C_O2_p <= C_O2_sat for t >= 10 s, partial pressures >= 0'
    expr: np.all(C_O2_p >= 0) & np.all((C_O2_p <= C_O2_sat)[t >= 10]) & np.all(P_O2_p >= 0) & np.all(P_CO2_p >= 0)
  bc_sweep:
    exclude:
    - C_CO2_a
    - C_O2_a
    ranges:
      q_0:
        min: 5.0e-05
        max: 0.002
        points: 4
        scale: log
      k_O2:
        min: 2.0e-09
        max: 5.0e-08
        points: 4
        scale: log
      k_CO2:
        min: 2.0e-08
        max: 1.0e-06
        points: 4
        scale: log
      shunt_fraction:
        min: 0.0
        max: 0.3
        points: 4
