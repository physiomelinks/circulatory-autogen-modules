- vessel_type: GE_capillary
  BC_type: nn
  module_type: capillary_GE
  notes: 'Single capillary O2 exchange (author''s model): well-mixed capillary O2 content with inflow/outflow and a permeability flux to tissue,
    flux = 2 pi r L perm (ub_c - ub_t) on free (dissolved) O2; the venous free O2 is reconstructed from an assumed exponential axial profile whose
    decay rate solves (1 - exp(-kL))/(kL) = C_0 via a Pade approximation of the Lambert W function; contents <-> pressures via Spencer curves
    in mmHg. CO2 is passed through (C_CO2_c = C_CO2_a). All inputs are boundary conditions, so it runs alone.'
  sim_time: 10.0
  dt: 0.001
  outputs:
  - C_O2_c
  - C_O2_v
  - C_CO2_v
  - P_O2_c
  - P_CO2_c
  - P_O2_a
  - P_O2_v
  - ub_O2_c
  - ub_O2_a
  - ub_O2_v
  - flux_O2_c
  - C_0
  - k_xdecay
  invariants:
  - description: 'O2 mass balance: V (C_O2_c(t) - C_O2_c(0)) = time integral of v_in C_O2_a - v_out C_O2_v - flux_O2_c (trapezoid)'
    expr: np.max(np.abs(V*(C_O2_c - C_O2_c[0]) - np.concatenate(([0.0], np.cumsum(0.5*np.diff(t)*((v_in*C_O2_a - v_out*C_O2_v - flux_O2_c)[1:]
      + (v_in*C_O2_a - v_out*C_O2_v - flux_O2_c)[:-1])))))) <= 2e-3*max(np.max(np.abs(V*(C_O2_c - C_O2_c[0]))), 1e-30) + 1e-24
  - description: flux law flux_O2_c = 2 pi r L perm_O2 (ub_O2_c - ub_O2_t)
    expr: np.max(np.abs(flux_O2_c - 2*np.pi*r*L*perm_O2*(ub_O2_c - ub_O2_t))) <= 1e-9*max(np.max(np.abs(flux_O2_c)), 1e-30)
  - description: 'Spencer inverse is exact: forward curve (mmHg form) at (P_O2_c, P_CO2_c) returns C_O2_c'
    expr: np.max(np.abs(C_O2_sat*((P_O2_c)*(1 + beta_1*(P_CO2_c))/(k_1*(1 + alpha_1*(P_CO2_c))))**(1/a_1)/(1 + ((P_O2_c)*(1 + beta_1*(P_CO2_c))/(k_1*(1
      + alpha_1*(P_CO2_c))))**(1/a_1)) - C_O2_c)) <= 1e-6*C_O2_sat
  - description: free O2 ub = 133.32 P S (mmHg -> Pa)
    expr: np.max(np.abs(ub_O2_c - 133.32*P_O2_c*S_O2)) <= 1e-9*np.max(np.abs(ub_O2_c))
  - description: 'Pade Lambert-W: when the exponential branch is active the axial profile mean matches C_0: (1 - exp(-k L))/(k L) = C_0 (Pade
      error < 1%)'
    expr: np.all(np.where((ub_O2_c < exp_threshold*ub_O2_a) & (C_0 > 0.05) & (C_0 < 0.95), np.abs((1 - np.exp(-k_xdecay*L))/(k_xdecay*L) - C_0)
      <= 1e-2*C_0, True))
  - description: 'physical ordering: at the venous (outlet) end the O2 pressure is not above the capillary mean (P_O2_v <= P_O2_c) after the initial
      transient'
    expr: np.all((P_O2_v <= P_O2_c + 1e-6)[t >= 1])
  - description: venous free O2 lies between tissue and arterial free O2 (while ub_O2_c < ub_O2_a); contents and pressures >= 0
    expr: np.all(np.where(ub_O2_c < ub_O2_a, (ub_O2_v >= ub_O2_t - 1e-12) & (ub_O2_v <= ub_O2_a + 1e-12), True)) & np.all(C_O2_c >= 0) & np.all(P_O2_c
      >= 0) & np.all(C_O2_v >= 0)
  expected_failures:
    run_test: 'the component cannot be generated: (1) its config lists d_1, d_2, r_1, r_2, s_1, s_2 twice (J_per_m3/J2_per_m6 and mmHg/mmHg2),
      so libcuflynx declares them twice (libcellml VARIABLE_NAME_UNIQUE); (2) the CellML uses the global saturation_cap without declaring it.
      Evidence: in a patched copy of the library (duplicates removed, saturation_cap declared and added to the config as global_constant) it generates
      and runs.'
    verification_test_invariants: 'the component cannot be generated: (1) its config lists d_1, d_2, r_1, r_2, s_1, s_2 twice (J_per_m3/J2_per_m6
      and mmHg/mmHg2), so libcuflynx declares them twice (libcellml VARIABLE_NAME_UNIQUE); (2) the CellML uses the global saturation_cap without
      declaring it. Evidence: in a patched copy of the library (duplicates removed, saturation_cap declared and added to the config as global_constant)
      it generates and runs.'
    verification_test_BC: 'the component cannot be generated: (1) its config lists d_1, d_2, r_1, r_2, s_1, s_2 twice (J_per_m3/J2_per_m6 and
      mmHg/mmHg2), so libcuflynx declares them twice (libcellml VARIABLE_NAME_UNIQUE); (2) the CellML uses the global saturation_cap without declaring
      it. Evidence: in a patched copy of the library (duplicates removed, saturation_cap declared and added to the config as global_constant)
      it generates and runs.'
    verification_test_timestep: 'the component cannot be generated: (1) its config lists d_1, d_2, r_1, r_2, s_1, s_2 twice (J_per_m3/J2_per_m6
      and mmHg/mmHg2), so libcuflynx declares them twice (libcellml VARIABLE_NAME_UNIQUE); (2) the CellML uses the global saturation_cap without
      declaring it. Evidence: in a patched copy of the library (duplicates removed, saturation_cap declared and added to the config as global_constant)
      it generates and runs.'
    stability_test: 'the component cannot be generated: (1) its config lists d_1, d_2, r_1, r_2, s_1, s_2 twice (J_per_m3/J2_per_m6 and mmHg/mmHg2),
      so libcuflynx declares them twice (libcellml VARIABLE_NAME_UNIQUE); (2) the CellML uses the global saturation_cap without declaring it.
      Evidence: in a patched copy of the library (duplicates removed, saturation_cap declared and added to the config as global_constant) it generates
      and runs.'
  bc_sweep:
    ranges:
      C_O2_a:
        min: 5.0
        max: 8.9
        points: 4
      C_CO2_a:
        min: 19.0
        max: 24.0
        points: 3
      ub_O2_t:
        min: 0.005
        max: 0.05
        points: 4
      perm_O2:
        min: 2.0e-06
        max: 0.0001
        points: 4
        scale: log
      C_O2_c_init:
        min: 4.0
        max: 8.9
        points: 3
      exp_threshold:
