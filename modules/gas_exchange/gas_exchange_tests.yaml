  invariants:
  - description: 'Spencer inverse is exact: the forward Spencer curve at (P_O2_p, P_CO2_p) returns C_O2_p (below the cap)'
    expr: np.max(np.where(C_O2_p_extra_ub == 0, np.abs(C_O2_sat*((P_O2_p)*(1 + beta_1*(P_CO2_p))/(k_1*(1 + alpha_1*(P_CO2_p))))**(1/h_1)/(1 +
      ((P_O2_p)*(1 + beta_1*(P_CO2_p))/(k_1*(1 + alpha_1*(P_CO2_p))))**(1/h_1)) - C_O2_p), 0)) <= 1e-6*C_O2_sat
  - description: '... and returns C_CO2_p'
    expr: np.max(np.where((C_O2_p_extra_ub == 0) & (C_CO2_p < saturation_cap*C_CO2_sat), np.abs(C_CO2_sat*((P_CO2_p)*(1 + beta_2*(P_O2_p))/(k_2*(1
      + alpha_2*(P_O2_p))))**(1/h_2)/(1 + ((P_CO2_p)*(1 + beta_2*(P_O2_p))/(k_2*(1 + alpha_2*(P_O2_p))))**(1/h_2)) - C_CO2_p), 0)) <= 1e-6*C_CO2_sat
  - description: arterial content is the exact flow-weighted mix of capillary and shunted venous blood
    expr: np.max(np.abs(C_O2_a - ((1 - shunt_fraction)*C_O2_p + shunt_fraction*ven__C_O2_out))[t > 0.1]) <= 1e-9
  - description: Fick flux law M_O2 = k_O2 (P_O2_A - P_O2_p)
    expr: np.max(np.abs(M_O2 - k_O2*(resp__P_O2_A - P_O2_p))) <= 1e-9*max(1e-12, np.max(np.abs(M_O2)))
  - description: 'capillary O2 mass balance: q_0 (C(t) - C(0)) = time integral of v_p (C_v - C) + M_O2 (trapezoid; after the 1 s start-up transient)'
    expr: np.max(np.abs((q_0*(C_O2_p - C_O2_p[0]) - np.concatenate(([0.0], np.cumsum(0.5*np.diff(t)*((termp__v_T*(1 - shunt_fraction)*(ven__C_O2_out
      - C_O2_p) + M_O2)[1:] + (termp__v_T*(1 - shunt_fraction)*(ven__C_O2_out - C_O2_p) + M_O2)[:-1])))))[t >= 1] - (q_0*(C_O2_p - C_O2_p[0])
      - np.concatenate(([0.0], np.cumsum(0.5*np.diff(t)*((termp__v_T*(1 - shunt_fraction)*(ven__C_O2_out - C_O2_p) + M_O2)[1:] + (termp__v_T*(1
      - shunt_fraction)*(ven__C_O2_out - C_O2_p) + M_O2)[:-1])))))[t >= 1][0])) <= 5e-3*max(np.ptp(q_0*C_O2_p), 1e-9)
  - description: 'bounds: C_O2_p >= 0, C_O2_p <= C_O2_sat once the initial condition has washed out (t >= 10 s; C_O2_p_init may exceed a swept
      C_O2_sat), partial pressures >= 0'
    expr: np.all(C_O2_p >= 0) & np.all((C_O2_p <= C_O2_sat)[t >= 10]) & np.all(P_O2_p >= 0) & np.all(P_CO2_p >= 0)
  bc_sweep:
    sweep: all
    exclude:
    - C_CO2_a
    - C_O2_a
    ranges:
      q_0:
        min: 5.0e-05
        max: 0.002
        points: 4
        scale: log
      k_O2:
        min: 2.0e-09
        max: 5.0e-08
        points: 4
        scale: log
      k_CO2:
        min: 2.0e-08
        max: 1.0e-06
        points: 4
        scale: log
      shunt_fraction:
        min: 0.0
        max: 0.3
        points: 4
      C_O2_p_init:
        min: 0.1
        max: 0.2
        points: 3
      C_CO2_p_init:
        min: 0.42
        max: 0.56
        points: 3
      C_O2_sat:
        min: 0.19
        max: 0.25
        points: 3
      C_CO2_sat:
        min: 1.6
        max: 2.4
        points: 3
    rationale: 'q_0 from a textbook capillary volume (~75 ml) to the library 2 L; k_O2 from a diffusing-capacity-like 2.6e-9 (D_LO2 ~ 20 ml/min/mmHg)
      to 3x library; k_CO2 similarly; shunt 0-30% (normal to severe shunt). C_CO2_a/C_O2_a are excluded: they are computed, the config wrongly
      declares them boundary conditions. C_O2_sat is swept -7%..+22% (Hb ~14-18 g/dl) and C_CO2_sat +-20%; below that the fixed venous input (0.15
      ml/ml) and initial content (0.20) are inconsistent with the saturation. Other Spencer globals use the default factors.'
  timestep:
    t_end: 2.0
    dts:
    - 0.00025
    - 0.000125
    - 6.25e-05
    - 3.125e-05
    tol: 0.01
  stability:
    t_end: 10.0
    supported:
    - solver: CVODE_myokit
      rtol: 1.0e-06
      atol: 1.0e-08
  run_parameters: {}
  reference_proposals:
    k_1:
      reference: Spencer1979; K1 = 14.99 mmHg as tabulated in Albanese2014 Table 2-6 (Spencer 1979 full text not accessed); 14.99 x 133.322 =
        1998.5 Pa
      sourced: 'yes'
    k_2:
      reference: Spencer1979; K2 = 194.4 mmHg (Albanese2014 Table 2-6); 194.4 x 133.322 = 25917.8 Pa (library 25917.4, 0.002% low)
      sourced: 'yes'
    h_1:
      reference: Spencer1979; h1 = 0.3836 (Albanese2014 Table 2-6)
      sourced: 'yes'
    h_2:
      reference: Spencer1979; h2 = 1.819 (Albanese2014 Table 2-6)
      sourced: 'yes'
    alpha_1:
      reference: Spencer1979; alpha1 = 0.03198 /mmHg (Albanese2014 Table 2-6); /133.322 = 2.399e-4 /Pa
      sourced: 'yes'
    alpha_2:
      reference: Spencer1979; alpha2 = 0.05591 /mmHg (Albanese2014 Table 2-6); /133.322 = 4.194e-4 /Pa
      sourced: 'yes'
    beta_1:
      reference: Spencer1979; beta1 = 0.008275 /mmHg (Albanese2014 Table 2-6); /133.322 = 6.207e-5 /Pa
      sourced: 'yes'
    beta_2:
      reference: Spencer1979; beta2 = 0.03255 /mmHg (Albanese2014 Table 2-6); /133.322 = 2.441e-4 /Pa
      sourced: 'yes'
    C_O2_sat:
      reference: Spencer1979; C_sat,O2 = 9 mmol/L (Albanese2014 Table 2-6). Library 0.20448 ml/ml = 9 mmol/L x 22.72 ml/mmol; the STPD molar volume
        22.41 ml/mmol would give 0.2017 -- conversion factor to confirm
      sourced: 'yes'
    C_CO2_sat:
      reference: Spencer1979; C_sat,CO2 = 86.11 mmol/L (Albanese2014 Table 2-6). Library 1.9564 = 86.11 x 22.72 ml/mmol (same factor as C_O2_sat;
        22.41 would give 1.930)
      sourced: 'yes'
    overcap_solubility:
      reference: 'unreferenced_placeholder; numerical device: steep linear P_O2 rise (Pa per unit content) above the saturation cap so the inverse
        curve stays finite'
      sourced: 'no'
    saturation_cap:
      reference: 'unreferenced_placeholder; numerical device: content capped at 0.9999 of saturation before inverting the Spencer curve'
      sourced: 'no'
    C_CO2_p_init:
      reference: unreferenced_placeholder; initial condition (library 0.48 ml/ml, ~arterial CO2 content)
      sourced: 'no'
    C_O2_p_init:
      reference: unreferenced_placeholder; initial condition (library 0.20 ml/ml, ~arterial O2 content)
      sourced: 'no'
    C_CO2_a:
      reference: 'definitional; not a boundary condition: computed by the component (config declares it boundary_condition -- see proposed fix).
        Value only to fill the TODO'
      sourced: definitional
      value: 0.485
    C_O2_a:
      reference: 'definitional; not a boundary condition: computed by the component (config declares it boundary_condition -- see proposed fix).
        Value only to fill the TODO'
      sourced: definitional
      value: 0.199
    q_0:
      reference: unreferenced_placeholder; library 2 L is ~25x a textbook pulmonary capillary blood volume (~70-100 ml at rest); Albanese uses
        the pulmonary peripheral volume of the CVS model
      sourced: 'no'
    k_O2:
      reference: 'unreferenced_placeholder; NOT in Albanese 2016 (Albanese2014 eqs A-69/A-70 assume P_capillary = P_alveolar, no conductance).
        1.7e-8 m6/(J s) = 136 ml/min/mmHg, ~6x a resting D_LO2 of ~20-25 ml/min/mmHg: effectively near-equilibrium'
      sourced: 'no'
    k_CO2:
      reference: unreferenced_placeholder; NOT in Albanese 2016 (instantaneous equilibrium there). 4.9e-7 m6/(J s) = 3900 ml/min/mmHg
      sourced: 'no'
    shunt_fraction:
      reference: Albanese2014; sh = 1.7% (Table 2-6, citing GuytonHall2006)
      sourced: 'yes'
