- vessel_type: gas_transport_simple
  BC_type: nn
  module_type: gas_transport_simple_type
  notes: 'Well-mixed blood gas transport compartment (volume q_0, flow v) without exchange: q_0 dC/dt = v (C_in - C_out), plus output partial
    pressures from the analytic inverse of the Spencer curves. With constant inflow content and flow, C_out = C_in + (C_init - C_in) exp(-v t/q_0).
    Harness: pp_I terminal as a steady flow source (5 L/min).'
  sim_time: 20.0
  dt: 0.001
  outputs:
  - C_O2_out
  - C_CO2_out
  - dot_C_CO2_out
  - P_O2_out
  - P_CO2_out
  - C_O2_out_extra_ub
  - term/v_T
  harness:
    vessel_array:
    - - term
      - pp_I
      - terminal
      - ''
      - mod
    - - mod
      - nn
      - gas_transport_simple
      - term
      - ''
    parameters:
    - - R_1_T_term
      - Js_per_m6
      - 5000000.0
      - harness flow source
    - - R_2_T_term
      - Js_per_m6
      - 5000000.0
      - harness flow source
    - - C_T_term
      - m6_per_J
      - 1.0e-09
      - harness flow source
    - - I_T_term
      - Js2_per_m6
      - 25000.0
      - 'harness: I/R = 5 ms'
    - - u_ext_term
      - J_per_m3
      - 0.0
      - harness
    - - u_in_term
      - J_per_m3
      - 833.0
      - 'harness: gives v_T = 8.33e-05 m3/s'
    - - u_out_term
