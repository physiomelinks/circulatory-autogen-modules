    - 0.000125
    - 6.25e-05
    - 3.125e-05
    tol: 0.01
  stability:
    t_end: 10.0
    supported:
    - solver: CVODE_myokit
      rtol: 1.0e-06
      atol: 1.0e-08
  reference_proposals:
