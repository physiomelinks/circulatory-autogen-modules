      - 0.0
      - harness
    - - q_us_term
      - m3
      - 0.0
      - harness
    - - q_init_term
      - m3
      - 4.165e-07
      - 'harness: equilibrium volume'
  invariants:
  - description: 'O2 content matches the exact washout solution for the logged (time-varying) flow: C = C_in + (C_init - C_in) exp(-int v dt /
      q_0)'
    expr: np.max(np.abs(C_O2_out - (C_O2_in + (C_O2_out_init - C_O2_in)*np.exp(-cumint(t, term__v_T)/q_0)))) <= 2e-3*abs(C_O2_out_init - C_O2_in)
      + 1e-6
  - description: CO2 content matches the exact first-order washout solution
    expr: np.max(np.abs(C_CO2_out - (C_CO2_in + (C_CO2_out_init - C_CO2_in)*np.exp(-cumint(t, term__v_T)/q_0)))) <= 2e-3*abs(C_CO2_out_init -
      C_CO2_in) + 1e-6
  - description: dot_C_CO2_out = v (C_CO2_in - C_CO2_out)/q_0 (exported derivative)
    expr: np.max(np.abs(dot_C_CO2_out - term__v_T*(C_CO2_in - C_CO2_out)/q_0)) <= 1e-9 + 1e-6*np.max(np.abs(dot_C_CO2_out))
  - description: 'Spencer inverse is exact: forward curve at (P_O2_out, P_CO2_out) returns C_O2_out (below 99% of saturation, where the inversion
      is well conditioned)'
    expr: np.max(np.where((C_O2_out_extra_ub == 0) & (C_O2_out < 0.99*C_O2_sat), np.abs(C_O2_sat*((P_O2_out)*(1 + beta_1*(P_CO2_out))/(k_1*(1
      + alpha_1*(P_CO2_out))))**(1/h_1)/(1 + ((P_O2_out)*(1 + beta_1*(P_CO2_out))/(k_1*(1 + alpha_1*(P_CO2_out))))**(1/h_1)) - C_O2_out), 0))
      <= 1e-6*C_O2_sat
  - description: '... and returns C_CO2_out'
    expr: np.max(np.where((C_O2_out_extra_ub == 0) & (C_O2_out < 0.99*C_O2_sat) & (C_CO2_out < 0.99*C_CO2_sat), np.abs(C_CO2_sat*((P_CO2_out)*(1
      + beta_2*(P_O2_out))/(k_2*(1 + alpha_2*(P_O2_out))))**(1/h_2)/(1 + ((P_CO2_out)*(1 + beta_2*(P_O2_out))/(k_2*(1 + alpha_2*(P_O2_out))))**(1/h_2))
      - C_CO2_out), 0)) <= 1e-6*C_CO2_sat
  - description: partial pressures >= 0
    expr: np.all(P_O2_out >= 0) & np.all(P_CO2_out >= 0)
  bc_sweep:
    ranges:
      C_CO2_in:
        min: 0.4
        max: 0.6
        points: 5
      C_O2_in:
        min: 0.02
        max: 0.21
        points: 5
      C_CO2_out_init:
        min: 0.4
        max: 0.6
        points: 3
      C_O2_out_init:
        min: 0.02
        max: 0.21
        points: 3
      q_0:
