module: gas_exchange
reviewed: false
known_issues: []
defaults:
  sim_time: 2.0
  pre_time: 0.0
  dt: 0.01
  solver: CVODE_myokit
  bc_sweep:
    factors: [0.5, 0.75, 1.0, 1.5, 2.0]
    ranges: {}
  timestep:
    scheme: rk4
    dts: [0.004, 0.002, 0.001, 0.0005]
    min_order: 0.8
    tol: 0.0001
    cvode_tol: 0.001
  stability:
    supported:
    - {solver: CVODE_myokit, rtol: 1.0e-06, atol: 1.0e-08}
components:
- vessel_type: tissue_GE_simple
  BC_type: nn
  module_type: tissue_GE_simple_type
  outputs: [C_CO2_p, C_O2_p, v]
  invariants: []
  validation:
    baseline: {status: pending, reason: validation data not chosen yet}
    calibrate: {status: pending, reason: validation data not chosen yet}
- vessel_type: pulmonary_GE
  BC_type: nn
  module_type: pulmonary_GE_type
  outputs: [C_CO2_p, C_O2_p, C_CO2_p_capped, C_O2_p_capped, C_CO2_v, C_O2_v]
  invariants: []
  validation:
