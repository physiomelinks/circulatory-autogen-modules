  invariants:
  - description: P_O2_A = F_O2_A (P_atm - P_ws) and P_CO2_A = F_CO2_A (P_atm - P_ws)
    expr: np.max(np.abs(P_O2_A - F_O2_A*(P_atm - P_ws))) + np.max(np.abs(P_CO2_A - F_CO2_A*(P_atm - P_ws))) <= 1e-6
  - description: gas fractions in [0, 1] and F_O2 + F_CO2 <= 1
    expr: np.all((F_O2_A >= 0) & (F_CO2_A >= 0) & (F_O2_D >= 0) & (F_CO2_D >= 0) & (F_O2_A + F_CO2_A <= 1) & (F_O2_D + F_CO2_D <= 1))
  - description: 'alveolar O2 balance: F_O2_A(t) - F_O2_A(t0) = time integral of [max(v_bA,0)(F_D - F_A) - K M_O2]/q_A (trapezoid, t0 = 5 s after
      the lung start-up transient)'
    expr: np.max(np.abs((F_O2_A - np.concatenate(([0.0], np.cumsum(0.5*np.diff(t)*(((np.maximum(lung__v_bA, 0)*(F_O2_D - F_O2_A) - K_LOSSES*pge__M_O2)/lung__q_A)[1:]
      + ((np.maximum(lung__v_bA, 0)*(F_O2_D - F_O2_A) - K_LOSSES*pge__M_O2)/lung__q_A)[:-1])))))[t >= 5] - (F_O2_A - np.concatenate(([0.0], np.cumsum(0.5*np.diff(t)*(((np.maximum(lung__v_bA,
      0)*(F_O2_D - F_O2_A) - K_LOSSES*pge__M_O2)/lung__q_A)[1:] + ((np.maximum(lung__v_bA, 0)*(F_O2_D - F_O2_A) - K_LOSSES*pge__M_O2)/lung__q_A)[:-1])))))[t
      >= 5][0])) <= 2e-2*np.ptp(F_O2_A[t >= 5]) + 1e-6
  - description: 'dead-space O2 balance: F_O2_D(t) - F_O2_D(t0) = time integral of [max(v_ml,0)(F_i - F_D) - max(-v_bA,0)(F_D - F_A)]/q_D'
    expr: np.max(np.abs((F_O2_D - np.concatenate(([0.0], np.cumsum(0.5*np.diff(t)*(((np.maximum(lung__v_ml, 0)*(F_O2_i - F_O2_D) - np.maximum(-lung__v_bA,
      0)*(F_O2_D - F_O2_A))/lung__q_D)[1:] + ((np.maximum(lung__v_ml, 0)*(F_O2_i - F_O2_D) - np.maximum(-lung__v_bA, 0)*(F_O2_D - F_O2_A))/lung__q_D)[:-1])))))[t
      >= 5] - (F_O2_D - np.concatenate(([0.0], np.cumsum(0.5*np.diff(t)*(((np.maximum(lung__v_ml, 0)*(F_O2_i - F_O2_D) - np.maximum(-lung__v_bA,
      0)*(F_O2_D - F_O2_A))/lung__q_D)[1:] + ((np.maximum(lung__v_ml, 0)*(F_O2_i - F_O2_D) - np.maximum(-lung__v_bA, 0)*(F_O2_D - F_O2_A))/lung__q_D)[:-1])))))[t
      >= 5][0])) <= 2e-2*np.ptp(F_O2_D[t >= 5]) + 1e-6
  - description: 'inspired gas bounds: F_O2_D and F_O2_A never exceed F_O2_i (no O2 source other than inspired air), once the initial fractions
      have washed out (t >= 30 s). Run point only: with hypoxic inspired air (F_O2_i = 0.12) the 2 L pulmonary capillary pool, initialised at
      0.20 ml/ml, releases O2 into the alveoli (M_O2 < 0) for longer than 30 s, which is physically correct'
    expr: np.all((F_O2_D <= F_O2_i + 1e-9)[t >= 30]) & np.all((F_O2_A <= F_O2_i + 1e-9)[t >= 30])
    applies: run
  bc_sweep:
