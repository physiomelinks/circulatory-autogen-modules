        points: 3
    rationale: Arterial O2 content 5-8.9 mol/m3 (P_O2 ~ 30-150 mmHg), CO2 19-24 mol/m3, tissue P_O2 ~4-37 mmHg, permeability over 1.5 decades
      around the placeholder; geometry and flows swept by the default factors (0.5-2x).
  timestep:
    t_end: 2.0
    dts:
    - 0.0005
    - 0.00025
    - 0.000125
    - 6.25e-05
  reference_proposals:
    k_1:
      reference: Spencer1979; K1 = 14.99 mmHg (Albanese2014 Table 2-6)
      sourced: 'yes'
