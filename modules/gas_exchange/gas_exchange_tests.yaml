module: gas_exchange
reviewed: false
known_issues: []
defaults:
  sim_time: 2.0
  pre_time: 0.0
  dt: 0.01
  solver: CVODE_myokit
  bc_sweep:
    factors:
    - 0.5
    - 0.75
    - 1.0
    - 1.5
    - 2.0
    ranges: {}
  timestep:
    scheme: rk4
    dts:
    - 0.004
    - 0.002
    - 0.001
    - 0.0005
    min_order: 0.8
    tol: 0.0001
    cvode_tol: 0.001
  stability:
    supported:
    - solver: CVODE_myokit
      rtol: 1.0e-06
      atol: 1.0e-08
components:
- vessel_type: tissue_GE_simple
  BC_type: nn
  module_type: tissue_GE_simple_type
  notes: 'Well-mixed tissue/capillary gas compartment of volume q_0: q_0 dC/dt = v (C_a - C) + M for O2 and CO2 (contents in ml gas per ml blood,
    M in m3/s of gas; M_O2 < 0 is consumption). With constant arterial contents and flow the exact solution is C = C_ss + (C_init - C_ss) exp(-v
    t / q_0), C_ss = C_a + M/v. libcuflynx special-cases tissue_GE_simple (it must be fed by a terminal vessel), so the harness feeds it from
    a pp_I terminal used as a steady flow source (v_T -> 4e-6 m3/s within ~20 ms).'
  sim_time: 150.0
  dt: 0.05
  outputs:
  - C_O2_p
  - C_CO2_p
  - term/v_T
  harness:
    vessel_array:
    - - term
      - pp_I
      - terminal
      - ''
      - mod
    - - mod
      - nn
      - tissue_GE_simple
      - term
      - ''
    parameters:
    - - R_1_T_term
      - Js_per_m6
      - 50000000.0
      - harness flow source
    - - R_2_T_term
      - Js_per_m6
      - 50000000.0
      - harness flow source
    - - C_T_term
      - m6_per_J
      - 1.0e-09
      - harness flow source
    - - I_T_term
      - Js2_per_m6
      - 250000.0
      - 'harness: I/R = 5 ms'
    - - u_ext_term
      - J_per_m3
      - 0.0
      - harness
    - - u_in_term
      - J_per_m3
      - 400.0
      - 'harness: gives v_T = 4e-06 m3/s'
    - - u_out_term
      - J_per_m3
      - 0.0
      - harness
    - - q_us_term
      - m3
      - 0.0
      - harness
    - - q_init_term
      - m3
      - 2.0000000000000002e-07
      - 'harness: equilibrium volume'
  invariants:
  - description: O2 content matches the exact solution C_ss + (C_init - C_ss) exp(-v t/q_0) (v = settled terminal flow; tolerance 0.2% of the
      step plus 5e-5 ml/ml for the ~10 ms flow start-up of the harness)
    expr: np.max(np.abs(C_O2_p - ((C_O2_a + M_O2/term__v_T[-1]) + (C_O2_p_init - (C_O2_a + M_O2/term__v_T[-1]))*np.exp(-term__v_T[-1]*t/q_0))))
      <= 2e-3*abs(C_O2_p_init - (C_O2_a + M_O2/term__v_T[-1])) + 5e-5
  - description: CO2 content matches the exact solution
    expr: np.max(np.abs(C_CO2_p - ((C_CO2_a + M_CO2/term__v_T[-1]) + (C_CO2_p_init - (C_CO2_a + M_CO2/term__v_T[-1]))*np.exp(-term__v_T[-1]*t/q_0))))
      <= 2e-3*abs(C_CO2_p_init - (C_CO2_a + M_CO2/term__v_T[-1])) + 5e-5
  - description: 'O2 mass balance: q_0 C changes by the time integral of v (C_a - C) + M_O2 (trapezoid on the logged flow, from t = 0.5 s after
      the flow start-up)'
    expr: np.max(np.abs((q_0*C_O2_p - np.concatenate(([0.0], np.cumsum(0.5*np.diff(t)*((term__v_T*(C_O2_a - C_O2_p) + M_O2)[1:] + (term__v_T*(C_O2_a
      - C_O2_p) + M_O2)[:-1])))))[t >= 0.5] - (q_0*C_O2_p - np.concatenate(([0.0], np.cumsum(0.5*np.diff(t)*((term__v_T*(C_O2_a - C_O2_p) + M_O2)[1:]
      + (term__v_T*(C_O2_a - C_O2_p) + M_O2)[:-1])))))[t >= 0.5][0])) <= 2e-3*max(np.ptp(q_0*C_O2_p), abs(M_O2)*1e-3)
  - description: contents stay non-negative
    expr: np.all(C_O2_p >= 0) & np.all(C_CO2_p >= 0)
  bc_sweep:
    ranges:
      C_O2_a:
        min: 0.1
        max: 0.21
        points: 5
      C_CO2_a:
        min: 0.4
        max: 0.56
        points: 5
      q_0:
        min: 5.0e-05
        max: 0.0005
        points: 5
        scale: log
      C_O2_p_init:
        min: 0.05
        max: 0.21
        points: 5
      C_CO2_p_init:
        min: 0.4
        max: 0.6
        points: 5
      M_O2:
        min: -3.0e-07
        max: -2.0e-08
        points: 5
      M_CO2:
        min: 2.0e-08
        max: 3.0e-07
        points: 5
    rationale: 'Arterial contents span hypoxaemic to hyperoxic blood (0.10-0.21 ml/ml O2; 0.40-0.56 ml/ml CO2, Spencer curve at P_CO2 25-60 mmHg);
      q_0 spans 50-500 ml tissue compartments; M spans 1.2-18 ml/min per compartment. With v = 4e-6 m3/s the lowest steady O2 content in the sweep
      is 0.10 - 1.8e-7/4e-6 = 0.055 ml/ml, so contents stay positive (the model has no floor: C_O2 would go negative if |M_O2| > v C_O2_a).'
  timestep:
    t_end: 20.0
  reference_proposals:
    C_CO2_a:
      reference: 'Spencer1979; test BC: arterial CO2 content at P_O2 = 100, P_CO2 = 40 mmHg from the Spencer curve (21.35 mmol/L) x 22.72 ml/mmol
        = 0.485 ml/ml'
      sourced: 'yes'
      value: 0.485
    C_O2_a:
      reference: 'Spencer1979; test BC: arterial O2 content at P_O2 = 100, P_CO2 = 40 mmHg (8.75 mmol/L) x 22.72 ml/mmol = 0.199 ml/ml'
      sourced: 'yes'
      value: 0.199
    q_0:
      reference: Albanese2014; brain tissue volume 1300 ml (Table 2-7, citing Ursino2001) split over the 8 cerebral GE compartments of the CA
        parasympathetic model = 162.5 ml; library 164 ml. Ursino 2001 itself not accessed
      sourced: 'yes'
    C_CO2_p_init:
      reference: unreferenced_placeholder; initial condition near mixed-venous CO2 content (Albanese2014 Table 2-12 normal 53 ml/dl)
      sourced: 'no'
    C_O2_p_init:
      reference: unreferenced_placeholder; initial condition = normal mixed-venous O2 content 15 ml/dl (Albanese2014 Table 2-12)
      sourced: 'no'
    M_CO2:
      reference: unreferenced_placeholder; library value 8.64 ml/min (RQ 0.8 of M_O2). Albanese2014 Table 2-7 gives brain CO2 production 39.9
        ml/min total = 5.0 ml/min per 1/8 of brain
      sourced: 'no'
    M_O2:
      reference: unreferenced_placeholder; library value -10.8 ml/min. Albanese2014 Table 2-7 gives brain O2 consumption 47.5 ml/min (from Ursino
        & Magosso) = 5.9 ml/min per 1/8 of brain, i.e. ~1.8x smaller
      sourced: 'no'
  validation:
    baseline:
      status: pending
      reason: 'candidate: brain arterio-venous O2 content difference / jugular venous O2 at normal CBF (e.g. Albanese2014 Table 2-7 consumption
        rates with a cerebral flow) -- needs a flow value per compartment from the owner'
    calibrate:
      status: not_applicable
      reason: two-parameter linear mixing compartment; nothing to identify beyond the steady state that the exact-solution invariants already
        check
- vessel_type: pulmonary_GE
  BC_type: nn
  module_type: pulmonary_GE_type
  notes: 'Pulmonary capillary gas exchange (after Albanese 2016): well-mixed capillary of volume q_0 fed by v (1 - shunt) of mixed-venous blood,
    diffusive exchange M = k (P_A - P_p) with the alveoli, capillary partial pressures from the analytic inverse of the Spencer (1979) O2/CO2
    dissociation curves (Bohr/Haldane coupled), and arterial content = flow-weighted mix of capillary and shunted blood. Albanese assumes instantaneous
    alveolar-capillary equilibrium; this module adds a finite exchange conductance. Harness: steady pulmonary flow (pp_I terminal, 5 L/min), constant
    mixed-venous blood (gas_transport_simple held at 15/53 ml/dl), an arterial gas_transport_simple sink (needed: see known config issue), respiratory_gas_transport
    and the simple_lung_bg lung (library values).'
  sim_time: 120.0
  dt: 0.01
  solver_info:
    rtol: 1.0e-08
    atol: 1.0e-10
