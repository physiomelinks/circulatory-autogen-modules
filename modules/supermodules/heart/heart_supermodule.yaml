supermodule: heart
description: 'Four-chamber heart: cardiac clock, four generic chambers and four Mynard valves (modules/cardiac). Defined by
  the module_format "supermodule" entry in heart_modules_config.json; default parameters (3compartment''s: Liang 2009, Korakianitis
  2006, Mynard 2012) in heart_parameters.csv. A model uses one "heart" entry whose per_submodule_inputs / per_submodule_outputs
  couple ra, la, puv, aov (and the chambers'' volumes) to the circulation; libcuflynx expands it into heart_clock, heart_ra
  ... heart_aov.'
reviewed: false
tests:
  equivalent:
  - model: closed_loop_cvs/3compartment_supermodules
    reproduces: closed_loop_cvs/3compartment
    instance: heart
    tol: 1.0e-09
    solver_info:
      rtol: 1.0e-10
      atol: 1.0e-12
globals:
- T
- rho
- l_eff
