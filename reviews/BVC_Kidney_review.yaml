summary: 'Kidney (glomerulus, proximal tubule, epithelium) of the blood-volume-control system, as left/right components. All
  46 parameters were TODO; values proposed from P. Hunter''s unpublished BVC parameter set. The config declares q_vc_W with
  kind "variable " (trailing space), so the component cannot run alone (libcellml: q_vc_W unset); I tested it in a harness
  network (peritubular BG capillary + BVC_Na_circ) that supplies q_vc_W, and showed on a patched copy that changing the kind
  to boundary_condition makes it run standalone. Verification (both components): exact closed Na balance, water balance, constitutive
  and NKE laws, bounds and the analytic tubular-pressure steady state all hold; BC sweep, RK4 timestep and the solver matrix
  pass.'
comment: 'q_vc_W has kind "variable " (trailing space) so the kidney only runs where a neighbour supplies q_vc_W; GI declares
  the same input as boundary_condition. Physically: k_pt_W = 0 means no tubular water reabsorption; Na filtration is kK_gl_Na
  (q_vc_Na - q_pt_Na) (amount difference, not convective with v_gl_W), giving about 3.7e-3 mol/s per kidney, some 25x the
  physiological filtered load; the NKE law lacks an ATP term and its exp(2Fu/RT) factor looks sign/valence-inverted. The harness
  uses BG capillary inertances raised to 1e6 (CA example 1e-7) to keep the network non-stiff for the RK4 test.'
questions:
- 'Approve the config fix for the known issue: q_vc_W kind "variable " -> "boundary_condition" in both BVC_Kidney components
  (as in BVC_GI), plus a q_vc_W row per component in the parameters csv (proposed 0.0787 L)? Evidence: standalone generation
  fails now (libcellml: q_vc_W and dependants have unknown type); on a patched copy both components generate and run standalone.'
- All values are proposed from P. Hunter's unpublished parameter set (CA_user_volume_control/ANS_CVS_BVC_parameters.csv, data_reference
  "Peter_Hunter", same values in ANS_CVS_BVolCtl_FA_MG_PH_v2.cellml; the modules were added to circulatory_autogen by M. H.
  Shafieizadegan). I found no publication giving these values (the related bioRxiv preprint Hunter et al. 2026, "The biophysical
  basis of enterocyte homeostasis", doi 10.64898/2026.01.28.702213, is cellular and does not contain them), so they are marked
  unreferenced_placeholder. Is there a report/thesis to cite, or should they stay placeholders?
- RT = 2500 J/mol (T = 300.7 K) is the source value; keep it, or use body temperature (2578.8 J/mol at 310.15 K)? F is proposed
  as the exact CODATA value 96485.33212 C/mol (the source used 0.965e5).
- 'NKE law (all four modules share it): 3 k (A^3 B^2 - C^3 D^2 exp(2 F u/RT))/((1+A^3)(1+B^2)(1+C^3)(1+D^2)). (a) It has no
  ATP-hydrolysis term, so it is a gradient-driven exchanger, not a pump: in the source parameters it moves Na out of the epithelium
  only because blood-side K (q_vc_K/q_vc_W = 0.3-0.4 M) is set far above epithelial K (24 mM), the reverse of physiology (plasma
  about 4-5 mM, cells about 140 mM); with physiological K it would run backwards. (b) The electrical factor: one pump cycle
  moves net +1 charge out, so with u = psi_in - psi_out = -40 mV the reverse term would normally carry exp(-F u/RT) (= 4.7),
  not exp(+2 F u/RT) (= 0.046). Is this a deliberate simplification (and which sign convention does u_*Epi_e use), or should
  the law be corrected (e.g. to the bond-graph NKE of the Hunter group) before these modules are used?'
- 'Na exchange laws use amount differences, not concentrations: v_gi_Na = kK (q_gi_Na - q_giEpi_Na), v_pt_Na = kK (q_pt_Na
  - q_ptEpi_Na), v_gl_Na = kK (q_vc_Na - q_pt_Na). At steady state this equalises amounts, not concentrations (gut lumen 146
  mM vs epithelium 8 mM because the volumes are 0.028 vs 0.5 L), and glomerular Na filtration is not tied to the filtered
  water (a convective v_gl_W c_vc_Na would be expected). Intended?'
- 'In a network, c_vc_Na = q_vc_Na/q_vc_W divides the whole-circulation Na (BVC_Na_circ) by the volume of the LOCAL capillary
  that supplies osmotic_vol_port (intestinal or peritubular), so the GI and each kidney see different blood Na concentrations
  (source values: 146 mM at the gut, 55 mM at the kidneys for the same q_vc_Na). Should q_vc_W be the circulating (plasma)
  volume instead?'
- 'k_pt_W = 0 (source value): the proximal tubule reabsorbs no water, so the tubular volume just settles at u_pt_W = u_ac_W
  and there is no glomerulotubular water flow at steady state. Intended for this version?'
- 'Accept the harness: peritubular BG capillary (CA ANS_CVS_BVC example values, inertances raised to 1e6, q_0 raised to 8e-5
  m3 so c_vc is about 0.14 M) + BVC_Na_circ, with u_ac_W kept as a BC because the glomerular capillary cannot be added (libcuflynx
  duplicate unit-converter bug)?'
- 'Validation: pending (see the candidate); accept, or point me to data consistent with this parameterisation?'
proposed_fixes:
- 'BVC_Kidney_modules_config.json (both components): ["q_vc_W", "litre", "access", "variable "] -> ["q_vc_W", "litre", "access",
  "boundary_condition"]; add q_vc_W rows (litre, boundary_condition) to BVC_Kidney_parameters.csv. Evidence: tested on a patched
  copy of the library - both components then generate and run standalone for 20 s.'
findings:
- 'Run point: tubular water equilibrates within about 0.1 s to u_pt_W = u_ac_W = 1.835 kPa; the Na loop settles to a steady
  recirculation vc -> tubule -> epithelium -> vc of about 3.7e-3 mol/s per kidney, powered by the fixed K gradient in the
  NKE law (no ATP term).'
- 'Harness network: in the test network the peritubular capillary volume drifts slowly (venous RC time constant about 1200
  s with the CA example venous compliance), so q_vc_W changes by a few % over 20 s; the invariants use the logged peri/q,
  so this does not affect them.'
- 'libcuflynx: two ports needing the same unit conversion (v_gl_W and v_pt_W, both L_per_s -> m3_per_s) produce two components
  named unit_converter_L_per_s_to_m3_per_s; the flattened model is rejected (Myokit: component name must be unique; libcellml:
  v_gl_W missing in the converter). This blocks connecting a kidney to both glomerular and peritubular BG capillaries, i.e.
  the CA ANS_CVS_BVC network as written.'
- 'Joint failure risk (256 samples, each component): P(fail) = 0.04 [0.02, 0.08]; most influential L_pt_W, q_pt_Na_init, q_pt_W_init
  - joint draws with q_pt_W_init close to or above L_pt_W (singular compliance). Single-parameter sweeps all pass.'
