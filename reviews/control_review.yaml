comment: 'Four components do not generate or are mis-wired: efferent_resistance_effector_Ursino (config units Js_per_m3 vs
  CellML Js_per_m6), both respiratory effectors (u_p_resp listed twice; efferent_respiratory_effector also names Delta_P_mus
  in the config but alpha_P_mus in the CellML), and heart_effector_Gee2023_OLD (points at the elastance component instead
  of _INV, so all outputs are 0). efferent_venous_us_volume_and_compliance_effector ignores G_theta_us, and local_flow_control_muscle
  has no way to receive C_O2_p (declared "variable", so it is silently 0). Provenance is shaky: the Magosso/Ursino and Spencer
  papers are paywalled (values checked only against open secondary sources), several "Magosso2001AndUrsino2000"/"gee2023closed"
  values do not match those sources (k_ab, W_cv, W_bs, W_cs, tau_Es, tau_Ev), and "Bizzotto2022" could not be identified.'
summary: 'control: 18 reflex-control components (baro/chemoreceptor afferents, central integration to vagal, sympathetic and
  respiratory efferents, Ursino/Argus/Gee effectors, local metabolic flow control). Every component runs alone with its inputs
  as boundary conditions (no harness needed) and is verified against exact solutions: first-order filter step responses, exact
  algebraic sigmoid/exponential/log maps, clamps and bounds. 64+ tests pass; the 4 defective components are recorded as expected
  failures with evidence from a patched copy of the library (all pass once fixed). Reference proposals for all 160 parameter
  entries (TODO values given placeholder or derived values) and a proposed bib (ursino1998interaction, ursino2000acute, magosso2001mathematical,
  spencer1979computational, albanese2016integrated, gee2023closed, cheng2010integrative, west2008respiratory). Validation is pending (candidate data identified, not obtainable/set
  up) or not_applicable (pure signal blocks).'
questions:
- 'Paywalled primary sources: ursino1998interaction values (P_n, k_a, f_min/max, tau_z/p, f_es,0/inf, k_es, f_es,min, effector G/tau)
  were checked against the open cheng2010integrative table (PMC2965826) and the gee2023closed Simulink model, not the paper itself. magosso2001mathematical/ursino2000acute
  values (AA, BB, K_O2, K_CO2, K_stat, K_dyn, tau_cap, k_CO2_m, g_O2_m/b, C_O2_v*_nom, A-D_b_lc, W_cv, theta_v, f_es_max)
  could not be checked at all. Please confirm them against your copies.'
- 'baroreceptor: P_nom = 12000 Pa (90 mmHg; "modified from 1.25e4") and k_ab = 1610 Pa (12.08 mmHg) vs ursino1998interaction P_n = 92
  mmHg (12266 Pa), k_a = 11.758 mmHg (1567.6 Pa). Keep the modified values (and say why) or revert?'
- 'afferent_to_sympathetic_efferent: W_bs = -1.14, W_cs = 12 are not the Ursino & Magosso 2000 weights (W_b = 1 with a minus
  sign, W_c,sp = 5 / W_c,sh = 1) and there is no offset theta_s, so at f_ab = 25, f_apc = 3.7 f_s = 43 spikes/s. Where do
  -1.14 and 12 come from (calibration?) - mark them unsourced?'
- 'afferent_to_vagal_efferent: W_cv = 0.208 vs 0.2 in Ursino & Magosso 2000 reimplementations - typo or deliberate?'
- 'chemoreceptor: C_CO2_a_nom = 0.36 ml/ml while normal arterial CO2 content with the module''s own Spencer constants is 0.485
  ml/ml, so the resting static drive is non-zero (f_c_stat = 2.85 at the proposed normal inputs). Is 0.36 intended? Which
  paper is the content-based chemoreceptor from (magosso2001mathematical uses PaCO2/PaO2; albanese2016integrated?)'
- 'Spencer constants: k_1 (14.99 mmHg), alpha_1 (0.03198), beta_1 (0.008275) differ from the cheng2010integrative table that also cites
  spencer1979computational (13, 0.02598, 0.012275); k_2, h_1, h_2, alpha_2, beta_2 match. C_O2_sat/C_CO2_sat use 22.72 ml/mmol (not 22.4).
  Please confirm against spencer1979computational. (Other circulatory_autogen files carry beta_2 = 2.4415e-5, a x10 typo.)'
- 'efferent_heart_period_effector: G_Ts = -0.1 s and G_Tv = 0.05 s^2 are "user_defined"; ursino1998interaction has -0.13 and 0.09. Adopt
  the Ursino values or keep and mark unsourced?'
- 'heart_effector_Gee2023: tau_Es = 2 s and tau_Ev = 0.2 s are cited as gee2023closed, but the gee2023closed Simulink model (BioModels
  MODEL2402270001) uses 8 s (sympathetic) and 1.5 s (vagal). Which is intended? G_Es/G_Ev are user values (the Gee gains are
  compliance-domain, 0.103 and 0.2053 ml/mmHg).'
- 'efferent_respiratory_effector: what is "Bizzotto2022"/"Bizotto2022"? No such publication could be found (possible source:
  albanese2016integrated chemoreflex table). Please give the full reference.'
- efferent_respiratory_effector_Gee_Argus_2026 had every value TODO; placeholders were proposed (sibling time constants, 0.01
  s / 0.001 s fractional gains, alpha limits 0.2-3). Provide real values or keep as placeholders?
- 'heart_effector_Gee2023_OLD: delete it, or fix it (module_type -> heart_effector_Gee2023_INV)? If kept, its 1e-7 m6/J states
  need atol <= 1e-12 (with the default atol 1e-8 the exact-solution error is 2-12 %).'
- Resistance / venous effector gains of the Argus variants (G_theta = 1 "R can double", G_theta_us/compliance = 0.3, f_es_mid
  = 10 "to_be_calibrated") are unsourced - OK to leave as placeholders?
proposed_fixes:
- 'efferent_resistance_effector_Ursino (config): Delta_theta and sigma_theta units Js_per_m3 -> Js_per_m6 (match the CellML;
  a resistance is Pa s/m3 = J s/m6). Evidence: libcellml map_variables unit mismatch; patched copy runs, 2/2 invariants, BC
  sweep 22/22 pass.'
- 'efferent_respiratory_effector and efferent_respiratory_effector_Gee_Argus_2026 (config + parameters csv): remove the duplicate
  ["u_p_resp", "Hz", "access", "boundary_condition"] row (and the duplicate csv row). Evidence: libcellml VARIABLE_NAME_UNIQUE;
  patched copy of the Gee_Argus variant runs, 5/5 invariants, BC sweep 100/100 pass.'
- 'efferent_respiratory_effector_type (CellML): rename alpha_P_mus, alpha_P_mus_c/_p, alpha_P_mus_max/_min to Delta_P_mus*
  with units J_per_m3 (as the config, parameters and G_pA/G_cA units Js_per_m3 imply). Evidence: patched copy runs, 2/2 invariants,
  BC sweep 100/100 pass.'
- 'efferent_venous_us_volume_and_compliance_effector_Argus_type (CellML): Delta_theta_us = G_theta_compliance*... -> G_theta_us*sigma_theta_us/(f_es_mid
  + sigma_theta_us). Evidence: BC sweep of G_theta_us leaves Delta_theta_us unchanged (8/37 runs fail the intended law); patched
  copy 37/37 pass.'
- 'heart_effector_Gee2023_OLD (config): module_type heart_effector_Gee2023 -> heart_effector_Gee2023_INV, and in the CellML
  heart_effector_Gee2023_INV inv_sigma_Es units J_per_m6 -> m6_per_J. Evidence: unpatched, myokit reports "No value set" for
  every inv_* variable and outputs are 0; patched copy passes the INV exact solution (with atol 1e-12).'
- 'local_flow_control_muscle (config): C_O2_p kind "variable" -> "boundary_condition" (as in local_flow_control_brain), or
  add an entrance port carrying it. Evidence: myokit "No value set for C_O2_p" (it is used as 0); patched copy with C_O2_p
  = 0.155 runs and passes 5/5 invariants.'
- 'control_parameters.csv: beta_2 is correct here (2.44e-4 /Pa); note for other libraries that 2.4415e-5 is wrong.'
findings:
- Every component is verified against an exact solution; no harness networks were needed because all inputs are boundary conditions
  in the configs.
- 'local_flow_control_muscle: R_local_multiplier = (1 + x_CO2)/(1 - g_O2_m x_O2) is singular (then negative) once C_O2_p -
  C_O2_vm_nom >= 1/g_O2_m = 0.033 ml/ml, i.e. C_O2_p >= 0.188 ml/ml - near arterial content. Similar for the brain (G_p <=
  0 when x_O2 >= (1 + x_CO2)/g_O2_b). Sweep ranges are restricted accordingly.'
- 'afferent_to_respiratory_efferent and local_flow_control_*: P_O2_a is an input that no equation uses.'
- 'chemoreceptor: tau_CO2_cc_dyn is a dimensionless gain (600), not a time constant, despite its name.'
- 'gee2023closed values were read from the authors'' Simulink model (BioModels MODEL2402270001): heart-period taus 2 s / 1.5 s and
  G_Ts = -0.13 match ursino1998interaction; contractility taus are 8 s / 1.5 s; RV scale 1/0.5903.'
- 'Stability: every generating component works with CVODE rtol 1e-6 / atol 1e-8 except the OLD compliance-form effector, whose
  1e-7-scale states need atol <= 1e-12.'
- 'Structure-test warnings (22) checked: the Js_per_m3/Js_per_m6 mismatch (Ursino resistance), the duplicate u_p_resp, the
  Delta_P_mus* names missing from the CellML and the inv_* names missing from heart_effector_Gee2023 are the real defects
  listed in proposed_fixes. The Hz (config) vs per_s (CellML) mismatches for u_c_resp/u_p_resp and f_es_min are dimensionally
  equivalent and harmless (those components that otherwise generate run fine); harmonising the unit names is cosmetic.'
- 'Failure risk (256 joint samples): 0 for 12 components; 1.0 for the four that do not generate and for none else except efferent_venous_us_volume_and_compliance_effector
  (0.95, the G_theta_us bug trips the intended-law invariant almost everywhere) and local_flow_control_brain (0.023: G_p <=
  0 when C_O2_p is high and C_O2_vb_nom low at the same time).'
