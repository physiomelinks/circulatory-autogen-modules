name: Install libcuflynx and the test package
description: System libraries libcuflynx needs, then requirements.txt (libcuflynx + cam_testing)
runs:
  using: composite
  steps:
    - shell: bash
      # apt can hang on a slow mirror (a whole 30 min job once); give each try 5 min, three tries
      run: |
        for i in 1 2 3; do
          timeout 300 sudo apt-get update -qq && \
            timeout 600 sudo apt-get install -y -qq libopenmpi-dev openmpi-bin libsundials-dev build-essential && break
          echo "::warning::apt try $i failed or timed out; retrying"
          [ $i = 3 ] && exit 1
          sleep 10
        done
    - shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
