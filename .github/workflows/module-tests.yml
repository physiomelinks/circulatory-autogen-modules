name: Module tests & reports

on:
  push:
  pull_request:
  schedule:
    - cron: '0 14 * * 1'   # weekly, to catch libcuflynx changes
  workflow_dispatch:
    inputs:
      risk:
        description: 'Also run the joint failure-risk analysis (make risk) for reviewed versions'
        type: boolean
        default: false

env:
  # PhLynx checkout for the pipeline tests: the branch of physiomelinks/PhLynx#595 (list-form
  # multi_port, case-insensitive multi_port) until it's merged; then main or a tag.
  PHLYNX_REF: feat/load-module-library-configs

concurrency:
  group: module-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      categories: ${{ steps.list.outputs.categories }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        # one job per top-level directory of modules/ that holds module_types (a versions/ directory
        # somewhere below it): a category (cell, vessels, ...), or a module_type directly under
        # modules/ with the module_types nested in it (heart: MODULE=heart selects heart, cardiac_clock,
        # chamber and valve). Not one per module_type.
        run: |
          categories=$(python3 -c "import glob, json, os; print(json.dumps(sorted({p.split(os.sep)[1] for p in glob.glob('modules/*/**/versions', recursive=True)})))")
          echo "categories=$categories" >> "$GITHUB_OUTPUT"

  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip }
      - uses: ./.github/actions/setup
      - run: make structure PYTHON=python

  # The coupled examples (system_models/coupled): generated C++ coupled to the FEniCS model
  # tissue_diffusion_FEniCS. FEniCSx is a conda-forge package, and the generated model's shared
  # library is loaded into that Python, so it is built with the environment's compiler and SUNDIALS.
  coupled:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v1
        with:
          environment-name: fenicsx
          create-args: >-
            -c conda-forge python=3.11 fenics-dolfinx=0.9 cmake cxx-compiler sundials nlohmann_json pip
          cache-environment: true
      - run: pip install -r requirements.txt
      - run: python -c "import dolfinx, libcuflynx.coupling; print('dolfinx', dolfinx.__version__)" && cmake --version
      - run: make structure PYTHON=python
      - run: make coupled PYTHON=python
      # the coupled_validation_test results and heatmaps of the versions the coupled system models
      # use, for the site (named category-* so the site job merges it with the category reports)
      - name: Stage coupled validation files
        if: always()
        run: |
          mkdir -p _artifact
          find modules \( -path '*/results/coupled_validation_test.json' -o -path '*/plots/coupled_*.png' \) -print \
            | xargs -r -I{} cp --parents {} _artifact/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: category-coupled-validation
          path: _artifact/
          if-no-files-found: ignore

  category:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        category: ${{ fromJSON(needs.discover.outputs.categories) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip }
      - uses: ./.github/actions/setup
      - name: Structural checks (results feed the report)
        run: python -m pytest tests/test_structure.py -k test_version_structure -q || true
      - name: V&V tests
        id: tests
        run: |
          target=test
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.ref }}" = "refs/heads/main" ]; then target=test-all; fi
          if make $target PYTHON=python MODULE=${{ matrix.category }} PYTEST_ARGS="--quick-unreviewed --junitxml=junit-tests.xml"; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: PhLynx checkout (pipeline tests)
        uses: actions/checkout@v4
        with: { repository: physiomelinks/PhLynx, ref: '${{ env.PHLYNX_REF }}', path: _phlynx }
      - name: CUFLynx (latest Ubuntu release) and pipeline dependencies
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          corepack enable
          (cd _phlynx && yarn install --immutable)
          make pipeline-setup
          gh release download --repo physiomelinks/CUFLynx --pattern 'CUFLynx-linux-x86_64' --dir _cuflynx
          chmod +x _cuflynx/CUFLynx-linux-x86_64
          gh release view --repo physiomelinks/CUFLynx --json tagName --jq .tagName
      - name: PhLynx -> CUFLynx pipeline
        id: pipeline
        run: |
          if make pipeline PYTHON=python MODULE=${{ matrix.category }} PYTEST_ARGS="--quick-unreviewed --junitxml=junit-pipeline.xml" PHLYNX_DIR=$PWD/_phlynx CUFLYNX_BIN=$PWD/_cuflynx/CUFLynx-linux-x86_64; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - name: CUFLynx archive per instance (built from the library's files, then loaded and run in CUFLynx)
        id: omex
        run: |
          make omex PYTHON=python MODULE=${{ matrix.category }} || true
          if make omex-test PYTHON=python MODULE=${{ matrix.category }} PYTEST_ARGS="--quick-unreviewed --junitxml=junit-omex.xml" CUFLYNX_BIN=$PWD/_cuflynx/CUFLynx-linux-x86_64; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - name: Failure-risk analysis (on request, reviewed versions)
        if: github.event_name == 'workflow_dispatch' && inputs.risk
        run: make risk PYTHON=python MODULE=${{ matrix.category }} RISK_ARGS=--reviewed-only
      - name: Report
        if: always()
        run: make report PYTHON=python MODULE=${{ matrix.category }}
      - name: Stage report files
        if: always()
        run: |
          mkdir -p _artifact
          find modules/${{ matrix.category }} \( -type d \( -name plots -o -name results \) -o -type f \( -name '*.html' -o -name '*.omex' \) \) -prune -print \
            | xargs -r -I{} cp -r --parents {} _artifact/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: category-${{ matrix.category }}
          path: _artifact/
          if-no-files-found: ignore
      - name: Fail if a reviewed version's tests failed
        if: steps.tests.outputs.ok == 'false' || steps.pipeline.outputs.ok == 'false' || steps.omex.outputs.ok == 'false'
        run: python tools/ci_reviewed_failures.py junit-tests.xml junit-pipeline.xml

  site:
    needs: [category, coupled]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip }
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          pattern: category-*
          path: .
          merge-multiple: true
      - run: make site PYTHON=python
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }

  deploy:
    needs: site
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
