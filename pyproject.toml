[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cam-testing"
version = "0.1.0"
description = "Verification, validation and reports for the circulatory-autogen-modules library"
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
    "jinja2",
    "matplotlib",
    "numpy",
    "pytest",
    "jsonschema>=4.18",  # module arrays and module configs against libcuflynx's JSON Schemas
]

[tool.setuptools]
packages = ["cam_testing"]

[tool.setuptools.package-data]
cam_testing = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The standard tests keep the names run_test, verification_test_BC, ... rather than test_*.
python_functions = ["test_*", "run_test", "*_test_*", "stability_test", "system_*_test", "supermodule_*_test",
                    "phlynx_*_test", "cuflynx_*_test"]
markers = [
    "slow: long-running (calibration)",
    "module_vv: per-version verification and per-instance validation tests",
    "system_model: system-model tests (system_models/) and supermodule reproduces tests",
    "phlynx_pipeline: PhLynx -> .omex -> CUFLynx per-version tests (need node, PhLynx and CUFLynx)",
]
filterwarnings = ["ignore::DeprecationWarning"]
